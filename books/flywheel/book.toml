[book]
title = "Flywheel design"
description = "The design book for the flywheel: the work-loop machinery that turns an operator's intent into built software. Part I includes the numbered requirements from their source; Part II explains the loop, design and construction, the book and the context map, the page, instances and hosts, the state store contract and the control plane; Part III includes the surfaces; Part IV points at the roadmap, the models and the proposals."
authors = ["Chuck Swanberg <cswanberg@willdan.com>"]
language = "en"
src = "src"

[output.html]
site-url = "/willdan-blueprints/flywheel/"
default-theme = "ayu"
preferred-dark-theme = "ayu"
no-section-label = false
fold.enable = true
fold.level = 1
additional-js = ["mermaid.min.js", "mermaid-init.js", "suite-nav.js", "book-grab.js"]

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
