[book]
title = "millpond design"
description = "The design book for millpond: the inbox for events outside a repository that should change its work. Adapters hand it captures; it keeps each once, turns captures into signals, serves the tools a curation session moves them with, and passes the items curation joins to one worktree or to crew's plan."
authors = ["Chuck Swanberg <cswanberg@mad-swan.com>"]
language = "en"
src = "src"

[output.html]
site-url = "/blueprints/millpond/"
default-theme = "ayu"
preferred-dark-theme = "ayu"
no-section-label = false
fold.enable = true
fold.level = 1
additional-css = ["figures.css"]
