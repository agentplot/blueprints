[book]
title = "pinout design"
description = "The design book for pinout: one way to ask any repository what is in it, what a change affects, how a part is run and what it reads, whichever monorepo tool it uses. Part I includes the statement of invariants from design/pinout/requirements.md."
authors = ["Chuck Swanberg <cswanberg@mad-swan.com>"]
language = "en"
src = "src"

[output.html]
site-url = "/blueprints/pinout/"
default-theme = "ayu"
preferred-dark-theme = "ayu"
no-section-label = false
fold.enable = true
fold.level = 1
