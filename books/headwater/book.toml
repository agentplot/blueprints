[book]
title = "headwater design"
description = "The design book for headwater: it tells a repository which releases of what it depends on are newer than what it runs, with the words upstream wrote for each, and never changes the repository. The appendix includes the statement of invariants from design/headwater/requirements.md."
authors = ["Chuck Swanberg <cswanberg@mad-swan.com>"]
language = "en"
src = "src"

[output.html]
site-url = "/blueprints/headwater/"
default-theme = "ayu"
preferred-dark-theme = "ayu"
no-section-label = false
fold.enable = true
fold.level = 1
additional-css = ["headwater.css"]
