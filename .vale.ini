# The voice of the design books and the design documents, checked. The
# rules are styles/Blueprints; books/VOICE.md says what they enforce and
# why. Run `prose` from the devenv shell, or `vale design books`.
StylesPath = styles
Vocab = Blueprints
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Vale, Blueprints
# mdBook include directives and clause anchors are not prose.
TokenIgnores = ({{#include[^}]*}}), (<!-- ANCHOR[^>]*-->)
# Spelling waits for the vocabulary to grow past the glossaries.
Vale.Spelling = NO
# A model or a proposal weighs designs, so it narrates; a chapter never does.
Blueprints.MetaNarration = NO
Blueprints.Headings = NO

[books/**/*.md]
Blueprints.MetaNarration = YES
Blueprints.Headings = YES
