<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1000" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a86"/></marker>
    <marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a7fb5"/></marker>
    <marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e5b"/></marker>
    <marker id="mP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b5cb8"/></marker>
    <marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9962e"/></marker>
    <marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c05b5b"/></marker>
    <marker id="mT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b8a8a"/></marker>
    <g id="repo"> <rect x="-26" y="-18" width="52" height="36" rx="7" fill="#fff" stroke="currentColor" stroke-width="2"/> <circle cx="-9" cy="8" r="3.2" fill="currentColor"/> <circle cx="9" cy="-8" r="3.2" fill="currentColor"/> <path d="M -9 8 v-8 a 8 8 0 0 1 8 -8 h 1" fill="none" stroke="currentColor" stroke-width="2"/> </g>
    <g id="cube" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"> <path d="M -16 -8 L 0 -17 L 16 -8 L 16 10 L 0 19 L -16 10 Z" fill="#fff"/> <path d="M -16 -8 L 0 1 L 16 -8 M 0 1 L 0 19" fill="none"/> </g>
    <g id="row" stroke="currentColor" stroke-width="1.6" fill="none"><rect x="-8" y="-6" width="16" height="12" rx="2"/><line x1="-4" y1="-1" x2="4" y2="-1"/><line x1="-4" y1="3" x2="1" y2="3"/></g>
    <g id="marker"> <circle r="7" fill="#fff" stroke="currentColor" stroke-width="2.2"/> <circle r="2.6" fill="currentColor"/> </g>
    <g id="pause"> <circle r="9" fill="#fff" stroke="#c9962e" stroke-width="2"/> <line x1="-2.8" y1="-4" x2="-2.8" y2="4" stroke="#c9962e" stroke-width="2.4" stroke-linecap="round"/> <line x1="2.8" y1="-4" x2="2.8" y2="4" stroke="#c9962e" stroke-width="2.4" stroke-linecap="round"/> </g>
    <g id="check" fill="none" stroke="#2e9e5b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"> <path d="M -6 0 L -2 4 L 6 -5"/> </g>
    <g id="cross"> <circle r="10" fill="#fbeeee" stroke="#c05b5b" stroke-width="2"/> <path d="M -4 -4 l 8 8 M 4 -4 l -8 8" fill="none" stroke="#a34848" stroke-width="2.5"/> </g>
    <g id="clock"> <circle r="9" fill="#fff" stroke="#c9962e" stroke-width="2"/> <path d="M 0 -5 V 0 H 4" fill="none" stroke="#c9962e" stroke-width="2.2" stroke-linecap="round"/> </g>
    <g id="gate" stroke="#c05b5b" stroke-width="3" stroke-linecap="round"> <line x1="-8" y1="-11" x2="-8" y2="11"/><line x1="8" y1="-11" x2="8" y2="11"/><line x1="-8" y1="-3" x2="8" y2="-3"/> </g>
    <g id="lock" stroke="#c05b5b" stroke-width="1.8" fill="none"> <rect x="-6" y="-2" width="12" height="10" rx="2" fill="#fbeaea"/> <path d="M -4 -2 v-4 a 4 4 0 0 1 8 0 v4"/> </g>
  </defs>
  <rect width="1680" height="1000" fill="#fff"/>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">The session — the one free state, entered by evidence and left by three verbs</text>
  <text x="40" y="57" font-size="12" fill="#666">a machine asks · herdr proves the pane · the agent reasons · the exit record is the only thing that comes back</text>

  <!-- ===================== A MACHINE ASKS ===================== -->
  <rect x="40" y="100" width="300" height="330" rx="10" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.4"/>
  <text x="58" y="126" font-size="11.5" font-weight="700" fill="#333">A MACHINE ASKS</text>
  <text x="58" y="142" font-size="8.5" fill="#999">one live session per object, at most</text>
  <use href="#row" x="84" y="185" color="#7b5cb8"/>
  <text x="108" y="181" font-size="10.5" font-weight="700" fill="#333">elaboration · work item</text>
  <text x="108" y="195" font-size="8.5" fill="#999">chore · unit · ledger cell</text>
  <use href="#cube" x="84" y="252" color="#2e9e5b"/>
  <text x="112" y="248" font-size="10.5" font-weight="700" fill="#333">work_order.md</text>
  <text x="112" y="262" font-size="8.5" fill="#999">job · place · goal · exits</text>
  <use href="#lock" x="84" y="318"/>
  <text x="108" y="314" font-size="10.5" font-weight="700" fill="#333">lease first</text>
  <text x="108" y="328" font-size="8.5" fill="#999">git push is the CAS</text>
  <use href="#cube" x="84" y="384" color="#2b8a8a"/>
  <text x="112" y="380" font-size="10.5" font-weight="700" fill="#1f6e6e">claim text · ledger read</text>
  <text x="112" y="394" font-size="8.5" fill="#999">quoted into the order</text>
  <path d="M 56 366 L 56 274" fill="none" stroke="#2b8a8a" stroke-width="1.8" stroke-dasharray="2 5" marker-end="url(#mT)"/>

  <!-- ===================== THE LANE ===================== -->
  <line x1="392" y1="250" x2="1000" y2="250" stroke="#2e9e5b" stroke-width="2" opacity="0.3"/>
  <use href="#marker" x="400" y="250" color="#2e9e5b" data-fwn-state="session.requested"/>
  <text x="400" y="288" font-size="10" fill="#555" text-anchor="middle">requested</text>
  <text x="400" y="301" font-size="8.5" fill="#999" text-anchor="middle">order written</text>
  <use href="#clock" x="560" y="250" data-fwn-state="session.launching"/>
  <text x="560" y="288" font-size="10" fill="#555" text-anchor="middle">launching</text>
  <text x="560" y="301" font-size="8.5" fill="#999" text-anchor="middle">slow is not failed</text>
  <path d="M 546 236 C 528 198, 592 198, 574 236" fill="none" stroke="#2e9e5b" stroke-width="1.8" marker-end="url(#mG)"/>
  <text x="560" y="192" font-size="8.5" fill="#999" text-anchor="middle">retry every 90 s while no pane carries the id</text>
  <path d="M 416 250 L 540 250" fill="none" stroke="#2e9e5b" stroke-width="2.2" marker-end="url(#mG)"/>
  <path d="M 580 250 L 706 250" fill="none" stroke="#2e9e5b" stroke-width="2.2" marker-end="url(#mG)"/>
  <text x="643" y="242" font-size="9" fill="#27824c" text-anchor="middle">pane observed</text>
  <circle cx="760" cy="250" r="48" fill="#e9f6ee" stroke="#2e9e5b" stroke-width="2.6"/>
  <text x="760" y="246" font-size="11.5" font-weight="700" fill="#27824c" text-anchor="middle">WORKING</text>
  <text x="760" y="263" font-size="8.5" fill="#27824c" text-anchor="middle">free reasoning</text>
  <text x="760" y="180" font-size="9.5" fill="#666" text-anchor="middle">the one unconstrained state in the model</text>
  <path d="M 810 250 L 944 250" fill="none" stroke="#2e9e5b" stroke-width="2.2" marker-end="url(#mG)"/>
  <use href="#pause" x="960" y="250" data-fwn-state="session.idle"/>
  <text x="960" y="288" font-size="10" fill="#555" text-anchor="middle">idle</text>
  <text x="960" y="301" font-size="8.5" fill="#999" text-anchor="middle">queued messages land here</text>
  <path d="M 946 266 C 900 300, 840 300, 800 278" fill="none" stroke="#2e9e5b" stroke-width="1.8" marker-end="url(#mG)"/>
  <use href="#pause" x="960" y="160" data-fwn-state="session.kept"/>
  <text x="984" y="156" font-size="10.5" font-weight="700" fill="#a97e26">kept</text>
  <text x="984" y="170" font-size="8.5" fill="#999">standing types only</text>
  <path d="M 960 232 L 960 178" fill="none" stroke="#c9962e" stroke-width="2" marker-end="url(#mA)"/>
  <rect x="856" y="106" width="152" height="20" rx="4" fill="#fbeeee" stroke="#c05b5b"/>
  <text x="868" y="120" font-size="8.5" font-weight="700" fill="#a34848">+row finish or keep</text>
  <path d="M 946 128 L 954 146" fill="none" stroke="#c05b5b" stroke-width="1.6" marker-end="url(#mR)"/>

  <!-- ===================== EXITS ===================== -->
  <rect x="1160" y="100" width="480" height="350" rx="10" fill="#fafafa" stroke="#8a8a86" stroke-width="1.4"/>
  <text x="1178" y="126" font-size="11.5" font-weight="700" fill="#333">EXITS — the fixed alphabet</text>
  <rect x="1180" y="140" width="440" height="82" rx="8" fill="#fff" stroke="#2e9e5b" stroke-width="1.6"/>
  <text x="1196" y="164" font-size="11" font-weight="700" fill="#333">done</text>
  <text x="1196" y="182" font-size="9.5" font-family="monospace" fill="#666">deliverable present</text>
  <text x="1196" y="200" font-size="9" font-weight="700" fill="#1f6e6e">a verdict session writes ledger/switchboard.rec</text>
  <use href="#check" x="1546" y="176"/>
  <use href="#cube" x="1586" y="176" color="#2b8a8a"/>
  <rect x="1180" y="238" width="440" height="72" rx="8" fill="#fff" stroke="#c05b5b" stroke-width="1.6"/>
  <text x="1196" y="262" font-size="11" font-weight="700" fill="#333">question</text>
  <text x="1196" y="280" font-size="9.5" font-family="monospace" fill="#666">answer queued until idle</text>
  <text x="1196" y="298" font-size="9" font-weight="700" fill="#a34848">+row on the page · −row on the answer</text>
  <use href="#gate" x="1580" y="274"/>
  <rect x="1180" y="326" width="440" height="72" rx="8" fill="#fff" stroke="#8a8a86" stroke-width="1.6"/>
  <text x="1196" y="350" font-size="11" font-weight="700" fill="#333">stalled</text>
  <text x="1196" y="368" font-size="9.5" font-family="monospace" fill="#666">45 m idle · no exit record</text>
  <text x="1196" y="386" font-size="9" font-weight="700" fill="#5f6b7a">to ops chat, never filed as work</text>
  <use href="#cross" x="1580" y="362"/>
  <text x="1178" y="430" font-size="9.5" fill="#666">all three end at reaped — pane, worktree and lease released</text>
  <path d="M 982 234 C 1060 200, 1100 190, 1172 180" fill="none" stroke="#2e9e5b" stroke-width="2.2" marker-end="url(#mG)"/>
  <path d="M 984 252 C 1060 258, 1100 264, 1172 272" fill="none" stroke="#c05b5b" stroke-width="2.2" marker-end="url(#mR)"/>
  <path d="M 982 268 C 1060 306, 1100 336, 1172 360" fill="none" stroke="#8a8a86" stroke-width="2.2" marker-end="url(#mN)"/>
  <text x="1082" y="230" font-size="9" fill="#27824c" text-anchor="middle">exit.json parses</text>

  <!-- ===================== HOSTS AND LEASES ===================== -->
  <rect x="40" y="490" width="600" height="370" rx="10" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.4"/>
  <text x="58" y="516" font-size="11.5" font-weight="700" fill="#333">HOSTS AND LEASES</text>
  <text x="196" y="516" font-size="9.5" fill="#999">at most one owner, always visible</text>
  <use href="#repo" x="110" y="575" color="#8a8a86"/>
  <text x="148" y="571" font-size="10.5" font-weight="700" fill="#333">flywheel-state</text>
  <text x="148" y="585" font-size="8.5" fill="#999">leases.rec · hosts.rec · one push wins</text>
  <line x1="110" y1="700" x2="540" y2="700" stroke="#8a8a86" stroke-width="2" opacity="0.35"/>
  <use href="#check" x="110" y="700" data-fwn-state="lease.held"/>
  <text x="110" y="732" font-size="10" fill="#555" text-anchor="middle">held</text>
  <text x="110" y="745" font-size="8.5" fill="#999" text-anchor="middle">heartbeat 60 s</text>
  <use href="#clock" x="250" y="700" data-fwn-state="lease.stale"/>
  <text x="250" y="732" font-size="10" fill="#555" text-anchor="middle">stale</text>
  <text x="250" y="745" font-size="8.5" fill="#999" text-anchor="middle">10 m silent</text>
  <use href="#pause" x="400" y="700" data-fwn-state="lease.reclaimable"/>
  <text x="400" y="732" font-size="10" fill="#555" text-anchor="middle">reclaimable</text>
  <text x="400" y="745" font-size="8.5" fill="#999" text-anchor="middle">30 m · no pane anywhere</text>
  <use href="#marker" x="540" y="700" color="#8a8a86" data-fwn-transition="k.steal"/>
  <text x="540" y="732" font-size="10" fill="#555" text-anchor="middle">taken</text>
  <text x="540" y="745" font-size="8.5" fill="#999" text-anchor="middle">new session id</text>
  <rect x="176" y="630" width="164" height="20" rx="4" fill="#fbeeee" stroke="#c05b5b"/>
  <text x="188" y="644" font-size="8.5" font-weight="700" fill="#a34848">+row take over or wait</text>
  <path d="M 252 652 L 252 682" fill="none" stroke="#c05b5b" stroke-width="1.6" marker-end="url(#mR)"/>
  <text x="58" y="800" font-size="9.5" font-weight="600" fill="#5f6b7a">an object with a live session is taken only by the word — never by racing</text>
  <text x="58" y="820" font-size="8.5" fill="#999">the new id makes the old agent stand down at its first write</text>

  <!-- ===================== OFFERS ===================== -->
  <rect x="700" y="490" width="940" height="370" rx="10" fill="#e9f6ee" stroke="#2e9e5b" stroke-width="1.6"/>
  <text x="718" y="516" font-size="11.5" font-weight="700" fill="#27824c">OFFERS — non-terminal</text>
  <text x="900" y="516" font-size="9.5" fill="#999">emitted while working · the session is never told</text>
  <path d="M 762 300 C 772 400, 782 470, 788 546" fill="none" stroke="#2e9e5b" stroke-width="2.2" marker-end="url(#mG)"/>
  <use href="#cube" x="790" y="576" color="#2e9e5b"/>
  <text x="820" y="572" font-size="10.5" font-weight="700" fill="#333">offers.jsonl</text>
  <text x="820" y="586" font-size="8.5" fill="#999">one appended line</text>
  <path d="M 812 604 C 860 640, 880 660, 916 668" fill="none" stroke="#7b5cb8" stroke-width="2" marker-end="url(#mP)"/>
  <path d="M 806 606 C 830 700, 860 750, 916 762" fill="none" stroke="#4a7fb5" stroke-width="2" marker-end="url(#mB)"/>
  <use href="#row" x="940" y="668" color="#7b5cb8" data-fwn-state="finding.offered"/>
  <text x="966" y="664" font-size="10.5" font-weight="700" fill="#333">finding</text>
  <text x="966" y="678" font-size="8.5" fill="#999">an idea outside the job</text>
  <use href="#row" x="940" y="762" color="#4a7fb5" data-fwn-state="chore.offered"/>
  <text x="966" y="758" font-size="10.5" font-weight="700" fill="#333">chore</text>
  <text x="966" y="772" font-size="8.5" fill="#999">a fix across a boundary</text>
  <rect x="1230" y="656" width="196" height="20" rx="4" fill="#fbeeee" stroke="#c05b5b"/>
  <text x="1242" y="670" font-size="8.5" font-weight="700" fill="#a34848">+row pursue or drop</text>
  <rect x="1230" y="750" width="196" height="20" rx="4" fill="#fbeeee" stroke="#c05b5b"/>
  <text x="1242" y="764" font-size="8.5" font-weight="700" fill="#a34848">+row accept or reject</text>
  <path d="M 1128 666 L 1222 666" fill="none" stroke="#c05b5b" stroke-width="1.6" marker-end="url(#mR)"/>
  <path d="M 1120 760 L 1222 760" fill="none" stroke="#c05b5b" stroke-width="1.6" marker-end="url(#mR)"/>
  <text x="1460" y="670" font-size="9" fill="#666">a proposal, not work</text>
  <text x="1460" y="764" font-size="9" fill="#666">no bolt, no unit, no stages</text>
  <text x="718" y="828" font-size="9.5" font-weight="600" fill="#27824c">an offer opens an issue on the next pass — the retracting word is the operator's, not the session's</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="40" y="890" width="1600" height="90" rx="10" fill="#fafafa" stroke="#d5d5d0"/>
  <g font-size="10.5" fill="#555">
    <use href="#marker" x="80" y="924" color="#8a8a86"/><text x="96" y="928">a state</text>
    <use href="#clock" x="200" y="924"/><text x="218" y="928">waiting on time</text>
    <use href="#pause" x="360" y="924"/><text x="378" y="928">held</text>
    <use href="#check" x="470" y="924"/><text x="486" y="928">done</text>
    <use href="#gate" x="570" y="924"/><text x="588" y="928">blocked</text>
    <use href="#cross" x="700" y="924"/><text x="718" y="928">retired</text>
    <use href="#cube" x="820" y="924" color="#8a8a86"/><text x="844" y="928">record on disk</text>
    <use href="#row" x="990" y="924" color="#8a8a86"/><text x="1008" y="928">object</text>
    <use href="#lock" x="1100" y="924"/><text x="1116" y="928">lease</text>
    <use href="#repo" x="1220" y="924" color="#8a8a86"/><text x="1252" y="928">git branch</text>
  </g>
  <g font-size="10.5" fill="#555">
    <line x1="80" y1="962" x2="116" y2="962" stroke="#2e9e5b" stroke-width="3"/><text x="124" y="966">session path</text>
    <line x1="250" y1="962" x2="286" y2="962" stroke="#c05b5b" stroke-width="3"/><text x="294" y="966">word and rows</text>
    <line x1="430" y1="962" x2="466" y2="962" stroke="#2b8a8a" stroke-width="2" stroke-dasharray="2 5"/><text x="474" y="966">ledger read</text>
    <line x1="600" y1="962" x2="636" y2="962" stroke="#8a8a86" stroke-width="3"/><text x="644" y="966">hosts</text>
    <text x="760" y="966" font-weight="600" fill="#333">the machinery judges a start by evidence, never by the return of the command that made it</text>
  </g>
</svg>
