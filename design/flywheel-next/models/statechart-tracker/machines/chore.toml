# chore.toml — a small fix a session judged necessary but could not do
# itself, because it lies across a repository or branch boundary
# (requirement 26). Accepted chores are done by one agent, scoped to the
# right place, and merged there. No unit, no bolt, no stages.
#
# `fwn check` asserts that no effect in this file is open_issue:unit,
# open_issue:bolt or land_milestone. That is invariant I8, enforced
# statically rather than by discipline.

schema = 1
machine = "chore"
clock = "reconciled"
carrier = "github.issue"
truth = "github.issue.labels on the chore issue"
projections = ["projects.field.Status / .Host / .Repo"]
scope = "label fwn AND label fwn:chore"
forbidden_effects = ["open_issue:unit", "open_issue:bolt", "land_milestone", "milestone_set"]

[[states]]
name = "offered"
kind = "waiting_operator"
truth = "label fw:offered"
board = "Proposed"
note = "carries repo, branch and the one-line fix; housekeeping like stale instruction files lands here (requirement 28)"

[[states]]
name = "accepted"
kind = "waiting_machine"
truth = "label fw:accepted"
board = "Ready"

[[states]]
name = "running"
kind = "waiting_session"
truth = "label fw:running AND a live session id on the issue"
board = "Running"
note = "one fwn-chore-session on a worktree of <repo> at branch fwn/chore-<n>"

[[states]]
name = "merged"
kind = "terminal"
truth = "the chore branch is an ancestor of <repo>'s default branch"
board = "Done"

[[states]]
name = "rejected"
kind = "terminal"
truth = "issue CLOSED as not_planned"
board = "Dropped"

# ------------------------------------------------------------------------
[[transitions]]
id = "c.offer"
from = "none"
to = "offered"
on = "reconcile"
guard.all = ["offer_record_present:chore", "issue_absent_for_offer"]
effect = ["open_issue:chore:offer_template"]
reason = "a session offered a chore while it kept working (requirement 25)"

[[transitions]]
id = "c.accept"
from = "offered"
to = "accepted"
on = "word"
word = "accept"
effect = ["set_label:fw:accepted", "project_status:Ready"]
reason = "operator accepted the chore with one word (scenario S3)"

[[transitions]]
id = "c.reject"
from = "offered"
to = "rejected"
on = "word"
word = "reject"
effect = ["close_issue:not_planned"]

[[transitions]]
id = "c.start"
from = "accepted"
to = "running"
on = "reconcile"
guard.all = ["lease_mine", "no_live_session"]
effect = [
  "lease_acquire",
  "worktree_add:<repo>:fwn/chore-<n>",
  "request_session:fwn-chore-session:fix",
  "set_label:fw:running",
]
reason = "an accepted chore with no live session gets one, scoped to its repo and branch (requirement 27)"

[[transitions]]
id = "c.merge"
from = "running"
to = "merged"
on = "reconcile"
guard.all = ["state:session:exited", "exit_verb:done", "gates_green:<repo>"]
effect = ["merge_branch:<repo>:default", "retire_session", "lease_release", "close_issue:completed"]
reason = "the fix passed the repo's own merge gates and is merged where it belongs"
note = "no bolt was created and no stages were run (invariant I8)"

[[transitions]]
id = "c.block"
from = "running"
to = "offered"
on = "reconcile"
guard.all = ["state:session:exited", "exit_verb:question"]
effect = ["set_label:fw:offered", "clear_label:fw:running", "retire_session"]
reason = "a chore that needs judgment stops being a chore and goes back to the operator"

# ------------------------------------------------------------------------
[[rows]]
id = "row.chore.offered"
kind = "chore"
when.all = ["state:chore:offered"]
until.any = ["word:accept", "word:reject"]
answers = ["accept", "reject"]
surface = "chat"
group = "offers"
body = "chore in {repo}: {summary} — accept?"
note = "one word from the phone is enough; nothing about a chore needs the page (requirement 2)"
