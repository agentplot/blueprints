# lease.toml — which host owns which object. One lease per object, at
# most one owner, visible in the status view (requirement 59, invariant
# I11).
#
# The truth store is a file on an orphan branch of the blueprints repo, and
# the acquire is a `git push` of that branch. A non-fast-forward push is
# rejected by the server, which makes the push an atomic
# compare-and-swap. Two hosts pushing at the same instant produce one
# winner and one rejection; the loser refetches and sees the owner. That
# is why there is no race, and why no new service is needed.

schema = 1
machine = "lease"
clock = "reconciled"
carrier = "rec.record"
truth = "blueprints repo, branch flywheel-state: leases.rec (one record per object) and hosts.rec (one per host)"
projections = ["projects.field.Host and .Host Seen on every object issue"]
scope = "object ids all carry the fwn- prefix"

[timings]
heartbeat = "60s"
stale_after = "10m"
auto_takeover_after = "30m"
auto_takeover_requires = "no live session for the object"

[[states]]
name = "free"
kind = "waiting_machine"
truth = "no record for the object in leases.rec"

[[states]]
name = "held"
kind = "work"
truth = "record with host = <h> and seen within stale_after"
note = "only host <h> may run any effect on this object"

[[states]]
name = "stale"
kind = "waiting_operator"
truth = "record with host = <h> and seen older than stale_after"
note = "the status view shows the object and its host as stale; no other host touches it (scenario S13)"

[[states]]
name = "reclaimable"
kind = "waiting_machine"
truth = "stale past auto_takeover_after AND no pane anywhere carries the object's session id"

# ------------------------------------------------------------------------
[[transitions]]
id = "k.acquire"
from = "free"
to = "held"
on = "reconcile"
guard.all = ["object_needs_action"]
effect = ["rec_insert:leases.rec", "git_push:flywheel-state"]
reason = "this host is about to act on the object, so it takes the lease first"
evidence = "the push succeeded; a rejected push means another host won and this host re-reads"

[[transitions]]
id = "k.heartbeat"
from = "held"
to = "held"
on = "timer"
guard.all = ["lease_mine", "elapsed:60s"]
effect = ["rec_set:seen=<now>", "git_push:flywheel-state", "project_field:Host Seen=<now>"]

[[transitions]]
id = "k.release"
from = "held"
to = "free"
on = "reconcile"
guard.all = ["lease_mine", "object_idle_or_terminal"]
effect = ["rec_delete:leases.rec", "git_push:flywheel-state"]

[[transitions]]
id = "k.go_stale"
from = "held"
to = "stale"
on = "timer"
guard.all = ["seen_older_than:10m"]
effect = ["project_field:Host Seen=stale"]
reason = "the owning host stopped heartbeating; its objects are visibly stale and untouched"

[[transitions]]
id = "k.recover"
from = ["stale", "reclaimable"]
to = "held"
on = "reconcile"
guard.all = ["lease_mine"]
effect = ["rec_set:seen=<now>", "git_push:flywheel-state"]
reason = "the original host came back and resumed its own objects; nothing ran twice (scenario S13)"

[[transitions]]
id = "k.reclaimable"
from = "stale"
to = "reclaimable"
on = "timer"
guard.all = ["seen_older_than:30m", "no_pane_anywhere"]

[[transitions]]
id = "k.auto_take"
from = "reclaimable"
to = "held"
on = "reconcile"
guard.none = ["lease_mine"]
effect = ["rec_set:host=<me>", "rec_set:seen=<now>", "git_push:flywheel-state", "comment:taken_over_from:<host>"]
reason = "the object has no live session anywhere and has been stale for 30 minutes; the stated rule, not a race"

[[transitions]]
id = "k.steal"
from = "stale"
to = "held"
on = "word"
word = "takeover"
effect = ["rec_set:host=<me>", "rec_set:session=<new-id>", "git_push:flywheel-state"]
reason = "the object still has a session the machinery cannot see; only the operator's word moves it"

# ------------------------------------------------------------------------
[[rows]]
id = "row.lease.stale_host"
kind = "question"
when.all = ["state:lease:stale", "object_has_live_session_record"]
until.any = ["word:takeover", "word:wait", "state:lease:held"]
answers = ["takeover", "wait"]
surface = "chat"
group = "hosts"
body = "{host} last seen {stale_for}; it holds {k} objects. take them over here, or wait?"
