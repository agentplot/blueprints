# intent.toml — one thread of design work about one subject.
#
# The flywheel's intake surface. A proposed intent arrives one of two
# ways, and both end in the same `proposed` state:
#
#   from a cluster record a curation run wrote (i.propose_from_cluster);
#   from the operator's own dictation or a person's `gh issue create`.
#
# `i.propose_from_cluster` transcribes a judgment curation already made
# into an issue the operator can answer. It invents nothing: the title,
# the reason, the challenged claim and the weight all come off the
# cluster record, and it reads no signal (requirement 61).

schema = 1
machine = "intent"
clock = "reconciled"
carrier = "github.issue"
truth = "github.issue.labels on the intent issue in agentplot/*"
projections = [
  "projects.field.Status on board 'Flywheel Next'",
  "blueprints repo: openspec/changes/<intent-id>/ presence",
]
scope = "label fwn AND label fwn:intent"

[[states]]
name = "proposed"
kind = "waiting_operator"
truth = "label fw:proposed"
board = "Proposed"
note = "carries its proposed elaborations as a checklist, and its signal weight when it came from a cluster"

[[states]]
name = "open"
kind = "work"
truth = "label fw:open"
board = "Running"
note = "an OpenSpec change directory exists in the blueprints repo; claims written here are PROPOSED (requirement 47)"

[[states]]
name = "close_ready"
kind = "waiting_operator"
truth = "label fw:open AND every child elaboration issue closed"
board = "Waiting"
note = "derived, not stored; the label does not move until the operator's word (requirement 14)"

[[states]]
name = "closed"
kind = "terminal"
truth = "issue state CLOSED with label fw:closed"
board = "Done"
note = "the OpenSpec change is archived; its claims become STANDING (requirement 47)"

[[states]]
name = "dropped"
kind = "terminal"
truth = "issue state CLOSED as not_planned"
board = "Dropped"

# ------------------------------------------------------------------------
[[transitions]]
id = "i.propose_from_cluster"
from = "none"
to = "proposed"
on = "reconcile"
guard.all = ["cluster_record_present", "issue_absent_for_cluster"]
effect = ["open_issue:intent:cluster_template", "set_label:fw:proposed", "project_status:Proposed"]
reason = "a curation run wrote a cluster; the operator gets one row for it"
note = """the body renders title, reason, `challenges: <claim>@<v>` when the cluster
argues with a standing claim, and the weight line — how many signals, from which
sources, over what span — all read off the cluster record (requirement 64)"""

[[transitions]]
id = "i.attach_signal"
from = "open"
to = "open"
on = "reconcile"
guard.all = ["move_target_attach_for_this_intent", "not_yet_attached"]
effect = ["comment:attached_from_curation", "join_standing_elaboration_proposal"]
reason = "curation attached a signal to this open intent; new material joins the one proposal awaiting approval (requirement 13)"

[[transitions]]
id = "i.approve"
from = "proposed"
to = "open"
on = "word"
word = "approve"
effect = [
  "set_label:fw:open",
  "clear_label:fw:proposed",
  "project_status:Running",
  "openspec_change_new:<intent-id>",
  "explode_proposed_elaborations",
]
reason = "operator approved the intent and its first elaborations"

[[transitions]]
id = "i.drop"
from = "proposed"
to = "dropped"
on = "word"
word = "drop"
effect = ["close_issue:not_planned"]
reason = "operator declined the intent; nothing was created (scenario S4)"

[[transitions]]
id = "i.ready"
from = "open"
to = "close_ready"
on = "reconcile"
guard.all = ["children_all:elaboration:done"]
guard.none = ["children_any:elaboration:proposed"]
reason = "every elaboration is done, so the close becomes the operator's to make"

[[transitions]]
id = "i.reopen"
from = "close_ready"
to = "open"
on = "reconcile"
guard.any = ["children_any:elaboration:proposed", "children_any:elaboration:running"]
reason = "new material joined the intent, so the close is no longer available (requirement 8 retraction)"

[[transitions]]
id = "i.close"
from = "close_ready"
to = "closed"
on = "word"
word = "close"
effect = [
  "openspec_archive:<intent-id>",
  "claims_lock_refresh",
  "set_label:fw:closed",
  "close_issue:completed",
  "project_status:Done",
]
reason = "operator closed the thread; its claims move from proposed to standing"
note = "the archive step is the given OpenSpec one (section 7); claims_lock_refresh records each claim's text hash"

# ------------------------------------------------------------------------
[[rows]]
id = "row.intent.proposed"
kind = "proposed_intent"
when.all = ["state:intent:proposed"]
until.any = ["word:approve", "word:drop"]
answers = ["approve", "drop", "approve-with:<elaboration-list>"]
surface = "chat+page"
group = "intents"
body = "intent #{n} {title} — {signals} signals from {sources} over {span}; {k} proposed elaborations: {types}"
note = "one row per proposed intent, never one per signal (requirement 64); the page shows the cited signal ids and their moves"

[[rows]]
id = "row.intent.close"
kind = "thread_done"
when.all = ["state:intent:close_ready"]
until.any = ["word:close", "state:intent:open"]
answers = ["close", "keep"]
surface = "chat"
group = "closes"
body = "intent #{n} {title} — all {k} elaborations done. close?"
