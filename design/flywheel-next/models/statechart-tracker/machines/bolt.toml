# bolt.toml — one delivery of construction work to one built repository.
# It accumulates finished units and lands once, when the operator closes
# it (requirements 23, 24).
#
# Carrier is a GitHub milestone, because a milestone is the one tracker
# object that groups issues, is central, survives a restart, and is
# readable on a phone with no machinery running.

schema = 1
machine = "bolt"
clock = "reconciled"
carrier = "github.milestone"
truth = "milestone description front-matter: state: <name>; milestone open/closed"
projections = ["projects.field.Bolt on every child issue", "the bolt branch fwn/bolt-<slug> in <repo>"]
scope = "milestone title starts with 'fwn/'"

# The stages this bolt's work items pass through. A property of the bolt,
# chosen when it is created (requirement 21). Adding a stage is an edit to
# a bolt's front-matter or to this default; no code changes.
[stages]
default = ["proposal-review", "spec", "build", "test", "code-review"]
agents = { proposal-review = "fwn-construction-session", spec = "fwn-construction-session", build = "fwn-construction-session", test = "fwn-construction-session", code-review = "fwn-construction-session" }
declared_in = "milestone description front-matter key `stages`"

[[states]]
name = "forming"
kind = "work"
truth = "state: forming"
board = "Running"
note = "the bolt branch exists; units may be proposed into it; nothing lands"

[[states]]
name = "open"
kind = "work"
truth = "state: open"
board = "Running"
note = "at least one approved unit; work items are in flight"

[[states]]
name = "close_ready"
kind = "waiting_operator"
truth = "state: open AND children_all:unit:finished"
board = "Waiting"
note = "derived; the milestone is not closed until the operator's word (requirement 23)"

[[states]]
name = "landing"
kind = "waiting_machine"
truth = "state: landing"
board = "Running"

[[states]]
name = "land_failed"
kind = "waiting_operator"
truth = "state: land_failed"
board = "Blocked"
note = "the bolt stays open (requirement 24)"

[[states]]
name = "landed"
kind = "terminal"
truth = "milestone closed AND the bolt branch is an ancestor of <repo>'s default branch"
board = "Done"

# ------------------------------------------------------------------------
[[transitions]]
id = "b.create"
from = "none"
to = "forming"
on = "word"
word = "bolt"
effect = ["milestone_create:fwn/<slug>", "branch_create:<repo>:fwn/bolt-<slug>", "front_matter:stages=<list>"]
reason = "operator opened a delivery; the stage list is fixed here and not afterwards"

[[transitions]]
id = "b.open"
from = "forming"
to = "open"
on = "reconcile"
guard.any = ["children_any:unit:building", "children_any:unit:approved"]

[[transitions]]
id = "b.ready"
from = "open"
to = "close_ready"
on = "reconcile"
guard.all = ["children_all:unit:finished"]
guard.none = ["children_any:unit:proposed", "children_any:work_item:stage_running"]
reason = "every unit is finished, so the close becomes the operator's to make"

[[transitions]]
id = "b.reopen"
from = "close_ready"
to = "open"
on = "reconcile"
guard.any = ["children_any:unit:proposed", "children_any:unit:building"]
reason = "a new unit joined, so the close row retracts"

[[transitions]]
id = "b.land"
from = "close_ready"
to = "landing"
on = "word"
word = "close"
effect = ["front_matter:state=landing"]
reason = "operator closed the bolt"

[[transitions]]
id = "b.landed"
from = "landing"
to = "landed"
on = "reconcile"
guard.all = ["gates_green:<repo>", "branch_mergeable:fwn/bolt-<slug>"]
effect = ["merge_branch:<repo>:default", "openspec_archive_all:<bolt>", "milestone_close", "ledger_write:satisfied"]
reason = "the bolt landed; each work item's named claim gets a verdict from its test evidence"
note = "the only automatic ledger WRITE outside a verdict session; the judgement it records was made by the code-review session and is quoted"

[[transitions]]
id = "b.land_fail"
from = "landing"
to = "land_failed"
on = "reconcile"
guard.any = ["gates_red:<repo>", "branch_conflicted:fwn/bolt-<slug>"]
effect = ["front_matter:state=land_failed", "comment:landing_failure_evidence"]
reason = "the landing failed; it is reported and the bolt stays open (requirement 24)"

[[transitions]]
id = "b.retry_land"
from = "land_failed"
to = "landing"
on = "word"
word = "retry"
effect = ["front_matter:state=landing"]

[[transitions]]
id = "b.amend"
from = "land_failed"
to = "open"
on = "word"
word = "amend"
effect = ["front_matter:state=open"]

# ------------------------------------------------------------------------
[[rows]]
id = "row.bolt.close"
kind = "thread_done"
when.all = ["state:bolt:close_ready"]
until.any = ["word:close", "state:bolt:open"]
answers = ["close", "keep"]
surface = "chat"
group = "closes"
body = "bolt fwn/{slug} in {repo} — {k} units finished. land it?"

[[rows]]
id = "row.bolt.land_failed"
kind = "question"
when.all = ["state:bolt:land_failed"]
until.any = ["word:retry", "word:amend"]
answers = ["retry", "amend"]
surface = "page"
group = "machinery"
body = "bolt fwn/{slug} failed to land: {failure}. retry or amend?"

[[rows]]
id = "row.bolt.claim_drift"
kind = "question"
when.all = ["state:bolt:open", "child_names_stale_claim"]
until.any = ["word:amend-bolt", "word:follow-on"]
answers = ["amend-bolt", "follow-on"]
surface = "page"
group = "claims"
body = "{claim}@{old} moved to @{new}; bolt fwn/{slug} names the old one. amend this bolt, or land it and follow with new work?"
note = "the machinery never restarts or rewrites construction on its own (requirement 52, scenario S9)"
