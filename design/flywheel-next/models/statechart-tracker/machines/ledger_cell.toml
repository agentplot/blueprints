# ledger_cell.toml — one (claim, repository) pair. The ledger is the set
# of cells with a verdict; a repository's construction backlog is the set
# of in-scope cells without one (requirement 51).
#
# The cell has no carrier of its own. Its state is a FUNCTION of two
# stores: the claim in the books repo chapter, and the verdict record in
# ledger/<repo>.rec. It is a machine because it has guarded transitions
# and a plan row; it is not an object anyone creates.

schema = 1
machine = "ledger_cell"
clock = "reconciled"
carrier = "rec.record"
truth = "books repo, main branch: ledger/<repo>.rec, one record per (claim, repo)"
projections = ["the served page's backlog table", "the unit proposal body"]
scope = "repo listed in manifest.rec AND claim scope matches the repo"

[claim_source]
where = "a fenced ```claim block inside the chapter that explains it, books/flywheel-next/src/**.md"
why = "the chapter and the claim are one source, so the prose a construction session reads cannot drift from the claim (requirement 46)"
version_rule = "claims.lock records sha256 of each claim block; `fwn check` fails if a block changed without its version bumping"
standing_rule = "a claim in a chapter under an open openspec/changes/ directory is PROPOSED; once that change is archived the claim is STANDING (requirement 47)"

[[states]]
name = "out_of_scope"
kind = "terminal"
truth = "the claim's scope does not name this repo, its kind, or a capability it declares"
note = "not a verdict; no record is written and none is needed"

[[states]]
name = "unjudged"
kind = "waiting_machine"
truth = "claim standing, repo in scope, no record in ledger/<repo>.rec"
note = "a new repo starts entirely here (requirement 53)"

[[states]]
name = "judging"
kind = "waiting_session"
truth = "a live fwn-verdict-session names this repo"

[[states]]
name = "satisfied"
kind = "terminal"
truth = "record with state: satisfied and claim_hash equal to the claim's current hash"

[[states]]
name = "not_applicable"
kind = "terminal"
truth = "record with state: not_applicable"
note = "a verdict like any other, so a scope judgment is made once and never again (requirement 50, scenario S10)"

[[states]]
name = "partial"
kind = "work"
truth = "record with state: partial"
note = "counts as backlog"

[[states]]
name = "unsatisfied"
kind = "work"
truth = "record with state: unsatisfied"
note = "counts as backlog"

[[states]]
name = "stale"
kind = "waiting_operator"
truth = "a record exists AND (claim_hash != current hash OR evidence path gone)"
note = "the only thing that invalidates a verdict; commits to the repo do not (requirement 50, scenario S11)"

# ------------------------------------------------------------------------
[[transitions]]
id = "l.judge_all"
from = "unjudged"
to = "judging"
on = "word"
word = "approve"
guard.all = ["row_approved:row.unit.first_planning"]
effect = ["request_session:fwn-verdict-session:judge_scope:<repo>"]
reason = "one approved proposal judges every in-scope claim once (requirement 53)"

[[transitions]]
id = "l.write_verdict"
from = "judging"
to = ["satisfied", "partial", "unsatisfied", "not_applicable"]
on = "reconcile"
guard.all = ["state:session:exited", "exit_verb:done"]
effect = ["ledger_write:<state>", "books_commit:ledger/<repo>.rec"]
reason = "the agent judged; the machinery only stores what it judged (requirement 49)"
note = "the session writes the records and commits; this transition records that the commit landed"

[[transitions]]
id = "l.no_recompute"
from = ["satisfied", "not_applicable", "partial", "unsatisfied"]
to = "self"
on = "reconcile"
guard.all = ["claim_hash_matches", "evidence_present"]
effect = []
reason = "inputs unchanged, so nothing is recomputed and nothing is written (invariant I10, scenario S11)"

[[transitions]]
id = "l.stale"
from = ["satisfied", "not_applicable", "partial", "unsatisfied"]
to = "stale"
on = "reconcile"
guard.any = ["claim_hash_moved", "evidence_missing"]
reason = "the claim's text moved, or the evidence it cited is gone"

[[transitions]]
id = "l.rejudge"
from = "stale"
to = "judging"
on = "word"
word = "rejudge"
effect = ["request_session:fwn-verdict-session:rejudge:<claim>:<repo>"]

[[transitions]]
id = "l.accept_stale"
from = "stale"
to = "unsatisfied"
on = "word"
word = "backlog"
effect = ["ledger_write:unsatisfied", "books_commit:ledger/<repo>.rec"]
reason = "operator chose to put it straight into the backlog rather than spend a session judging it"

# ------------------------------------------------------------------------
[[rows]]
id = "row.ledger.stale"
kind = "question"
when.all = ["state:ledger_cell:stale"]
until.any = ["word:rejudge", "word:backlog"]
answers = ["rejudge", "backlog"]
surface = "chat"
group = "claims"
body = "{claim}@{version} moved; {repo}'s verdict {old_state} is stale. rejudge, or put it in the backlog?"
note = "recomputed from two stores on every plan read, so it cannot be forgotten and cannot be answered twice"
