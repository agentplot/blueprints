# unit.toml — one approved piece of construction work inside a bolt.
# Proposed as a single document the operator reads whole; approval is the
# only thing that turns it into work items (requirement 20, invariant I1).

schema = 1
machine = "unit"
clock = "reconciled"
carrier = "github.issue"
truth = "github.issue.labels on the unit issue"
projections = ["projects.field.Status / .Bolt", "the milestone's issue list"]
scope = "label fwn AND label fwn:unit"

[[states]]
name = "proposed"
kind = "waiting_operator"
truth = "label fw:proposed"
board = "Proposed"
note = "the whole document is the issue body; the served page renders it; no work item exists yet"

[[states]]
name = "approved"
kind = "waiting_machine"
truth = "label fw:approved"
board = "Ready"

[[states]]
name = "building"
kind = "work"
truth = "label fw:building AND at least one child work item open"
board = "Running"

[[states]]
name = "finished"
kind = "terminal"
truth = "issue CLOSED as completed AND every child work item merged"
board = "Done"

[[states]]
name = "dropped"
kind = "terminal"
truth = "issue CLOSED as not_planned"
board = "Dropped"

# ------------------------------------------------------------------------
[[transitions]]
id = "u.propose"
from = "none"
to = "proposed"
on = "reconcile"
guard.all = ["ledger_backlog_nonempty:<repo>", "no_open_proposal_for:<repo>"]
effect = ["request_session:fwn-construction-session:plan_unit", "open_issue:unit:plan_template"]
reason = "the repo's backlog, derived from the ledger, has unsatisfied standing claims and no proposal stands"
note = "the backlog is computed from ledger + claims at read time; it is never stored (requirement 51)"

[[transitions]]
id = "u.approve"
from = "proposed"
to = "approved"
on = "word"
word = "approve"
guard.any = ["state:bolt:forming", "state:bolt:open"]
effect = ["set_label:fw:approved", "project_status:Ready"]
reason = "operator approved the unit document"

[[transitions]]
id = "u.drop"
from = "proposed"
to = "dropped"
on = "word"
word = "drop"
effect = ["close_issue:not_planned"]

[[transitions]]
id = "u.explode"
from = "approved"
to = "building"
on = "reconcile"
guard.all = ["lease_mine", "no_child_workitems"]
effect = ["open_issues:work_item:from_unit_tasks", "set_label:fw:building"]
reason = "approval, and only approval, creates work items (requirement 20)"
note = "guarded by no_child_workitems, so a restart between the write and the label explodes nothing twice"

[[transitions]]
id = "u.finish"
from = "building"
to = "finished"
on = "reconcile"
guard.all = ["children_all:work_item:merged"]
effect = ["close_issue:completed"]

# ------------------------------------------------------------------------
[[rows]]
id = "row.unit.proposed"
kind = "proposed_unit"
when.all = ["state:unit:proposed"]
until.any = ["word:approve", "word:drop"]
answers = ["approve", "drop"]
surface = "page"
group = "bolts"
body = "bolt fwn/{slug}: unit {title} — {k} work items, claims {claims}"
note = "a unit document is longer than a short reply, so its row lives on the page (requirement 2)"

[[rows]]
id = "row.unit.first_planning"
kind = "proposed_unit"
when.all = ["manifest_in_scope", "ledger_empty:<repo>"]
until.any = ["word:approve", "word:drop"]
answers = ["approve", "drop"]
surface = "page"
group = "bolts"
body = "{repo} joined the fleet: judge {k} standing claims in scope, then build the unsatisfied set"
note = "one proposal, not k of them (requirement 53, scenario S10)"
