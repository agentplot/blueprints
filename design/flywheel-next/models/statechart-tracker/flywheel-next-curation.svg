<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 940" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a86"/></marker>
    <marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a7fb5"/></marker>
    <marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e5b"/></marker>
    <marker id="mP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b5cb8"/></marker>
    <marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9962e"/></marker>
    <marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c05b5b"/></marker>
    <marker id="mT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b8a8a"/></marker>
    <g id="cyl"> <path d="M -24 -11 L -24 13 A 24 8 0 0 0 24 13 L 24 -11" fill="#f1f1ee" stroke="#8a8a86" stroke-width="1.6"/> <ellipse cx="0" cy="-11" rx="24" ry="8" fill="#e3e3df" stroke="#8a8a86" stroke-width="1.6"/> </g>
    <g id="cube" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"> <path d="M -16 -8 L 0 -17 L 16 -8 L 16 10 L 0 19 L -16 10 Z" fill="#fff"/> <path d="M -16 -8 L 0 1 L 16 -8 M 0 1 L 0 19" fill="none"/> </g>
    <g id="row" stroke="currentColor" stroke-width="1.6" fill="none"><rect x="-8" y="-6" width="16" height="12" rx="2"/><line x1="-4" y1="-1" x2="4" y2="-1"/><line x1="-4" y1="3" x2="1" y2="3"/></g>
    <g id="rows" fill="#7b5cb8"> <rect x="-16" y="-9" width="32" height="4" rx="1"/><rect x="-16" y="-2" width="32" height="4" rx="1"/><rect x="-16" y="5" width="20" height="4" rx="1"/> </g>
    <g id="tbl"> <rect x="-11" y="-9" width="22" height="18" rx="2" fill="#fff" stroke="currentColor" stroke-width="1.8"/> <line x1="-11" y1="-3" x2="11" y2="-3" stroke="currentColor" stroke-width="1.4"/> <line x1="-11" y1="3" x2="11" y2="3" stroke="currentColor" stroke-width="1.4"/> <line x1="-3" y1="-9" x2="-3" y2="9" stroke="currentColor" stroke-width="1.4"/> </g>
    <g id="feed" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"> <circle cx="0" cy="2" r="2.6" fill="currentColor" stroke="none"/> <path d="M -5.5 -3 a 8 8 0 0 1 11 0"/> <path d="M -9.5 -7 a 13.5 13.5 0 0 1 19 0"/> </g>
    <g id="people"> <circle cy="-5" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/> <path d="M -8 9 a 8 7 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.8"/> </g>
    <g id="clock"> <circle r="9" fill="#fff" stroke="#c9962e" stroke-width="2"/> <path d="M 0 -5 V 0 H 4" fill="none" stroke="#c9962e" stroke-width="2.2" stroke-linecap="round"/> </g>
    <g id="check" fill="none" stroke="#2e9e5b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"> <path d="M -6 0 L -2 4 L 6 -5"/> </g>
    <g id="marker"> <circle r="7" fill="#fff" stroke="currentColor" stroke-width="2.2"/> <circle r="2.6" fill="currentColor"/> </g>
  </defs>
  <rect width="1680" height="940" fill="#fff"/>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">Curation — twenty signals in, one move each, two rows out</text>
  <text x="40" y="57" font-size="12" fill="#666">adapters append · a policy charges the run · a session judges · the machinery transcribes a cluster into one proposal</text>

  <!-- ===================== ADAPTERS ===================== -->
  <rect x="40" y="96" width="290" height="330" rx="10" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="58" y="122" font-size="11.5" font-weight="700" fill="#333">ADAPTERS</text>
  <text x="58" y="138" font-size="8.5" fill="#999">fwn signal add · one record each</text>
  <use href="#feed" x="86" y="182" color="#c05b5b"/>
  <text x="114" y="178" font-size="10.5" font-weight="700" fill="#333">Discord #fwn-signals</text>
  <text x="114" y="192" font-size="8.5" fill="#999">one message per record</text>
  <use href="#rows" x="86" y="244"/>
  <text x="114" y="240" font-size="10.5" font-weight="700" fill="#333">a meeting transcript</text>
  <text x="114" y="254" font-size="8.5" fill="#999">one excerpt per record</text>
  <use href="#tbl" x="86" y="306" color="#8a8a86"/>
  <text x="114" y="302" font-size="10.5" font-weight="700" fill="#333">a watched log</text>
  <text x="114" y="316" font-size="8.5" fill="#999">deduplicated by fingerprint</text>
  <use href="#row" x="86" y="368" color="#7b5cb8"/>
  <text x="114" y="364" font-size="10.5" font-weight="700" fill="#333">a session's offer</text>
  <text x="114" y="378" font-size="8.5" fill="#999">subject not its own thread</text>

  <!-- ===================== THE SIGNAL FILE ===================== -->
  <path d="M 334 262 L 388 262" fill="none" stroke="#8a8a86" stroke-width="2.2" marker-end="url(#mN)"/>
  <rect x="366" y="196" width="108" height="20" rx="10" fill="#8a8a86"/>
  <text x="420" y="210" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">20 unmoved</text>
  <text x="352" y="182" font-size="8.5" fill="#999">the count is all the machinery may read</text>
  <use href="#cyl" x="420" y="262" data-fwn-state="signal.unmoved"/>
  <text x="420" y="302" font-size="10" fill="#555" text-anchor="middle">signals/2026-09.rec</text>
  <text x="420" y="315" font-size="8.5" fill="#999" text-anchor="middle">flywheel-state branch</text>

  <!-- ===================== THE RUN ===================== -->
  <use href="#clock" x="620" y="164"/>
  <text x="644" y="160" font-size="10.5" font-weight="700" fill="#333">policy.rec</text>
  <text x="644" y="174" font-size="8.5" fill="#999">cadence 24h · threshold 25</text>
  <path d="M 620 182 L 620 232" fill="none" stroke="#c9962e" stroke-width="2.2" marker-end="url(#mA)"/>
  <text x="636" y="212" font-size="9" fill="#a97e26">charges the run</text>
  <path d="M 448 268 C 500 270, 532 280, 566 288" fill="none" stroke="#8a8a86" stroke-width="2.2" marker-end="url(#mN)"/>
  <text x="508" y="260" font-size="9" fill="#666" text-anchor="middle">the snapshot</text>
  <circle cx="620" cy="290" r="52" fill="#f8f5fc" stroke="#7b5cb8" stroke-width="2.6" data-fwn-state="curation.running"/>
  <text x="620" y="286" font-size="11.5" font-weight="700" fill="#5a3f95" text-anchor="middle">CURATION</text>
  <text x="620" y="303" font-size="8.5" fill="#5a3f95" text-anchor="middle">one run</text>
  <text x="620" y="372" font-size="9.5" fill="#666" text-anchor="middle">the same three exits</text>
  <use href="#cube" x="470" y="404" color="#2b8a8a"/>
  <text x="470" y="440" font-size="10" fill="#555" text-anchor="middle">the claim index</text>
  <text x="470" y="453" font-size="8.5" fill="#999" text-anchor="middle">read only — a run writes no verdict</text>
  <path d="M 494 388 C 530 366, 552 344, 572 322" fill="none" stroke="#2b8a8a" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#mT)"/>
  <use href="#people" x="700" y="430" color="#5f6b7a"/>
  <text x="728" y="426" font-size="10" fill="#555">or a person by hand</text>
  <text x="728" y="440" font-size="8.5" fill="#999">recins writes the same records</text>
  <path d="M 700 412 C 692 392, 680 372, 656 330" fill="none" stroke="#7b5cb8" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#mP)"/>

  <!-- ===================== THE MOVES ===================== -->
  <path d="M 672 264 L 754 226" fill="none" stroke="#7b5cb8" stroke-width="2" marker-end="url(#mP)"/>
  <path d="M 674 280 L 754 266" fill="none" stroke="#7b5cb8" stroke-width="2" marker-end="url(#mP)"/>
  <path d="M 674 300 L 754 306" fill="none" stroke="#7b5cb8" stroke-width="2" marker-end="url(#mP)"/>
  <path d="M 672 316 L 754 346" fill="none" stroke="#7b5cb8" stroke-width="2" marker-end="url(#mP)"/>
  <rect x="760" y="214" width="200" height="22" rx="11" fill="#7b5cb8"/>
  <text x="860" y="229" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">attach · 6</text>
  <rect x="760" y="254" width="200" height="22" rx="11" fill="#7b5cb8"/>
  <text x="860" y="269" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">challenge · 2</text>
  <rect x="760" y="294" width="200" height="22" rx="11" fill="#7b5cb8"/>
  <text x="860" y="309" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">cluster · 3</text>
  <rect x="760" y="334" width="200" height="22" rx="11" fill="#7b5cb8"/>
  <text x="860" y="349" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">drop · 9</text>
  <text x="860" y="380" font-size="8.5" fill="#999" text-anchor="middle">one move per signal · never re-judged</text>

  <!-- ===================== THE CLUSTERS AND THE PROPOSALS ===================== -->
  <path d="M 964 264 L 1012 262" fill="none" stroke="#7b5cb8" stroke-width="2" marker-end="url(#mP)"/>
  <path d="M 964 304 L 1014 276" fill="none" stroke="#7b5cb8" stroke-width="2" marker-end="url(#mP)"/>
  <use href="#cube" x="1040" y="258" color="#7b5cb8"/>
  <text x="1045" y="296" font-size="10" fill="#555" text-anchor="middle">clusters/*.rec</text>
  <text x="1040" y="309" font-size="8.5" fill="#999" text-anchor="middle">title · claim · the weight</text>
  <path d="M 1066 248 C 1092 214, 1102 200, 1124 192" fill="none" stroke="#7b5cb8" stroke-width="2.2" marker-end="url(#mP)"/>
  <path d="M 1066 272 C 1092 286, 1102 292, 1124 296" fill="none" stroke="#7b5cb8" stroke-width="2.2" marker-end="url(#mP)"/>
  <rect x="1130" y="146" width="490" height="90" rx="8" fill="#fff" stroke="#7b5cb8" stroke-width="1.8" data-fwn-state="intent.proposed"/>
  <text x="1146" y="172" font-size="11" font-weight="700" fill="#333">intent #511 the plan page must render in two seconds</text>
  <text x="1146" y="192" font-size="9.5" font-family="monospace" fill="#666">3 signals · transcript(2), discord(1) · 6 days</text>
  <text x="1146" y="214" font-size="9" font-weight="700" fill="#a34848">+row approve or drop · −row on the word</text>
  <use href="#row" x="1590" y="196" color="#7b5cb8"/>
  <rect x="1130" y="252" width="490" height="90" rx="8" fill="#fff" stroke="#7b5cb8" stroke-width="1.8"/>
  <text x="1146" y="278" font-size="11" font-weight="700" fill="#333">intent #512 the lease rule is wrong</text>
  <text x="1146" y="298" font-size="9.5" font-family="monospace" fill="#666">2 signals · challenges lease-cas-push@4</text>
  <text x="1146" y="320" font-size="9" font-weight="700" fill="#a34848">+row approve or drop · −row on the word</text>
  <use href="#row" x="1590" y="302" color="#7b5cb8"/>
  <rect x="1130" y="372" width="490" height="30" rx="15" fill="#fbeeee" stroke="#c05b5b"/>
  <text x="1152" y="392" font-size="10.5" font-weight="700" fill="#a34848">20 signals · 20 moves · 2 rows · 0 sessions started</text>

  <!-- ===================== THE THREE RECORDS ===================== -->
  <rect x="40" y="470" width="960" height="290" rx="10" fill="#fafafa" stroke="#8a8a86" stroke-width="1.4"/>
  <text x="58" y="496" font-size="11.5" font-weight="700" fill="#333">THE THREE RECORDS</text>
  <text x="204" y="496" font-size="9.5" fill="#999">recutils, appended and pushed; the push is a compare-and-swap</text>
  <rect x="60" y="530" width="280" height="112" rx="8" fill="#fff" stroke="#8a8a86" stroke-width="1.6"/>
  <text x="76" y="556" font-size="11" font-weight="700" fill="#333">signal</text>
  <text x="76" y="576" font-size="9" font-family="monospace" fill="#666">id: sig-2026-09-03-0f31</text>
  <text x="76" y="592" font-size="9" font-family="monospace" fill="#666">source: transcript</text>
  <text x="76" y="614" font-size="9" font-weight="700" fill="#5f6b7a">written by an adapter</text>
  <path d="M 346 586 L 374 586" fill="none" stroke="#7b5cb8" stroke-width="2" marker-end="url(#mP)"/>
  <rect x="380" y="530" width="280" height="112" rx="8" fill="#fff" stroke="#7b5cb8" stroke-width="1.6"/>
  <text x="396" y="556" font-size="11" font-weight="700" fill="#333">move</text>
  <text x="396" y="576" font-size="9" font-family="monospace" fill="#666">signal: sig-2026-09-03-0f31</text>
  <text x="396" y="592" font-size="9" font-family="monospace" fill="#666">target: cluster</text>
  <text x="396" y="614" font-size="9" font-weight="700" fill="#5a3f95">one key per signal, so never twice</text>
  <path d="M 666 586 L 694 586" fill="none" stroke="#7b5cb8" stroke-width="2" marker-end="url(#mP)"/>
  <rect x="700" y="530" width="280" height="112" rx="8" fill="#fff" stroke="#7b5cb8" stroke-width="1.6"/>
  <text x="716" y="556" font-size="11" font-weight="700" fill="#333">cluster</text>
  <text x="716" y="576" font-size="9" font-family="monospace" fill="#666">id: clu-2026-09-03-a7</text>
  <text x="716" y="592" font-size="9" font-family="monospace" fill="#666">signals: 3 · span 6 days</text>
  <text x="716" y="614" font-size="9" font-weight="700" fill="#5a3f95">the weight the row shows</text>
  <text x="58" y="690" font-size="9.5" font-weight="600" fill="#5f6b7a">the cluster carries the weight, so the transition that opens the proposal never opens the signal file</text>
  <text x="58" y="714" font-size="8.5" fill="#999">a curation run may not open an intent — the checker refuses that effect, as it refuses a bolt for a chore</text>

  <!-- ===================== WHY NO ROW PER SIGNAL ===================== -->
  <rect x="1040" y="470" width="600" height="290" rx="10" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.4"/>
  <text x="1058" y="496" font-size="11.5" font-weight="700" fill="#333">WHY NO ROW PER SIGNAL</text>
  <use href="#row" x="1130" y="572" color="#8a8a86" data-fwn-state="signal.unmoved"/>
  <text x="1130" y="608" font-size="10" fill="#555" text-anchor="middle">unmoved</text>
  <text x="1130" y="621" font-size="8.5" fill="#999" text-anchor="middle">waiting_machine</text>
  <path d="M 1150 572 L 1268 572" fill="none" stroke="#8a8a86" stroke-width="2.2" marker-end="url(#mN)"/>
  <text x="1210" y="564" font-size="9" fill="#666" text-anchor="middle">a move record exists</text>
  <use href="#check" x="1296" y="572" data-fwn-state="signal.moved"/>
  <text x="1296" y="608" font-size="10" fill="#555" text-anchor="middle">moved</text>
  <text x="1296" y="621" font-size="8.5" fill="#999" text-anchor="middle">terminal</text>
  <use href="#marker" x="1450" y="572" color="#8a8a86"/>
  <text x="1450" y="608" font-size="10" fill="#555" text-anchor="middle">no third state</text>
  <text x="1450" y="621" font-size="8.5" fill="#999" text-anchor="middle">and no row kind</text>
  <text x="1058" y="678" font-size="9.5" font-weight="600" fill="#5f6b7a">neither state waits on the operator, so the exhaustiveness check asks this machine for no row</text>
  <text x="1058" y="702" font-size="8.5" fill="#999">adding one would mean first declaring a signal state that waits on the operator</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="40" y="796" width="1600" height="96" rx="10" fill="#fafafa" stroke="#d5d5d0"/>
  <g font-size="10.5" fill="#555">
    <use href="#rows" x="82" y="828"/><text x="106" y="832">a signal</text>
    <use href="#cyl" x="220" y="828"/><text x="252" y="832">the signal file</text>
    <use href="#cube" x="400" y="828" color="#8a8a86"/><text x="424" y="832">a record</text>
    <use href="#row" x="540" y="828" color="#8a8a86"/><text x="558" y="832">an object</text>
    <use href="#clock" x="680" y="828"/><text x="698" y="832">the standing policy</text>
    <use href="#check" x="880" y="828"/><text x="896" y="832">terminal</text>
    <use href="#people" x="1000" y="828" color="#8a8a86"/><text x="1018" y="832">a person doing it by hand</text>
    <use href="#feed" x="1240" y="830" color="#8a8a86"/><text x="1258" y="832">chat</text>
    <use href="#tbl" x="1340" y="828" color="#8a8a86"/><text x="1360" y="832">a log</text>
  </g>
  <g font-size="10.5" fill="#555">
    <line x1="82" y1="866" x2="118" y2="866" stroke="#7b5cb8" stroke-width="3"/><text x="126" y="870">design objects</text>
    <line x1="260" y1="866" x2="296" y2="866" stroke="#c05b5b" stroke-width="3"/><text x="304" y="870">word and rows</text>
    <line x1="440" y1="866" x2="476" y2="866" stroke="#c9962e" stroke-width="3"/><text x="484" y="870">what charges a run</text>
    <line x1="640" y1="866" x2="676" y2="866" stroke="#2b8a8a" stroke-width="2" stroke-dasharray="2 5"/><text x="684" y="870">claim index read</text>
    <line x1="840" y1="866" x2="876" y2="866" stroke="#8a8a86" stroke-width="3"/><text x="884" y="870">records</text>
    <text x="1000" y="870" font-weight="600" fill="#333">the flywheel owns the records, never the batching — a signal waits for a move, not for the operator</text>
  </g>
</svg>
