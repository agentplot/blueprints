<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1000" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a86"/></marker>
    <marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a7fb5"/></marker>
    <marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e5b"/></marker>
    <marker id="mP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b5cb8"/></marker>
    <marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c05b5b"/></marker>
    <marker id="mT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b8a8a"/></marker>
    <g id="repo"> <rect x="-26" y="-18" width="52" height="36" rx="7" fill="#fff" stroke="currentColor" stroke-width="2"/> <circle cx="-9" cy="8" r="3.2" fill="currentColor"/> <circle cx="9" cy="-8" r="3.2" fill="currentColor"/> <path d="M -9 8 v-8 a 8 8 0 0 1 8 -8 h 1" fill="none" stroke="currentColor" stroke-width="2"/> </g>
    <g id="gear"> <circle r="9" fill="#fff" stroke="currentColor" stroke-width="2.4"/> <circle r="3" fill="currentColor"/> <g stroke="currentColor" stroke-width="2.4"> <line y1="-9" y2="-13.5"/><line y1="9" y2="13.5"/> <line x1="-9" x2="-13.5"/><line x1="9" x2="13.5"/> <line x1="-6.4" y1="-6.4" x2="-9.5" y2="-9.5"/><line x1="6.4" y1="6.4" x2="9.5" y2="9.5"/> <line x1="-6.4" y1="6.4" x2="-9.5" y2="9.5"/><line x1="6.4" y1="-6.4" x2="9.5" y2="-9.5"/> </g> </g>
    <g id="cube" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"> <path d="M -16 -8 L 0 -17 L 16 -8 L 16 10 L 0 19 L -16 10 Z" fill="#fff"/> <path d="M -16 -8 L 0 1 L 16 -8 M 0 1 L 0 19" fill="none"/> </g>
    <g id="row" stroke="currentColor" stroke-width="1.6" fill="none"><rect x="-8" y="-6" width="16" height="12" rx="2"/><line x1="-4" y1="-1" x2="4" y2="-1"/><line x1="-4" y1="3" x2="1" y2="3"/></g>
    <g id="marker"> <circle r="7" fill="#fff" stroke="currentColor" stroke-width="2.2"/> <circle r="2.6" fill="currentColor"/> </g>
    <g id="pause"> <circle r="9" fill="#fff" stroke="#c9962e" stroke-width="2"/> <line x1="-2.8" y1="-4" x2="-2.8" y2="4" stroke="#c9962e" stroke-width="2.4" stroke-linecap="round"/> <line x1="2.8" y1="-4" x2="2.8" y2="4" stroke="#c9962e" stroke-width="2.4" stroke-linecap="round"/> </g>
    <g id="check" fill="none" stroke="#2e9e5b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"> <path d="M -6 0 L -2 4 L 6 -5"/> </g>
    <g id="cross"> <circle r="10" fill="#fbeeee" stroke="#c05b5b" stroke-width="2"/> <path d="M -4 -4 l 8 8 M 4 -4 l -8 8" fill="none" stroke="#a34848" stroke-width="2.5"/> </g>
    <g id="clock"> <circle r="9" fill="#fff" stroke="#c9962e" stroke-width="2"/> <path d="M 0 -5 V 0 H 4" fill="none" stroke="#c9962e" stroke-width="2.2" stroke-linecap="round"/> </g>
    <g id="dash"> <line x1="-7" y1="0" x2="7" y2="0" stroke="#8a8a86" stroke-width="2.6" stroke-linecap="round"/> </g>
  </defs>
  <rect width="1680" height="1000" fill="#fff"/>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">The ledger — a verdict dies only when its claim's text moves, and the backlog is a query</text>
  <text x="40" y="57" font-size="12" fill="#666">the claim lives in the chapter that explains it · an agent judges · not-applicable is a verdict like any other</text>

  <!-- ===================== THE CLAIM ===================== -->
  <rect x="40" y="96" width="470" height="360" rx="10" fill="#f8f5fc" stroke="#7b5cb8" stroke-width="1.6"/>
  <text x="58" y="122" font-size="11.5" font-weight="700" fill="#5a3f95">A CLAIM</text>
  <text x="128" y="122" font-size="9.5" fill="#999">one source, with the chapter that explains it</text>
  <use href="#repo" x="106" y="176" color="#7b5cb8"/>
  <text x="146" y="172" font-size="10.5" font-weight="700" fill="#333">books repo · main</text>
  <text x="146" y="186" font-size="8.5" fill="#999">books/flywheel-next/src</text>
  <rect x="60" y="216" width="430" height="112" rx="8" fill="#fff" stroke="#7b5cb8" stroke-width="1.6"/>
  <text x="76" y="240" font-size="11" font-weight="700" fill="#333">chapter — how the plan is derived</text>
  <text x="76" y="260" font-size="9.5" font-family="monospace" fill="#666">a fenced claim block, inside the prose</text>
  <rect x="76" y="272" width="152" height="18" rx="9" fill="#7b5cb8"/>
  <text x="152" y="285" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">v3 · 9c2b41e8</text>
  <text x="76" y="312" font-size="8.5" fill="#999">claims.lock refuses a text change without a version bump</text>
  <text x="60" y="356" font-size="9" font-weight="700" fill="#999">proposed</text>
  <text x="140" y="356" font-size="9" fill="#999">its change is open · visible, never built</text>
  <text x="60" y="378" font-size="9" font-weight="700" fill="#5a3f95">standing</text>
  <text x="140" y="378" font-size="9" fill="#5a3f95">archived · the only thing planned against</text>
  <text x="60" y="420" font-size="9.5" font-weight="600" fill="#5a3f95">the prose, the diagram and the claim are one file — they cannot drift apart</text>

  <!-- ===================== THE LEDGER GRID ===================== -->
  <rect x="550" y="96" width="620" height="360" rx="10" fill="#e8f3f3" stroke="#2b8a8a" stroke-width="1.8"/>
  <text x="568" y="122" font-size="11.5" font-weight="700" fill="#1f6e6e">THE LEDGER</text>
  <text x="662" y="122" font-size="9.5" fill="#999">one cell per claim and repository</text>
  <text x="800" y="166" font-size="9.5" font-weight="700" fill="#1f6e6e" text-anchor="middle">switchboard</text>
  <text x="940" y="166" font-size="9.5" font-weight="700" fill="#1f6e6e" text-anchor="middle">dispatch</text>
  <text x="1080" y="166" font-size="9.5" font-weight="700" fill="#1f6e6e" text-anchor="middle">atlas</text>
  <text x="770" y="204" font-size="9.5" fill="#555" text-anchor="end">plan-row-single-source</text>
  <text x="770" y="254" font-size="9.5" fill="#555" text-anchor="end">lease-cas-push</text>
  <text x="770" y="304" font-size="9.5" fill="#555" text-anchor="end">exit-alphabet</text>
  <text x="770" y="354" font-size="9.5" fill="#555" text-anchor="end">host-heartbeat</text>
  <g fill="#fff" stroke="#cfe0e0">
    <rect x="783" y="184" width="34" height="34" rx="6"/><rect x="923" y="184" width="34" height="34" rx="6"/><rect x="1063" y="184" width="34" height="34" rx="6"/>
    <rect x="783" y="234" width="34" height="34" rx="6"/><rect x="923" y="234" width="34" height="34" rx="6"/><rect x="1063" y="234" width="34" height="34" rx="6"/>
    <rect x="783" y="284" width="34" height="34" rx="6"/><rect x="923" y="284" width="34" height="34" rx="6"/><rect x="1063" y="284" width="34" height="34" rx="6"/>
    <rect x="783" y="334" width="34" height="34" rx="6"/><rect x="923" y="334" width="34" height="34" rx="6"/><rect x="1063" y="334" width="34" height="34" rx="6"/>
  </g>
  <use href="#check" x="800" y="201"/><use href="#check" x="940" y="201"/><use href="#clock" x="1080" y="201"/>
  <use href="#check" x="800" y="251"/><use href="#cross" x="940" y="251"/><use href="#dash" x="1080" y="251"/>
  <use href="#pause" x="800" y="301"/><use href="#check" x="940" y="301"/><use href="#dash" x="1080" y="301"/>
  <use href="#cross" x="800" y="351"/><use href="#dash" x="940" y="351"/><use href="#cross" x="1080" y="351"/>
  <text x="568" y="404" font-size="8.5" fill="#999">recutils · ledger/switchboard.rec on main of the books repo · one record per cell</text>
  <text x="568" y="430" font-size="9.5" font-weight="600" fill="#1f6e6e">a repository joining the fleet starts with every cell empty and is judged once</text>

  <!-- ===================== THE BACKLOG ===================== -->
  <rect x="1210" y="96" width="430" height="360" rx="10" fill="#eef3f9" stroke="#4a7fb5" stroke-width="1.6"/>
  <text x="1228" y="122" font-size="11.5" font-weight="700" fill="#3f6d9c">THE BACKLOG</text>
  <text x="1228" y="142" font-size="8.5" fill="#999">standing claims in scope, minus satisfied and not-applicable</text>
  <use href="#cube" x="1264" y="196" color="#2b8a8a"/>
  <text x="1296" y="192" font-size="10.5" font-weight="700" fill="#1f6e6e">a query, at read time</text>
  <text x="1296" y="206" font-size="8.5" fill="#999">recsel, never a stored list</text>
  <path d="M 1174 240 C 1200 240, 1210 250, 1236 258" fill="none" stroke="#2b8a8a" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#mT)"/>
  <text x="1196" y="232" font-size="9" fill="#1f6e6e" text-anchor="middle">read</text>
  <rect x="1230" y="266" width="390" height="118" rx="8" fill="#fff" stroke="#4a7fb5" stroke-width="1.6"/>
  <text x="1246" y="290" font-size="11" font-weight="700" fill="#333">unit: satisfy the four unsatisfied</text>
  <text x="1246" y="308" font-size="9.5" font-family="monospace" fill="#666">one document · read whole</text>
  <text x="1246" y="326" font-size="9" font-weight="700" fill="#3f6d9c">opened only on the word</text>
  <rect x="1246" y="338" width="200" height="20" rx="4" fill="#fbeeee" stroke="#c05b5b"/>
  <text x="1258" y="352" font-size="8.5" font-weight="700" fill="#a34848">+row approve or drop</text>
  <text x="1246" y="374" font-size="8.5" fill="#999">−row on either word</text>
  <text x="1228" y="430" font-size="9.5" font-weight="600" fill="#3f6d9c">never stored as a list, so it can never go stale on its own</text>

  <!-- ===================== ONE CELL ===================== -->
  <rect x="40" y="490" width="1600" height="336" rx="10" fill="#fafafa" stroke="#8a8a86" stroke-width="1.4"/>
  <text x="58" y="516" font-size="11.5" font-weight="700" fill="#333">ONE CELL — its whole life</text>
  <text x="248" y="516" font-size="9.5" fill="#999">a judgment by an agent, stored with the inputs it was made from</text>
  <line x1="140" y1="620" x2="548" y2="620" stroke="#8a8a86" stroke-width="2" opacity="0.3"/>
  <use href="#row" x="140" y="620" color="#8a8a86" data-fwn-state="ledger_cell.unjudged"/>
  <text x="140" y="654" font-size="10" fill="#555" text-anchor="middle">unjudged</text>
  <text x="140" y="667" font-size="8.5" fill="#999" text-anchor="middle">a new repo starts here</text>
  <path d="M 158 620 L 322 620" fill="none" stroke="#c05b5b" stroke-width="2.2" marker-end="url(#mR)"/>
  <text x="240" y="612" font-size="9" fill="#a34848" text-anchor="middle">one word judges them all</text>
  <use href="#gear" x="340" y="620" color="#2e9e5b" data-fwn-state="ledger_cell.judging"/>
  <text x="340" y="654" font-size="10" fill="#555" text-anchor="middle">judging</text>
  <text x="340" y="667" font-size="8.5" fill="#999" text-anchor="middle">an agent, not a computation</text>
  <path d="M 358 620 L 534 620" fill="none" stroke="#2e9e5b" stroke-width="2.2" marker-end="url(#mG)"/>
  <polygon points="600,574 656,620 600,666 544,620" fill="#e8f3f3" stroke="#2b8a8a" stroke-width="2.4"/>
  <text x="600" y="616" font-size="10.5" font-weight="700" fill="#1f6e6e" text-anchor="middle">VERDICT</text>
  <text x="600" y="631" font-size="8.5" fill="#1f6e6e" text-anchor="middle">with its inputs</text>
  <rect x="700" y="566" width="190" height="20" rx="10" fill="#2e9e5b"/>
  <text x="795" y="580" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">satisfied</text>
  <rect x="700" y="596" width="190" height="20" rx="10" fill="#c9962e"/>
  <text x="795" y="610" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">partial</text>
  <rect x="700" y="626" width="190" height="20" rx="10" fill="#c05b5b"/>
  <text x="795" y="640" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">unsatisfied</text>
  <rect x="700" y="656" width="190" height="20" rx="10" fill="#8a8a86"/>
  <text x="795" y="670" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">not applicable</text>
  <path d="M 660 606 L 694 578" fill="none" stroke="#2b8a8a" stroke-width="1.8" marker-end="url(#mT)"/>
  <path d="M 660 614 L 694 606" fill="none" stroke="#2b8a8a" stroke-width="1.8" marker-end="url(#mT)"/>
  <path d="M 660 628 L 694 634" fill="none" stroke="#2b8a8a" stroke-width="1.8" marker-end="url(#mT)"/>
  <path d="M 660 636 L 694 662" fill="none" stroke="#2b8a8a" stroke-width="1.8" marker-end="url(#mT)"/>
  <text x="906" y="670" font-size="8.5" fill="#999">judged once, then never again</text>
  <path d="M 894 606 C 960 600, 1010 600, 1058 608" fill="none" stroke="#2b8a8a" stroke-width="2.2" marker-end="url(#mT)"/>
  <text x="976" y="588" font-size="9" fill="#1f6e6e" text-anchor="middle">the claim's text moves</text>
  <use href="#clock" x="1090" y="620" data-fwn-state="ledger_cell.stale"/>
  <text x="1114" y="616" font-size="10.5" font-weight="700" fill="#333">stale</text>
  <text x="1114" y="630" font-size="8.5" fill="#999">the only thing that invalidates a verdict</text>
  <rect x="1170" y="562" width="216" height="20" rx="4" fill="#fbeeee" stroke="#c05b5b"/>
  <text x="1182" y="576" font-size="8.5" font-weight="700" fill="#a34848">+row rejudge or backlog it</text>
  <path d="M 1180 584 L 1108 604" fill="none" stroke="#c05b5b" stroke-width="1.6" marker-end="url(#mR)"/>
  <text x="1114" y="670" font-size="8.5" fill="#999">repo_rev is recorded and never compared</text>
  <path d="M 762 690 C 700 736, 620 730, 582 674" fill="none" stroke="#2b8a8a" stroke-width="1.8" stroke-dasharray="2 5" marker-end="url(#mT)"/>
  <text x="680" y="754" font-size="9" fill="#1f6e6e" text-anchor="middle">inputs unchanged — nothing recomputed, nothing written</text>
  <rect x="1060" y="736" width="540" height="30" rx="15" fill="#e8f3f3" stroke="#2b8a8a"/>
  <text x="1080" y="756" font-size="10.5" font-weight="700" fill="#1f6e6e">forty commits · no claim moved · no verdict recomputed · the plan unchanged</text>
  <text x="58" y="796" font-size="9.5" font-weight="600" fill="#5f6b7a">a contract claim naming two repositories is one cell in each, and each carries its own verdict</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="40" y="856" width="1600" height="124" rx="10" fill="#fafafa" stroke="#d5d5d0"/>
  <g font-size="10.5" fill="#555">
    <use href="#check" x="80" y="892"/><text x="96" y="896">satisfied</text>
    <use href="#pause" x="220" y="892"/><text x="238" y="896">partial</text>
    <use href="#cross" x="350" y="892"/><text x="368" y="896">unsatisfied</text>
    <use href="#dash" x="510" y="892"/><text x="526" y="896">not applicable</text>
    <use href="#clock" x="690" y="892"/><text x="708" y="896">stale</text>
    <use href="#row" x="810" y="892" color="#8a8a86"/><text x="828" y="896">unjudged</text>
    <use href="#gear" x="960" y="892" color="#8a8a86"/><text x="980" y="896">a judging session</text>
    <use href="#cube" x="1160" y="892" color="#8a8a86"/><text x="1184" y="896">a derived query</text>
    <use href="#repo" x="1360" y="892" color="#8a8a86"/><text x="1392" y="896">books repo</text>
  </g>
  <g font-size="10.5" fill="#555">
    <line x1="80" y1="944" x2="116" y2="944" stroke="#7b5cb8" stroke-width="3"/><text x="124" y="948">claims</text>
    <line x1="220" y1="944" x2="256" y2="944" stroke="#2b8a8a" stroke-width="3"/><text x="264" y="948">ledger write</text>
    <line x1="400" y1="944" x2="436" y2="944" stroke="#2b8a8a" stroke-width="2" stroke-dasharray="2 5"/><text x="444" y="948">ledger read</text>
    <line x1="580" y1="944" x2="616" y2="944" stroke="#c05b5b" stroke-width="3"/><text x="624" y="948">word and rows</text>
    <line x1="760" y1="944" x2="796" y2="944" stroke="#4a7fb5" stroke-width="3"/><text x="804" y="948">construction</text>
    <text x="950" y="948" font-weight="600" fill="#333">a repository changing does not invalidate a verdict — only its claim's text can</text>
  </g>
</svg>
