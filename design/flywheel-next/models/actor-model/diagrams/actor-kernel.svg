<rect width="1680" height="1000" fill="#fff"/>
<text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">Kernel — an actor is a name over stored state; a host runs it under a lease and remembers nothing</text>
<text x="40" y="57" font-size="12" fill="#666">read mailbox + evidence · pick one clause · one atomic write carries state, consumed messages, outbox and rows · world effects after, at most once</text>

<!-- OPERATOR zone -->
<rect x="40" y="90" width="300" height="230" rx="10" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.4"/>
<text x="56" y="112" font-size="11.5" font-weight="700" fill="#5f6b7a">OPERATOR</text>
<use href="#person" x="100" y="160" color="#8a8a86"/>
<text x="100" y="188" font-size="9.5" fill="#666" text-anchor="middle">chuck</text>
<use href="#wave" x="200" y="160" color="#c05b5b"/>
<text x="200" y="188" font-size="9.5" fill="#666" text-anchor="middle">Discord</text>
<use href="#browser" x="290" y="160" color="#8a8a86"/>
<text x="290" y="188" font-size="9.5" fill="#666" text-anchor="middle">plan page</text>
<rect x="150" y="215" width="100" height="18" rx="9" fill="#c05b5b"/>
<text x="200" y="228" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">yes 2</text>
<text x="200" y="250" font-size="8.5" fill="#999" text-anchor="middle">row 2 of the 07:40 rendering</text>
<use href="#check" x="120" y="268"/>
<text x="185" y="272" font-size="8.5" fill="#999">reaction after the push lands</text>

<!-- CONTROL PLANE zone -->
<rect x="380" y="90" width="900" height="470" rx="10" fill="#eef3f9" stroke="#4a7fb5" stroke-width="1.4"/>
<text x="396" y="112" font-size="11.5" font-weight="700" fill="#3f6d9c">CONTROL PLANE — flywheel-state · main</text>
<text x="396" y="128" font-size="8.5" fill="#999">git-only: files · tracker: an issue per actor, comments as journal · same tables</text>

<!-- actor record group -->
<rect x="400" y="150" width="420" height="180" rx="8" fill="#fff" stroke="#4a7fb5" stroke-width="1.2" stroke-dasharray="4 3"/>
