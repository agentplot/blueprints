<text x="1011" y="305" font-size="8.5" fill="#999" text-anchor="middle">id = parent + kind + key · open twice is once · answered is never re-asked</text>

<!-- record tables -->
<use href="#tbl" x="440" y="400" color="#c05b5b"/>
<text x="440" y="428" font-size="9.5" fill="#666" text-anchor="middle">words</text>
<text x="440" y="441" font-size="8.5" fill="#999" text-anchor="middle">keyed by message id</text>
