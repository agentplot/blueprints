<text x="1200" y="428" font-size="9.5" fill="#666" text-anchor="middle">heartbeats</text>
<text x="1200" y="441" font-size="8.5" fill="#999" text-anchor="middle">hosts/* · one amended commit</text>
<use href="#browser" x="1060" y="400" color="#8a8a86"/>
<text x="1060" y="428" font-size="9.5" fill="#666" text-anchor="middle">status page</text>
<text x="1060" y="441" font-size="8.5" fill="#999" text-anchor="middle">projection · says as of</text>
<text x="640" y="520" font-size="10.5" fill="#3f6d9c" text-anchor="middle">durable · single writer · atomic per write · derivable from list + read</text>
<text x="640" y="538" font-size="8.5" fill="#999" text-anchor="middle">git-only: the push is the compare-and-swap · tracker: the earliest lease comment wins</text>

<!-- centerpiece WRITE -->
<polygon points="830,580 892,640 830,700 768,640" fill="#fffdf6" stroke="#c9962e" stroke-width="2"/>
<text x="830" y="636" font-size="10" font-weight="700" fill="#8a6a1d" text-anchor="middle">WRITE</text>
<text x="830" y="651" font-size="8.5" fill="#a97e26" text-anchor="middle">state · consumed · outbox</text>
<text x="830" y="664" font-size="8.5" fill="#a97e26" text-anchor="middle">reason · evidence</text>

<!-- HOSTS zone -->
<rect x="40" y="720" width="1240" height="180" rx="10" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.4"/>
<text x="56" y="742" font-size="11.5" font-weight="700" fill="#5f6b7a">HOSTS   fetch before every tick · take free roots oldest first · run every actor under the leases held</text>

<text x="60" y="790" font-size="11.5" font-weight="700" fill="#4a7fb5">studio</text>
<use href="#gear" x="150" y="800" color="#4a7fb5"/>
