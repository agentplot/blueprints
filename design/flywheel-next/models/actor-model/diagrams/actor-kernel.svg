<text x="560" y="428" font-size="9.5" fill="#666" text-anchor="middle">ledger</text>
<text x="560" y="441" font-size="8.5" fill="#999" text-anchor="middle">verdicts · append-only</text>
<use href="#tbl" x="680" y="400" color="#7b5cb8"/>
<text x="680" y="428" font-size="9.5" fill="#666" text-anchor="middle">signals · moves</text>
<text x="680" y="441" font-size="8.5" fill="#999" text-anchor="middle">one move per signal</text>
<use href="#tbl" x="810" y="400" color="#8a8a86"/>
<text x="810" y="428" font-size="9.5" fill="#666" text-anchor="middle">notes · report</text>
<text x="810" y="441" font-size="8.5" fill="#999" text-anchor="middle">discussion · problems</text>
