<text x="575" y="263" font-size="8.5" fill="#999" text-anchor="middle">one file per message</text>
<use href="#rows" x="690" y="218"/>
<text x="690" y="250" font-size="9.5" fill="#666" text-anchor="middle">outbox</text>
<text x="690" y="263" font-size="8.5" fill="#999" text-anchor="middle">effects not yet shown</text>
<use href="#key" x="780" y="218" color="#c05b5b"/>
