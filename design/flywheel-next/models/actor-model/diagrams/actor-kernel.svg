<text x="1190" y="841" font-size="8.5" fill="#999" text-anchor="middle">stopped on return</text>

<!-- right cards -->
<rect x="1310" y="150" width="330" height="84" rx="9" fill="#fff" stroke="#c9962e" stroke-width="1.6"/>
<text x="1324" y="174" font-size="11" font-weight="700" fill="#333">a row is an actor awaiting one word</text>
<text x="1324" y="194" font-size="9.5" font-family="monospace" fill="#666">open → answered · decided → parent</text>
<text x="1324" y="214" font-size="9" fill="#a97e26" font-weight="700">opened in the write that made the situation</text>

<rect x="1310" y="260" width="330" height="84" rx="9" fill="#fff" stroke="#c05b5b" stroke-width="1.6"/>
<text x="1324" y="284" font-size="11" font-weight="700" fill="#333">a word is applied exactly once</text>
<text x="1324" y="304" font-size="9.5" font-family="monospace" fill="#666">words/discord-1423581234567890.rec</text>
<text x="1324" y="324" font-size="9" fill="#a34848" font-weight="700">consumed + answered in one write</text>

<rect x="1310" y="370" width="330" height="84" rx="9" fill="#fff" stroke="#2e9e5b" stroke-width="1.6"/>
<text x="1324" y="394" font-size="11" font-weight="700" fill="#333">a world effect is applied at most once</text>
<text x="1324" y="414" font-size="9.5" font-family="monospace" fill="#666">bolt/atlas/b-0142/9/2 → herdr · wt · git</text>
<text x="1324" y="434" font-size="9" fill="#27824c" font-weight="700">result read as evidence before a repeat</text>

<rect x="1310" y="480" width="330" height="84" rx="9" fill="#fff" stroke="#8a8a86" stroke-width="1.6"/>
<text x="1324" y="504" font-size="11" font-weight="700" fill="#333">every host lost at once</text>
<text x="1324" y="524" font-size="9.5" font-family="monospace" fill="#666">stores intact · leases expire · new host lists</text>
<text x="1324" y="544" font-size="9" fill="#5f6b7a" font-weight="700">sessions read as lost · supervision decides</text>

