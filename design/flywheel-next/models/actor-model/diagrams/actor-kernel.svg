<text x="462" y="322" font-size="8.5" fill="#999" text-anchor="middle">a stale epoch is refused</text>

<!-- decision actors -->
<rect x="850" y="150" width="410" height="180" rx="8" fill="#fffdf6" stroke="#c9962e" stroke-width="1.2" stroke-dasharray="4 3"/>
