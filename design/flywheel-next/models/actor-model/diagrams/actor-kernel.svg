<text x="950" y="828" font-size="9.5" fill="#666" text-anchor="middle">last seen 41 m</text>
<text x="950" y="841" font-size="8.5" fill="#999" text-anchor="middle">roots stale · untouched</text>
<use href="#key" x="1070" y="800" color="#c05b5b"/>
<text x="1070" y="828" font-size="9.5" fill="#666" text-anchor="middle">epoch 3</text>
