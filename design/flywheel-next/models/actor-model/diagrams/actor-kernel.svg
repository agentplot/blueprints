<text x="250" y="841" font-size="8.5" fill="#999" text-anchor="middle">3 m · ttl 15 m</text>
<use href="#key" x="370" y="800" color="#c05b5b"/>
<text x="370" y="828" font-size="9.5" fill="#666" text-anchor="middle">roots held</text>
<text x="370" y="841" font-size="8.5" fill="#999" text-anchor="middle">one taker wins</text>
<use href="#gear" x="510" y="800" color="#2e9e5b"/>
<use href="#gear" x="540" y="800" color="#2e9e5b"/>
<text x="525" y="828" font-size="9.5" fill="#666" text-anchor="middle">herdr panes</text>
<text x="525" y="841" font-size="8.5" fill="#999" text-anchor="middle">named by session id · bound 4</text>
<use href="#repo" x="660" y="800" color="#8a8a86"/>
<text x="660" y="828" font-size="9.5" fill="#666" text-anchor="middle">worktrees</text>
<text x="660" y="841" font-size="8.5" fill="#999" text-anchor="middle">wt · one per session</text>

<text x="760" y="790" font-size="11.5" font-weight="700" fill="#8a8a86">mac-mini</text>
<use href="#gear" x="850" y="800" color="#8a8a86"/>
<text x="850" y="828" font-size="9.5" fill="#666" text-anchor="middle">tick</text>
