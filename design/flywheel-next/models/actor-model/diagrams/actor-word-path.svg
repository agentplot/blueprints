<text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">The word — one reply becomes one record keyed by its message id, consumed by one decision actor in one write; delivered twice, applied once</text>
<text x="40" y="57" font-size="12" fill="#666">yes 2 at 07:41 on unit atlas · status-writer — every lane is a store or an actor, every event a record; the trace holds across a restart and a duplicate</text>

