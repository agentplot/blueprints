# The domain's atoms: every question a definition may ask of evidence and
# every act it may perform on the world, by abstract name only. A profile
# binding (bindings/*.yaml) maps each name to a real operation. The engine
# evaluates names through this registry and has no branch on any of them.
#
# Naming: <object>.<question> for evidence, <object>.<verb> for effects.
# Args are positional in definitions: `place.current(self.place, self.line)`.
# `self` is the acting actor; `parent`, `child(kind)`, `msg` are bound by
# the engine when a clause fires.

version: 1

evidence:
  # kernel — read through the control plane's Read and List
  actor.state:            {args: [actor-id], returns: state-name}
  actor.field:            {args: [actor-id, field], returns: value}
  actor.children:         {args: [actor-id, kind, states], returns: list of actor-ids in those states}
  actor.count:            {args: [actor-id, kind, states], returns: integer}
  decision.open:          {args: [decision-id], returns: bool}
  lease.holder:           {args: [actor-id], returns: host-id or none, with epoch}
  lease.expired:          {args: [actor-id], returns: bool, by the profile's stated rule}
  host.heartbeat-age:     {args: [host-id], returns: seconds}
  host.bound:             {args: [host-id], returns: integer}
  host.running:           {args: [host-id], returns: count of sessions in starting|working|idle|blocked owned by the host}
  host.next-requested:    {args: [host-id], returns: the first session actor in `requested` by (request-seq)}
  cadence.due:            {args: [cron-expr, last-run], returns: bool}
  clock.now:              {args: [], returns: point in time}
  operator.last-rendering: {args: [], returns: {point, rows: {number: decision-id}}}
  operator.since:         {args: [point], returns: terminal transitions after the point}

  # lines and places — read from the repository on the host and its shared line
  line.exists:            {args: [repo, line], returns: bool}
  line.head:              {args: [repo, line], returns: sha}
  line.contains:          {args: [repo, line, sha], returns: bool, "line has sha as ancestor"}
  line.behind-parent:     {args: [repo, line, parent-line], returns: bool}
  place.exists:           {args: [place], returns: bool}
  place.current:          {args: [place, line], returns: bool, "place has the line's head as ancestor"}
  place.clean:            {args: [place], returns: bool, "no rebase or merge in progress, no uncommitted change"}
  place.ahead:            {args: [place, line], returns: count of commits the place adds}
  landing.result:         {args: [repo, landing-id], returns: pending|passed|failed with reason}

  # sessions — read from the multiplexer and the place's exit file
  session.process:        {args: [session-id], returns: absent|working|idle}
  session.exits:          {args: [session-id], returns: ordered exit records the session has written, each with its own id}
  session.notes:          {args: [session-id], returns: note records the session has written}
  session.refusals:       {args: [session-id], returns: refusal records the place's hooks wrote}
  session.stalled:        {args: [session-id, bound], returns: bool, "idle longer than bound with no exit written"}
  stage.sessions:         {args: [type, type-version, stage, repo], returns: "the stage's session set: the fixed list, or the rule evaluated against the repository (personas.matching)"}
  stage.join-met:         {args: [item-id, stage], returns: bool, "all | any | {count} of the stage's sessions have a terminal exit"}
  stage.verdict:          {args: [item-id, stage], returns: done|not-done, "the stage's exit set read by the type's verdict rule"}
  place.published-ref:    {args: [place], returns: sha or none, "the last published head of the place (refs/places/<place>)"}

  # blueprints, claims, ledger, as-built
  claims.standing:        {args: [], returns: "{claim-name: {version, scope, lock}} as of the blueprints' shared line"}
  claims.proposed:        {args: [intent-id], returns: same shape, as of the intent's line}
  claim.scope-includes:   {args: [claim-name, repo], returns: bool}
  ledger.verdicts:        {args: [repo], returns: "latest verdict per claim, each with claim-version, revision, verdict, evidence-ref, date"}
  ledger.backlog:         {args: [repo], returns: "claims in scope with no satisfied or not-applicable verdict at the standing version, plus verdicts whose evidence-ref is gone"}
  ledger.digest:          {args: [repo], returns: "hash over backlog + open redo requests + unrouted asks naming the repo + claim moves against open bolts"}
  asbuilt.statements:     {args: [repo, revision], returns: "statements each naming claim@version"}
  instructions.version:   {args: [], returns: sha of the instruction set on the blueprints' shared line}
  personas.matching:      {args: [repo, pattern], returns: list of persona definitions found in the repository being worked}
  manifest.repo:          {args: [repo], returns: "{kind, shared-line, landing-policy, take-cadence, capabilities}"}
  manifest.repos:         {args: [], returns: list of tracked repos}

  # signals
  signals.unmoved:        {args: [], returns: signals with no move, with count and age by source}
  signals.of:             {args: [intent-id], returns: signals whose move targets the intent}
  capture.exists:         {args: [source-event-key], returns: bool}

  # words
  words.for:              {args: [decision-id], returns: word records addressed to the decision, each with id, who, when, answer}
  dictations.pending:     {args: [], returns: dictation records not yet applied}

effects:
  # kernel — every effect is written with identity <actor>/<seq>/<n>; a repeat changes nothing
  actor.spawn:            {args: [kind, actor-id, initial-fields], note: "creates the actor in its initial state; no-op if it exists"}
  actor.send:             {args: [actor-id, message-kind, payload], note: "appends to the target's mailbox; the message id is the effect id; a target that has consumed the sender's seq drops it"}
  actor.set:              {args: [field, value]}
  decision.open:          {args: [kind, key, payload], note: "spawns decision/<self>/<kind>[/<key>] in `open`; no-op if it exists in any state"}
  decision.amend:         {args: [kind, key, payload]}
  decision.withdraw:      {args: [kind, key]}
  note.append:            {args: [actor-id, who, text]}
  report.append:          {args: [severity, reason, evidence], note: "the machinery's own problems; never work (requirement 70)"}
  lease.take:             {args: [actor-id, host-id], note: "succeeds for exactly one taker; the loser learns it lost"}
  lease.release:          {args: [actor-id]}
  heartbeat.renew:        {args: [host-id]}
  rendering.mark:         {args: [point, rows], note: "records the rendering the operator received"}
  plan.present:           {args: [rendering]}
  status.project:         {args: [], note: "rewrites the status projection from list+read; never read back as truth"}

  # lines and places
  line.ensure:            {args: [repo, line, parent-line], note: "creates the branch at the parent's head if absent"}
  line.take-parent:       {args: [repo, line, parent-line], note: "merges the parent into the line; returns clean|conflict; conflict leaves the line untouched"}
  line.remove:            {args: [repo, line]}
  place.ensure:           {args: [repo, line, place, "at-ref?"], note: "wt worktree at the line's head — or at at-ref, the place's published ref, when given — hooks installed, ports tethered; no-op if present and current"}
  place.rebase:           {args: [place, line], note: "returns clean|conflict; conflict aborts and leaves the place as it was"}
  place.merge-into-line:  {args: [place, line], note: "one at a time per line; returns clean|conflict"}
  place.remove:           {args: [place], note: "ends tethered processes, removes the worktree"}
  place.publish:          {args: [place], note: "pushes the place's head to refs/places/<place>; idempotent by ref; a takeover host makes the place there"}
  landing.start:          {args: [repo, line, policy, landing-id], note: "pull request through gates, or direct merge; idempotent on landing-id"}
  archive.change:         {args: [repo, line, change], note: "OpenSpec archive on the line: proposed claims become standing text"}
  chore.merge:            {args: [repo, place, line], note: "a chore's place into its line; the shared line goes through landing.start"}

  # sessions
  session.start:          {args: [session-id, place, work-order, instruction-version], note: "herdr pane named by the session id; success is judged by session.process, never by the command's return"}
  session.deliver:        {args: [session-id, kind, text], note: "an answer or a note, handed over only while idle"}
  session.stop:           {args: [session-id]}
  work-order.render:      {args: [session-id, template, inputs], note: "the closed input set, written into the place"}

  # ledger, signals, records
  verdict.record:         {args: [repo, claim, claim-version, revision, verdict, evidence-ref, judged-by]}
  signal.append:          {args: [capture-id, signal]}
  capture.record:         {args: [source-event-key, capture]}
  move.record:            {args: [signal-id, move, target, reason]}
  word.consume:           {args: [word-id], note: "marks the word applied; part of the same write as the transition it caused"}
