# Unit types: the machine that takes a unit from approved to landed
# (requirement 33, 37, 48, 49). The work-item actor reads the pinned version.
# A type composed only of existing atoms is added with no code change (S26).
#
# stage fields:
#   sessions — a fixed list of {persona, template}, or {rule: personas.matching, pattern}
#   join     — all | any | {count: n}
#   verdict  — how the stage's exit set is read: `any-not-done` (one not-done exit sends back),
#              `all-done`, or `majority`
#   back-to  — the stage an item returns to when judged not done
#   records-verdict — this stage's exits may carry verdicts for the ledger
version: 3
types:
  default:
    version: 3
    change-directory: true
    retry-bound: 2
    lands-on: bolt-line
    stages:
      - name: spec
        sessions: [{persona: spec-writer, template: spec-writing}]
        join: all
        verdict: all-done
        back-to: spec
      - name: build
        sessions: [{persona: builder, template: build}]
        join: all
        verdict: all-done
        back-to: build
      - name: review
        sessions: [{persona: reviewer, template: code-review}]
        join: all
        verdict: any-not-done
        back-to: build
        records-verdict: true
  fast:
    version: 2
    change-directory: true
    retry-bound: 1
    lands-on: bolt-line
    stages:
      - name: build
        sessions: [{persona: builder, template: build}]
        join: all
        verdict: all-done
        back-to: build
      - name: review
        sessions: [{persona: reviewer, template: code-review}]
        join: all
        verdict: any-not-done
        back-to: build
        records-verdict: true
  chore:
    version: 1
    change-directory: false
    retry-bound: 1
    lands-on: raised-line          # the bolt's line when raised there, the shared line otherwise (requirement 52)
    stages:
      - name: fix
        sessions: [{persona: fixer, template: chore}]
        join: all
        verdict: all-done
        back-to: fix
        records-verdict: true      # a chore may satisfy a claim (requirement 56)
  persona-tested:
    # the operator's example from S26: test runs one session per persona definition in the repository
    version: 1
    change-directory: true
    retry-bound: 2
    lands-on: bolt-line
    stages:
      - name: build
        sessions: [{persona: builder, template: build}]
        join: all
        verdict: all-done
        back-to: build
      - name: test
        sessions: {rule: personas.matching, pattern: "personas/*.md", template: test}
        join: all
        verdict: any-not-done
        back-to: build
        records-verdict: true
