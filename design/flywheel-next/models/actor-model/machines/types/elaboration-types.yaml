# Elaboration types: how an elaboration ends (requirement 22). The
# elaboration actor reads `ending`; everything else is what the session is
# given. Adding a type is a new entry here, no code (requirement 73).
version: 1
types:
  research:
    ending: self-closing
    template: research          # the type skill and work-order template in the instruction set
    deliverable: a finding note in the change directory
    restart-bound: 2
    stall-bound: 45m
  writing:
    ending: self-closing
    template: writing
    deliverable: chapter, claim and context map in one commit (requirement 107)
    restart-bound: 2
    stall-bound: 45m
  prototype-note:
    ending: self-closing
    template: prototype
    deliverable: a note with the answer; the throwaway is not kept
    restart-bound: 1
    stall-bound: 90m
  prototype:
    ending: standing
    template: prototype
    deliverable: a running prototype in the place, its servers tethered to the place
    restart-bound: 0            # never restarted by the machinery (requirement 23)
    stall-bound: none
  exploration:
    ending: standing
    template: exploration
    restart-bound: 0
    stall-bound: none
  interactive:
    ending: standing
    template: interactive
    deliverable: a served page in the place
    restart-bound: 0
    stall-bound: none
  with-operator:
    ending: with-operator
    template: conversation
    restart-bound: 0
    stall-bound: none
