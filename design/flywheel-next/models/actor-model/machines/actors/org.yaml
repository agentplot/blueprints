actor: org
version: 1
doc: >
  The root supervisor, one per organization. It owns the manifest's list of
  repositories, spawns a `repo` actor per tracked repository, the one
  `curation` and the one `operator`, and watches hosts. Its lease is the one
  root lease that is taken over automatically on expiry, because the org
  runs no session and single-writer fencing makes a double run harmless.
supervisor: null
lease: root
fields:
  name: organization name
  scope: the explicit, disjoint object scope this flywheel owns (requirement 83)
  takeover: never | after <duration>; default never
states:
  running: {class: in-progress}
initial: running
decisions:
  host-stale:
    class: attention
    key: "host-id + lease-epoch"
    answers: [takeover, wait]
    opened-by: a host's heartbeat is older than the lease TTL while it holds root leases
    retracted-by: the host's heartbeat is fresh again
    row: "host mac-mini last seen 41m · holds wi-#418 → takeover on studio · wait"
receive:
  - in: running
    on: tick
    when: ["exists repo in manifest.repos() with no actor repo/<repo>"]
    to: same
    effects: ["actor.spawn(repo, repo/<repo>, manifest.repo(repo))"]
  - in: running
    on: tick
    when: ["not exists actor curation/org"]
    to: same
    effects: ["actor.spawn(curation, curation/org, {})", "actor.spawn(operator, operator/org, {})"]
  - in: running
    on: tick
    when: ["exists host h: host.heartbeat-age(h) > lease-ttl and h holds a root lease", "not decision.open(self/host-stale/<h>+<epoch>)"]
    to: same
    effects: ["decision.open(host-stale, <h>+<epoch>, {host: h, holds: leases of h})"]
  - in: running
    on: tick
    when: ["decision.open(self/host-stale/<h>+<epoch>)", "host.heartbeat-age(h) <= lease-ttl"]
    to: same
    effects: ["decision.withdraw(host-stale, <h>+<epoch>)"]
  - in: running
    on: decided
    when: ["msg.kind == host-stale", "msg.answer == takeover"]
    to: same
    effects: ["actor.send(host/<target>, takeover, {from: msg.host, epoch: msg.epoch})"]
    note: the target host is the one the word names, or the freshest host
  - in: running
    on: tick
    when: ["self.takeover != never", "exists host h expired past self.takeover"]
    to: same
    effects: ["actor.send(host/<freshest>, takeover, {from: h, epoch: e})"]
  - in: running
    on: unappliable
    to: same
    effects: [actor.send(operator, unappliable, msg)]
supervision:
  repo: {on-lost: ignore, note: repos have no runtime attachment}
  host: {on-lost: escalate, note: the operator says takeover or wait}
