actor: elaboration
version: 1
doc: >
  One unit of design work: one session, one conversation, one place off the
  intent's line (requirement 21). The type decides how it ends
  (types/elaboration-types.yaml): self-closing ends itself; standing waits for
  the word; with-operator is neither ended nor asked about. The clauses below
  read the type's `ending` field; adding a type is a change to that file.
supervisor: intent
lease: inherited
fields:
  type: elaboration type name and version
  brief: the job
  place: elab/<id>
  session: session actor id
  source: the finding or dictation it came from, if any
  instruction-version: sha of the instruction set at start
  idle-since: point
states:
  proposed:  {class: waiting-on-operator, doc: listed on the intent's proposal row; not work}
  approved:  {class: queued}
  placing:   {class: queued, doc: line and place being prepared by the machinery}
  running:   {class: in-progress}
  blocked:   {class: waiting-on-operator}
  idle:      {class: waiting-on-operator, doc: standing type only — the finish-or-keep row}
  attended:  {class: in-progress, doc: with-operator type — idle but the operator is present; no row}
  merging:   {class: in-progress}
  finished:  {class: done, terminal: true}
  dropped:   {class: done, terminal: true}
initial: proposed
decisions:
  idle:
    class: decide
    key: idle-since
    answers: [finish, keep]
    opened-by: a standing session goes idle
    retracted-by: the session is working again
    row: "idle prototype plan-derivation · standing · idle 14h · intent atlas-provider-limits → finish · keep"
  answer:
    class: answer
    key: question hash
    answers: [text]
    opened-by: the session exits blocked on a question
    retracted-by: the elaboration is dropped
receive:
  - in: approved
    on: tick
    when: ["line.exists(books, parent.line)"]
    to: placing
    effects: ["line.take-parent(books, parent.line, shared) if line.behind-parent", "place.ensure(books, parent.line, self.place)"]
    note: a line takes its parent at least when a place is first made off it (requirement 43)
  - in: placing
    on: tick
    when: ["place.exists(self.place)", "place.current(self.place, parent.line)", "place.clean(self.place)"]
    to: running
    effects:
      - "actor.set(instruction-version, instructions.version())"
      - "actor.spawn(session, session/<self.id>/<n>, {place: self.place, line: parent.line, order: work-order for self.type, instruction-version}) in requested"
    note: no session starts in a place that is behind its line (invariant I16)
  - in: running
    on: session.exited
    when: ["msg.kind == done", "type.ending == self-closing"]
    to: merging
    effects: ["actor.send(self.session, retire)"]
  - in: merging
    on: tick
    when: ["place.clean(self.place)"]
    to: finished
    effects: ["place.merge-into-line(self.place, parent.line)", "place.remove(self.place)"]
    note: a self-closing place merges into the intent's line and is removed (requirement 47, S34)
  - in: running
    on: session.idle
    when: ["type.ending == standing"]
    to: idle
    effects: ["actor.set(idle-since, msg.at)", "decision.open(idle, msg.at, {idle-since: msg.at})"]
  - in: idle
    on: session.working
    to: running
    effects: ["decision.withdraw(idle, self.idle-since)"]
  - in: idle
    on: decided
    when: ["msg.kind == idle", "msg.answer == keep"]
    to: running
    effects: []
    note: a later idle opens a new row keyed by its own idle-since; the prototype keeps running (S2)
  - in: idle
    on: decided
    when: ["msg.kind == idle", "msg.answer == finish"]
    to: merging
    effects: ["actor.send(self.session, retire)"]
  - in: running
    on: session.idle
    when: ["type.ending == with-operator"]
    to: attended
    effects: []
  - in: attended
    on: session.working
    to: running
    effects: []
  - in: [running, attended, idle]
    on: decided
    when: ["msg.kind == finish"]
    to: merging
    effects: ["actor.send(self.session, retire)"]
    note: a dictated finish, the only way a with-operator elaboration ends
  - in: running
    on: session.exited
    when: ["msg.kind == blocked"]
    to: blocked
    effects: ["decision.open(answer, hash(msg.question), {question: msg.question, session: self.session})", "note.append(self, session, msg.question)"]
  - in: blocked
    on: decided
    when: ["msg.kind == answer"]
    to: running
    effects: ["note.append(self, operator, msg.text)", "actor.send(self.session, resume, {answer: msg.text})"]
    note: the same session if it still lives, otherwise a fresh one started with the answer (requirement 59) — the session actor decides which
  - in: [running, idle, attended, blocked]
    on: session.lost
    when: ["type.ending == self-closing"]
    to: placing
    effects: ["report.append(warn, 'session lost', msg)"]
    note: bounded by the type's restart bound; past it, escalate as `answer` with the question "restart or drop?"
  - in: [running, idle, attended, blocked]
    on: session.lost
    when: ["type.ending != self-closing"]
    to: same
    effects: ["decision.open(answer, 'lost/' + msg.at, {question: 'standing session lost its process; restart in place, or finish?'})", "report.append(warn, 'standing session lost', msg)"]
    note: a standing session is never ended by the machinery because a restart forgot it (requirement 23)
  - in: [running, idle, attended, blocked]
    on: line-moved
    to: same
    effects: ["actor.send(self.session, rebase-when-idle, {line: parent.line})"]
  - in: [proposed, approved, placing]
    on: decided
    when: ["msg.kind == drop"]
    to: dropped
    effects: []
supervision:
  session: {on-lost: restart-bounded, bound: type.restart-bound, note: self-closing only; standing and with-operator escalate to the operator}
