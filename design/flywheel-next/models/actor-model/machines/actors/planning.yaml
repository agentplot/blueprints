actor: planning
version: 1
doc: >
  One per built repository. It runs when the repository's backlog digest
  differs from the digest at its last run — a claim in scope became standing,
  a verdict was recorded or fell stale, an ask or finding was routed here, a
  unit came back for redo, or a claim moved under an open bolt. The digest is
  derived from the ledger and the standing claims on every tick, so no
  message is needed to notice a change; messages only shorten the wait.
  The session sees every open bolt of the repository (requirement 26).
supervisor: repo
lease: root
fields:
  repo: built repository name
  last-digest: ledger.digest at the start of the last run, or none
  running-digest: digest the current run started from
  requests: routed findings, asks and redo notes not yet proposed
  session: session id while running
states:
  idle:     {class: none}
  running:  {class: in-progress}
  applying: {class: in-progress}
initial: idle
decisions:
  baseline:
    class: approve
    answers: [yes, pick, later]
    opened-by: the first run for a repository whose ledger was empty
    retracted-by: never on its own; the operator answers
    row: "baseline new-repo · 11 claims unmet · 8 chores · 3 units → yes · pick · later"
receive:
  - in: idle
    on: tick
    when: ["ledger.digest(self.repo) != self.last-digest"]
    to: running
    effects:
      - "actor.set(running-digest, ledger.digest(self.repo))"
      - "place.ensure(built, shared, planning/<repo>/<n>)"
      - "actor.spawn(session, session/<self.id>/<n>, {place, line: shared, order: {job: planning, backlog: ledger.backlog(repo), verdicts: ledger.verdicts(repo), asbuilt: asbuilt.statements(repo, head), open-bolts: actor.children(repo, bolt, [open, closable]) with their units and claims, requests: self.requests, baseline: ledger.verdicts(repo) empty}, instruction-version: instructions.version()}) in requested"
    note: planning is a session of its own (requirement 25). It reads the backlog, the as-built and the open bolts and proposes units, each naming a target bolt.
  - in: [idle, running]
    on: [route, redo, bolt.landed]
    to: same
    effects: ["actor.set(requests, requests + msg)"]
    note: the request enters the digest, so a run follows; a run already going will be followed by another because the digest moved
  - in: running
    on: session.exited
    when: ["msg.kind == done"]
    to: applying
    effects: ["actor.set(deliverables, msg.deliverables)"]
  - in: applying
    on: tick
    when: ["deliverables.baseline == false"]
    to: idle
    effects:
      - "for each verdict v in deliverables.verdicts: verdict.record(repo, v.claim, v.claim-version, v.revision, v.verdict, v.evidence, self.session)"
      - "for each unit u in deliverables.units: actor.spawn(unit, unit/<repo>/<u.target>/<u.name>, {type: u.type, target: u.target, deps: u.deps, document: u.document, claims: u.claims, source: u.source}) in proposed"
      - "for each chore c in deliverables.chores: actor.spawn(offer, offer/<self.session>/<c.id>, {kind: chore, text, repo, line: shared}) in offered"
      - "actor.set(requests, requests without those the proposal answered)"
      - "actor.set(last-digest, self.running-digest)"
      - "place.remove(planning place)"
      - "actor.send(self.session, retire)"
    note: >
      verdicts a planning session makes (scope judgments, not-applicable, satisfied-by-existing-code) are
      recorded here once; they are reused until the claim's version moves (requirement 88, S10, S11).
      last-digest is the digest at the run's start, so anything that moved during the run makes the next
      digest differ and planning runs again.
  - in: applying
    on: tick
    when: ["deliverables.baseline == true"]
    to: idle
    effects:
      - "for each verdict: verdict.record(…)"
      - "decision.open(baseline, none, {units: deliverables.units, chores: deliverables.chores, unmet: count})"
      - "actor.set(last-digest, self.running-digest)"
      - "place.remove(planning place)"
      - "actor.send(self.session, retire)"
    note: the unsatisfied set is offered as one proposal (requirement 91)
  - in: idle
    on: decided
    when: ["msg.kind == baseline", "msg.answer in [yes, pick]"]
    to: same
    effects:
      - "for each unit u chosen: actor.spawn(unit, …, {approved-by: msg.word-id}) in approved (target: {new: proposed name} or the open bolt)"
      - "for each chore c chosen: actor.spawn(offer, …, {kind: chore, accepted: true}) in accepted and actor.send(repo, chore.accepted, …)"
  - in: running
    on: session.exited
    when: ["msg.kind in [stalled, blocked]"]
    to: idle
    effects: ["report.append(warn, 'planning session ' + msg.kind, msg)", "actor.send(self.session, retire)"]
    note: last-digest is unchanged, so the run is retried on the next tick
  - in: running
    on: session.lost
    to: idle
    effects: ["report.append(warn, 'planning session lost', msg)"]
supervision:
  session: {on-lost: restart-bounded, bound: "2"}
