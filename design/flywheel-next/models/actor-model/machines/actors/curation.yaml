actor: curation
version: 1
doc: >
  The one actor that reads signals. It never batches them itself: it is
  charged on a cadence or when unmoved signals exceed a threshold, runs one
  curation session with a bounded job, and applies what the session delivered
  — moves for every signal it judged, and proposed intents. It never opens an
  intent (requirement 97). A person writing the same records by hand is also
  curation and needs no session.
supervisor: org
lease: root
fields:
  cadence: cron
  threshold: unmoved signal count that charges a run
  last-run: point
  session: session id while running
states:
  idle:     {class: none}
  running:  {class: in-progress}
  applying: {class: in-progress}
initial: idle
receive:
  - in: idle
    on: tick
    when: ["signals.unmoved() non-empty", "cadence.due(self.cadence, self.last-run) or count(signals.unmoved()) >= self.threshold"]
    to: running
    effects:
      - "place.ensure(books, shared, curation/<n>)"
      - "actor.spawn(session, session/<self.id>/<n>, {place, line: shared, order: {job: curation, signals: ids of signals.unmoved(), index: claims.standing() + open intents}, instruction-version: instructions.version()}) in requested"
    note: claims are the index it clusters against (requirement 95); the job names the exact signal ids so the session's inputs are closed
  - in: running
    on: session.exited
    when: ["msg.kind == done"]
    to: applying
    effects: ["actor.set(deliverables, msg.deliverables)"]
  - in: applying
    on: tick
    to: idle
    effects:
      - "for each move m in deliverables.moves: move.record(m.signal, m.move, m.target, m.reason)"
      - "for each proposed intent p in deliverables.intents: actor.spawn(intent, intent/<p.subject>, {subject, signals: p.signals, proposed-elaborations: p.elaborations, challenges: p.challenges}) in proposed"
      - "for each attach: actor.send(intent, evidence, {signal})"
      - "for each challenge: note.append(intent or planning of the claim's repos, curation, 'challenge: ' + signal)"
      - "actor.set(last-run, clock.now())"
      - "place.remove(curation place)"
      - "actor.send(self.session, retire)"
    note: every signal the session judged now has exactly one standing move (requirement 94); the plan shows one row per proposed intent (requirement 96, S8)
  - in: running
    on: session.exited
    when: ["msg.kind in [stalled, blocked]"]
    to: idle
    effects: ["report.append(warn, 'curation session ' + msg.kind, msg)", "actor.send(self.session, retire)"]
    note: a curation run that cannot finish leaves the signals unmoved; they are never discarded (requirement 105)
  - in: running
    on: session.lost
    to: idle
    effects: ["report.append(warn, 'curation session lost', msg)"]
supervision:
  session: {on-lost: restart-bounded, bound: "1"}
