actor: work-item
version: 1
doc: >
  One task of a unit, worked through the stages of the unit's type by
  sessions in one place off the bolt's line. The type (types/unit-types.yaml)
  names each stage's sessions, the stage an item returns to when judged not
  done, the retry bound, and the join rule. This actor reads the pinned
  type version and never the current one (requirement 49).
supervisor: unit
lease: inherited
fields:
  order: the item's task from the unit document
  type: unit type name
  type-version: pinned
  stage: current stage name
  stage-seq: increments per stage entry; part of session ids
  sessions: session ids of the current stage set
  ran: every session that ran, by stage, with exits (requirement 48)
  send-backs: "[{from stage, to stage, at, reason}]"
  retries: count of send-backs and conflict retries
  blocks: "[{stage, question, answer, at}]; how often the type and stage block is derived from this"
  place: wi/<id>
  rebase-pending: line or none
  claims: claim@version named by the work (from the order)
states:
  queued:    {class: queued}
  placing:   {class: queued}
  staged:    {class: in-progress, doc: sessions of the current stage running}
  judging:   {class: in-progress, doc: the stage's join rule is met; exits are read as one set}
  blocked:   {class: waiting-on-operator}
  conflict:  {class: in-progress, doc: a rebase or merge conflicted; the session has the job}
  stopped:   {class: waiting-on-operator, doc: the retry bound is spent}
  merge-ready: {class: queued}
  merging:   {class: in-progress}
  merged:    {class: done, terminal: true}
  dropped:   {class: done, terminal: true}
initial: queued
decisions:
  answer:
    class: answer
    key: question hash
    answers: [text]
    opened-by: a stage session exits blocked on a question
    retracted-by: the item is dropped
    row: "blocked wi-#418 build · plan-rows · \"should Ready imply Backlog cleared?\" · session alive → reply on page"
  stopped:
    class: decide
    key: retries
    answers: [retry, drop]
    opened-by: send-backs or conflict retries exceed the type's bound
    retracted-by: the item is dropped
    row: "stopped wi-#418 · review sent back 3× · bound 2 → retry · drop"
receive:
  - in: queued
    on: go
    to: placing
    effects:
      - "line.take-parent(built, bolt.line, shared) if line.behind-parent and no place exists off the line yet"
      - "place.ensure(built, bolt.line, self.place)"
    note: the machinery prepares the place and hands it over (requirement 38, 39)
  - in: placing
    on: tick
    when: ["place.exists(self.place)", "place.current(self.place, bolt.line)", "place.clean(self.place)"]
    to: staged
    effects:
      - "actor.set(stage-seq, stage-seq + 1)"
      - "actor.set(sessions, for each s in stage.sessions(resolved by stage.set rule): session/<self.id>/<stage>-<stage-seq>-<s.persona>)"
      - "for each: actor.spawn(session, id, {place: self.place, line: bolt.line, order: self.order + stage + persona, instruction-version: instructions.version()}) in requested"
      - "actor.set(ran, ran + {stage, sessions})"
    note: "a stage may run several sessions over the same work; the set is a fixed list or a rule read against the repository (requirement 48, S26). Personas: personas.matching(repo, stage.pattern)."
  - in: staged
    on: session.exited
    when: ["msg.kind == blocked"]
    to: blocked
    effects: ["actor.set(blocks, blocks + {stage, question: msg.question, at})", "decision.open(answer, hash(msg.question), {question, stage, session: msg.session, alive: true})", "note.append(self, msg.session, msg.question)"]
    note: only this item waits; every other item, unit and bolt continues (requirement 59, S30)
  - in: blocked
    on: decided
    when: ["msg.kind == answer"]
    to: staged
    effects: ["actor.set(blocks[last].answer, msg.text)", "note.append(self, operator, msg.text)", "actor.send(msg.session, resume, {answer: msg.text})"]
  - in: staged
    on: session.exited
    when: ["msg.kind in [done, stalled]", "stage.join not yet met over self.sessions"]
    to: same
    effects: ["actor.set(ran[stage].exits, +msg)"]
  - in: staged
    on: session.exited
    when: ["msg.kind in [done, stalled]", "stage.join met over self.sessions (all | any | count)"]
    to: judging
    effects: ["actor.set(ran[stage].exits, +msg)", "for each session in self.sessions not exited: actor.send(s, retire)"]
  - in: judging
    on: tick
    when: ["stage.verdict(exits) == done", "stage.records-verdict"]
    to: same
    effects: ["for each verdict v in exits: verdict.record(repo, v.claim, v.claim-version, v.revision, v.verdict, v.evidence, session)"]
    note: the ledger is written here — from a session's judgment, by the machinery, with the inputs it was made from (requirement 87)
  - in: judging
    on: tick
    when: ["stage.verdict(exits) == done", "stage has a next stage"]
    to: placing
    effects: ["actor.set(stage, next stage)", "for each session: actor.send(s, retire)"]
  - in: judging
    on: tick
    when: ["stage.verdict(exits) == done", "stage is last"]
    to: merge-ready
    effects: ["for each session: actor.send(s, retire)", "actor.send(bolt, merge-request, {item: self.id})"]
  - in: judging
    on: tick
    when: ["stage.verdict(exits) == not-done", "self.retries < type.retry-bound"]
    to: placing
    effects: ["actor.set(send-backs, +{from: stage, to: stage.back-to, reason})", "actor.set(retries, retries + 1)", "actor.set(stage, stage.back-to)", "for each session: actor.send(s, retire)"]
    note: the item's history shows every send-back and the count that permitted it (requirement 37, S14)
  - in: judging
    on: tick
    when: ["stage.verdict(exits) == not-done", "self.retries >= type.retry-bound"]
    to: stopped
    effects: ["decision.open(stopped, retries, {stage, send-backs})"]
  - in: stopped
    on: decided
    when: ["msg.answer == retry"]
    to: placing
    effects: ["actor.set(retries, 0)", "actor.set(stage, stage.back-to)"]
  - in: [staged, blocked]
    on: line-moved
    to: same
    effects: ["for each session: actor.send(s, rebase-when-idle, {line: msg.line})"]
  - in: [staged, blocked]
    on: rebase-conflict
    to: conflict
    effects: ["actor.set(retries, retries + 1)", "session.deliver(msg.session, note, 'the line moved and your place conflicts: ' + msg.files + ' — reconcile in your place and exit done')"]
    note: a conflict never leaves a half-done tree; it becomes a job for the session in that place (requirement 45)
  - in: conflict
    on: session.exited
    when: ["msg.kind == done", "self.retries < type.retry-bound"]
    to: staged
    effects: ["place.rebase(self.place, bolt.line)"]
    note: the take is retried when the session exits done; if it conflicts again the clause above fires again
  - in: conflict
    on: session.exited
    when: ["self.retries >= type.retry-bound"]
    to: stopped
    effects: ["decision.open(stopped, retries, {reason: conflict})"]
  - in: merge-ready
    on: merge-now
    to: merging
    effects: ["place.rebase(self.place, bolt.line)", "place.merge-into-line(self.place, bolt.line)"]
  - in: merging
    on: tick
    when: ["line.contains(built, bolt.line, place head)"]
    to: merged
    effects: ["place.remove(self.place)", "actor.send(bolt, item.merged, {item: self.id})", "actor.send(unit, item.merged, {item: self.id})"]
  - in: merging
    on: tick
    when: ["last place.merge-into-line returned conflict"]
    to: conflict
    effects: ["actor.send(bolt, item.merge-conflict, {item: self.id})", "actor.set(stage-seq, +1)", "spawn one session of the last stage's first persona with the conflict job in requested"]
  - in: conflict
    on: session.exited
    when: ["msg.kind == done", "self.state entered from merging"]
    to: merge-ready
    effects: ["actor.send(bolt, merge-request, {item: self.id})"]
  - in: [staged, blocked, conflict]
    on: session.lost
    when: ["self.retries < type.retry-bound"]
    to: placing
    effects: ["actor.set(retries, retries + 1)", "report.append(warn, 'session lost; restarting the stage in the same place', msg)"]
    note: the place survives on the host's disk; a takeover host makes a fresh place at the line's head (S13)
  - in: [staged, blocked, conflict]
    on: session.lost
    when: ["self.retries >= type.retry-bound"]
    to: stopped
    effects: ["decision.open(stopped, retries, {reason: lost})"]
  - in: "*"
    on: drop
    to: dropped
    effects: ["for each session: actor.send(s, retire)", "place.remove(self.place)", "decision.withdraw(every open decision)"]
supervision:
  session: {on-lost: restart-bounded, bound: type.retry-bound}
