actor: decision
version: 1
doc: >
  A plan row is an actor awaiting one message from the operator. Its id is
  <parent>/<kind>[/<key>], so the parent's `decision.open` effect is idempotent
  and an answered decision can never be re-asked (requirement 5, S1). The word
  is a message; the answer travels back to the parent as `decided`. The plan is
  the list of decision actors in `open` (requirement 6, 8); the row's class
  groups it (requirement 10).
presented: true
supervisor: any            # the actor that opened it
lease: inherited
fields:
  kind: the row kind, one of the parent's declared decisions
  class: approve | decide | answer | attention
  key: the situation key, or none
  payload: what the row shows (weight, target bolt, question text, options)
  answers: allowed answers
  answered: "{word-id, who, when, answer} once answered"
states:
  open:      {class: waiting-on-operator, doc: a row on the plan}
  answered:  {class: done, terminal: true}
  withdrawn: {class: done, terminal: true, doc: the decision can no longer be made}
initial: open
receive:
  - in: open
    on: word
    when: ["msg.answer in self.answers"]
    to: answered
    effects:
      - word.consume(msg.word-id)
      - actor.set(answered, msg)
      - "actor.send(parent, decided, {kind: self.kind, key: self.key, answer: msg.answer, text: msg.text, word-id: msg.word-id})"
    note: exactly once — consuming the word and writing `answered` are one write
  - in: open
    on: word
    to: same
    effects:
      - word.consume(msg.word-id)
      - "report.append(attention, answer not among the row's answers, msg)"
  - in: open
    on: amend
    to: same
    effects: [actor.set(payload, msg.payload)]
    note: new material joins the standing row instead of making a second one (requirement 18)
  - in: open
    on: withdraw
    to: withdrawn
    effects: []
  - in: [answered, withdrawn]
    on: word
    to: same
    effects:
      - word.consume(msg.word-id)
      - "actor.send(operator, unappliable, {word-id: msg.word-id, decision: self.id, reason: self.state})"
    note: a word that cannot be applied is reported once under ATTENTION, never dropped (requirement 5, 116)
  - in: [answered, withdrawn]
    on: [amend, withdraw]
    to: same
    effects: []
