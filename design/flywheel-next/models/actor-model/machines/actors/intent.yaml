actor: intent
version: 1
doc: >
  One thread of design work about one subject. Proposed by curation, opened
  by the operator's word, holding at most one elaboration proposal at a time
  (requirement 18), closed only by the word (requirement 19). Its line is a
  branch off the blueprints' shared line; its close lands that line, which is when
  its proposed claims become standing (requirement 42, 47).
supervisor: repo          # the blueprints repo
lease: root
fields:
  subject: the subject
  line: intents/<id>
  signals: signal ids attached, with weight (count, sources, span) for the row
  challenges: standing claims the proposal argues with
  last-take: point of the last line.take-parent
states:
  proposed:  {class: waiting-on-operator, doc: a row; no work exists}
  open:      {class: in-progress}
  closing:   {class: in-progress, doc: the word to close has been given; the archive is the landing of the line}
  closed:    {class: done, terminal: true}
  dropped:   {class: done, terminal: true}
initial: proposed
decisions:
  approve:
    class: approve
    answers: [yes, drop, split]
    opened-by: curation's applying step spawns the intent in `proposed`
    retracted-by: the intent is dropped by dictation
    row: "intent atlas-provider-limits · curation · 7 signals · 3 sources · 12d · elaborations: research (self-closing) · prototype (standing) · challenges claim …"
  propose:
    class: approve
    answers: [yes, drop]
    opened-by: the first `propose-elaboration` message while open with no open proposal
    retracted-by: the intent closes or is dropped
    row: "elaboration <type> on intent <subject> · from finding | dictation"
  close:
    class: decide
    key: "digest of the set of finished elaboration ids"
    answers: [close, keep]
    opened-by: every elaboration is finished or dropped, none proposed, no proposal open
    retracted-by: a new elaboration is proposed on the intent
    row: "close intent loop-granularity · all 4 elaborations done → close · keep open"
  land-failed:
    class: decide
    key: landing-id
    answers: [retry, hold]
    opened-by: the archive's landing failed at the blueprints' gates
    retracted-by: a later landing passes
receive:
  - in: proposed
    on: tick
    when: ["not decision.open(self/approve)", "self.answered-approve == none"]
    to: same
    effects: ["decision.open(approve, none, {signals: self.signals, elaborations: self.proposed-elaborations, challenges: self.challenges})"]
  - in: proposed
    on: decided
    when: ["msg.kind == approve", "msg.answer == yes"]
    to: open
    effects:
      - "line.ensure(blueprints, self.line, shared)"
      - "for each proposed elaboration e: actor.spawn(elaboration, elab/<self.id>/<n>, {type: e.type, brief: e.brief}) in approved"
      - "for each signal s in self.signals: move.record(s, attach, self.id, 'intent approved')"
  - in: proposed
    on: decided
    when: ["msg.kind == approve", "msg.answer == drop"]
    to: dropped
    effects: ["for each signal s: move.record(s, drop, self.id, 'proposed intent dropped by word ' + msg.word-id)"]
    note: the signals are not clustered again unless new signals join them (requirement 104, S23)
  - in: proposed
    on: decided
    when: ["msg.kind == approve", "msg.answer == split"]
    to: dropped
    effects: ["for each group g in msg.text: actor.spawn(intent, intent/<g.subject>, {signals: g.signals}) in proposed", "for each signal: move.record(s, join, new intent, 'split by word')"]
  - in: open
    on: propose-elaboration
    when: ["not decision.open(self/propose)"]
    to: same
    effects: ["actor.set(proposed-elaborations, [msg])", "decision.open(propose, none, {elaborations: [msg]})"]
  - in: open
    on: propose-elaboration
    when: ["decision.open(self/propose)"]
    to: same
    effects: ["actor.set(proposed-elaborations, self.proposed-elaborations + msg)", "decision.amend(propose, none, {elaborations: self.proposed-elaborations + msg})"]
    note: new material joins the standing proposal (requirement 18)
  - in: open
    on: decided
    when: ["msg.kind == propose", "msg.answer == yes"]
    to: same
    effects:
      - "for each e in self.proposed-elaborations: actor.spawn(elaboration, elab/<self.id>/<n>, {type: e.type, brief: e.brief, source: e.source}) in approved"
      - "actor.set(proposed-elaborations, [])"
  - in: open
    on: decided
    when: ["msg.kind == propose", "msg.answer == drop"]
    to: same
    effects: ["actor.set(proposed-elaborations, [])", "for each e with a finding source: actor.send(e.source, outcome, dropped)"]
    note: nothing was created (S4)
  - in: open
    on: tick
    when:
      - "actor.count(self, elaboration, [proposed, approved, placing, running, blocked, idle, attended, merging]) == 0"
      - "actor.count(self, elaboration, [finished]) > 0"
      - "not decision.open(self/propose)"
      - "not decision.open(self/close/<digest>)"
      - "self/close/<digest> was never answered"
    to: same
    effects: ["decision.open(close, digest, {done: finished elaboration count})"]
  - in: open
    on: tick
    when: ["decision.open(self/close/<d>)", "actor.count(self, elaboration, [proposed, approved, placing, running]) > 0"]
    to: same
    effects: ["decision.withdraw(close, d)"]
  - in: open
    on: decided
    when: ["msg.kind == close", "msg.answer == close"]
    to: closing
    effects: []
  - in: open
    on: tick
    when: ["cadence.due(repo.take-cadence, self.last-take)", "no elaboration in placing"]
    to: same
    effects: ["line.take-parent(blueprints, self.line, shared)", "actor.set(last-take, clock.now())"]
  - in: closing
    on: tick
    when: ["not landing pending for self"]
    to: same
    effects:
      - "line.take-parent(blueprints, self.line, shared)"
      - "archive.change(blueprints, self.line, self.change)"
      - "landing.start(blueprints, self.line, repo.landing-policy, self.id + '/' + n)"
    note: the archive moves the intent's OpenSpec change into the standing set on the line; the landing moves the line to shared (requirement 42, 46)
  - in: closing
    on: tick
    when: ["landing.result(blueprints, self.landing) == passed"]
    to: closed
    effects: ["line.remove(blueprints, self.line)", "for each standing elaboration place: place.remove"]
    note: nothing of an intent lives on a branch after it closes (requirement 47); the standing claims now differ, so every built repo's ledger digest moves and planning runs (S27)
  - in: closing
    on: tick
    when: ["landing.result(blueprints, self.landing) == failed"]
    to: same
    effects: ["decision.open(land-failed, self.landing, {reason})"]
  - in: closing
    on: decided
    when: ["msg.kind == land-failed", "msg.answer == retry"]
    to: same
    effects: ["actor.set(landing, none)"]
  - in: [proposed, open]
    on: word.direct
    when: ["msg.state in [dropped, closing]"]
    to: msg.state
    effects: [word.consume(msg.word-id), "decision.withdraw(every open decision of self)"]
    note: the operator acting directly on the state is the word (requirement 3, 143, S19)
supervision:
  elaboration: {on-lost: escalate, note: an elaboration's session loss is the elaboration's own clause by type}
