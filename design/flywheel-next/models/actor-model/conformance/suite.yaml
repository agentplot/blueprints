# Index of the conformance suite. Coverage is by requirement number.
version: 1
operations:            # B.1
  read:            [C01, C13]
  write-effect:    [C02, C12]
  lease:           [C03, C04, C14]
  present-receive: [C05, C06, C07, C17]
  notify:          [C08]
  list:            [C09, C13]
