  - scenarios/C08-notify-bound.yaml
  - scenarios/C09-list-scope.yaml
  - scenarios/C10-status-no-host.yaml
  - scenarios/C11-durable-host-loss.yaml
  - scenarios/C12-atomic-write.yaml
  - scenarios/C13-derivable-restart.yaml
  - scenarios/C14-single-writer-loser-rereads.yaml
  - scenarios/C17-direct-act-is-word.yaml
  - scenarios/D01-s1-approve-from-phone.yaml
