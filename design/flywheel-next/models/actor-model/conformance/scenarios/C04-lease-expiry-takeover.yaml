id: C04
title: an expired lease is visibly stale, untouched until the rule fires, then fenced
exercises: {operations: [lease, serve-status], guarantees: [single-writer]}
profiles: [all]
requirements: [115, 135, 121]
given:
  clock: "2026-09-04T08:00:00Z"
  org: {takeover: never}
  actors:
    - {id: org, state: running, seq: 5, epoch: 1}
    - {id: bolt/atlas/b-0142, state: open, seq: 8, epoch: 3}
    - {id: wi/atlas/b-0142/u-3/1, state: staged, seq: 4, epoch: 3, fields: {stage: build, retries: 0, sessions: [session/wi/atlas/b-0142/u-3/1/build-1-builder]}}
    - {id: session/wi/atlas/b-0142/u-3/1/build-1-builder, state: working, seq: 3, epoch: 3, fields: {host: host/mac-mini, place: wi/atlas/b-0142/u-3/1}}
    - {id: host/studio, state: alive, seq: 1, fields: {bound: 4}}
    - {id: host/mac-mini, state: alive, seq: 1, fields: {bound: 4}}
  leases: [{actor: bolt/atlas/b-0142, holder: host/mac-mini, epoch: 3}, {actor: org, holder: host/studio, epoch: 1}]
  heartbeats: [{host: host/studio, at: "2026-09-04T07:59:00Z"}, {host: host/mac-mini, at: "2026-09-04T07:19:00Z"}]   # 41 minutes ago
  world: {sessions: {}}
when:
  - tick: host/studio
  - {status: read, as: s1}
  - word: {source: discord-1, text: "takeover", who: chuck}
  - tick: host/studio
  - tick: host/studio
  - {write-as: host/mac-mini, actor: wi/atlas/b-0142/u-3/1, epoch: 3, state: judging}   # the returning host's stale write
then:
  after-step-1:
    leases: [{actor: bolt/atlas/b-0142, holder: host/mac-mini, epoch: 3}]      # studio did not take it
    rows: [{id: decision/org/host-stale/host/mac-mini+3, class: attention}]
  status: {s1: {bolt/atlas/b-0142: {holder: host/mac-mini, alive: false, last-seen: 41m}}}
  transitions:
    - {actor: decision/org/host-stale/host/mac-mini+3, from: open, to: answered}
    - {actor: session/wi/atlas/b-0142/u-3/1/build-1-builder, from: working, to: lost}
    - {actor: wi/atlas/b-0142/u-3/1, from: staged, to: placing}
  leases: [{actor: bolt/atlas/b-0142, holder: host/studio, epoch: 4}]
  refused-writes: [{actor: wi/atlas/b-0142/u-3/1, epoch: 3}]
  sessions-started: 1
