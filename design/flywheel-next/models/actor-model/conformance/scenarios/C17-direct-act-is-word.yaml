id: C17
title: the operator acting directly on the state is the word
exercises: {operations: [present-receive, read], guarantees: [word-once]}
profiles: [all]
requirements: [3, 143, S19]
given:
  clock: "2026-09-04T09:00:00Z"
  actors:
    - {id: intent/loop-granularity, state: open, seq: 9, epoch: 2, fields: {line: intents/loop-granularity}}
    - {id: decision/intent/loop-granularity/close/c4d1, state: open, seq: 0, class: decide, answers: [close, keep]}
  leases: [{actor: intent/loop-granularity, holder: host/studio, epoch: 2}]
when:
  - {direct-act: {by: chuck, actor: intent/loop-granularity, set: {state: closing}}}   # a hand commit / a board move / an issue close
  - tick: host/studio
  - tick: host/mac-mini
  - tick: host/studio
then:
  words: [{id: "word/<act id>", who: chuck, decision: none, count: 1}]
  transitions:
    - {actor: intent/loop-granularity, from: open, to: closing, consumed: ["word/<act id>"]}
    - {actor: decision/intent/loop-granularity/close/c4d1, from: open, to: withdrawn}
  effects: [{name: line.take-parent}, {name: archive.change}, {name: landing.start}]
  rows: []
  messages-required-from-operator: 0
