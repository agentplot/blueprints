id: C03
title: two hosts take one root; exactly one holds it and the loser reads again
exercises: {operations: [lease], guarantees: [single-writer]}
profiles: [all]
requirements: [115, 121, 135]
given:
  clock: "2026-09-04T07:40:00Z"
  actors:
    - {id: bolt/atlas/b-0143, state: proposed, seq: 0, epoch: 0}
    - {id: bolt/atlas/b-0144, state: proposed, seq: 0, epoch: 0}
    - {id: host/studio, state: alive, seq: 1, fields: {bound: 4}}
    - {id: host/mac-mini, state: alive, seq: 1, fields: {bound: 4}}
  leases: []
  heartbeats: [{host: host/studio, at: "2026-09-04T07:39:00Z"}, {host: host/mac-mini, at: "2026-09-04T07:39:00Z"}]
when:
  - concurrent:                     # both hosts read the same snapshot, then both write
      - {tick: host/studio, only: lease.take}
      - {tick: host/mac-mini, only: lease.take}
  - tick: host/studio
  - tick: host/mac-mini
then:
  leases:
    - {actor: bolt/atlas/b-0143, holders: 1}
    - {actor: bolt/atlas/b-0144, holders: 1}
  distinct-holders: [bolt/atlas/b-0143, bolt/atlas/b-0144]   # the loser moved on to the next free root
  loser: {re-read-before-deciding: true}
  writes-by-loser-on-lost-object: 0
