id: C07
title: a word given before a crash is applied exactly once after the restart
exercises: {operations: [present-receive], guarantees: [word-once, durable]}
profiles: [all]
requirements: [124, I2]
given:
  clock: "2026-09-04T07:40:00Z"
  actors:
    - {id: intent/atlas-provider-limits, state: open, seq: 4, epoch: 1, fields: {proposed-elaborations: [{type: research, brief: rate limits}]}}
    - {id: decision/intent/atlas-provider-limits/propose, state: open, seq: 0, parent: intent/atlas-provider-limits, class: approve, answers: [yes, drop]}
  leases: [{actor: intent/atlas-provider-limits, holder: host/studio, epoch: 1}]
  rendering: {point: "2026-09-04T07:40:00Z", rows: {1: decision/intent/atlas-provider-limits/propose}}
when:
  - word: {source: discord-3, text: "yes 1", who: chuck}
  - crash: host/studio                    # before any tick consumed the word
  - restart: host/studio
  - tick: host/studio
  - crash: host/studio                    # after the decision's write, before the intent's
  - restart: host/studio
  - tick: host/studio
  - tick: host/studio
then:
  transitions:
    - {actor: decision/intent/atlas-provider-limits/propose, from: open, to: answered, consumed: [word/discord-3]}
    - {actor: intent/atlas-provider-limits, from: open, to: open}     # spawns the elaboration
  spawned: [{kind: elaboration, count: 1}]
  messages: [{to: intent/atlas-provider-limits, kind: decided, count: 1}]
  writes-after: 0
