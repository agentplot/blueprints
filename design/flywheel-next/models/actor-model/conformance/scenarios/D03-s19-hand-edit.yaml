id: D03
title: S19 — a hand edit of a state file is the word on every host (git-only)
exercises: {operations: [present-receive, read, notify], guarantees: [word-once]}
profiles: [git-only]
requirements: [S19, 3, 145]
definitions: ../../machines
given:
  clock: "2026-09-04T09:00:00Z"
  actors:
    - {id: repo/blueprints, state: tracked, seq: 1, fields: {kind: blueprints, shared-line: main, landing-policy: direct}}
    - {id: intent/loop-granularity, state: open, seq: 9, epoch: 2, fields: {line: intents/loop-granularity, change: loop-granularity}}
    - {id: elaboration/intent/loop-granularity/1, state: finished, seq: 7, epoch: 2}
    - {id: decision/intent/loop-granularity/close/c4d1, state: open, seq: 0, class: decide, answers: [close, keep]}
    - {id: host/studio, state: alive, seq: 1}
    - {id: host/mac-mini, state: alive, seq: 1}
  leases: [{actor: intent/loop-granularity, holder: host/studio, epoch: 2}]
  world:
    lines: {blueprints: {main: b1, intents/loop-granularity: b2}}
when:
  - {commit: {by: "chuck <chuck@…>", on: main, files: {"actors/intent/loop-granularity/state.rec": {state: closing}}, message: "close it"}}
  - tick: host/mac-mini          # fetches; not the holder; writes nothing
  - tick: host/studio            # fetches; the holder; consumes the word
  - tick: host/studio
then:
  transitions:
    - {actor: intent/loop-granularity, from: open, to: closing, consumed: ["word/<commit sha>"]}
    - {actor: decision/intent/loop-granularity/close/c4d1, from: open, to: withdrawn}
  writes-by: {host/mac-mini: 0}
  effects: [{name: line.take-parent}, {name: archive.change}, {name: landing.start, args: [blueprints, intents/loop-granularity, direct]}]
  commits-on-main-by-host: 1     # one transition commit, rebased on the operator's
