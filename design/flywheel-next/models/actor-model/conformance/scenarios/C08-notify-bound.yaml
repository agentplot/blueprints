id: C08
title: a write on one host reaches another within the bound, and without notify it still converges
exercises: {operations: [notify], guarantees: []}
profiles: [all]
requirements: [117, 150]
given:
  clock: "2026-09-04T07:40:00Z"
  actors:
    - {id: org, state: running, seq: 5, epoch: 1}
    - {id: bolt/atlas/b-0142, state: open, seq: 8, epoch: 3}
    - {id: host/studio, state: alive, seq: 1}
    - {id: host/mac-mini, state: alive, seq: 1}
  leases: [{actor: bolt/atlas/b-0142, holder: host/mac-mini, epoch: 3}, {actor: org, holder: host/studio, epoch: 1}]
when:
  - {write-as: host/mac-mini, actor: bolt/atlas/b-0142, epoch: 3, state: closable, effects: ["decision.open(close, 9f2a, {})"]}
  - {wait-for-notify: host/studio, max: profile.notify-bound}
  - {read-as: host/studio, actor: bolt/atlas/b-0142, as: r1}
  - {notify: off}
  - {write-as: host/mac-mini, actor: bolt/atlas/b-0142, epoch: 3, state: open}
  - {clock: +profile.notify-bound}
  - tick: host/studio
  - {read-as: host/studio, actor: bolt/atlas/b-0142, as: r2}
then:
  reads: {r1: {state: closable}, r2: {state: open}}
  notify-latency: {max: profile.notify-bound}
  full-reread-by-studio: false          # the notify named the object; the poll used since/ls-remote
