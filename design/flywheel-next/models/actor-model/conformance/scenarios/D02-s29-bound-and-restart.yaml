id: D02
title: S29 — three items, host bound two; the third waits, starts once after a restart
exercises: {operations: [lease, write-effect], guarantees: [derivable]}
profiles: [all]
requirements: [S29, 28, 29, 62]
definitions: ../../machines
given:
  clock: "2026-09-04T08:00:00Z"
  actors:
    - {id: repo/atlas, state: tracked, seq: 1, fields: {kind: built, shared-line: main, landing-policy: pull-request, take-cadence: "0 6 * * *"}}
    - {id: bolt/atlas/b-0142, state: open, seq: 8, epoch: 1, fields: {line: bolts/b-0142, merge-queue: [], merging: none, chores: []}}
    - {id: unit/atlas/b-0142/u-1, state: approved, seq: 2, epoch: 1, fields: {type: fast, type-version: 2, deps: [], items: [wi/atlas/b-0142/u-1/1, wi/atlas/b-0142/u-1/2], seq: 1}}
    - {id: wi/atlas/b-0142/u-1/1, state: queued, seq: 0, epoch: 1, fields: {type: fast, type-version: 2, stage: build, retries: 0}}
    - {id: wi/atlas/b-0142/u-1/2, state: queued, seq: 0, epoch: 1, fields: {type: fast, type-version: 2, stage: build, retries: 0}}
    - {id: unit/atlas/b-0142/u-2, state: approved, seq: 2, epoch: 1, fields: {type: fast, type-version: 2, deps: [unit/atlas/b-0142/u-1], items: [wi/atlas/b-0142/u-2/1], seq: 2}}
    - {id: wi/atlas/b-0142/u-2/1, state: queued, seq: 0, epoch: 1, fields: {type: fast, type-version: 2, stage: build, retries: 0}}
    - {id: host/studio, state: alive, seq: 1, fields: {bound: 2}}
  leases: [{actor: bolt/atlas/b-0142, holder: host/studio, epoch: 1}]
  world:
    lines: {atlas: {main: a1, bolts/b-0142: a1}}
    places: {}
    sessions: {}
    place-ensure: immediate        # the stand-in makes a place current and clean on ensure
when:
  - {ticks: {host: host/studio, count: 4}}
  - {assert: {sessions-started: 2, actor-states: {unit/atlas/b-0142/u-2: waiting, wi/atlas/b-0142/u-2/1: queued}}}
  - {world: {exits: {session/wi/atlas/b-0142/u-1/1/build-1-builder: [{kind: done}], session/wi/atlas/b-0142/u-1/2/build-1-builder: [{kind: done}]}}}
  - {ticks: {host: host/studio, count: 6}}     # build → review → merge-ready → merge one at a time → merged
  - {world: {exits: {session/wi/atlas/b-0142/u-1/1/review-1-reviewer: [{kind: done}], session/wi/atlas/b-0142/u-1/2/review-1-reviewer: [{kind: done}]}}}
  - {ticks: {host: host/studio, count: 8}}
  - {assert: {actor-states: {unit/atlas/b-0142/u-1: merged, unit/atlas/b-0142/u-2: building, wi/atlas/b-0142/u-2/1: staged}}}
  - stop: [host/studio]
  - start: host/studio
  - {ticks: {host: host/studio, count: 3}}
then:
  sessions-started: {wi/atlas/b-0142/u-2/1: 1}          # once, across the restart
  max-concurrent-sessions: 2
  merge-order: [wi/atlas/b-0142/u-1/1, wi/atlas/b-0142/u-1/2]
  transitions:
    - {actor: unit/atlas/b-0142/u-2, from: approved, to: waiting}
    - {actor: unit/atlas/b-0142/u-2, from: waiting, to: building}
  writes-after: 0
