  actors:
    - {id: intent/atlas-provider-limits, state: open, seq: 4, epoch: 2}
    - {id: elaboration/intent/atlas-provider-limits/2, state: idle, seq: 6, epoch: 2, fields: {type: prototype, idle-since: "2026-09-03T22:00:00Z", session: session/elaboration/intent/atlas-provider-limits/2/1}}
    - {id: session/elaboration/intent/atlas-provider-limits/2/1, state: idle, seq: 5, epoch: 2, fields: {host: host/studio}}
