id: D01
title: S1 — an elaboration approved from the phone starts work and is never re-asked
exercises: {operations: [present-receive, write-effect], guarantees: [word-once]}
profiles: [all]
requirements: [S1, 1, 5, 12]
definitions: ../../machines
given:
  clock: "2026-09-04T07:40:00Z"
  actors:
    - {id: repo/blueprints, state: tracked, seq: 1, fields: {kind: blueprints, shared-line: main, take-cadence: "0 6 * * *"}}
    - {id: intent/atlas-provider-limits, state: open, seq: 4, epoch: 1, fields: {line: intents/atlas-provider-limits, proposed-elaborations: [{type: research, brief: "rate limits per account", source: offer/session-a/exit-2}]}}
    - {id: decision/intent/atlas-provider-limits/propose, state: open, seq: 0, class: approve, answers: [yes, drop]}
    - {id: host/studio, state: alive, seq: 1, fields: {bound: 2}}
  leases: [{actor: intent/atlas-provider-limits, holder: host/studio, epoch: 1}]
  rendering: {point: "2026-09-04T07:40:00Z", rows: {1: decision/intent/atlas-provider-limits/propose}}
  world:
    lines: {blueprints: {main: m1, intents/atlas-provider-limits: m1}}
    places: {}
    sessions: {}
    instructions-version: 9c1e4f0
when:
  - word: {source: discord-5, text: "yes 1", who: chuck}
  - tick: host/studio        # decision answered; intent spawns the elaboration
  - tick: host/studio        # elaboration approved → placing
  - tick: host/studio        # placing → running; session requested
  - tick: host/studio        # host start → session starting
  - {world: {sessions: {session/elaboration/intent/atlas-provider-limits/1/1: working}}}
  - tick: host/studio        # session working
  - tick: host/studio        # nothing
  - stop: [host/studio]
  - start: host/studio
  - tick: host/studio
then:
  transitions:
    - {actor: decision/intent/atlas-provider-limits/propose, from: open, to: answered}
    - {actor: elaboration/intent/atlas-provider-limits/1, from: approved, to: placing}
    - {actor: elaboration/intent/atlas-provider-limits/1, from: placing, to: running}
    - {actor: session/elaboration/intent/atlas-provider-limits/1/1, from: requested, to: starting}
    - {actor: session/elaboration/intent/atlas-provider-limits/1/1, from: starting, to: working}
  effects:
    - {name: place.ensure, args: [blueprints, intents/atlas-provider-limits, elab/intent/atlas-provider-limits/1]}
    - {name: work-order.render}
    - {name: session.start, count: 1}
  rows: []                    # no approve row for this elaboration, before or after the restart
  writes-after: 0
