# One delivery of construction work to a built repository (A.5). Created by the
# operator's yes on a unit that names a new bolt, or by dictation. Lives as
# long as its work; nothing ages it out. Its close is proposed when every unit
# is merged and no chore is outstanding; the landing is the machinery's effect.
machine: bolt
version: 1
kind: object
object: bolt
parent: null
owns: [unit]
record:
  repository: string
  name: string           # the operator's to change at any time; never the identity
  held_at: time
  landing_failure: string
regions:
  life:
    initial: open
    states:
      open:
        regions:
          line:
            initial: line
            states:
              line:
                machine: line
                params: {parent: built-shared-line, landing_policy: from-manifest}
          place:
            doc: the operator's own place at the head of the line, refreshed after each merge (A.5.40); no session works here
            initial: place
            states:
              place:
                machine: place
                params: {line: own-line, inputs: none, keep: true}
          citations:
            initial: current
            states:
              current:
                transitions:
                  - when: {ev: bolt.citations_moved, is: true}
                    to: moved
              moved:
                row: {kind: claim-moved, group: decide, answers: [amend bolt, land and follow], shows: [bolt.moved_claim]}
                transitions:
                  - when: {word: "amend bolt"}
                    to: current
                    effects: [{do: record_citation_choice, args: {choice: amend, claim: moved}, note: "the units citing the old version are marked; planning's fingerprint includes the choice, so it proposes the amendment"}]
                  - when: {word: "land and follow"}
                    to: current
                    effects: [{do: record_citation_choice, args: {choice: follow, claim: moved}, note: "the bolt proceeds on the version it cites; the ledger cell is stale, so planning follows"}]
          close:
            initial: not-offered
            states:
              not-offered:
                transitions:
                  - when: {all: [{children: {kind: unit, count_gte: 1}},
                                 {children: {kind: unit, none: [proposed, approved, waiting, in-flight]}},
                                 {children: {kind: unit, any: [merged]}},
                                 {not: {ev: bolt.chores_outstanding, is: true}},
                                 {not: {ev: bolt.hold_since_last_merge, is: true}}]}
                    to: offered
              offered:
                row: {kind: bolt-close, group: approve, answers: ["yes", hold], shows: [children.unit.count, line.landing]}
                transitions:
                  - when: {word: hold}
                    to: held
                  - when: {children: {kind: unit, any: [proposed, approved, waiting, in-flight]}}
                    to: not-offered
                    note: new work arrived on the bolt; the close can no longer be decided as posed
              held:
                doc: offered again only after another unit merges
                transitions:
                  - when: {not: {ev: bolt.hold_since_last_merge, is: true}}
                    to: not-offered
        transitions:
          - when: {all: [{region: {name: close, in: [offered]}}, {word: "yes"}]}
            to: landing
            enter: {line: landing}
      landing:
        doc: the final take, then the repository's policy; only a landing that passes the gates moves the shared line (A.5.46)
        transitions:
          - when: {final: removed}
            to: landed
          - when: {final: land-failed}
            to: land-failed
      land-failed:
        doc: reported, the bolt stays open with the failure on it; no session is asked anything until the word (S33)
        row: {kind: land-failed, group: decide, answers: [retry, hold], shows: [landing_failure]}
        transitions:
          - when: {word: retry}
            to: landing
            enter: {line: landing}
          - when: {word: hold}
            to: open
      landed:
        tail: landed
        entry: [{do: remove_place, note: the operator's place goes with the line}]
        final: true
