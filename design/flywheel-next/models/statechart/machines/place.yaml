# A worktree the machinery prepares for one session off one line (A.5.44).
# Template run inside a work item, an elaboration, a bolt (the operator's own
# place), curation and planning. Rebased only while its session is idle (I16).
machine: place
version: 1
kind: template
params:
  line: the line it is off
  inputs: the closed set of session inputs to write into it
  keep: kept as long as its session (standing) or merged and removed on done
record:
  head: revision
  conflict_retries: int
regions:
  life:
    initial: absent
    states:
      absent:
        transitions:
          - when: {always: true}
            to: preparing
            effects: [{do: prepare_place, args: {line: $line, agent_inputs: $inputs}}]
      preparing:
        transitions:
          - when: {all: [{ev: place.exists, is: true}, {ev: place.contains_line, is: true}]}
            to: ready
            note: a place is proven current before any session starts in it
          - when: {always: true}
            to: preparing
            effects: [{do: prepare_place, args: {line: $line, agent_inputs: $inputs}}]
      ready:
        doc: current with its line and holding no working session
        transitions:
          - when: {not: {ev: place.contains_line, is: true}}
            to: behind
      behind:
        doc: a sibling merged; this place is rebased when its session is idle or absent
        transitions:
          - when: {ev: session.activity, is: working}
            to: behind
          - when: {ev: place.contains_line, is: true}
            to: ready
            effects: [{do: tell_moved, note: the session is told what moved under it before it continues}]
          - when: {ev: place.conflicted, is: true}
            to: conflict
            effects: [{do: seed_conflict_job}]
          - when: {always: true}
            to: behind
            effects: [{do: rebase_place}]
      conflict:
        doc: the place's own session resolves the conflict as part of its job; the rebase retries when it exits done
        transitions:
          - when: {ev: place.contains_line, is: true}
            to: ready
            effects: [{do: tell_moved}]
          - when: {all: [{ev: session.exit, is: done}, {ev: place.conflict_retries, lt: 3}]}
            to: behind
            bump: conflict_retries
          - when: {ev: place.conflict_retries, gte: 3}
            to: conflict-stalled
      conflict-stalled:
        row: {kind: stalled, group: decide, answers: [retry, hold], shows: [place.conflict_retries]}
        transitions:
          - when: {word: retry}
            to: behind
      merging:
        doc: entered by the owner when its work is done; one place merges at a time in the fixed order (A.5.34)
        transitions:
          - when: {ev: place.merged, is: true}
            to: merged
          - when: {not: {ev: place.contains_line, is: true}}
            to: behind
            note: a sibling landed first; take the line, then merge
          - when: {ev: place.merge_slot, is: true}
            to: merging
            effects: [{do: merge_place}]
      merged:
        transitions:
          - when: {always: true}
            to: removed
            effects: [{do: remove_place}]
      removed:
        final: true
