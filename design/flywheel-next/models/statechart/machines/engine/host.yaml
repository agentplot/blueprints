# A host that runs the machinery. Engine machine: it names no domain object.
machine: host
version: 1
kind: engine
object: host
parent: null
record:
  bound: int            # sessions this host may run at once (a setting of the host)
  last_seen: time       # its heartbeat
regions:
  life:
    initial: alive
    states:
      alive:
        doc: heartbeat within the stale window
        transitions:
          - when: {ev: host.last_seen, older: 5m}
            to: stale
      stale:
        doc: visible as stale on the status view; its objects are untouched (B.5.135)
        transitions:
          - when: {not: {ev: host.last_seen, older: 5m}}
            to: alive
          - when: {ev: host.last_seen, older: 30m}
            to: gone
      gone:
        doc: an attention line offers takeover; the leases expire only by the operator's word or the long bound
        row: {kind: host-gone, group: attention, answers: [takeover, wait], shows: [host.last_seen]}
        transitions:
          - when: {not: {ev: host.last_seen, older: 5m}}
            to: alive
            note: the host came back; its leases were never expired, its work resumes on it
          - when: {any: [{word: takeover}, {ev: host.last_seen, older: 24h}]}
            to: released
            effects: [{do: expire_leases, note: "operator's word or the 24h bound; other hosts may now take over"}]
      released:
        transitions:
          - when: {not: {ev: host.last_seen, older: 5m}}
            to: alive
