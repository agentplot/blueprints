# One operator word. Engine machine: the word is attributed to a row, and a row
# is a state of some object; the engine knows no more than that.
machine: word
version: 1
kind: engine
object: word
parent: null
record:
  row: row-id            # <object id>/<row kind>
  rendering: rendering-id
  answer: string
  args: string
  given_by: string
  given_at: time
  delivery: string       # chat message id, page submission id, or the operator's own commit
regions:
  life:
    initial: given
    states:
      given:
        doc: recorded before any work follows (B.6.138); the object's own transition applies it
        transitions:
          - when: {ev: word.applied, is: true}
            to: applied
          - when: {ev: word.row_present, is: false}
            to: unapplicable
      applied:
        final: true
      unapplicable:
        doc: the row was gone before the word arrived; reported once under attention, never dropped (A.1.5, B.1.116)
        row: {kind: word-unapplicable, group: attention, answers: [ok], shows: [word.answer]}
        transitions:
          - when: {any: [{ev: word.reported, is: true}, {word: ok}]}
            to: reported
      reported:
        final: true
