# A branch the machinery owns (A.5.42). Template run inside a bolt (off the
# built repository's shared line) and inside an intent (off the books' shared
# line). Every operation here is an effect the machinery performs; a session
# never touches a line (I12).
machine: line
version: 1
kind: template
params:
  parent: the shared line this line is off
  landing_policy: pull-request or direct, from the manifest
record:
  head: revision
  merge_base: revision
  retries: int
  last_take: time
regions:
  life:
    initial: absent
    states:
      absent:
        transitions:
          - when: {always: true}
            to: current
            effects: [{do: create_line, args: {parent: $parent}}]
      current:
        doc: contains its parent as of the last take
        transitions:
          - when: {all: [{ev: line.take_due, is: true}, {not: {ev: line.contains_parent, is: true}}]}
            to: taking
      taking:
        doc: the take is a merge by the machinery; a conflicting take is aborted whole (A.5.45)
        transitions:
          - when: {ev: line.contains_parent, is: true}
            to: current
          - when: {ev: line.take_conflicts, is: true}
            to: conflict
            effects: [{do: seed_take_conflict, note: "a place off the line with the take applied and conflicted, as a job"}]
          - when: {always: true}
            to: taking
            effects: [{do: take_parent}]
      conflict:
        doc: a session in the seeded place resolves it; the take is retried when it exits done
        transitions:
          - when: {ev: line.contains_parent, is: true}
            to: current
          - when: {all: [{ev: line.conflict_job_done, is: true}, {ev: line.retries, lt: 3}]}
            to: taking
            bump: retries
          - when: {ev: line.retries, gte: 3}
            to: conflict-stalled
      conflict-stalled:
        row: {kind: stalled, group: decide, answers: [retry, hold], shows: [line.retries]}
        transitions:
          - when: {word: retry}
            to: taking
          - when: {word: hold}
            to: conflict-stalled
      landing:
        doc: entered by the owner's word (bolt close, intent archive); one final take, then the policy's landing
        transitions:
          - when: {ev: line.landed, is: true}
            to: landed
          - when: {ev: line.landing, is: failed}
            to: land-failed
          - when: {not: {ev: line.contains_parent, is: true}}
            to: landing
            effects: [{do: take_parent, note: the take before landing (A.5.43)}]
          - when: {ev: line.landing, in: [none]}
            to: landing
            effects: [{do: land_line, args: {policy: $landing_policy}}]
      land-failed:
        doc: the gates failed; the line stays; nothing is asked of any session until the operator's word (A.5.36, S33)
        final: true
      landed:
        transitions:
          - when: {always: true}
            to: removed
            effects: [{do: remove_line}]
      removed:
        final: true
