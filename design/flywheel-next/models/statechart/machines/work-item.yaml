# One task of a unit, worked through the type's stages by sessions and merged
# into the bolt when complete (A.5.37, A.5.34). The stage list comes from the
# unit's type at the version the unit recorded; a type change never moves an
# item in flight (A.5.49).
machine: work-item
version: 1
kind: object
object: work-item
parent: unit
record:
  ordinal: int           # the fixed order: unit approval time, then this
  depends_on: list       # items of the same unit
  stage: string
  send_backs: int
  sessions: list         # which sessions ran, per stage
  answers: list          # blocks and their answers, in order
regions:
  life:
    initial: waiting
    states:
      waiting:
        transitions:
          - when: {ev: item.deps_merged, is: true}
            to: ready
      ready:
        doc: waits for a slot in the stated order; nothing is started twice after a restart because the place and the session are named by the item
        transitions:
          - when: {ev: item.slot_free, is: true}
            to: placing
      placing:
        regions:
          place:
            initial: place
            states:
              place:
                machine: place
                params: {line: bolt-line, inputs: work-order, keep: false}
        transitions:
          - when: {final: ready}
            to: in-type
      in-type:
        doc: the unit type's machine at the recorded version; its states are the stages
        machine: $unit.type@$unit.type_version
        params: {place: own-place}
        transitions:
          - when: {final: passed}
            to: merging
            enter: {place: merging}
          - when: {final: stopped}
            to: stopped
      stopped:
        doc: the retry bound was reached; the item waits on the operator (A.5.37)
        row: {kind: stalled, group: decide, answers: [retry, drop], shows: [item.send_backs, stage]}
        transitions:
          - when: {word: retry}
            to: in-type
          - when: {word: drop}
            to: dropped
      merging:
        doc: one merge at a time in the fixed order; a rebase that conflicts is the session's job in its place (S32)
        transitions:
          - when: {final: removed}
            to: merged
          - when: {final: conflict}
            to: merging
            note: the place machine seeds the job and waits for the session; the merge retries when it exits done
      merged:
        tail: merged
        final: true
      dropped:
        tail: dropped
        final: true
