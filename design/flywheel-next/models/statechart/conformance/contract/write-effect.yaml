scenario: B.1.124-write-effect
title: an effect is written with an identity; a repeat changes nothing and is not a second write
profiles: [all]
satisfies: [70, 76, 124, 164]
machines: ./contract/lamp
given:
  objects: [{id: lamp/1, machine: lamp, state: {power: "off"}}]
  evidence: {lamp.switch: {lamp/1: up}}
when:
  - tick: {}
  - evidence: {lamp.lit: {lamp/1: false}}    # the proof is lost from the world
  - restart: {}
  - tick: {}
then:
  transitions: [{object: lamp/1, from: "off", to: "on"}]
  effects: [{do: light, count: 2}]
  control_plane: {writes_with_effect_id: 2, distinct_effect_ids: 1, second_reported_as_write: false}
