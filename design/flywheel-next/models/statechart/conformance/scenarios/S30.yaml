scenario: S30
title: a build session exits blocked; only its item waits; siblings merge; the page answer reaches the same living session; the block and answer are on the item
profiles: [all]
requirements: [A.7.59, A.7.60, S30]
given:
  objects:
    - {id: bolt/atlas/plan-rows, machine: bolt, state: {life: open, open.line: current, open.place: ready, open.citations: current, open.close: not-offered}, record: {repository: atlas}}
    - {id: unit/atlas/u, machine: unit, parent: bolt/atlas/plan-rows, state: {life: in-flight}, record: {type: default, type_version: 3}}
    - {id: work-item/atlas/wi-418, machine: work-item, parent: unit/atlas/u, state: {life: in-type, in-type.stages: build, build.run: sessions, session.life: alive, alive.activity: working}, record: {ordinal: 1}}
    - {id: work-item/atlas/wi-419, machine: work-item, parent: unit/atlas/u, state: {life: in-type, in-type.stages: review, review.run: sessions, session.life: alive, alive.activity: working}, record: {ordinal: 2}}
  evidence: {session.pane: {"*": present}, session.activity: {"*": working}}
when:
  - files: {"place wi-418/.flywheel/exit.rec": "kind: blocked\nquestion: should Ready imply Backlog cleared?"}
  - evidence: {session.exit: {"work-item/atlas/wi-418/build/1": blocked}}
  - tick: {}
  - evidence: {stage.join_met: {"work-item/atlas/wi-419/review/1": true}, stage.verdict: {"work-item/atlas/wi-419/review/1": pass}, place.merge_slot: {"*": true}, place.merged: {"*": true}}
  - tick: {}
  - tick: {}
  - tick: {}
  - word: {row: work-item/atlas/wi-418/build/1/question, answer: "yes; Ready is a superset", id: page/8f1c}
  - tick: {}
  - evidence: {session.answer_delivered: {"work-item/atlas/wi-418/build/1": true}}
  - tick: {}
then:
  transitions:
    - {object: work-item/atlas/wi-418, from: working, to: blocked}
    - {object: work-item/atlas/wi-419, from: in-type, to: merging}
    - {object: work-item/atlas/wi-419, from: merging, to: merged}
    - {object: work-item/atlas/wi-418, from: blocked, to: working, word: page/8f1c}
  rows: [{after_step: 3, present: [question], count: 1}, {after_step: 9, absent: [question]}]
  effects: [{do: deliver_answer, count: 1}, {do: start_session, count: 0}]
  records: {"work-item/atlas/wi-418/build/1": {blocks: 1}, work-item/atlas/wi-418: {thread: [question, answer]}}
  control_plane: {answer_sent_to_same_pane: true}
