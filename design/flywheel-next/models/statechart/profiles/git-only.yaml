# The git-only profile (C.2). Every piece of durable state is a file in the
# instance's `flywheel-state` git repository; the git host is the only
# central service, used for pushes with expected-old and for a webhook on
# push. Inherits the host, sessions, blueprints, record-derived and surfaces
# bindings.
#
# Tools: `gix` for reads, for the fetch, and for object writes — all in the
# host's own process; the `git` binary for two things, push with
# `--force-with-lease=<ref>:<expected>`, because gix has no push, and the
# pack a host runs between ticks (layout.kept below); recutils files parsed by the binary;
# the chat, page, bell and review surfaces as surfaces.yaml binds them, run by
# the host (or dispatcher) that presents each sink; the pages are also
# committed as files.
format: flywheel-profile/1
name: git-only
complete: true
inherits: [host, sessions, blueprints, record-derived, surfaces, identity]

layout:
  repository: "`<instance>/flywheel-state`; branch `main` is the shared line and the only branch hosts read state from"
  object:     "`objects/<kind>/<id>/object.rec` — the envelope of model.md 3.4, one file per object; the rail's register and a sink's mark are the `rail` and `sink` objects' records"
  thread:     "`objects/<kind>/<id>/thread.rec` — append-only entries: question, answer, note, exit, offer, refusal, moved, op-response. A session's `flywheel exit|offer|note|refuse` appends here through the same commit path, as the session's own writer"
  responses:  "`responses/<response id>.rec` — the op-response record, written by the presenter of the sink it came through; the id is the Discord message id, the page submission id, the plannotator annotation id, `commit/<sha>` for the operator's own commit, or for a member's client `client-<name>` where the call named its delivery and `client-<n>` counted where it did not (321, 323, surfaces.yaml member_client.calls)"
  asks:       "`asks/<id>.rec` — the record of an `ask` dictation, written by the same commit path as any effect: repository, text, by, at, consumed_by (model.md 1, 6)"
  pages:      "`status.html`, rebuilt by render_status; it says the commit and time it is as of. The page is served from the register and the objects and never committed (15)"
  run_record: "`runs/<host>/<date>.rec`"
  leases:     "branch `lease/<object id>/lease` holding one orphan commit whose tree is the lease record; renewal replaces the commit with `--force-with-lease`; a replaced commit is referenced by nothing and dropped by whoever keeps the git host — the host that stood it up when the machinery did (layout.kept), the git host's own keeping otherwise — so renewals every minute for months add nothing to main and nothing lasting anywhere. A sink's presenter lease is `lease/sink/<name>`"
  kept:       "every repository this binding creates — the host's bare clone and checkout of the state (host.yaml disk), and the bare repository a scenario run or a demonstration instance stands up as its git host (93d, ran_without_live_service) — is written with `gc.auto 0`, `gc.autoDetach false`, `maintenance.auto false` and `core.logAllRefUpdates false` in its own config at creation and the same asserted on every open, so git never packs, prunes or collects it of its own accord and writes no reflog; no config outside these repositories is touched, and a git host the machinery did not stand up is kept by whoever owns it (327). A repository is kept by the host that created it — a clone by the host whose root holds it, a stood-up git host by the host that stood it up — between that host's ticks, never inside one, and by no other host. Keeping is two acts at one occasion: when the repository's loose objects exceed 2,000, `git repack -d -q` packs the referenced ones into one new pack, nothing rewritten, and `git prune --expire=1.hour.ago` drops the loose objects nothing references that are older than an hour; when its packs exceed 50, `git repack -A -d -q` consolidates them, deltas reused, an unreferenced object loosened rather than dropped so it too goes only by age. The hour is what makes a drop safe beside a push landing at the same moment (328): the compare-and-swap is on the ref's value and never on an object's presence, so a drop moves no ref and turns no push's outcome (162); a pack a push delivers is held by receive-pack's keep file until its ref lands, and no repack removes it; the loose objects a push writes are seconds old against a cutoff of an hour, git freshens an object it is asked to write again, and a push never assumes the receiver holds an object no advertised ref reaches — so nothing a push is about to reference is ever old and unreferenced at once. The keeper and the repository share one computer and one clock (93d, ran_without_live_service), so the hour is the hour. Either act runs while no tick of this host is running and a tick that comes due waits for it; one that fails leaves the repository as it was and is tried at the next occasion; nothing is shown for any of it (S259). What the drop removes is what leases and heartbeats leave: the commit a renewal replaced, unreferenced on the git host the moment the push lands and in each clone the moment its fetch moves the ref; at a renewal a minute per held lease an hour of them is a few thousand objects, and that is the most a stood-up git host ever carries past its refs"
  hosts:      "branch `host/<host id>/heartbeat` the same way, one commit = the heartbeat; the dispatcher heartbeats as `host/dispatcher/heartbeat`. The fixed leaf on both branch families is load-bearing: object ids nest (`unit/atlas/rail-tail` owns `unit/atlas/rail-tail/wi-1`), and git refuses a ref whose name is a directory prefix of another, so `lease/<id>` alone could never hold a unit and its item at once; with the leaf, `lease/unit/atlas/rail-tail/lease` and `lease/unit/atlas/rail-tail/wi-1/lease` are siblings"

records:
  get:    "read `objects/<kind>/<id>/object.rec` at the host's fetched `origin/main`"
  put:    "write the file, commit on a local branch based on origin/main with the message `<effect id>\\n\\nreason: ..\\nevidence: ..`, push main with expected-old = the fetched head; on rejection fetch, rebase the commit (one file, no content conflict while the lease holds), push again; three rejections -> report and re-read"
  append: "append to `thread.rec`, same commit path"
  list:   "`git ls-tree -r origin/main objects/<kind>/` after fetch; `git diff --name-only <old>..<new>` after a fetch names the objects whose records moved, so a host re-reads only those"
  responses: "`responses/*.rec` whose object, or whose number through the rail's register, names the object"
  leases: "`git ls-remote origin refs/heads/lease/<id>/lease` then the blob; hosts() = `refs/heads/host/*/heartbeat`"

contract:
  read:     "the files as of `origin/main` after `git fetch` (before every tick, on every notify, and at least every 30s); a read writes nothing"
  write_effect: "one commit per effect on main whose message carries the effect id, reason and evidence; a repeat is found before committing in the object's record at HEAD — its `effects` field, the ids written since the object entered its current state, replaced when the state changes (model.md 3.4) — and in this host's own commits not yet landed, in process over `gix`, and changes nothing; the history behind HEAD is never walked for it, so the check costs the same on the thousandth day as on the first (329)"
  lease:    "the push is the compare-and-swap: take = push `lease/<id>/lease` with expected-old = zero (or = the expired holder's commit); renew = push with expected-old = own commit; release = delete the branch with expected-old = own commit. A host pushes a lease only for an object its manifest declaration covers (149); a sink pinned in the manifest is taken only by the pinned presenter. A rejected push means another host holds it; the loser fetches and reads again. Expiry: the lease commit's renewed_at older than 24h, or the holder's host decision answered takeover"
  present:  "as surfaces.yaml: the presenter of the chat sink posts to Discord, the presenter of the page sink serves `/rail`; a decision with a document is opened in plannotator from the page"
  receive:  "the presenter that received it turns a Discord reply naming a number, a button press, a page choice, or a plannotator annotation into `responses/<id>.rec` committed on main; the ✅ reaction is added when the push lands (154). The operator's own commit editing an object file is a response with id `commit/<sha>`, read by every host at its next fetch (S19). A response for a decision that is gone becomes a response object in `unapplicable` and comes back once under attention"
  notify:   "the git host's push webhook to each host's `/hook` over a Tailscale Funnel; without one, `git ls-remote origin main` every 30s (one round trip, no history read). Bound: 30s. Discord messages and herdr pane events notify locally"
  list:     "as records.list"
  status:   "`status.html` committed on main and served by any running host; when no host runs the operator reads the committed file through the git host's file view or a clone (S20); it states the commit and time it is as of"

guarantees:
  durable:  "a commit that reached main on the git host; a local commit is an intention until it lands (161)"
  single_writer: "the lease branch and expected-old pushes: two hosts cannot both land a lease commit on the same expected base (I15); object writes race only on main's head, never on content, and are rebased"
  atomic:   "one commit; a reader sees the tree at a commit or the tree at the next, never between"
  derivable: "the tree at origin/main plus the lease and host branches is everything read; the pages are written from it"
  response_once: "the response file is named by its delivery id, so a second delivery writes the same file (no-op); applied_responses is in the same commit as the state change"
  disconnected: "a host with no route to the git host keeps ticking the objects whose leases it holds (leases expire at 24h, so it may continue up to 24h); it commits locally and may not take a new lease, start a session for an object it does not hold, deliver to a sink, or expire another host's leases. On reconnect it pushes its lease renewals first (a rejection means it lost the object: it ends its own panes for that object, reports, and discards its local commits on it), then rebases and pushes its main commits (S18)"

# How the runner is told what a tick spent (conformance/contract/cost.yaml).
# The store counts the external processes it spawns and the fetch, push and
# renewal calls it makes, per tick, and hands the counts to the runner beside
# the tick's trace. These numbers are the mechanism above stated as a cost;
# they are the profile's promise, not a tuning, so a binding that reaches the
# right outcomes by other means fails here.
observations:
  fetches_per_tick:        "the fetches, in process over `gix`, counted: one before the tick, plus the fetch `records.put` takes to rebase a rejected push. Nothing else fetches — a push that lands reports the head it landed on, so no fetch follows it"
  pushes_per_tick:         "the `git push` calls: one per effect commit on main (167), and one `--force-with-lease` on `lease/<id>/lease` per lease whose renewal is due (163)"
  lease_renewals_per_tick: "the renewal pushes among them. A lease branch is renewed once a minute while its holder works, never once per pass over the object it covers (128, 150)"
  read_processes_per_tick: "processes the read path spawns: zero. Reads are `gix` over the tree at the fetched `origin/main` in the host's own process, never `git show`, `git cat-file` or `git log` per object"
  subprocesses_per_tick:   "every external process the store spawns in a tick: one push per commit and per renewal due, and nothing else — the fetch is `gix`, in process. One on a tick that writes once; none on a tick that writes nothing"
  packs_per_tick:          "packs, drops, prunes and collections run inside a tick, by the store or by git of its own accord: zero, always. The host packs and drops between ticks when a repository's loose objects pass 2,000 (layout.kept), and every repository the binding creates has git's own collection switched off, so no tick ever carries one (327, 328)"
