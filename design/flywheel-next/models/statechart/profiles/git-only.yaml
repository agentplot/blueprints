# The git-only profile (C.2). Every piece of durable state is a file in the
# organization's `flywheel-state` git repository; the git host is the only
# central service, used for pushes with expected-old and for a webhook on
# push. Inherits the host, books and record-derived bindings.
#
# Tools: `gix` for reads and object writes, the `git` binary for push with
# `--force-with-lease=<ref>:<expected>`; recutils files; the Discord bot
# through `serenity` in the host that holds the plan lease (the scribe);
# `axum` for the pages over Tailscale; the pages are also committed as files.
format: flywheel-profile/1
name: git-only
complete: true
inherits: [host, books, record-derived]

layout:
  repository: "`<org>/flywheel-state`; branch `main` is the shared line and the only branch hosts read state from"
  object:     "`objects/<kind>/<id>/object.rec` — the envelope of model.md 3.4, one file per object"
  thread:     "`objects/<kind>/<id>/thread.rec` — append-only entries: question, answer, note, exit, offer, refusal, word"
  words:      "`words/<word id>.rec` — written by the scribe; the id is the Discord message id, the page submission id, or `commit/<sha>` for the operator's own commit"
  asks:       "`asks/<id>.rec`"
  renderings: "`plan/renderings/<id>.rec`, the last 50 kept on main; older ones are in history"
  pages:      "`status.html` and `plan.html`, rebuilt by render_status and record_rendering; each says the commit and time it is as of"
  run_record: "`runs/<host>/<date>.rec`"
  leases:     "branch `lease/<object id>` holding one orphan commit whose tree is the lease record; renewal replaces the commit with `--force-with-lease`; old commits are unreachable and garbage-collected, so renewals every minute for months add nothing to main"
  hosts:      "branch `host/<host id>` the same way, one commit = the heartbeat"

records:
  get:    "read `objects/<kind>/<id>/object.rec` at the host's fetched `origin/main`"
  put:    "write the file, commit on a local branch based on origin/main with the message `<effect id>\\n\\nreason: ..\\nevidence: ..`, push main with expected-old = the fetched head; on rejection fetch, rebase the commit (one file, no content conflict while the lease holds), push again; three rejections -> report and re-read"
  append: "append to `thread.rec`, same commit path"
  list:   "`git ls-tree -r origin/main objects/<kind>/` after fetch; `git diff --name-only <old>..<new>` after a fetch names the objects whose records moved, so a host re-reads only those"
  words:  "`words/*.rec` whose row names the object"
  leases: "`git ls-remote origin refs/heads/lease/<id>` then the blob; hosts() = `refs/heads/host/*`"
  renderings: "`plan/renderings/` newest first"

contract:
  read:     "the files as of `origin/main` after `git fetch` (before every tick, on every notify, and at least every 30s); a read writes nothing"
  write_effect: "one commit per effect on main whose message carries the effect id, reason and evidence; a repeat is found by `git log --grep=<effect id>` on the fetched main before committing and changes nothing"
  lease:    "the push is the compare-and-swap: take = push `lease/<id>` with expected-old = zero (or = the expired holder's commit); renew = push with expected-old = own commit; release = delete the branch with expected-old = own commit. A rejected push means another host holds it; the loser fetches and reads again. Expiry: the lease commit's renewed_at older than 24h, or the holder's host row answered takeover"
  present:  "the scribe (the host holding the plan lease) posts the rendering to Discord and serves `plan.html`; the same file is committed"
  receive:  "the scribe turns a Discord reply or button press, or a page submission, into `words/<id>.rec` committed on main; the ✅ reaction is added when the push lands (B.6.139). The operator's own commit editing an object file is a word with id `commit/<sha>`, read by every host at its next fetch (S19). A word for a row that is gone becomes a word object in `unapplicable` and comes back once under attention"
  notify:   "the git host's push webhook to each host's `/hook` over a Tailscale Funnel; without one, `git ls-remote origin main` every 30s (one round trip, no history read). Bound: 30s. Discord messages and herdr pane events notify locally"
  list:     "as records.list"
  status:   "`status.html` committed on main and served by any running host; when no host runs the operator reads the committed file through the git host's file view or a clone (S20); it states the commit and time it is as of"

guarantees:
  durable:  "a commit that reached main on the git host; a local commit is an intention until it lands (C.2.145)"
  single_writer: "the lease branch and expected-old pushes: two hosts cannot both land a lease commit on the same expected base (I15); object writes race only on main's head, never on content, and are rebased"
  atomic:   "one commit; a reader sees the tree at a commit or the tree at the next, never between"
  derivable: "the tree at origin/main plus the lease and host branches is everything read; the pages are written from it"
  word_once: "the word file is named by its delivery id, so a second delivery writes the same file (no-op); applied_words is in the same commit as the state change"
  disconnected: "a host with no route to the git host keeps ticking the objects whose leases it holds (leases expire at 24h, so it may continue up to 24h); it commits locally and may not take a new lease, start a session for an object it does not hold, deliver a rendering, or expire another host's leases. On reconnect it pushes its lease renewals first (a rejection means it lost the object: it ends its own panes for that object, reports, and discards its local commits on it), then rebases and pushes its main commits (S18)"

evidence:
  plan.rendering_delivered: {read: "`plan/renderings/<id>.rec` delivered field carries the Discord message id"}
effects:
  deliver_rendering: {do: "the scribe posts the rendering to Discord, then commits the message id into the rendering record"}
