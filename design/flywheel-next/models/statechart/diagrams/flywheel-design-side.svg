<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1000" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <marker id="mP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b5cb8"/></marker>
  <marker id="mT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b8a8a"/></marker>
  <marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9962e"/></marker>
  <marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c05b5b"/></marker>
  <marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e5b"/></marker>
  <g id="cyl"><path d="M -24 -11 L -24 13 A 24 8 0 0 0 24 13 L 24 -11" fill="#fbeeee" stroke="#c05b5b" stroke-width="1.6"/><ellipse cx="0" cy="-11" rx="24" ry="8" fill="#f3dede" stroke="#c05b5b" stroke-width="1.6"/></g>
  <g id="gear"><circle r="9" fill="#fff" stroke="currentColor" stroke-width="2.4"/><circle r="3" fill="currentColor"/><g stroke="currentColor" stroke-width="2.4"><line y1="-9" y2="-13.5"/><line y1="9" y2="13.5"/><line x1="-9" x2="-13.5"/><line x1="9" x2="13.5"/><line x1="-6.4" y1="-6.4" x2="-9.5" y2="-9.5"/><line x1="6.4" y1="6.4" x2="9.5" y2="9.5"/><line x1="-6.4" y1="6.4" x2="-9.5" y2="9.5"/><line x1="6.4" y1="-6.4" x2="9.5" y2="-9.5"/></g></g>
  <g id="repo"><rect x="-26" y="-18" width="52" height="36" rx="7" fill="#fff" stroke="currentColor" stroke-width="2"/><circle cx="-9" cy="8" r="3.2" fill="currentColor"/><circle cx="9" cy="-8" r="3.2" fill="currentColor"/><path d="M -9 8 v-8 a 8 8 0 0 1 8 -8 h 1" fill="none" stroke="currentColor" stroke-width="2"/></g>
  <g id="cube" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M -16 -8 L 0 -17 L 16 -8 L 16 10 L 0 19 L -16 10 Z" fill="#fff"/><path d="M -16 -8 L 0 1 L 16 -8 M 0 1 L 0 19" fill="none"/></g>
  <g id="pause"><circle r="9" fill="#fff" stroke="#c9962e" stroke-width="2"/><line x1="-2.8" y1="-4" x2="-2.8" y2="4" stroke="#c9962e" stroke-width="2.4" stroke-linecap="round"/><line x1="2.8" y1="-4" x2="2.8" y2="4" stroke="#c9962e" stroke-width="2.4" stroke-linecap="round"/></g>
  <g id="clock"><circle r="9" fill="#fff" stroke="#c9962e" stroke-width="2"/><path d="M 0 -5 V 0 H 4" fill="none" stroke="#c9962e" stroke-width="2.2" stroke-linecap="round"/></g>
  <g id="check" fill="none" stroke="#2e9e5b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M -6 0 L -2 4 L 6 -5"/></g>
  <g id="marker"><circle r="7" fill="#fff" stroke="currentColor" stroke-width="2.2"/><circle r="2.6" fill="currentColor"/></g>
  <g id="cross"><circle r="10" fill="#fbeeee" stroke="#c05b5b" stroke-width="2"/><path d="M -4 -4 l 8 8 M 4 -4 l -8 8" fill="none" stroke="#a34848" stroke-width="2.5"/></g>
  <g id="person"><circle cy="-6" r="4" fill="#fff" stroke="currentColor" stroke-width="1.8"/><path d="M -7 8 a 7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="1.8"/></g>
</defs>
<rect width="1680" height="1000" fill="#fff"/>
<text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">Design side — an intent is a line off the blueprints, each elaboration a place off it, and every plan decision is a state</text>
<text x="40" y="57" font-size="12" fill="#666">proposed → open → archiving → closed · a decision is created on entering its state and retracted by the response that leaves it · the archive is where claims become standing</text>

<!-- lane: intent -->
<text x="38" y="174" font-size="11.5" font-weight="700" fill="#7b5cb8">intent</text>
<line x1="150" y1="170" x2="1380" y2="170" stroke="#7b5cb8" stroke-width="2" opacity="0.35"/>
<use href="#pause" x="200" y="170" data-state="intent.proposed"/>
<rect x="150" y="121" width="100" height="18" rx="9" fill="#c9962e"/><text x="200" y="134" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle" data-decision="intent-proposed">intent-proposed</text>
<text x="200" y="196" font-size="9.5" fill="#666" text-anchor="middle">proposed</text>
<text x="200" y="209" font-size="8.5" fill="#999" text-anchor="middle">curation join · signal weight shown</text>
<use href="#cross" x="290" y="215" data-state="intent.dropped"/>
<text x="290" y="238" font-size="9.5" fill="#666" text-anchor="middle">dropped</text>
<text x="290" y="251" font-size="8.5" fill="#999" text-anchor="middle">drop_signals</text>
<use href="#marker" x="400" y="170" color="#7b5cb8" data-state="intent.open"/>
<text x="400" y="196" font-size="9.5" fill="#666" text-anchor="middle">open</text>
<text x="400" y="209" font-size="8.5" fill="#999" text-anchor="middle">regions line · material · close</text>
<use href="#pause" x="580" y="170" data-state="intent.offered"/>
<rect x="538" y="121" width="84" height="18" rx="9" fill="#c9962e"/><text x="580" y="134" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle" data-decision="intent-close">intent-close</text>
<text x="580" y="196" font-size="9.5" fill="#666" text-anchor="middle">close offered</text>
<text x="580" y="209" font-size="8.5" fill="#999" text-anchor="middle">all elaborations done · close / keep open</text>
<use href="#marker" x="780" y="170" color="#7b5cb8" data-state="intent.archiving"/>
<text x="780" y="196" font-size="9.5" fill="#666" text-anchor="middle">archiving</text>
<text x="780" y="209" font-size="8.5" fill="#999" text-anchor="middle">archive_intent · then the line lands</text>
<polygon points="990,128 1036,170 990,212 944,170" fill="#fffdf6" stroke="#c9962e" stroke-width="2"/>
<text x="990" y="168" font-size="10" font-weight="700" fill="#8a6a1d" text-anchor="middle">ARCHIVE</text>
<text x="990" y="183" font-size="8.5" fill="#a97e26" text-anchor="middle">line lands</text>
<use href="#check" x="1200" y="170" data-state="intent.closed"/>
<text x="1200" y="196" font-size="9.5" fill="#666" text-anchor="middle">closed</text>
<text x="1200" y="209" font-size="8.5" fill="#999" text-anchor="middle">tail · nothing on a branch</text>

<!-- lane: elaboration -->
<text x="38" y="314" font-size="11.5" font-weight="700" fill="#7b5cb8">elaboration</text>
<line x1="150" y1="310" x2="1380" y2="310" stroke="#7b5cb8" stroke-width="2" opacity="0.35"/>
<use href="#pause" x="200" y="310" data-state="elaboration.proposed"/>
<rect x="132" y="261" width="136" height="18" rx="9" fill="#c9962e"/><text x="200" y="274" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle" data-decision="elaboration-proposed">elaboration-proposed</text>
<text x="200" y="336" font-size="9.5" fill="#666" text-anchor="middle">proposed</text>
<text x="200" y="349" font-size="8.5" fill="#999" text-anchor="middle">a finding · new material · folds under a proposed intent</text>
<use href="#marker" x="400" y="310" color="#7b5cb8" data-state="elaboration.approved"/>
<text x="400" y="336" font-size="9.5" fill="#666" text-anchor="middle">approved</text>
<text x="400" y="349" font-size="8.5" fill="#999" text-anchor="middle">response applied once · never re-asked</text>
<use href="#cube" x="560" y="310" color="#2b8a8a" data-state="elaboration.placing"/>
<text x="560" y="341" font-size="9.5" fill="#666" text-anchor="middle">placing</text>
<text x="560" y="354" font-size="8.5" fill="#999" text-anchor="middle">place proven current first</text>
<use href="#gear" x="740" y="310" color="#2e9e5b" data-state="elaboration.working"/>
<text x="740" y="336" font-size="9.5" fill="#666" text-anchor="middle">working</text>
<text x="740" y="349" font-size="8.5" fill="#999" text-anchor="middle">the type machine runs here</text>
<use href="#marker" x="900" y="310" color="#7b5cb8" data-state="elaboration.finishing"/>
<text x="900" y="336" font-size="9.5" fill="#666" text-anchor="middle">finishing</text>
<text x="900" y="349" font-size="8.5" fill="#999" text-anchor="middle">place merges into the intent line</text>
<use href="#check" x="1200" y="310" data-state="elaboration.done"/>
<text x="1200" y="336" font-size="9.5" fill="#666" text-anchor="middle">done</text>
<text x="1200" y="349" font-size="8.5" fill="#999" text-anchor="middle">tail</text>

<!-- lane: type -->
<text x="38" y="454" font-size="11.5" font-weight="700" fill="#2e9e5b">type</text>
<line x1="150" y1="450" x2="1380" y2="450" stroke="#2e9e5b" stroke-width="2" opacity="0.35"/>
<use href="#gear" x="200" y="450" color="#2e9e5b" data-state="self-closing.session"/>
<text x="200" y="476" font-size="9.5" fill="#666" text-anchor="middle">self-closing</text>
<text x="200" y="489" font-size="8.5" fill="#999" text-anchor="middle">exit done → done · idle 2h → stalled</text>
<use href="#gear" x="460" y="450" color="#2e9e5b" data-state="standing.session"/>
<text x="460" y="476" font-size="9.5" fill="#666" text-anchor="middle">standing</text>
<text x="460" y="489" font-size="8.5" fill="#999" text-anchor="middle">idle 30m → offered · lost → started again</text>
<use href="#pause" x="640" y="450" data-state="standing.idle-offered"/>
<rect x="612" y="401" width="56" height="18" rx="9" fill="#c9962e"/><text x="640" y="414" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle" data-decision="idle">idle</text>
<text x="640" y="476" font-size="9.5" fill="#666" text-anchor="middle">idle-offered</text>
<text x="640" y="489" font-size="8.5" fill="#999" text-anchor="middle">finish · keep 7d · process untouched</text>
<use href="#marker" x="820" y="450" color="#2e9e5b" data-state="standing.finished"/>
<text x="820" y="476" font-size="9.5" fill="#666" text-anchor="middle">finished</text>
<text x="820" y="489" font-size="8.5" fill="#999" text-anchor="middle">the one end_session · by the response</text>
<use href="#gear" x="1150" y="450" color="#2e9e5b" data-state="with-operator.session"/>
<use href="#person" x="1180" y="436" color="#8a8a86"/>
<text x="1150" y="476" font-size="9.5" fill="#666" text-anchor="middle">with-operator</text>
<text x="1150" y="489" font-size="8.5" fill="#999" text-anchor="middle">never asked about · ends by dictation only</text>

<!-- lane: session -->
<text x="38" y="594" font-size="11.5" font-weight="700" fill="#2e9e5b">session</text>
<line x1="150" y1="590" x2="1380" y2="590" stroke="#2e9e5b" stroke-width="2" opacity="0.35"/>
<use href="#marker" x="200" y="590" color="#2e9e5b" data-state="session.requested"/>
<text x="200" y="616" font-size="9.5" fill="#666" text-anchor="middle">requested</text>
<use href="#clock" x="340" y="590" data-state="session.starting"/>
<text x="340" y="616" font-size="9.5" fill="#666" text-anchor="middle">starting</text>
<text x="340" y="629" font-size="8.5" fill="#999" text-anchor="middle">retry by name · the pane is the proof</text>
<use href="#gear" x="540" y="590" color="#2e9e5b" data-state="session.alive"/>
<text x="540" y="616" font-size="9.5" fill="#666" text-anchor="middle">alive</text>
<text x="540" y="629" font-size="8.5" fill="#999" text-anchor="middle">working · idle · never interrupted</text>
<use href="#pause" x="740" y="590" data-state="session.blocked"/>
<rect x="705" y="541" width="70" height="18" rx="9" fill="#c9962e"/><text x="740" y="554" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle" data-decision="question">question</text>
<text x="740" y="616" font-size="9.5" fill="#666" text-anchor="middle">blocked</text>
<text x="740" y="629" font-size="8.5" fill="#999" text-anchor="middle">answer on the page → same session</text>
<use href="#check" x="900" y="590" data-state="session.exited"/>
<text x="900" y="616" font-size="9.5" fill="#666" text-anchor="middle">exited</text>
<text x="900" y="629" font-size="8.5" fill="#999" text-anchor="middle">flywheel exit · done · stalled · invalid</text>
<use href="#cross" x="1100" y="590" data-state="session.lost"/>
<text x="1100" y="616" font-size="9.5" fill="#666" text-anchor="middle">lost</text>
<text x="1100" y="629" font-size="8.5" fill="#999" text-anchor="middle">pane gone · owner decides</text>
<use href="#marker" x="1260" y="590" color="#2e9e5b" data-state="session.ended"/>
<text x="1260" y="616" font-size="9.5" fill="#666" text-anchor="middle">ended</text>
<text x="1260" y="629" font-size="8.5" fill="#999" text-anchor="middle">only the owner's enter</text>

<!-- lane: line and place -->
<text x="38" y="734" font-size="11.5" font-weight="700" fill="#2b8a8a">line · place</text>
<line x1="150" y1="730" x2="1380" y2="730" stroke="#2b8a8a" stroke-width="2" opacity="0.35"/>
<use href="#repo" x="200" y="730" color="#2b8a8a" data-state="line.current"/>
<text x="200" y="762" font-size="9.5" fill="#666" text-anchor="middle">intent line</text>
<text x="200" y="775" font-size="8.5" fill="#999" text-anchor="middle">take_parent by cadence · conflict is a job</text>
<use href="#cube" x="400" y="730" color="#2b8a8a" data-state="place.ready"/>
<text x="400" y="762" font-size="9.5" fill="#666" text-anchor="middle">place ready</text>
<text x="400" y="775" font-size="8.5" fill="#999" text-anchor="middle">wt worktree · contains the line</text>
<use href="#marker" x="580" y="730" color="#2b8a8a" data-state="place.behind"/>
<text x="580" y="756" font-size="9.5" fill="#666" text-anchor="middle">behind</text>
<text x="580" y="769" font-size="8.5" fill="#999" text-anchor="middle">rebase_place while idle · tell_moved</text>
<use href="#marker" x="780" y="730" color="#2b8a8a" data-state="place.merging"/>
<text x="780" y="756" font-size="9.5" fill="#666" text-anchor="middle">merging</text>
<text x="780" y="769" font-size="8.5" fill="#999" text-anchor="middle">one place at a time · then removed</text>
<use href="#marker" x="990" y="730" color="#2b8a8a" data-state="line.landing"/>
<text x="990" y="756" font-size="9.5" fill="#666" text-anchor="middle">landing</text>
<text x="990" y="769" font-size="8.5" fill="#999" text-anchor="middle">final take · direct merge</text>
<path d="M 1000 720 C 1010 500, 1010 300, 1000 214" fill="none" stroke="#2b8a8a" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#mT)"/>
<text x="1018" y="400" font-size="9" fill="#1f6e6e">enter: line landing</text>
<use href="#check" x="1200" y="730" data-state="line.removed"/>
<text x="1200" y="756" font-size="9.5" fill="#666" text-anchor="middle">removed</text>

<!-- destinations -->
<rect x="1420" y="110" width="220" height="84" rx="9" fill="#fff" stroke="#7b5cb8" stroke-width="1.6"/>
<text x="1434" y="134" font-size="11" font-weight="700" fill="#333">blueprints · shared line</text>
<text x="1434" y="154" font-size="9.5" font-family="monospace" fill="#666">claim providers/one-writer@4</text>
<text x="1434" y="174" font-size="9" fill="#27824c" font-weight="700">standing · planned against</text>
<path d="M 1036 170 C 1200 130, 1300 150, 1418 150" fill="none" stroke="#7b5cb8" stroke-width="2.2" marker-end="url(#mP)"/>
<text x="1240" y="128" font-size="9" fill="#5a3f95">claims stand</text>

<rect x="1420" y="340" width="220" height="84" rx="9" fill="#fff" stroke="#7b5cb8" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="1434" y="364" font-size="11" font-weight="700" fill="#333">intent line</text>
<text x="1434" y="384" font-size="9.5" font-family="monospace" fill="#666">claim block in the chapter</text>
<text x="1434" y="404" font-size="9" fill="#a97e26" font-weight="700">proposed · visible · never built</text>
<text x="1434" y="418" font-size="8.5" fill="#999">writeback: chapter · claim · map attachment, one commit (120, 200)</text>

<use href="#cyl" x="1530" y="262"/>
<text x="1530" y="292" font-size="9.5" fill="#666" text-anchor="middle">ledger</text>
<text x="1530" y="305" font-size="8.5" fill="#999" text-anchor="middle">reads the version · a cell falls stale</text>
<path d="M 1530 196 C 1530 210, 1530 225, 1530 240" fill="none" stroke="#c05b5b" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#mR)"/>

<use href="#person" x="1530" y="600" color="#8a8a86"/>
<text x="1530" y="628" font-size="9.5" fill="#666" text-anchor="middle">operator</text>
<text x="1530" y="641" font-size="8.5" fill="#999" text-anchor="middle">every amber decision waits here</text>

<!-- legend -->
<rect x="40" y="880" width="1600" height="90" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<use href="#pause" x="70" y="910"/><text x="88" y="914" font-size="10" fill="#333">a state with a decision</text>
<rect x="200" y="901" width="60" height="18" rx="9" fill="#c9962e"/><text x="230" y="914" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">decision kind</text>
<use href="#gear" x="320" y="910" color="#2e9e5b"/><text x="340" y="914" font-size="10" fill="#333">a session runs</text>
<use href="#check" x="450" y="910"/><text x="466" y="914" font-size="10" fill="#333">tail state</text>
<use href="#cross" x="560" y="910"/><text x="578" y="914" font-size="10" fill="#333">lost · dropped</text>
<use href="#repo" x="700" y="910" color="#2b8a8a"/><text x="736" y="914" font-size="10" fill="#333">line</text>
<use href="#cube" x="800" y="910" color="#2b8a8a"/><text x="824" y="914" font-size="10" fill="#333">place</text>
<use href="#cyl" x="900" y="912"/><text x="934" y="914" font-size="10" fill="#333">ledger</text>
<line x1="1000" y1="910" x2="1040" y2="910" stroke="#7b5cb8" stroke-width="2.2"/><text x="1048" y="914" font-size="10" fill="#333">design object</text>
<line x1="1150" y1="910" x2="1190" y2="910" stroke="#2b8a8a" stroke-width="2.2" stroke-dasharray="4 3"/><text x="1198" y="914" font-size="10" fill="#333">owner commands a child</text>
<line x1="1350" y1="910" x2="1390" y2="910" stroke="#c05b5b" stroke-width="2" stroke-dasharray="2 5"/><text x="1398" y="914" font-size="10" fill="#333">read only</text>
<text x="70" y="950" font-size="10.5" fill="#333">a decision exists exactly while its state is active, on every host and after every restart · the machinery never ends a standing session: finished is reached only by the response</text>
</svg>
