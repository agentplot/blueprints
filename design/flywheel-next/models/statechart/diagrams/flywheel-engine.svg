<text x="864" y="164" font-size="9.5" font-family="monospace" fill="#666">body = record · comments = thread, words</text>
<text x="864" y="184" font-size="9.5" font-family="monospace" fill="#666">lease = lowest lease comment · board</text>
<text x="864" y="204" font-size="9" fill="#3f6d9c" font-weight="700">webhooks · 30s poll · octocrab</text>
<text x="864" y="224" font-size="8.5" fill="#999">single writer by ordered append</text>
