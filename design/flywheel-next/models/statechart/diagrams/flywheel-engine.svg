<rect width="1680" height="1000" fill="#fff"/>
<text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">Engine — one tick for every object: list, lease, read, guard, effect, write; rows are derived, never stored; a word applies once</text>
<text x="40" y="57" font-size="12" fill="#666">the engine holds nothing between ticks · a notify only shortens the wait · the same tick runs unchanged on either profile because every name it reads is bound in the profile, not in the engine</text>

