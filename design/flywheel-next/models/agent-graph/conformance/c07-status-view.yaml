kind: scenario
name: "C07 — the status view is served from the same state the engine reads, readable with no machinery running, and says as of when"
requirements: [B.1.119, B.4.128, B.4.129, B.4.130, B.4.131, B.4.132, B.4.133, S12, S20]
profiles: [all]
given:
  objects/bolt:
    - {id: bo-plan-rows, repository: atlas, name: plan-rows, approval: wd-rn-0800-1}
  objects/unit:
    - {id: un-status-writer, bolt: bo-plan-rows, type: "default@a91c0e2", after: [], approval: wd-rn-0800-1}
  objects/item:
    - {id: wi-417, unit: un-status-writer, bolt: bo-plan-rows, index: 1, after: [], place: pl-wi-417, approval: wd-rn-0800-1}
    - {id: wi-418, unit: un-status-writer, bolt: bo-plan-rows, index: 2, after: [wi-417], place: pl-wi-418, approval: wd-rn-0800-1}
  advances:
    - {id: ad-wi-417-1, item: wi-417, from: none, to: build, attempt: 1, bound: 2}
  activations:
    - {id: ac-stage-build-wi-417-a1-m1, node: stage/build, key: "wi-417 · build · attempt 1 · member 1", host: mac-mini, generation: 1}
  sessions:
    - {id: se-ac-stage-build-wi-417-a1-m1, activation: ac-stage-build-wi-417-a1-m1, host: mac-mini, expected: "build item 1 of un-status-writer"}
  exits:
    - {id: ex-1, session: se-ac-stage-build-wi-417-a1-m1, kind: blocked, question: "should Ready imply Backlog cleared?"}
  words:
    - {id: wd-ans-1, row: ex-1, generation: 1, answer: "yes, Ready implies Backlog cleared", by: chuck}
  hosts:
    - {id: mac-mini, bound: 2, alive: true}
when:
  - {tick: {host: mac-mini}}
  - {stop: mac-mini}
  - {clock: "+6h"}
  - {op: {host: none, call: status-view, as: v}}
then:
  results:
    - "v is served with no host of the operator's running"
    - "v groups every intent, elaboration, bolt, unit, item and session by state: queued, in progress, waiting on the operator, done"
    - "v shows wi-417 in progress, held by mac-mini, run on mac-mini, host stale (last heartbeat 6h ago); wi-418 queued behind wi-417"
    - "v shows the question and its answer on wi-417 in order — B.4.131"
    - "v's first line says as of the last write that reached the central service, and its time"
    - "v is built from list and read alone: for bo-plan-rows it shows what it holds (un-status-writer: wi-417 in progress, wi-418 waiting) and what waits; for mac-mini what it runs and its bound 2"
    - "nothing in v was written by hand and nothing in v is read by any node as truth"
  report:
    - "B.4.133: the same list + read that served this view can serve, for any object, its states, words and sessions in order; for any repository, what landed in a period"
