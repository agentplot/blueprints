kind: scenario
name: "C03 — a lease is taken by exactly one of two takers, renewed while its holder works, released by its holder, and expired by the stated rule"
requirements: [B.1.115, B.2.121, B.5.135, I11]
profiles: [all]
given:
  settings: {lease-ttl: 15m, heartbeat-interval: 2m}
  objects/item:
    - {id: wi-418, unit: un-status-writer, bolt: bo-plan-rows, place: pl-wi-418, approval: wd-rn-0900-2}
  hosts:
    - {id: mac-mini, bound: 2, alive: true}
    - {id: studio, bound: 2, alive: true}
when:
  # take: two would-be holders, one instant
  - concurrent:
      - {op: {host: mac-mini, call: lease-take, node: stage/build, key: "wi-418 · build · attempt 1 · member 1", generation: 1, as: t1}}
      - {op: {host: studio,   call: lease-take, node: stage/build, key: "wi-418 · build · attempt 1 · member 1", generation: 1, as: t2}}
  # renew: the winner heartbeats for half an hour
  - {clock: "+2m"}
  - {op: {host: "{winner}", call: lease-renew, as: n1}}
  - {clock: "+28m"}
  - {op: {host: "{loser}",  call: read, object: wi-418, as: r1}}
  # release by the holder; the other may now take
  - {op: {host: "{winner}", call: lease-release, node: stage/build, key: "wi-418 · build · attempt 1 · member 1", generation: 1, as: rel}}
  - {op: {host: "{loser}",  call: lease-take, node: stage/build, key: "wi-418 · build · attempt 1 · member 1", generation: 2, as: t3}}
  # expire: the new holder stops heartbeating; an effect-only activation is retaken after the ttl; a session-backed one is not
  - {crash: "{loser}"}
  - {clock: "+16m"}
  - {op: {host: "{winner}", call: lease-take, node: git.merge, key: "bolt/plan-rows", generation: 1, as: t4}}
  - {tick: {host: "{winner}"}}
then:
  results:
    - "exactly one of t1.held, t2.held is true; the other reports lost and names the holder"
    - "n1.held == true after 2m; the holder's lease is fresh at +30m because the heartbeat renewed it"
    - "r1.evidence shows the activation with its host — I11: the owner is visible"
    - "rel.released == true; t3.held == true — a released object can be taken by another"
    - "t4.held == true — an effect-only activation whose holder's heartbeat is older than lease-ttl is expired by the rule"
  rows:
    - "host-stale: host {loser} last seen 16m · holds wi-418 → takeover on {winner} · wait"
  not-fired:
    - "stage/build for wi-418 on {winner} — a session-backed activation is not retaken without the word takeover"
  report:
    - "B.5.135: a host that goes away leaves its object visibly stale; takeover is by the rule, never by racing"
