kind: scenario
name: "C12 — an operator's word takes effect once, however many times it is delivered and whatever restarts happen between its giving and its application"
requirements: [B.2.124, A.1.1, A.1.5, I2]
profiles: [all]
given:
  proposals:
    - {id: pr-un-atlas-status-writer, kind: unit, generation: 2, repository: atlas, target-bolt: bo-plan-rows, type: "default@a91c0e2", routed-from: planning, items: 2, document: "status writer"}
  objects/bolt:
    - {id: bo-plan-rows, repository: atlas, name: plan-rows, approval: wd-rn-0800-1}
  hosts:
    - {id: mac-mini, bound: 2, alive: true}
    - {id: studio, bound: 2, alive: true}
when:
  - {tick: {host: mac-mini}}                                                        # rendering rn-A: row 1 = the unit
  # the same word delivered three times by two transports, two of them in the same instant
  - concurrent:
      - {receive: {rendering: rn-A, row: 1, answer: "yes", by: chuck, via: chat}}
      - {receive: {rendering: rn-A, row: 1, answer: "yes", by: chuck, via: page}}
  - {receive: {rendering: rn-A, row: 1, answer: "yes", by: chuck, via: "chat-retry"}}
  # a restart between recording and applying
  - {stop: mac-mini}
  - {stop: studio}
  - {start: studio}
  - {tick: {host: studio}}                                                          # instantiate fires on the word
  - {stop: studio}
  - {start: mac-mini}
  - {tick: {host: mac-mini}}                                                        # would fire again; every write dedupes
  - {receive: {rendering: rn-A, row: 1, answer: "yes", by: chuck, via: "chat-late"}}  # after application
  - {tick: {host: mac-mini}}
  - {op: {host: mac-mini, call: list, scope: all, as: l}}
then:
  results:
    - "exactly one word exists for (pr-un-atlas-status-writer, 2); the other three deliveries were acknowledged as duplicates through their transport"
    - "l holds exactly one unit un-atlas-status-writer and exactly two items, each with approval == that one word"
    - "the second host's tick found every object write already present and wrote nothing"
    - "the late delivery after application is acknowledged, not applied, and not reported as unapplied (the word it repeats was applied)"
  states:
    un-atlas-status-writer: approved
  no-rows: [unit, unapplied]
  report:
    - "I2: applied once, never lost; the identity (row, generation) is what makes four deliveries one word"
