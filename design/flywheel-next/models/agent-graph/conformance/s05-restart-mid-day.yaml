kind: scenario
name: "S5 — the machinery restarts mid-day; every session still runs; the plan is identical; no object changed state"
requirements: [S5, I7, A.2.6, A.8.64]
profiles: [all]
given:
  proposals:
    - {id: pr-un-atlas-retry-jitter, kind: unit, generation: 1, repository: atlas, new-bolt-name: atlas-retry-jitter, type: "fast@a91c0e2", routed-from: "ask ak-0913"}
  objects/bolt:
    - {id: bo-plan-rows, repository: atlas, name: plan-rows, approval: wd-rn-0800-1}
  objects/unit:
    - {id: un-status-writer, bolt: bo-plan-rows, type: "default@a91c0e2", after: [], approval: wd-rn-0800-1}
  objects/item:
    - {id: wi-417, unit: un-status-writer, bolt: bo-plan-rows, index: 1, after: [], place: pl-wi-417, approval: wd-rn-0800-1}
    - {id: wi-418, unit: un-status-writer, bolt: bo-plan-rows, index: 2, after: [], place: pl-wi-418, approval: wd-rn-0800-1}
  advances:
    - {id: ad-wi-417-1, item: wi-417, from: none, to: build, attempt: 1, bound: 2}
    - {id: ad-wi-418-1, item: wi-418, from: none, to: review, attempt: 1, bound: 3}
  activations:
    - {id: ac-stage-build-wi-417-a1-m1,  node: stage/build,  key: "wi-417 · build · attempt 1 · member 1",  host: mac-mini, generation: 1}
    - {id: ac-stage-review-wi-418-a1-m1, node: stage/review, key: "wi-418 · review · attempt 1 · member 1", host: mac-mini, generation: 1}
  sessions:
    - {id: se-ac-stage-build-wi-417-a1-m1,  activation: ac-stage-build-wi-417-a1-m1,  host: mac-mini}
    - {id: se-ac-stage-review-wi-418-a1-m1, activation: ac-stage-review-wi-418-a1-m1, host: mac-mini}
  exits:
    - {id: ex-1, session: se-ac-stage-review-wi-418-a1-m1, kind: blocked, question: "should Ready imply Backlog cleared?"}
  hosts:
    - {id: mac-mini, bound: 2, alive: true}
  world:
    sessions: {se-ac-stage-build-wi-417-a1-m1: working, se-ac-stage-review-wi-418-a1-m1: idle}
when:
  - {tick: {host: mac-mini}}
  - {op: {host: mac-mini, call: present, as: before}}
  - {stop: mac-mini}
  - {clock: "+3m"}
  - {start: mac-mini}
  - {tick: {host: mac-mini}}
  - {op: {host: mac-mini, call: present, as: after}}
then:
  results:
    - "before.rows == after.rows and before.rendering == after.rendering"
    - "both panes are still alive; no session.start, session.tell or session.retire ran"
  states:
    wi-417: working
    wi-418: blocked
    un-status-writer: in-flight
  rows:
    - "unit: atlas · retry-jitter → new bolt atlas-retry-jitter"
    - "blocked: wi-418 review · plan-rows · \"should Ready imply Backlog cleared?\" · session alive"
  no-effects: true
  no-writes: true
