kind: scenario
name: "S17 — two hosts see the same approved unit in the same moment and both try to take it; exactly one does; the other moves on"
requirements: [S17, B.2.121, A.5.29, I11]
profiles: [all]
given:
  objects/bolt:
    - {id: bo-plan-rows, repository: atlas, name: plan-rows, approval: wd-rn-0800-1}
  objects/unit:
    - {id: un-status-writer, bolt: bo-plan-rows, type: "default@a91c0e2", after: [], approval: wd-rn-0800-1}
    - {id: un-retry-jitter,  bolt: bo-plan-rows, type: "fast@a91c0e2",    after: [], approval: wd-rn-0800-2}
  objects/item:
    - {id: wi-417, unit: un-status-writer, bolt: bo-plan-rows, index: 1, after: [], place: pl-wi-417, approval: wd-rn-0800-1}
    - {id: wi-420, unit: un-retry-jitter,  bolt: bo-plan-rows, index: 1, after: [], place: pl-wi-420, approval: wd-rn-0800-2}
  advances:
    - {id: ad-wi-417-1, item: wi-417, from: none, to: spec,  attempt: 1, bound: 2}
    - {id: ad-wi-420-1, item: wi-420, from: none, to: build, attempt: 1, bound: 1}
  hosts:
    - {id: mac-mini, bound: 1, alive: true}
    - {id: studio, bound: 1, alive: true}
  world:
    line-head: {"bolt/plan-rows": 9b1e44c}
when:
  - concurrent:
      - {tick: {host: mac-mini}}
      - {tick: {host: studio}}
  - {tick: {host: mac-mini}}
  - {tick: {host: studio}}
then:
  results:
    - "exactly one activation exists for (stage/spec, wi-417 · spec · attempt 1 · member 1, gen 1) and exactly one for (stage/build, wi-420 · build · attempt 1 · member 1, gen 1)"
    - "the two activations are on different hosts: the loser of wi-417 read again, saw the winner, and took wi-420 instead (each host's bound is 1)"
  effects:
    - "session.start × 2 — one per item, one per host"
  states:
    wi-417: working
    wi-420: working
  report:
    - "no unit was started twice; the loser lost nothing but a read"
