kind: scenario
name: "C10 — a write is wholly applied or not applied; no reader ever sees half of one"
requirements: [B.2.122]
profiles: [all]
given:
  proposals:
    - {id: pr-un-atlas-status-writer, kind: unit, generation: 2, repository: atlas, target-bolt: bo-plan-rows, type: "default@a91c0e2", routed-from: planning, items: 4, document: "status writer: spec · build×2 · review"}
  objects/bolt:
    - {id: bo-plan-rows, repository: atlas, name: plan-rows, approval: wd-rn-0800-1}
  hosts:
    - {id: mac-mini, bound: 2, alive: true}
    - {id: studio, bound: 2, alive: true}
when:
  - {receive: {rendering: rn-A, row: 1, answer: "yes", by: chuck, via: chat}}
  # instantiate on mac-mini writes the unit and its four items; studio reads the unit continuously meanwhile
  - concurrent:
      - {tick: {host: mac-mini}}
      - {op: {host: studio, call: read, object: un-atlas-status-writer, repeat: "every 100ms for 30s", as: reads}}
  - {op: {host: studio, call: read, object: un-atlas-status-writer, as: final}}
then:
  results:
    - "every element of reads is either 'no such object' or a whole unit record with its approval; none is a record missing a field"
    - "for every item write, every read of that item is whole or absent"
    - "final is the whole unit with four items"
    - "where the profile's storage cannot write a unit and its items in one act, each record is still whole on its own, and the unit's derivation with fewer than four items visible is 'approved' with items pending, never a state that starts work on a missing item"
  states:
    un-atlas-status-writer: approved
  report:
    - "atomicity is per write, not per firing; the firing's several writes each carry the same approval so a reader between them sees whole records"
