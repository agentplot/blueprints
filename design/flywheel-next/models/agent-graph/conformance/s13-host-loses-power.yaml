kind: scenario
name: "S13 — one of two hosts loses power mid-build; the other does not touch the build; the view shows it stale; it resumes on return or is taken over by the word, never twice"
requirements: [S13, B.5.134, B.5.135, B.5.136, A.7.60]
profiles: [all]
given:
  settings: {lease-ttl: 15m, heartbeat-interval: 2m}
  objects/unit:
    - {id: un-status-writer, bolt: bo-plan-rows, type: "default@a91c0e2", after: [], approval: wd-rn-0800-1}
  objects/item:
    - {id: wi-418, unit: un-status-writer, bolt: bo-plan-rows, index: 2, after: [], place: pl-wi-418, approval: wd-rn-0800-1}
  advances:
    - {id: ad-wi-418-1, item: wi-418, from: none, to: build, attempt: 1, bound: 2}
  activations:
    - {id: ac-stage-build-wi-418-a1-m1, node: stage/build, key: "wi-418 · build · attempt 1 · member 1", host: mac-mini, generation: 1}
  sessions:
    - {id: se-ac-stage-build-wi-418-a1-m1, activation: ac-stage-build-wi-418-a1-m1, host: mac-mini}
  hosts:
    - {id: mac-mini, bound: 2, alive: true}
    - {id: studio, bound: 2, alive: true}
  world:
    sessions: {se-ac-stage-build-wi-418-a1-m1: working}
when:
  - {crash: mac-mini}
  - {clock: "+16m"}
  - {tick: {host: studio}}
  - {op: {host: studio, call: status-view, as: v1}}
  # branch A: the host returns
  - {start: mac-mini}
  - {tick: {host: mac-mini}}
  - {tick: {host: studio}}
  # branch B: it stays down and the operator says takeover
  - {crash: mac-mini}
  - {clock: "+16m"}
  - {tick: {host: studio}}
  - {receive: {rendering: "{latest}", row: "host-stale mac-mini", answer: "takeover on studio", by: chuck, via: chat}}
  - {tick: {host: studio}}
  - {start: mac-mini}
  - {tick: {host: mac-mini}}
then:
  results:
    - "v1 shows wi-418 in progress, held by mac-mini, mac-mini stale (last seen 16m)"
    - "after branch A: the row host-stale is retracted; the same activation is live on mac-mini; studio fired nothing for wi-418"
    - "after branch B: activation gen 2 on studio, gen 1 marked superseded; a fresh place and session on studio; when mac-mini returns it retires its own session and reports; at no moment were two sessions for wi-418 live under unsuperseded activations"
  rows:
    - "host-stale: host mac-mini last seen 16m · holds wi-418 → takeover on studio · wait"
  not-fired:
    - "stage/build for wi-418 on studio before the word takeover"
  effects:
    - "git.place.prepare(pl-wi-418-g2, bolt/plan-rows) on studio — after the word"
    - "session.start(ac-stage-build-wi-418-a1-m1-g2) on studio — after the word"
    - "session.retire(se-ac-stage-build-wi-418-a1-m1) on mac-mini — on its return, with the reason superseded"
  report:
    - "the build ran on one host at a time; the operator, not a race, moved it"
