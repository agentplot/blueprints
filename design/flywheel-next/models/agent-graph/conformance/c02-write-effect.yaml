kind: scenario
name: "C02 — an effect is written with its own identity; a repeat changes nothing, is not an error, and is not a second write"
requirements: [B.1.114, A.5.38, A.7.62, A.9.68]
profiles: [all]
given:
  objects/item:
    - {id: wi-418, unit: un-status-writer, bolt: bo-plan-rows, place: pl-wi-418, approval: wd-rn-0900-2}
  hosts:
    - {id: mac-mini, bound: 2, alive: true}
    - {id: studio, bound: 2, alive: true}
when:
  - {op: {host: mac-mini, call: write-effect, id: fx-merge-wi-418-e1f0a2b-into-9b1e44c, effect: git.merge, subject: wi-418, reason: "item wi-418 ready-to-merge · first in order", evidence: "place e1f0a2b · line 9b1e44c · as-of t0", result: "ok line=bolt/plan-rows@f7a9d21", as: w1}}
  - {op: {host: mac-mini, call: write-effect, id: fx-merge-wi-418-e1f0a2b-into-9b1e44c, effect: git.merge, subject: wi-418, reason: "retry after restart", evidence: "same", result: "ok", as: w2}}
  - {op: {host: studio,   call: write-effect, id: fx-merge-wi-418-e1f0a2b-into-9b1e44c, effect: git.merge, subject: wi-418, reason: "seen from another host", evidence: "same", result: "ok", as: w3}}
  - {op: {host: studio,   call: read, object: wi-418, as: r}}
then:
  results:
    - "w1.written == true"
    - "w2.written == false and w2.error == none"
    - "w3.written == false and w3.error == none"
    - "count(f in r.evidence.effects, f.id == fx-merge-wi-418-e1f0a2b-into-9b1e44c) == 1"
    - "the one record carries the first write's reason and evidence, not the retry's"
  states:
    wi-418: merged
  report:
    - "A.9.68: the record carries reason and evidence; the profile shows where (a commit message, a comment body)"
