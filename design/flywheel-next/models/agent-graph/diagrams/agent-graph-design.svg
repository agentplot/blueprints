<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1000" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a86"/></marker>
    <marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a7fb5"/></marker>
    <marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e5b"/></marker>
    <marker id="mP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b5cb8"/></marker>
    <marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9962e"/></marker>
    <marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c05b5b"/></marker>
    <marker id="mT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b8a8a"/></marker>
    <g id="gear"><circle r="9" fill="#fff" stroke="currentColor" stroke-width="2.4"/><circle r="3" fill="currentColor"/><g stroke="currentColor" stroke-width="2.4"><line y1="-9" y2="-13.5"/><line y1="9" y2="13.5"/><line x1="-9" x2="-13.5"/><line x1="9" x2="13.5"/><line x1="-6.4" y1="-6.4" x2="-9.5" y2="-9.5"/><line x1="6.4" y1="6.4" x2="9.5" y2="9.5"/><line x1="-6.4" y1="6.4" x2="-9.5" y2="9.5"/><line x1="6.4" y1="-6.4" x2="9.5" y2="-9.5"/></g></g>
    <g id="cube" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M -16 -8 L 0 -17 L 16 -8 L 16 10 L 0 19 L -16 10 Z" fill="#fff"/><path d="M -16 -8 L 0 1 L 16 -8 M 0 1 L 0 19" fill="none"/></g>
    <g id="cyl"><path d="M -24 -11 L -24 13 A 24 8 0 0 0 24 13 L 24 -11" fill="#f1f1ee" stroke="currentColor" stroke-width="1.6"/><ellipse cx="0" cy="-11" rx="24" ry="8" fill="#e3e3df" stroke="currentColor" stroke-width="1.6"/></g>
    <g id="repo"><rect x="-26" y="-18" width="52" height="36" rx="7" fill="#fff" stroke="currentColor" stroke-width="2"/><circle cx="-9" cy="8" r="3.2" fill="currentColor"/><circle cx="9" cy="-8" r="3.2" fill="currentColor"/><path d="M -9 8 v-8 a 8 8 0 0 1 8 -8 h 1" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <g id="person"><circle cy="-6" r="4" fill="#fff" stroke="currentColor" stroke-width="1.8"/><path d="M -7 8 a 7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="1.8"/></g>
    <g id="people"><circle cy="-5" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M -8 9 a 8 7 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.8"/></g>
    <g id="clock"><circle r="9" fill="#fff" stroke="#c9962e" stroke-width="2"/><path d="M 0 -5 V 0 H 4" fill="none" stroke="#c9962e" stroke-width="2.2" stroke-linecap="round"/></g>
    <g id="check" fill="none" stroke="#2e9e5b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M -6 0 L -2 4 L 6 -5"/></g>
    <g id="gate" stroke="#c05b5b" stroke-width="3" stroke-linecap="round"><line x1="-8" y1="-11" x2="-8" y2="11"/><line x1="8" y1="-11" x2="8" y2="11"/><line x1="-8" y1="-3" x2="8" y2="-3"/></g>
    <g id="rows" fill="#7b5cb8"><rect x="-16" y="-9" width="32" height="4" rx="1"/><rect x="-16" y="-2" width="32" height="4" rx="1"/><rect x="-16" y="5" width="20" height="4" rx="1"/></g>
  </defs>
  <rect width="1680" height="1000" fill="#fff"/>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">Design — curation turns signals into one row per intent; an elaboration is one session whose type says how it ends; the archive makes its claims standing</text>
  <text x="40" y="57" font-size="12" fill="#666">a signal is never a row · a standing session ends only on the word finish · a claim on the blueprints shared line moves the ledger's backlog, which is what fires planning</text>

  <!-- ============ SIGNALS ============ -->
  <rect x="40" y="84" width="330" height="300" rx="10" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.4"/>
  <text x="56" y="108" font-size="12" font-weight="700" fill="#5f6b7a">SIGNALS</text>
  <text x="132" y="108" font-size="10" fill="#999">blueprints repository · signals/ · adapters append</text>
  <use href="#people" x="100" y="170" color="#8a8a86"/>
  <text x="100" y="200" font-size="10" fill="#666" text-anchor="middle">sources</text>
  <text x="100" y="213" font-size="8.5" fill="#999" text-anchor="middle">meetings · chat · logs · findings</text>
  <g id="store-captures">
    <use href="#cube" x="230" y="168" color="#2e9e5b"/>
    <text x="230" y="200" font-size="10" fill="#666" text-anchor="middle">capture</text>
    <text x="230" y="213" font-size="8.5" fill="#999" text-anchor="middle">one per source event</text>
    <rect x="160" y="220" width="140" height="18" rx="9" fill="#2e9e5b"/>
    <text x="230" y="233" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">20 signals</text>
  </g>
  <path d="M 118 170 L 206 170" fill="none" stroke="#8a8a86" stroke-width="2" marker-end="url(#mN)"/>
  <g id="store-moves">
    <use href="#cyl" x="230" y="310" color="#2e9e5b"/>
    <text x="230" y="342" font-size="10" fill="#666" text-anchor="middle">moves.rec</text>
    <text x="230" y="355" font-size="8.5" fill="#999" text-anchor="middle">one standing move per signal</text>
  </g>
  <text x="100" y="330" font-size="8.5" fill="#999" text-anchor="middle">the queue is the set</text>
  <text x="100" y="343" font-size="8.5" fill="#999" text-anchor="middle">of signals with no move</text>

  <!-- ============ CURATION ============ -->
  <g id="node-curation">
    <use href="#gear" x="480" y="200" color="#4a7fb5"/>
    <text x="480" y="230" font-size="10" fill="#666" text-anchor="middle">curation</text>
    <text x="480" y="243" font-size="8.5" fill="#999" text-anchor="middle">threshold 10 · cadence 1d · never opens an intent</text>
  </g>
  <path d="M 254 170 C 340 170, 400 190, 462 198" fill="none" stroke="#2e9e5b" stroke-width="2" marker-end="url(#mG)"/>
  <text x="360" y="164" font-size="9" fill="#27824c" text-anchor="middle">unmoved signals</text>
  <path d="M 470 216 C 420 280, 340 300, 258 306" fill="none" stroke="#2e9e5b" stroke-width="2" marker-end="url(#mG)"/>
  <text x="380" y="292" font-size="9" fill="#27824c" text-anchor="middle">6 attach · 9 drop · 5 join</text>
  <g id="store-proposals">
    <use href="#cube" x="680" y="198" color="#2e9e5b"/>
    <text x="680" y="230" font-size="10" fill="#666" text-anchor="middle">intent proposal</text>
    <text x="680" y="243" font-size="8.5" fill="#999" text-anchor="middle">with its elaborations and their types</text>
    <rect x="590" y="252" width="180" height="18" rx="9" fill="#2e9e5b"/>
    <text x="680" y="265" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">5 signals · 2 sources · 12d</text>
  </g>
  <path d="M 498 200 L 656 200" fill="none" stroke="#2e9e5b" stroke-width="2" marker-end="url(#mG)"/>
  <text x="577" y="192" font-size="9" fill="#27824c" text-anchor="middle">done exit</text>

  <!-- ============ THE OPERATOR ============ -->
  <polygon points="900,250 970,320 900,390 830,320" fill="#fffdf6" stroke="#c9962e" stroke-width="2.4"/>
  <use href="#person" x="900" y="304" color="#c9962e"/>
  <text x="900" y="336" font-size="10.5" font-weight="700" fill="#8a6a1d" text-anchor="middle">OPERATOR</text>
  <text x="900" y="350" font-size="8.5" fill="#a97e26" text-anchor="middle">yes · drop · split</text>
  <path d="M 702 210 C 760 250, 800 280, 838 306" fill="none" stroke="#c9962e" stroke-width="2.4" marker-end="url(#mA)"/>
  <text x="742" y="290" font-size="9.5" fill="#a97e26" font-weight="600">row intent</text>
  <text x="560" y="322" font-size="9" fill="#a97e26" text-anchor="middle">drop → a move naming the drop on each cited signal</text>

  <!-- word → instantiate → intent + line -->
  <g id="node-instantiate">
    <use href="#gear" x="760" y="470" color="#7b5cb8"/>
    <text x="760" y="500" font-size="10" fill="#666" text-anchor="middle">instantiate</text>
    <text x="760" y="513" font-size="8.5" fill="#999" text-anchor="middle">intent + elaborations, approved</text>
  </g>
  <path d="M 862 352 C 830 400, 810 440, 780 460" fill="none" stroke="#c9962e" stroke-width="2.4" marker-end="url(#mA)"/>
  <text x="846" y="422" font-size="9.5" fill="#a97e26" font-weight="600">yes</text>
  <g id="store-intent">
    <use href="#repo" x="580" y="470" color="#7b5cb8"/>
    <text x="580" y="506" font-size="10" fill="#666" text-anchor="middle">intent line</text>
    <text x="580" y="519" font-size="8.5" fill="#999" text-anchor="middle">git.line.create off the blueprints main</text>
    <rect x="480" y="528" width="200" height="18" rx="9" fill="#7b5cb8"/>
    <text x="580" y="541" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">intent/atlas-provider-limits</text>
  </g>
  <path d="M 742 470 L 612 470" fill="none" stroke="#7b5cb8" stroke-width="2" marker-end="url(#mP)"/>

  <!-- ============ ELABORATION TYPES ============ -->
  <rect x="380" y="590" width="900" height="240" rx="10" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.4"/>
  <text x="396" y="614" font-size="12" font-weight="700" fill="#5f6b7a">ELABORATION TYPES</text>
  <text x="560" y="614" font-size="10" fill="#999">one session · one place off the intent line · the type sets the done and idle edges</text>
  <path d="M 566 488 C 520 540, 520 600, 534 640" fill="none" stroke="#7b5cb8" stroke-width="2" marker-end="url(#mP)"/>

  <text x="396" y="660" font-size="11.5" font-weight="700" fill="#4a7fb5">self-closing</text>
  <line x1="500" y1="656" x2="1240" y2="656" stroke="#4a7fb5" stroke-width="2" opacity="0.3"/>
  <use href="#gear" x="540" y="656" color="#4a7fb5"/>
  <text x="540" y="682" font-size="8.5" fill="#999" text-anchor="middle">research · writing</text>
  <use href="#check" x="700" y="656"/>
  <text x="700" y="682" font-size="8.5" fill="#999" text-anchor="middle">done exit</text>
  <use href="#gear" x="860" y="656" color="#7b5cb8"/>
  <text x="860" y="682" font-size="8.5" fill="#999" text-anchor="middle">git.merge into the line</text>
  <rect x="990" y="647" width="130" height="18" rx="9" fill="#7b5cb8"/>
  <text x="1055" y="660" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">place removed</text>

  <text x="396" y="732" font-size="11.5" font-weight="700" fill="#c9962e">standing</text>
  <line x1="500" y1="728" x2="1240" y2="728" stroke="#c9962e" stroke-width="2" opacity="0.3"/>
  <use href="#gear" x="540" y="728" color="#4a7fb5"/>
  <text x="540" y="754" font-size="8.5" fill="#999" text-anchor="middle">a prototype kept running</text>
  <use href="#clock" x="700" y="728"/>
  <text x="700" y="754" font-size="8.5" fill="#999" text-anchor="middle">idle 15m · no stall edge</text>
  <rect x="820" y="719" width="150" height="18" rx="9" fill="#c9962e"/>
  <text x="895" y="732" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">row idle · finish · keep</text>
  <text x="1120" y="732" font-size="8.5" fill="#999" text-anchor="middle">finish → retire · place kept until then</text>

  <text x="396" y="804" font-size="11.5" font-weight="700" fill="#8a8a86">with-operator</text>
  <line x1="500" y1="800" x2="1240" y2="800" stroke="#8a8a86" stroke-width="2" opacity="0.3"/>
  <use href="#gear" x="540" y="800" color="#4a7fb5"/>
  <text x="540" y="826" font-size="8.5" fill="#999" text-anchor="middle">a back-and-forth</text>
  <use href="#person" x="700" y="800" color="#8a8a86"/>
  <text x="700" y="826" font-size="8.5" fill="#999" text-anchor="middle">operator present</text>
  <text x="900" y="804" font-size="8.5" fill="#999" text-anchor="middle">the idle row is suppressed while present · never ended by the machinery</text>

  <!-- rows up: idle, elab (finding), close -->
  <path d="M 895 718 C 895 600, 900 480, 906 392" fill="none" stroke="#c9962e" stroke-width="2.4" marker-end="url(#mA)"/>
  <path d="M 700 640 C 720 560, 820 420, 884 386" fill="none" stroke="#c9962e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#mA)"/>
  <text x="700" y="578" font-size="9.5" fill="#a97e26" font-weight="600" text-anchor="end">own-intent finding → row elab</text>
  <path d="M 1180 590 C 1180 480, 1000 420, 924 386" fill="none" stroke="#c9962e" stroke-width="2.4" marker-end="url(#mA)"/>
  <text x="1130" y="520" font-size="9.5" fill="#a97e26" font-weight="600" text-anchor="end">row close · every elaboration done</text>

  <!-- ============ ARCHIVE → STANDING ============ -->
  <g id="effect-git.archive">
    <use href="#gate" x="1180" y="320"/>
    <text x="1180" y="352" font-size="10" fill="#666" text-anchor="middle">git.archive</text>
    <text x="1180" y="365" font-size="8.5" fill="#999" text-anchor="middle">openspec archive · land · delete the line</text>
  </g>
  <path d="M 970 320 L 1160 320" fill="none" stroke="#c9962e" stroke-width="2.4" marker-end="url(#mA)"/>
  <text x="1065" y="312" font-size="9.5" fill="#a97e26" font-weight="600" text-anchor="middle">close</text>
  <use href="#repo" x="1380" y="320" color="#2b8a8a"/>
  <text x="1380" y="356" font-size="10" fill="#666" text-anchor="middle">blueprints · main</text>
  <text x="1380" y="369" font-size="8.5" fill="#999" text-anchor="middle">the claim exists here → standing</text>
  <rect x="1290" y="378" width="180" height="18" rx="9" fill="#2b8a8a"/>
  <text x="1380" y="391" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">one-writer@7f3a2c1</text>
  <path d="M 1198 320 L 1346 320" fill="none" stroke="#2b8a8a" stroke-width="2" marker-end="url(#mT)"/>

  <g id="store-ledger">
    <use href="#cyl" x="1560" y="320" color="#2b8a8a"/>
    <text x="1560" y="352" font-size="10" fill="#666" text-anchor="middle">ledger</text>
    <text x="1560" y="365" font-size="8.5" fill="#999" text-anchor="middle">verdicts at v3 now stale</text>
    <text x="1560" y="378" font-size="8.5" fill="#999" text-anchor="middle">a derivation, not a write</text>
  </g>
  <path d="M 1414 316 L 1530 316" fill="none" stroke="#2b8a8a" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#mT)"/>
  <text x="1472" y="308" font-size="9" fill="#1f6e6e" text-anchor="middle">version read</text>
  <text x="1560" y="410" font-size="8.5" fill="#1f6e6e" text-anchor="middle">backlog fingerprint moves</text>
  <text x="1560" y="423" font-size="8.5" fill="#1f6e6e" text-anchor="middle">→ planning fires once per repository</text>

  <!-- claims index feeding curation -->
  <path d="M 1360 300 C 1200 140, 700 110, 494 186" fill="none" stroke="#2b8a8a" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#mT)"/>
  <text x="1000" y="138" font-size="9" fill="#1f6e6e" text-anchor="middle">standing claims: the index curation clusters against</text>

  <!-- ============ LEGEND ============ -->
  <rect x="40" y="876" width="1600" height="100" rx="10" fill="#fafafa" stroke="#d5d5d0"/>
  <g font-size="10.5" fill="#555">
    <use href="#gear" x="80" y="910" color="#4a7fb5"/><text x="102" y="914">agent node</text>
    <use href="#gear" x="200" y="910" color="#7b5cb8"/><text x="222" y="914">machinery</text>
    <use href="#cube" x="320" y="908" color="#2e9e5b"/><text x="346" y="914">artifact</text>
    <use href="#cyl" x="440" y="910" color="#2e9e5b"/><text x="474" y="914">edge store</text>
    <use href="#repo" x="580" y="910" color="#7b5cb8"/><text x="616" y="914">line</text>
    <use href="#cyl" x="690" y="910" color="#2b8a8a"/><text x="724" y="914">ledger</text>
    <use href="#gate" x="800" y="910"/><text x="818" y="914">archive · landing</text>
    <use href="#clock" x="940" y="910"/><text x="958" y="914">idle</text>
    <polygon points="1020,896 1034,910 1020,924 1006,910" fill="#fffdf6" stroke="#c9962e" stroke-width="1.6"/><text x="1044" y="914">the operator</text>
    <line x1="1150" y1="910" x2="1190" y2="910" stroke="#c9962e" stroke-width="3"/><text x="1200" y="914">rows in · word out</text>
    <line x1="1330" y1="910" x2="1370" y2="910" stroke="#2b8a8a" stroke-width="2" stroke-dasharray="2 5"/><text x="1380" y="914">claims read</text>
    <line x1="1480" y1="910" x2="1520" y2="910" stroke="#c9962e" stroke-width="2" stroke-dasharray="4 3"/><text x="1530" y="914">finding</text>
  </g>
  <text x="80" y="954" font-size="10.5" fill="#555">the operator sees one row per intent, never one per signal; every signal keeps its move, so the next curation never re-judges it and a dropped cluster is not proposed again</text>
</svg>
