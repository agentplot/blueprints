<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1000" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a86"/></marker>
    <marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a7fb5"/></marker>
    <marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e5b"/></marker>
    <marker id="mP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b5cb8"/></marker>
    <marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9962e"/></marker>
    <marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c05b5b"/></marker>
    <marker id="mT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b8a8a"/></marker>
    <g id="gear"><circle r="9" fill="#fff" stroke="currentColor" stroke-width="2.4"/><circle r="3" fill="currentColor"/><g stroke="currentColor" stroke-width="2.4"><line y1="-9" y2="-13.5"/><line y1="9" y2="13.5"/><line x1="-9" x2="-13.5"/><line x1="9" x2="13.5"/><line x1="-6.4" y1="-6.4" x2="-9.5" y2="-9.5"/><line x1="6.4" y1="6.4" x2="9.5" y2="9.5"/><line x1="-6.4" y1="6.4" x2="-9.5" y2="9.5"/><line x1="6.4" y1="-6.4" x2="9.5" y2="-9.5"/></g></g>
    <g id="cube" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M -16 -8 L 0 -17 L 16 -8 L 16 10 L 0 19 L -16 10 Z" fill="#fff"/><path d="M -16 -8 L 0 1 L 16 -8 M 0 1 L 0 19" fill="none"/></g>
    <g id="cyl"><path d="M -24 -11 L -24 13 A 24 8 0 0 0 24 13 L 24 -11" fill="#f1f1ee" stroke="currentColor" stroke-width="1.6"/><ellipse cx="0" cy="-11" rx="24" ry="8" fill="#e3e3df" stroke="currentColor" stroke-width="1.6"/></g>
    <g id="repo"><rect x="-26" y="-18" width="52" height="36" rx="7" fill="#fff" stroke="currentColor" stroke-width="2"/><circle cx="-9" cy="8" r="3.2" fill="currentColor"/><circle cx="9" cy="-8" r="3.2" fill="currentColor"/><path d="M -9 8 v-8 a 8 8 0 0 1 8 -8 h 1" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <g id="person"><circle cy="-6" r="4" fill="#fff" stroke="currentColor" stroke-width="1.8"/><path d="M -7 8 a 7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="1.8"/></g>
    <g id="diamond"><path d="M 0 -14 L 17 0 L 0 14 L -17 0 Z" fill="#f8f5fc" stroke="#7b5cb8" stroke-width="1.8"/></g>
    <g id="gate" stroke="#c05b5b" stroke-width="3" stroke-linecap="round"><line x1="-8" y1="-11" x2="-8" y2="11"/><line x1="8" y1="-11" x2="8" y2="11"/><line x1="-8" y1="-3" x2="8" y2="-3"/></g>
    <g id="check" fill="none" stroke="#2e9e5b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M -6 0 L -2 4 L 6 -5"/></g>
  </defs>
  <rect width="1680" height="1000" fill="#fff"/>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">Construction — one word starts a unit; stages, joins, merges and rebases then fire on artifacts alone until the bolt's close</text>
  <text x="40" y="57" font-size="12" fill="#666">planning reads the ledger and writes verdicts · a unit type is a subgraph instantiated per unit · every line and place is the git node's</text>

  <!-- ============ THE LEDGER ============ -->
  <rect x="40" y="84" width="300" height="470" rx="10" fill="#e8f3f3" stroke="#2b8a8a" stroke-width="1.4"/>
  <text x="56" y="108" font-size="12" font-weight="700" fill="#1f6e6e">THE LEDGER</text>
  <text x="150" y="108" font-size="10" fill="#999">blueprints repository · read only here</text>
  <g id="store-claims">
    <use href="#cube" x="190" y="180" color="#2b8a8a"/>
    <text x="190" y="212" font-size="10" fill="#666" text-anchor="middle">standing claim</text>
    <text x="190" y="225" font-size="8.5" fill="#999" text-anchor="middle">a fenced block in its chapter</text>
    <rect x="110" y="234" width="160" height="18" rx="9" fill="#2b8a8a"/>
    <text x="190" y="247" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">one-writer@7f3a2c1</text>
  </g>
  <g id="store-ledger">
    <use href="#cyl" x="190" y="400" color="#2b8a8a"/>
    <text x="190" y="432" font-size="10" fill="#666" text-anchor="middle">ledger/atlas.rec</text>
    <text x="190" y="445" font-size="8.5" fill="#999" text-anchor="middle">one verdict per claim version</text>
    <rect x="120" y="454" width="140" height="18" rx="9" fill="#2b8a8a"/>
    <text x="190" y="467" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">not-satisfied</text>
    <text x="190" y="492" font-size="8.5" fill="#999" text-anchor="middle">backlog: claims with none</text>
  </g>

  <!-- ============ PLANNING → PROPOSAL ============ -->
  <g id="node-planning">
    <use href="#gear" x="480" y="200" color="#4a7fb5"/>
    <text x="480" y="230" font-size="10" fill="#666" text-anchor="middle">planning</text>
    <text x="480" y="243" font-size="8.5" fill="#999" text-anchor="middle">sees every open bolt of the repository</text>
    <rect x="440" y="252" width="80" height="18" rx="9" fill="#4a7fb5"/>
    <text x="480" y="265" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">fp 9c1e</text>
  </g>
  <path d="M 216 180 C 300 180, 380 190, 462 196" fill="none" stroke="#2b8a8a" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#mT)"/>
  <text x="340" y="176" font-size="9" fill="#1f6e6e" text-anchor="middle">claims in scope</text>
  <path d="M 218 392 C 320 350, 390 260, 466 212" fill="none" stroke="#2b8a8a" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#mT)"/>
  <text x="402" y="334" font-size="9" fill="#1f6e6e">reads verdicts</text>
  <path d="M 462 206 C 400 260, 330 360, 220 404" fill="none" stroke="#2b8a8a" stroke-width="2" marker-end="url(#mT)"/>
  <text x="330" y="386" font-size="9" fill="#1f6e6e" text-anchor="middle">writes verdicts · id (claim, version, rev)</text>

  <g id="store-proposals">
    <use href="#cube" x="680" y="198" color="#2e9e5b"/>
    <text x="680" y="230" font-size="10" fill="#666" text-anchor="middle">unit proposal</text>
    <text x="680" y="243" font-size="8.5" fill="#999" text-anchor="middle">one document · target bolt · after · type</text>
    <rect x="600" y="252" width="160" height="18" rx="9" fill="#2e9e5b"/>
    <text x="680" y="265" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">status-writer@2</text>
  </g>
  <path d="M 498 200 L 656 200" fill="none" stroke="#2e9e5b" stroke-width="2" marker-end="url(#mG)"/>
  <text x="577" y="192" font-size="9" fill="#27824c" text-anchor="middle">done exit</text>

  <!-- ============ THE OPERATOR ============ -->
  <polygon points="900,250 970,320 900,390 830,320" fill="#fffdf6" stroke="#c9962e" stroke-width="2.4"/>
  <use href="#person" x="900" y="304" color="#c9962e"/>
  <text x="900" y="336" font-size="10.5" font-weight="700" fill="#8a6a1d" text-anchor="middle">OPERATOR</text>
  <text x="900" y="350" font-size="8.5" fill="#a97e26" text-anchor="middle">yes · drop · redo</text>
  <path d="M 702 210 C 760 250, 800 280, 838 306" fill="none" stroke="#c9962e" stroke-width="2.4" marker-end="url(#mA)"/>
  <text x="742" y="290" font-size="9.5" fill="#a97e26" font-weight="600">row unit</text>
  <path d="M 216 170 C 480 60, 780 100, 886 258" fill="none" stroke="#c9962e" stroke-width="2" marker-end="url(#mA)"/>
  <text x="600" y="98" font-size="9.5" fill="#a97e26" font-weight="600" text-anchor="middle">row moved · the version under an open bolt changed</text>

  <!-- word → instantiate → items -->
  <g id="node-instantiate">
    <use href="#gear" x="760" y="470" color="#7b5cb8"/>
    <text x="760" y="500" font-size="10" fill="#666" text-anchor="middle">instantiate</text>
    <text x="760" y="513" font-size="8.5" fill="#999" text-anchor="middle">a new bolt gets its line and place</text>
  </g>
  <path d="M 856 346 C 830 400, 810 440, 780 460" fill="none" stroke="#c9962e" stroke-width="2.4" marker-end="url(#mA)"/>
  <text x="806" y="400" font-size="9.5" fill="#a97e26" font-weight="600" text-anchor="end">yes · bolt plan-rows</text>
  <g id="store-items">
    <use href="#cube" x="590" y="468" color="#2e9e5b"/>
    <text x="590" y="500" font-size="10" fill="#666" text-anchor="middle">unit + items</text>
    <text x="590" y="513" font-size="8.5" fill="#999" text-anchor="middle">carry the word</text>
    <rect x="530" y="522" width="120" height="18" rx="9" fill="#2e9e5b"/>
    <text x="590" y="535" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">wi-417 · wi-418</text>
  </g>
  <path d="M 742 470 L 614 470" fill="none" stroke="#2e9e5b" stroke-width="2" marker-end="url(#mG)"/>

  <!-- ============ THE UNIT TYPE ============ -->
  <rect x="380" y="590" width="1260" height="240" rx="10" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.4"/>
  <text x="396" y="614" font-size="12" font-weight="700" fill="#5f6b7a">THE UNIT TYPE · default</text>
  <text x="580" y="614" font-size="10" fill="#999">one stage node per item per stage · a join between each · merge is the git node</text>
  <line x1="420" y1="690" x2="1180" y2="690" stroke="#4a7fb5" stroke-width="2" opacity="0.35"/>

  <path d="M 574 474 C 470 476, 430 600, 428 672" fill="none" stroke="#2e9e5b" stroke-width="2" marker-end="url(#mG)"/>
  <text x="452" y="560" font-size="9" fill="#27824c" text-anchor="end">queued at stage 1</text>

  <g id="node-stage"><use href="#gear" x="440" y="690" color="#4a7fb5"/><text x="440" y="720" font-size="10" fill="#666" text-anchor="middle">spec</text><text x="440" y="733" font-size="8.5" fill="#999" text-anchor="middle">names the claim it serves</text></g>
  <g id="node-join"><use href="#diamond" x="560" y="690"/><text x="560" y="720" font-size="10" fill="#666" text-anchor="middle">join</text><text x="560" y="733" font-size="8.5" fill="#999" text-anchor="middle">gate: standing claims</text></g>
  <use href="#gear" x="680" y="690" color="#4a7fb5"/><text x="680" y="720" font-size="10" fill="#666" text-anchor="middle">build</text><text x="680" y="733" font-size="8.5" fill="#999" text-anchor="middle">commits in its place</text>
  <use href="#diamond" x="800" y="690"/><text x="800" y="720" font-size="10" fill="#666" text-anchor="middle">join</text><text x="800" y="733" font-size="8.5" fill="#999" text-anchor="middle">not-done → spec · bound 2</text>
  <use href="#gear" x="920" y="690" color="#4a7fb5"/><text x="920" y="720" font-size="10" fill="#666" text-anchor="middle">review</text><text x="920" y="733" font-size="8.5" fill="#999" text-anchor="middle">persona adversarial</text>
  <use href="#diamond" x="1040" y="690"/><text x="1040" y="720" font-size="10" fill="#666" text-anchor="middle">join</text><text x="1040" y="733" font-size="8.5" fill="#999" text-anchor="middle">else build · bound 3</text>
  <g id="node-git"><use href="#gear" x="1160" y="690" color="#7b5cb8"/><text x="1160" y="720" font-size="10" fill="#666" text-anchor="middle">git.merge</text><text x="1160" y="733" font-size="8.5" fill="#999" text-anchor="middle">one per line · in order</text></g>
  <rect x="1240" y="681" width="170" height="18" rx="9" fill="#8a8a86"/>
  <text x="1325" y="694" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">bolt/plan-rows@f7a9d21</text>
  <text x="1325" y="716" font-size="8.5" fill="#999" text-anchor="middle">siblings rebased when idle</text>
  <g id="store-place">
    <use href="#repo" x="1530" y="690" color="#8a8a86"/>
    <text x="1530" y="726" font-size="10" fill="#666" text-anchor="middle">the bolt's own place</text>
    <text x="1530" y="739" font-size="8.5" fill="#999" text-anchor="middle">operator tests here · no session</text>
  </g>
  <path d="M 1412 690 L 1496 690" fill="none" stroke="#8a8a86" stroke-width="2" marker-end="url(#mN)"/>

  <!-- not-done returns -->
  <path d="M 800 674 C 760 636, 500 636, 448 674" fill="none" stroke="#c9962e" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#mA)"/>
  <path d="M 1040 674 C 1000 626, 740 626, 688 674" fill="none" stroke="#c9962e" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#mA)"/>
  <text x="1040" y="640" font-size="9" fill="#a97e26" text-anchor="middle">attempt+1</text>
  <text x="1040" y="768" font-size="8.5" fill="#a97e26" text-anchor="middle">past the bound: stopped · a blocked row</text>

  <!-- verdict from a stage that writes one -->
  <use href="#cube" x="920" y="790" color="#2b8a8a"/>
  <text x="944" y="794" font-size="9" fill="#1f6e6e">verdict · when the type says writes-verdict</text>
  <path d="M 900 792 C 720 850, 340 800, 300 600 C 280 500, 262 440, 218 406" fill="none" stroke="#2b8a8a" stroke-width="2" marker-end="url(#mT)"/>

  <!-- rows up to the operator -->
  <path d="M 688 674 C 720 560, 880 470, 898 392" fill="none" stroke="#c9962e" stroke-width="2.4" marker-end="url(#mA)"/>
  <text x="816" y="540" font-size="9.5" fill="#a97e26" font-weight="600">exits: chore · blocked → rows</text>
  <path d="M 1300 680 C 1300 540, 1050 420, 956 342" fill="none" stroke="#c9962e" stroke-width="2.4" marker-end="url(#mA)"/>
  <text x="1180" y="560" font-size="9.5" fill="#a97e26" font-weight="600" text-anchor="end">row land · every unit finished · no chore open</text>

  <!-- landing -->
  <g id="effect-git.land">
    <use href="#gate" x="1180" y="320"/>
    <text x="1180" y="352" font-size="10" fill="#666" text-anchor="middle">git.land</text>
    <text x="1180" y="365" font-size="8.5" fill="#999" text-anchor="middle">policy pr · take main first · gates decide</text>
  </g>
  <path d="M 970 320 L 1160 320" fill="none" stroke="#c9962e" stroke-width="2.4" marker-end="url(#mA)"/>
  <text x="1065" y="312" font-size="9.5" fill="#a97e26" font-weight="600" text-anchor="middle">yes on land</text>
  <use href="#repo" x="1400" y="320" color="#2e9e5b"/>
  <text x="1400" y="356" font-size="10" fill="#666" text-anchor="middle">atlas · main</text>
  <rect x="1350" y="364" width="100" height="18" rx="9" fill="#2e9e5b"/>
  <text x="1400" y="377" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">landed</text>
  <path d="M 1198 320 L 1366 320" fill="none" stroke="#2e9e5b" stroke-width="2" marker-end="url(#mG)"/>
  <text x="1282" y="312" font-size="9" fill="#27824c" text-anchor="middle">gates pass</text>
  <text x="1400" y="404" font-size="8.5" fill="#a34848" text-anchor="middle">gates fail: bolt stays open, failure on it</text>
  <use href="#check" x="1330" y="430"/>
  <text x="1346" y="434" font-size="9" fill="#27824c">as-built serves: names the claim</text>

  <!-- ============ LEGEND ============ -->
  <rect x="40" y="876" width="1600" height="100" rx="10" fill="#fafafa" stroke="#d5d5d0"/>
  <g font-size="10.5" fill="#555">
    <use href="#gear" x="80" y="910" color="#4a7fb5"/><text x="102" y="914">agent node</text>
    <use href="#gear" x="200" y="910" color="#7b5cb8"/><text x="222" y="914">machinery</text>
    <use href="#diamond" x="320" y="910"/><text x="344" y="914">join</text>
    <use href="#cube" x="410" y="908" color="#2e9e5b"/><text x="436" y="914">artifact</text>
    <use href="#cyl" x="530" y="910" color="#2b8a8a"/><text x="564" y="914">ledger</text>
    <use href="#repo" x="650" y="910" color="#8a8a86"/><text x="686" y="914">line · place</text>
    <use href="#gate" x="790" y="910"/><text x="808" y="914">landing gates</text>
    <polygon points="920,896 934,910 920,924 906,910" fill="#fffdf6" stroke="#c9962e" stroke-width="1.6"/><text x="944" y="914">the operator</text>
    <line x1="1050" y1="910" x2="1090" y2="910" stroke="#c9962e" stroke-width="3"/><text x="1100" y="914">rows in · word out</text>
    <line x1="1230" y1="910" x2="1270" y2="910" stroke="#c9962e" stroke-width="2" stroke-dasharray="4 3"/><text x="1280" y="914">not-done return</text>
    <line x1="1400" y1="910" x2="1440" y2="910" stroke="#2b8a8a" stroke-width="2" stroke-dasharray="2 5"/><text x="1450" y="914">ledger read</text>
    <line x1="1540" y1="910" x2="1580" y2="910" stroke="#2b8a8a" stroke-width="2"/><text x="1590" y="914">write</text>
  </g>
  <text x="80" y="954" font-size="10.5" fill="#555">after the yes on a unit nothing here waits for a word until the bolt's close — a stage fires when its item is queued and its place current, a join when every member has exited</text>
</svg>
