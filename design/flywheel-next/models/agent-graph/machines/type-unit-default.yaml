# A unit type is a subgraph template: one stage node per entry, wired
# done → next and not-done → return-to with the bound. The engine
# instantiates it per unit; the unit records the blueprints commit that
# defined it, and a change here never moves a unit in flight.
kind: unit-type
name: default
change-directory: true
lands-on: bolt-line
stages:
  - name: spec
    agent: flywheel-spec-writing
    members: {fixed: [{persona: default}]}
    join: all
    not-done: {return-to: spec, bound: 2}
    gates: [asbuilt-names-standing-claims]
  - name: build
    agent: flywheel-build
    members: {fixed: [{persona: default}]}
    join: all
    not-done: {return-to: spec, bound: 2}
  - name: review
    agent: flywheel-code-review
    members: {fixed: [{persona: adversarial}]}
    join: all
    not-done: {return-to: build, bound: 3}
  - name: merge
    machinery: git.merge
