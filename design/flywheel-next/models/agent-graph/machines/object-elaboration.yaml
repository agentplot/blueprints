kind: object
name: elaboration
artifacts: [proposal, word, elaboration, activation, session, observation, exit, effect]
states:
  - {state: dropped,   when: "or(word-on(proposal, proposal.generation) == drop, word-on(elaboration, drop))",                                                          proof: words, terminal: true}
  - {state: done,      when: "or(and(elaboration.type == self-closing, terminal-exit(elaboration.session) == done, any(f in effects, f.effect == git.merge and f.place == elaboration.place)), and(elaboration.type in [standing, with-operator], word-on(elaboration, finish)))", proof: effects, terminal: true}
  - {state: stalled,   when: "terminal-exit(elaboration.session) == stalled",                                                                                             proof: exits}
  - {state: blocked,   when: "and(latest(exits of session).kind == blocked, not(answered(latest(exits of session))))",                                                   proof: exits}
  - {state: offered,   when: "and(elaboration.type in [standing, with-operator], observed(elaboration.session) == idle, since(idle-since(elaboration.session)) >= idle-window, not(operator-present(elaboration.session)))", proof: observations}
  - {state: idle,      when: "observed(elaboration.session) == idle",                                                                                                     proof: observations}
  - {state: working,   when: "observed(elaboration.session) == working",                                                                                                  proof: observations}
  - {state: queued,    when: "and(elaboration exists, live-activation(elaboration, elaboration.id))",                                                                     proof: activations}
  - {state: approved,  when: "elaboration exists",                                                                                                                       proof: objects/elaboration}
  - {state: proposed,  when: "and(proposal.kind == elaboration, not(word-on(proposal, proposal.generation)))",                                                            proof: proposals}
