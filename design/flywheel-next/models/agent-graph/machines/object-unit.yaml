kind: object
name: unit
artifacts: [proposal, word, unit, item, advance, effect]
states:
  - {state: dropped,      when: "or(word-on(proposal, proposal.generation) == drop, word-on(unit, drop))",                      proof: words, terminal: true}
  - {state: finished,     when: "and(unit exists, all(i in items-of(unit), state(i) == merged))",                              proof: effects, terminal: true}
  - {state: in-flight,    when: "and(unit exists, any(i in items-of(unit), state(i) not in [waiting, merged]))",                proof: advances}
  - {state: waiting-deps, when: "and(unit exists, not(all(d in unit.after, state(d) == finished)))",                           proof: objects/unit}
  - {state: approved,     when: "unit exists",                                                                                 proof: objects/unit}
  - {state: redo,         when: "and(proposal.kind == unit, word-on(proposal, proposal.generation) == redo)",                   proof: words}
  - {state: proposed,     when: "and(proposal.kind == unit, not(word-on(proposal, proposal.generation)))",                      proof: proposals}
