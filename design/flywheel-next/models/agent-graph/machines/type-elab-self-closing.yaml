# Research, writing, a throwaway prototype whose answer is a note. The
# session ends itself; the machinery finishes the elaboration.
kind: elaboration-type
name: self-closing
agent: flywheel-design-session
ends: by-session
on-done: "git.merge the place into the intent line, then git.place.remove; the elaboration is done"
on-idle: "idle past stall-window with no terminal exit → the reconciler writes stalled; the elaboration waits on the operator as a blocked row with the last message as the question"
stall-window: 2h
place: merge-then-remove
