kind: node
name: planning
family: agent
key: "(repository, backlog-fingerprint(repository)) for each repository in the manifest"
when: "and(backlog-fingerprint(repository) != last-planning-fingerprint(repository), not(live-activation(planning, key)), host-has-slot(host))"
in: [claim, verdict, as-built, ask, signal, bolt, unit, manifest]
out: [exit]
session:
  agent: flywheel-bolt-planner
  place: "off the built repository's shared line"
  work-order:
    - schema instruction for a unit proposal document and a verdict, at the activation's books sha
    - the planning skill
    - the backlog: every standing claim in scope with no satisfied or not-applicable current verdict, with chapter text and scenarios
    - the ledger of the repository (empty on first planning, which the work order says)
    - the as-built: every serves line in the repository's OpenSpec specs at the shared head
    - every open bolt of the repository with the units it holds and their states
    - the asks and routed signals naming the repository
  exits: [done, blocked, finding, chore, stalled]
  stall-window: 2h
produces:
  - "for each proposed unit: write.proposal(kind=unit, repository, target-bolt | new-bolt-name, type, after, covers, items, document, routed-from)"
  - "for each judged claim: write.verdict(repository, claim, claim-version, revision, judgment, evidence)"
  - "on first planning: the proposal set carries routed-from=first-planning and may hold chores"
release: on-terminal-exit
notes: >
  Keyed by the backlog fingerprint, so a repository taking forty
  commits with no claim change never fires it (S11), and a stale verdict
  fires it exactly once per change of the set (S9, S10).
