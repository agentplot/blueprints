kind: node
name: join
family: machinery
key: "(item, stage, attempt) where every member activation exists"
when: "and(join-complete(item, stage, attempt), not(any(a in advances, a.item == item and a.from == stage and a.attempt == attempt)))"
in: [exit, activation, item, definition, as-built, claim]
out: [advance]
effects:
  - "write.advance"
produces:
  - "stage-verdict == done and every gate holds → advance(item, from=stage, to=next stage | merge)"
  - "stage-verdict == not-done or a gate fails, and not retry-exhausted → advance(item, from=stage, to=not-done.return-to, attempt=attempt+1, reason)"
  - "retry-exhausted → advance(item, to=stopped, reason=bound) — the item waits on the operator as a blocked row"
release: after-effects
notes: >
  The exits of every member are collected as one set (A.5.48); the
  join rule is all, any or a count. The item's history is its advances
  (S14). Gates are predicates named by the type, e.g.
  asbuilt-names-standing-claims (I9).
