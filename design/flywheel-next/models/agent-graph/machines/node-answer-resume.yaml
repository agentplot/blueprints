kind: node
name: answer-resume
family: agent
key: "(object, exit) for blocked exits where answered(exit) and observed(exit.session) == gone"
when: "and(answered(exit), observed(exit.session) == gone, not(live-activation(answer-resume, key)), host-has-slot(host))"
in: [exit, word, item, elaboration]
out: [exit]
session:
  agent: "the agent of the object's node and stage"
  place: "the object's place"
  work-order:
    - the object's ordinary work order (node-stage or node-elaboration)
    - the question the prior session asked, and the operator's answer, first
  exits: [done, blocked, finding, chore, stalled]
  stall-window: 2h
produces:
  - "exit records; the object's derivation continues at the same stage and attempt"
release: on-terminal-exit
notes: >
  A.7.59: the answer goes to the same session if it still lives
  (runner: session.tell); otherwise to a fresh one that starts with it.
