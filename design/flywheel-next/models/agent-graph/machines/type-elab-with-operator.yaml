# A back-and-forth the operator is in. The machinery neither ends it
# nor asks about it while the operator is present.
kind: elaboration-type
name: with-operator
agent: flywheel-interactive-session
ends: by-word
on-done: "as standing"
on-idle: "as standing, except that the idle row is suppressed while operator-present holds"
idle-window: 15m
suppress-idle-when: "operator-present(elaboration.session)"
place: keep-while-session
notes: >
  operator-present is herdr's report of human keystrokes on the pane
  within presence-window, or the word in (cleared by out) on the
  elaboration.
