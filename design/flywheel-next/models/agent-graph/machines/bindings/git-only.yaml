# The git-only profile: every piece of durable state is a file in a git
# repository; GitHub is used for repositories, pushes and webhooks only.
kind: binding
profile: git-only
central-service: "the git host (GitHub): accepts one update to a branch at a time, rejects a stale base, calls a URL on push"

scope:
  state-repository: "<org>-flywheel-state"
  shared-line: main

stores:
  captures:            {system: blueprints repo,  path: "signals/captures/<id>.rec",  record: recutils, identity: SourceKey}
  signals:             {system: blueprints repo,  path: "signals/<capture>.rec",       record: recutils, identity: Id}
  moves:               {system: blueprints repo,  path: "signals/moves.rec",           record: recutils, identity: "Signal + Date"}
  proposals:           {system: state repo,  path: "proposals/<kind>/<id>.rec (+ <id>.md for a unit document)", record: recutils, identity: Id}
  objects/intent:      {system: state repo,  path: "objects/intent/<id>.rec — the object record, then every activation, exit, word, effect record naming it, appended", record: recutils, identity: Id}
  objects/elaboration: {system: state repo,  path: "objects/elaboration/<id>.rec", record: recutils, identity: Id}
  objects/bolt:        {system: state repo,  path: "objects/bolt/<id>.rec",        record: recutils, identity: Id}
  objects/unit:        {system: state repo,  path: "objects/unit/<id>.rec",        record: recutils, identity: Id}
  objects/item:        {system: state repo,  path: "objects/item/<id>.rec",        record: recutils, identity: Id}
  activations:         {system: state repo,  path: "a record in the object's file", record: recutils, identity: "Node + Key + Generation"}
  sessions:            {system: state repo,  path: "a record in the object's file", record: recutils, identity: activation id}
  observations:        {system: state repo,  path: "a record in the object's file, written only when it changes a derived state", record: recutils, identity: "Subject + At"}
  exits:               {system: state repo,  path: "a record in the object's file", record: recutils, identity: "Session + sequence"}
  advances:            {system: state repo,  path: "a record in the item's file",   record: recutils, identity: "Item + From + To + Attempt"}
  words:               {system: state repo,  path: "words/<rendering>-<row>.rec; a direct act is a commit by a non-machinery author to an object's file", record: recutils, identity: "Row + Generation"}
  effects:             {system: state repo,  path: "a record in the object's file", record: recutils, identity: Id}
  conflicts:           {system: state repo,  path: "a record in the item's or elaboration's file", record: recutils, identity: "Place + heads"}
  ledger:              {system: blueprints repo,  path: "ledger/<repository>.rec",       record: recutils, identity: "Repository + Claim + ClaimVersion + Revision"}
  renderings:          {system: state repo,  path: "renderings/<id>.rec",           record: recutils, identity: rows fingerprint}
  hosts:               {system: state repo,  path: "hosts/<host>.rec; liveness = branch heartbeat/<host>, a single orphan commit force-pushed every heartbeat-interval, message = the time", record: recutils, identity: host}
  asks:                {system: state repo,  path: "asks/<id>.rec",                 record: recutils, identity: Id}
  review-marks:        {system: blueprints repo,  path: "review-marks/<who>.rec",        record: recutils, identity: who}
  blueprints-shared-line:   {system: blueprints repo,  path: "main", record: "mdBook chapters with ```claim blocks; flywheel/**", identity: sha}
  repo-shared-line:    {system: built repo,  path: "main: openspec/specs/**/spec.md", record: OpenSpec, identity: sha}
  git-host:            {system: GitHub,      record: "git ls-remote; push results; webhooks"}
  multiplexer:         {system: herdr,       record: "herdr agent list/status/last-message"}
  host-disk:           {system: worktrunk,   record: "wt list; git rev-parse"}

evidence:
  read:            "git fetch origin main (state, blueprints, each built repo) before every tick; read files at origin/main; as-of = that sha"
  list:            "the directory layout at origin/main: objects/<kind>/*.rec, proposals/**, words/*, asks/*, hosts/*"
  unmoved-signals: "signals/*.rec minus signals/moves.rec on blueprints main"
  standing-claims: "```claim blocks in src/**/*.md on blueprints main, scoped by flywheel/manifest.yaml"
  host-alive:      "git ls-remote origin refs/heads/heartbeat/<host>; the commit's time within lease-ttl"
  observed:        "herdr agent status"
  gate-result:     "gh pr checks (reading the PR of the repository's own landing gate; not a state store)"

effects:
  write-effect:    "append the record to the object's file; commit with message 'effect <id>: <reason>\n\nevidence: <as-of sha and the heads>'; push; on rejection: fetch, rebase, push; on a same-file conflict: drop the commit and read again"
  write.word:      "words/<rendering>-<row>.rec by the word writer; commit; push; on rejection, rebase and push (a different file per word, so it never conflicts unless the same word was written by another writer, which is the duplicate case: keep theirs)"
  write.*:         "as write-effect: one record appended to the file the identity names"
  present.page:    "build status/index.html and plan/index.html from list + read; force-push both as one commit to branch status; the operator's own server serves that tree on the private network"
  present.chat:    "Discord bot in the word writer: post the rows; edit the previous message as superseded"
  git.*:           "git + wt on the host; land by manifest policy"
  session.*:       "herdr agent start/send/stop"

lease:
  take:    "append the activation record to the object's file; commit; push. The push is the compare-and-swap: a rejected push means another host wrote the file; fetch, rebase; a conflict in the same file means the lease is lost — drop the commit, read again"
  renew:   "no commit: the heartbeat branch is the renewal for every lease the host holds"
  release: "append Released: <time> to the activation record; commit; push"
  expire:  "heartbeat/<host> older than lease-ttl; effect-only activations retaken automatically; session-backed need the word takeover (the session may still run on a host that only lost its network)"

receive:
  transport: "a Discord reply, or a choice on the plan page; both reach the word writer"
  writer:    "flywheel word — one instance per organization, elected by the activation singleton:word; it runs the Discord bot and the page's answer endpoint"
  landed:    "the bot reacts ✅ on the message after the push succeeds, ❌ with the reason if the row no longer holds; the page shows the word on its next build"
  by-hand:   "a word file or a state-file edit committed to main from a laptop is the same fact (S19)"

notify:
  mechanism: "GitHub webhook on push to state main, blueprints main, and each built repository's main, to every host's URL; a 60 s poll besides; every host fetches before every tick"
  bound: "seconds by webhook; 60 s by poll; no decision on a read older than the last fetch"

status-view:
  no-host: "branch status of the state repository, served by the operator's own means; first line: as of <main sha> · <time>"
  page: "the same tree, rebuilt each tick"

direct-word:
  - {sees: "an object file whose State line was edited by a non-machinery author to closed",  word: close}
  - {sees: "… to dropped",                                                                     word: drop}
  - {sees: "… to approved on a proposal",                                                     word: yes}
  - {sees: "a bolt file whose Name line changed by a non-machinery author",                    word: "rename <name>"}
  - {sees: "any other hand edit",                                                              word: "none — the derivation ignores the line; observation(drift) recorded"}

adds:
  - {guarantee: single writer,     mechanism: "one file per object; the git host rejects a stale base; a same-file rebase conflicts", state-lives: "the branch main"}
  - {guarantee: durable,           mechanism: "a commit on origin/main is the fact; local commits are intentions",                     state-lives: "the git host"}
  - {guarantee: atomic per write,  mechanism: "one commit per write; a reader sees a commit or not",                                  state-lives: "git"}
  - {guarantee: word exactly once, mechanism: "one file per (rendering, row); a second writer's push loses and keeps the first",       state-lives: "words/"}
  - {guarantee: bounded history,   mechanism: "heartbeats and the status page on force-pushed single-commit branches; observations committed only when they change a derived state", state-lives: "branches heartbeat/*, status"}
