# The tracker profile: objects on GitHub issues, milestones and one
# Projects board; records in the books repository. This is the only
# place a label, a column, a field or a path is named for this profile.
kind: binding
profile: tracker
central-service: "GitHub organization: issues, milestones, a Projects (v2) board, issue comments; reached with gh"

scope:
  label: "fw:next"                       # A.13.83: every object of this flywheel carries it; the current flywheel's items do not
  project: "Flywheel next"

stores:
  captures:            {system: books repo (git),  path: "signals/captures/<id>.rec",  record: recutils, identity: SourceKey}
  signals:             {system: books repo (git),  path: "signals/<capture>.rec",       record: recutils, identity: Id}
  moves:               {system: books repo (git),  path: "signals/moves.rec",           record: recutils, identity: "Signal + Date"}
  proposals:           {system: GitHub issue,      path: "label fw:proposal, fw:<kind>; body = the document; generation = a hidden html comment <!-- gen: n -->", record: "issue body with a fenced flywheel yaml block", identity: issue number}
  objects/intent:      {system: GitHub issue + milestone, path: "label fw:intent; the proposal's issue relabelled; milestone <intent id> groups its elaborations", record: "fenced flywheel block in the body", identity: issue number}
  objects/elaboration: {system: GitHub issue,      path: "label fw:elaboration; milestone = intent",   record: "fenced flywheel block", identity: issue number}
  objects/bolt:        {system: GitHub issue + milestone, path: "label fw:bolt; milestone <bolt id> groups its units and items; name = milestone title (renamable)", record: "fenced flywheel block", identity: issue number}
  objects/unit:        {system: GitHub issue,      path: "label fw:unit; milestone = bolt",           record: "fenced flywheel block", identity: issue number}
  objects/item:        {system: GitHub issue,      path: "label fw:item; milestone = bolt",           record: "fenced flywheel block", identity: issue number}
  activations:         {system: GitHub issue comment, path: "on the object's issue; body starts with `activation:`", record: "fenced flywheel block with Node, Key, Generation, Host, Until, Released", identity: "comment id; winner = lowest id per (Node, Key, Generation)"}
  sessions:            {system: GitHub issue comment, path: "on the object's issue; `session:`; edited in place", record: "fenced block", identity: activation id}
  observations:        {system: GitHub issue comment, path: "on the object's issue; `observation:`; one per subject, edited", record: "fenced block", identity: subject}
  exits:               {system: GitHub issue comment, path: "on the object's issue; `exit:`", record: "fenced block", identity: "session + sequence"}
  advances:            {system: GitHub issue comment, path: "on the item's issue; `advance:`", record: "fenced block", identity: "item + from + to + attempt"}
  words:               {system: GitHub issue comment, path: "on the row's issue; `word:`; a direct act is the issue's own state or card column", record: "fenced block with Row, Generation, Answer, By, Via", identity: "Row + Generation (first comment wins; later ones acknowledged)"}
  effects:             {system: GitHub issue comment, path: "on the object the effect concerns; `effect:`", record: "fenced block with Id, Reason, Evidence, Result", identity: Id}
  conflicts:           {system: GitHub issue comment, path: "on the item's or elaboration's issue; `conflict:`", record: "fenced block", identity: "place + heads"}
  ledger:              {system: books repo (git),  path: "ledger/<repository>.rec",   record: recutils, identity: "Repository + Claim + ClaimVersion + Revision"}
  renderings:          {system: GitHub issue comment, path: "on the pinned issue `fw:plan`", record: "fenced block", identity: rows fingerprint}
  hosts:               {system: GitHub issue,      path: "label fw:host; heartbeat = an edited comment `heartbeat:`", record: "fenced block with Bound, Profile; heartbeat comment's updated_at is the liveness", identity: host name}
  asks:                {system: GitHub issue,      path: "label fw:ask",                record: "fenced block", identity: issue number}
  review-marks:        {system: books repo (git),  path: "review-marks/<who>.rec",      record: recutils, identity: who}
  books-shared-line:   {system: books repo (git),  path: "main: src/**/*.md claim blocks; flywheel/{types,instructions,skills,hooks,manifest.yaml,context-map.yaml}", record: "mdBook chapter; YAML", identity: sha}
  repo-shared-line:    {system: built repo (git),  path: "main: openspec/specs/**/spec.md serves: lines", record: OpenSpec, identity: sha}
  git-host:            {system: GitHub,            record: "branch heads via gh api / git ls-remote"}
  multiplexer:         {system: herdr,             record: "herdr agent list/status/last-message"}
  host-disk:           {system: worktrunk,         record: "wt list; git rev-parse in the worktree"}

evidence:
  read:            "gh issue view <n> --json …,comments; as-of = max updated_at of what was read"
  unmoved-signals: "parse signals/*.rec minus moves.rec on books main"
  standing-claims: "parse ```claim blocks from src/**/*.md on books main, filtered by scope against flywheel/manifest.yaml"
  as-built:        "grep serves: in openspec/specs/**/spec.md at the repository's main"
  line-head:       "git ls-remote <repository> refs/heads/<line>"
  observed:        "herdr agent status <activation>; last output time against idle-window"
  operator-present:"herdr agent status <activation> --input-age; or a word in/out comment"
  gate-result:     "gh pr checks <url>"
  host-alive:      "the host issue's heartbeat comment updated_at within lease-ttl"

effects:
  write-effect:      "gh issue comment <n> --body 'effect: …' after listing comments for the id; an existing id is a no-op"
  write.object:      "gh issue edit <n> --add-label fw:<kind> --remove-label fw:proposal --milestone <parent>; body fenced block updated"
  write.proposal:    "gh issue create --label fw:proposal,fw:<kind>,fw:next --body <document>; amend = edit body, bump gen"
  write.move:        "append to signals/moves.rec; commit to books main (policy direct for machinery records)"
  write.verdict:     "append to ledger/<repository>.rec; commit to books main"
  write.advance:     "gh issue comment on the item"
  write.word:        "gh issue comment on the row's issue; then re-list: the lowest comment id for (Row, Generation) is the word"
  write.rendering:   "gh issue comment on the fw:plan issue"
  present.page:      "axum on the host's private-network address, /plan and /status; the board columns rewritten from derived state (projection)"
  present.chat:      "Discord bot: post the rows; edit the previous message as superseded; buttons per row where Discord allows; the reply grammar always works"
  git.*:             "git + wt on the host; land by manifest policy: gh pr create / gh pr merge, or git push --ff-only"
  session.*:         "herdr agent start --name <activation> --cwd <place> -- claude --agent <agent>; herdr agent send; herdr agent stop"

lease:
  take:    "post an activation comment; re-list; the lowest comment id for (Node, Key, Generation) holds; a loser edits its comment to Released: lost"
  renew:   "the host's heartbeat comment (one per host, edited every heartbeat-interval); no per-object renewal"
  release: "edit the activation comment: Released: <time>"
  expire:  "the holder host's heartbeat comment updated_at older than lease-ttl; effect-only activations may be retaken; session-backed ones need the word takeover"

receive:
  transport: "Discord reply in the operator's channel; the plan page's answer control; a comment on the row's issue; a direct act on the issue or board"
  attribution: "the reply names the rendering (the message it answers) and the row number; the page and issue name the row id"
  recorded-before-work: "write.word returns only after the comment exists; the bot reacts ✅ then"

notify:
  mechanism: "GitHub webhook (issues, issue_comment, push) to each host's URL; a 60 s poll besides"
  bound: "seconds by webhook; 60 s by poll"

status-view:
  no-host: "the Projects board (columns = derived state, written by the presenter) and the issues themselves, on github.com from a phone"
  page: "/status on any running host, built from list + read"

direct-word:
  - {sees: "issue closed by a non-machinery actor while state == proposed",                 word: drop}
  - {sees: "issue closed by a non-machinery actor while state in [open, close-offered]",   word: close}
  - {sees: "card moved to column Ready while state == proposed",                            word: yes}
  - {sees: "card moved to column Dropped",                                                  word: drop}
  - {sees: "milestone title changed on a bolt",                                             word: "rename <title>"}
  - {sees: "any other column change",                                                        word: "none — overwrite from the source; observation(drift)"}

adds:
  - {guarantee: single writer,        mechanism: "append-then-read lease by lowest comment id; artifacts written only by an activation holder", state-lives: "the activation comments themselves"}
  - {guarantee: word exactly once,    mechanism: "first comment per (Row, Generation) is the word; later ones are acknowledged as duplicates", state-lives: "the word comments"}
  - {guarantee: read as-of a point,   mechanism: "per-issue reads are consistent; cross-object decisions are re-derived every tick and land/archive re-read under the lease", state-lives: "none"}
  - {guarantee: effect idempotence,   mechanism: "list comments for the effect id before writing", state-lives: "the effect comments"}
