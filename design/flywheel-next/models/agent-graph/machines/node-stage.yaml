# The construction stage node, instantiated per (unit type, stage) from
# type-unit-*.yaml. One activation per member of the stage's set.
kind: node
name: stage
family: agent
key: "(item, stage-of(item).stage, stage-of(item).attempt, member) for member in stage-members(item, stage)"
when: "and(stage-of(item).stage == stage, stage-of(item).queued, dependencies-merged(item), place-current(item.place), not(live-activation(stage, key)), host-has-slot(host))"
in: [item, unit, advance, observation, word, claim, as-built, definition]
out: [exit, verdict]
session:
  agent: "<stage.agent> --persona <member.persona>"
  place: "the item's place off its bolt's line (git.place.prepare fires first when absent; shared for every member of one stage attempt)"
  work-order:
    - schema instruction for the stage's artifact (spec, code, review, test), at the activation's books sha
    - the stage's type skill
    - the item record, its unit's document, and its position in the unit
    - the claim(s) the unit covers, as chapters on the books shared line, with versions
    - the change directory of the unit (OpenSpec) with prior findings, chores and review notes
    - the advances so far (attempt number, what sent it back and why)
    - the answer to a prior blocked question, when one exists
  exits: [done, blocked, finding, chore, stalled]
  stall-window: 2h
produces:
  - "exit records via the reconciler; the done exit carries verdict: done | not-done for the stage's judgment"
  - "write.verdict when the stage's template says writes-verdict"
release: on-terminal-exit
notes: >
  Which members ran is the set of activations for (item, stage, attempt)
  (A.5.48). The join node reads their exits as one set. The type's
  gates are predicates the join evaluates before advancing.
