# A claim is a fenced block in a chapter. Its state is where the block
# exists; nothing stores it.
kind: object
name: claim
artifacts: [claim, unit, proposal]
states:
  - {state: moved,    when: "and(claim on books shared line, any(u in units, and(state(bolt-of(u)) == open, unit-covers-moved-claim(u))))", proof: books-shared-line}
  - {state: standing, when: "claim on books shared line",                                                                                   proof: books-shared-line}
  - {state: proposed, when: "claim on an intent line only",                                                                                 proof: books-shared-line}
