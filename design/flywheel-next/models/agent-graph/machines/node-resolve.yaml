kind: node
name: resolve
family: agent
key: "(place, conflict) for conflicts where conflict-open(place)"
when: "and(conflict-open(place), observed(place.session) != working, not(live-activation(resolve, key)), host-has-slot(host))"
in: [conflict, item, elaboration, observation]
out: [exit]
session:
  agent: flywheel-resolve
  place: "the conflicted place itself"
  work-order:
    - schema instruction for a conflict resolution commit
    - the resolve skill
    - "the conflict artifact: which take or rebase, which files, both heads"
    - the item or elaboration the place belongs to, with its work order
  exits: [done, blocked, finding, chore, stalled]
  stall-window: 1h
produces:
  - "on done: the git node retries the take or rebase that conflicted (its effect id includes the new heads)"
  - "past the type's bound for the current stage: the item is stopped and the conflict is a blocked row"
release: on-terminal-exit
notes: >
  A.5.45. The place's own session, when alive and idle, is told first
  (session.tell with the conflict) and this node fires only when that
  session is gone or has no place-level session (a line take with no
  idle place).
