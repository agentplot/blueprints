<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 900" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c05b5b"/></marker>
    <marker id="mN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a86"/></marker>
    <g id="gear">
      <circle r="9" fill="#fff" stroke="currentColor" stroke-width="2.4"/>
      <circle r="3" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="2.4">
        <line y1="-9" y2="-13.5"/><line y1="9" y2="13.5"/>
        <line x1="-9" x2="-13.5"/><line x1="9" x2="13.5"/>
        <line x1="-6.4" y1="-6.4" x2="-9.5" y2="-9.5"/><line x1="6.4" y1="6.4" x2="9.5" y2="9.5"/>
        <line x1="-6.4" y1="6.4" x2="-9.5" y2="9.5"/><line x1="6.4" y1="-6.4" x2="9.5" y2="-9.5"/>
      </g>
    </g>
    <g id="cube" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <path d="M -14 -7 L 0 -15 L 14 -7 L 14 9 L 0 17 L -14 9 Z" fill="#fff"/>
      <path d="M -14 -7 L 0 1 L 14 -7 M 0 1 L 0 17" fill="none"/>
    </g>
    <g id="repo">
      <rect x="-24" y="-16" width="48" height="32" rx="6" fill="#fff" stroke="currentColor" stroke-width="2"/>
      <circle cx="-8" cy="7" r="3" fill="currentColor"/>
      <circle cx="8" cy="-7" r="3" fill="currentColor"/>
      <path d="M -8 7 v-7 a 7 7 0 0 1 7 -7 h 1" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>
    <g id="marker">
      <circle r="7" fill="#fff" stroke="currentColor" stroke-width="2.2"/>
      <circle r="2.6" fill="currentColor"/>
    </g>
    <g id="cross">
      <circle r="10" fill="#fff" stroke="currentColor" stroke-width="2"/>
      <path d="M -4 -4 l 8 8 M 4 -4 l -8 8" fill="none" stroke="currentColor" stroke-width="2.4"/>
    </g>
  </defs>
  <rect width="1680" height="900" fill="#fff"/>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">The four kinds are the same — only their types change</text>
  <text x="40" y="57" font-size="12" fill="#666">software delivery on the left, billing on the right · same geometry, and one difference, in red</text>

  <!-- ============ LEFT PANEL ============ -->
  <rect x="60" y="86" width="740" height="676" rx="12" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.4"/>
  <text x="82" y="112" font-size="12" font-weight="700" fill="#333">SOFTWARE DELIVERY</text>
  <text x="240" y="112" font-size="10" fill="#999">a built repository, and code in it</text>

  <rect x="100" y="140" width="620" height="96" rx="9" fill="#fff" stroke="#2e9e5b" stroke-width="1.6"/>
  <text x="118" y="166" font-size="11" font-weight="700" fill="#333">intent</text>
  <text x="118" y="186" font-size="9.5" font-family="monospace" fill="#666">an OpenSpec change in the blueprints</text>
  <text x="118" y="206" font-size="9" font-weight="700" fill="#a97e26">closed by the operator</text>
  <text x="118" y="224" font-size="8.5" fill="#999">its change directory holds what the elaborations did</text>
  <use href="#repo" x="668" y="188" color="#2e9e5b"/>

  <rect x="100" y="276" width="620" height="96" rx="9" fill="#fff" stroke="#7b5cb8" stroke-width="1.6"/>
  <text x="118" y="302" font-size="11" font-weight="700" fill="#333">elaboration</text>
  <text x="118" y="322" font-size="9.5" font-family="monospace" fill="#666">research · prototype · planning</text>
  <text x="118" y="342" font-size="9" font-weight="700" fill="#a97e26">approved one at a time</text>
  <text x="118" y="360" font-size="8.5" fill="#999">one session, one conversation, one place</text>
  <use href="#gear" transform="translate(668,324) scale(1.3)" color="#7b5cb8"/>

  <rect x="100" y="412" width="620" height="96" rx="9" fill="#fff" stroke="#2e9e5b" stroke-width="1.6"/>
  <text x="118" y="438" font-size="11" font-weight="700" fill="#333">bolt</text>
  <text x="118" y="458" font-size="9.5" font-family="monospace" fill="#666">a batch that lands on a branch</text>
  <text x="118" y="478" font-size="9" font-weight="700" fill="#a97e26">closed by the operator</text>
  <text x="118" y="496" font-size="8.5" fill="#27824c">it lands in the built repository, once</text>
  <use href="#cube" x="668" y="454" color="#2e9e5b"/>

  <rect x="100" y="548" width="620" height="152" rx="9" fill="#fff" stroke="#4a7fb5" stroke-width="1.6"/>
  <text x="118" y="574" font-size="11" font-weight="700" fill="#333">unit</text>
  <text x="118" y="594" font-size="9.5" font-family="monospace" fill="#666">one approved piece of construction work</text>
  <text x="118" y="614" font-size="9" font-weight="700" fill="#3f6d9c">its type is the machine that runs it</text>
  <text x="702" y="614" font-size="8.5" fill="#999" text-anchor="end">stages, in order</text>
  <use href="#marker" x="190" y="650" color="#4a7fb5"/>
  <use href="#marker" x="330" y="650" color="#4a7fb5"/>
  <use href="#marker" x="470" y="650" color="#4a7fb5"/>
  <use href="#marker" x="610" y="650" color="#4a7fb5"/>
  <g stroke="#4a7fb5" stroke-width="1.6" opacity="0.5">
    <line x1="199" y1="650" x2="321" y2="650"/><line x1="339" y1="650" x2="461" y2="650"/><line x1="479" y1="650" x2="601" y2="650"/>
  </g>
  <g font-size="9" fill="#666" text-anchor="middle">
    <text x="190" y="676">spec</text><text x="330" y="676">build</text><text x="470" y="676">review</text><text x="610" y="676">merge</text>
  </g>
  <text x="118" y="734" font-size="8.5" fill="#999">187 as it stands: every elaboration hangs from an intent</text>

  <!-- ============ RIGHT PANEL ============ -->
  <rect x="880" y="86" width="740" height="676" rx="12" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.4"/>
  <text x="902" y="112" font-size="12" font-weight="700" fill="#333">BILLING</text>
  <text x="980" y="112" font-size="10" fill="#999">no built repository, and no code at all</text>

  <rect x="920" y="140" width="620" height="96" rx="9" fill="#fafafa" stroke="#8a8a86" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="938" y="166" font-size="11" font-weight="700" fill="#5f6b7a">no intent</text>
  <text x="938" y="186" font-size="9.5" font-family="monospace" fill="#999">the process is the destination</text>
  <text x="938" y="206" font-size="9" font-weight="700" fill="#5f6b7a">nothing to pursue, nothing to close</text>
  <text x="938" y="224" font-size="8.5" fill="#999">the book states the process; the types carry it</text>
  <use href="#cross" x="1488" y="188" color="#8a8a86"/>

  <rect x="920" y="276" width="620" height="96" rx="9" fill="#fff" stroke="#7b5cb8" stroke-width="1.6"/>
  <text x="938" y="302" font-size="11" font-weight="700" fill="#333">elaboration</text>
  <text x="938" y="322" font-size="9.5" font-family="monospace" fill="#666">reminder-draft · discrepancy-draft</text>
  <text x="938" y="342" font-size="9" font-weight="700" fill="#a97e26">approved as one batch, per month</text>
  <text x="938" y="360" font-size="8.5" fill="#a34848">raised by a unit's timer · no change directory to write into</text>
  <use href="#gear" transform="translate(1488,324) scale(1.3)" color="#7b5cb8"/>

  <rect x="920" y="412" width="620" height="96" rx="9" fill="#fff" stroke="#2e9e5b" stroke-width="1.6"/>
  <text x="938" y="438" font-size="11" font-weight="700" fill="#333">bolt — the billing month</text>
  <text x="938" y="458" font-size="9.5" font-family="monospace" fill="#666">billing-month@1</text>
  <text x="938" y="478" font-size="9" font-weight="700" fill="#a97e26">closed by the operator</text>
  <text x="938" y="496" font-size="8.5" fill="#1f6e6e">it lands as an archive package in WorkDrive</text>
  <use href="#cube" x="1488" y="454" color="#2e9e5b"/>

  <rect x="920" y="548" width="620" height="152" rx="9" fill="#fff" stroke="#4a7fb5" stroke-width="1.6"/>
  <text x="938" y="574" font-size="11" font-weight="700" fill="#333">unit — the invoice cycle</text>
  <text x="938" y="594" font-size="9.5" font-family="monospace" fill="#666">invoice-cycle@1 · keyed on vendor and month</text>
  <text x="938" y="614" font-size="9" font-weight="700" fill="#3f6d9c">its type is the machine that runs it</text>
  <text x="1522" y="614" font-size="8.5" fill="#999" text-anchor="end">stages, in order</text>
  <use href="#marker" x="980" y="650" color="#4a7fb5"/>
  <use href="#marker" x="1090" y="650" color="#4a7fb5"/>
  <use href="#marker" x="1200" y="650" color="#4a7fb5"/>
  <use href="#marker" x="1310" y="650" color="#4a7fb5"/>
  <use href="#marker" x="1420" y="650" color="#4a7fb5"/>
  <g stroke="#4a7fb5" stroke-width="1.6" opacity="0.5">
    <line x1="989" y1="650" x2="1081" y2="650"/><line x1="1099" y1="650" x2="1191" y2="650"/>
    <line x1="1209" y1="650" x2="1301" y2="650"/><line x1="1319" y1="650" x2="1411" y2="650"/>
  </g>
  <g font-size="9" fill="#666" text-anchor="middle">
    <text x="980" y="676">awaiting</text><text x="1090" y="676">received</text><text x="1200" y="676">pending</text>
    <text x="1310" y="676">reconciled</text><text x="1420" y="676">archived</text>
  </g>
  <rect x="920" y="714" width="620" height="34" rx="8" fill="#fbeeee" stroke="#c05b5b" stroke-width="1.4"/>
  <text x="938" y="736" font-size="9" font-weight="700" fill="#a34848">amends 187 — an elaboration may hang from a unit, and then has no change directory</text>

  <!-- ============ THE ONE DIFFERENCE ============ -->
  <path d="M 96 190 C 74 220, 74 290, 94 320" fill="none" stroke="#c05b5b" stroke-width="2.4" marker-end="url(#mR)"/>
  <text x="130" y="262" font-size="9.5" font-weight="700" fill="#a34848">the parent is the intent</text>
  <path d="M 916 632 C 890 540, 890 400, 914 326" fill="none" stroke="#c05b5b" stroke-width="2.4" marker-end="url(#mR)"/>
  <text x="950" y="262" font-size="9.5" font-weight="700" fill="#a34848">the parent is a unit</text>
  <text x="950" y="530" font-size="8.5" fill="#a34848">the timer on a stage raises it</text>

  <!-- ============ LEGEND ============ -->
  <rect x="40" y="782" width="1600" height="102" rx="10" fill="#fafafa" stroke="#d5d5d0"/>
  <g font-size="10.5" fill="#555">
    <use href="#repo" x="72" y="814" color="#777"/><text x="104" y="818">a change in git</text>
    <use href="#gear" x="250" y="814" color="#777"/><text x="270" y="818">a session</text>
    <use href="#cube" x="390" y="814" color="#777"/><text x="410" y="818">a batch that lands</text>
    <use href="#marker" x="590" y="814" color="#777"/><text x="606" y="818">a stage</text>
    <use href="#cross" x="720" y="814" color="#777"/><text x="738" y="818">absent here</text>
    <line x1="890" y1="814" x2="930" y2="814" stroke="#c05b5b" stroke-width="2.4"/><text x="940" y="818">what an elaboration hangs from</text>
  </g>
  <g font-size="10.5" fill="#555">
    <line x1="72" y1="848" x2="112" y2="848" stroke="#4a7fb5" stroke-width="3"/><text x="122" y="852">machinery — types and stages</text>
    <line x1="340" y1="848" x2="380" y2="848" stroke="#c9962e" stroke-width="3"/><text x="390" y="852">what the operator answers</text>
    <line x1="590" y1="848" x2="630" y2="848" stroke="#2e9e5b" stroke-width="3"/><text x="640" y="852">records in git</text>
    <line x1="770" y1="848" x2="810" y2="848" stroke="#7b5cb8" stroke-width="3"/><text x="820" y="852">sessions — judgment</text>
    <line x1="990" y1="848" x2="1030" y2="848" stroke="#2b8a8a" stroke-width="3"/><text x="1040" y="852">external systems · adapters</text>
    <line x1="1250" y1="848" x2="1290" y2="848" stroke="#c05b5b" stroke-width="3"/><text x="1300" y="852">the one difference</text>
    <line x1="1450" y1="848" x2="1490" y2="848" stroke="#8a8a86" stroke-width="3"/><text x="1500" y="852">people and places</text>
  </g>
  <text x="72" y="876" font-size="10.5" fill="#666">four kinds, one geometry — the types differ, and the only structural change the business process asks for is the parent of an elaboration</text>
</svg>
