<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 990" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a86"/></marker>
    <marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a7fb5"/></marker>
    <marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e5b"/></marker>
    <marker id="mP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b5cb8"/></marker>
    <marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9962e"/></marker>
    <marker id="mT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b8a8a"/></marker>
    <g id="gear">
      <circle r="9" fill="#fff" stroke="currentColor" stroke-width="2.4"/>
      <circle r="3" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="2.4">
        <line y1="-9" y2="-13.5"/><line y1="9" y2="13.5"/>
        <line x1="-9" x2="-13.5"/><line x1="9" x2="13.5"/>
        <line x1="-6.4" y1="-6.4" x2="-9.5" y2="-9.5"/><line x1="6.4" y1="6.4" x2="9.5" y2="9.5"/>
        <line x1="-6.4" y1="6.4" x2="-9.5" y2="9.5"/><line x1="6.4" y1="-6.4" x2="9.5" y2="-9.5"/>
      </g>
    </g>
    <g id="cube" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <path d="M -13 -6 L 0 -14 L 13 -6 L 13 8 L 0 16 L -13 8 Z" fill="#fff"/>
      <path d="M -13 -6 L 0 2 L 13 -6 M 0 2 L 0 16" fill="none"/>
    </g>
    <g id="doc">
      <path d="M -10 -13 h 12 l 8 8 v 18 h -20 z" fill="#fff" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M 2 -13 v 8 h 8" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <line x1="-5" y1="4" x2="5" y2="4" stroke="currentColor" stroke-width="1.4"/>
      <line x1="-5" y1="9" x2="2" y2="9" stroke="currentColor" stroke-width="1.4"/>
    </g>
    <g id="row" stroke="currentColor" stroke-width="1.6" fill="none">
      <rect x="-11" y="-8" width="22" height="16" rx="2" fill="#fff"/>
      <line x1="-6" y1="-2" x2="6" y2="-2"/><line x1="-6" y1="3" x2="2" y2="3"/>
    </g>
    <g id="marker">
      <circle r="7" fill="#fff" stroke="currentColor" stroke-width="2.2"/>
      <circle r="2.6" fill="currentColor"/>
    </g>
    <g id="check" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <circle r="9" stroke-width="2" fill="#fff"/>
      <path d="M -4.5 0 L -1 3.5 L 4.5 -3.5"/>
    </g>
    <g id="clock">
      <circle r="9" fill="#fff" stroke="currentColor" stroke-width="2"/>
      <path d="M 0 -5 V 0 H 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <g id="mail">
      <rect x="-13" y="-9" width="26" height="18" rx="2" fill="#fff" stroke="currentColor" stroke-width="1.8"/>
      <path d="M -13 -9 L 0 2 L 13 -9" fill="none" stroke="currentColor" stroke-width="1.8"/>
    </g>
    <g id="gate" stroke="#c05b5b" stroke-width="3" stroke-linecap="round">
      <line x1="-8" y1="-11" x2="-8" y2="11"/><line x1="8" y1="-11" x2="8" y2="11"/><line x1="-8" y1="-3" x2="8" y2="-3"/>
    </g>
  </defs>
  <rect width="1680" height="990" fill="#fff"/>

  <text x="40" y="38" font-size="19" font-weight="700" fill="#1a1a1a">The invoice cycle — every phase is earned by a capture</text>
  <text x="40" y="59" font-size="12" fill="#666">and every outbound mail is a decision · one vendor, acme-eng, for one month, 2026-09</text>

  <!-- ============ THE CAPTURES ============ -->
  <text x="130" y="146" font-size="11" font-weight="700" fill="#1f6e6e">what earns it</text>
  <text x="130" y="162" font-size="8.5" fill="#999">evidence, never a claim</text>
  <g font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">
    <rect x="272" y="150" width="86" height="18" rx="9" fill="#2b8a8a"/><text x="315" y="163">doc 4417</text>
    <rect x="504" y="150" width="92" height="18" rx="9" fill="#2b8a8a"/><text x="550" y="163">bill 8823</text>
    <rect x="707" y="150" width="76" height="18" rx="9" fill="#2e9e5b"/><text x="745" y="163">142.0 h</text>
    <rect x="819" y="150" width="52" height="18" rx="9" fill="#4a7fb5"/><text x="845" y="163">ok</text>
    <rect x="978" y="150" width="104" height="18" rx="9" fill="#2b8a8a"/><text x="1030" y="163">paid 09-20</text>
    <rect x="1219" y="150" width="112" height="18" rx="9" fill="#2b8a8a"/><text x="1275" y="163">pkg 2026-09</text>
  </g>
  <use href="#doc" x="315" y="202" color="#2b8a8a"/>
  <use href="#cube" x="550" y="202" color="#2b8a8a"/>
  <use href="#row" x="745" y="202" color="#2e9e5b"/>
  <use href="#check" x="845" y="202" color="#4a7fb5"/>
  <use href="#marker" x="1030" y="202" color="#2b8a8a"/>
  <use href="#cube" x="1275" y="202" color="#2b8a8a"/>
  <g font-size="9" fill="#666" text-anchor="middle">
    <text x="315" y="236">a Paperless document</text>
    <text x="550" y="236">the Zoho bill, written back</text>
    <text x="745" y="236">the Hours row</text>
    <text x="845" y="236">the check, on the tick</text>
    <text x="1030" y="236">Zoho reports it paid</text>
    <text x="1275" y="236">the archive package</text>
  </g>
  <g fill="none" stroke="#8a8a86" stroke-width="1.6" marker-end="url(#mN)">
    <path d="M 315 250 L 315 336"/><path d="M 550 250 L 550 336"/><path d="M 745 250 L 745 336"/>
    <path d="M 845 250 L 845 336"/><path d="M 1030 250 L 1030 336"/><path d="M 1275 250 L 1275 336"/>
  </g>

  <!-- ============ THE TRACK ============ -->
  <line x1="170" y1="350" x2="1440" y2="350" stroke="#ccc" stroke-width="3"/>
  <g fill="none" stroke="#4a7fb5" stroke-width="2.2" marker-end="url(#mB)">
    <path d="M 214 350 L 410 350"/><path d="M 444 350 L 650 350"/><path d="M 684 350 L 890 350"/>
    <path d="M 924 350 L 1130 350"/><path d="M 1164 350 L 1308 350"/><path d="M 1360 350 L 1382 350"/>
  </g>
  <use href="#marker" x="200" y="350" color="#4a7fb5"/>
  <use href="#marker" x="430" y="350" color="#4a7fb5"/>
  <use href="#marker" x="670" y="350" color="#4a7fb5"/>
  <use href="#marker" x="910" y="350" color="#4a7fb5"/>
  <use href="#marker" x="1150" y="350" color="#4a7fb5"/>
  <use href="#marker" x="1400" y="350" color="#4a7fb5"/>
  <use href="#gate" x="1334" y="350"/>
  <text x="1334" y="320" font-size="9" font-weight="700" fill="#a34848" text-anchor="middle">all cycles reconciled</text>
  <g font-size="10.5" font-weight="700" fill="#333" text-anchor="middle">
    <text x="200" y="382">awaiting invoice</text>
    <text x="430" y="382">invoice received</text>
    <text x="670" y="382">timesheet pending</text>
    <text x="910" y="382">reconciled</text>
    <text x="1150" y="382">paid</text>
    <text x="1400" y="382">archived</text>
  </g>
  <g font-size="8.5" fill="#999" text-anchor="middle">
    <text x="200" y="398">reminder_count · last sent</text>
    <text x="430" y="398">document id · amount · hours</text>
    <text x="670" y="398">invoice hours vs the Hours row</text>
    <text x="910" y="398">class ok · nothing else advances</text>
    <text x="1150" y="398">paid_at, from Zoho</text>
    <text x="1400" y="398">archive_date · package id</text>
  </g>

  <!-- ============ SUPPRESSED ============ -->
  <path d="M 210 366 C 250 400, 290 430, 316 452" fill="none" stroke="#8a8a86" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#mN)"/>
  <text x="252" y="442" font-size="9" fill="#5f6b7a" text-anchor="end">suppress: on leave</text>
  <use href="#marker" x="330" y="470" color="#8a8a86"/>
  <text x="330" y="500" font-size="10.5" font-weight="700" fill="#5f6b7a" text-anchor="middle">suppressed</text>
  <text x="330" y="515" font-size="8.5" fill="#999" text-anchor="middle">a record with a reason, not a gap</text>
  <text x="330" y="529" font-size="8.5" fill="#999" text-anchor="middle">timers and checks skip it</text>

  <!-- ============ THE LADDER ============ -->
  <path d="M 186 360 C 116 380, 80 440, 106 566" fill="none" stroke="#4a7fb5" stroke-width="2" marker-end="url(#mB)"/>
  <text x="150" y="558" font-size="9.5" font-weight="700" fill="#3f6d9c">timers on the awaiting stage</text>
  <use href="#clock" x="150" y="592" color="#4a7fb5"/>
  <use href="#clock" x="150" y="640" color="#4a7fb5"/>
  <use href="#clock" x="150" y="688" color="#4a7fb5"/>
  <g font-size="9.5" fill="#666">
    <text x="172" y="596">day 2 · friendly</text>
    <text x="172" y="644">day 7 · direct</text>
    <text x="172" y="692">day 14 · firm</text>
  </g>
  <text x="150" y="718" font-size="8.5" fill="#999">each rung guarded on the count</text>
  <g fill="none" stroke="#4a7fb5" stroke-width="2" marker-end="url(#mB)">
    <path d="M 280 592 C 318 600, 340 618, 358 632"/>
    <path d="M 280 640 L 358 640"/>
    <path d="M 280 688 C 318 680, 340 662, 358 648"/>
  </g>
  <use href="#gear" transform="translate(380,640) scale(1.25)" color="#7b5cb8"/>
  <text x="380" y="676" font-size="10.5" font-weight="700" fill="#5a3f95" text-anchor="middle">reminder-draft</text>
  <text x="380" y="690" font-size="8.5" fill="#999" text-anchor="middle">one draft per vendor · sends nothing</text>
  <path d="M 400 640 L 552 640" fill="none" stroke="#7b5cb8" stroke-width="2.2" marker-end="url(#mP)"/>
  <text x="476" y="630" font-size="9" fill="#5a3f95" text-anchor="middle">a proposal, not a send</text>

  <!-- ============ THE DECISION ============ -->
  <polygon points="620,588 678,640 620,692 562,640" fill="#fffdf6" stroke="#c9962e" stroke-width="2.4"/>
  <text x="620" y="636" font-size="11" font-weight="700" fill="#8a6a1d" text-anchor="middle">APPROVE</text>
  <text x="620" y="652" font-size="8.5" fill="#a97e26" text-anchor="middle">one decision</text>
  <g font-size="9">
    <rect x="525" y="702" width="70" height="20" rx="10" fill="#fff" stroke="#2e9e5b" stroke-width="1.4"/>
    <text x="560" y="716" fill="#27824c" text-anchor="middle">approve</text>
    <rect x="603" y="702" width="52" height="20" rx="10" fill="#fff" stroke="#c9962e" stroke-width="1.4"/>
    <text x="629" y="716" fill="#a97e26" text-anchor="middle">edit</text>
    <rect x="663" y="702" width="52" height="20" rx="10" fill="#fff" stroke="#8a8a86" stroke-width="1.4"/>
    <text x="689" y="716" fill="#5f6b7a" text-anchor="middle">skip</text>
  </g>
  <text x="620" y="742" font-size="8.5" fill="#999" text-anchor="middle">batched by month · silence sends nothing</text>

  <!-- ============ THE EFFECT AND ITS PROOF ============ -->
  <path d="M 682 640 L 826 640" fill="none" stroke="#2b8a8a" stroke-width="2.2" marker-end="url(#mT)"/>
  <text x="754" y="630" font-size="9" fill="#1f6e6e" text-anchor="middle">the yes sends</text>
  <use href="#mail" x="850" y="640" color="#2b8a8a"/>
  <text x="850" y="674" font-size="10.5" font-weight="700" fill="#1f6e6e" text-anchor="middle">mail adapter</text>
  <text x="850" y="688" font-size="8.5" fill="#999" text-anchor="middle">on the host that holds the secret</text>
  <path d="M 868 640 L 928 640" fill="none" stroke="#2b8a8a" stroke-width="2.2" marker-end="url(#mT)"/>
  <rect x="934" y="631" width="112" height="18" rx="9" fill="#2b8a8a"/>
  <text x="990" y="644" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">msg 7f2a2b</text>
  <text x="990" y="616" font-size="9" fill="#1f6e6e" text-anchor="middle">the proof</text>
  <path d="M 985 654 C 880 762, 620 812, 428 806" fill="none" stroke="#2e9e5b" stroke-width="2.2" marker-end="url(#mG)"/>
  <text x="884" y="792" font-size="9" fill="#27824c">only the proof moves the count</text>
  <rect x="140" y="792" width="284" height="26" rx="13" fill="#2e9e5b"/>
  <text x="282" y="810" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">reminder_count 1 → 2 · 09-07</text>
  <text x="282" y="836" font-size="8.5" fill="#999" text-anchor="middle">on the cycle record, back at awaiting invoice</text>

  <!-- ============ LEGEND ============ -->
  <rect x="40" y="846" width="1600" height="118" rx="10" fill="#fafafa" stroke="#d5d5d0"/>
  <g font-size="10.5" fill="#555">
    <use href="#marker" x="70" y="880" color="#777"/><text x="86" y="884">a stage</text>
    <use href="#doc" x="180" y="880" color="#777"/><text x="198" y="884">a document</text>
    <use href="#cube" x="320" y="880" color="#777"/><text x="340" y="884">an artifact</text>
    <use href="#row" x="450" y="880" color="#777"/><text x="468" y="884">a record row</text>
    <use href="#check" x="600" y="880" color="#777"/><text x="618" y="884">a check</text>
    <use href="#clock" x="710" y="880" color="#777"/><text x="728" y="884">a timer</text>
    <use href="#gear" x="820" y="880" color="#777"/><text x="840" y="884">a session</text>
    <polygon points="960,868 982,880 960,892 938,880" fill="#fff" stroke="#c9962e" stroke-width="1.6"/><text x="992" y="884">a decision</text>
    <use href="#mail" x="1110" y="880" color="#777"/><text x="1130" y="884">the send</text>
    <use href="#gate" x="1230" y="880"/><text x="1246" y="884">a gate</text>
    <rect x="1330" y="871" width="66" height="18" rx="9" fill="#777"/><text x="1406" y="884">a real value</text>
  </g>
  <g font-size="10.5" fill="#555">
    <line x1="70" y1="918" x2="110" y2="918" stroke="#4a7fb5" stroke-width="3"/><text x="120" y="922">machinery — stages, timers, checks</text>
    <line x1="380" y1="918" x2="420" y2="918" stroke="#c9962e" stroke-width="3"/><text x="430" y="922">decisions and proposals</text>
    <line x1="610" y1="918" x2="650" y2="918" stroke="#2e9e5b" stroke-width="3"/><text x="660" y="922">records in git</text>
    <line x1="780" y1="918" x2="820" y2="918" stroke="#7b5cb8" stroke-width="3"/><text x="830" y="922">sessions — judgment</text>
    <line x1="990" y1="918" x2="1030" y2="918" stroke="#2b8a8a" stroke-width="3"/><text x="1040" y="922">external systems · adapters</text>
    <line x1="1230" y1="918" x2="1270" y2="918" stroke="#c05b5b" stroke-width="3"/><text x="1280" y="922">a refusal or a gate</text>
    <line x1="1420" y1="918" x2="1460" y2="918" stroke="#8a8a86" stroke-width="3"/><text x="1470" y="922">people and places</text>
  </g>
  <text x="70" y="950" font-size="10.5" fill="#666">no stage is asserted — each is earned by the capture above it · the ladder raises a draft, and only the operator's yes sends it</text>
</svg>
