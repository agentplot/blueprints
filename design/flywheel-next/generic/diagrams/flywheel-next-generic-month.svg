<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 940" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a86"/></marker>
    <marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a7fb5"/></marker>
    <marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e5b"/></marker>
    <marker id="mP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b5cb8"/></marker>
    <marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9962e"/></marker>
    <marker id="mT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b8a8a"/></marker>
    <g id="gear">
      <circle r="9" fill="#fff" stroke="currentColor" stroke-width="2.4"/>
      <circle r="3" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="2.4">
        <line y1="-9" y2="-13.5"/><line y1="9" y2="13.5"/>
        <line x1="-9" x2="-13.5"/><line x1="9" x2="13.5"/>
        <line x1="-6.4" y1="-6.4" x2="-9.5" y2="-9.5"/><line x1="6.4" y1="6.4" x2="9.5" y2="9.5"/>
        <line x1="-6.4" y1="6.4" x2="-9.5" y2="9.5"/><line x1="6.4" y1="-6.4" x2="9.5" y2="-9.5"/>
      </g>
    </g>
    <g id="cyl">
      <path d="M -20 -9 L -20 11 A 20 6.5 0 0 0 20 11 L 20 -9" fill="#fff" stroke="currentColor" stroke-width="1.6"/>
      <ellipse cx="0" cy="-9" rx="20" ry="6.5" fill="currentColor" fill-opacity="0.16" stroke="currentColor" stroke-width="1.6"/>
    </g>
    <g id="person">
      <circle cy="-6" r="4" fill="#fff" stroke="currentColor" stroke-width="1.8"/>
      <path d="M -7 8 a 7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="1.8"/>
    </g>
    <g id="clock">
      <circle r="9" fill="#fff" stroke="currentColor" stroke-width="2"/>
      <path d="M 0 -5 V 0 H 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <g id="check" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <circle r="9" stroke-width="2" fill="#fff"/>
      <path d="M -4.5 0 L -1 3.5 L 4.5 -3.5"/>
    </g>
    <g id="marker">
      <circle r="7" fill="#fff" stroke="currentColor" stroke-width="2.2"/>
      <circle r="2.6" fill="currentColor"/>
    </g>
    <g id="mail">
      <rect x="-13" y="-9" width="26" height="18" rx="2" fill="#fff" stroke="currentColor" stroke-width="1.8"/>
      <path d="M -13 -9 L 0 2 L 13 -9" fill="none" stroke="currentColor" stroke-width="1.8"/>
    </g>
    <g id="gate" stroke="#c05b5b" stroke-width="3" stroke-linecap="round">
      <line x1="-8" y1="-11" x2="-8" y2="11"/><line x1="8" y1="-11" x2="8" y2="11"/><line x1="-8" y1="-3" x2="8" y2="-3"/>
    </g>
  </defs>
  <rect width="1680" height="940" fill="#fff"/>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">One vendor, one month — the ledger has no gaps and nothing moves without evidence</text>
  <text x="40" y="57" font-size="12" fill="#666">acme-eng · 2026-09 · every mark below is a capture, a decision or a proof</text>

  <!-- axis -->
  <line x1="170" y1="100" x2="1620" y2="100" stroke="#ddd" stroke-width="1.6"/>
  <g font-size="10.5" fill="#999" text-anchor="middle">
    <text x="250" y="86">Sep 1 · init</text><text x="400" y="86">Sep 2 · reminder</text><text x="560" y="86">Sep 5 · invoice</text>
    <text x="700" y="86">Sep 5 · bill</text><text x="880" y="86">Sep 8 · hours asked</text><text x="1030" y="86">Sep 9 · reconciled</text>
    <text x="1230" y="86">Sep 20 · paid</text><text x="1450" y="86">Oct 1 · archived</text>
  </g>
  <g stroke="#ccc" stroke-width="1.4">
    <line x1="250" y1="95" x2="250" y2="105"/><line x1="400" y1="95" x2="400" y2="105"/><line x1="560" y1="95" x2="560" y2="105"/>
    <line x1="700" y1="95" x2="700" y2="105"/><line x1="880" y1="95" x2="880" y2="105"/><line x1="1030" y1="95" x2="1030" y2="105"/>
    <line x1="1230" y1="95" x2="1230" y2="105"/><line x1="1450" y1="95" x2="1450" y2="105"/>
  </g>

  <!-- ============ LANES ============ -->
  <text x="38" y="188" font-size="11.5" font-weight="700" fill="#5f6b7a">operator</text>
  <text x="38" y="202" font-size="8.5" fill="#999">answers, in Slack</text>
  <line x1="170" y1="190" x2="1620" y2="190" stroke="#8a8a86" stroke-width="2" opacity="0.3"/>
  <text x="38" y="298" font-size="11.5" font-weight="700" fill="#3f6d9c">machinery</text>
  <text x="38" y="312" font-size="8.5" fill="#999">the tick, every day</text>
  <line x1="170" y1="300" x2="1620" y2="300" stroke="#4a7fb5" stroke-width="2" opacity="0.45" stroke-dasharray="2 7"/>
  <text x="38" y="398" font-size="11.5" font-weight="700" fill="#5a3f95">sessions</text>
  <text x="38" y="412" font-size="8.5" fill="#999">judgment only</text>
  <line x1="170" y1="400" x2="1620" y2="400" stroke="#7b5cb8" stroke-width="2" opacity="0.3"/>
  <text x="38" y="498" font-size="11.5" font-weight="700" fill="#27824c">records</text>
  <text x="38" y="512" font-size="8.5" fill="#999">the Cycle record</text>
  <line x1="170" y1="500" x2="1620" y2="500" stroke="#2e9e5b" stroke-width="2" opacity="0.3"/>
  <text x="38" y="598" font-size="11.5" font-weight="700" fill="#1f6e6e">external</text>
  <text x="38" y="612" font-size="8.5" fill="#999">through adapters</text>
  <line x1="170" y1="600" x2="1620" y2="600" stroke="#2b8a8a" stroke-width="2" opacity="0.3"/>

  <!-- operator -->
  <use href="#person" x="200" y="190" color="#8a8a86"/>
  <polygon points="400,152 452,190 400,228 348,190" fill="#fffdf6" stroke="#c9962e" stroke-width="2.4"/>
  <text x="400" y="187" font-size="10.5" font-weight="700" fill="#8a6a1d" text-anchor="middle">APPROVE</text>
  <text x="400" y="201" font-size="8.5" fill="#a97e26" text-anchor="middle">one draft</text>
  <text x="336" y="250" font-size="8.5" fill="#999" text-anchor="end">the only gesture of the month</text>
  <rect x="818" y="178" width="124" height="24" rx="12" fill="#fff" stroke="#c9962e" stroke-width="1.6"/>
  <text x="880" y="194" font-size="9.5" font-family="monospace" fill="#a97e26" text-anchor="middle">hours 142.0</text>
  <text x="952" y="194" font-size="8.5" fill="#999">answered as a capture</text>

  <!-- machinery -->
  <use href="#gear" x="250" y="300" color="#4a7fb5"/>
  <text x="250" y="328" font-size="9" fill="#666" text-anchor="middle">month-init</text>
  <text x="250" y="341" font-size="8.5" fill="#999" text-anchor="middle">one cycle per active vendor</text>
  <use href="#clock" x="380" y="300" color="#4a7fb5"/>
  <text x="356" y="328" font-size="9" fill="#666" text-anchor="end">timer, day 2</text>
  <use href="#marker" x="880" y="300" color="#4a7fb5"/>
  <text x="880" y="326" font-size="9" fill="#666" text-anchor="middle">check: no hours</text>
  <text x="880" y="339" font-size="8.5" fill="#999" text-anchor="middle">no adapter can supply them</text>
  <use href="#check" x="1030" y="300" color="#4a7fb5"/>
  <text x="1030" y="328" font-size="9" fill="#666" text-anchor="middle">class ok</text>
  <text x="1030" y="341" font-size="8.5" fill="#999" text-anchor="middle">142.0 against 142.0</text>
  <use href="#gate" x="1360" y="300"/>
  <text x="1360" y="328" font-size="9" font-weight="700" fill="#a34848" text-anchor="middle">the month gate</text>
  <text x="1360" y="341" font-size="8.5" fill="#a34848" text-anchor="middle">all cycles reconciled</text>

  <!-- sessions -->
  <use href="#gear" x="400" y="400" color="#7b5cb8"/>
  <text x="400" y="428" font-size="9" fill="#666" text-anchor="middle">reminder-draft</text>
  <use href="#gear" x="700" y="400" color="#7b5cb8"/>
  <text x="700" y="428" font-size="9" fill="#666" text-anchor="middle">bill-booker</text>
  <use href="#gear" x="1450" y="400" color="#7b5cb8"/>
  <text x="1450" y="428" font-size="9" fill="#666" text-anchor="middle">archive-packager</text>

  <!-- records -->
  <g font-size="9.5" font-family="monospace" fill="#fff" text-anchor="middle">
    <rect x="196" y="491" width="108" height="18" rx="9" fill="#2e9e5b"/><text x="250" y="504">awaiting_invoice</text>
    <rect x="414" y="491" width="112" height="18" rx="9" fill="#2e9e5b"/><text x="470" y="504">reminder_count 1</text>
    <rect x="506" y="521" width="108" height="18" rx="9" fill="#2e9e5b"/><text x="560" y="534">invoice_received</text>
    <rect x="642" y="491" width="116" height="18" rx="9" fill="#2e9e5b"/><text x="700" y="504">timesheet_pending</text>
    <rect x="838" y="521" width="84" height="18" rx="9" fill="#2e9e5b"/><text x="880" y="534">Hours 142.0</text>
    <rect x="992" y="491" width="76" height="18" rx="9" fill="#2e9e5b"/><text x="1030" y="504">reconciled</text>
    <rect x="1204" y="491" width="52" height="18" rx="9" fill="#2e9e5b"/><text x="1230" y="504">paid</text>
    <rect x="1416" y="491" width="68" height="18" rx="9" fill="#2e9e5b"/><text x="1450" y="504">archived</text>
  </g>
  <text x="178" y="470" font-size="8.5" fill="#999">one commit per record change</text>

  <!-- external -->
  <use href="#mail" x="400" y="600" color="#2b8a8a"/>
  <text x="400" y="628" font-size="9" fill="#666" text-anchor="middle">mail sent</text>
  <rect x="348" y="643" width="104" height="18" rx="9" fill="#2b8a8a"/>
  <text x="400" y="656" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">msg 7f2a2b</text>
  <use href="#cyl" x="560" y="600" color="#2b8a8a"/>
  <text x="560" y="632" font-size="9" fill="#666" text-anchor="middle">Paperless</text>
  <rect x="517" y="643" width="86" height="18" rx="9" fill="#2b8a8a"/>
  <text x="560" y="656" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">doc 4417</text>
  <use href="#cyl" x="700" y="600" color="#2b8a8a"/>
  <text x="700" y="632" font-size="9" fill="#666" text-anchor="middle">Zoho Books</text>
  <rect x="654" y="643" width="92" height="18" rx="9" fill="#2b8a8a"/>
  <text x="700" y="656" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">bill 8823</text>
  <use href="#cyl" x="1230" y="600" color="#2b8a8a"/>
  <text x="1230" y="632" font-size="9" fill="#666" text-anchor="middle">Zoho Books</text>
  <rect x="1178" y="643" width="104" height="18" rx="9" fill="#2b8a8a"/>
  <text x="1230" y="656" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">paid 09-20</text>
  <use href="#cyl" x="1450" y="600" color="#2b8a8a"/>
  <text x="1450" y="632" font-size="9" fill="#666" text-anchor="middle">WorkDrive</text>
  <rect x="1394" y="643" width="112" height="18" rx="9" fill="#2b8a8a"/>
  <text x="1450" y="656" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">pkg 2026-09</text>

  <!-- ============ SWEEPS ============ -->
  <path d="M 380 312 C 386 342, 392 364, 398 384" fill="none" stroke="#4a7fb5" stroke-width="2" marker-end="url(#mB)"/>
  <path d="M 412 386 C 426 330, 428 268, 420 234" fill="none" stroke="#7b5cb8" stroke-width="2.2" marker-end="url(#mP)"/>
  <text x="436" y="330" font-size="9" fill="#5a3f95">a draft, delivered</text>
  <path d="M 392 232 C 386 330, 390 480, 396 582" fill="none" stroke="#c9962e" stroke-width="2.2" marker-end="url(#mA)"/>
  <text x="336" y="548" font-size="9" fill="#a97e26" text-anchor="end">the yes sends</text>
  <path d="M 412 592 C 436 566, 448 534, 456 512" fill="none" stroke="#2e9e5b" stroke-width="2" marker-end="url(#mG)"/>
  <text x="466" y="576" font-size="9" fill="#27824c">the count moves on the proof</text>
  <path d="M 560 578 L 560 546" fill="none" stroke="#2e9e5b" stroke-width="2" marker-end="url(#mG)"/>
  <path d="M 700 416 C 698 480, 700 540, 700 578" fill="none" stroke="#2b8a8a" stroke-width="2" marker-end="url(#mT)"/>
  <text x="712" y="470" font-size="9" fill="#1f6e6e">the booking effect</text>
  <path d="M 722 588 C 736 560, 740 530, 742 512" fill="none" stroke="#2e9e5b" stroke-width="2" marker-end="url(#mG)"/>
  <path d="M 880 288 C 878 258, 878 230, 880 206" fill="none" stroke="#4a7fb5" stroke-width="2" marker-end="url(#mB)"/>
  <text x="894" y="252" font-size="9" fill="#3f6d9c">the machine asks</text>
  <path d="M 856 206 C 842 300, 848 440, 862 516" fill="none" stroke="#c9962e" stroke-width="2.2" marker-end="url(#mA)"/>
  <path d="M 1030 312 C 1028 400, 1028 452, 1030 486" fill="none" stroke="#2e9e5b" stroke-width="2" marker-end="url(#mG)"/>
  <path d="M 1230 578 C 1228 556, 1228 528, 1230 512" fill="none" stroke="#2e9e5b" stroke-width="2" marker-end="url(#mG)"/>
  <path d="M 1440 416 C 1436 480, 1438 540, 1442 578" fill="none" stroke="#2b8a8a" stroke-width="2" marker-end="url(#mT)"/>
  <path d="M 1470 580 C 1476 552, 1472 526, 1466 512" fill="none" stroke="#2e9e5b" stroke-width="2" marker-end="url(#mG)"/>
  <text x="1494" y="550" font-size="9" fill="#27824c">the package is the proof</text>

  <!-- ============ THE COUNT ============ -->
  <rect x="180" y="694" width="440" height="26" rx="13" fill="#fbeeee" stroke="#c05b5b"/>
  <text x="198" y="711" font-size="10.5" font-weight="700" fill="#a34848">3 timers · 1 mail sent · 1 question asked · 0 stages asserted</text>

  <!-- ============ THE SUPPRESSED VENDOR ============ -->
  <line x1="40" y1="740" x2="1640" y2="740" stroke="#e5e5e2" stroke-width="1"/>
  <text x="38" y="774" font-size="11.5" font-weight="700" fill="#8a8a86">northlake</text>
  <text x="38" y="788" font-size="8.5" fill="#999">suppressed</text>
  <line x1="170" y1="770" x2="1620" y2="770" stroke="#8a8a86" stroke-width="2" opacity="0.25" stroke-dasharray="3 6"/>
  <rect x="196" y="761" width="148" height="18" rx="9" fill="#8a8a86"/>
  <text x="270" y="774" font-size="9.5" font-family="monospace" fill="#fff" text-anchor="middle">suppressed · on leave</text>
  <text x="370" y="766" font-size="8.5" fill="#999">no timer, no chase, no bill — and no row is missing</text>
  <text x="370" y="780" font-size="8.5" fill="#999">the month counts it complete without reconciling it</text>
  <use href="#marker" x="1450" y="770" color="#8a8a86"/>
  <text x="1450" y="794" font-size="8.5" fill="#999" text-anchor="middle">archived with the rest</text>

  <!-- ============ LEGEND ============ -->
  <rect x="40" y="818" width="1600" height="104" rx="10" fill="#fafafa" stroke="#d5d5d0"/>
  <g font-size="10.5" fill="#555">
    <use href="#person" x="70" y="850" color="#777"/><text x="90" y="854">the operator</text>
    <use href="#gear" x="210" y="850" color="#777"/><text x="230" y="854">a machine or a session</text>
    <use href="#clock" x="420" y="850" color="#777"/><text x="438" y="854">a timer</text>
    <use href="#check" x="530" y="850" color="#777"/><text x="548" y="854">a check</text>
    <polygon points="660,838 682,850 660,862 638,850" fill="#fff" stroke="#c9962e" stroke-width="1.6"/><text x="692" y="854">a decision</text>
    <rect x="810" y="841" width="66" height="18" rx="9" fill="#777"/><text x="886" y="854">a real value</text>
    <use href="#cyl" x="1010" y="850" color="#777"/><text x="1036" y="854">an external system</text>
    <use href="#gate" x="1210" y="850"/><text x="1228" y="854">the month gate</text>
    <line x1="1370" y1="850" x2="1410" y2="850" stroke="#4a7fb5" stroke-width="2" stroke-dasharray="2 7"/><text x="1420" y="854">the tick</text>
  </g>
  <g font-size="10.5" fill="#555">
    <line x1="70" y1="884" x2="110" y2="884" stroke="#4a7fb5" stroke-width="3"/><text x="120" y="888">machinery</text>
    <line x1="230" y1="884" x2="270" y2="884" stroke="#c9962e" stroke-width="3"/><text x="280" y="888">decisions</text>
    <line x1="390" y1="884" x2="430" y2="884" stroke="#2e9e5b" stroke-width="3"/><text x="440" y="888">records in git</text>
    <line x1="570" y1="884" x2="610" y2="884" stroke="#7b5cb8" stroke-width="3"/><text x="620" y="888">sessions</text>
    <line x1="730" y1="884" x2="770" y2="884" stroke="#2b8a8a" stroke-width="3"/><text x="780" y="888">external · adapters</text>
    <line x1="940" y1="884" x2="980" y2="884" stroke="#c05b5b" stroke-width="3"/><text x="990" y="888">a refusal or a gate</text>
    <line x1="1160" y1="884" x2="1200" y2="884" stroke="#8a8a86" stroke-width="3"/><text x="1210" y="888">people and places</text>
  </g>
  <text x="70" y="912" font-size="10.5" fill="#666">the operator acted once all month · every other move was earned by a capture, and the suppressed vendor still has a row</text>
</svg>
