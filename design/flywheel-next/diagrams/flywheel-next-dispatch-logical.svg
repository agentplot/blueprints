<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 960"
     font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a86"/></marker>
    <marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9962e"/></marker>
    <marker id="mT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b8a8a"/></marker>
    <g id="gear"> <circle r="9" fill="#fff" stroke="currentColor" stroke-width="2.4" /> <circle r="3" fill="currentColor" /> <g stroke="currentColor" stroke-width="2.4"> <line y1="-9" y2="-13.5" /><line y1="9" y2="13.5" /> <line x1="-9" x2="-13.5" /><line x1="9" x2="13.5" /> <line x1="-6.4" y1="-6.4" x2="-9.5" y2="-9.5" /><line x1="6.4" y1="6.4" x2="9.5" y2="9.5" /> <line x1="-6.4" y1="6.4" x2="-9.5" y2="9.5" /><line x1="6.4" y1="-6.4" x2="9.5" y2="-9.5" /> </g> </g>
    <g id="repo"> <rect x="-26" y="-18" width="52" height="36" rx="7" fill="#fff" stroke="currentColor" stroke-width="2" /> <circle cx="-9" cy="8" r="3.2" fill="currentColor" /> <circle cx="9" cy="-8" r="3.2" fill="currentColor" /> <path d="M -9 8 v-8 a 8 8 0 0 1 8 -8 h 1" fill="none" stroke="currentColor" stroke-width="2" /> </g>
    <g id="browser"> <rect x="-22" y="-14" width="44" height="28" rx="4" fill="#fff" stroke="currentColor" stroke-width="2" /> <line x1="-22" y1="-6" x2="22" y2="-6" stroke="currentColor" stroke-width="2" /> <circle cx="-16" cy="-10" r="1.6" fill="currentColor" /><circle cx="-11" cy="-10" r="1.6" fill="currentColor" /> </g>
    <g id="cube" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"> <path d="M -16 -8 L 0 -17 L 16 -8 L 16 10 L 0 19 L -16 10 Z" fill="#fff" /> <path d="M -16 -8 L 0 1 L 16 -8 M 0 1 L 0 19" fill="none" /> </g>
    <g id="bot"> <rect x="-11" y="-9" width="22" height="18" rx="4" fill="#fff" stroke="currentColor" stroke-width="1.8" /> <circle cx="-4" cy="-2" r="1.8" fill="currentColor" /><circle cx="4" cy="-2" r="1.8" fill="currentColor" /> <line x1="-4" y1="4" x2="4" y2="4" stroke="currentColor" stroke-width="1.6" /> <line x1="0" y1="-9" x2="0" y2="-14" stroke="currentColor" stroke-width="1.8" /> <circle cy="-15" r="1.8" fill="currentColor" /> </g>
  </defs>
  <rect width="1800" height="960" fill="#fff"/>
  <text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">Flywheel next — dispatch, logical: one host kind with the tool server inside it, three runners the engine cannot tell apart, and three channels</text>
  <text x="40" y="57" font-size="12" fill="#666">the same binary on every placement · a session calls the tools over stdio, in-process, or remote MCP with its identity · push webhook in, bounded fetch in, the bot out</text>

  <!-- THE DISPATCHER host -->
  <rect x="60" y="80" width="540" height="560" rx="10" fill="#fff" stroke="#2b8a8a" stroke-width="1.8"/>
  <text x="76" y="104" font-size="13" font-weight="700" fill="#333">DISPATCHER · a host of kind dispatcher</text>
  <use href="#cube" x="570" y="106" color="#2b8a8a"/>
  <text x="76" y="122" font-size="9.5" font-family="monospace" fill="#666">hosts.dispatcher: {kinds: [], presents: [chat]}</text>

  <rect x="80" y="144" width="280" height="46" rx="8" fill="#e8f3f3" stroke="#2b8a8a" stroke-width="1.2"/>
  <text x="92" y="163" font-size="10.5" font-weight="700" fill="#1f6e6e">the same binary</text>
  <text x="92" y="178" font-size="8.5" fill="#666">flywheel dispatch is flywheel host</text>
  <rect x="80" y="202" width="280" height="46" rx="8" fill="#e8f3f3" stroke="#2b8a8a" stroke-width="1.2"/>
  <text x="92" y="221" font-size="10.5" font-weight="700" fill="#1f6e6e">joins</text>
  <text x="92" y="236" font-size="8.5" fill="#666">one command · clones state and books (205)</text>
  <rect x="80" y="260" width="280" height="46" rx="8" fill="#e8f3f3" stroke="#2b8a8a" stroke-width="1.2"/>
  <text x="92" y="279" font-size="10.5" font-weight="700" fill="#1f6e6e">heartbeats</text>
  <text x="92" y="294" font-size="8.5" fill="#666">as host/dispatcher</text>
  <rect x="80" y="318" width="280" height="46" rx="8" fill="#e8f3f3" stroke="#2b8a8a" stroke-width="1.2"/>
  <text x="92" y="337" font-size="10.5" font-weight="700" fill="#1f6e6e">ticks</text>
  <text x="92" y="352" font-size="8.5" fill="#666">fetch · list · read · evaluate · effect (165)</text>
  <rect x="80" y="376" width="280" height="46" rx="8" fill="#e8f3f3" stroke="#2b8a8a" stroke-width="1.2"/>
  <text x="92" y="395" font-size="10.5" font-weight="700" fill="#1f6e6e">a lease on a sink only</text>
  <text x="92" y="410" font-size="8.5" fill="#666">never on an object (148, 150)</text>
  <rect x="80" y="434" width="280" height="46" rx="8" fill="#e8f3f3" stroke="#2b8a8a" stroke-width="1.2"/>
  <text x="92" y="453" font-size="10.5" font-weight="700" fill="#1f6e6e">stateless between ticks</text>
  <text x="92" y="468" font-size="8.5" fill="#666">a restart reaches the same conclusion (217a)</text>
  <text x="80" y="516" font-size="9.5" fill="#666">no object kinds, no repositories, no unit types:</text>
  <text x="80" y="530" font-size="9.5" fill="#666">the declaration takes no work and presents the chat (217)</text>

  <rect x="380" y="144" width="200" height="466" rx="8" fill="#e8f3f3" stroke="#2b8a8a" stroke-width="1.4"/>
  <text x="396" y="168" font-size="12" font-weight="700" fill="#1f6e6e">TOOL SERVER</text>
  <text x="396" y="186" font-size="9.5" fill="#666">the binary's MCP server</text>
  <text x="396" y="200" font-size="9.5" fill="#666">and its HTTP twin</text>
  <text x="396" y="244" font-size="10.5" fill="#333">private network only</text>
  <text x="396" y="260" font-size="8.5" fill="#999">155 · 191</text>
  <text x="396" y="296" font-size="10.5" fill="#333">checks the session</text>
  <text x="396" y="312" font-size="10.5" fill="#333">identity on every call</text>
  <text x="396" y="328" font-size="8.5" fill="#999">197</text>
  <text x="396" y="364" font-size="10.5" fill="#333">no third transport</text>
  <text x="396" y="380" font-size="8.5" fill="#999">217c</text>
  <text x="396" y="596" font-size="8.5" fill="#999">46 · 155 · 191 · 197</text>

  <!-- RUNNERS -->
  <rect x="680" y="100" width="580" height="130" rx="8" fill="#fff" stroke="#2e9e5b" stroke-width="1.6"/>
  <use href="#gear" x="702" y="124" color="#2e9e5b"/>
  <text x="720" y="128" font-size="12" font-weight="700" fill="#333">runner · pane</text>
  <text x="696" y="154" font-size="10" fill="#666">a herdr pane under the operator's Claude Code login · no key</text>
  <rect x="696" y="168" width="230" height="22" rx="11" fill="#fff" stroke="#2b8a8a" stroke-width="1.2"/>
  <text x="811" y="183" font-size="9.5" font-family="monospace" fill="#1f6e6e" text-anchor="middle">stdio · the pane's flywheel commands</text>
  <text x="696" y="216" font-size="8.5" fill="#999">fits triage on a laptop or a home host · 174 · 196</text>

  <rect x="680" y="260" width="580" height="130" rx="8" fill="#fff" stroke="#2e9e5b" stroke-width="1.6"/>
  <use href="#gear" x="702" y="284" color="#2e9e5b"/>
  <text x="720" y="288" font-size="12" font-weight="700" fill="#333">runner · in-process</text>
  <text x="696" y="314" font-size="10" fill="#666">a bounded agent loop inside the dispatcher's own process · a key or a cloud role</text>
  <rect x="696" y="328" width="230" height="22" rx="11" fill="#fff" stroke="#2b8a8a" stroke-width="1.2"/>
  <text x="811" y="343" font-size="9.5" font-family="monospace" fill="#1f6e6e" text-anchor="middle">in-process · no process boundary</text>
  <text x="696" y="376" font-size="8.5" fill="#999">fits the interpreter everywhere · triage in a container · 173 · 207</text>

  <rect x="680" y="420" width="580" height="130" rx="8" fill="#fff" stroke="#2e9e5b" stroke-width="1.6"/>
  <use href="#gear" x="702" y="444" color="#2e9e5b"/>
  <text x="720" y="448" font-size="12" font-weight="700" fill="#333">runner · platform session</text>
  <text x="696" y="474" font-size="10" fill="#666">a Claude managed agent or an AgentCore session, created per capture</text>
  <rect x="696" y="488" width="300" height="22" rx="11" fill="#fff" stroke="#2b8a8a" stroke-width="1.2"/>
  <text x="846" y="503" font-size="9.5" font-family="monospace" fill="#1f6e6e" text-anchor="middle">remote MCP over HTTP · with the 197 identity</text>
  <text x="696" y="536" font-size="8.5" fill="#999">fits triage where the org already runs agents · never the presenter · a sandbox on the private network, else refused</text>

  <!-- host → runners: charges -->
  <path d="M 602 140 L 678 140" fill="none" stroke="#2b8a8a" stroke-width="2.2" marker-end="url(#mT)"/>
  <text x="640" y="132" font-size="9" fill="#1f6e6e" text-anchor="middle">charges</text>
  <path d="M 602 300 L 678 300" fill="none" stroke="#2b8a8a" stroke-width="2.2" marker-end="url(#mT)"/>
  <text x="640" y="292" font-size="9" fill="#1f6e6e" text-anchor="middle">charges</text>
  <path d="M 602 460 L 678 460" fill="none" stroke="#2b8a8a" stroke-width="2.2" marker-end="url(#mT)"/>
  <text x="640" y="452" font-size="9" fill="#1f6e6e" text-anchor="middle">charges</text>
  <!-- runners → tool server: calls -->
  <path d="M 680 200 L 584 200" fill="none" stroke="#2b8a8a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mT)"/>
  <text x="640" y="214" font-size="9" fill="#1f6e6e" text-anchor="middle">calls the tools</text>
  <path d="M 680 360 L 584 360" fill="none" stroke="#2b8a8a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mT)"/>
  <text x="640" y="374" font-size="9" fill="#1f6e6e" text-anchor="middle">calls the tools</text>
  <path d="M 680 520 L 584 520" fill="none" stroke="#2b8a8a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mT)"/>
  <text x="640" y="534" font-size="9" fill="#1f6e6e" text-anchor="middle">calls the tools</text>

  <!-- runners → engine -->
  <path d="M 1262 165 L 1338 165" fill="none" stroke="#8a8a86" stroke-width="2" marker-end="url(#mN)"/>
  <path d="M 1262 325 L 1338 325" fill="none" stroke="#8a8a86" stroke-width="2" marker-end="url(#mN)"/>
  <path d="M 1262 485 L 1338 485" fill="none" stroke="#8a8a86" stroke-width="2" marker-end="url(#mN)"/>
  <text x="1300" y="316" font-size="9" fill="#5f6b7a" text-anchor="middle">a session record</text>

  <!-- THE ENGINE -->
  <rect x="1340" y="100" width="400" height="450" rx="10" fill="#fff" stroke="#8a8a86" stroke-width="1.8"/>
  <text x="1356" y="124" font-size="13" font-weight="700" fill="#5f6b7a">THE ENGINE · the control plane</text>
  <use href="#gear" x="1386" y="196" color="#2e9e5b"/>
  <text x="1410" y="190" font-size="11" font-weight="700" fill="#333">sees one session record and a thread</text>
  <text x="1410" y="208" font-size="10" fill="#666">whichever runner produced it (217c)</text>
  <text x="1410" y="226" font-size="10" fill="#666">same work order · same exits (173, 89)</text>
  <line x1="1356" y1="256" x2="1724" y2="256" stroke="#8a8a86" stroke-width="1" opacity="0.5"/>
  <text x="1356" y="282" font-size="10" font-weight="700" fill="#5f6b7a">which job takes which runner</text>
  <text x="1356" y="304" font-size="10" font-family="monospace" fill="#666">interpreter → in-process only</text>
  <text x="1356" y="320" font-size="8.5" fill="#999">the operator is waiting on a reply</text>
  <text x="1356" y="346" font-size="10" font-family="monospace" fill="#666">triage → pane · in-process · platform session</text>
  <text x="1356" y="362" font-size="8.5" fill="#999">wherever the raw material can be read (217h)</text>
  <text x="1356" y="532" font-size="8.5" fill="#999">89 · 173 · 197 · 217b · 217c</text>

  <!-- CHANNELS -->
  <rect x="60" y="670" width="1680" height="160" rx="10" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.4"/>
  <text x="76" y="692" font-size="12" font-weight="700" fill="#5f6b7a">CHANNELS · nothing addresses dispatch; it reads (217d)</text>

  <use href="#repo" x="120" y="752" color="#8a8a86"/>
  <text x="120" y="786" font-size="9.5" fill="#666" text-anchor="middle">git host</text>
  <path d="M 148 752 L 198 752" fill="none" stroke="#2b8a8a" stroke-width="2.2" marker-end="url(#mT)"/>
  <rect x="200" y="734" width="180" height="36" rx="18" fill="#e8f3f3" stroke="#2b8a8a" stroke-width="1.4"/>
  <text x="290" y="757" font-size="9.5" font-family="monospace" fill="#1f6e6e" text-anchor="middle">dispatcher · /hook</text>
  <text x="250" y="722" font-size="10.5" font-weight="700" fill="#1f6e6e" text-anchor="middle">push webhook in</text>
  <text x="290" y="792" font-size="8.5" fill="#999" text-anchor="middle">when the shared line moves · seconds (166)</text>

  <use href="#repo" x="540" y="752" color="#8a8a86"/>
  <text x="540" y="786" font-size="9.5" fill="#666" text-anchor="middle">state</text>
  <path d="M 568 752 L 618 752" fill="none" stroke="#8a8a86" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#mN)"/>
  <rect x="620" y="734" width="140" height="36" rx="18" fill="#e8f3f3" stroke="#2b8a8a" stroke-width="1.4"/>
  <text x="690" y="757" font-size="9.5" font-family="monospace" fill="#1f6e6e" text-anchor="middle">dispatcher</text>
  <text x="650" y="722" font-size="10.5" font-weight="700" fill="#5f6b7a" text-anchor="middle">bounded fetch in</text>
  <text x="690" y="792" font-size="8.5" fill="#999" text-anchor="middle">every 30s and before every tick (165)</text>

  <rect x="940" y="734" width="140" height="36" rx="18" fill="#e8f3f3" stroke="#2b8a8a" stroke-width="1.4"/>
  <text x="1010" y="757" font-size="9.5" font-family="monospace" fill="#1f6e6e" text-anchor="middle">dispatcher</text>
  <path d="M 1082 752 L 1128 752" fill="none" stroke="#c9962e" stroke-width="2.4" marker-end="url(#mA)"/>
  <use href="#bot" x="1150" y="754" color="#2b8a8a"/>
  <text x="1150" y="786" font-size="9.5" fill="#666" text-anchor="middle">the bot</text>
  <path d="M 1170 752 L 1214 752" fill="none" stroke="#c9962e" stroke-width="2.4" marker-end="url(#mA)"/>
  <use href="#browser" x="1244" y="752" color="#8a8a86"/>
  <text x="1244" y="786" font-size="9.5" fill="#666" text-anchor="middle">the org's chat</text>
  <text x="1090" y="722" font-size="10.5" font-weight="700" fill="#a97e26" text-anchor="middle">bot out</text>
  <text x="1100" y="810" font-size="8.5" fill="#999" text-anchor="middle">the plan, one line per decision (18) · never a person's account (155)</text>

  <rect x="1400" y="700" width="320" height="116" rx="8" fill="#fffdf6" stroke="#c9962e" stroke-width="1.4"/>
  <text x="1414" y="720" font-size="10.5" font-weight="700" fill="#8a6a1d">TRIAGE CADENCE (217e)</text>
  <text x="1414" y="740" font-size="9.5" fill="#666">one reader per capture with material to read</text>
  <text x="1414" y="756" font-size="9.5" fill="#666">at most triage.bound at once · default 1</text>
  <text x="1414" y="772" font-size="9.5" fill="#666">a forwarded message charges none (S21)</text>
  <text x="1414" y="792" font-size="9" font-weight="700" fill="#a97e26">not curation · that runs on the machinery role (110)</text>

  <!-- legend -->
  <rect x="40" y="852" width="1720" height="88" rx="10" fill="#fafafa"/>
  <line x1="60" y1="874" x2="100" y2="874" stroke="#2b8a8a" stroke-width="2.4"/>
  <text x="108" y="878" font-size="10" fill="#333">charges · a write</text>
  <line x1="250" y1="874" x2="290" y2="874" stroke="#2b8a8a" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="298" y="878" font-size="10" fill="#333">a session calling the tool server</text>
  <use href="#gear" transform="translate(520,874) scale(0.8)" color="#2e9e5b"/>
  <text x="538" y="878" font-size="10" fill="#333">a bounded session</text>
  <line x1="700" y1="874" x2="740" y2="874" stroke="#8a8a86" stroke-width="2"/>
  <text x="748" y="878" font-size="10" fill="#333">what the engine sees</text>
  <line x1="920" y1="874" x2="960" y2="874" stroke="#8a8a86" stroke-width="1.6" stroke-dasharray="2 5"/>
  <text x="968" y="878" font-size="10" fill="#333">read · a bounded fetch</text>
  <line x1="1140" y1="874" x2="1180" y2="874" stroke="#c9962e" stroke-width="2.4"/>
  <text x="1188" y="878" font-size="10" fill="#333">the plan, out through the bot</text>
  <text x="60" y="912" font-size="10.5" fill="#333">one binary, one declaration, one tick on every placement (217) · every runner starts the session with the same work order, and the engine cannot tell them apart (217c) · a notification only shortens the wait; never notified, dispatch still converges by reading (130)</text>
</svg>
