  <text x="400" y="491" font-size="8.5" fill="#999" text-anchor="middle">curation routes it</text>
  <text x="255" y="538" font-size="8.5" fill="#a34848" text-anchor="middle">routed to a unit on an open bolt · a decision, never an intent</text>

