    <line x1="1560" y1="848" x2="1600" y2="848" stroke="#c05b5b" stroke-width="2" stroke-dasharray="4 3"/><text x="1608" y="852">an ask back in</text>
  </g>
  <text x="60" y="884" font-size="10.5" fill="#333">planning runs once per repository when its backlog changes or an ask names it · a unit names its bolt; the operator renames or reroutes it on the decision</text>
  <text x="60" y="902" font-size="10.5" fill="#333">bolts are deliverables with no order between them · inside a bolt, units wait only on their dependencies and a host's bound · one yes carries a unit to the close</text>
</svg>
