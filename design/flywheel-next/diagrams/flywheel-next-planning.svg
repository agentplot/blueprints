  <text x="100" y="491" font-size="8.5" fill="#999" text-anchor="middle">dictation · applied directly</text>
  <use href="#row" x="255" y="450" color="#4a7fb5"/>
  <text x="255" y="478" font-size="9.5" fill="#666" text-anchor="middle">finding</text>
  <text x="255" y="491" font-size="8.5" fill="#999" text-anchor="middle">from another bolt</text>
  <use href="#row" x="400" y="450" color="#7b5cb8"/>
