  <text x="1665" y="239" font-size="8.5" fill="#999" text-anchor="middle">one at a time</text>
  <use href="#row" x="1720" y="204" color="#c05b5b"/>
  <text x="1720" y="226" font-size="9.5" fill="#666" text-anchor="middle">close</text>
