  <text x="395" y="275" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">one-writer @v3</text>
  <text x="255" y="310" font-size="8.5" fill="#999" text-anchor="middle">archive: the claim stands · in scope for atlas and switchboard</text>

  <!-- ASKS -->
