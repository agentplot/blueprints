  <rect width="1800" height="960" fill="#fff"/>
  <text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">Flywheel next — planning runs once per repository: standing claims and asks become units on bolts; bolts are unordered, units are ordered inside</text>
  <text x="40" y="57" font-size="12" fill="#666">intent → claim standing → ledger → backlog → PLANNING → decisions → units on a bolt · one yes carries a unit to the close · the operator tests at the bolt's place and asks back in</text>

  <!-- DESIGN -->
  <rect x="40" y="80" width="430" height="250" rx="10" fill="#f8f5fc" stroke="#7b5cb8" stroke-width="1.4"/>
  <text x="56" y="102" font-size="12" font-weight="700" fill="#5a3f95">DESIGN · one intent</text>
