  <text x="1379" y="283" font-size="10" font-family="monospace" fill="#fff" text-anchor="middle">studio · 2 of bound 4</text>
  <text x="1304" y="308" font-size="8.5" fill="#27824c">sessions per host bounded · a third waits its turn</text>
  <text x="1304" y="340" font-size="8.5" fill="#3f6d9c">one yes → spec → build → review → merge · nothing nudged</text>

  <rect x="1290" y="382" width="220" height="80" rx="9" fill="#fff" stroke="#4a7fb5" stroke-width="1.6"/>
  <text x="1304" y="404" font-size="11" font-weight="700" fill="#333">bolt retry · new · type fast</text>
  <text x="1304" y="424" font-size="9.5" font-family="monospace" fill="#666">1 unit · ff → archive · PR</text>
  <text x="1304" y="446" font-size="8.5" fill="#999">named on 414 · merged within the hour</text>

  <rect x="1530" y="382" width="210" height="80" rx="9" fill="#fff" stroke="#2b8a8a" stroke-width="1.6"/>
  <text x="1544" y="404" font-size="11" font-weight="700" fill="#333">the bolt's place</text>
  <text x="1544" y="424" font-size="9.5" font-family="monospace" fill="#666">wt worktree · hashed ports</text>
  <text x="1544" y="446" font-size="8.5" fill="#999">tethered processes die with it</text>
  <use href="#person" x="1720" y="425" color="#2b8a8a"/>
  <path d="M 1665 362 C 1665 370, 1665 375, 1665 380" fill="none" stroke="#2b8a8a" stroke-width="2" marker-end="url(#mT)"/>
  <text x="1515" y="500" font-size="8.5" fill="#1f6e6e" text-anchor="middle">operator runs and tests here after every merge</text>
  <text x="1515" y="540" font-size="8.5" fill="#999" text-anchor="middle">no order between bolts · each is a deliverable · only the operator's close ends one</text>

