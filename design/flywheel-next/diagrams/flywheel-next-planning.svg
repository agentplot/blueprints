  <text x="1026" y="391" font-size="9.5" font-family="monospace" fill="#666">414 unit → new bolt · rename?</text>
  <text x="1026" y="413" font-size="9" font-weight="700" fill="#a34848">yes · drop · redo · bolt · new bolt</text>
  <text x="1026" y="434" font-size="8.5" fill="#999">a yes is the last response until the close</text>
  <text x="1026" y="450" font-size="8.5" fill="#999">bolt and name set on the decision</text>
