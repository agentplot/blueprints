  <use href="#check" x="1722" y="700"/>

  <!-- LEGEND -->
  <rect x="40" y="820" width="1720" height="100" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
  <g font-size="10" fill="#333">
    <line x1="60" y1="848" x2="100" y2="848" stroke="#7b5cb8" stroke-width="3"/><text x="108" y="852">design · intent, elaboration, claim</text>
    <line x1="330" y1="848" x2="370" y2="848" stroke="#c9962e" stroke-width="3"/><text x="378" y="852">judgment · ledger, backlog, planning</text>
