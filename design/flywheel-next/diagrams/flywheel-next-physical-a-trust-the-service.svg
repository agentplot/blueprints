<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1030"
     font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mS" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a86"/></marker>
    <marker id="mK" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9962e"/></marker>
    <g id="repo"> <rect x="-15" y="-11" width="30" height="22" rx="4" fill="#fff" stroke="currentColor" stroke-width="1.8" /> <circle cx="-5" cy="5" r="2.2" fill="currentColor" /> <circle cx="5" cy="-5" r="2.2" fill="currentColor" /> <path d="M -5 5 v-5 a 5 5 0 0 1 5 -5 h 1" fill="none" stroke="currentColor" stroke-width="1.8" /> </g>
    <g id="laptop" stroke="currentColor" stroke-width="1.8" fill="#fff"> <rect x="-14" y="-11" width="28" height="18" rx="2.5"/> <path d="M -19 10 L 19 10 L 15 7 L -15 7 Z" stroke-linejoin="round"/> </g>
    <g id="chat" stroke="currentColor" stroke-width="1.8" fill="#fff" stroke-linejoin="round"> <path d="M -14 -10 h 28 a 3 3 0 0 1 3 3 v 12 a 3 3 0 0 1 -3 3 h -18 l -8 6 v -6 h -2 a 3 3 0 0 1 -3 -3 v -12 a 3 3 0 0 1 3 -3 z"/> </g>
    <g id="gate" stroke="currentColor" stroke-width="1.8" fill="#fff"> <path d="M 0 -13 L 13 -6 L 13 8 L 0 15 L -13 8 L -13 -6 Z" stroke-linejoin="round"/> <path d="M -6 1 h 12 M -6 -4 h 12" stroke-width="1.5"/> </g>
    <g id="fn" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linejoin="round"> <rect x="-14" y="-12" width="28" height="24" rx="3" fill="#fff"/> <path d="M -7 -6 L 1 6 M 7 -6 L -1 6" stroke-linecap="round"/> </g>
    <g id="cyl"> <path d="M -22 -10 L -22 11 A 22 7 0 0 0 22 11 L 22 -10" fill="#fff" stroke="currentColor" stroke-width="1.7" /> <ellipse cx="0" cy="-10" rx="22" ry="7" fill="#eef2f6" stroke="currentColor" stroke-width="1.7" /> </g>
    <g id="clock"> <circle r="12" fill="#fff" stroke="currentColor" stroke-width="1.9" /> <path d="M 0 -7 V 0 H 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /> </g>
    <g id="cube" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"> <path d="M -14 -7 L 0 -15 L 14 -7 L 14 9 L 0 17 L -14 9 Z" fill="#fff" /> <path d="M -14 -7 L 0 1 L 14 -7 M 0 1 L 0 17" fill="none" /> </g>
    <g id="key" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"> <circle cx="-7" cy="0" r="6"/> <path d="M -1 0 H 13 M 8 0 v5 M 13 0 v6"/> </g>
    <g id="dash" stroke="currentColor" stroke-width="1.8" fill="#fff"> <rect x="-13" y="-10" width="26" height="20" rx="3"/> <path d="M -8 -4 h 16 M -8 1 h 10" stroke-width="1.4"/> </g>
  </defs>

  <rect width="1800" height="1030" fill="#fff"/>
  <text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">Flywheel hosted — design A, trust the service: the machines that exist, and whose account each one runs in</text>
  <text x="40" y="57" font-size="12" fill="#666">the recommended default · a key per organization over every store we keep, unwrapped only while that organization's tick runs · nothing of the machinery stays running: a tick is one function invocation that assumes a role tagged with your organization, works, and exits</text>
  <rect x="60" y="84" width="1680" height="212" rx="10" fill="#fff" stroke="#2b8a8a" stroke-width="1.6"/>
  <text x="76" y="106" font-size="11.5" font-weight="700" fill="#1f6e6e">YOUR SIDE · the same in all three designs</text>
  <rect x="120" y="126" width="400" height="150" rx="8" fill="#fff" stroke="#2b8a8a" stroke-width="1.4"/>
  <use href="#repo" x="154" y="156" color="#2b8a8a"/>
  <text x="182" y="152" font-size="12.5" font-weight="700" fill="#333">GitHub</text>
  <text x="182" y="167" font-size="9" fill="#999">your account, your repositories</text>
  <text x="136" y="192" font-size="9.5" fill="#666">the state repository · the blueprints repository · your code repositories</text>
  <text x="136" y="210" font-size="9.5" font-weight="700" fill="#1f6e6e">plaintext, yours — under GitHub's own encryption, as every repository is</text>
  <text x="136" y="228" font-size="9" fill="#999">the App is installed on your organization; its token is scoped to the listed repositories</text>
  <rect x="660" y="126" width="400" height="150" rx="8" fill="#fff" stroke="#2b8a8a" stroke-width="1.4"/>
  <use href="#laptop" x="694" y="156" color="#2b8a8a"/>
  <text x="722" y="152" font-size="12.5" font-weight="700" fill="#333">your laptop host</text>
  <text x="722" y="167" font-size="9" fill="#999">optional · intermittent</text>
  <text x="676" y="192" font-size="9.5" fill="#666">the page on localhost · device-flow sign-in · local adapters · worktrees</text>
  <text x="676" y="210" font-size="9.5" fill="#666">at tier 1 this is still the machine that builds</text>
  <text x="676" y="228" font-size="9" fill="#999">closed past its stale window it shows away: leases stand and their clocks pause</text>
  <rect x="1200" y="126" width="400" height="150" rx="8" fill="#fff" stroke="#2b8a8a" stroke-width="1.4"/>
  <use href="#chat" x="1234" y="156" color="#2b8a8a"/>
  <text x="1262" y="152" font-size="12.5" font-weight="700" fill="#333">Slack or Discord</text>
  <text x="1262" y="167" font-size="9" fill="#999">your workspace, our bot invited</text>
  <text x="1216" y="192" font-size="9.5" fill="#666">the service's Slack app and Discord app, installed into your workspace</text>
  <text x="1216" y="210" font-size="9.5" font-weight="700" fill="#8a6a1d">the one shared component — and it carries only plan text</text>
  <text x="1216" y="228" font-size="9" fill="#999">a stolen bot token buys the ability to post plan lines: no repository or key access</text>
  <rect x="60" y="320" width="1680" height="524" rx="10" fill="#fdfcf8" stroke="#c9c9c5" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="76" y="342" font-size="11.5" font-weight="700" fill="#5e5e5a">THE MACHINES · every one of them in our service account, one set per organization</text>
  <rect x="700" y="366" width="380" height="104" rx="8" fill="#fff" stroke="#4a7fb5" stroke-width="1.4"/>
  <use href="#gate" x="734" y="396" color="#4a7fb5"/>
  <text x="762" y="392" font-size="12.5" font-weight="700" fill="#333">capture receiver</text>
  <text x="762" y="407" font-size="9" fill="#999">a managed service, not a process of ours</text>
  <rect x="973" y="378" width="95" height="16" rx="8" fill="#4a7fb5" opacity="0.12"/>
  <text x="1020" y="389" font-size="8.5" font-weight="700" fill="#4a7fb5" text-anchor="middle">our service account</text>
  <text x="716" y="432" font-size="9.5" fill="#666">API Gateway integrated straight into one SQS queue per organization</text>
  <text x="716" y="450" font-size="9.5" font-weight="700" fill="#8a6a1d">encrypted under the organization key · no compute</text>
  <text x="716" y="468" font-size="9" fill="#999">webhook and chat payloads, transient</text>
  <rect x="700" y="536" width="380" height="190" rx="8" fill="#fff" stroke="#4a7fb5" stroke-width="2"/>
  <use href="#fn" x="734" y="566" color="#4a7fb5"/>
  <text x="762" y="562" font-size="12.5" font-weight="700" fill="#333">dispatcher function</text>
  <text x="762" y="577" font-size="9" fill="#999">one Lambda function per tier · the cloud agent</text>
  <rect x="973" y="548" width="95" height="16" rx="8" fill="#4a7fb5" opacity="0.12"/>
  <text x="1020" y="559" font-size="8.5" font-weight="700" fill="#4a7fb5" text-anchor="middle">our service account</text>
  <text x="716" y="602" font-size="9.5" fill="#666">it assumes the tier role with a session tag naming your organization</text>
  <text x="716" y="620" font-size="9.5" font-weight="700" fill="#3a6a99">every key and cache object carries its organization tag, so AWS allows</text>
  <text x="716" y="638" font-size="9.5" font-weight="700" fill="#3a6a99">the call only when the two tags match</text>
  <text x="716" y="656" font-size="9.5" fill="#666">runs one tick, wipes its scratch directory, and exits</text>
  <text x="716" y="674" font-size="9" fill="#999">nothing between runs · in a run, one organization's plaintext in memory and scratch</text>
  <text x="716" y="688" font-size="9" fill="#999">woken by the queue, by the scheduler at the due time, or by a page request</text>
  <rect x="180" y="545" width="340" height="116" rx="8" fill="#fff" stroke="#4a7fb5" stroke-width="1.4"/>
  <use href="#clock" x="214" y="575" color="#4a7fb5"/>
  <text x="242" y="571" font-size="12.5" font-weight="700" fill="#333">scheduler</text>
  <text x="242" y="586" font-size="9" fill="#999">EventBridge Scheduler</text>
  <rect x="413" y="557" width="95" height="16" rx="8" fill="#4a7fb5" opacity="0.12"/>
  <text x="460" y="568" font-size="8.5" font-weight="700" fill="#4a7fb5" text-anchor="middle">our service account</text>
  <text x="196" y="611" font-size="9.5" fill="#666">one one-shot entry per organization, written at the end of each tick</text>
  <text x="196" y="629" font-size="9.5" fill="#666">it holds the next due time and nothing else</text>
  <text x="196" y="647" font-size="9" fill="#999">an idle organization has no entry · a daily sweep is the backstop</text>
  <rect x="1180" y="486" width="340" height="118" rx="8" fill="#fff" stroke="#4a7fb5" stroke-width="1.4"/>
  <use href="#cyl" x="1214" y="516" color="#4a7fb5"/>
  <text x="1242" y="512" font-size="12.5" font-weight="700" fill="#333">warm cache</text>
  <text x="1242" y="527" font-size="9" fill="#999">one S3 object per organization · no VPC, no mount</text>
  <rect x="1413" y="498" width="95" height="16" rx="8" fill="#4a7fb5" opacity="0.12"/>
  <text x="1460" y="509" font-size="8.5" font-weight="700" fill="#4a7fb5" text-anchor="middle">our service account</text>
  <text x="1196" y="552" font-size="9.5" font-weight="700" fill="#8a6a1d">a git bundle of two sparse shallow clones, under the organization key</text>
  <text x="1196" y="570" font-size="9.5" fill="#666">state, and blueprints restricted to the manifest, the claims and flywheel/</text>
  <text x="1196" y="588" font-size="9" fill="#a34848">never code, never raw capture material · deleted and re-cloned when idle</text>
  <rect x="1180" y="650" width="340" height="168" rx="8" fill="#fff" stroke="#4a7fb5" stroke-width="1.4"/>
  <use href="#cube" x="1214" y="680" color="#4a7fb5"/>
  <text x="1242" y="676" font-size="12.5" font-weight="700" fill="#333">pool host</text>
  <text x="1242" y="691" font-size="9" fill="#999">created from your image when the plan approves work</text>
  <rect x="1413" y="662" width="95" height="16" rx="8" fill="#4a7fb5" opacity="0.12"/>
  <text x="1460" y="673" font-size="8.5" font-weight="700" fill="#4a7fb5" text-anchor="middle">our service account</text>
  <text x="1196" y="716" font-size="9.5" fill="#666">a Lambda MicroVM · 8–32 GB memory, 4–16 vCPU, up to 32 GB of disk</text>
  <text x="1196" y="734" font-size="9.5" fill="#666">no VPC needed, and Docker runs inside it, so devcontainer features work</text>
  <text x="1196" y="752" font-size="9.5" font-weight="700" fill="#3a6a99">one organization · clones the code it needs, runs the session in a worktree,</text>
  <text x="1196" y="770" font-size="9.5" font-weight="700" fill="#3a6a99">pushes the pull request, and is terminated with its disk</text>
  <text x="1196" y="788" font-size="9" fill="#999">triage runs here too, never in the dispatcher · Fargate is the fallback past eight hours</text>
  <rect x="180" y="672" width="340" height="100" rx="8" fill="#fff" stroke="#4a7fb5" stroke-width="1.4"/>
  <use href="#dash" x="214" y="702" color="#4a7fb5"/>
  <text x="242" y="698" font-size="12.5" font-weight="700" fill="#333">control plane</text>
  <text x="242" y="713" font-size="9" fill="#999">what we keep about you outside a tick</text>
  <rect x="413" y="684" width="95" height="16" rx="8" fill="#4a7fb5" opacity="0.12"/>
  <text x="460" y="695" font-size="8.5" font-weight="700" fill="#4a7fb5" text-anchor="middle">our service account</text>
  <text x="196" y="738" font-size="9.5" fill="#666">your organization's name, its health and its billing counters</text>
  <text x="196" y="756" font-size="9" fill="#999">no content of yours, at any tier</text>
  <rect x="1570" y="400" width="160" height="418" rx="8" fill="#f7fafd" stroke="#4a7fb5" stroke-width="1.6"/>
  <use href="#key" x="1622" y="432" color="#4a7fb5"/>
  <text x="1650" y="470" font-size="12.5" font-weight="700" fill="#4a7fb5" text-anchor="middle">KMS key</text>
  <text x="1650" y="486" font-size="9" fill="#999" text-anchor="middle">one per organization</text>
  <text x="1584" y="514" font-size="9" fill="#666">a customer-managed key in</text>
  <text x="1584" y="528" font-size="9" fill="#666">the service account, tagged</text>
  <text x="1584" y="542" font-size="9" fill="#666">with the organization</text>
  <text x="1584" y="564" font-size="9" font-weight="700" fill="#8a6a1d">policy: a principal may use</text>
  <text x="1584" y="578" font-size="9" font-weight="700" fill="#8a6a1d">it only when its session tag</text>
  <text x="1584" y="592" font-size="9" font-weight="700" fill="#8a6a1d">equals the key's tag</text>
  <text x="1584" y="606" font-size="9" fill="#999">so no count of roles limits it</text>
  <text x="1584" y="628" font-size="9" fill="#666">it encrypts the queue, the</text>
  <text x="1584" y="642" font-size="9" fill="#666">cache, the pool disk, the logs</text>
  <text x="1584" y="664" font-size="9" fill="#999">there is no human path to the</text>
  <text x="1584" y="678" font-size="9" fill="#999">cache: a stolen disk or a leaked</text>
  <text x="1584" y="692" font-size="9" fill="#999">snapshot is ciphertext</text>
  <!-- ===== EDGES ===== -->
  <path d="M 320 280 C 400 328, 640 336, 762 362" fill="none" stroke="#8a8a86" stroke-width="2.2" marker-end="url(#mS)"/>
  <text x="560" y="326" font-size="9.5" font-weight="700" fill="#5e5e5a">webhooks</text>
  <path d="M 860 280 C 866 310, 880 336, 886 362" fill="none" stroke="#8a8a86" stroke-width="2.2" marker-end="url(#mS)"/>
  <text x="898" y="326" font-size="9.5" font-weight="700" fill="#5e5e5a">captures</text>
  <path d="M 1360 280 C 1300 330, 1120 340, 1018 362" fill="none" stroke="#8a8a86" stroke-width="2.2" marker-end="url(#mS)"/>
  <text x="1180" y="326" font-size="9.5" font-weight="700" fill="#5e5e5a">interactions</text>
  <path d="M 890 474 L 890 532" fill="none" stroke="#8a8a86" stroke-width="2.4" marker-end="url(#mS)"/>
  <text x="900" y="510" font-size="9.5" font-weight="700" fill="#5e5e5a">the queue has items</text>
  <path d="M 524 604 L 696 604" fill="none" stroke="#8a8a86" stroke-width="2.4" marker-end="url(#mS)"/>
  <text x="610" y="596" font-size="9.5" font-weight="700" fill="#5e5e5a" text-anchor="middle">due</text>
  <path d="M 698 598 C 624 550, 602 400, 424 284" fill="none" stroke="#8a8a86" stroke-width="2.4" marker-start="url(#mS)" marker-end="url(#mS)"/>
  <text x="562" y="446" font-size="9.5" font-weight="700" fill="#5e5e5a">fetch · push (CAS)</text>
  <path d="M 1084 556 C 1120 550, 1146 546, 1176 542" fill="none" stroke="#8a8a86" stroke-width="2.4" marker-start="url(#mS)" marker-end="url(#mS)"/>
  <text x="1130" y="528" font-size="9.5" font-weight="700" fill="#5e5e5a" text-anchor="middle">download · upload</text>
  <text x="1130" y="516" font-size="8.5" fill="#999" text-anchor="middle">during the tick</text>
  <path d="M 1084 694 C 1120 696, 1146 700, 1176 702" fill="none" stroke="#8a8a86" stroke-width="2.4" marker-end="url(#mS)"/>
  <text x="1130" y="686" font-size="9.5" font-weight="700" fill="#5e5e5a" text-anchor="middle">approved work: provision</text>
  <path d="M 1060 532 C 1118 496, 1116 382, 1140 320 C 1172 290, 1280 282, 1330 282" fill="none" stroke="#8a8a86" stroke-width="2.4" marker-end="url(#mS)"/>
  <text x="1096" y="466" font-size="9.5" font-weight="700" fill="#5e5e5a">plan lines</text>
  <path d="M 1180 786 C 860 832, 280 836, 142 756 C 104 710, 100 430, 132 360 C 148 320, 166 294, 180 282" fill="none" stroke="#8a8a86" stroke-width="2.2" marker-start="url(#mS)" marker-end="url(#mS)"/>
  <text x="760" y="820" font-size="9.5" font-weight="700" fill="#5e5e5a" text-anchor="middle">clone code · push the pull request</text>
  <path d="M 696 686 C 640 696, 580 708, 524 714" fill="none" stroke="#8a8a86" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#mS)"/>
  <text x="610" y="688" font-size="8.5" fill="#999" text-anchor="middle">health · billing counters</text>
  <path d="M 1566 500 C 1548 508, 1536 520, 1524 530" fill="none" stroke="#c9962e" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#mK)"/>
  <text x="1545" y="500" font-size="8.5" font-weight="700" fill="#8a6a1d" text-anchor="middle">unwraps</text>
  <path d="M 1566 706 C 1550 720, 1538 730, 1524 736" fill="none" stroke="#c9962e" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#mK)"/>
  <text x="1545" y="700" font-size="8.5" font-weight="700" fill="#8a6a1d" text-anchor="middle">encrypts</text>
  <path d="M 1566 414 C 1400 356, 1220 350, 1088 394" fill="none" stroke="#c9962e" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#mK)"/>
  <text x="1310" y="346" font-size="9" font-weight="700" fill="#8a6a1d" text-anchor="middle">encrypts the queue</text>

  <rect x="60" y="862" width="1680" height="66" rx="10" fill="#fafafa"/>
  <text x="76" y="884" font-size="10.5" font-weight="700" fill="#5e5e5a">WHO OWNS THE ACCOUNT EACH MACHINE RUNS IN</text>
  <rect x="76" y="898" width="12" height="12" rx="3" fill="#4a7fb5" opacity="0.25" stroke="#4a7fb5" stroke-width="1.2"/>
  <text x="96" y="908" font-size="9.5" font-weight="700" fill="#4a7fb5">in our service account</text>
  <text x="96" y="922" font-size="9" fill="#666">the receiver and its queue, the dispatcher, the scheduler, the warm cache, the pool host, the key, the control plane</text>
  <rect x="700" y="898" width="12" height="12" rx="3" fill="#c9962e" opacity="0.25" stroke="#c9962e" stroke-width="1.2"/>
  <text x="720" y="908" font-size="9.5" font-weight="700" fill="#c9962e">in your AWS account</text>
  <text x="720" y="922" font-size="9" fill="#666">nothing — the customer creates no account and places no secret</text>
  <rect x="1300" y="898" width="12" height="12" rx="3" fill="#2b8a8a" opacity="0.25" stroke="#2b8a8a" stroke-width="1.2"/>
  <text x="1320" y="908" font-size="9.5" font-weight="700" fill="#2b8a8a">on your side</text>
  <text x="1320" y="922" font-size="9" fill="#666">GitHub, the laptop host if you run one, and your chat workspace</text>
  <rect x="60" y="944" width="1680" height="72" rx="10" fill="#eef2f6"/>
  <rect x="60" y="944" width="4" height="72" fill="#3a6a99"/>
  <text x="84" y="968" font-size="11" font-weight="700" fill="#3a6a99">WHAT WE CAN TELL THE CUSTOMER</text>
  <text x="84" y="990" font-size="11.5" fill="#1a1a1a">“Everything we hold about you is encrypted at rest under a key that exists for your organization alone, and it is unwrapped only while your plan is being evaluated —</text>
  <text x="84" y="1008" font-size="11.5" fill="#1a1a1a">a stolen disk or a leaked snapshot of ours is ciphertext. Your code exists only on a machine created for your work and destroyed when it ends.”</text>
  <text x="1724" y="1008" font-size="8.5" fill="#8a8a86" text-anchor="end">the residual is a compromised dispatcher process while your tick runs</text>
</svg>
