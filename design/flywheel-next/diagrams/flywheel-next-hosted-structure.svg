<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 860" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a86"/></marker>
    <marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a7fb5"/></marker>
    <marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e5b"/></marker>
    <marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9962e"/></marker>
    <marker id="mP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b5cb8"/></marker>
    <marker id="mT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b8a8a"/></marker>
    <g id="cyl"> <path d="M -24 -11 L -24 13 A 24 8 0 0 0 24 13 L 24 -11" fill="#f7f1e2" stroke="#c9962e" stroke-width="1.6"/> <ellipse cx="0" cy="-11" rx="24" ry="8" fill="#efe4c8" stroke="#c9962e" stroke-width="1.6"/> </g>
    <g id="gate" stroke="#c05b5b" stroke-width="3" stroke-linecap="round"> <line x1="-8" y1="-11" x2="-8" y2="11"/><line x1="8" y1="-11" x2="8" y2="11"/><line x1="-8" y1="-3" x2="8" y2="-3"/> </g>
    <g id="gear"> <circle r="9" fill="#fff" stroke="currentColor" stroke-width="2.4"/> <circle r="3" fill="currentColor"/> <g stroke="currentColor" stroke-width="2.4"> <line y1="-9" y2="-13.5"/><line y1="9" y2="13.5"/> <line x1="-9" x2="-13.5"/><line x1="9" x2="13.5"/> <line x1="-6.4" y1="-6.4" x2="-9.5" y2="-9.5"/><line x1="6.4" y1="6.4" x2="9.5" y2="9.5"/> <line x1="-6.4" y1="6.4" x2="-9.5" y2="9.5"/><line x1="6.4" y1="-6.4" x2="9.5" y2="-9.5"/> </g> </g>
    <g id="repo"> <rect x="-26" y="-18" width="52" height="36" rx="7" fill="#fff" stroke="currentColor" stroke-width="2"/> <circle cx="-9" cy="8" r="3.2" fill="currentColor"/> <circle cx="9" cy="-8" r="3.2" fill="currentColor"/> <path d="M -9 8 v-8 a 8 8 0 0 1 8 -8 h 1" fill="none" stroke="currentColor" stroke-width="2"/> </g>
    <g id="cube" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"> <path d="M -16 -8 L 0 -17 L 16 -8 L 16 10 L 0 19 L -16 10 Z" fill="#fff"/> <path d="M -16 -8 L 0 1 L 16 -8 M 0 1 L 0 19" fill="none"/> </g>
    <g id="tbl"> <rect x="-11" y="-9" width="22" height="18" rx="2" fill="#fff" stroke="currentColor" stroke-width="1.8"/> <line x1="-11" y1="-3" x2="11" y2="-3" stroke="currentColor" stroke-width="1.4"/> <line x1="-11" y1="3" x2="11" y2="3" stroke="currentColor" stroke-width="1.4"/> <line x1="-3" y1="-9" x2="-3" y2="9" stroke="currentColor" stroke-width="1.4"/> </g>
    <g id="lam"> <circle r="10" fill="#fff" stroke="currentColor" stroke-width="1.8"/> <text y="4.5" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">λ</text> </g>
    <g id="people"> <circle cy="-5" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/> <path d="M -8 9 a 8 7 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.8"/> </g>
    <g id="key"> <rect x="-7" y="-2" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/> <path d="M -4 -2 v-3 a 4 4 0 0 1 8 0 v3" fill="none" stroke="currentColor" stroke-width="1.8"/> </g>
    <g id="row" stroke="currentColor" stroke-width="1.6" fill="none"><rect x="-8" y="-6" width="16" height="12" rx="2"/><line x1="-4" y1="-1" x2="4" y2="-1"/><line x1="-4" y1="3" x2="1" y2="3"/></g>
    <g id="browser"> <rect x="-22" y="-14" width="44" height="28" rx="4" fill="#fff" stroke="currentColor" stroke-width="2"/> <line x1="-22" y1="-6" x2="22" y2="-6" stroke="currentColor" stroke-width="2"/> <circle cx="-16" cy="-10" r="1.6" fill="currentColor"/><circle cx="-11" cy="-10" r="1.6" fill="currentColor"/> </g>
    <g id="wave-t" fill="none" stroke="#2b8a8a" stroke-width="2.2" stroke-linecap="round"> <path d="M -18 0 q 4.5 -8 9 0 t 9 0 t 9 0 t 9 0"/> </g>
  </defs>
  <rect width="1680" height="860" fill="#fff"/>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">Flywheel hosted — nothing of yours runs between ticks; two shared components see a payload in transit and keep nothing</text>
  <text x="40" y="57" font-size="12" fill="#666">a zone is an account · a glyph is a machine and the line under it says what it holds · the tick is the only place your state is in the clear, and it exists only while it runs</text>

  <!-- ZONE: your side -->
  <rect x="40" y="86" width="1180" height="180" rx="12" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.4"/>
  <text x="56" y="112" font-size="11.5" font-weight="700" fill="#5f6b7a">YOUR SIDE</text>
  <use href="#repo" x="180" y="170" color="#2e9e5b"/>
  <text x="180" y="204" font-size="10" fill="#666" text-anchor="middle">GitHub</text>
  <text x="180" y="218" font-size="8.5" fill="#27824c" text-anchor="middle">state · blueprints · code, plaintext, yours</text>
  <use href="#gear" x="470" y="170" color="#8a8a86"/>
  <text x="470" y="204" font-size="10" fill="#666" text-anchor="middle">laptop host</text>
  <text x="470" y="218" font-size="8.5" fill="#999" text-anchor="middle">optional · intermittent · builds at tier 1</text>
  <use href="#wave-t" x="760" y="170"/>
  <text x="760" y="204" font-size="10" fill="#666" text-anchor="middle">workspace</text>
  <text x="760" y="218" font-size="8.5" fill="#1f6e6e" text-anchor="middle">our application, installed here</text>
  <rect x="704" y="228" width="112" height="16" rx="8" fill="#e8f3f3" stroke="#2b8a8a" stroke-width="1"/>
  <text x="760" y="240" font-size="8.5" font-weight="700" fill="#1f6e6e" text-anchor="middle">shared · plan text only</text>
  <use href="#browser" x="1060" y="170" color="#8a8a86"/>
  <text x="1060" y="204" font-size="10" fill="#666" text-anchor="middle">your browser</text>
  <text x="1060" y="218" font-size="8.5" fill="#999" text-anchor="middle">the page at our served name</text>

  <!-- ZONE: third parties -->
  <rect x="1250" y="86" width="390" height="180" rx="12" fill="#f8f5fc" stroke="#7b5cb8" stroke-width="1.4"/>
  <text x="1266" y="112" font-size="11.5" font-weight="700" fill="#5a3f95">THIRD PARTIES</text>
  <use href="#key" x="1370" y="170" color="#7b5cb8"/>
  <text x="1370" y="204" font-size="10" fill="#666" text-anchor="middle">Frontegg</text>
  <text x="1370" y="218" font-size="8.5" fill="#6a4da3" text-anchor="middle">sign-in · membership · roles</text>
  <use href="#people" x="1550" y="170" color="#8a8a86"/>
  <text x="1550" y="204" font-size="10" fill="#666" text-anchor="middle">members</text>
  <text x="1550" y="218" font-size="8.5" fill="#999" text-anchor="middle">a token on every call</text>

  <!-- ZONE: service account -->
  <rect x="40" y="300" width="1180" height="380" rx="12" fill="#eef3f9" stroke="#4a7fb5" stroke-width="1.4"/>
  <text x="56" y="326" font-size="11.5" font-weight="700" fill="#3f6d9c">SERVICE ACCOUNT · blue is ours, amber is yours under your key</text>
  <use href="#lam" x="160" y="410" color="#4a7fb5"/>
  <text x="160" y="442" font-size="10" fill="#666" text-anchor="middle">receiver</text>
  <text x="160" y="456" font-size="8.5" fill="#999" text-anchor="middle">verifies · defers · routes by workspace</text>
  <rect x="112" y="466" width="96" height="16" rx="8" fill="#fff" stroke="#8a8a86" stroke-width="1"/>
  <text x="160" y="478" font-size="8.5" font-weight="700" fill="#5f6b7a" text-anchor="middle">shared · keeps nothing</text>
  <use href="#tbl" x="420" y="410" color="#c9962e"/>
  <use href="#row" x="452" y="398" color="#c9962e"/><use href="#row" x="452" y="418" color="#c9962e"/>
  <text x="420" y="442" font-size="10" fill="#666" text-anchor="middle">your queue</text>
  <text x="420" y="456" font-size="8.5" fill="#a97e26" text-anchor="middle">FIFO · group id = your organization</text>
  <polygon points="690,362 744,410 690,458 636,410" fill="#fff" stroke="#4a7fb5" stroke-width="2.2"/>
  <text x="690" y="406" font-size="11" font-weight="700" fill="#3f6d9c" text-anchor="middle">ONE TICK</text>
  <text x="690" y="422" font-size="8.5" fill="#3f6d9c" text-anchor="middle">15 minutes, then exits</text>
  <text x="690" y="480" font-size="8.5" fill="#999" text-anchor="middle">your state in the clear only here · scratch wiped and the key dropped before exit</text>
  <use href="#browser" x="1030" y="410" color="#4a7fb5"/>
  <text x="1030" y="442" font-size="10" fill="#666" text-anchor="middle">page and tool server</text>
  <text x="1030" y="456" font-size="8.5" fill="#999" text-anchor="middle">the same function, request-invoked</text>
  <use href="#gate" x="1030" y="512"/>
  <text x="1030" y="538" font-size="8.5" font-weight="700" fill="#a34848" text-anchor="middle">no token → refused and recorded</text>
  <use href="#gear" x="160" y="600" color="#4a7fb5"/>
  <text x="160" y="632" font-size="10" fill="#666" text-anchor="middle">scheduler</text>
  <text x="160" y="646" font-size="8.5" fill="#999" text-anchor="middle">one entry per organization · 60 seconds</text>
  <use href="#cyl" x="420" y="596"/>
  <text x="420" y="638" font-size="10" fill="#666" text-anchor="middle">warm cache</text>
  <text x="420" y="652" font-size="8.5" fill="#a97e26" text-anchor="middle">a bundle of two sparse clones</text>
  <use href="#key" x="690" y="600" color="#c9962e"/>
  <text x="690" y="632" font-size="10" fill="#666" text-anchor="middle">your KMS key</text>
  <text x="690" y="646" font-size="8.5" fill="#a97e26" text-anchor="middle">resource tag must equal session tag</text>

  <!-- ZONE: work -->
  <rect x="1250" y="300" width="390" height="380" rx="12" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.4"/>
  <text x="1266" y="326" font-size="11.5" font-weight="700" fill="#5f6b7a">WORK · only while a session runs</text>
  <use href="#cube" x="1340" y="410" color="#4a7fb5"/>
  <text x="1340" y="446" font-size="10" fill="#666" text-anchor="middle">pool host</text>
  <text x="1340" y="460" font-size="8.5" fill="#999" text-anchor="middle">from your image · one organization</text>
  <text x="1340" y="474" font-size="8.5" fill="#999" text-anchor="middle">terminated at retire, disk destroyed</text>
  <use href="#repo" x="1552" y="580" color="#2e9e5b"/>
  <text x="1524" y="614" font-size="10" fill="#666" text-anchor="middle">your code</text>
  <text x="1470" y="628" font-size="8.5" fill="#27824c">cloned here and on no shared machine</text>
  <path d="M 1372 434 C 1450 484, 1506 522, 1534 552" fill="none" stroke="#2e9e5b" stroke-width="2.2" marker-start="url(#mG)" marker-end="url(#mG)"/>
  <text x="1370" y="530" font-size="9" fill="#27824c">clone · push the pull request</text>

  <!-- sweeps: your side into the machinery -->
  <path d="M 180 194 C 176 260, 168 340, 160 386" fill="none" stroke="#8a8a86" stroke-width="2.2" marker-end="url(#mN)"/>
  <text x="120" y="290" font-size="9" fill="#5f6b7a" text-anchor="end">webhooks</text>
  <path d="M 462 194 C 400 250, 260 330, 180 392" fill="none" stroke="#8a8a86" stroke-width="2.2" marker-end="url(#mN)"/>
  <text x="360" y="290" font-size="9" fill="#5f6b7a" text-anchor="middle">captures</text>
  <path d="M 748 252 C 600 300, 380 344, 196 402" fill="none" stroke="#2b8a8a" stroke-width="2.2" marker-end="url(#mT)"/>
  <text x="512" y="336" font-size="9" fill="#1f6e6e" text-anchor="middle">interactions · events</text>
  <path d="M 704 364 C 730 320, 770 280, 792 254" fill="none" stroke="#2b8a8a" stroke-width="2.2" marker-end="url(#mT)"/>
  <text x="806" y="300" font-size="9" fill="#1f6e6e">plan lines · the deferred reply</text>
  <path d="M 196 188 C 300 252, 480 302, 654 370" fill="none" stroke="#2e9e5b" stroke-width="2.2" marker-start="url(#mG)" marker-end="url(#mG)"/>
  <text x="606" y="290" font-size="9" fill="#27824c" text-anchor="middle">fetch · push by compare-and-swap</text>
  <path d="M 1060 194 C 1054 260, 1042 340, 1030 386" fill="none" stroke="#8a8a86" stroke-width="2.2" marker-end="url(#mN)"/>
  <text x="1072" y="290" font-size="9" fill="#5f6b7a">page request · a read, never a tick</text>
  <path d="M 1348 186 C 1250 240, 1120 300, 1058 388" fill="none" stroke="#7b5cb8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#mP)"/>
  <text x="1210" y="268" font-size="9" fill="#5a3f95" text-anchor="middle">the token, checked on every call</text>

  <!-- sweeps: inside -->
  <path d="M 178 410 L 392 410" fill="none" stroke="#c9962e" stroke-width="2.4" marker-end="url(#mA)"/>
  <text x="286" y="400" font-size="9" fill="#a97e26" text-anchor="middle">routes by workspace id</text>
  <path d="M 448 410 L 628 410" fill="none" stroke="#c9962e" stroke-width="2.4" marker-end="url(#mA)"/>
  <text x="540" y="400" font-size="9" font-weight="700" fill="#a97e26" text-anchor="middle">one tick at a time</text>
  <path d="M 178 588 C 260 540, 340 470, 400 428" fill="none" stroke="#4a7fb5" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#mB)"/>
  <text x="256" y="520" font-size="9" fill="#3f6d9c">due · onto the queue</text>
  <path d="M 656 434 C 580 500, 500 550, 448 580" fill="none" stroke="#4a7fb5" stroke-width="2.2" marker-start="url(#mB)" marker-end="url(#mB)"/>
  <text x="530" y="546" font-size="9" fill="#3f6d9c" text-anchor="middle">download · upload</text>
  <path d="M 690 462 L 690 578" fill="none" stroke="#c9962e" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#mA)"/>
  <text x="702" y="524" font-size="9" fill="#a97e26">unwrap under your tag</text>
  <path d="M 750 404 C 830 396, 920 396, 1002 404" fill="none" stroke="#4a7fb5" stroke-width="2.2" marker-end="url(#mB)"/>
  <text x="876" y="386" font-size="9" fill="#3f6d9c" text-anchor="middle">the same binary, request-invoked</text>
  <path d="M 736 392 C 900 330, 1140 330, 1404 396" fill="none" stroke="#4a7fb5" stroke-width="2.2" marker-end="url(#mB)"/>
  <text x="1090" y="336" font-size="9" fill="#3f6d9c" text-anchor="middle">approved work: provision</text>

  <!-- legend -->
  <rect x="40" y="702" width="1600" height="118" rx="10" fill="#fafafa" stroke="#d5d5d0"/>
  <g font-size="10" fill="#555">
    <line x1="60" y1="728" x2="100" y2="728" stroke="#4a7fb5" stroke-width="3"/><text x="108" y="732">the machinery we run</text>
    <line x1="270" y1="728" x2="310" y2="728" stroke="#c9962e" stroke-width="3"/><text x="318" y="732">your stores under your key</text>
    <line x1="520" y1="728" x2="560" y2="728" stroke="#2e9e5b" stroke-width="3"/><text x="568" y="732">GitHub and code</text>
    <line x1="720" y1="728" x2="760" y2="728" stroke="#7b5cb8" stroke-width="3"/><text x="768" y="732">identity</text>
    <use href="#gate" x="860" y="728"/><text x="880" y="732">the one refusal</text>
    <line x1="1020" y1="728" x2="1060" y2="728" stroke="#2b8a8a" stroke-width="3"/><text x="1068" y="732">chat</text>
    <line x1="1150" y1="728" x2="1190" y2="728" stroke="#8a8a86" stroke-width="3"/><text x="1198" y="732">people, places, accounts</text>
    <use href="#lam" x="1440" y="728" color="#4a7fb5"/><use href="#cyl" transform="translate(1580,726) scale(0.5)"/><text x="1598" y="732">a store</text><text x="1458" y="732">a function, invoked</text>
  </g>
  <g font-size="10.5" fill="#333">
    <text x="60" y="762">the receiver and the chat application are the two shared components, and the only two: each sees one payload in transit and keeps nothing at rest</text>
    <text x="60" y="782">every other machine holds one organization's content under a key no other organization's session can unwrap · between ticks, none of it is running</text>
  </g>
</svg>
