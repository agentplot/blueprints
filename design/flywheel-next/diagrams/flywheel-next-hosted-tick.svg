<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 900" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a86"/></marker>
    <marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a7fb5"/></marker>
    <marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e5b"/></marker>
    <marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9962e"/></marker>
    <marker id="mP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b5cb8"/></marker>
    <marker id="mT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b8a8a"/></marker>
    <g id="cyl"> <path d="M -24 -11 L -24 13 A 24 8 0 0 0 24 13 L 24 -11" fill="#f7f1e2" stroke="#c9962e" stroke-width="1.6"/> <ellipse cx="0" cy="-11" rx="24" ry="8" fill="#efe4c8" stroke="#c9962e" stroke-width="1.6"/> </g>
    <g id="gear"> <circle r="9" fill="#fff" stroke="currentColor" stroke-width="2.4"/> <circle r="3" fill="currentColor"/> <g stroke="currentColor" stroke-width="2.4"> <line y1="-9" y2="-13.5"/><line y1="9" y2="13.5"/> <line x1="-9" x2="-13.5"/><line x1="9" x2="13.5"/> <line x1="-6.4" y1="-6.4" x2="-9.5" y2="-9.5"/><line x1="6.4" y1="6.4" x2="9.5" y2="9.5"/> <line x1="-6.4" y1="6.4" x2="-9.5" y2="9.5"/><line x1="6.4" y1="-6.4" x2="9.5" y2="-9.5"/> </g> </g>
    <g id="repo"> <rect x="-26" y="-18" width="52" height="36" rx="7" fill="#fff" stroke="currentColor" stroke-width="2"/> <circle cx="-9" cy="8" r="3.2" fill="currentColor"/> <circle cx="9" cy="-8" r="3.2" fill="currentColor"/> <path d="M -9 8 v-8 a 8 8 0 0 1 8 -8 h 1" fill="none" stroke="currentColor" stroke-width="2"/> </g>
    <g id="cube" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"> <path d="M -16 -8 L 0 -17 L 16 -8 L 16 10 L 0 19 L -16 10 Z" fill="#fff"/> <path d="M -16 -8 L 0 1 L 16 -8 M 0 1 L 0 19" fill="none"/> </g>
    <g id="lam"> <circle r="10" fill="#fff" stroke="currentColor" stroke-width="1.8"/> <text y="4.5" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">λ</text> </g>
    <g id="key"> <rect x="-7" y="-2" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/> <path d="M -4 -2 v-3 a 4 4 0 0 1 8 0 v3" fill="none" stroke="currentColor" stroke-width="1.8"/> </g>
    <g id="row" stroke="currentColor" stroke-width="1.6" fill="none"><rect x="-8" y="-6" width="16" height="12" rx="2"/><line x1="-4" y1="-1" x2="4" y2="-1"/><line x1="-4" y1="3" x2="1" y2="3"/></g>
    <g id="browser"> <rect x="-22" y="-14" width="44" height="28" rx="4" fill="#fff" stroke="currentColor" stroke-width="2"/> <line x1="-22" y1="-6" x2="22" y2="-6" stroke="currentColor" stroke-width="2"/> <circle cx="-16" cy="-10" r="1.6" fill="currentColor"/><circle cx="-11" cy="-10" r="1.6" fill="currentColor"/> </g>
    <g id="wave-t" fill="none" stroke="#2b8a8a" stroke-width="2.2" stroke-linecap="round"> <path d="M -18 0 q 4.5 -8 9 0 t 9 0 t 9 0 t 9 0"/> </g>
    <g id="bolt"><polygon points="-2.5,-11 5,-11 0.5,-2.5 6,-2.5 -4.5,11 -1,0.5 -6,0.5" fill="currentColor"/></g>
    <g id="cross"> <circle r="10" fill="#fbeeee" stroke="#c05b5b" stroke-width="2"/> <path d="M -4 -4 l 8 8 M 4 -4 l -8 8" fill="none" stroke="#a34848" stroke-width="2.5"/> </g>
    <g id="clock"> <circle r="9" fill="#fff" stroke="#c9962e" stroke-width="2"/> <path d="M 0 -5 V 0 H 4" fill="none" stroke="#c9962e" stroke-width="2.2" stroke-linecap="round"/> </g>
  </defs>
  <rect width="1680" height="900" fill="#fff"/>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">Flywheel hosted — every invoker lands on your queue, and the queue admits one tick of your organization at a time</text>
  <text x="40" y="57" font-size="12" fill="#666">five invokers, one queue, one tick · the scheduler's target is the queue and never the function, so a due time serializes with the rest</text>

  <!-- INVOKER TRACKS -->
  <text x="40" y="112" font-size="11.5" font-weight="700" fill="#5f6b7a">INVOKERS</text>
  <text x="40" y="150" font-size="11" font-weight="700" fill="#27824c">GitHub</text>
  <line x1="150" y1="146" x2="470" y2="146" stroke="#2e9e5b" stroke-width="2" opacity="0.4"/>
  <use href="#repo" x="200" y="146" color="#2e9e5b"/>
  <use href="#bolt" x="300" y="146" color="#2e9e5b"/>
  <text x="300" y="170" font-size="8.5" fill="#27824c" text-anchor="middle">webhook · HMAC checked</text>

  <text x="40" y="222" font-size="11" font-weight="700" fill="#1f6e6e">chat</text>
  <line x1="150" y1="218" x2="470" y2="218" stroke="#2b8a8a" stroke-width="2" opacity="0.4"/>
  <use href="#wave-t" x="200" y="218"/>
  <use href="#bolt" x="300" y="218" color="#2b8a8a"/>
  <text x="300" y="242" font-size="8.5" fill="#1f6e6e" text-anchor="middle">interaction · answered in three seconds</text>

  <text x="40" y="294" font-size="11" font-weight="700" fill="#5f6b7a">laptop host</text>
  <line x1="150" y1="290" x2="470" y2="290" stroke="#8a8a86" stroke-width="2" opacity="0.4"/>
  <use href="#gear" x="200" y="290" color="#8a8a86"/>
  <use href="#bolt" x="300" y="290" color="#8a8a86"/>
  <text x="300" y="314" font-size="8.5" fill="#999" text-anchor="middle">capture · one per source event</text>

  <text x="40" y="366" font-size="11" font-weight="700" fill="#3f6d9c">the page</text>
  <line x1="150" y1="362" x2="470" y2="362" stroke="#4a7fb5" stroke-width="2" opacity="0.4"/>
  <use href="#browser" x="200" y="362" color="#4a7fb5"/>
  <use href="#bolt" x="300" y="362" color="#4a7fb5"/>
  <use href="#key" x="370" y="362" color="#7b5cb8"/>
  <use href="#cross" x="436" y="362"/>
  <text x="300" y="386" font-size="8.5" fill="#3f6d9c" text-anchor="middle">a tool call · the read never enqueues</text>
  <text x="420" y="392" font-size="8.5" fill="#a34848" text-anchor="middle">no token, refused</text>

  <text x="40" y="438" font-size="11" font-weight="700" fill="#3f6d9c">scheduler</text>
  <line x1="150" y1="434" x2="470" y2="434" stroke="#4a7fb5" stroke-width="2" opacity="0.4"/>
  <use href="#clock" x="200" y="434"/>
  <use href="#bolt" x="300" y="434" color="#4a7fb5"/>
  <text x="300" y="458" font-size="8.5" fill="#3f6d9c" text-anchor="middle">due · 60-second precision</text>

  <!-- receiver -->
  <use href="#lam" x="520" y="196" color="#4a7fb5"/>
  <text x="546" y="194" font-size="10" fill="#666">receiver</text>
  <text x="546" y="207" font-size="8.5" fill="#999">routes by workspace id</text>
  <path d="M 476 146 C 490 162, 496 176, 506 186" fill="none" stroke="#2e9e5b" stroke-width="2.2" marker-end="url(#mG)"/>
  <path d="M 476 218 C 486 212, 494 206, 502 202" fill="none" stroke="#2b8a8a" stroke-width="2.2" marker-end="url(#mT)"/>
  <path d="M 490 288 C 502 260, 510 234, 516 210" fill="none" stroke="#8a8a86" stroke-width="2.2" marker-end="url(#mN)"/>

  <!-- CENTERPIECE: the queue -->
  <rect x="640" y="120" width="230" height="380" rx="14" fill="#fffdf6" stroke="#c9962e" stroke-width="2.6"/>
  <text x="755" y="152" font-size="12.5" font-weight="700" fill="#a97e26" text-anchor="middle">YOUR QUEUE</text>
  <text x="755" y="170" font-size="9" fill="#a97e26" text-anchor="middle">FIFO · group id = your organization</text>
  <use href="#row" x="700" y="210" color="#c9962e"/><use href="#row" x="755" y="210" color="#c9962e"/><use href="#row" x="810" y="210" color="#c9962e"/>
  <use href="#row" x="700" y="248" color="#c9962e"/><use href="#row" x="755" y="248" color="#c9962e"/>
  <text x="755" y="292" font-size="9.5" fill="#666" text-anchor="middle">encrypted under your key</text>
  <text x="755" y="308" font-size="8.5" fill="#999" text-anchor="middle">the caller's retry buffer, and never state</text>
  <rect x="664" y="330" width="182" height="26" rx="13" fill="#f7f1e2" stroke="#c9962e"/>
  <text x="755" y="347" font-size="10.5" font-weight="700" fill="#a97e26" text-anchor="middle">one tick released at a time</text>
  <use href="#key" x="755" y="392" color="#c9962e"/>
  <text x="755" y="422" font-size="8.5" fill="#a97e26" text-anchor="middle">the receiver encrypts and never decrypts</text>
  <text x="755" y="468" font-size="8.5" fill="#999" text-anchor="middle">a repeat under the same key writes nothing</text>

  <path d="M 540 208 C 580 230, 600 252, 632 266" fill="none" stroke="#c9962e" stroke-width="2.4" marker-end="url(#mA)"/>
  <path d="M 476 362 C 540 356, 580 320, 632 292" fill="none" stroke="#4a7fb5" stroke-width="2.2" marker-end="url(#mB)"/>
  <path d="M 476 434 C 546 424, 580 350, 632 312" fill="none" stroke="#4a7fb5" stroke-width="2.2" marker-end="url(#mB)"/>
  <text x="556" y="404" font-size="9" fill="#3f6d9c">the target is the queue, never the function</text>

  <!-- the tick -->
  <polygon points="990,240 1050,306 990,372 930,306" fill="#fff" stroke="#4a7fb5" stroke-width="2.4"/>
  <text x="990" y="302" font-size="11" font-weight="700" fill="#3f6d9c" text-anchor="middle">ONE TICK</text>
  <text x="990" y="318" font-size="8.5" fill="#3f6d9c" text-anchor="middle">15 minutes</text>
  <path d="M 876 306 L 922 306" fill="none" stroke="#c9962e" stroke-width="2.6" marker-end="url(#mA)"/>
  <text x="900" y="286" font-size="9" font-weight="700" fill="#a97e26" text-anchor="middle">released</text>
  <text x="990" y="410" font-size="8.5" fill="#999" text-anchor="middle">assumes the tier role under your session tag</text>
  <text x="990" y="424" font-size="8.5" fill="#999" text-anchor="middle">scratch wiped and the key dropped before exit</text>

  <!-- fanout -->
  <use href="#repo" x="1300" y="130" color="#2e9e5b"/>
  <text x="1300" y="164" font-size="10" fill="#666" text-anchor="middle">GitHub</text>
  <text x="1300" y="178" font-size="8.5" fill="#27824c" text-anchor="middle">fetch, then push by compare-and-swap</text>
  <path d="M 1032 268 C 1130 210, 1210 168, 1268 144" fill="none" stroke="#2e9e5b" stroke-width="2.2" marker-start="url(#mG)" marker-end="url(#mG)"/>
  <text x="1130" y="212" font-size="9" fill="#27824c">if the push loses, refetch and try once more</text>

  <use href="#cyl" x="1300" y="242"/>
  <text x="1300" y="284" font-size="10" fill="#666" text-anchor="middle">warm cache</text>
  <text x="1300" y="298" font-size="8.5" fill="#a97e26" text-anchor="middle">download, work in scratch, upload</text>
  <path d="M 1050 292 C 1130 268, 1200 252, 1266 244" fill="none" stroke="#c9962e" stroke-width="2.2" marker-start="url(#mA)" marker-end="url(#mA)"/>

  <use href="#key" x="1300" y="360" color="#c9962e"/>
  <text x="1300" y="392" font-size="10" fill="#666" text-anchor="middle">your KMS key</text>
  <text x="1300" y="406" font-size="8.5" fill="#a97e26" text-anchor="middle">unwrapped for this tick and no other</text>
  <path d="M 1046 328 C 1140 344, 1220 354, 1272 358" fill="none" stroke="#c9962e" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#mA)"/>

  <use href="#wave-t" x="1300" y="468"/>
  <text x="1300" y="498" font-size="10" fill="#666" text-anchor="middle">your workspace</text>
  <text x="1300" y="512" font-size="8.5" fill="#1f6e6e" text-anchor="middle">plan lines and the real reply</text>
  <path d="M 1040 330 C 1150 400, 1230 448, 1272 462" fill="none" stroke="#2b8a8a" stroke-width="2.2" marker-end="url(#mT)"/>

  <use href="#cube" x="1300" y="576" color="#4a7fb5"/>
  <text x="1300" y="612" font-size="10" fill="#666" text-anchor="middle">pool host</text>
  <text x="1300" y="626" font-size="8.5" fill="#999" text-anchor="middle">provisioned when the plan approves work</text>
  <path d="M 1044 338 C 1164 480, 1232 550, 1268 570" fill="none" stroke="#4a7fb5" stroke-width="2.2" marker-end="url(#mB)"/>

      <path d="M 984 376 C 946 440, 856 492, 782 504" fill="none" stroke="#4a7fb5" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#mB)"/>
  <text x="906" y="462" font-size="9" fill="#3f6d9c">writes the next entry onto your queue · one per organization, replacing its own</text>

  <!-- the greyed second organization -->
  <g opacity="0.34">
    <rect x="640" y="600" width="230" height="120" rx="14" fill="#fbfbfa" stroke="#8a8a86" stroke-width="2"/>
    <text x="755" y="632" font-size="12.5" font-weight="700" fill="#5f6b7a" text-anchor="middle">ANOTHER QUEUE</text>
    <text x="755" y="650" font-size="9" fill="#999" text-anchor="middle">another organization</text>
    <use href="#row" x="700" y="684" color="#8a8a86"/><use href="#row" x="755" y="684" color="#8a8a86"/><use href="#row" x="810" y="684" color="#8a8a86"/>
    <polygon points="990,606 1042,660 990,714 938,660" fill="#fff" stroke="#8a8a86" stroke-width="2"/>
    <text x="990" y="656" font-size="10" font-weight="700" fill="#5f6b7a" text-anchor="middle">ITS TICK</text>
    <text x="990" y="670" font-size="8.5" fill="#999" text-anchor="middle">the same function</text>
    <path d="M 876 660 L 930 660" fill="none" stroke="#8a8a86" stroke-width="2.2" marker-end="url(#mN)"/>
    <use href="#lam" x="520" y="660" color="#8a8a86"/>
    <path d="M 542 660 L 632 660" fill="none" stroke="#8a8a86" stroke-width="2" marker-end="url(#mN)"/>
  </g>
  <text x="1090" y="664" font-size="9.5" fill="#5f6b7a">the same receiver and the same function serve it, in turn</text>
  <text x="1090" y="680" font-size="9.5" fill="#5f6b7a">and never at once: no key of yours opens under its tag</text>

  <!-- legend -->
  <rect x="40" y="762" width="1600" height="102" rx="10" fill="#fafafa" stroke="#d5d5d0"/>
  <g font-size="10" fill="#555">
    <line x1="60" y1="788" x2="100" y2="788" stroke="#4a7fb5" stroke-width="3"/><text x="108" y="792">the machinery we run</text>
    <line x1="270" y1="788" x2="310" y2="788" stroke="#c9962e" stroke-width="3"/><text x="318" y="792">your stores under your key</text>
    <line x1="520" y1="788" x2="560" y2="788" stroke="#2e9e5b" stroke-width="3"/><text x="568" y="792">GitHub and code</text>
    <line x1="720" y1="788" x2="760" y2="788" stroke="#7b5cb8" stroke-width="3"/><text x="768" y="792">identity</text>
    <line x1="880" y1="788" x2="920" y2="788" stroke="#c05b5b" stroke-width="3"/><text x="928" y="792">the one refusal</text>
    <line x1="1060" y1="788" x2="1100" y2="788" stroke="#2b8a8a" stroke-width="3"/><text x="1108" y="792">chat</text>
    <line x1="1190" y1="788" x2="1230" y2="788" stroke="#8a8a86" stroke-width="3"/><text x="1238" y="792">people, places, accounts</text>
    <use href="#bolt" x="1470" y="788" color="#8a8a86"/><text x="1486" y="792">an invoker's event</text>
  </g>
  <g font-size="10.5" fill="#333">
    <text x="60" y="822">a page request is the one arrival that does not enqueue: it is a read under your token, and only the tool call it makes becomes a capture</text>
    <text x="60" y="842">a due time that fires and finds nothing due is one idempotent tick that reschedules or deletes, which costs one invocation and nothing else</text>
  </g>
</svg>
