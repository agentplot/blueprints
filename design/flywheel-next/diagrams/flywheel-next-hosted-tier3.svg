<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 900" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a86"/></marker>
    <marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a7fb5"/></marker>
    <marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9962e"/></marker>
    <marker id="mP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b5cb8"/></marker>
    <marker id="mT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b8a8a"/></marker>
    <g id="cyl"> <path d="M -20 -9 L -20 11 A 20 7 0 0 0 20 11 L 20 -9" fill="#f7f1e2" stroke="#c9962e" stroke-width="1.6"/> <ellipse cx="0" cy="-9" rx="20" ry="7" fill="#efe4c8" stroke="#c9962e" stroke-width="1.6"/> </g>
    <g id="gear"> <circle r="9" fill="#fff" stroke="currentColor" stroke-width="2.4"/> <circle r="3" fill="currentColor"/> <g stroke="currentColor" stroke-width="2.4"> <line y1="-9" y2="-13.5"/><line y1="9" y2="13.5"/> <line x1="-9" x2="-13.5"/><line x1="9" x2="13.5"/> <line x1="-6.4" y1="-6.4" x2="-9.5" y2="-9.5"/><line x1="6.4" y1="6.4" x2="9.5" y2="9.5"/> <line x1="-6.4" y1="6.4" x2="-9.5" y2="9.5"/><line x1="6.4" y1="-6.4" x2="9.5" y2="-9.5"/> </g> </g>
    <g id="cube" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"> <path d="M -14 -7 L 0 -15 L 14 -7 L 14 9 L 0 17 L -14 9 Z" fill="#fff"/> <path d="M -14 -7 L 0 1 L 14 -7 M 0 1 L 0 17" fill="none"/> </g>
    <g id="tbl"> <rect x="-11" y="-9" width="22" height="18" rx="2" fill="#fff" stroke="currentColor" stroke-width="1.8"/> <line x1="-11" y1="-3" x2="11" y2="-3" stroke="currentColor" stroke-width="1.4"/> <line x1="-11" y1="3" x2="11" y2="3" stroke="currentColor" stroke-width="1.4"/> <line x1="-3" y1="-9" x2="-3" y2="9" stroke="currentColor" stroke-width="1.4"/> </g>
    <g id="lam"> <circle r="10" fill="#fff" stroke="currentColor" stroke-width="1.8"/> <text y="4.5" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">λ</text> </g>
    <g id="key"> <rect x="-7" y="-2" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/> <path d="M -4 -2 v-3 a 4 4 0 0 1 8 0 v3" fill="none" stroke="currentColor" stroke-width="1.8"/> </g>
    <g id="browser"> <rect x="-18" y="-11" width="36" height="22" rx="4" fill="#fff" stroke="currentColor" stroke-width="2"/> <line x1="-18" y1="-4" x2="18" y2="-4" stroke="currentColor" stroke-width="2"/> <circle cx="-13" cy="-8" r="1.4" fill="currentColor"/> </g>
    <g id="wave-t" fill="none" stroke="#2b8a8a" stroke-width="2.2" stroke-linecap="round"> <path d="M -15 0 q 3.8 -7 7.5 0 t 7.5 0 t 7.5 0 t 7.5 0"/> </g>
    <g id="row" stroke="currentColor" stroke-width="1.6" fill="none"><rect x="-8" y="-6" width="16" height="12" rx="2"/><line x1="-4" y1="-1" x2="4" y2="-1"/><line x1="-4" y1="3" x2="1" y2="3"/></g>
    <g id="repo"> <rect x="-20" y="-13" width="40" height="26" rx="5" fill="#fff" stroke="currentColor" stroke-width="1.8"/> <circle cx="-7" cy="6" r="2.4" fill="currentColor"/> <circle cx="7" cy="-6" r="2.4" fill="currentColor"/> <path d="M -7 6 v-6 a 6 6 0 0 1 6 -6 h 1" fill="none" stroke="currentColor" stroke-width="1.8"/> </g>
    <g id="cross"> <circle r="9" fill="#fbeeee" stroke="#c05b5b" stroke-width="2"/> <path d="M -3.6 -3.6 l 7.2 7.2 M 3.6 -3.6 l -7.2 7.2" fill="none" stroke="#a34848" stroke-width="2.4"/> </g>
  </defs>
  <rect width="1680" height="900" fill="#fff"/>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">Tier 3 moves the stores, then the machinery; the control plane never moves</text>
  <text x="40" y="57" font-size="12" fill="#666">the same geometry three times · what changes is which account each machine runs in, and what our side still has to hold</text>

  <!-- ============ PANEL 1 ============ -->
  <rect x="40" y="84" width="520" height="600" rx="12" fill="#fff" stroke="#4a7fb5" stroke-width="1.6"/>
  <text x="60" y="112" font-size="12" font-weight="700" fill="#3f6d9c">TIERS 1–2 · everything in our account</text>
  <text x="60" y="130" font-size="9" fill="#999">a sign-in, an application, the App</text>
  <rect x="60" y="146" width="480" height="222" rx="9" fill="#eef3f9" stroke="#4a7fb5" stroke-width="1.3"/>
  <text x="76" y="170" font-size="10.5" font-weight="700" fill="#3f6d9c">SERVICE ACCOUNT</text>
  <use href="#lam" x="130" y="212" color="#4a7fb5"/>
  <text x="130" y="238" font-size="9" fill="#666" text-anchor="middle">receiver</text>
  <use href="#lam" x="250" y="212" color="#4a7fb5"/>
  <text x="250" y="238" font-size="9" fill="#666" text-anchor="middle">dispatcher</text>
  <use href="#browser" x="370" y="212" color="#4a7fb5"/>
  <text x="370" y="238" font-size="9" fill="#666" text-anchor="middle">page and tools</text>
  <use href="#gear" x="480" y="212" color="#4a7fb5"/>
  <text x="480" y="238" font-size="9" fill="#666" text-anchor="middle">scheduler</text>
  <use href="#tbl" x="130" y="298" color="#c9962e"/>
  <text x="130" y="322" font-size="9" fill="#666" text-anchor="middle">your queue</text>
  <use href="#cyl" x="250" y="296"/>
  <text x="250" y="322" font-size="9" fill="#666" text-anchor="middle">warm cache</text>
  <use href="#key" x="370" y="298" color="#c9962e"/>
  <text x="370" y="322" font-size="9" fill="#666" text-anchor="middle">your key</text>
  <use href="#cube" x="480" y="298" color="#4a7fb5"/>
  <text x="480" y="322" font-size="9" fill="#666" text-anchor="middle">pool host</text>
  <text x="76" y="348" font-size="8.5" fill="#a97e26">one key per organization, tagged</text>
  <rect x="60" y="392" width="480" height="120" rx="9" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.3"/>
  <text x="76" y="416" font-size="10.5" font-weight="700" fill="#5f6b7a">OUR CONTROL PLANE</text>
  <text x="76" y="436" font-size="9" fill="#666">registry · deployer · identity · chat</text>
  <text x="76" y="452" font-size="8.5" fill="#999">names, tier, health, counters</text>
  <use href="#key" x="440" y="440" color="#7b5cb8"/>
  <use href="#wave-t" x="500" y="440"/>
  <text x="76" y="484" font-size="9" font-weight="700" fill="#5a3f95">the tagged tier role opens every store</text>
  <text x="76" y="560" font-size="9.5" fill="#666">what you hold</text>
  <text x="76" y="578" font-size="9" fill="#999">a GitHub organization and a workspace</text>
  <use href="#repo" x="330" y="572" color="#2e9e5b"/>
  <text x="76" y="608" font-size="9.5" fill="#666">how you revoke</text>
  <text x="76" y="626" font-size="9" fill="#a34848">you ask us, and we delete</text>
  <use href="#cross" x="330" y="622"/>

  <!-- ============ PANEL 2 ============ -->
  <rect x="580" y="84" width="520" height="600" rx="12" fill="#fff" stroke="#c9962e" stroke-width="1.6"/>
  <text x="600" y="112" font-size="12" font-weight="700" fill="#a97e26">TIER 3 · STORES ONLY</text>
  <text x="600" y="130" font-size="9" fill="#999">one role and one provider entry</text>
  <rect x="600" y="146" width="480" height="104" rx="9" fill="#eef3f9" stroke="#4a7fb5" stroke-width="1.3"/>
  <text x="616" y="170" font-size="10.5" font-weight="700" fill="#3f6d9c">SERVICE ACCOUNT</text>
  <use href="#lam" x="670" y="212" color="#4a7fb5"/>
  <text x="670" y="238" font-size="9" fill="#666" text-anchor="middle">receiver</text>
  <use href="#lam" x="790" y="212" color="#4a7fb5"/>
  <text x="790" y="238" font-size="9" fill="#666" text-anchor="middle">dispatcher</text>
  <use href="#browser" x="910" y="212" color="#4a7fb5"/>
  <text x="910" y="238" font-size="9" fill="#666" text-anchor="middle">page and tools</text>
  <use href="#gear" x="1020" y="212" color="#4a7fb5"/>
  <text x="1020" y="238" font-size="9" fill="#666" text-anchor="middle">scheduler</text>
  <rect x="600" y="268" width="480" height="118" rx="9" fill="#fffdf6" stroke="#c9962e" stroke-width="2"/>
  <text x="616" y="292" font-size="10.5" font-weight="700" fill="#a97e26">YOUR AWS ACCOUNT</text>
  <use href="#tbl" x="670" y="330" color="#c9962e"/>
  <text x="670" y="354" font-size="9" fill="#666" text-anchor="middle">your queue</text>
  <use href="#cyl" x="790" y="328"/>
  <text x="790" y="354" font-size="9" fill="#666" text-anchor="middle">warm cache</text>
  <use href="#key" x="910" y="330" color="#c9962e"/>
  <text x="910" y="354" font-size="9" fill="#666" text-anchor="middle">your key</text>
  <use href="#cube" x="1020" y="330" color="#c9962e"/>
  <text x="1020" y="354" font-size="9" fill="#666" text-anchor="middle">pool image</text>
  <path d="M 790 232 C 782 268, 776 292, 766 310" fill="none" stroke="#7b5cb8" stroke-width="2.4" stroke-dasharray="8 3 2 3" marker-end="url(#mP)"/>
  <text x="806" y="278" font-size="9" font-weight="700" fill="#5a3f95">assumes your role, per tick</text>
  <text x="1064" y="262" font-size="8.5" fill="#6a4da3" text-anchor="end">sts:TagSession · a tag on the session</text>
  <rect x="600" y="408" width="480" height="120" rx="9" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.3"/>
  <text x="616" y="432" font-size="10.5" font-weight="700" fill="#5f6b7a">OUR CONTROL PLANE</text>
  <text x="616" y="452" font-size="9" fill="#666">registry · deployer · identity · chat</text>
  <text x="616" y="468" font-size="8.5" fill="#999">unchanged · still no content</text>
  <use href="#key" x="980" y="456" color="#7b5cb8"/>
  <use href="#wave-t" x="1040" y="456"/>
  <text x="616" y="504" font-size="9" font-weight="700" fill="#a97e26">the wake carries your name, nothing else</text>
  <text x="616" y="560" font-size="9.5" fill="#666">what you hold</text>
  <text x="616" y="578" font-size="9" fill="#999">key, queue, cache, pool image</text>
  <text x="616" y="608" font-size="9.5" fill="#666">how you revoke</text>
  <text x="616" y="626" font-size="9" font-weight="700" fill="#a34848">delete the role · the next tick refuses</text>
  <use href="#cross" x="900" y="622"/>

  <!-- ============ PANEL 3 ============ -->
  <rect x="1120" y="84" width="520" height="600" rx="12" fill="#fff" stroke="#c9962e" stroke-width="1.6"/>
  <text x="1140" y="112" font-size="12" font-weight="700" fill="#a97e26">TIER 3 · STORES AND COMPUTE</text>
  <text x="1140" y="130" font-size="9" fill="#999">the same role, and a stack we apply</text>
  <rect x="1140" y="146" width="480" height="240" rx="9" fill="#fffdf6" stroke="#c9962e" stroke-width="2"/>
  <text x="1156" y="170" font-size="10.5" font-weight="700" fill="#a97e26">YOUR AWS ACCOUNT</text>
  <use href="#lam" x="1210" y="212" color="#c9962e"/>
  <text x="1210" y="238" font-size="9" fill="#666" text-anchor="middle">receiver</text>
  <use href="#lam" x="1330" y="212" color="#c9962e"/>
  <text x="1330" y="238" font-size="9" fill="#666" text-anchor="middle">dispatcher</text>
  <use href="#browser" x="1450" y="212" color="#c9962e"/>
  <text x="1450" y="238" font-size="9" fill="#666" text-anchor="middle">page and tools</text>
  <use href="#gear" x="1560" y="212" color="#c9962e"/>
  <text x="1560" y="238" font-size="9" fill="#666" text-anchor="middle">scheduler</text>
  <use href="#tbl" x="1210" y="300" color="#c9962e"/>
  <text x="1210" y="324" font-size="9" fill="#666" text-anchor="middle">your queue</text>
  <use href="#cyl" x="1330" y="298"/>
  <text x="1330" y="324" font-size="9" fill="#666" text-anchor="middle">warm cache</text>
  <use href="#key" x="1450" y="300" color="#c9962e"/>
  <text x="1450" y="324" font-size="9" fill="#666" text-anchor="middle">your key</text>
  <use href="#cube" x="1560" y="300" color="#c9962e"/>
  <text x="1560" y="324" font-size="9" fill="#666" text-anchor="middle">pool host</text>
  <text x="1156" y="360" font-size="8.5" fill="#a97e26">your quota, your bill</text>
  <rect x="1140" y="408" width="480" height="120" rx="9" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.3"/>
  <text x="1156" y="432" font-size="10.5" font-weight="700" fill="#5f6b7a">OUR CONTROL PLANE</text>
  <text x="1156" y="452" font-size="9" fill="#666">registry · deployer · identity · chat</text>
  <text x="1156" y="468" font-size="8.5" fill="#999">the same four, and the only ones</text>
  <use href="#key" x="1520" y="456" color="#7b5cb8"/>
  <use href="#wave-t" x="1580" y="456"/>
  <path d="M 1600 404 C 1602 388, 1600 366, 1598 344" fill="none" stroke="#7b5cb8" stroke-width="2.4" stroke-dasharray="8 3 2 3" marker-end="url(#mP)"/>
  <text x="1156" y="504" font-size="9" font-weight="700" fill="#5a3f95">a stack applied through your role</text>
  <text x="1156" y="560" font-size="9.5" fill="#666">what you hold</text>
  <text x="1156" y="578" font-size="9" fill="#999">every machine, and the bill for all of it</text>
  <text x="1156" y="608" font-size="9.5" fill="#666">how you revoke</text>
  <text x="1156" y="626" font-size="9" font-weight="700" fill="#a34848">delete the role · nothing deploys</text>
  <use href="#cross" x="1470" y="622"/>

  <!-- movement between panels -->
  <path d="M 548 300 C 566 306, 578 312, 594 316" fill="none" stroke="#c9962e" stroke-width="2.6" marker-end="url(#mA)"/>
  <path d="M 1086 198 C 1100 194, 1116 190, 1132 190" fill="none" stroke="#4a7fb5" stroke-width="2.6" marker-end="url(#mB)"/>
  <path d="M 320 470 C 620 700, 900 700, 1180 500" fill="none" stroke="#8a8a86" stroke-width="2.2" stroke-dasharray="2 5"/>
  <text x="760" y="700" font-size="10" font-weight="700" fill="#5f6b7a" text-anchor="middle">the control plane never moves</text>

  <!-- legend -->
  <rect x="40" y="716" width="1600" height="100" rx="10" fill="#fafafa" stroke="#d5d5d0"/>
  <g font-size="10" fill="#555">
    <line x1="60" y1="742" x2="100" y2="742" stroke="#4a7fb5" stroke-width="3"/><text x="108" y="746">the machinery we run</text>
    <line x1="270" y1="742" x2="310" y2="742" stroke="#c9962e" stroke-width="3"/><text x="318" y="746">your stores under your key</text>
    <line x1="520" y1="742" x2="560" y2="742" stroke="#2e9e5b" stroke-width="3"/><text x="568" y="746">GitHub and code</text>
    <line x1="720" y1="742" x2="760" y2="742" stroke="#7b5cb8" stroke-width="3" stroke-dasharray="8 3 2 3"/><text x="768" y="746">identity · a role assumed</text>
    <use href="#cross" x="960" y="742"/><text x="978" y="746">the one refusal</text>
    <line x1="1110" y1="742" x2="1150" y2="742" stroke="#2b8a8a" stroke-width="3"/><text x="1158" y="746">chat</text>
    <line x1="1240" y1="742" x2="1280" y2="742" stroke="#8a8a86" stroke-width="3"/><text x="1288" y="746">people, places, accounts</text>
  </g>
  <g font-size="10.5" fill="#333">
    <text x="60" y="776">a tier is a binding named in the manifest and never a second machinery: the same binary, the same tick, the same queue rule in all three panels</text>
    <text x="60" y="796">stores only keeps our compute and your key; stores and compute keeps only the registry, the deployer, identity and the chat application on our side</text>
  </g>
</svg>
