<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 960"
     font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a86"/></marker>
    <marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c05b5b"/></marker>
    <marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9962e"/></marker>
    <marker id="mP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b5cb8"/></marker>
    <marker id="mT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b8a8a"/></marker>
    <g id="gear"> <circle r="9" fill="#fff" stroke="currentColor" stroke-width="2.4" /> <circle r="3" fill="currentColor" /> <g stroke="currentColor" stroke-width="2.4"> <line y1="-9" y2="-13.5" /><line y1="9" y2="13.5" /> <line x1="-9" x2="-13.5" /><line x1="9" x2="13.5" /> <line x1="-6.4" y1="-6.4" x2="-9.5" y2="-9.5" /><line x1="6.4" y1="6.4" x2="9.5" y2="9.5" /> <line x1="-6.4" y1="6.4" x2="-9.5" y2="9.5" /><line x1="6.4" y1="-6.4" x2="9.5" y2="-9.5" /> </g> </g>
    <g id="repo"> <rect x="-26" y="-18" width="52" height="36" rx="7" fill="#fff" stroke="currentColor" stroke-width="2" /> <circle cx="-9" cy="8" r="3.2" fill="currentColor" /> <circle cx="9" cy="-8" r="3.2" fill="currentColor" /> <path d="M -9 8 v-8 a 8 8 0 0 1 8 -8 h 1" fill="none" stroke="currentColor" stroke-width="2" /> </g>
    <g id="person"> <circle cy="-6" r="4" fill="#fff" stroke="currentColor" stroke-width="1.8" /> <path d="M -7 8 a 7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="1.8" /> </g>
    <g id="browser"> <rect x="-22" y="-14" width="44" height="28" rx="4" fill="#fff" stroke="currentColor" stroke-width="2" /> <line x1="-22" y1="-6" x2="22" y2="-6" stroke="currentColor" stroke-width="2" /> <circle cx="-16" cy="-10" r="1.6" fill="currentColor" /><circle cx="-11" cy="-10" r="1.6" fill="currentColor" /> </g>
    <g id="marker"> <circle r="7" fill="#fff" stroke="currentColor" stroke-width="2.2" /> <circle r="2.6" fill="currentColor" /> </g>
    <g id="cloud" fill="#fff" stroke="currentColor" stroke-width="1.8"> <path d="M -14 8 a 7 7 0 0 1 1 -14 a 9 9 0 0 1 17 -3 a 7 7 0 0 1 10 6 a 6 6 0 0 1 -2 11 z" /> </g>
    <g id="bot"> <rect x="-11" y="-9" width="22" height="18" rx="4" fill="#fff" stroke="currentColor" stroke-width="1.8" /> <circle cx="-4" cy="-2" r="1.8" fill="currentColor" /><circle cx="4" cy="-2" r="1.8" fill="currentColor" /> <line x1="-4" y1="4" x2="4" y2="4" stroke="currentColor" stroke-width="1.6" /> <line x1="0" y1="-9" x2="0" y2="-14" stroke="currentColor" stroke-width="1.8" /> <circle cy="-15" r="1.8" fill="currentColor" /> </g>
  </defs>
  <rect width="1800" height="960" fill="#fff"/>
  <text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">Flywheel next — dispatch, conceptual: four jobs between the operator's chat and the webhooks on one side and the state and blueprints repositories on the other</text>
  <text x="40" y="57" font-size="12" fill="#666">presenter · interpreter · capture endpoint · triage — the interpreter serves chat alone (216a) · an adapter on the operator's laptop writes captures without dispatch</text>

  <!-- LEFT · the operator's chat -->
  <rect x="60" y="96" width="280" height="302" rx="10" fill="#fbeeee" stroke="#c05b5b" stroke-width="1.4"/>
  <text x="76" y="118" font-size="12" font-weight="700" fill="#a34848">THE OPERATOR'S CHAT</text>
  <use href="#person" x="130" y="184" color="#c05b5b"/>
  <text x="130" y="212" font-size="9.5" fill="#666" text-anchor="middle">operator · phone</text>
  <use href="#bot" x="256" y="186" color="#2b8a8a"/>
  <text x="256" y="212" font-size="9.5" fill="#666" text-anchor="middle">the bot · its own identity</text>
  <text x="200" y="262" font-size="10" fill="#666" text-anchor="middle">the plan arrives as one message;</text>
  <text x="200" y="278" font-size="10" fill="#666" text-anchor="middle">a reply names a number or says anything</text>
  <text x="200" y="380" font-size="8.5" fill="#999" text-anchor="middle">18 · 148 · 155</text>

  <!-- LEFT · webhooks -->
  <rect x="60" y="420" width="280" height="140" rx="10" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.4"/>
  <text x="76" y="442" font-size="12" font-weight="700" fill="#5f6b7a">WEBHOOKS · cannot write git</text>
  <use href="#cloud" x="200" y="488" color="#8a8a86"/>
  <text x="200" y="516" font-size="9.5" fill="#666" text-anchor="middle">a monitor · a delivery connector · the chat</text>
  <text x="200" y="546" font-size="8.5" fill="#999" text-anchor="middle">112</text>

  <!-- LEFT · edge capture -->
  <rect x="60" y="770" width="280" height="70" rx="10" fill="#fff" stroke="#2b8a8a" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="76" y="792" font-size="11" font-weight="700" fill="#1f6e6e">EDGE CAPTURE · the operator's laptop</text>
  <use href="#person" x="92" y="820" color="#8a8a86"/>
  <text x="110" y="824" font-size="9.5" font-family="monospace" fill="#666">flywheel capture &lt;source&gt;</text>
  <path d="M 340 805 L 1610 805 L 1610 726" fill="none" stroke="#2b8a8a" stroke-width="2.2" marker-end="url(#mT)"/>
  <text x="975" y="797" font-size="9.5" fill="#1f6e6e" text-anchor="middle">captures pushed straight to the blueprints · <tspan font-weight="700" fill="#a34848">✗ never through dispatch</tspan> · 217g</text>

  <!-- DISPATCH frame -->
  <rect x="400" y="70" width="540" height="670" rx="10" fill="#e8f3f3" stroke="#2b8a8a" stroke-width="1.4"/>
  <text x="416" y="88" font-size="11" font-weight="700" fill="#1f6e6e">DISPATCH · four jobs and no more (216)</text>

  <!-- card 1 · presenter -->
  <rect x="420" y="96" width="500" height="140" rx="8" fill="#fff" stroke="#2b8a8a" stroke-width="1.6"/>
  <text x="436" y="122" font-size="13" font-weight="700" fill="#333">presenter</text>
  <use href="#bot" x="890" y="124" color="#2b8a8a"/>
  <text x="436" y="152" font-size="10.5" fill="#666">delivers the plan to the chat when due and records each reply as one response.</text>
  <text x="436" y="222" font-size="8.5" fill="#999">148 · 152–155 · 14 · no model · long-lived only for a socket chat</text>

  <!-- card 2 · interpreter -->
  <rect x="420" y="258" width="500" height="140" rx="8" fill="#fff" stroke="#2e9e5b" stroke-width="1.6"/>
  <text x="436" y="284" font-size="13" font-weight="700" fill="#333">interpreter</text>
  <use href="#gear" x="890" y="282" color="#2e9e5b"/>
  <text x="436" y="314" font-size="10.5" fill="#666">turns one message into one proposed tool call, shown with a confirm control.</text>
  <rect x="436" y="330" width="468" height="38" rx="6" fill="#fbeeee" stroke="#c05b5b" stroke-width="1.2" stroke-dasharray="5 3"/>
  <use href="#browser" x="462" y="349" color="#c05b5b"/>
  <text x="494" y="346" font-size="10" font-weight="700" fill="#a34848">THE PAGE = no model at all (216a)</text>
  <text x="494" y="360" font-size="8.5" fill="#a34848">a control and a command are tool calls · plain text is a capture · no interpreter (19)</text>
  <text x="436" y="388" font-size="8.5" fill="#999">194 · 153 · one bounded model call per message · never guesses a name</text>

  <!-- card 3 · capture endpoint -->
  <rect x="420" y="420" width="500" height="140" rx="8" fill="#fff" stroke="#2b8a8a" stroke-width="1.6"/>
  <text x="436" y="446" font-size="13" font-weight="700" fill="#333">capture endpoint</text>
  <use href="#cloud" x="890" y="446" color="#2b8a8a"/>
  <text x="436" y="476" font-size="10.5" fill="#666">one capture per source event, for callers that cannot write git; twice is once.</text>
  <text x="436" y="546" font-size="8.5" fill="#999">106 · 111 · 112 · no model · one request, one commit</text>

  <!-- card 4 · triage -->
  <rect x="420" y="582" width="500" height="140" rx="8" fill="#fff" stroke="#2e9e5b" stroke-width="1.6"/>
  <text x="436" y="608" font-size="13" font-weight="700" fill="#333">triage</text>
  <use href="#gear" x="890" y="606" color="#2e9e5b"/>
  <text x="436" y="638" font-size="10.5" fill="#666">one bounded session reads a capture's raw material and writes its signals once.</text>
  <text x="436" y="708" font-size="8.5" fill="#999">113 · 115 · a model · a session of A.7, charged per capture · nothing carried over</text>

  <!-- row 1 · state → presenter → chat -->
  <path d="M 1478 166 L 924 166" fill="none" stroke="#8a8a86" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#mN)"/>
  <text x="1200" y="158" font-size="9" fill="#5f6b7a" text-anchor="middle">reads · the plan and the sink's mark (136)</text>
  <path d="M 418 150 L 344 150" fill="none" stroke="#c9962e" stroke-width="2.4" marker-end="url(#mA)"/>
  <text x="380" y="142" font-size="9" fill="#a97e26" text-anchor="middle">the plan</text>
  <path d="M 342 192 L 416 192" fill="none" stroke="#c05b5b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#mR)"/>
  <text x="380" y="208" font-size="9" fill="#a34848" text-anchor="middle">a reply</text>

  <!-- row 2 · chat → interpreter → proposal → confirm → response record → state -->
  <path d="M 342 328 L 416 328" fill="none" stroke="#c05b5b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#mR)"/>
  <text x="380" y="320" font-size="9" fill="#a34848" text-anchor="middle">free text</text>
  <path d="M 922 328 L 958 328" fill="none" stroke="#2b8a8a" stroke-width="2.2" marker-end="url(#mT)"/>
  <rect x="960" y="308" width="160" height="40" rx="20" fill="#fff" stroke="#2b8a8a" stroke-width="1.4"/>
  <text x="1040" y="333" font-size="9.5" font-family="monospace" fill="#1f6e6e" text-anchor="middle">one proposed tool call</text>
  <path d="M 1122 328 L 1148 328" fill="none" stroke="#c05b5b" stroke-width="2" marker-end="url(#mR)"/>
  <rect x="1150" y="308" width="120" height="40" rx="20" fill="#fbeeee" stroke="#c05b5b" stroke-width="1.4"/>
  <use href="#marker" x="1172" y="328" color="#c05b5b"/>
  <text x="1218" y="333" font-size="10" font-weight="700" fill="#a34848" text-anchor="middle">confirm</text>
  <path d="M 1272 328 L 1298 328" fill="none" stroke="#c9962e" stroke-width="2.2" marker-end="url(#mA)"/>
  <rect x="1300" y="308" width="160" height="40" rx="20" fill="#fffdf6" stroke="#c9962e" stroke-width="1.4"/>
  <text x="1380" y="333" font-size="9.5" font-family="monospace" fill="#8a6a1d" text-anchor="middle">response record</text>
  <path d="M 1462 328 L 1478 328" fill="none" stroke="#c9962e" stroke-width="2.2" marker-end="url(#mA)"/>
  <text x="1210" y="292" font-size="9" fill="#5f6b7a" text-anchor="middle">shown · confirmed by the operator · recorded once by the tool (153)</text>

  <!-- row 3 · webhook → endpoint → capture record → blueprints -->
  <path d="M 342 490 L 416 490" fill="none" stroke="#8a8a86" stroke-width="2" marker-end="url(#mN)"/>
  <text x="380" y="482" font-size="9" fill="#5f6b7a" text-anchor="middle">a source event</text>
  <path d="M 922 490 L 998 490" fill="none" stroke="#2b8a8a" stroke-width="2.2" marker-end="url(#mT)"/>
  <text x="960" y="482" font-size="9" fill="#1f6e6e" text-anchor="middle">writes</text>
  <rect x="1000" y="470" width="180" height="40" rx="20" fill="#fff" stroke="#2b8a8a" stroke-width="1.4"/>
  <text x="1090" y="495" font-size="9.5" font-family="monospace" fill="#1f6e6e" text-anchor="middle">capture record</text>
  <path d="M 1182 490 L 1478 490" fill="none" stroke="#2b8a8a" stroke-width="2.2" marker-end="url(#mT)"/>
  <text x="1330" y="482" font-size="9" fill="#1f6e6e" text-anchor="middle">one commit · the same key writes nothing (111)</text>

  <!-- row 4 · capture record → triage → signals → blueprints -->
  <path d="M 1090 512 C 1090 556, 880 540, 880 580" fill="none" stroke="#8a8a86" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#mN)"/>
  <text x="1000" y="574" font-size="9" fill="#5f6b7a" text-anchor="start">reads the capture and its raw material</text>
  <path d="M 922 652 L 998 652" fill="none" stroke="#2b8a8a" stroke-width="2.2" marker-end="url(#mT)"/>
  <text x="960" y="644" font-size="9" fill="#1f6e6e" text-anchor="middle">writes once</text>
  <rect x="1000" y="632" width="180" height="40" rx="20" fill="#fff" stroke="#2e9e5b" stroke-width="1.4"/>
  <text x="1090" y="657" font-size="9.5" font-family="monospace" fill="#1f6e6e" text-anchor="middle">signals</text>
  <path d="M 1182 652 L 1478 652" fill="none" stroke="#2b8a8a" stroke-width="2.2" marker-end="url(#mT)"/>
  <text x="1330" y="644" font-size="9" fill="#1f6e6e" text-anchor="middle">immutable · excerpt and position (113)</text>

  <!-- RIGHT · state -->
  <rect x="1480" y="96" width="260" height="302" rx="10" fill="#fbfbfa" stroke="#8a8a86" stroke-width="1.4"/>
  <text x="1496" y="118" font-size="12" font-weight="700" fill="#5f6b7a">STATE · the control plane</text>
  <use href="#repo" x="1610" y="210" color="#8a8a86"/>
  <text x="1610" y="250" font-size="9.5" fill="#666" text-anchor="middle">decisions · the sink's mark · responses</text>
  <text x="1610" y="380" font-size="8.5" fill="#999" text-anchor="middle">136 · 137</text>

  <!-- RIGHT · blueprints -->
  <rect x="1480" y="420" width="260" height="302" rx="10" fill="#f8f5fc" stroke="#7b5cb8" stroke-width="1.4"/>
  <text x="1496" y="442" font-size="12" font-weight="700" fill="#5a3f95">BLUEPRINTS · the shared line</text>
  <use href="#repo" x="1610" y="540" color="#7b5cb8"/>
  <text x="1610" y="580" font-size="9.5" fill="#666" text-anchor="middle">captures · signals</text>
  <text x="1610" y="594" font-size="8.5" font-family="monospace" fill="#999" text-anchor="middle">flywheel/signals/</text>
  <text x="1610" y="704" font-size="8.5" fill="#999" text-anchor="middle">203 · 111 · 113</text>

  <!-- legend -->
  <rect x="40" y="862" width="1720" height="78" rx="10" fill="#fafafa"/>
  <line x1="60" y1="884" x2="100" y2="884" stroke="#2b8a8a" stroke-width="2.4"/>
  <text x="108" y="888" font-size="10" fill="#333">dispatch · a job's write</text>
  <use href="#gear" transform="translate(280,884) scale(0.8)" color="#2e9e5b"/>
  <text x="298" y="888" font-size="10" fill="#333">a bounded session · per capture or per message</text>
  <line x1="560" y1="884" x2="600" y2="884" stroke="#c9962e" stroke-width="2.4"/>
  <text x="608" y="888" font-size="10" fill="#333">the plan · a response</text>
  <line x1="760" y1="884" x2="800" y2="884" stroke="#c05b5b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="808" y="888" font-size="10" fill="#333">the operator's message</text>
  <use href="#marker" x="980" y="884" color="#c05b5b"/>
  <text x="994" y="888" font-size="10" fill="#333">the operator confirms</text>
  <line x1="1150" y1="884" x2="1190" y2="884" stroke="#8a8a86" stroke-width="1.6" stroke-dasharray="2 5"/>
  <text x="1198" y="888" font-size="10" fill="#333">read</text>
  <line x1="1260" y1="884" x2="1300" y2="884" stroke="#2b8a8a" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="1308" y="888" font-size="10" fill="#333">an adapter's own path, outside dispatch</text>
  <text x="60" y="922" font-size="10.5" fill="#333">three of the four are machinery given a host; triage and the interpreter are sessions of A.7, charged per capture or per message with nothing carried between (217b) · the page runs no model at all; it sends tool calls (216a)</text>
</svg>
