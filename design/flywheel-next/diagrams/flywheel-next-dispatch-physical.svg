<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 860"
     font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9962e"/></marker>
    <g id="browser"> <rect x="-22" y="-14" width="44" height="28" rx="4" fill="#fff" stroke="currentColor" stroke-width="2" /> <line x1="-22" y1="-6" x2="22" y2="-6" stroke="currentColor" stroke-width="2" /> <circle cx="-16" cy="-10" r="1.6" fill="currentColor" /><circle cx="-11" cy="-10" r="1.6" fill="currentColor" /> </g>
    <g id="marker"> <circle r="7" fill="#fff" stroke="currentColor" stroke-width="2.2" /> <circle r="2.6" fill="currentColor" /> </g>
    <g id="cube" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"> <path d="M -16 -8 L 0 -17 L 16 -8 L 16 10 L 0 19 L -16 10 Z" fill="#fff" /> <path d="M -16 -8 L 0 1 L 16 -8 M 0 1 L 0 19" fill="none" /> </g>
    <g id="cloud" fill="#fff" stroke="currentColor" stroke-width="1.8"> <path d="M -14 8 a 7 7 0 0 1 1 -14 a 9 9 0 0 1 17 -3 a 7 7 0 0 1 10 6 a 6 6 0 0 1 -2 11 z" /> </g>
    <g id="yes"> <rect x="-46" y="-14" width="92" height="28" rx="14" fill="#2b8a8a"/> </g>
    <g id="no"> <rect x="-46" y="-14" width="92" height="28" rx="14" fill="#fff" stroke="#c9c9c5" stroke-width="1.2" stroke-dasharray="4 3"/> </g>
    <g id="part"> <rect x="-46" y="-14" width="92" height="28" rx="14" fill="#fffdf6" stroke="#c9962e" stroke-width="1.4"/> </g>
  </defs>
  <rect width="1800" height="860" fill="#fff"/>
  <text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">Flywheel next — dispatch, physical: three placements of one declaration, the tiers as bindings, and the ladder as a setup surface</text>
  <text x="40" y="57" font-size="12" fill="#666">what differs is model access, secrets, the network route and what you get · a chat adapter, a sign-in, a router and a runner are code shipped once, chosen as data · the next rung is an offer, never a decision in the count</text>

  <!-- PLACEMENT · browser interpreter only -->
  <rect x="60" y="80" width="430" height="380" rx="10" fill="#fff" stroke="#2b8a8a" stroke-width="1.6"/>
  <use href="#browser" x="458" y="106" color="#2b8a8a"/>
  <text x="76" y="108" font-size="12.5" font-weight="700" fill="#333">browser interpreter only</text>
  <text x="76" y="126" font-size="9.5" fill="#999">get started · the fourth job in the page, nothing else (216a)</text>
  <text x="76" y="166" font-size="9.5" font-weight="700" fill="#1f6e6e">model access</text>
  <text x="178" y="166" font-size="9.5" fill="#666">a model shipped with the page, run in the browser</text>
  <text x="178" y="180" font-size="9.5" fill="#666">no text leaves the private network</text>
  <text x="76" y="216" font-size="9.5" font-weight="700" fill="#1f6e6e">secrets</text>
  <text x="178" y="216" font-size="9.5" fill="#666">none · no API key exists</text>
  <text x="76" y="266" font-size="9.5" font-weight="700" fill="#1f6e6e">network route</text>
  <text x="178" y="266" font-size="9.5" fill="#666">the host serves the page and the tools over the tailnet</text>
  <text x="178" y="280" font-size="9.5" fill="#666">the phone runs the model</text>
  <text x="76" y="322" font-size="9.5" font-weight="700" fill="#1f6e6e">what you get</text>
  <use href="#yes" x="122" y="354"/><text x="122" y="358" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">page</text>
  <use href="#no" x="224" y="354"/><text x="224" y="358" font-size="10" fill="#aaa" text-anchor="middle">chat</text>
  <use href="#no" x="326" y="354"/><text x="326" y="358" font-size="10" fill="#aaa" text-anchor="middle">endpoint</text>
  <use href="#no" x="428" y="354"/><text x="428" y="358" font-size="10" fill="#aaa" text-anchor="middle">triage</text>
  <text x="326" y="384" font-size="8.5" fill="#999" text-anchor="middle">the capture box is the tool</text>
  <text x="428" y="384" font-size="8.5" fill="#999" text-anchor="middle">captures wait</text>
  <text x="76" y="418" font-size="9.5" font-weight="700" fill="#a34848">gives up chat, webhooks and transcripts</text>
  <text x="76" y="432" font-size="8.5" fill="#666">every decision still answerable by control and number</text>
  <text x="76" y="448" font-size="8.5" fill="#999">19 · 155 · 191 · 216a</text>

  <!-- PLACEMENT · local dispatcher -->
  <rect x="510" y="80" width="430" height="380" rx="10" fill="#fff" stroke="#2b8a8a" stroke-width="1.6"/>
  <use href="#cube" x="908" y="108" color="#2b8a8a"/>
  <text x="526" y="108" font-size="12.5" font-weight="700" fill="#333">local dispatcher</text>
  <text x="526" y="126" font-size="9.5" fill="#999">a laptop, or a pane in the herdr machinery session (174)</text>
  <text x="526" y="166" font-size="9.5" font-weight="700" fill="#1f6e6e">model access</text>
  <text x="628" y="166" font-size="9.5" fill="#666">a pane under the operator's login for triage;</text>
  <text x="628" y="180" font-size="9.5" fill="#666">in-process with a key for the interpreter</text>
  <text x="526" y="216" font-size="9.5" font-weight="700" fill="#1f6e6e">secrets</text>
  <text x="628" y="216" font-size="9.5" fill="#666">the keychain, or a sealed file under the root</text>
  <text x="628" y="230" font-size="9.5" fill="#666">bot token · App key · model key · inbound secrets</text>
  <text x="526" y="266" font-size="9.5" font-weight="700" fill="#1f6e6e">network route</text>
  <text x="628" y="266" font-size="9.5" fill="#666">the machine's tailnet node · the endpoint private</text>
  <text x="628" y="280" font-size="9.5" fill="#666">a funnel for named callers only (46)</text>
  <text x="526" y="322" font-size="9.5" font-weight="700" fill="#1f6e6e">what you get</text>
  <use href="#yes" x="572" y="354"/><text x="572" y="358" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">page</text>
  <use href="#part" x="674" y="354"/><text x="674" y="358" font-size="10" font-weight="700" fill="#8a6a1d" text-anchor="middle">chat</text>
  <use href="#part" x="776" y="354"/><text x="776" y="358" font-size="10" font-weight="700" fill="#8a6a1d" text-anchor="middle">endpoint</text>
  <use href="#yes" x="878" y="354"/><text x="878" y="358" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">triage</text>
  <text x="674" y="384" font-size="8.5" fill="#a97e26" text-anchor="middle">while the machine is awake</text>
  <text x="776" y="384" font-size="8.5" fill="#a97e26" text-anchor="middle">private network only</text>
  <text x="526" y="418" font-size="9.5" font-weight="700" fill="#a34848">gives up the plan in chat while the machine sleeps</text>
  <text x="526" y="432" font-size="8.5" fill="#666">the sink lease then sits with the pin until it wakes</text>
  <text x="526" y="448" font-size="8.5" fill="#999">46 · 174 · 207</text>

  <!-- PLACEMENT · cloud dispatcher -->
  <rect x="960" y="80" width="430" height="380" rx="10" fill="#fff" stroke="#2b8a8a" stroke-width="1.6"/>
  <use href="#cloud" x="1358" y="108" color="#2b8a8a"/>
  <text x="976" y="108" font-size="12.5" font-weight="700" fill="#333">cloud dispatcher</text>
  <text x="976" y="126" font-size="9.5" fill="#999">a long-lived container · Fly, Cloud Run, ECS, a VM, flywheel-cloud</text>
  <text x="976" y="166" font-size="9.5" font-weight="700" fill="#1f6e6e">model access</text>
  <text x="1078" y="166" font-size="9.5" fill="#666">in-process with a key or the runtime's role;</text>
  <text x="1078" y="180" font-size="9.5" fill="#666">a platform session when its sandbox reaches the tailnet</text>
  <text x="976" y="216" font-size="9.5" font-weight="700" fill="#1f6e6e">secrets</text>
  <text x="1078" y="216" font-size="9.5" fill="#666">the platform's secret store, injected at start</text>
  <text x="1078" y="230" font-size="9.5" fill="#666">never a key that reaches a host (207)</text>
  <text x="976" y="266" font-size="9.5" font-weight="700" fill="#1f6e6e">network route</text>
  <text x="1078" y="266" font-size="9.5" fill="#666">a tailnet node in the container, or the router's ingress</text>
  <text x="1078" y="280" font-size="9.5" fill="#666">the endpoint public for named callers (191)</text>
  <text x="976" y="322" font-size="9.5" font-weight="700" fill="#1f6e6e">what you get</text>
  <use href="#yes" x="1022" y="354"/><text x="1022" y="358" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">page</text>
  <use href="#yes" x="1124" y="354"/><text x="1124" y="358" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">chat</text>
  <use href="#yes" x="1226" y="354"/><text x="1226" y="358" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">endpoint</text>
  <use href="#yes" x="1328" y="354"/><text x="1328" y="358" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">triage</text>
  <text x="1124" y="384" font-size="8.5" fill="#999" text-anchor="middle">the bot, always</text>
  <text x="976" y="418" font-size="9.5" font-weight="700" fill="#1f6e6e">gives up nothing of the four · costs one small always-on container</text>
  <text x="976" y="432" font-size="8.5" fill="#666">AgentCore and managed agents: triage runners only, never the dispatcher</text>
  <text x="976" y="448" font-size="8.5" fill="#999">191 · 207 · 217i</text>

  <!-- TIERS -->
  <rect x="60" y="490" width="1330" height="230" rx="10" fill="#fff" stroke="#c9962e" stroke-width="1.4"/>
  <text x="76" y="512" font-size="12" font-weight="700" fill="#8a6a1d">TIERS · four bindings, each code shipped once, chosen as data (217j)</text>
  <text x="80" y="540" font-size="9" font-weight="700" fill="#8a6a1d">tier</text>
  <text x="210" y="540" font-size="9" font-weight="700" fill="#8a6a1d">chat adapter</text>
  <text x="470" y="540" font-size="9" font-weight="700" fill="#8a6a1d">sign-in</text>
  <text x="820" y="540" font-size="9" font-weight="700" fill="#8a6a1d">router</text>
  <text x="1090" y="540" font-size="9" font-weight="700" fill="#8a6a1d">runner</text>
  <line x1="76" y1="548" x2="1374" y2="548" stroke="#c9962e" stroke-width="1" opacity="0.5"/>
  <text x="80" y="576" font-size="10.5" font-weight="700" fill="#333">hobbyist</text>
  <text x="210" y="576" font-size="9.5" fill="#666">Discord</text>
  <text x="470" y="576" font-size="9.5" fill="#666">the tailnet is the identity, no login · or a social sign-in</text>
  <text x="820" y="576" font-size="9.5" fill="#666">the tailnet router</text>
  <text x="1090" y="576" font-size="9.5" fill="#666">a pane under the operator's login · no key</text>
  <line x1="80" y1="592" x2="1374" y2="592" stroke="#c9962e" stroke-width="0.8" opacity="0.35"/>
  <text x="80" y="620" font-size="10.5" font-weight="700" fill="#333">SMB</text>
  <text x="210" y="620" font-size="9.5" fill="#666">Discord or Slack</text>
  <text x="470" y="620" font-size="9.5" fill="#666">GitHub SSO · membership in the organization is the check</text>
  <text x="820" y="620" font-size="9.5" fill="#666">the platform router (flywheel-cloud)</text>
  <text x="1090" y="620" font-size="9.5" fill="#666">in-process with a key or a cloud role</text>
  <line x1="80" y1="636" x2="1374" y2="636" stroke="#c9962e" stroke-width="0.8" opacity="0.35"/>
  <text x="80" y="664" font-size="10.5" font-weight="700" fill="#333">enterprise</text>
  <text x="210" y="664" font-size="9.5" fill="#666">Slack · Teams · Webex</text>
  <text x="470" y="664" font-size="9.5" fill="#666">SSO through the identity provider (OIDC or SAML)</text>
  <text x="820" y="664" font-size="9.5" fill="#666">the platform router's ingress fronts it</text>
  <text x="1090" y="664" font-size="9.5" fill="#666">in-process under the role, or a platform session</text>
  <text x="76" y="702" font-size="8.5" fill="#999">every response is recorded with who and when at every tier (153) · no tier changes a machine, an atom or a profile operation · 119 · 139 · 167 · 207</text>

  <!-- SETUP · the ladder -->
  <rect x="1420" y="80" width="320" height="640" rx="10" fill="#fffdf6" stroke="#c9962e" stroke-width="1.6"/>
  <text x="1436" y="108" font-size="12.5" font-weight="700" fill="#8a6a1d">SETUP · the ladder</text>
  <text x="1436" y="126" font-size="9.5" fill="#999">a separate surface · its offers never enter the count (217k)</text>

  <rect x="1470" y="150" width="220" height="34" rx="17" fill="#fff" stroke="#2b8a8a" stroke-width="1.4"/>
  <text x="1580" y="172" font-size="9.5" font-family="monospace" fill="#1f6e6e" text-anchor="middle">browser interpreter only</text>
  <path d="M 1500 186 L 1500 298" fill="none" stroke="#c9962e" stroke-width="2.4" marker-end="url(#mA)"/>
  <use href="#marker" x="1500" y="242" color="#c05b5b"/>
  <text x="1516" y="236" font-size="10" font-weight="700" fill="#333">offer</text>
  <text x="1516" y="250" font-size="8.5" fill="#666">never in the operator's decision count</text>
  <text x="1516" y="263" font-size="8.5" fill="#666">yes runs the install effects · a proof (204)</text>

  <rect x="1470" y="300" width="220" height="34" rx="17" fill="#fff" stroke="#2b8a8a" stroke-width="1.4"/>
  <text x="1580" y="322" font-size="9.5" font-family="monospace" fill="#1f6e6e" text-anchor="middle">local dispatcher</text>
  <path d="M 1500 336 L 1500 448" fill="none" stroke="#c9962e" stroke-width="2.4" marker-end="url(#mA)"/>
  <use href="#marker" x="1500" y="392" color="#c05b5b"/>
  <text x="1516" y="386" font-size="10" font-weight="700" fill="#333">offer</text>
  <text x="1516" y="400" font-size="8.5" fill="#666">yes runs the install effects</text>
  <text x="1516" y="413" font-size="8.5" fill="#666">a missing secret waits under attention (207)</text>

  <rect x="1470" y="450" width="220" height="34" rx="17" fill="#fff" stroke="#2b8a8a" stroke-width="1.4"/>
  <text x="1580" y="472" font-size="9.5" font-family="monospace" fill="#1f6e6e" text-anchor="middle">cloud dispatcher</text>

  <text x="1436" y="520" font-size="8.5" fill="#666">flywheel init records where the dispatcher is placed;</text>
  <text x="1436" y="533" font-size="8.5" fill="#666">upgrading it is the binary on that placement (208)</text>

  <line x1="1436" y1="556" x2="1724" y2="556" stroke="#c9962e" stroke-width="1" opacity="0.5"/>
  <rect x="1470" y="580" width="220" height="34" rx="17" fill="#fff" stroke="#c05b5b" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="1580" y="602" font-size="9.5" font-family="monospace" fill="#a34848" text-anchor="middle">Vercel functions</text>
  <line x1="1462" y1="614" x2="1698" y2="580" stroke="#c05b5b" stroke-width="2.6"/>
  <text x="1580" y="640" font-size="10" font-weight="700" fill="#a34848" text-anchor="middle">not a placement</text>
  <text x="1580" y="654" font-size="8.5" fill="#a34848" text-anchor="middle">no socket, clock or private route (217i)</text>
  <text x="1436" y="704" font-size="8.5" fill="#999">141 · 204 · 207 · 208 · 217i · 217k</text>

  <!-- legend -->
  <rect x="40" y="742" width="1720" height="96" rx="10" fill="#fafafa"/>
  <use href="#yes" transform="translate(96,764) scale(0.6)"/>
  <text x="130" y="768" font-size="10" fill="#333">you get it</text>
  <use href="#part" transform="translate(246,764) scale(0.6)"/>
  <text x="280" y="768" font-size="10" fill="#333">with a condition</text>
  <use href="#no" transform="translate(426,764) scale(0.6)"/>
  <text x="460" y="768" font-size="10" fill="#333">not on this rung</text>
  <line x1="600" y1="764" x2="640" y2="764" stroke="#c9962e" stroke-width="2.4"/>
  <text x="648" y="768" font-size="10" fill="#333">the next rung · an offer</text>
  <use href="#marker" x="820" y="764" color="#c05b5b"/>
  <text x="834" y="768" font-size="10" fill="#333">an offer appears on the setup surface, not in the plan's count</text>
  <text x="60" y="800" font-size="10.5" fill="#333">one declaration on every placement; what differs is placement, the secret store, the network route and model access, all named in the manifest (217i) · a placement that cannot hold a socket, a clock and a private route is not a placement for the presenter or the endpoint</text>
  <text x="60" y="820" font-size="10.5" fill="#333">the tiers are bindings: an adapter, a sign-in, a router and a runner are code shipped once, and which an organization uses is data (217j) · installed from the manifest, never by hand; the secrets are placed by the operator and wait under attention until they are (217k, 207)</text>
</svg>
