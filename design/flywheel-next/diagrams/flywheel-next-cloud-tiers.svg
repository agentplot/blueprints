<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1070"
     font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mS" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a86"/></marker>
    <marker id="mK" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9962e"/></marker>
    <g id="repo"> <rect x="-15" y="-11" width="30" height="22" rx="4" fill="#fff" stroke="currentColor" stroke-width="1.8" /> <circle cx="-5" cy="5" r="2.2" fill="currentColor" /> <circle cx="5" cy="-5" r="2.2" fill="currentColor" /> <path d="M -5 5 v-5 a 5 5 0 0 1 5 -5 h 1" fill="none" stroke="currentColor" stroke-width="1.8" /> </g>
    <g id="laptop" stroke="currentColor" stroke-width="1.8" fill="#fff"> <rect x="-14" y="-11" width="28" height="18" rx="2.5"/> <path d="M -19 10 L 19 10 L 15 7 L -15 7 Z" stroke-linejoin="round"/> </g>
    <g id="chat" stroke="currentColor" stroke-width="1.8" fill="#fff" stroke-linejoin="round"> <path d="M -14 -10 h 28 a 3 3 0 0 1 3 3 v 12 a 3 3 0 0 1 -3 3 h -18 l -8 6 v -6 h -2 a 3 3 0 0 1 -3 -3 v -12 a 3 3 0 0 1 3 -3 z"/> </g>
    <g id="gate" stroke="currentColor" stroke-width="1.8" fill="#fff"> <path d="M 0 -13 L 13 -6 L 13 8 L 0 15 L -13 8 L -13 -6 Z" stroke-linejoin="round"/> <path d="M -6 1 h 12 M -6 -4 h 12" stroke-width="1.5"/> </g>
    <g id="fn" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linejoin="round"> <rect x="-14" y="-12" width="28" height="24" rx="3" fill="#fff"/> <path d="M -7 -6 L 1 6 M 7 -6 L -1 6" stroke-linecap="round"/> </g>
    <g id="cyl"> <path d="M -22 -10 L -22 11 A 22 7 0 0 0 22 11 L 22 -10" fill="#fff" stroke="currentColor" stroke-width="1.7" /> <ellipse cx="0" cy="-10" rx="22" ry="7" fill="#eef2f6" stroke="currentColor" stroke-width="1.7" /> </g>
    <g id="clock"> <circle r="12" fill="#fff" stroke="currentColor" stroke-width="1.9" /> <path d="M 0 -7 V 0 H 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /> </g>
    <g id="cube" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"> <path d="M -14 -7 L 0 -15 L 14 -7 L 14 9 L 0 17 L -14 9 Z" fill="#fff" /> <path d="M -14 -7 L 0 1 L 14 -7 M 0 1 L 0 17" fill="none" /> </g>
    <g id="key" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"> <circle cx="-7" cy="0" r="6"/> <path d="M -1 0 H 13 M 8 0 v5 M 13 0 v6"/> </g>
  </defs>
  <rect width="1800" height="1070" fill="#fff"/>
  <text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">Flywheel hosted — the physical design: one organization, drawn as the machines that exist and what each one holds</text>
  <text x="40" y="57" font-size="12" fill="#666">nothing of the machinery is a process that stays running: a tick is one function invocation that assumes a role tagged with the organization, works, and exits · a self-managed host is the same binary on your own computer with none of the right-hand side</text>

  <!-- ============ YOUR SIDE ============ -->
  <rect x="60" y="84" width="1680" height="212" rx="10" fill="#fff" stroke="#2b8a8a" stroke-width="1.6"/>
  <text x="76" y="106" font-size="11.5" font-weight="700" fill="#1f6e6e">YOUR SIDE</text>

  <rect x="120" y="126" width="400" height="150" rx="8" fill="#fff" stroke="#2b8a8a" stroke-width="1.4"/>
  <use href="#repo" x="156" y="156" color="#2b8a8a"/>
  <text x="186" y="152" font-size="12.5" font-weight="700" fill="#333">GitHub</text>
  <text x="186" y="167" font-size="9" fill="#999">your account, your repositories</text>
  <text x="140" y="196" font-size="9.5" fill="#666">the state repository · the blueprints repository · your code repositories</text>
  <text x="140" y="214" font-size="9.5" font-weight="700" fill="#1f6e6e">plaintext, yours — under GitHub's own encryption, as every repository is</text>
  <text x="140" y="238" font-size="9" fill="#999">the App is installed on your organization and its token is scoped to the listed repositories</text>
  <text x="140" y="256" font-size="9" fill="#999">the state repository is the machinery's alone; nobody reviews its diffs</text>

  <rect x="660" y="126" width="400" height="150" rx="8" fill="#fff" stroke="#2b8a8a" stroke-width="1.4"/>
  <use href="#laptop" x="696" y="156" color="#2b8a8a"/>
  <text x="726" y="152" font-size="12.5" font-weight="700" fill="#333">your laptop host</text>
  <text x="726" y="167" font-size="9" fill="#999">optional · intermittent</text>
  <text x="680" y="196" font-size="9.5" fill="#666">the page on localhost · device-flow sign-in · local adapters · worktrees</text>
  <text x="680" y="214" font-size="9.5" fill="#666">at tier 1 this is still the machine that builds</text>
  <text x="680" y="238" font-size="9" fill="#999">closed past its stale window it shows away with since-when and no attention line:</text>
  <text x="680" y="256" font-size="9" fill="#999">leases stand, sessions are neither stalled nor lost, and their clocks pause</text>

  <rect x="1200" y="126" width="400" height="150" rx="8" fill="#fff" stroke="#2b8a8a" stroke-width="1.4"/>
  <use href="#chat" x="1236" y="156" color="#2b8a8a"/>
  <text x="1266" y="152" font-size="12.5" font-weight="700" fill="#333">Slack or Discord</text>
  <text x="1266" y="167" font-size="9" fill="#999">your workspace, our bot invited</text>
  <text x="1220" y="196" font-size="9.5" fill="#666">the service's Slack app and Discord app, installed into your workspace</text>
  <text x="1220" y="214" font-size="9.5" font-weight="700" fill="#8a6a1d">the one shared component — and it carries only plan text</text>
  <text x="1220" y="238" font-size="9" fill="#999">a stolen bot token buys the ability to post plan lines:</text>
  <text x="1220" y="256" font-size="9" fill="#999">no repository access, no key access</text>

  <!-- ============ SERVICE ACCOUNT ============ -->
  <rect x="60" y="320" width="1680" height="520" rx="10" fill="#fdfcf8" stroke="#4a7fb5" stroke-width="1.6"/>
  <text x="76" y="342" font-size="11.5" font-weight="700" fill="#3a6a99">SERVICE ACCOUNT · one set of these per organization</text>

  <!-- capture receiver -->
  <rect x="700" y="366" width="380" height="108" rx="8" fill="#fff" stroke="#4a7fb5" stroke-width="1.4"/>
  <use href="#gate" x="734" y="396" color="#4a7fb5"/>
  <text x="762" y="392" font-size="12.5" font-weight="700" fill="#333">capture receiver</text>
  <text x="762" y="407" font-size="9" fill="#999">a managed service, not a process of ours</text>
  <text x="716" y="432" font-size="9.5" fill="#666">API Gateway integrated straight into one SQS queue per organization</text>
  <text x="716" y="450" font-size="9.5" font-weight="700" fill="#8a6a1d">encrypted under the organization key · no compute</text>
  <text x="716" y="466" font-size="9" fill="#999">webhook and chat payloads, transient</text>

  <!-- dispatcher -->
  <rect x="700" y="540" width="380" height="190" rx="8" fill="#fff" stroke="#4a7fb5" stroke-width="2"/>
  <use href="#fn" x="734" y="570" color="#4a7fb5"/>
  <text x="762" y="566" font-size="12.5" font-weight="700" fill="#333">dispatcher function</text>
  <text x="762" y="581" font-size="9" fill="#999">one Lambda function per tier · the cloud agent</text>
  <text x="716" y="608" font-size="9.5" fill="#666">it assumes the tier role with a session tag naming the organization</text>
  <text x="716" y="626" font-size="9.5" font-weight="700" fill="#3a6a99">every key and cache object carries its organization tag, so AWS allows</text>
  <text x="716" y="642" font-size="9.5" font-weight="700" fill="#3a6a99">the call only when the two tags match</text>
  <text x="716" y="664" font-size="9.5" fill="#666">runs one tick, wipes its scratch directory, and exits</text>
  <text x="716" y="682" font-size="9" fill="#999">nothing between runs · in a run, one organization's plaintext in memory and scratch</text>
  <text x="716" y="700" font-size="9" fill="#999">woken by the queue, by the scheduler at the due time, or by a page request</text>
  <text x="716" y="718" font-size="9" fill="#999">if the push loses the compare-and-swap it refetches and tries once more</text>

  <!-- scheduler -->
  <rect x="180" y="545" width="340" height="120" rx="8" fill="#fff" stroke="#4a7fb5" stroke-width="1.4"/>
  <use href="#clock" x="214" y="577" color="#4a7fb5"/>
  <text x="242" y="573" font-size="12.5" font-weight="700" fill="#333">scheduler</text>
  <text x="242" y="588" font-size="9" fill="#999">EventBridge Scheduler</text>
  <text x="196" y="614" font-size="9.5" fill="#666">one one-shot entry per organization, written at the end of each tick</text>
  <text x="196" y="632" font-size="9.5" fill="#666">from the machines' own timers · a daily sweep is the backstop</text>
  <text x="196" y="654" font-size="9" fill="#999">it holds the next due time and nothing else · an idle organization has no entry</text>

  <!-- warm cache -->
  <rect x="1180" y="486" width="340" height="118" rx="8" fill="#fff" stroke="#4a7fb5" stroke-width="1.4"/>
  <use href="#cyl" x="1214" y="518" color="#4a7fb5"/>
  <text x="1248" y="512" font-size="12.5" font-weight="700" fill="#333">warm cache</text>
  <text x="1248" y="527" font-size="9" fill="#999">one S3 object per organization · no VPC, no mount</text>
  <text x="1196" y="554" font-size="9.5" font-weight="700" fill="#8a6a1d">a git bundle of two sparse shallow clones, under the organization key</text>
  <text x="1196" y="572" font-size="9.5" fill="#666">state, and blueprints restricted to the manifest, the claims and flywheel/</text>
  <text x="1196" y="590" font-size="9" fill="#a34848">never code, never raw capture material · deleted and re-cloned when idle</text>

  <!-- pool host -->
  <rect x="1180" y="650" width="340" height="168" rx="8" fill="#fff" stroke="#4a7fb5" stroke-width="1.4"/>
  <use href="#cube" x="1214" y="682" color="#4a7fb5"/>
  <text x="1248" y="676" font-size="12.5" font-weight="700" fill="#333">pool host</text>
  <text x="1248" y="691" font-size="9" fill="#999">created from your image when the plan approves work</text>
  <text x="1196" y="718" font-size="9.5" fill="#666">a Lambda MicroVM · 8–32 GB memory, 4–16 vCPU, up to 32 GB of disk</text>
  <text x="1196" y="736" font-size="9.5" fill="#666">no VPC needed, and Docker runs inside it, so devcontainer features work</text>
  <text x="1196" y="754" font-size="9.5" font-weight="700" fill="#3a6a99">one organization · enrols as a host, clones the code it needs, runs the</text>
  <text x="1196" y="770" font-size="9.5" font-weight="700" fill="#3a6a99">session in a worktree, pushes the pull request, and is terminated</text>
  <text x="1196" y="790" font-size="9" fill="#999">triage runs here too, never in the dispatcher · the disk is destroyed at retire</text>
  <text x="1196" y="808" font-size="9" fill="#999">Fargate in a minimal VPC is the fallback past eight hours, without Docker inside</text>

  <!-- KMS key rail -->
  <rect x="1570" y="400" width="160" height="418" rx="8" fill="#fffdf6" stroke="#c9962e" stroke-width="1.6"/>
  <use href="#key" x="1622" y="432" color="#c9962e"/>
  <text x="1650" y="470" font-size="12.5" font-weight="700" fill="#8a6a1d" text-anchor="middle">KMS key</text>
  <text x="1650" y="486" font-size="9" fill="#999" text-anchor="middle">one per organization</text>
  <text x="1584" y="514" font-size="9" fill="#666">a customer-managed key in</text>
  <text x="1584" y="528" font-size="9" fill="#666">the service account, tagged</text>
  <text x="1584" y="542" font-size="9" fill="#666">with the organization</text>
  <text x="1584" y="568" font-size="9" font-weight="700" fill="#8a6a1d">policy: a principal may use</text>
  <text x="1584" y="582" font-size="9" font-weight="700" fill="#8a6a1d">it only when its session tag</text>
  <text x="1584" y="596" font-size="9" font-weight="700" fill="#8a6a1d">equals the key's tag</text>
  <text x="1584" y="614" font-size="9" fill="#999">so no count of roles limits it</text>
  <text x="1584" y="646" font-size="9" fill="#666">it encrypts the queue, the</text>
  <text x="1584" y="660" font-size="9" fill="#666">cache, the pool disk, the logs</text>
  <text x="1584" y="692" font-size="9" fill="#999">on the enterprise tier the key</text>
  <text x="1584" y="706" font-size="9" fill="#999">is in your account and we</text>
  <text x="1584" y="720" font-size="9" fill="#999">hold a grant you can revoke</text>
  <text x="1584" y="752" font-size="9" fill="#999">there is no human path to</text>
  <text x="1584" y="766" font-size="9" fill="#999">the cache: a stolen disk or</text>
  <text x="1584" y="780" font-size="9" fill="#999">snapshot is ciphertext</text>

  <!-- ===== EDGES ===== -->
  <!-- inbound to receiver -->
  <path d="M 320 280 C 400 328, 640 336, 762 362" fill="none" stroke="#8a8a86" stroke-width="2.2" marker-end="url(#mS)"/>
  <text x="560" y="326" font-size="9.5" font-weight="700" fill="#5e5e5a">webhooks</text>
  <path d="M 860 280 C 866 310, 880 336, 886 362" fill="none" stroke="#8a8a86" stroke-width="2.2" marker-end="url(#mS)"/>
  <text x="898" y="326" font-size="9.5" font-weight="700" fill="#5e5e5a">captures</text>
  <path d="M 1360 280 C 1300 330, 1120 340, 1018 362" fill="none" stroke="#8a8a86" stroke-width="2.2" marker-end="url(#mS)"/>
  <text x="1180" y="326" font-size="9.5" font-weight="700" fill="#5e5e5a">interactions</text>

  <!-- receiver to dispatcher -->
  <path d="M 890 478 L 890 536" fill="none" stroke="#8a8a86" stroke-width="2.4" marker-end="url(#mS)"/>
  <text x="900" y="512" font-size="9.5" font-weight="700" fill="#5e5e5a">the queue has items</text>

  <!-- scheduler to dispatcher -->
  <path d="M 524 606 L 696 606" fill="none" stroke="#8a8a86" stroke-width="2.4" marker-end="url(#mS)"/>
  <text x="610" y="598" font-size="9.5" font-weight="700" fill="#5e5e5a" text-anchor="middle">due</text>

  <!-- dispatcher to GitHub, fetch and push -->
  <path d="M 698 600 C 624 552, 602 400, 424 284" fill="none" stroke="#8a8a86" stroke-width="2.4" marker-start="url(#mS)" marker-end="url(#mS)"/>
  <text x="562" y="446" font-size="9.5" font-weight="700" fill="#5e5e5a">fetch · push (CAS)</text>

  <!-- dispatcher to warm cache -->
  <path d="M 1084 556 C 1120 550, 1146 546, 1176 542" fill="none" stroke="#8a8a86" stroke-width="2.4" marker-start="url(#mS)" marker-end="url(#mS)"/>
  <text x="1130" y="528" font-size="9.5" font-weight="700" fill="#5e5e5a" text-anchor="middle">download · upload</text>
  <text x="1130" y="516" font-size="8.5" fill="#999" text-anchor="middle">during the tick</text>

  <!-- dispatcher to pool -->
  <path d="M 1084 694 C 1120 696, 1146 700, 1176 702" fill="none" stroke="#8a8a86" stroke-width="2.4" marker-end="url(#mS)"/>
  <text x="1130" y="686" font-size="9.5" font-weight="700" fill="#5e5e5a" text-anchor="middle">approved work: provision</text>

  <!-- dispatcher to chat -->
  <path d="M 1060 536 C 1118 500, 1116 382, 1140 320 C 1172 290, 1280 282, 1330 282" fill="none" stroke="#8a8a86" stroke-width="2.4" marker-end="url(#mS)"/>
  <text x="1096" y="466" font-size="9.5" font-weight="700" fill="#5e5e5a">plan lines</text>

  <!-- pool to GitHub -->
  <path d="M 1180 786 C 860 828, 300 830, 150 748 C 104 710, 100 430, 132 360 C 148 320, 166 294, 180 282" fill="none" stroke="#8a8a86" stroke-width="2.2" marker-start="url(#mS)" marker-end="url(#mS)"/>
  <text x="720" y="820" font-size="9.5" font-weight="700" fill="#5e5e5a" text-anchor="middle">clone code · push the pull request</text>

  <!-- key edges -->
  <path d="M 1566 500 C 1548 508, 1536 520, 1524 530" fill="none" stroke="#c9962e" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#mK)"/>
  <text x="1545" y="500" font-size="8.5" font-weight="700" fill="#8a6a1d" text-anchor="middle">unwraps</text>
  <path d="M 1566 706 C 1550 720, 1538 730, 1524 736" fill="none" stroke="#c9962e" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#mK)"/>
  <text x="1545" y="700" font-size="8.5" font-weight="700" fill="#8a6a1d" text-anchor="middle">encrypts</text>
  <path d="M 1566 414 C 1400 356, 1220 350, 1088 394" fill="none" stroke="#c9962e" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#mK)"/>
  <text x="1310" y="346" font-size="9" font-weight="700" fill="#8a6a1d" text-anchor="middle">encrypts the queue</text>

  <!-- ============ TIER STRIP ============ -->
  <rect x="60" y="858" width="1680" height="96" rx="10" fill="#fff" stroke="#c9962e" stroke-width="1.4"/>
  <text x="76" y="878" font-size="10.5" font-weight="700" fill="#8a6a1d">THE FOUR TIERS · what you add, and what exists on our side</text>
  <line x1="482" y1="886" x2="482" y2="946" stroke="#c9962e" stroke-width="1" opacity="0.4"/>
  <line x1="904" y1="886" x2="904" y2="946" stroke="#c9962e" stroke-width="1" opacity="0.4"/>
  <line x1="1326" y1="886" x2="1326" y2="946" stroke="#c9962e" stroke-width="1" opacity="0.4"/>
  <text x="76" y="902" font-size="10.5" font-weight="700" fill="#333">0 · your computer</text>
  <text x="76" y="920" font-size="9" fill="#666">you add nothing — the binary on your laptop, device-flow sign-in</text>
  <text x="76" y="936" font-size="9" font-weight="700" fill="#1f6e6e">on our side: nothing at all</text>
  <text x="498" y="902" font-size="10.5" font-weight="700" fill="#333">1 · cloud agent</text>
  <text x="498" y="920" font-size="9" fill="#666">sign in to the hosted account, invite the bot, install the App on your organization</text>
  <text x="498" y="936" font-size="9" font-weight="700" fill="#3a6a99">receiver queue, a role and key, a cache object, a scheduler entry · no pool: your laptop still builds</text>
  <text x="920" y="902" font-size="10.5" font-weight="700" fill="#333">2 · pools</text>
  <text x="920" y="920" font-size="9" fill="#666">an image and a bound</text>
  <text x="920" y="936" font-size="9" font-weight="700" fill="#3a6a99">tier 1 plus pool hosts on demand</text>
  <text x="1342" y="902" font-size="10.5" font-weight="700" fill="#333">3 · your account</text>
  <text x="1342" y="920" font-size="9" fill="#666">your AWS account and your key</text>
  <text x="1342" y="936" font-size="9" font-weight="700" fill="#3a6a99">provisioning only — we hold names, health and billing</text>

  <!-- ============ PROMISE ============ -->
  <rect x="60" y="970" width="1680" height="80" rx="10" fill="#eef2f6"/>
  <rect x="60" y="970" width="4" height="80" fill="#3a6a99"/>
  <text x="84" y="996" font-size="11" font-weight="700" fill="#3a6a99">THE PROMISE, IN ONE SENTENCE</text>
  <text x="84" y="1018" font-size="11.5" fill="#1a1a1a">Nothing of yours is ever in a process or on a disk that serves another organization. Your code exists only on a machine created for your work and destroyed when it ends.</text>
  <text x="84" y="1038" font-size="11.5" fill="#1a1a1a">Everything we keep between ticks is encrypted at rest under a key that exists for your organization alone and is unwrapped only while your tick runs.</text>
  <text x="1724" y="1038" font-size="8.5" fill="#8a8a86" text-anchor="end">the residual is a compromised dispatcher process while your tick runs</text>
</svg>
