<!--
  Rail and Board — the plan as one rail beside the status view drawn by phase.
  Seeded like the workbench: plan-mockup.md (willdan · 2026-09-04 07:40 · decisions 412–421)
  plus 422 (planning's proposal for atlas) and 424 (a gathered elaboration). The workbench is
  retired; this file carries its seed, its session chips and its later additions.

  Decisions taken while building:
  - The rail is one plan delivery (5.5), titled "Decisions": the numbered decisions in the
    model's order (approve, decide, answer, then number), attention outside the count, then the
    SINCE tail. It is the list the chat prints for `plan`, one line each, with the answers as
    controls. One axis: j/k and ↓/↑ walk it, Enter opens the dock, y/n/l answer the focused
    card. There is no h/l anywhere.
  - The board is the status view (B.4) drawn by phase: Inception · Bolt plan · Construction ·
    Operation. It holds objects, never the count. Bolt plan is a narrow hatched gate (one
    proposal per repository in steady state). Operation is read-only; a landed bolt stays while
    its request, environments or a signal about it is live and 7 days after (186), and says so.
  - Every decision is also a marker on its object ("? 418" on the intent, "! host" on the bolt,
    "✓ 424" on each covered intent). A focused rail card lights its object; a marker click
    focuses the card and opens the dock. Nothing is answered on the board.
  - Hosts are a strip above the lanes: alive or gone, sessions against the bound, last
    heartbeat; a host pill lights its sessions in every lane and opens the host in the dock,
    where takeover and wait are its footer when it is gone. The strip also lists the
    repositories; a repository opens in the dock with its kinds, capabilities, claims in scope
    with verdicts, and each claim's scope with a control that sends one response (104, 105).
  - Every session shows one chip, the same everywhere: agent · model, @host, activity (working /
    starting / idle 14h / blocked / with you / next 08:00), pane link. Machinery sessions sit by
    phase: curation beside the unmoved-signals counter, planning inside the gate while it runs,
    a conflict fix on the bolt it works.
  - Every per-unit edit on the proposal (bolt, new bolt, rename, type, drop; rename on a bolt)
    is its own response, sent the moment it is given (172, 184), logged, and applied to the
    document. Nothing is staged. An edit that would leave a dependency crossing bolts, or a
    unit depending on a dropped unit, is refused inline with the reason and an offer to take
    the dependents along; each accepted dependent is its own response.
  - "Later" defers: the proposal or baseline leaves the count and stays in the gate greyed as
    "deferred · ask again"; it does not enter SINCE. "Ask again" is a dictation button in its
    dock that raises it as a new decision with a new number (5.2).
  - "Redo" on the proposal withdraws it, shows planning charged again with the notes inside the
    gate, and a new proposal number arrives later. The proposal's dock shows its lineage:
    intent → writeback (wrote the claim) → landing on the books → planning run → proposal.
  - 424 is a gathered research elaboration over three intents (188): answers yes · drop · pick
    · type · <intent>: drop (the decision stays). Each covered intent carries the 424 marker
    and proposes no elaboration of its own meanwhile.
  - No typed grammar anywhere. The capture box captures only: typed text becomes a capture
    with one signal, and a "this is an intent" toggle makes it an intent capture; under the
    box: "will send: capture" or "will send: capture · intent". Explore is a control: tick
    intents in Inception and press explore (with-operator or standing). Drop, later, rename,
    service start/stop, finish and ask-again are buttons in the dock.
  - A closed intent and a finished elaboration stay in Inception greyed with "leaves in Nd".
  - Under 760px the rail and the board are two tabs; the dock is full screen with a back
    control. The clock starts at 07:40 and advances a minute per response. Detail beyond the
    seed is invented and marked sample. Review switches: ?theme=dark|light, ?nodock, ?open=<key>.
-->

<style>

}

  --line:#2A333C; --line2:#232C34; --accent:#4FB3BF; --accent-ink:#0E1A1C; --accent-soft:#173A3E; --accent-hatch:rgba(79,179,191,.10);
  --ok:#5CB57F; --warn:#D9A24A; --crit:#E0675B; --lit:#3A3416; --lit-line:#B89B2D; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#12171C; --surface:#1A2128; --surface2:#20282F; --ink:#E6EBEF; --ink2:#A9B4BE; --ink3:#74818C;
  --line:#2A333C; --line2:#232C34; --accent:#4FB3BF; --accent-ink:#0E1A1C; --accent-soft:#173A3E; --accent-hatch:rgba(79,179,191,.10);
  --ok:#5CB57F; --warn:#D9A24A; --crit:#E0675B; --lit:#3A3416; --lit-line:#B89B2D; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input:focus,textarea:focus,select:focus,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3,h4{margin:0;font-weight:700;text-wrap:balance}
.mono{font-family:var(--mono)}
.tn{font-variant-numeric:tabular-nums}
kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink2);background:var(--surface2)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.sample{font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border:1px dashed var(--line);border-radius:3px;padding:0 4px;vertical-align:middle}

/* ---------- top ---------- */
.top{height:var(--top);display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:15px;font-weight:800;letter-spacing:-.01em}
.top .meta{color:var(--ink3);font-size:12px}
.top .count{margin-left:auto;display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--ink2)}
.top .count b{font:700 20px var(--mono);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:var(--surface);font-weight:600;font-size:12.5px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.yes{color:var(--accent);border-color:var(--accent)}

/* ---------- hosts strip ---------- */
.hosts{height:var(--hosts);display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--surface2);overflow-x:auto}

.host .hm{color:var(--ink3)}
.host.gone{border-color:var(--warn)}

.sc.hostlit{border-color:var(--accent);background:var(--accent-soft)} .sc.hostdim{opacity:.4}
.el{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0 0;font-size:12px}
.el .en{font-weight:600;min-width:0}
.leave{font:10.5px var(--mono);color:var(--ink3)} .leave.soon{color:var(--warn)}
.obj.closed{opacity:.6} .obj.closed .on{text-decoration:line-through;text-decoration-color:var(--ink3);text-decoration-thickness:1px}
.obj.deferred{opacity:.6;border-style:dashed}
.obj.explore{border-color:var(--accent)}

.obj .pickbox{width:14px;height:14px;margin:0;accent-color:var(--accent);flex:none}
.chip{display:inline-flex;align-items:center;font:10.5px var(--mono);padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--surface2)}
.chip.g{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)} .chip.x{border-color:var(--accent);color:var(--accent)}
.unit .it{flex-basis:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 0 0 6px}
.unit{flex-wrap:wrap}

.explore-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border:1px dashed var(--accent);border-radius:7px;padding:6px 8px;margin:0 0 8px;font-size:12px;background:color-mix(in srgb,var(--accent-soft) 50%,transparent)}
.explore-bar select{padding:2px 6px;font-size:12px}
.explore-bar .n{font:600 11px var(--mono);color:var(--accent)}
.capture .cf label{display:inline-flex;align-items:center;gap:5px;color:var(--ink2);cursor:pointer}

.gl{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

.gi .gx{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);font-size:12px;line-height:1}
.gi .gx:hover{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
.deliv{width:100%;border-collapse:collapse;font-size:12px}

.deliv td:first-child{color:var(--ink);font-weight:600} .deliv td.mono{font-size:11px}
.origin{font:10px var(--mono);padding:1px 6px;border-radius:4px;white-space:nowrap;background:var(--surface2);color:var(--ink3);border:1px solid var(--line2)}
.origin.override{color:var(--warn);border-color:var(--warn)}
.lin{display:flex;flex-direction:column}
.lin .ln{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:baseline;padding:5px 0 5px 14px;position:relative;font-size:12.5px}
.lin .ln::before{content:"";position:absolute;left:3px;top:0;bottom:0;width:2px;background:var(--line2)}
.lin .ln::after{content:"";position:absolute;left:0;top:11px;width:8px;height:8px;border-radius:50%;background:var(--ink3);border:2px solid var(--surface)}
.lin .ln:first-child::before{top:11px} .lin .ln:last-child::before{bottom:auto;height:11px} .lin .ln.here::after{background:var(--accent)}
.lin .lk-k{font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}

.vd{font:600 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--ink3);white-space:nowrap}

.claims{display:flex;flex-direction:column}

.kc{display:flex;flex-wrap:wrap;gap:4px}
.mark.attention.gone{color:var(--crit);border-color:var(--crit)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}

.dot.failed,.dot.gone{background:var(--crit)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- frame ---------- */
.wrap{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);height:calc(100vh - var(--top) - var(--hosts))}

.board{display:grid;grid-template-columns:minmax(230px,1fr) minmax(190px,.62fr) minmax(300px,1.35fr) minmax(230px,1fr);position:relative;overflow:hidden}
.lane{overflow:auto;padding:10px 10px 60px;border-right:1px solid var(--line2)}
.lane:last-child{border-right:0}
.lane.plan{background:repeating-linear-gradient(-45deg,transparent 0 8px,var(--accent-hatch) 8px 9px),var(--bg);border-left:1px dashed var(--line);border-right:1px dashed var(--line)}
.lane-h{display:flex;align-items:baseline;gap:8px;margin:2px 2px 10px;flex-wrap:wrap}
.lane-h h2{font-size:14px;font-weight:800;letter-spacing:-.01em}

.lane-h .gate{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 5px}
.lane-h .ro{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);border-radius:3px;padding:0 5px}

/* ---------- rail ---------- */
.rail-h{display:flex;align-items:baseline;gap:8px;margin:2px 2px 8px}
.rail-h h2{font-size:14px;font-weight:800}
.rail-h .sub{font-size:11.5px;color:var(--ink3)}
.grp{display:flex;align-items:baseline;gap:8px;margin:12px 2px 6px}
.grp .g{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800}
.grp.approve .g{color:var(--accent)} .grp.decide .g{color:var(--warn)} .grp.answer .g{color:var(--crit)} .grp.attention .g{color:var(--ink2)} .grp.since .g{color:var(--ink3)}
.grp .r{font-size:11.5px;color:var(--ink3)}

.card{position:relative;border:1px solid var(--line);border-left-width:3px;border-radius:6px;background:var(--surface);padding:8px 10px 8px 12px;margin-bottom:6px;cursor:pointer;transition:transform .15s,opacity .2s}

.card .ch{display:flex;align-items:center;gap:7px;font-size:11px;margin-bottom:3px}
.card .n{font:700 13px var(--mono);color:var(--ink)}
.card .kind{color:var(--ink3);font-weight:600}
.card .ph{margin-left:auto;font:500 10.5px var(--mono);color:var(--ink3);border:1px solid var(--line2);border-radius:3px;padding:0 5px;white-space:nowrap}
.card .ph.plan{color:var(--accent);border-color:var(--accent)}
.card .title{font-size:13.5px;font-weight:700;line-height:1.3}

.argbox:empty{display:none}

const sec = (title, html, r='') => html ? `<div class="sec"><h3>${title}${r?`<span class="r">${r}</span>`:''}</h3>${html}</div>` : '';
const kvHtml = rows => `<dl class="kv">${rows.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
const tlHtml = rows => `<ul class="tl">${rows.map(([t,who,k,tx]) => `<li class="${k}"><time>${esc(t)}</time><span class="who">${esc(who)}<i>${k}</i></span><span class="what">${tx}</span></li>`).join('')}</ul>`;
function sessionsHtml(list, note){ if(!list.length) return `<div class="empty" style="padding:2px 0">${esc(note||'nothing running')}</div>`;
  return `<div class="rows">${list.map(s => `<div class="row"><span class="dot ${s.state}"></span><div class="grow"><div class="nm">${esc(s.label)}<span class="m">@${esc(s.host)}${s.owner?' · '+esc(s.owner.name):''}</span></div><div class="last">${esc(s.last||'')}</div></div><span class="st ${s.state}">${s.state}</span></div>`).join('')}</div>`; }
function servicesHtml(list, ownerKey){ return `<div class="rows">${list.map((v,i) => `<div class="row"><span class="dot ${v.s==='running'?'':v.s}"></span><div class="grow"><div class="nm">${esc(v.n)}</div><div class="ep">${esc(v.ep)}</div></div><span class="st ${v.s}">${v.s}</span><button class="btn sm ${v.s==='running'?'drop':'yes'}" data-svc="${ownerKey}" data-i="${i}">${v.s==='running'?'stop':'start'}</button></div>`).join('')}</div>`; }
function docHtml(doc){ return `<div class="doc"><div class="dm">${esc(doc.dm)} · ${SM}</div>${doc.h.map(([h,p]) => `<h4>${esc(h)}<button class="an" data-an="${esc(h)}">note</button></h4><p>${p}</p>`).join('')}</div>`; }
function itemsHtml(items, stages){ return `<div class="stage"><span class="st" style="font:600 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)">stages</span><span class="chain">${stages.map((s,i) => `<span class="s ${i===0?'now':''}">${s}</span>${i<stages.length-1?'<span class="a">→</span>':''}`).join('')}</span></div>
  <div class="rows">${items.map(([id,st,tx,after]) => `<div class="row"><span class="mono" style="font-size:11.5px;color:var(--ink3);width:56px">${esc(id)}</span><div class="grow"><div class="nm">${esc(st)} <span class="m">${esc(tx)}</span></div></div><span class="t">after ${esc(after)}</span></div>`).join('')}</div>`; }
function histWithLog(n, base){ const rows = [...(base||[])]; S.log.filter(e => e.n===n).slice().reverse().forEach(e => rows.push(['09-04 '+e.t,'operator',e.fail?'fail':'response',esc(e.text)])); return rows; }

/* --- the proposal: each edit is its own response --- */
function closure(uid){ const P = S.proposal; const out = new Set(); const walk = id => P.units.forEach(u => { if(u.after.includes(id) && !out.has(u.id)){ out.add(u.id); walk(u.id); } }); walk(uid); return [...out]; }
function depsOf(uid){ const P = S.proposal; const out = new Set(); const walk = id => P.units.find(u => u.id===id).after.forEach(a => { if(!out.has(a)){ out.add(a); walk(a); } }); walk(uid); return [...out]; }
function unitMove(uid, toBolt, along){
  const P = S.proposal; const u = P.units.find(x => x.id===uid);
  const boltName = id => P.bolts.find(b => b.id===id).name;
  const group = along ? [uid, ...depsOf(uid), ...closure(uid)].filter((v,i,a) => a.indexOf(v)===i) : [uid];
  const crossing = P.units.filter(x => !x.dropped && !group.includes(x.id)).filter(x => x.after.some(a => group.includes(a)) || group.some(g => P.units.find(y => y.id===g).after.includes(x.id)));
  if(!along && crossing.length){
    const kin = [...depsOf(uid), ...closure(uid)].filter((v,i,a) => a.indexOf(v)===i);
    P.refusal = {uid, text:`${uid} bolt ${boltName(toBolt)} refused: ${uid} and ${kin.join(', ')} depend on each other and a dependency never crosses bolts.`, fix:{label:`move ${kin.join(', ')} along`, act:'move', to:toBolt}};
    toast(`${uid} · refused · dependency would cross bolts`, true); renderDock(); return;
  }
  P.refusal = null;
  group.forEach(id => { const x = P.units.find(y => y.id===id); if(x.bolt!==toBolt){ x.bolt = toBolt; unitResponse(`422 ${id}: bolt ${boltName(toBolt)}`); } });
  render();
}
function unitNewBolt(uid, name){
  const P = S.proposal; const id = 'nb-'+name; if(!P.bolts.find(b => b.id===id)) P.bolts.push({id, name, state:'new', holds:'created by your yes'});
  unitMove(uid, id, false);
}
function unitDrop(uid, along){
  const P = S.proposal; const deps = closure(uid).filter(id => !P.units.find(u => u.id===id).dropped);
  if(!along && deps.length){ P.refusal = {uid, text:`${uid} drop refused: ${deps.join(', ')} depend on it and a unit never depends on a dropped unit.`, fix:{label:`drop ${deps.join(', ')} too`, act:'drop'}}; toast(`${uid} · refused · ${deps.join(', ')} depend on it`, true); renderDock(); return; }
  P.refusal = null;
  [uid, ...(along ? deps : [])].forEach(id => { const u = P.units.find(x => x.id===id); if(!u.dropped){ u.dropped = true; unitResponse(`422 ${id}: drop`); } });
  render();
}
function proposalHtml(){
  const P = S.proposal;
  const boltOpts = u => P.bolts.map(b => `<option value="${b.id}" ${b.id===u.bolt?'selected':''}>${esc(b.name)}${b.state==='new'?' (new)':''}</option>`).join('') + `<option value="__new">new bolt…</option>`;
  const unitRow = u => `<div class="pu ${u.dropped?'dropped':''}" data-uid="${u.id}">
      <span class="pid">${u.id}</span><span class="pun">${esc(u.name)}</span><span class="pid" style="margin-left:8px">type ${esc(u.type)}</span>
      <div class="pud">${esc(u.why)}</div>
      <div class="pum"><span>after <b>${u.after.length ? u.after.join(', ') : 'none'}</b></span><span>covers <b>${esc(u.covers)}</b></span></div>
      <div class="lineage">lineage · claim <b>${esc(u.covers.split(' · ')[0])}</b> ← <b>${esc(u.from)}</b> ← intent host-liveness</div>
      ${u.dropped ? `<div class="pum"><span>dropped by your response · planning's next run may propose it again</span></div>` : `<div class="pue"><span class="lab">bolt</span><select data-ubolt="${u.id}" aria-label="bolt for ${u.id}">${boltOpts(u)}</select><span class="lab">type</span><select data-utype="${u.id}" aria-label="type for ${u.id}">${['default','fast','chore'].map(t => `<option ${t===u.type?'selected':''}>${t}</option>`).join('')}</select><button class="btn sm quiet" data-urename="${u.id}">rename</button><button class="btn sm quiet drop" data-udrop="${u.id}">drop</button></div>`}
      ${P.refusal && P.refusal.uid===u.id ? `<div class="refuse">${esc(P.refusal.text)}<div class="acts"><button class="btn sm pri" data-fix="${u.id}">${esc(P.refusal.fix.label)}</button><button class="btn sm quiet" data-fixno="1">leave it</button></div></div>` : ''}
      <div class="argbox" data-u="${u.id}"></div></div>`;
  const blocks = P.bolts.map(b => { const us = P.units.filter(u => u.bolt===b.id); if(!us.length && b.state==='new' && b.id.startsWith('nb-')) return '';
    return `<div class="pblock"><div class="pbh"><span class="bk">bolt</span><input value="${esc(b.name)}" data-bname="${b.id}" aria-label="bolt name" title="a bolt's name is yours to change · Enter sends rename"><span class="bstate ${b.state}">${b.state}</span><span class="bs">${esc(b.holds)} · ${us.filter(u=>!u.dropped).length} proposed</span></div>${us.map(unitRow).join('') || '<div class="empty" style="padding:8px 10px">no units here · every unit moved elsewhere</div>'}</div>`; }).join('');
  const ready = P.units.filter(u => !u.dropped && !u.after.some(a => !P.units.find(x => x.id===a).dropped)).map(u => u.id);
  return `<div class="dtext" style="margin-bottom:10px"><b>Planning read</b> ${esc(P.reads)}.</div>${blocks}` +
    sec('what a yes starts', `<div class="dtext">${ready.map(id=>`<span class="mono">${id}</span>`).join(', ')} start at once, side by side; the rest wait on their dependencies, which stay within one bolt. Every unit becomes items on its bolt's line; the next decision that is yours is each bolt's close.</div>`);
}

function dockDecision(d){
  const x = X[d.n] || {}; const parts = [];
  parts.push(sec('the decision', `<div class="dtext">${x.text||''}</div>`));
  if(d.kind==='proposal') parts.push(sec('the proposal · every edit is one response, sent when given', proposalHtml(), esc(S.proposal.session)));
  if(x.doc) parts.push(sec('document', docHtml(x.doc), 'a note on a section sends redo'));
  if(x.signals) parts.push(sec('signals · 3 of 7', x.signals.map(([m,t]) => `<div class="dsig">“${esc(t)}”<small>${esc(m)}</small></div>`).join(''), SM));
  if(d.kind==='blocked') parts.push(sec('the question', `<div class="dtext" style="font-size:16px;font-style:italic">“${esc(d.q)}”</div>`));
  if(x.items) parts.push(sec('items and stages', itemsHtml(x.items, x.stages), SM));
  if(x.kv) parts.push(sec(x.kvTitle||'detail', kvHtml(x.kv), SM));
  if(x.kv2) parts.push(sec(x.kv2Title||'more', kvHtml(x.kv2)));
  if(d.kind==='chores') parts.push(sec('chores · reason and file', kvHtml(d.chores.map(c => [c[0], `${esc(c[1])} · <span class="mono">${esc(c[2])}</span>`])), SM));
  if(x.log) parts.push(sec('session log · last lines', `<ul class="tl">${x.log.map(([t,l]) => `<li><time>${esc(t)}</time><span class="who"></span><span class="what">${esc(l)}</span></li>`).join('')}</ul>`, SM));
  const o = d.obj && d.obj!=='d:'+d.n ? objOf(d.obj) : null;
  if(o){ const list = d.obj[0]==='b' ? o.units.flatMap(u => u.items||[]) : o.sessions; parts.push(sec(`on ${esc(d.obj[0]==='b'?'bolt '+o.name:'intent '+o.name)} · sessions running`, sessionsHtml(d.sess ? list.filter(s => s.id===d.sess) : list, 'nothing running'), 'with host and last activity')); }
  else if(d.kind==='unit'||d.kind==='proposal') parts.push(sec('sessions running', sessionsHtml([], 'nothing starts before yes')));
  parts.push(sec('history · what led here and your responses', tlHtml(histWithLog(d.n, x.hist||[])), SM));
  return parts.join('');
}
function dockBolt(b){
  const sessions = b.units.flatMap(u => u.items||[]);
  return sec('the bolt', `<div class="dtext">Open bolt on <span class="mono">${esc(b.repo)}</span>, line <span class="mono">${esc(b.line)}</span>. Its place is kept on the host at the head of its line, refreshed after each merge, where you run and test the bolt with no session involved. ${esc(b.note)}.</div>`)
    + sec('decisions on this bolt', S.decisions.filter(d => d.obj==='b:'+b.id).map(d => `<div class="row"><button class="mark ${d.g}" data-mark="d:${d.n}">${d.n}</button><span class="grow">${d.title}</span><span class="t">${d.g}</span></div>`).join('') || '', 'in the rail, where you answer')
    + sec('units', `<div class="rows">${b.units.map(u => `<div class="row"><span class="st">${u.state}</span><div class="grow"><div class="nm">${esc(u.name)}${u.type?` <span class="m">type ${u.type}</span>`:''}</div></div>${(u.items||[]).map(wiHtml).join('')}</div>`).join('')}</div>`)
    + sec('sessions running', sessionsHtml(sessions), 'with host and last activity')
    + sec(`services of the place · ${esc(b.repo)}/${esc(b.name)}`, servicesHtml(b.services, 'b:'+b.id), 'start and stop are dictations')
    + sec('served endpoints', `<div class="rows">${b.endpoints.map(e => `<div class="row"><span class="ep">${esc(e)}</span></div>`).join('')}</div>`)
    + sec('history', tlHtml(BX[b.id]||[['09-04 '+hhmm(S.minutes),'machinery','note','bolt created by your response']]), SM);
}
function dockIntent(i){
  return sec('the intent', `<div class="dtext">Intent <span class="mono">${esc(i.name)}</span> is ${esc(i.state)}. ${esc(i.note)}. An intent is a line off the books' shared line; each elaboration works in a place off that line, and archiving the intent lands it.</div>`)
    + sec('decisions on this intent', S.decisions.filter(d => d.obj==='i:'+i.id).map(d => `<div class="row"><button class="mark ${d.g}" data-mark="d:${d.n}">${d.n}</button><span class="grow">${d.title}</span><span class="t">${d.g}</span></div>`).join('') || '', 'in the rail, where you answer')
    + sec('sessions running', sessionsHtml(i.sessions), 'with host and last activity');
}
function dockLanded(l){
  return sec('the landing', `<div class="dtext">Bolt <span class="mono">${esc(l.name)}</span> landed on <span class="mono">${esc(l.repo)}</span> main at ${esc(l.at)} through the repository's gates. Its place was removed with the landing; what it serves now is operation's, and what comes back from operation is a signal to curation. ${esc(l.window)}.</div>`)
    + sec('pull request and checks', `<div class="rows"><div class="row"><span class="lk ${l.pr.state==='merged'?'ok':'pend'}">PR #${l.pr.n}</span><div class="grow">${esc(l.pr.state)}</div></div>${l.checks.map(c => `<div class="row"><span class="dot ${c[1]==='ok'?'':c[1]==='bad'?'failed':'starting'}"></span><div class="grow"><div class="nm">${esc(c[0])}</div></div><span class="st ${c[1]==='bad'?'failed':''}">${c[1]==='ok'?'passed':c[1]==='bad'?'failing':'running'}${c[2]?' · '+esc(c[2]):''}</span></div>`).join('')}</div>`, SM)
    + sec('environments', `<div class="rows">${l.envs.map(e => `<div class="row"><span class="st">${esc(e[0])}</span><span class="ep">${esc(e[1])}</span><span class="t">↗</span></div>`).join('')}</div>`)
    + sec('units landed', kvHtml(l.units.map(u => [esc(u), 'merged'])))
    + sec('signals from operation', l.signals.length ? l.signals.map(s => `<div class="dsig">“${esc(s.text)}”<small>${esc(s.kind)} · ${esc(s.src)} · ${esc(s.age)} · ${s.move ? esc(s.move) : 'unmoved · curation sees it next run'}</small></div>`).join('') : '<div class="empty" style="padding:2px 0">nothing yet</div>');
}
function dockHost(h){
  const mine = allSessions().filter(s => s.host===h.id);
  return sec('the host', `<div class="dtext">Host <span class="mono">${esc(h.id)}</span> ${h.alive ? `is alive, last heartbeat ${h.last}` : `has sent no heartbeat for <b>${h.gone}</b>, last seen ${h.last}`}. Its bound is ${h.bound} sessions at once; at the bound ready work waits in a stated order. ${esc(h.note)}.</div>`)
    + sec(`what it runs · ${mine.length}/${h.bound}`, sessionsHtml(mine, 'nothing on this host'), 'each with the object it works')
    + sec('leases', kvHtml(h.id==='studio' ? [['plan','holder · renews every 30s'],['curation','holder'],['page','presenter for the page sink'],['plan-decisions','place at the head of the line']] : [['plan-decisions/wi-418','place · session blocked · lease expires 07:59'],['plan-tail/wi-426','place · session starting']]), SM);
}
function dockFooter(key){
  const [t,id] = key.split(':');
  if(t==='d'){ const d = dec(+id); const f = S.inflight[d.n];
    if(f) return `<div class="fl">answer</div><div class="dtext" style="font-size:12.5px;color:var(--ink2)"><span class="spin"></span> sending ${esc(f.text)} · one response · the card refuses a second click until it settles</div>`;
    const acts = d.kind==='blocked' ? actsHtml(d,'dock').replace(`<div class="argbox" data-n="${d.n}"></div>`, `<div class="argbox" data-n="${d.n}" data-arg="reply">${argHtml(d,'reply')}</div>`) : actsHtml(d,'dock');
    return `<div class="fl">answer · one response each<span class="r">${d.g===APPROVE ? 'yes is safe' : d.g===DECIDE ? 'no default' : 'needs text'}</span></div>${acts}`; }
  if(t==='h'){ const h = host(id); return h.alive ? `<div class="fl">nothing to answer</div>` : `<div class="fl">attention · outside the count</div><div class="acts"><button class="btn sm yes" data-att="host" data-ak="takeover">takeover on studio</button><button class="btn sm" data-att="host" data-ak="wait">wait</button></div>`; }
  if(t==='b') return `<div class="fl">no decision here that is not in the rail<span class="r">the next is its close</span></div>`;
  if(t==='l') return `<div class="fl">nothing to answer<span class="r">signals go to curation; a decision comes back on the plan</span></div>`;
  return `<div class="fl">no decision on this object</div>`;
}
function renderDock(){
  const key = S.open; if(!key) return; const [t,id] = key.split(':'); const o = objOf(key);
  if(!o){ closeDock(); return; }
  const nav = `<div class="nav"><span class="keys" style="font-size:11px;color:var(--ink3)"><kbd>j</kbd><kbd>k</kbd> rail · <kbd>esc</kbd></span><button class="x" id="dk-x" aria-label="close">×</button></div>`;
  let head, body;
  if(t==='d'){ head = `<div class="row"><span class="n">${o.n}</span><span class="kind">${esc(o.kind)}</span><span>${o.g}</span><span class="ph">${PH[o.phase]}</span>${nav}</div><h2 id="dk-title">${o.title}</h2><div class="tail">${o.tail}</div>`; body = dockDecision(o); }
  else if(t==='b'){ head = `<div class="row"><span class="kind">bolt</span><span class="ph">construction</span>${nav}</div><h2 id="dk-title">${esc(o.repo)}/${esc(o.name)}</h2><div class="tail">${esc(o.note)}</div>`; body = dockBolt(o); }
  else if(t==='i'){ head = `<div class="row"><span class="kind">intent</span><span class="ph">inception</span>${nav}</div><h2 id="dk-title">${esc(o.name)}</h2><div class="tail">${esc(o.state)}</div>`; body = dockIntent(o); }
  else if(t==='l'){ head = `<div class="row"><span class="kind">landed</span><span class="ph">operation</span>${nav}</div><h2 id="dk-title">${esc(o.repo)}/${esc(o.name)}</h2><div class="tail">landed ${esc(o.at)} · PR #${o.pr.n}</div>`; body = dockLanded(o); }
  else if(t==='h'){ head = `<div class="row"><span class="kind">host</span>${nav}</div><h2 id="dk-title">${esc(o.id)}</h2><div class="tail">${o.alive?'alive':'gone '+o.gone} · bound ${o.bound}</div>`; body = dockHost(o); }
  else { head = `<div class="row"><span class="kind">attention</span>${nav}</div><h2 id="dk-title">${o.text}</h2>`; body = sec('what it means', `<div class="dtext">${o.id==='host' ? 'The host that holds wi-#418 has not sent a heartbeat. Takeover releases its leases now and restores the place on studio; wait lets the lease expire at 07:59, when the machinery does the same.' : 'Your earlier response named a decision that was gone. It was recorded, handed back as unapplicable and shown once here; nothing was dropped. The unit was re-proposed and kept its number.'}</div>`); }
  const keep = $('#dk-b').scrollTop;
  $('#dk-h').innerHTML = head; $('#dk-b').innerHTML = body; $('#dk-f').innerHTML = t==='a' ? `<div class="acts">${o.acts.map(([k,l]) => `<button class="btn sm ${k==='takeover'?'yes':''}" data-att="${o.id}" data-ak="${k}">${esc(l)}</button>`).join('')}</div>` : dockFooter(key);
  $('#dk-b').scrollTop = keep;
}
function openDock(key){ const was = S.open===key; S.open = key; if(key[0]==='d' || key[0]==='a') S.focus = key; document.body.classList.add('docked'); render(); if(!was) $('#dk-b').scrollTop = 0; }
function closeDock(){ S.open = null; document.body.classList.remove('docked'); render(); }
function setFocus(key){ S.focus = key; if(S.open && (S.open[0]==='d'||S.open[0]==='a')) S.open = key; render(); const el = document.querySelector(`.rail [data-nav="${key}"]`); if(el){ el.scrollIntoView({block:'nearest'}); el.focus({preventScroll:true}); } const lit = $('.obj.lit'); if(lit) lit.scrollIntoView({block:'nearest'}); }
function step(dir){ const list = railKeys(); if(!list.length) return; const i = list.indexOf(S.focus); const j = i<0 ? 0 : Math.min(list.length-1, Math.max(0, i+dir)); setFocus(list[j]); }

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener('click', e => {
  const t = e.target, b = t.closest('button');
  if(b && b.dataset.a !== undefined){ const n = +b.dataset.n, a = b.dataset.a, d = dec(n); if(!d) return;
    if(S.inflight[n]){ refuse(n); return; }
    if(needsArg(a)){ const box = b.closest('.acts').nextElementSibling; const open = box.dataset.arg===a; $$('.argbox[data-n]').forEach(x => { x.innerHTML=''; delete x.dataset.arg; }); if(!open){ box.dataset.arg = a; box.innerHTML = argHtml(d, a); box.querySelector('input,textarea,select')?.focus(); } return; }
    send(n, a); return; }
  if(b && b.dataset.send){ const n = +b.dataset.n, a = b.dataset.send, box = b.closest('.argbox'); let arg = '';
    if(a==='pick'){ arg = $$('input:checked', box).map(i => i.value).join(' '); if(!arg){ toast('pick at least one', true); return; } }
    else { const f = box.querySelector('input,textarea,select'); arg = f.value.trim(); if(!arg){ f.focus(); return; } }
    box.innerHTML=''; delete box.dataset.arg; send(n, a, arg); return; }
  if(b && b.dataset.cancel){ const box = b.closest('.argbox'); box.innerHTML=''; delete box.dataset.arg; return; }
  if(b && b.dataset.att){ const a = S.attention.find(x => x.id===b.dataset.att); S.attention = S.attention.filter(x => x!==a);
    if(b.dataset.ak==='ok'){ toast('seen · not logged'); }
    else { logLine(b.dataset.ak, {}); toast(`${b.dataset.ak} · recorded`);
      if(b.dataset.ak==='takeover'){ const h = host('mac-mini'); h.alive = true; h.last = hhmm(S.minutes); h.note = 'released by takeover · its sessions restored on studio'; S.bolts.flatMap(x => x.units).flatMap(u => u.items||[]).filter(i => i.host==='mac-mini').forEach(i => { i.host='studio'; i.last=`${hhmm(S.minutes)} · taken over on studio · place restored`; }); h.alive = false; h.gone = 'released'; } }
    if(S.open==='a:'+(a&&a.id)) S.open = null, document.body.classList.remove('docked');
    if(S.focus==='a:'+(a&&a.id)) S.focus = railKeys()[0] || null;
    render(); return; }
  if(b && b.dataset.svc !== undefined){ const o = objOf(b.dataset.svc); const v = o.services[+b.dataset.i]; v.s = v.s==='running' ? 'stopped' : 'starting'; say(`${v.s==='stopped'?'stop':'start'} ${o.name}/${v.n}`); render(); if(v.s==='starting') setTimeout(() => { v.s='running'; render(); }, 1500); return; }
  /* proposal edits · each one response */
  if(b && b.dataset.udrop !== undefined){ unitDrop(b.dataset.udrop, false); return; }
  if(b && b.dataset.urename !== undefined){ const box = $(`.argbox[data-u="${b.dataset.urename}"]`); box.innerHTML = `<div class="field"><input placeholder="new unit name" aria-label="rename"><button class="btn pri sm" data-usend="rename" data-u="${b.dataset.urename}">send rename</button><button class="btn quiet sm" data-ucancel="1">cancel</button></div>`; box.querySelector('input').focus(); return; }
  if(b && b.dataset.usend){ const box = b.closest('.argbox'); const v = box.querySelector('input').value.trim(); if(!v){ box.querySelector('input').focus(); return; } const u = S.proposal.units.find(x => x.id===b.dataset.u);
    if(b.dataset.usend==='rename'){ u.name = v; unitResponse(`422 ${u.id}: rename ${v}`); render(); } else unitNewBolt(u.id, v.replace(/\s+/g,'-')); return; }
  if(b && b.dataset.ucancel){ b.closest('.argbox').innerHTML=''; renderDock(); return; }
  if(b && b.dataset.fix !== undefined){ const r = S.proposal.refusal; if(!r) return; r.fix.act==='move' ? unitMove(r.uid, r.fix.to, true) : unitDrop(r.uid, true); return; }
  if(b && b.dataset.fixno){ S.proposal.refusal = null; renderDock(); return; }
  if(b && b.dataset.an !== undefined){ const d = dec(+S.open.split(':')[1]); if(!d) return; const box = $('#dk-f .argbox'); $$('.argbox[data-n]').forEach(x => { x.innerHTML=''; delete x.dataset.arg; }); box.dataset.arg='redo'; box.innerHTML = argHtml(d,'redo'); const ta = box.querySelector('textarea'); ta.value = `[${b.dataset.an}] `; ta.focus(); return; }
  /* markers, hosts, chrome */
  if(b && b.dataset.mark){ openDock(b.dataset.mark); return; }
  if(b && b.dataset.host){ const id = b.dataset.host; if(S.open==='h:'+id){ S.hostlit = null; closeDock(); } else { S.hostlit = id; openDock('h:'+id); } return; }
  if(b && b.id==='dk-x'){ closeDock(); return; }
  if(b && (b.id==='yesall'||b.id==='yesall2')){ yesAll(); return; }
  if(b && b.id==='logbtn'){ const l = $('#log'); l.hidden = !l.hidden; b.setAttribute('aria-expanded', String(!l.hidden)); return; }
  if(b && b.id==='capture-send'){ capture(); return; }
  if(b && b.id==='theme'){ const r = document.documentElement; const cur = r.dataset.theme || 'system'; const next = cur==='system' ? 'light' : cur==='light' ? 'dark' : 'system'; if(next==='system') delete r.dataset.theme; else r.dataset.theme = next; b.textContent = next; return; }
  if(b && b.dataset.tab){ document.body.dataset.tab = b.dataset.tab; $$('.tabs button').forEach(x => x.setAttribute('aria-selected', String(x===b))); return; }
  if(t.closest('label.chore')){ setTimeout(() => $$('label.chore').forEach(l => l.classList.toggle('on', l.querySelector('input').checked)), 0); return; }
  const nav = t.closest('[data-nav]');
  if(nav && !t.closest('input,textarea,select,.argbox,.chores')){ const key = nav.dataset.nav; if(e.detail===2 || S.open) openDock(key); else setFocus(key); return; }
  const obj = t.closest('[data-obj]');
  if(obj && !t.closest('input,textarea,select,button')){ openDock(obj.dataset.obj); return; }
  if(!t.closest('#dock') && S.open && !t.closest('#log,#logbtn,.hosts')){ S.hostlit = null; closeDock(); }
  if(!t.closest('#log,#logbtn') && !$('#log').hidden){ $('#log').hidden = true; $('#logbtn').setAttribute('aria-expanded','false'); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.ubolt){ const u = S.proposal.units.find(x => x.id===t.dataset.ubolt);
    if(t.value==='__new'){ const box = $(`.argbox[data-u="${u.id}"]`); box.innerHTML = `<div class="field"><input placeholder="name for the new bolt" aria-label="new bolt"><button class="btn pri sm" data-usend="newbolt" data-u="${u.id}">send new bolt</button><button class="btn quiet sm" data-ucancel="1">cancel</button></div>`; box.querySelector('input').focus(); return; }
    unitMove(u.id, t.value, false); return; }
  if(t.dataset.utype){ const u = S.proposal.units.find(x => x.id===t.dataset.utype); if(t.value!==u.type){ u.type = t.value; unitResponse(`422 ${u.id}: type ${t.value}`); render(); } return; }
  if(t.dataset.bname){ const b = S.proposal.bolts.find(x => x.id===t.dataset.bname); const v = t.value.trim(); if(v && v!==b.name){ const old = b.name; b.name = v; unitResponse(`422 rename ${old} ${v}`); render(); } }
});
document.addEventListener('input', e => { if(e.target.id==='capture') captureAs(); });
document.addEventListener('keydown', e => {
  const typing = e.target.matches('input,textarea,select');
  if(e.key==='Escape'){ if(typing){ e.target.blur(); const box = e.target.closest('.argbox'); if(box){ box.innerHTML=''; delete box.dataset.arg; } return; } if(!$('#log').hidden){ $('#log').hidden = true; return; } if(S.open){ S.hostlit = null; closeDock(); } return; }
  if(typing){ if(e.key==='Enter' && !e.shiftKey && e.target.id==='capture'){ e.preventDefault(); capture(); } if(e.key==='Enter' && e.target.matches('input') && e.target.closest('.argbox')){ e.preventDefault(); e.target.closest('.argbox').querySelector('[data-send],[data-usend]').click(); } if(e.key==='Enter' && e.target.dataset.bname){ e.preventDefault(); e.target.blur(); } return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k = e.key;
  if(k==='j'||k==='ArrowDown'){ e.preventDefault(); step(1); return; }
  if(k==='k'||k==='ArrowUp'){ e.preventDefault(); step(-1); return; }
  if(k==='Enter'||k==='o'){ if(S.focus){ e.preventDefault(); openDock(S.focus); } return; }
  if(k==='y'||k==='n'||k==='l'){ if(!S.focus || S.focus[0]!=='d') return; const d = dec(+S.focus.split(':')[1]); if(!d) return;
    const a = d.answers.map(x => x[0]).find(x => KEYS[x]===k);
    if(!a){ toast(`${d.n} · no "${k}" answer on this card · ${d.answers.map(x=>x[0]).join(' · ')}`, true); return; }
    e.preventDefault(); send(d.n, a); return; }
  if(k==='/'){ e.preventDefault(); document.body.dataset.tab = 'board'; $$('.tabs button').forEach(x => x.setAttribute('aria-selected', String(x.dataset.tab==='board'))); $('#capture')?.focus(); }
});
function yesAll(){ const list = S.decisions.filter(d => d.g===APPROVE && !S.inflight[d.n]).map(d => d.n).sort((a,b) => a-b); list.forEach((n, i) => setTimeout(() => send(n, 'yes'), i*380)); }

/* capture · typed text is a capture with one signal, or a dictation by prefix */
function classify(v){ let m; if((m = v.match(/^intent:\s*(.+)/i))) return {kind:'intent', text:m[1]}; if((m = v.match(/^chore\s+([\w-]+):\s*(.+)/i))) return {kind:'chore', repo:m[1], text:m[2]}; if((m = v.match(/^bolt\s+([\w-]+):\s*(.+)/i))) return {kind:'bolt', bolt:m[1], text:m[2]}; return {kind:'capture', text:v}; }
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').split('-').slice(0,4).join('-');
function captureAs(){ const v = $('#capture').value.trim(); const c = classify(v); const as = $('#capture-as');
  as.innerHTML = c.kind==='capture' ? 'sends as <b>capture</b> · 1 signal · kind ask · curation sees it' : c.kind==='intent' ? 'sends as <b>dictation</b> · opens intent <span class="mono">'+esc(slug(c.text))+'</span> · no decision' : c.kind==='chore' ? 'sends as <b>dictation</b> · proposes a chore on <span class="mono">'+esc(c.repo)+'</span>' : 'sends as <b>dictation</b> · proposes a unit on bolt <span class="mono">'+esc(c.bolt)+'</span>' + (S.bolts.some(b => b.name===c.bolt) ? '' : ' · <span style="color:var(--crit)">no open bolt by that name</span>'); }
function capture(){ const ta = $('#capture'); const v = ta.value.trim(); if(!v){ ta.focus(); return; } const c = classify(v);
  if(c.kind==='capture'){ S.curation.unmoved++; S.curation.by += /page/.test(S.curation.by) ? '' : ' · page 1'; logLine(`capture: ${v}`, {say:true}); toast('capture · 1 signal (ask) · curation sees it'); }
  else if(c.kind==='intent'){ const id = slug(c.text); S.intents.unshift({id, name:id, state:'open', note:'dictated · elaborations to come from planning', sessions:[]}); logLine(`intent: ${c.text}`, {say:true}); toast(`intent ${id} · opened`); }
  else if(c.kind==='chore'){ logLine(`chore ${c.repo}: ${c.text}`, {say:true}); toast(`chore on ${c.repo} · applied`); startUnit(addBolt('chores-'+c.repo,'chores',c.repo,'no bolt · one session each'), 'chore · '+c.text.slice(0,28), 'chore', 'chore'); }
  else { const b = S.bolts.find(x => x.name===c.bolt); if(!b){ toast(`no open bolt "${c.bolt}"`, true); return; } logLine(`bolt ${c.bolt}: ${c.text}`, {say:true}); toast(`unit on ${c.bolt} · applied`); startUnit(b, slug(c.text), 'default', 'spec'); }
  ta.value=''; render(); }

/* first frame */
document.body.dataset.tab = 'plan';
const Q = new URLSearchParams(location.search);
if(Q.get('theme')){ document.documentElement.dataset.theme = Q.get('theme'); $('#theme').textContent = Q.get('theme'); }
render();
if(!Q.has('nodock')) openDock(Q.get('open') || 'd:422');
})();
</script>
