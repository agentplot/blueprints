<!--
  Rail and Board — the plan as one rail beside the status view drawn by phase.
  Seeded from plan-mockup.md (willdan · 2026-09-04 07:40 · decisions 412–421) plus 422
  (planning's proposal for atlas) and 424 (a gathered elaboration).

  What this file is, and what it is not. This is the plan surface: the rail, the board in its
  three views, the dock, the book and its library, the artifact views, the flywheel instrument,
  the capture box, and the account item with its organization switcher. Administration is not
  here. Hosts and what each one runs, pools and their images, the organization store, the
  settings form and "+ host" belong to `management-console.html`, drawn in Cloudscape, and the
  account item's one entry into it is "management console", opened for the organization in hand.
  Nothing on this page installs, enrols, retires or configures anything; every decision those
  flows raise is answered here, in the rail, like any other.

  Decisions taken while building:
  - The rail is one plan delivery (5.5), titled "Decisions": the numbered decisions in the
    model's order (approve, decide, answer, then number), attention outside the count, then the
    SINCE tail. It is the list the chat prints for `plan`, one line each, with the answers as
    controls. One axis: j/k and ↓/↑ walk it, Enter opens the dock, y/n/l answer the focused
    card. There is no h/l anywhere.
  - The board is the status view (B.4) drawn by phase: Inception · Bolt plan · Construction ·
    Operation. It holds objects, never the count. Bolt plan is a narrow hatched gate (one
    proposal per repository in steady state). Operation is read-only; a landed bolt stays while
    its request, environments or a signal about it is live and 7 days after (186), and says so.
  - One silhouette per kind: never one card class with variants. A decision is the only
    thing shaped like an answerable card (the rail). On the board a proposal is a sheet (title
    line, section rules, mono metadata, taller than wide) with unit proposals hanging off it as
    slips and a baseline as a sheet of its own; an intent is a drawn thread (a vertical stroke,
    elaborations as beads, no box; closed is the same thread with an end cap); a bolt is a flat
    square-cornered ledger (units as a left-to-right chain merged · building · queued, sessions
    under the building unit, machinery on its own row, services at the foot); a landed bolt is a
    borderless muted record with PR and checks as a stamp; a signal is a quote with a left rule.
    Sessions, hosts, repositories, deferred sheets, planning-in-progress and explorations keep
    their forms. The dock header takes the same form as the object.
  - Each bead on a thread is its own target: it opens a dock page for that elaboration (kind
    and type, state, its pending decision with the answer controls, its document excerpt and the
    records it wrote into the intent's change directory, its session chip, "in gathering 424"
    when covered, the countdown when finished) with a knot in the header and a back link to the
    thread; ] and [ step through the beads of the intent in hand. A bead carries a leading kind
    word (research · prototype · writeback · explore) and its state after its name, so it never
    reads as a sub-intent; the head knot carries an "intent" kicker.
  - Explore is a mode, not a standing checkbox: "explore…" at the head of Inception enters
    selection; every intent head knot shows a tick target, a sticky bar at the lane's foot says
    what will happen and offers with-operator or standing, start and cancel; Esc cancels. Beads
    never show a tick.
  - Phase is the lane's; kind is the shape's. An object does not repeat its phase; colour stays
    as it was (accent, ok/warn/crit, the phase chip on rail cards). Shape does the new work.
  - Every decision is also a marker on its object ("? 418" on the intent, "! host" on the bolt,
    "✓ 424" on each covered intent). A focused rail card lights its object; a marker click
    focuses the card and opens the dock. Nothing is answered on the board.
  - Hosts are a strip above the lanes: alive or gone, sessions against the bound, last
    heartbeat; a host pill lights its sessions in every lane and opens the host in the dock,
    where takeover and wait are its footer when it is gone. The strip also lists the
    repositories; a repository opens in the dock with its kinds, capabilities, claims in scope
    with verdicts, and each claim's scope with a control that sends one response (104, 105).
  - Every session shows one chip, the same everywhere: agent · model, @host, activity (working /
    starting / idle 14h / blocked / with you / next 08:00), pane link. Machinery sessions sit by
    phase: curation beside the unmoved-signals counter, planning inside the gate while it runs,
    a conflict fix on the bolt it works.
  - Every per-unit edit on the proposal (bolt, new bolt, rename, type, drop; rename on a bolt)
    is its own response, sent the moment it is given (172, 184), logged, and applied to the
    document. Nothing is staged. An edit that would leave a dependency crossing bolts, or a
    unit depending on a dropped unit, is refused inline with the reason and an offer to take
    the dependents along; each accepted dependent is its own response.
  - "Later" defers: the proposal or baseline leaves the count and stays in the gate greyed as
    "deferred · ask again"; it does not enter SINCE. "Ask again" is a dictation button in its
    dock that raises it as a new decision with a new number (5.2).
  - "Redo" on the proposal withdraws it, shows planning charged again with the notes inside the
    gate, and a new proposal number arrives later. The proposal's dock shows its lineage:
    intent → writeback (wrote the claim) → landing on the books → planning run → proposal.
  - 424 is a gathered research elaboration over three intents (188): answers yes · drop · pick
    · type · <intent>: drop (the decision stays). Each covered intent carries the 424 marker
    and proposes no elaboration of its own meanwhile.
  - No typed grammar anywhere. The capture box captures only: typed text becomes a capture
    with one signal, and a "this is an intent" toggle makes it an intent capture; under the
    box: "will send: capture" or "will send: capture · intent". Explore is a control: tick
    intents in Inception and press explore (with-operator or standing). Drop, later, rename,
    service start/stop, finish and ask-again are buttons in the dock.
  - A closed intent and a finished elaboration stay in Inception greyed with "leaves in Nd".
  - The board has three views, switched in its header or with m (phases and map) and b
    (phases and book): "phases" (the lanes), "map", the system context map as the scope surface (198, accepted; not yet in
    requirements.md). The map draws willdan's repositories and the external systems they meet;
    a repository node carries its kinds and capabilities, a claim summary (standing · unmet,
    coloured by unmet), and the same decision markers as the lanes; a focused rail card lights
    its node; a node click opens the repository dock, whose claims gain "show on map".
    Scope is a gesture: select a claim (side panel or repo dock), the nodes in its scope light;
    click nodes to toggle them in or out; the panel names the rule the set matches (all ·
    kind:<k> · capability:<c> · named) and "send scope" logs one response; a repository pulled
    into or out of scope changes its unmet count at once and is marked "planning due".
    "Since last review" (122) dims unchanged nodes and edges and outlines the changed ones with
    a note. "Add repository" places a node, asks kinds and capabilities, shows the claims that
    fall into scope, and a baseline decision with a new number appears in the rail (104).
  - Book mode is an mdBook viewer the page draws itself. The organization's books are mdBook
    sources in the books repository; the Rust server serves each at /book/<book>/<chapter>.html
    and the page draws the chapter tree, one chapter at a time with prev and next, headings
    with anchors, and the claim blocks as the flywheel renders them: name, version, standing or
    proposed (98), what it attaches to and the scope line derived from it (200), one verdict
    dot per repository in scope from the ledger (100, 101). A proposed claim is dashed and
    carries no verdicts. Chapters and prose are invented from the seed's claims, marked sample.
  - The rail drives the viewer. A focused card jumps the book to the chapter and anchor the
    decision concerns: a unit's cited claim, an intent's chapters, a bolt's or a landing's
    claims, a proposal's claims per unit, a gathered elaboration's shared claim, a moved claim
    itself; the block lights. A ref in the book in hand wins; otherwise the first ref, which
    loads its book. Decision markers sit in
    the chapter margin beside the block they concern, the same glyphs as the lanes; a click
    focuses the card and opens its dock. j/k walk the rail only; the dock stays available; b
    enters and leaves book mode.
  - "read in book" appears on every dock page per cited chapter or claim (decision, proposal
    per unit, bolt, landed bolt, intent, elaboration, the repository dock's claim rows) and in
    the map's scope box; it switches to book mode at that anchor and closes the dock, which
    would otherwise cover the page; Enter reopens it on the focused card.
  - Library: a control in the book header opens an overlay over the board listing the
    organization's books (platform-kit, switchboard-kit, atlas-kit, gvc-kit, and the flywheel's
    surface specification as a shipped book) with chapters, claims standing and proposed, last
    written, unmet verdicts, "changed since review" and its repositories; choosing one loads
    it; a repository chip goes to the map view and opens the repository dock; Esc closes.
  - The review flow is one flow for the map and the book (122): "since last review" is the
    same switch and mark in both views; in the book, changed paragraphs and claim blocks are
    outlined and washed with a note, unchanged chapters dim in the tree, and a Changes list at
    the head of the tree links each change to its anchor. "mark reviewed" is one recorded
    response (S73) that moves the mark and empties both views; "ok" on an attention line is
    recorded too (S74).
  - Artifacts (213): every object opens the OpenSpec files behind it in the dock, one view
    per artifact, each headed by a source bar ("derived from <repository @ sha> · <path> ·
    read hh:mm · never stored · edits only through review") with "open source" (the path at
    the shared line) and "review" (switches to the review binding). The views: an intent's
    change directory (proposal.md rendered, the records with kind, date and session, the
    delta specs grouped ADDED · MODIFIED · REMOVED as requirement blocks with scenarios folded
    under a disclosure, design.md, the archive state); a unit's change on its bolt's line
    (the OpenSpec steps ff · apply · verify · archive as a stepper with the unit type's stage
    under each, proposal, requirement blocks with scenarios, tasks.md as a checklist saying
    which item and commit did each task); a claim (the chapter block, its version history,
    attachments, a verdict per repository in scope with the as-built statement, its commit and
    its session as evidence, "read in book"); a bolt's acceptance file (the claims its units
    named with their scenarios, the landing state; previewed from the specs before landing,
    read from the file after); a work item (its commits in Conventional Commits form, the
    deliverables it recorded, its session's report). They open from: the intent and
    elaboration docks (change directory), the bolt dock (a "change" button per unit and the
    acceptance file), the landed dock (acceptance), every work-item chip on a ledger or in a
    dock, every claim name in a claims list or repository row, an "evidence" button on a book
    claim block, and a section "the artifacts behind it" on each decision's dock. A unit
    proposal before its yes has no change to open and says so (187). The review page is a
    plannotator stub: the command with --decision n when a decision is pending on the
    artifact, the document with a note control per section, and the pending decision's
    answers in the footer. Artifact keys: o:intent/<id>, o:unit/<bolt>/<unit>, o:claim/<name>,
    o:bolt/<id>, o:wi/<id>; rv:<same> for the review binding. Objects with no invented entry
    derive a skeleton from the state so every object opens.
  - The flywheel (214): one instrument, because the game is priming the wheel and walking
    away: in the ideal week the operator primes it and construction runs unattended on one
    host, and hosts are added to drain faster. RUNWAY in days = approved construction work
    not yet merged (queued and building units) ÷ drain, where drain = the alive hosts'
    summed bound ÷ ~3 slot-days per unit (invented from the last week's merges, marked
    sample; a gone host drains nothing). The wheel is a dial on a 0–7 day scale, a week at
    the rim, with a band ("primed for 5 days", "running dry", "primed for a week or more").
    Three columns under it: FEED → (proposals to approve with the units they carry,
    elaborations waiting on you, intents to approve; "feed: 4 decisions add ~7.5 days"),
    PRESSURE → (approved and waiting, items running on alive hosts against the alive slots,
    the number behind the bound; grows on one host, drains as hosts are added) and DRAIN →
    (hosts alive of hosts, utilization, units merged per day at the bound, a 7-day merges
    sparkline and bolts landed per week labelled "history, not a target" (142); "add a host
    to drain faster"). Above the wheel the two stages of backpressure as a two-stage pipe:
    inception (signals → intents → elaborations → proposals) filled by what waits on the
    operator, a hatched gate, then construction (approved → running → merged → landed)
    filled by queue ÷ alive bound and drawn as tall as the alive hosts' bound, so a host
    added visibly widens it. One reading sentence, chosen in order: "you are the limit: n
    decisions older than a day · yes on 422 alone adds ~4 days" (old decisions and runway
    under two days), "feed it: n decisions approve ~d days of work", "drain is the limit:
    add a host · n items on m alive slots", "primed: agents have d days". Yes on 422 moves
    the seed from the first reading ("you are the limit", running dry at 0.8 days with the
    pool's two live hosts in the drain) to the third and the runway from 0.8 to 2.6 days.
    The unattended streak is the score, stated as a reading and never a target: "agents
    have run 1d 19h without you" with since-when, what puts it at risk now (a gone host
    holding items, a secret waiting, runway under a day), the longest streak and the last
    one with what ended it (runway ran out; a session blocked with nothing else to run; the
    bound reached with a day of queue behind it). A streak counts while approved work runs
    and nothing stops it; decisions arriving do not end it, they are the feed. The three
    phase gauges with their sparklines and readings survive under an "advanced" disclosure
    whose open state persists across renders. The compact form in the machinery strip is
    one pill: a 16px wheel, the runway number and the streak, "at risk" when something
    threatens it; it opens the panel like w. The key is w, not l: l is the focused card's
    later (S56) and a key a card does not offer is refused, never remapped (S57). Under
    760px the strip stays one scrolling row, the panel is reached from the board header,
    and the columns stack under the wheel.
  - The hosts strip stays as the plan view's readout (B.4 §141): a host pill with its state, its
    session count against its bound and its last heartbeat, lighting that host's sessions in every
    lane and opening its dock page; the repositories beside it; the flywheel's pill at the end. It
    administers nothing — the host dock says so and links to the console.
  - Owners on decisions, the mine|all filter, answered-by in SINCE and the sinks line on the
    account item stay here, because they are read and answered on the plan. The environment
    attention line and the secret attention line stay too: the rail raises them, the dock explains
    them, and the console is where the provider is declared and the secret is placed.
  - Under 760px the rail and the board are two tabs; the dock is full screen with a back control.
    The clock starts at 07:40 and advances a minute per response. Detail beyond the seed is
    invented and marked sample. Review switches: ?theme=dark|light, ?nodock, ?open=<key>,
    ?view=map|book, ?book=<id>, ?ch=<chapter>, ?review=1, ?library=1, ?load=1, ?host=<id> (lights
    a host pill), ?org=agentplot|personal|integral-analytics, ?acct=1, ?signedout=1,
    ?served=studio|willdan-cloud.
-->
<meta charset="utf-8">
<title>Rail and Board</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#F6F8FA; --ink:#16202A; --ink2:#4A5763; --ink3:#7A8794;
  --line:#D5DBE1; --line2:#E4E8EC; --accent:#0B6E79; --accent-ink:#FFFFFF; --accent-soft:#D9EEF0; --accent-hatch:rgba(11,110,121,.10);
  --ok:#2E8B57; --warn:#B7791F; --crit:#B3362B; --lit:#FFF3C4; --lit-line:#E5C34A;
  --shadow:0 10px 30px rgba(22,32,42,.16); --top:46px; --hosts:40px; --rail:340px; --dock:600px;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12171C; --surface:#1A2128; --surface2:#20282F; --ink:#E6EBEF; --ink2:#A9B4BE; --ink3:#74818C;
  --line:#2A333C; --line2:#232C34; --accent:#4FB3BF; --accent-ink:#0E1A1C; --accent-soft:#173A3E; --accent-hatch:rgba(79,179,191,.10);
  --ok:#5CB57F; --warn:#D9A24A; --crit:#E0675B; --lit:#3A3416; --lit-line:#B89B2D; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#12171C; --surface:#1A2128; --surface2:#20282F; --ink:#E6EBEF; --ink2:#A9B4BE; --ink3:#74818C;
  --line:#2A333C; --line2:#232C34; --accent:#4FB3BF; --accent-ink:#0E1A1C; --accent-soft:#173A3E; --accent-hatch:rgba(79,179,191,.10);
  --ok:#5CB57F; --warn:#D9A24A; --crit:#E0675B; --lit:#3A3416; --lit-line:#B89B2D; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--sans);overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input:focus,textarea:focus,select:focus,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3,h4{margin:0;font-weight:700;text-wrap:balance}
.mono{font-family:var(--mono)}
.tn{font-variant-numeric:tabular-nums}
kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink2);background:var(--surface2)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.sample{font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border:1px dashed var(--line);border-radius:3px;padding:0 4px;vertical-align:middle}

/* ---------- top ---------- */
.top{flex:none;height:var(--top);display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:15px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
@media (max-width:1400px){.top .keys{display:none}}
.top .meta{color:var(--ink3);font-size:12px}
.top .count{margin-left:auto;display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--ink2)}
.top .count b{font:700 20px var(--mono);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:var(--surface);font-weight:600;font-size:12.5px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.yes{color:var(--accent);border-color:var(--accent)}
.btn.drop{color:var(--crit)}
.btn.quiet{border-color:transparent;color:var(--ink2)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.btn .k{font:10px var(--mono);color:inherit;opacity:.65;border:1px solid currentColor;border-radius:3px;padding:0 3px}

/* ---------- hosts strip ---------- */
.hosts{flex:none;min-height:var(--hosts);display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:4px 14px;border-bottom:1px solid var(--line);background:var(--surface2)}
@media (max-width:1700px){.hosts .note{display:none}}
.hosts .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-right:4px;white-space:nowrap}
.host{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 6px;font-size:12px;white-space:nowrap}
.host .hn{font:600 12px var(--mono)}
.host .hm{color:var(--ink3)}
.host.gone{border-color:var(--warn)}
.host.gone .hm b{color:var(--warn)}
.host.lit,.host.open-in-dock{background:var(--accent-soft);border-color:var(--accent)}
.hosts .note{margin-left:auto;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.hosts .sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
.repo{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font:600 12px var(--mono);white-space:nowrap}
.repo .hm{font:11px var(--sans);color:var(--ink3);font-weight:500}
.repo.open-in-dock{background:var(--accent-soft);border-color:var(--accent)}
.sc{display:inline-flex;align-items:center;font:10px var(--mono);line-height:1;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink2);white-space:nowrap;vertical-align:middle;max-width:100%}
.sc>*{padding:2px 5px;border-left:1px solid var(--line2)}
.sc>*:first-child{border-left:0;padding-left:6px}
.sc .dot{width:7px;height:7px;padding:0;margin:0 -1px 0 6px;border-left:0}
.sc .ag{color:var(--ink);font-weight:600}
.sc .hs{color:var(--ink3)}
.sc.working .ac{color:var(--ok)} .sc.blocked .ac{color:var(--warn);font-weight:600} .sc.with .ac{color:var(--accent);font-weight:600} .sc.idle .ac,.sc.scheduled .ac{color:var(--ink3)}
.sc .pane{color:var(--accent);font:inherit;padding:2px 7px 2px 5px;border-left:1px solid var(--line2);border-radius:0 999px 999px 0}
.sc .pane:hover{background:var(--accent-soft)}
.sc.hostlit{border-color:var(--accent);background:var(--accent-soft)} .sc.hostdim{opacity:.4}
.el{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0 0;font-size:12px}
.el .en{font-weight:600;min-width:0}
.leave{font:10.5px var(--mono);color:var(--ink3)} .leave.soon{color:var(--warn)}

.chip{display:inline-flex;align-items:center;font:10.5px var(--mono);padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--surface2)}
.chip.g{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)} .chip.x{border-color:var(--accent);color:var(--accent)}
.unit .it{flex-basis:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 0 0 6px}
.unit{flex-wrap:wrap}
.wi{cursor:default}

.explore-bar select{padding:2px 6px;font-size:12px}
.explore-bar .n{font:600 11px var(--mono);color:var(--accent)}
.capture .cf label{display:inline-flex;align-items:center;gap:5px;color:var(--ink2);cursor:pointer}
.capture .cf input{margin:0;accent-color:var(--accent)}
.capture .will{font:11.5px var(--mono);color:var(--ink3)} .capture .will b{color:var(--ink);font-weight:600}
.gl{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.gi{display:inline-flex;align-items:center;gap:2px;font:11.5px var(--mono);padding:2px 4px 2px 8px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft)}
.gi .gx{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);font-size:12px;line-height:1}
.gi .gx:hover{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
.deliv{width:100%;border-collapse:collapse;font-size:12px}
.deliv th{text-align:left;font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:0 8px 4px 0;border-bottom:1px solid var(--line2)}
.deliv td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line2);vertical-align:top;color:var(--ink2)}
.deliv td:first-child{color:var(--ink);font-weight:600} .deliv td.mono{font-size:11px}
.origin{font:10px var(--mono);padding:1px 6px;border-radius:4px;white-space:nowrap;background:var(--surface2);color:var(--ink3);border:1px solid var(--line2)}
.origin.override{color:var(--warn);border-color:var(--warn)}
.lin{display:flex;flex-direction:column}
.lin .ln{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:baseline;padding:5px 0 5px 14px;position:relative;font-size:12.5px}
.lin .ln::before{content:"";position:absolute;left:3px;top:0;bottom:0;width:2px;background:var(--line2)}
.lin .ln::after{content:"";position:absolute;left:0;top:11px;width:8px;height:8px;border-radius:50%;background:var(--ink3);border:2px solid var(--surface)}
.lin .ln:first-child::before{top:11px} .lin .ln:last-child::before{bottom:auto;height:11px} .lin .ln.here::after{background:var(--accent)}
.lin .lk-k{font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.lin .lk-w{font-weight:600} .lin .lk-t{color:var(--ink2);margin-left:6px}
.wrong{margin-top:10px;padding:10px 12px;border:1px dashed var(--crit);border-radius:8px;background:color-mix(in srgb,var(--crit) 6%,transparent)}
.wrong h4{font-size:12.5px;color:var(--crit);margin-bottom:3px} .wrong p{margin:0 0 6px;font-size:12px;color:var(--ink2)}
.vd{font:600 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--ink3);white-space:nowrap}
.vd.satisfied{color:var(--ok);border-color:var(--ok)} .vd.not-satisfied{color:var(--crit);border-color:var(--crit)} .vd.stale{color:var(--warn);border-color:var(--warn)} .vd.unjudged{color:var(--ink2)} .vd.not-applicable{color:var(--ink3);border-style:dashed}
.claims{display:flex;flex-direction:column}
.claim{display:grid;grid-template-columns:1fr auto auto auto auto;gap:4px 8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.claim .cn{font:600 12px var(--mono)} .claim .ce{grid-column:1/-1;color:var(--ink3);font-size:11.5px}
.claim select{padding:2px 6px;font:11.5px var(--mono)}
.kc{display:flex;flex-wrap:wrap;gap:4px}
.mark.attention.gone{color:var(--crit);border-color:var(--crit)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.working{background:var(--ok);animation:pulse 1.6s ease-in-out infinite}
.dot.starting{background:transparent;border:2px dashed var(--ok);width:9px;height:9px;box-sizing:border-box}
.dot.idle{background:transparent;border:2px solid var(--ink3);width:9px;height:9px;box-sizing:border-box}
.dot.blocked{background:var(--warn);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 30%,transparent)}
.dot.failed,.dot.gone{background:var(--crit)}
.dot.stopped{background:var(--ink3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- frame ---------- */
.wrap{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);flex:1 1 auto;min-height:0}
.rail{border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:10px 12px 60px}
.board{display:flex;flex-direction:column;position:relative;overflow:hidden;min-width:0}
.board-h{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line2);background:var(--surface2);font-size:12px;color:var(--ink3);min-height:36px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{padding:3px 10px;font-size:12px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.board-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.board-h label{display:inline-flex;align-items:center;gap:5px;color:var(--ink2);cursor:pointer}
.board-h input[type=checkbox]{margin:0;accent-color:var(--accent)}
.lanes{flex:1;min-height:0;display:grid;grid-template-columns:minmax(225px,.95fr) minmax(185px,.6fr) minmax(330px,1.45fr) minmax(215px,.9fr)}
.map{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px}
.map[hidden],.lanes[hidden]{display:none}
.map-stage-wrap{position:relative;overflow:auto;background:radial-gradient(circle at 1px 1px,var(--line2) 1px,transparent 1.5px) 0 0/22px 22px,var(--bg)}
.map-stage{position:relative;width:980px;height:690px;transform-origin:0 0}
.map-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.map-stage .edge{fill:none;stroke:var(--ink3);stroke-width:1.4;marker-end:url(#arrow);opacity:.75}
.map-stage .edge.direct{stroke-dasharray:4 3}
.map-stage .edge.dim{opacity:.15}
.map-stage .edge.changed{stroke:var(--warn);stroke-width:2;opacity:1}
.map-stage .edge.removed{stroke:var(--crit);stroke-dasharray:3 3;opacity:1}
.map-stage .elabel{font:10px var(--mono);fill:var(--ink3)}
.map-stage .elabel.changed{fill:var(--warn)} .map-stage .elabel.removed{fill:var(--crit)}
.node{position:absolute;width:190px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 9px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:opacity .15s}
.node.ext{width:150px;border-style:dashed;background:var(--surface2)}
.node .nh{display:flex;align-items:baseline;gap:6px}
.node .nk{font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.node .nn{font-weight:800;font-size:13px}
.node .tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.node .tag{font:10px var(--mono);border:1px solid var(--line2);border-radius:3px;padding:0 4px;color:var(--ink2);background:var(--surface2)}
.node .tag.kind{border-color:var(--accent);color:var(--accent);background:transparent}
.node .cs{display:flex;align-items:center;gap:6px;margin-top:6px;font:11px var(--mono);color:var(--ink2)}
.node .cs .um{font-weight:700;padding:0 6px;border-radius:999px;border:1px solid var(--line);color:var(--ink3)}
.node .cs .um.some{color:var(--warn);border-color:var(--warn)} .node .cs .um.many{color:#fff;background:var(--crit);border-color:var(--crit)}
.node .marks{margin-top:5px}
.node.lit{background:var(--lit);border-color:var(--lit-line)}
.node.open-in-dock{box-shadow:inset 0 0 0 1px var(--accent)}
.node.inscope{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.node.outscope{opacity:.45}
.node.dim{opacity:.3}
.node.changed{border-color:var(--warn);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 35%,transparent);opacity:1}
.node .rnote{margin-top:6px;font:10px var(--mono);color:var(--warn);border-top:1px dashed var(--warn);padding-top:4px;line-height:1.35}
.node .rnote.rm{color:var(--crit);border-color:var(--crit)}
.node .due{font:600 10px var(--mono);color:var(--warn);margin-top:4px}
.node.new{border-color:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 30%,transparent)}
.map-panel{border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:10px 12px 40px;font-size:12.5px}
.map-panel h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:10px 0 6px;display:flex;gap:8px;align-items:baseline}
.map-panel h3 .r{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:500;font-size:11px}
.cl-list{display:flex;flex-direction:column;gap:2px;max-height:38vh;overflow:auto;border:1px solid var(--line2);border-radius:6px;padding:4px}
.cl-list button{display:flex;align-items:center;gap:6px;text-align:left;padding:3px 6px;border-radius:4px;font:11.5px var(--mono);color:var(--ink)}
.cl-list button:hover{background:var(--surface2)}
.cl-list button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cl-list button .n{margin-left:auto;font-size:10px;color:var(--ink3)}
.scope-box{border:1px solid var(--accent);border-radius:8px;padding:8px 10px;background:color-mix(in srgb,var(--accent-soft) 60%,transparent);margin-top:6px}
.scope-box .cn{font:700 12.5px var(--mono);color:var(--accent);word-break:break-all}
.scope-box .rule{font:700 13px var(--mono);margin:6px 0 2px}
.scope-box .rule.named{color:var(--warn)}
.scope-box .set{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.scope-box .set .lk.on{color:var(--accent);border-color:var(--accent)} .scope-box .set .lk.off{opacity:.5;text-decoration:line-through}
.scope-box .acts{display:flex;gap:6px;flex-wrap:wrap}
.addrepo{border:1px dashed var(--ok);border-radius:8px;padding:8px 10px;margin-top:8px}
.addrepo .grid{display:flex;flex-wrap:wrap;gap:4px 8px;margin:4px 0 8px}
.addrepo label{display:inline-flex;align-items:center;gap:4px;font:11.5px var(--mono);cursor:pointer}
.addrepo input[type=checkbox]{margin:0;accent-color:var(--ok)}
.addrepo input[type=text]{width:100%;font:12px var(--mono)}
.addrepo .found{font-size:12px;color:var(--ink2);margin:6px 0}
.addrepo .found b{color:var(--ok)}
.rev-list{display:flex;flex-direction:column;gap:3px}
.rev-list div{font:11.5px var(--mono);color:var(--ink2);padding:3px 6px;border-left:2px solid var(--warn)}
.rev-list div.rm{border-left-color:var(--crit)}
.lane{overflow:auto;padding:10px 10px 60px;border-right:1px solid var(--line2)}
.lane:last-child{border-right:0}
.lane.plan{background:repeating-linear-gradient(-45deg,transparent 0 8px,var(--accent-hatch) 8px 9px),var(--bg);border-left:1px dashed var(--line);border-right:1px dashed var(--line)}
.lane-h{display:flex;align-items:baseline;gap:8px;margin:2px 2px 10px;flex-wrap:wrap}
.lane-h h2{font-size:14px;font-weight:800;letter-spacing:-.01em}
.lane-h .sub{font-size:11.5px;color:var(--ink3)}
.lane-h .n{margin-left:auto;font:600 11px var(--mono);color:var(--ink3)}
.lane-h .gate{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 5px}
.lane-h .ro{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:14px 2px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.sec-h .r{letter-spacing:0;text-transform:none;font-weight:500;font-size:11.5px}
.empty{color:var(--ink3);font-size:12.5px;padding:6px 4px}

/* ---------- rail ---------- */
.rail-h{display:flex;align-items:baseline;gap:8px;margin:2px 2px 8px}
.rail-h h2{font-size:14px;font-weight:800}
.rail-h .sub{font-size:11.5px;color:var(--ink3)}
.grp{display:flex;align-items:baseline;gap:4px 8px;margin:12px 2px 6px;flex-wrap:wrap}
.grp .g{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800}
.grp.approve .g{color:var(--accent)} .grp.decide .g{color:var(--warn)} .grp.answer .g{color:var(--crit)} .grp.attention .g{color:var(--ink2)} .grp.since .g{color:var(--ink3)}
.grp .r{font-size:11.5px;color:var(--ink3)}
.grp .btn{margin-left:auto;flex:none}
.card{position:relative;border:1px solid var(--line);border-left-width:3px;border-radius:6px;background:var(--surface);padding:8px 10px 8px 12px;margin-bottom:6px;cursor:pointer;transition:transform .15s,opacity .2s}
.card.g-approve{border-left-color:var(--accent)} .card.g-decide{border-left-color:var(--warn)} .card.g-answer{border-left-color:var(--crit)}
.card.focused{background:var(--lit);border-color:var(--lit-line);border-left-color:var(--accent)}
.card.open-in-dock{box-shadow:inset 0 0 0 1px var(--accent)}
.card.inflight{opacity:.6}
.card.gone{transform:translateX(-12px);opacity:0}
.card.refused{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.card .ch{display:flex;align-items:center;gap:7px;font-size:11px;margin-bottom:3px}
.card .n{font:700 13px var(--mono);color:var(--ink)}
.card .kind{color:var(--ink3);font-weight:600}
.card .ph{margin-left:auto;font:500 10.5px var(--mono);color:var(--ink3);border:1px solid var(--line2);border-radius:3px;padding:0 5px;white-space:nowrap}
.card .ph.plan{color:var(--accent);border-color:var(--accent)}
.card .title{font-size:13.5px;font-weight:700;line-height:1.3}
.card .title .pre{color:var(--ink3);font-weight:500}
.card .tail{color:var(--ink2);font-size:12px;margin-top:2px}
.card .q{font-style:italic;color:var(--ink);margin-top:4px;font-size:13px}
.card .acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.card .acts .hint{margin-left:auto;display:flex;gap:3px}
.argbox:empty{display:none}
.argbox{margin-top:8px}
.field{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.field input,.field textarea,.field select{flex:1;min-width:140px}
.chores{display:flex;flex-direction:column;gap:4px;margin:6px 0}
label.chore{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-size:12.5px;cursor:pointer;background:var(--surface2)}
label.chore.on{border-color:var(--accent);background:var(--accent-soft)}
label.chore .lt{font:600 11px var(--mono);color:var(--ink3);width:12px}
label.chore .f{margin-left:auto;font:11px var(--mono);color:var(--ink3)}
.flight{display:none;align-items:center;gap:6px;font:11.5px var(--mono);color:var(--ink2);margin-top:6px}
.card.inflight .flight{display:flex}
.spin{width:10px;height:10px;border:2px solid var(--ink3);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.att{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:6px;background:var(--surface);padding:7px 10px;margin-bottom:6px;font-size:12.5px;cursor:pointer}
.att.crit{border-left-color:var(--crit)}
.att.focused{background:var(--lit);border-color:var(--lit-line)}
.att .acts{display:flex;gap:5px;margin-top:6px}
.since{list-style:none;margin:0;padding:0}
.since li{display:flex;gap:8px;align-items:baseline;padding:4px 2px;border-bottom:1px solid var(--line2);font-size:12.5px}
.since li.new{background:var(--lit)}
.since .v{font:600 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;width:64px;flex:none;color:var(--ink2)}
.since .v.landed,.since .v.merged{color:var(--ok)} .since .v.dropped{color:var(--crit)} .since .v.answered,.since .v.rebuilt{color:var(--accent)}
.own{display:inline-flex;align-items:center;font:10px var(--mono);border:1px solid var(--line);border-radius:999px;padding:0 6px;color:var(--ink2);white-space:nowrap} .own.role{border-style:dashed} .own.you{border-color:var(--accent);color:var(--accent)} .own.none{border-style:dashed;color:var(--ink3)} .card .ch .own{margin-left:auto} .card .ch .own + .ph{margin-left:0}
.rail-h .seg.mine{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden} .rail-h .seg.mine button{font:600 11px var(--sans);padding:2px 8px;color:var(--ink2)} .rail-h .seg.mine button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.su-pool .su-hh .dot{background:var(--accent)} .su-phs{display:flex;flex-direction:column;gap:4px;margin-top:4px} .su-ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;padding:4px 0;border-top:1px solid var(--line2)} .su-ph .hm{font:11px var(--mono);color:var(--ink3)} .su-ph .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block} .su-ph .dot.gone{background:var(--warn)} .host.pool{border-style:dashed}
.since .w{flex:1;min-width:0}
.since .t{font:11px var(--mono);color:var(--ink3);white-space:nowrap}

/* ---------- board objects ---------- */
/* session rows: planning-in-progress and explorations keep this form */
.sessrow{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:8px 10px;margin-bottom:8px;cursor:pointer}
.sessrow.lit{background:var(--lit);border-color:var(--lit-line)}
.sessrow.open-in-dock{box-shadow:inset 0 0 0 1px var(--accent)}
.sessrow .oh{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sessrow .ok{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.sessrow .on{font-weight:700;font-size:13px}
.sessrow .os{margin-left:auto;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.sessrow .ot{color:var(--ink2);font-size:12px;margin-top:2px}
.sessrow.explore{border-color:var(--accent)} .sessrow.explore.done{opacity:.6;border-style:dashed;border-color:var(--line)}
/* sheet: a document (proposal, baseline); taller than wide, title line, section rules, mono metadata */
.sheet{position:relative;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink2);border-radius:1px;padding:10px 12px 9px;margin:0 8px 14px 4px;min-height:190px;box-shadow:3px 3px 0 var(--line2);cursor:pointer;display:flex;flex-direction:column}
.sheet.lit{background:var(--lit);border-top-color:var(--lit-line);box-shadow:3px 3px 0 var(--lit-line)}
.sheet.open-in-dock{outline:1px solid var(--accent);outline-offset:-1px}
.sheet.deferred{opacity:.55;border-style:dashed;border-top-style:dashed;box-shadow:none}
.sheet .sh-k{font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.sheet .sh-title{font-family:var(--disp,var(--sans));font-size:15px;font-weight:800;letter-spacing:-.01em;border-bottom:1px solid var(--ink);padding:1px 0 4px;margin-bottom:5px;line-height:1.2}
.sheet .sh-meta{font:11px var(--mono);color:var(--ink3);line-height:1.5}
.sheet .sh-sec{border-top:1px solid var(--line2);padding:5px 0 4px;font-size:12px}
.sheet .sh-h{display:flex;gap:6px;align-items:baseline;font:600 10.5px var(--mono);color:var(--ink2);margin-bottom:1px}
.sheet .sh-h .new{color:var(--accent)}
.sheet .sh-body{color:var(--ink2)}
.sheet .sh-foot{margin-top:auto;padding-top:6px;border-top:1px solid var(--line2);font:11px var(--mono);color:var(--ink3)}
.sheet .sh-foot b{color:var(--accent);font-weight:600}
/* slip: a unit proposal hanging off the sheet above it */
.slip{position:relative;margin:-8px 8px 12px 30px;background:var(--surface2);border:1px solid var(--line);border-left:0;border-radius:0 3px 3px 0;padding:5px 9px 6px;font-size:12px;cursor:pointer}
.slip::before{content:"";position:absolute;left:-16px;top:-8px;width:15px;height:18px;border-left:2px solid var(--ink3);border-bottom:2px solid var(--ink3);border-radius:0 0 0 8px}
.slip::after{content:"";position:absolute;left:-1px;top:6px;bottom:6px;width:2px;background:var(--ink3);border-radius:1px}
.slip.lit{background:var(--lit);border-color:var(--lit-line)} .slip.lit::before,.slip.lit::after{border-color:var(--lit-line);background:var(--lit-line)}
.slip.open-in-dock{outline:1px solid var(--accent);outline-offset:-1px}
.slip .sl-k{font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-right:6px}
.slip .sl-n{font-weight:700;font-size:12.5px}
.slip .sl-to{display:block;font:11px var(--mono);color:var(--ink2);margin-top:2px}
.slip .sl-to .arrow{color:var(--ink3)}
/* thread: an intent is a line off the books; a vertical stroke with elaborations as beads, no box */
.thread{position:relative;padding:2px 4px 4px 4px;margin:0 0 12px;cursor:pointer}
.thread .th-head{display:flex;align-items:center;gap:4px 7px;position:relative;padding-left:20px;min-height:22px;flex-wrap:wrap}
.thread .th-head::before{content:"";position:absolute;left:3px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--ink2)}
.thread .th-head .pickbox{position:absolute;left:0;top:4px;width:14px;height:14px;margin:0;accent-color:var(--accent)}
.thread.pickable .th-head::before{display:none}
.thread .th-head .pickbox:checked~.th-name{color:var(--accent)}
.thread .th-k{font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.thread:hover .th-head::before,.thread .th-head .pickbox:checked~*{}
.thread .th-name{font-weight:700;font-size:13px;padding:0 3px;border-radius:3px;flex:1 1 auto;min-width:0}
.thread .th-state{margin-left:auto;font:11px var(--mono);color:var(--ink3);white-space:nowrap}
.thread .th-line{margin-left:8px;border-left:2px solid var(--ink2);padding:2px 0 4px 16px;min-height:14px}
.thread .th-note{color:var(--ink2);font-size:12px;margin:0 0 3px}
.thread .bead{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:3px 0;font-size:12px}
.thread .bead::before{content:"";position:absolute;left:-22px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--surface);border:2px solid var(--ink2);box-sizing:border-box}
.thread .bead.working::before,.thread .bead.starting::before,.thread .bead.with::before{background:var(--ok);border-color:var(--ok)}
.thread .bead.idle::before{background:var(--surface);border-color:var(--ink3)}
.thread .bead.done::before{background:var(--ink3);border-color:var(--ink3)}
.thread .bead.queued::before{border-style:dashed}
.thread .bead.gather::before,.thread .bead.explore::before{background:var(--accent-soft);border-color:var(--accent)}
.thread .bead .en{font-weight:600}
.thread .bead{cursor:pointer;border-radius:4px}
.thread .bead:hover .en{color:var(--accent)}
.thread .bead.open-in-dock .en{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft);border-radius:3px}
.thread .bead .bk{font:600 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);flex:none}
.thread .bead .bs{font:11px var(--mono);color:var(--ink3)}
.thread .bead .bs.leave.soon{color:var(--warn)}
.thread .bead .bead-chip{display:inline-flex}
@media (max-width:1400px){.thread .bead .bead-chip{flex-basis:100%}}
.explore-foot{position:sticky;bottom:-60px;margin:12px -10px -60px;padding:8px 10px 66px;background:var(--surface);border-top:2px solid var(--accent);box-shadow:0 -8px 18px rgba(0,0,0,.08);z-index:3}
.explore-foot .ef-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
.explore-foot .ef-row b{font-family:var(--mono);font-size:12px}
.explore-foot .ef-note{font-size:11.5px;color:var(--ink2);margin-top:5px;line-height:1.4}
.explore-foot .seg button{padding:2px 8px;font-size:11.5px}
.dk-h.dk-bead{box-shadow:inset 4px 0 0 var(--ink2);padding-left:22px}
.dk-h.dk-bead h2::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink2);background:var(--surface);margin:0 8px 2px 0;vertical-align:middle}
.dk-h.dk-bead .tail button{font:inherit;color:var(--accent);font-weight:600}
.records{font:11.5px var(--mono);color:var(--ink2)} .records div{padding:2px 0;border-top:1px solid var(--line2)} .records div:first-child{border-top:0}
.thread .th-line.cap::after{content:"";display:block;width:16px;border-top:2px solid var(--ink2);margin:4px 0 0 -17px}
.thread .th-tail{padding-left:24px;margin-top:2px}
.thread.closed{opacity:.6} .thread.closed .th-name{text-decoration:line-through;text-decoration-color:var(--ink3);text-decoration-thickness:1px}
.thread.lit .th-name{background:var(--lit);box-shadow:0 0 0 2px var(--lit-line)} .thread.lit .th-line{border-color:var(--lit-line)} .thread.lit .th-head::before{background:var(--lit-line)}
.thread.open-in-dock .th-line{box-shadow:-3px 0 0 var(--accent-soft)}
/* ledger: a bolt is a machine; flat, square, units as a chain left to right */
.ledger{background:var(--surface2);border:1px solid var(--ink3);border-radius:0;margin-bottom:12px;cursor:pointer;font-size:12px}
.ledger.lit{background:var(--lit);border-color:var(--lit-line);box-shadow:0 0 0 2px var(--lit)}
.ledger.open-in-dock{outline:1px solid var(--accent);outline-offset:-1px}
.ledger.landing{border-color:var(--ok)}
.ledger .lg-head{display:flex;align-items:baseline;gap:8px;padding:5px 9px;background:var(--surface);border-bottom:1px solid var(--ink3);font:600 12px var(--mono)}
.ledger .lg-head .lg-repo{color:var(--ink3);font-weight:400}
.ledger .lg-head .lg-run{margin-left:auto;font-weight:400;color:var(--ink2);white-space:nowrap}
.ledger .lg-head .lg-run .landing{color:var(--ok);font-weight:600}
.ledger .lg-chain{display:flex;flex-wrap:wrap;align-items:flex-start;padding:8px 6px 4px}
.ledger .lg-unit{border:1px solid var(--line);background:var(--surface);padding:3px 7px;font:11.5px var(--mono);white-space:nowrap;max-width:100%;margin-bottom:4px}
.ledger .lg-unit.merged{color:var(--ink3);background:transparent}
.ledger .lg-unit.merged::before{content:"✓ ";color:var(--ok)}
.ledger .lg-unit.building{border:1.5px solid var(--accent);color:var(--ink);white-space:normal;flex-basis:100%;padding:3px 5px 5px;min-width:0}
.ledger .lg-unit.building .lg-un{font-weight:700}
.ledger .lg-unit.building .lg-ut{color:var(--ink3);margin-left:6px}
.ledger .lg-unit.queued{border-style:dashed;color:var(--ink2)}
.ledger .lg-arrow{color:var(--ink3);font:11px var(--mono);padding:3px 4px;margin-bottom:4px}
.ledger .lg-sess{display:flex;flex-direction:column;gap:3px;margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
.ledger .lg-sess .it{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
.ledger .lg-sess .sc{font-size:9.5px;max-width:100%}
.ledger .lg-sess .sc>*{padding:2px 4px}
.ledger .lg-mach{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 9px;border-top:1px dashed var(--ink3);font:11px var(--mono);color:var(--ink3)}
.ledger .lg-foot{display:flex;gap:10px;padding:5px 9px;border-top:1px solid var(--ink3);font:11px var(--mono);color:var(--ink3);overflow:hidden;background:var(--surface)}
.ledger .lg-foot .ep{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ledger .marks{padding:0 9px 8px;margin-top:2px}
/* record: a landed bolt is history; no border, muted, PR and checks as a stamp */
.record{padding:8px 4px 10px;margin-bottom:2px;border-bottom:1px solid var(--line2);color:var(--ink2);cursor:pointer;background:transparent}
.record.lit{background:var(--lit);border-radius:4px}
.record.open-in-dock{box-shadow:inset 2px 0 0 var(--accent)}
.record .rc-head{display:flex;align-items:baseline;gap:8px}
.record .rc-name{font-weight:600;color:var(--ink2);font-size:13px}
.record .rc-at{margin-left:auto;font:11px var(--mono);color:var(--ink3);white-space:nowrap}
.record .rc-stamp{display:inline-block;margin:6px 0 2px;border:1.5px solid var(--ink3);border-radius:3px;padding:1px 7px;font:700 10.5px var(--mono);letter-spacing:.06em;color:var(--ink3);transform:rotate(-2deg);opacity:.85;text-transform:uppercase}
.record .rc-stamp.bad{color:var(--crit);border-color:var(--crit);opacity:1}
.record .rc-env{font:11px var(--mono);color:var(--ink3);margin-top:3px}
.record .rc-env a{color:var(--ink2);text-decoration:none;border-bottom:1px dotted var(--ink3);margin-right:8px}
.record .leave{margin-top:5px}
.record .leave.soon{color:var(--warn)}
/* quote: a signal; no box, the quotation and its left rule, curation's move under it */
.quote{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:7px 0 4px;font-size:12px;color:var(--ink2)}
.quote q{quotes:"“" "”";font-style:italic;color:var(--ink)}

.quote .qm b{color:var(--ink2);font-weight:500}
.quote .qm .un{color:var(--warn)}
.quote.live{border-left-color:var(--accent)} .quote.live .qm b{color:var(--accent)}
.marks{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.thread .marks{padding-left:24px}
.mark{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--surface2)}
.mark.approve{color:var(--accent);border-color:var(--accent)} .mark.decide{color:var(--warn);border-color:var(--warn)} .mark.answer{color:var(--crit);border-color:var(--crit)} .mark.attention{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.mark.focused{background:var(--lit)}
.sess{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.wi{display:inline-flex;align-items:center;gap:5px;font:11.5px var(--mono);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;background:var(--surface2);white-space:nowrap}
.wi .h{color:var(--ink3)}
.wi.hostlit{border-color:var(--accent);background:var(--accent-soft)}
.wi.hostdim{opacity:.4}
.units{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.unit{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:2px 0}
.unit .un{font-weight:600}
.unit .ut{font:11px var(--mono);color:var(--ink3)}
.unit.merged .un{color:var(--ink3);font-weight:500}
.unit.queued .un{color:var(--ink2)}
.unit .sess{margin:0 0 0 auto}
.svcline{display:flex;gap:10px;font:11px var(--mono);color:var(--ink3);margin-top:6px;overflow:hidden}
.svcline .ep{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.capture{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:8px;margin-bottom:8px}
.capture textarea{width:100%;resize:vertical;min-height:44px;border:0;padding:2px 2px;background:transparent}
.capture .cf{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11.5px;color:var(--ink3)}
.capture .cf .btn{margin-left:auto}
.curation{font-size:12px;color:var(--ink2);margin:0 2px 8px;display:flex;gap:8px;flex-wrap:wrap}
.curation b{font-family:var(--mono)}
.prop .pb{display:flex;align-items:baseline;gap:6px;font-size:12.5px;margin-top:4px;flex-wrap:wrap}
.prop .pbn{font:600 12px var(--mono)}
.prop .pbn.new{color:var(--accent)}
.prop .pus{color:var(--ink2);font-size:12px}
.arrow{color:var(--ink3)}
.landed .links{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.lk{display:inline-flex;align-items:center;gap:4px;font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink2)}
.lk.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))} .lk.bad{color:var(--crit);border-color:var(--crit)} .lk.pend{color:var(--warn);border-color:var(--warn)}
.sig{margin-top:6px;font-size:12px;border-left:2px solid var(--line);padding-left:8px}
.sig i{color:var(--ink)}
.sig .mv{display:block;font:11px var(--mono);color:var(--ink3);margin-top:2px}
.sig .mv b{color:var(--ink2)}
.sig .mv .un{color:var(--warn)}
ul.sigs{list-style:none;margin:0;padding:0}
ul.sigs li{margin:0}

/* ---------- book: an mdBook viewer the page draws; tree, one chapter at a time, claim blocks as the flywheel renders them ---------- */
.book{flex:1;min-height:0;display:grid;grid-template-columns:240px minmax(0,1fr)}
.book[hidden]{display:none}
.bk-tree{border-right:1px solid var(--line);background:var(--surface2);overflow:auto;padding:10px 0 30px;font-size:12.5px}
.bk-tree .bt-h{padding:0 12px 10px;border-bottom:1px solid var(--line2);margin-bottom:6px}
.bk-tree .bt-title{font:800 14px var(--mono);margin-top:2px}

.bk-tree li>button{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;padding:5px 12px;font-weight:600;color:var(--ink2);border-left:3px solid transparent}

.bk-tree .bt-sub li>button::before{content:"";position:absolute;left:22px;top:0;bottom:0;border-left:1px solid var(--line)}
.bk-tree .bt-sub li>button.cl{font-size:11.5px}
.bk-tree .bt-sub li>button .v{color:var(--ink3);font:10.5px var(--mono)}
.bk-tree .bt-sub li>button.lit{background:var(--lit);color:var(--ink)}
.bk-changes{margin:6px 8px 10px;border:1px solid var(--warn);border-radius:6px;padding:6px 8px;background:color-mix(in srgb,var(--warn) 8%,transparent)}
.bk-changes .bc-h{display:flex;gap:8px;align-items:baseline;font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--warn);margin-bottom:4px}
.bk-changes .bc-h span{margin-left:auto}
.bk-changes button{display:block;width:100%;text-align:left;font:11.5px var(--mono);color:var(--ink2);padding:3px 4px;border-left:2px solid var(--warn);margin:2px 0;line-height:1.35}
.bk-changes button:hover{background:var(--surface)}
.bk-tree .bt-foot{padding:10px 12px 0;border-top:1px solid var(--line2);margin-top:10px;font-size:11.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 10px}
.bk-tree .bt-foot .eyebrow,.bk-tree .bt-foot .ot{flex-basis:100%}
.bk-tree .bt-foot .ot{font-size:11px;color:var(--ink3);line-height:1.4;margin-top:4px}
.vh{display:inline-flex;align-items:center;gap:5px;font:11px var(--mono);color:var(--ink2)}
.vdot{display:inline-block;width:9px;height:9px;border-radius:50%;box-sizing:border-box;background:var(--ink3);flex:none}
.vdot.satisfied{background:var(--ok)} .vdot.not-satisfied{background:var(--crit)} .vdot.stale{background:var(--warn)} .vdot.unjudged{background:transparent;border:2px solid var(--ink3)} .vdot.not-applicable{background:transparent;border:1.5px dashed var(--ink3)}
.bk-content{overflow:auto;background:var(--surface);padding:18px 28px 80px}
.bk-page{max-width:calc(72ch + 96px);margin:0 auto;padding-left:96px;position:relative}
.bk-crumb{display:flex;gap:8px;align-items:baseline;font:11px var(--mono);color:var(--ink3);margin-bottom:6px;flex-wrap:wrap}
.bk-block{position:relative;margin:0 0 12px;border-radius:4px;transition:background .15s}
.bk-block.h1{margin-bottom:16px}
.bk-block h1{font-size:24px;font-weight:800;letter-spacing:-.01em;margin:0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.bk-block h2{font-size:17px;font-weight:800;margin:22px 0 6px;display:flex;gap:8px;align-items:baseline}
.bk-block .anchor{color:var(--ink3);text-decoration:none;font:400 13px var(--mono);opacity:.45}

.bk-block.lit.changed{background:var(--lit);box-shadow:0 0 0 6px var(--lit)}

.bk-block.h1 .gut{top:6px}
.chg-note{display:block;font:10.5px var(--mono);color:var(--warn);margin-top:4px}
.claim-block{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:8px 12px 9px;background:var(--surface2);margin-top:8px}
.claim-block.proposed{border-style:dashed;border-left-style:dashed;border-left-color:var(--ink3);background:transparent}
.claim-block .cb-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.claim-block .cb-k{font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.claim-block .cb-n{font:700 13px var(--mono)}
.claim-block .cb-v{font:600 11.5px var(--mono);color:var(--ink2)}
.claim-block .cb-state{margin-left:auto;font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--ink3)}
.claim-block .cb-state.standing{color:var(--accent);border-color:var(--accent)}
.claim-block .cb-state.proposed{border-style:dashed}
.claim-block .cb-t{font-size:13.5px;line-height:1.55;margin:6px 0;max-width:68ch}
.claim-block .cb-att{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font:11px var(--mono);color:var(--ink3);margin-top:4px}
.claim-block .cb-scope{font:11px var(--mono);color:var(--ink3);margin-top:4px}

.bk-foot{display:flex;justify-content:space-between;gap:8px;margin-top:30px;padding-top:12px;border-top:1px solid var(--line2)}
/* library: the organization's books, over the board */
.library{position:absolute;inset:0;z-index:10;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto}

.lib-row{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:10px 8px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:6px}
.lib-row:hover{background:var(--surface2)} .lib-row.on{background:var(--accent-soft)}
.lib-row .ln{font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.lib-row .lm b{color:var(--ink);font-weight:600} .lib-row .lm b.warn{color:var(--warn)}
.lib-row .la{align-self:center}
.rowbtn{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line2)}
.rowbtn:last-child{border-bottom:0}
.rowbtn .grow{flex:1;min-width:0;color:var(--ink2)}

/* ---------- dock ---------- */
.scrim{position:absolute;inset:0;background:transparent;display:none;z-index:8}

.dock{position:absolute;top:0;right:0;bottom:0;width:min(var(--dock),calc(100% - 200px));background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:9;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .2s cubic-bezier(.2,.7,.3,1)}
body.docked .dock{transform:none}
.dk-h{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.dk-h.dk-sheet{border-top:3px solid var(--ink2);background:var(--surface)} .dk-h.dk-sheet h2{border-bottom:1px solid var(--ink);padding-bottom:5px} .dk-h.dk-sheet .tail{font:11.5px var(--mono)}
.dk-h.dk-slip{background:var(--surface2);box-shadow:inset 4px 0 0 var(--ink3)}
.dk-h.dk-thread{box-shadow:inset 4px 0 0 var(--ink2);padding-left:22px} .dk-h.dk-thread h2::before{content:"● ";color:var(--ink2);font-size:12px;vertical-align:middle}
.dk-h.dk-ledger{background:var(--surface2);border-bottom:1px solid var(--ink3);border-top:1px solid var(--ink3)} .dk-h.dk-ledger h2{font-family:var(--mono);font-size:16px;letter-spacing:0}
.dk-h.dk-record{background:transparent;border-bottom:1px solid var(--line2)} .dk-h.dk-record h2{color:var(--ink2);font-weight:600}
.dk-b .lg-chain{padding:0;margin-bottom:4px} .dk-b .thread{cursor:default}
.dk-h .row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3)}
.dk-h .row .n{font:700 14px var(--mono);color:var(--ink)}
.dk-h .row .kind{font-weight:700;color:var(--ink2)}
.dk-h .row .ph{font:500 10.5px var(--mono);border:1px solid var(--line2);border-radius:3px;padding:0 5px}
.dk-h .nav{margin-left:auto;display:flex;align-items:center;gap:6px}
.dk-h .x{font-size:18px;line-height:1;color:var(--ink3);padding:0 4px}
.dk-h h2{font-size:18px;font-weight:800;letter-spacing:-.01em;margin-top:6px}

/* --- scope rules over the set of built repositories --- */
function ruleOf(set){
  const all = builtRepos().map(r => r.id); const eq = (a,b) => a.length===b.length && a.every(x => b.includes(x));
  const ids = [...set].filter(id => all.includes(id));
  if(!ids.length) return 'named';
  if(eq(ids, all)) return 'all';
  const kinds = [...new Set(builtRepos().flatMap(r => r.kinds))]; for(const k of kinds){ if(eq(ids, all.filter(id => repo(id).kinds.includes(k)))) return 'kind:'+k; }
  const caps = [...new Set(builtRepos().flatMap(r => r.caps))]; for(const c of caps){ if(eq(ids, all.filter(id => repo(id).caps.includes(c)))) return 'capability:'+c; }
  return 'named';
}
function reposMatching(rule, names){ const all = builtRepos(); if(rule==='all') return all.map(r => r.id); if(rule.startsWith('kind:')) return all.filter(r => r.kinds.includes(rule.slice(5))).map(r => r.id); if(rule.startsWith('capability:')) return all.filter(r => r.caps.includes(rule.slice(11))).map(r => r.id); return names || []; }
function allClaims(){ const m = new Map(); S.repos.forEach(r => r.claims.forEach(c => { if(!m.has(c[0])) m.set(c[0], {name:c[0], rule:c[2], repos:[]}); m.get(c[0]).repos.push(r.id); })); return [...m.values()]; }
function selectClaim(name){ S.scopeSel = name; S.scopeSet = new Set(S.repos.filter(r => r.claims.some(c => c[0]===name)).map(r => r.id)); S.view = 'map'; }
function unmetOf(r){ return r.claims.filter(c => c[1]==='not satisfied').length; }

}

/* --- the proposal: each edit is its own response --- */
function closure(uid){ const P = S.proposal; const out = new Set(); const walk = id => P.units.forEach(u => { if(u.after.includes(id) && !out.has(u.id)){ out.add(u.id); walk(u.id); } }); walk(uid); return [...out]; }
function depsOf(uid){ const P = S.proposal; const out = new Set(); const walk = id => P.units.find(u => u.id===id).after.forEach(a => { if(!out.has(a)){ out.add(a); walk(a); } }); walk(uid); return [...out]; }
function unitMove(uid, toBolt, along){
  const P = S.proposal; const u = P.units.find(x => x.id===uid);
  const boltName = id => P.bolts.find(b => b.id===id).name;
  const group = along ? [uid, ...depsOf(uid), ...closure(uid)].filter((v,i,a) => a.indexOf(v)===i) : [uid];
  const crossing = P.units.filter(x => !x.dropped && !group.includes(x.id)).filter(x => x.after.some(a => group.includes(a)) || group.some(g => P.units.find(y => y.id===g).after.includes(x.id)));
  if(!along && crossing.length){
    const kin = [...depsOf(uid), ...closure(uid)].filter((v,i,a) => a.indexOf(v)===i);
    P.refusal = {uid, text:`${uid} bolt ${boltName(toBolt)} refused: ${uid} and ${kin.join(', ')} depend on each other and a dependency never crosses bolts.`, fix:{label:`move ${kin.join(', ')} along`, act:'move', to:toBolt}};
    toast(`${uid} · refused · dependency would cross bolts`, true); renderDock(); return;
  }
  P.refusal = null;
  group.forEach(id => { const x = P.units.find(y => y.id===id); if(x.bolt!==toBolt){ x.bolt = toBolt; unitResponse(`${P.n} ${id}: bolt ${boltName(toBolt)}`); } });
  render();
}
function unitNewBolt(uid, name){
  const P = S.proposal; const id = 'nb-'+name; if(!P.bolts.find(b => b.id===id)) P.bolts.push({id, name, state:'new', holds:'created by your yes'});
  unitMove(uid, id, false);
}
function unitDrop(uid, along){
  const P = S.proposal; const deps = closure(uid).filter(id => !P.units.find(u => u.id===id).dropped);
  if(!along && deps.length){ P.refusal = {uid, text:`${uid} drop refused: ${deps.join(', ')} depend on it and a unit never depends on a dropped unit.`, fix:{label:`drop ${deps.join(', ')} too`, act:'drop'}}; toast(`${uid} · refused · ${deps.join(', ')} depend on it`, true); renderDock(); return; }
  P.refusal = null;
  [uid, ...(along ? deps : [])].forEach(id => { const u = P.units.find(x => x.id===id); if(!u.dropped){ u.dropped = true; unitResponse(`${P.n} ${id}: drop`); } });
  render();
}

    `<div class="wrong"><h4>that's all wrong</h4><p>Send the plan back whole: planning runs again on atlas with your notes, this proposal is withdrawn, and the next one arrives under a new number.</p><div class="field"><textarea rows="2" data-wrong placeholder="what planning got wrong…" aria-label="notes for planning"></textarea><button class="btn pri sm" data-wrongsend="${P.n}">redo ${P.n}</button></div></div>`;
}

document.addEventListener('keydown', e => {
  const typing = e.target.matches('input,textarea,select');
  if(e.key==='Escape'){ if(typing){ e.target.blur(); const box = e.target.closest('.argbox'); if(box){ box.innerHTML=''; delete box.dataset.arg; } return; } if(S.acct){ S.acct = false; renderAcct(); return; } if(S.signedOut) return; if(!$('#log').hidden){ $('#log').hidden = true; return; } if(S.load){ S.load = false; render(); return; } if(S.library){ S.library = false; render(); return; } if(S.exploreMode){ S.exploreMode = false; S.picked.clear(); render(); return; } if(S.open){ S.hostlit = null; closeDock(); } return; }
  if(typing){ if(e.key==='Enter' && !e.shiftKey && e.target.id==='capture'){ e.preventDefault(); capture(); } if(e.key==='Enter' && e.target.matches('input') && e.target.closest('.argbox')){ e.preventDefault(); e.target.closest('.argbox').querySelector('[data-send],[data-usend]').click(); } if(e.key==='Enter' && (e.target.dataset.bname || e.target.dataset.brename)){ e.preventDefault(); if(e.target.dataset.brename) $(`[data-brenamesend="${e.target.dataset.brename}"]`).click(); else e.target.blur(); } return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k = e.key;
  if(k==='j'||k==='ArrowDown'){ e.preventDefault(); step(1); return; }
  if(k==='k'||k==='ArrowUp'){ e.preventDefault(); step(-1); return; }
  if(k==='Enter'||k==='o'){ if(S.focus){ e.preventDefault(); openDock(S.focus); } return; }
  if(k==='y'||k==='n'||k==='l'){ if(!S.focus || S.focus[0]!=='d') return; const d = dec(+S.focus.split(':')[1]); if(!d) return;
    const a = d.answers.map(x => x[0]).find(x => KEYS[x]===k);
    if(!a){ toast(`${d.n} · no "${k}" answer on this card · ${d.answers.map(x=>x[0]).join(' · ')}`, true); return; }
    e.preventDefault(); send(d.n, a); return; }
  if(k===']'||k==='['){ /* step through the beads of the intent in hand */
    let iid = null, sid = null;
    if(S.open && S.open.startsWith('v:')){ [iid, sid] = S.open.slice(2).split('/'); } else if(S.open && S.open.startsWith('i:')) iid = S.open.slice(2);
    let fromFocus = false;
    if(!iid && S.focus && S.focus[0]==='d'){ const d = dec(+S.focus.split(':')[1]); if(d && d.obj && d.obj[0]==='i'){ iid = d.obj.slice(2); sid = d.sess||null; fromFocus = true; } }
    const i = iid && intent(iid); if(!i) return; e.preventDefault(); const beads = threadBeads(i); if(!beads.length){ toast(`${i.name} · no elaboration yet`, true); return; }
    const at = sid ? beads.indexOf(sid) - (fromFocus ? 1 : 0) : -1; const next = k===']' ? Math.min(beads.length-1, at+1) : at-1;
    if(next<0){ openDock('i:'+iid); return; } openDock('v:'+iid+'/'+beads[next]); return; }
  if(k==='m'){ e.preventDefault(); S.view = S.view==='map' ? 'phases' : 'map'; document.body.dataset.tab = 'board'; render(); return; }
  if(k==='w'){ e.preventDefault(); S.load = !S.load; document.body.dataset.tab = 'board'; $$('.tabs button').forEach(x => x.setAttribute('aria-selected', String(x.dataset.tab==='board'))); render(); return; }
  if(k==='b'){ e.preventDefault(); if(S.view==='book') S.view = 'phases'; else { S.view = 'book'; bookFollow(); } document.body.dataset.tab = 'board'; $$('.tabs button').forEach(x => x.setAttribute('aria-selected', String(x.dataset.tab==='board'))); render(); return; }
  if(k==='/'){ e.preventDefault(); document.body.dataset.tab = 'board'; $$('.tabs button').forEach(x => x.setAttribute('aria-selected', String(x.dataset.tab==='board'))); $('#capture')?.focus(); }
});
function yesAll(){ const list = S.decisions.filter(d => d.g===APPROVE && !S.inflight[d.n]).map(d => d.n).sort((a,b) => a-b); list.forEach((n, i) => setTimeout(() => send(n, 'yes'), i*380)); }

/* capture · typed text is a capture with one signal; the toggle makes it an intent capture (no grammar) */
function capture(){ const ta = $('#capture'); const v = ta.value.trim(); if(!v){ ta.focus(); return; }
  if(S.captureIntent){ const id = v.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').split('-').slice(0,4).join('-'); S.intents.unshift({id, name:id, state:'proposed', note:'captured by you as an intent · curation attaches signals · planning proposes its elaborations', sessions:[]}); logLine(`capture · intent: ${v}`, {say:true}); toast(`capture · intent ${id} · recorded`); }
  else { S.curation.unmoved++; S.curation.by += /page/.test(S.curation.by) ? '' : ' · page 1'; logLine(`capture: ${v}`, {say:true}); toast('capture · 1 signal · curation sees it'); }
