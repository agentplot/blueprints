<!--
  Triage Deck — one decision at a time, phone first.
  Seeded with the plan-mockup.md sample (willdan · 2026-09-04 07:40 · decisions 412–421).

  Decisions made while building this mockup:
  - Swipe right = the card's yes; swipe left = its decline (drop / no / hold / later). DECIDE and ANSWER
    cards have no yes, so they resist the swipe and snap back with a hint; their choices are buttons only.
  - Every response is sent the moment it is given: toast "413 → yes · recorded", one log line, and the
    decision leaves the deck. There is no undo; the log is the record.
  - Text answers (redo notes, rename, new bolt, the blocked session's reply) open a field on the card;
    the same bottom button becomes the send button so the thumb never leaves the bar.
  - "yes all" is kept, small, in the counter row, because the plan defines it; it sends one response per
    APPROVE decision in sequence, each with its own toast, never a batch.
  - Sample names not in plan-mockup.md (the baseline's items, a second open bolt "provider-hardening",
    two running work items) are invented to make the running view move; they are marked sample.
  - Running view reacts: an approved unit appears under its bolt as a starting spec session; a renamed or
    new bolt creates its group; close/finish/drop write a line into SINCE with "by your response".
  - Attention answers (takeover / wait / read) are one-word responses and also go to the log.
  - Keyboard on desktop: → yes, ← decline, digits 1–4 press the bar buttons, L opens the log, Esc closes.
  - A fixed clock starts at 07:41 and advances one minute per response so times in the log stay legible.
-->
<title>Triage Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#E9EFED;--frame:#F4F7F6;--surface:#FFFFFF;--surface2:#EDF2F0;--ink:#17201F;--ink2:#56645F;--ink3:#8A9793;
  --line:#D3DCD8;--accent:#127C7A;--accent-ink:#FFFFFF;--accent-soft:#D6ECEA;
  --drop:#B5432F;--drop-ink:#FFFFFF;--drop-soft:#F6E2DD;
  --work:#2E8A4B;--idle:#BB8412;--block:#C43A3A;
  --shadow:0 12px 32px rgba(23,32,31,.14),0 1px 2px rgba(23,32,31,.08);
  --ghost:#DFE7E4;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B100F;--frame:#121918;--surface:#1A2423;--surface2:#222E2D;--ink:#E8EFED;--ink2:#A3B1AD;--ink3:#6E7D79;
    --line:#2C3B39;--accent:#4FC6C0;--accent-ink:#0A1514;--accent-soft:#1A3A38;
    --drop:#EE8A73;--drop-ink:#2A110B;--drop-soft:#3E211B;
    --work:#5ECB7D;--idle:#E4B348;--block:#F26C6C;
    --shadow:0 12px 32px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.4);
    --ghost:#243130;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B100F;--frame:#121918;--surface:#1A2423;--surface2:#222E2D;--ink:#E8EFED;--ink2:#A3B1AD;--ink3:#6E7D79;
  --line:#2C3B39;--accent:#4FC6C0;--accent-ink:#0A1514;--accent-soft:#1A3A38;
  --drop:#EE8A73;--drop-ink:#2A110B;--drop-soft:#3E211B;
  --work:#5ECB7D;--idle:#E4B348;--block:#F26C6C;
  --shadow:0 12px 32px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.4);
  --ghost:#243130;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,textarea:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---- device frame ---- */
.app{position:relative;display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;background:var(--frame);overflow:hidden}
@media (min-width:640px){
  body{display:grid;place-items:center;padding:24px}
  .app{height:min(100dvh - 48px,880px);border-radius:28px;box-shadow:var(--shadow);border:1px solid var(--line)}
}

/* ---- header ---- */
.top{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}
.top .org{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.top .org b{color:var(--ink);font-weight:700}
.top .at{margin-left:auto;font-size:12px;color:var(--ink3)}
.logbtn{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:6px 10px;border:1px solid var(--line);border-radius:999px}
.logbtn .n{font-family:"IBM Plex Mono",monospace;color:var(--ink)}

main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---- deck ---- */
.counter{display:flex;align-items:baseline;gap:8px;padding:6px 18px 10px;font-size:13px;color:var(--ink2)}
.counter .big{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.counter .range{font-family:"IBM Plex Mono",monospace;color:var(--ink3)}
.counter .yesall{margin-left:auto;font-size:12px;letter-spacing:.04em;color:var(--accent);padding:4px 8px;border-radius:6px}
.counter .yesall:hover{background:var(--accent-soft)}
.stack{position:relative;flex:1;min-height:0;margin:0 14px 0;padding-bottom:34px}
.card,.ghost{position:absolute;left:0;right:0;top:0;bottom:34px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.ghost{background:var(--ghost);border-color:transparent;transform:translateY(calc(var(--i) * 12px)) scale(calc(1 - var(--i) * .035));transform-origin:50% 100%;z-index:calc(5 - var(--i));display:flex;align-items:flex-end;justify-content:center;padding:0 0 4px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.ghost span{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90%}
.card{z-index:10;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform}
.card.snap{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.card.fly{transition:transform .38s cubic-bezier(.4,0,.8,.4),opacity .3s ease}
.card .body{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 16px;-webkit-overflow-scrolling:touch}
.stamp{position:absolute;top:22px;padding:6px 12px;border-radius:8px;font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;opacity:0;pointer-events:none;z-index:2;border:3px solid currentColor;transform:rotate(-8deg)}
.stamp.r{left:18px;color:var(--accent)}
.stamp.l{right:18px;color:var(--drop);transform:rotate(8deg)}
.head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.head .num{font-family:"IBM Plex Mono",monospace;font-size:34px;font-weight:500;line-height:1;letter-spacing:-.02em;color:var(--ink)}
.head .kind{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);padding:4px 8px;border:1px solid var(--line);border-radius:6px}
.head .grp{margin-left:auto;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--surface2);color:var(--ink2)}
.head .grp.APPROVE{background:var(--accent-soft);color:var(--accent)}
.head .grp.ANSWER{background:var(--drop-soft);color:var(--drop)}
.title{font-size:24px;line-height:1.15;font-weight:700;letter-spacing:-.015em;margin:0 0 4px;text-wrap:balance}
.title .pre{font-weight:500;color:var(--ink2)}
.sub{margin:0 0 14px;color:var(--ink2);font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.tail{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink)}
.tail li{padding-left:14px;position:relative}
.tail li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.tail code,.since code,.sess code{font-family:"IBM Plex Mono",monospace;font-size:.92em;background:var(--surface2);padding:1px 5px;border-radius:4px}
.starts{margin:14px 0 0;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:13.5px}
.starts b{color:var(--accent);font-weight:700}
.quote{margin:12px 0 0;padding:12px 14px;border-left:3px solid var(--drop);background:var(--surface2);border-radius:0 10px 10px 0;font-size:16px;font-weight:500;line-height:1.35}
.dest{margin:12px 0 0;font-size:13.5px;color:var(--ink2)}
.dest b{color:var(--ink);font-weight:500;font-family:"IBM Plex Mono",monospace}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.chip{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;min-height:40px}
.chip .l{font-family:"IBM Plex Mono",monospace;font-weight:500;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:var(--surface2);font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip[aria-pressed="true"] .l{background:var(--accent);color:var(--accent-ink)}
.panel{margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.panel label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.panel textarea,.panel input{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:none}
.panel textarea{min-height:84px}
.panel .opts{display:flex;flex-wrap:wrap;gap:8px}
.hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;color:var(--ink3);opacity:0;transition:opacity .25s;pointer-events:none}
.card.nudge .hint{opacity:1}

/* action bar */
.bar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;padding:12px 14px 10px}
.act{min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;transition:transform .08s,background .15s,border-color .15s}
.act:active{transform:scale(.97)}
.act.yes{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.act.drop{border-color:var(--drop);color:var(--drop)}
.act.armed{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.act:disabled{opacity:.4;cursor:default}
.act small{font-weight:400;font-size:12px;opacity:.85}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;color:var(--ink2)}
.empty h2{margin:0;font-size:26px;letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
.empty .n{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink3)}
.empty button{margin-top:8px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);font-weight:600}

/* ---- running / attention ---- */
.scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 20px}
.sec{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:baseline;gap:8px;margin:14px 0 8px}
.sec:first-child{margin-top:4px}
.sec .m{font-family:"IBM Plex Mono",monospace;text-transform:none;letter-spacing:0;color:var(--ink3);margin-left:auto}
.grp{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.grp .gh{display:flex;align-items:baseline;gap:8px;padding:10px 14px;background:var(--surface2)}
.grp .gh .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.grp .gh .gn{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;color:var(--ink)}
.grp .gh .gm{margin-left:auto;font-size:12px;color:var(--ink3);text-align:right}
.sess{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.sess .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--ink3)}
.sess.working .dot{background:var(--work);box-shadow:0 0 0 3px color-mix(in srgb,var(--work) 25%,transparent)}
.sess.idle .dot{background:var(--idle)}
.sess.blocked .dot{background:var(--block);box-shadow:0 0 0 3px color-mix(in srgb,var(--block) 25%,transparent)}
.sess .sn{font-weight:500}
.sess .sm{font-size:12.5px;color:var(--ink2);margin-top:2px}
.sess .st{margin-left:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.sess.working .st{color:var(--work)}.sess.idle .st{color:var(--idle)}.sess.blocked .st{color:var(--block)}
.sess.none{color:var(--ink3);font-style:italic}
.since{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.since li{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.since li:first-child{border-top:0}
.since .v{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding-top:3px}
.since .d{font-size:12.5px;color:var(--ink3);margin-top:2px}
.att{border:1px solid var(--line);border-left:4px solid var(--idle);border-radius:12px;background:var(--surface);padding:12px 14px;margin-bottom:10px}
.att.err{border-left-color:var(--block)}
.att .ah{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
.att .ab{font-size:14.5px}
.att .ar{font-size:13px;color:var(--ink2);margin-top:4px}
.att .aa{display:flex;gap:8px;margin-top:10px}
.att .aa button{min-height:40px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);font-weight:600;font-size:14px}
.att .aa button.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin:0 0 10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* ---- tabs ---- */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--frame);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;font-size:12px;letter-spacing:.04em;color:var(--ink2);position:relative}
.tab b{font-weight:600}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.tab .bd{position:absolute;top:6px;right:calc(50% - 30px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--frame);font-family:"IBM Plex Mono",monospace;font-size:11px;display:grid;place-items:center}
.tab .bd.warn{background:var(--idle);color:#1B1300}
.tab .bd:empty{display:none}

/* ---- toast + log sheet ---- */
.toast{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:var(--frame);padding:10px 16px;border-radius:999px;font-size:13.5px;font-family:"IBM Plex Mono",monospace;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:50;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:72%;background:var(--surface);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:70;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sheet.on{transform:none}
.sheet .sh{display:flex;align-items:center;padding:14px 18px 8px;gap:10px}
.sheet .sh h3{margin:0;font-size:16px}
.sheet .sh .x{margin-left:auto;padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px}
.sheet .sl{overflow-y:auto;padding:0 18px 24px;flex:1}
.loglist{list-style:none;margin:0;padding:0}
.loglist li{display:grid;grid-template-columns:48px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:13px}
.loglist li:first-child{border-top:0}
.loglist .t{color:var(--ink3)}
.loglist .s{color:var(--accent);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.loglist .s.fail{color:var(--block)}
.loglist .nil{color:var(--ink3);font-style:italic;font-family:"Schibsted Grotesk",sans-serif}
.kb{display:none;justify-content:center;gap:16px;font-size:11px;color:var(--ink3);padding:0 0 6px}
@media (min-width:640px) and (hover:hover){.kb{display:flex}}
.kb kbd{font-family:"IBM Plex Mono",monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <span class="org">Plan · <b>willdan</b></span>
    <span class="at mono">2026-09-04 07:40</span>
    <button class="logbtn" id="logbtn" aria-label="Open response log">log <span class="n" id="logn">0</span></button>
  </header>

  <main>
    <section class="view" id="v-deck">
      <div class="counter">
        <span class="big" id="left">10</span><span>to decide</span>
        <span class="range" id="range">412–421</span>
        <button class="yesall" id="yesall">yes all · 412–417</button>
      </div>
      <div class="stack" id="stack"></div>
      <div class="bar" id="bar"></div>
      <div class="kb"><span><kbd>→</kbd> yes</span><span><kbd>←</kbd> decline</span><span><kbd>1</kbd>–<kbd>4</kbd> buttons</span><span><kbd>L</kbd> log</span></div>
    </section>

    <section class="view" id="v-running" hidden>
      <div class="scroll" id="running"></div>
    </section>

    <section class="view" id="v-attention" hidden>
      <div class="scroll" id="attention"></div>
    </section>
  </main>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="deck" aria-selected="true"><b>Deck</b><span>decide</span><span class="bd" id="bd-deck">10</span></button>
    <button class="tab" role="tab" data-v="running" aria-selected="false"><b>Running</b><span>&amp; since</span><span class="bd" id="bd-run"></span></button>
    <button class="tab" role="tab" data-v="attention" aria-selected="false"><b>Attention</b><span>read</span><span class="bd warn" id="bd-att">2</span></button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" aria-label="Responses sent">
    <div class="sh"><h3>Responses sent</h3><span class="mono" style="font-size:12px;color:var(--ink3)">each applied once</span><button class="x" id="sheetx">close</button></div>
    <div class="sl"><ul class="loglist" id="loglist"></ul></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- clock ---------- */
let mins = 7*60 + 41;
const clock = () => `${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`;

/* ---------- sample state (plan-mockup.md, willdan 2026-09-04 07:40) ---------- */
const deck = [
  {n:412, group:'APPROVE', kind:'intent', pre:'', title:'atlas-provider-limits',
   sub:'curation · 7 signals · 3 sources · 12d',
   lines:['elaborations: <code>research</code> self-closing · <code>prototype</code> standing','challenges claim <code>providers/one-writer @v3</code>'],
   starts:'both elaborations on the intent line; the next decision is the intent\'s close',
   acts:[{id:'yes',label:'yes',tone:'yes',swipe:'r'},{id:'drop',label:'drop',tone:'drop',swipe:'l'},{id:'split',label:'split'}]},
  {n:413, group:'APPROVE', kind:'unit', pre:'atlas ·', title:'status-writer',
   sub:'→ bolt plan-decisions (open) · after: none',
   lines:['covers <code>one-writer</code> sc.1, 2 · completes it','type <code>default</code>'],
   dest:'goes to bolt <b>switchboard/plan-decisions</b>',
   starts:'spec → build ×2 → review → merge · no further response until the bolt\'s close',
   acts:[{id:'yes',label:'yes',tone:'yes',swipe:'r'},{id:'drop',label:'drop',tone:'drop',swipe:'l'},
         {id:'redo',label:'redo',input:'text',field:'notes for planning',send:'send redo'},
         {id:'bolt',label:'bolt…',input:'bolt',send:'route'}]},

function toast(msg){

function send(reply, ok=true){

/* ---------- effects on the running view ---------- */
function group(id){ return running.find(g => g.id === id); }
function addGroup(id, kind, name, meta){ const g = {id, kind, name, meta, sess:[]}; running.push(g); return g; }
function sinceAdd(v, t){ since.unshift({v, t, d:`by your response ${clock()}`}); }
function apply(d, act, payload){
  const n = d.n;
  if (act.id === 'drop' || act.id === 'no' || act.id === 'later' || act.id === 'hold'){
    const label = {intent:'intent', unit:'unit', chores:'chores', land:'landing', baseline:'baseline'}[d.kind] || d.kind;
    sinceAdd(act.id === 'hold' ? 'held' : act.id === 'later' ? 'deferred' : 'dropped', `${label} ${d.pre} ${d.title}`.replace(/\s+/g,' ').trim());
    if (n === 412) group('i-apl').meta = 'dropped';
    return;
  }
  switch (n){
    case 412:
      if (act.id === 'yes'){ const g = group('i-apl'); g.meta = 'open · 2 elaborations'; g.sess.unshift({id:'res', name:'research · provider limits', state:'working', meta:'self-closing · starting'}); }
      if (act.id === 'split'){ group('i-apl').meta = 'split · back to curation'; }
      break;
    case 413: {
      const s = {id:'sw', name:'spec · unit status-writer', state:'working', meta:'starting · then build ×2 → review → merge'};
      if (act.id === 'yes') group('b-pd').sess.push(s);
      if (act.id === 'redo') sinceAdd('redo', 'unit atlas · status-writer → planning');
      if (act.id === 'bolt'){
        if (payload.startsWith('new bolt ')) addGroup('b-'+payload, 'bolt', 'atlas/'+payload.slice(9), 'new · from 413').sess.push(s);
        else group('b-ph').sess.push(s);
      }
      break; }
    case 414: {
      const s = {id:'rj', name:'spec · unit retry-jitter', state:'working', meta:'type fast · starting'};
      if (act.id === 'yes') addGroup('b-rj','bolt','atlas/atlas-retry-behaviour-and-jitter-limits','new · from 414').sess.push(s);
      if (act.id === 'rename') addGroup('b-rj','bolt','atlas/'+payload,'new · renamed on 414').sess.push(s);
      if (act.id === 'bolt') group('b-pd').sess.push(s);
      break; }
    case 415: {
      const picked = act.id === 'yes' ? d.items.map(i => i[0]) : payload;
      const g = group('c-atlas') || addGroup('c-atlas','chores','atlas','one session each');
      picked.forEach(l => { const it = d.items.find(i => i[0] === l); g.sess.push({id:'ch'+l, name:`chore ${l} · ${it[1]}`, state:'working', meta:'starting'}); });
      break; }
    case 416: group('b-pd').meta = 'landing on main · gates green'; break;
    case 417: {
      const picked = act.id === 'yes' ? d.items : d.items.filter(i => payload.includes(i[0]));
      const g = addGroup('b-nr','bolt','new-repo/baseline', `${picked.length} of 11 · starting`);
      picked.slice(0,4).forEach(i => g.sess.push({id:'nr'+i[0], name:`${i[1]}`, state:'working', meta:'starting'}));
      if (picked.length > 4) g.sess.push({id:'nrmore', name:`+${picked.length-4} more queued`, state:'idle', meta:'waits for a host'});
      break; }
    case 418:
      if (act.id === 'close'){ running.splice(running.indexOf(group('i-lg')),1); sinceAdd('closed','intent loop-granularity'); }
      else group('i-lg').meta = 'kept open · waits for an elaboration';
      break;
    case 419: {
      const g = group('i-apl');
      if (act.id === 'finish'){ g.sess = g.sess.filter(s => s.id !== 'proto'); sinceAdd('finished','prototype plan-derivation'); }
      else { const p = g.sess.find(s => s.id === 'proto'); if (p) p.meta = 'standing · kept'; }
      break; }
    case 420: group('b-pd').meta = act.id === 'amend' ? 'amending 2 items to one-writer v4' : 'lands on v3 · follow-up unit proposed'; break;
    case 421: { const s = group('b-pd').sess.find(s => s.id === 'wi418'); if (s){ s.state = 'working'; s.meta = `answered ${clock()} · “${payload.slice(0,40)}${payload.length>40?'…':''}”`; } break; }
  }
}

/* ---------- deck rendering ---------- */
const stack = $('#stack'), bar = $('#bar');
let busy = false;
const picks = {};   // n -> Set of letters
const open = {};    // n -> action id whose panel is open

function replyFor(d, act, payload){
  if (act.id === 'yes') return `yes ${d.n}`;
  if (act.id === 'no') return `no ${d.n}`;
  if (act.id === 'pick') return `${d.n} pick ${payload.join(' ')}`;
  if (act.id === 'redo') return `${d.n} redo: ${payload}`;
  if (act.id === 'rename') return `${d.n} rename ${payload}`;
  if (act.id === 'bolt' && payload) return `${d.n} ${payload}`;
  if (act.id === 'reply') return `${d.n}: ${payload}`;
  return `${d.n} ${act.value || act.id}`;
}

function cardHTML(d){
  const r = d.acts.find(a => a.swipe === 'r'), l = d.acts.find(a => a.swipe === 'l');
  const set = picks[d.n] || (picks[d.n] = new Set());
  return `
  <div class="stamp r">${r ? esc(r.label) : ''}</div><div class="stamp l">${l ? esc(l.label) : ''}</div>
  <div class="body">
    <div class="head"><span class="num">${d.n}</span><span class="kind">${esc(d.kind)}</span><span class="grp ${d.group}">${d.group}</span></div>
    <h2 class="title">${d.pre ? `<span class="pre">${esc(d.pre)}</span> ` : ''}${esc(d.title)}</h2>
    <p class="sub">${esc(d.sub)}</p>
    ${d.quote ? `<blockquote class="quote">“${esc(d.quote)}”</blockquote>` : ''}
    ${d.lines ? `<ul class="tail">${d.lines.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
    ${d.items ? `<div class="chips" role="group" aria-label="pick items">${d.items.map(([k,v]) => `<button class="chip" data-l="${k}" aria-pressed="${set.has(k)}"><span class="l">${k}</span>${esc(v)}</button>`).join('')}</div>${d.note ? `<p class="dest">${esc(d.note)}</p>` : ''}` : ''}
    ${d.dest ? `<p class="dest">${d.dest}</p>` : ''}
    ${d.starts ? `<p class="starts"><b>yes starts</b> ${esc(d.starts)}</p>` : ''}
    <div class="panel" id="panel" hidden></div>
  </div>
  <div class="hint">no yes on this one · choose below</div>`;
}

function panelHTML(d, act){
  if (act.input === 'text') return `<label>${esc(act.field)}</label>${act.single ? `<input id="fld" value="${esc(act.prefill || '')}" autocomplete="off">` : `<textarea id="fld" placeholder="${esc(act.field)}"></textarea>`}`;
  if (act.input === 'bolt') return `<label>route to an open bolt</label><div class="opts"><button class="chip" data-bolt="bolt provider-hardening"><span class="l">→</span>atlas/provider-hardening</button></div><label>or a new bolt</label><input id="fld" placeholder="new bolt name" autocomplete="off">`;
  return '';
}

function renderDeck(){
  const d = deck[0];
  $('#left').textContent = deck.length;
  $('#bd-deck').textContent = deck.length || '';
  $('#range').textContent = deck.length ? (deck.length > 1 ? `${deck[0].n}–${deck[deck.length-1].n}` : `${deck[0].n}`) : '';
  const approves = deck.filter(x => x.group === 'APPROVE');
  $('#yesall').hidden = approves.length < 2;
  $('#yesall').textContent = `yes all · ${approves[0]?.n}–${approves[approves.length-1]?.n}`;
  if (!d){
    stack.innerHTML = '';
    bar.innerHTML = '';
    stack.insertAdjacentHTML('beforeend', `<div class="empty"><h2>Nothing waits on you.</h2><span class="n">${log.length} responses sent · each applied once</span><button id="gorun">see what is running</button></div>`);
    $('#gorun').onclick = () => show('running');
    return;
  }
  stack.innerHTML = deck.slice(1,4).map((g,i) => `<div class="ghost" style="--i:${i+1}"><span>${g.n} · ${esc(g.kind)} · ${esc((g.pre+' '+g.title).trim())}</span></div>`).join('');
  const card = document.createElement('div');
  card.className = 'card'; card.dataset.n = d.n; card.innerHTML = cardHTML(d);
  stack.appendChild(card);
  bindCard(card, d);
  renderBar(d);
  if (d.acts.some(a => a.open)) openPanel(d, d.acts.find(a => a.open), false);
}

function renderBar(d){
  bar.innerHTML = d.acts.map((a,i) => {
    const armed = open[d.n] === a.id;
    let label = esc(a.label), sub = a.sub ? `<small>${esc(a.sub)}</small>` : '';
    let dis = '';
    if (a.input === 'letters'){ const s = picks[d.n]; label = s && s.size ? `pick ${[...s].sort().join(' ')}` : 'pick'; dis = s && s.size && s.size < d.items.length ? '' : 'disabled'; }
    if (armed) label = esc(a.send || 'send');
    return `<button class="act ${a.tone || ''} ${armed ? 'armed' : ''}" data-i="${i}" ${dis}>${label}${sub}</button>`;
  }).join('');
  bar.querySelectorAll('.act').forEach(b => b.onclick = () => press(d, d.acts[+b.dataset.i]));
}

function openPanel(d, act, focus=true){
  const p = $('#panel'); if (!p) return;
  open[d.n] = act.id;
  p.innerHTML = panelHTML(d, act); p.hidden = false;
  p.querySelectorAll('[data-bolt]').forEach(b => b.onclick = () => commit(d, act, b.dataset.bolt));
  const f = $('#fld');
  if (f){ f.onkeydown = e => { if (e.key === 'Enter' && (f.tagName === 'INPUT' || e.metaKey || e.ctrlKey)){ e.preventDefault(); press(d, act); } e.stopPropagation(); }; if (focus) f.focus(); }
  renderBar(d);
  p.scrollIntoView({block:'nearest', behavior: reduced ? 'auto' : 'smooth'});
}

function press(d, act){
  if (busy) return;
  if (act.input === 'letters'){ const s = picks[d.n]; if (!s || !s.size) return; return commit(d, act, [...s].sort()); }
  if (act.input){
    if (open[d.n] !== act.id) return openPanel(d, act);
    const f = $('#fld'); const v = (f?.value || '').trim();
    if (act.input === 'bolt'){ if (!v) return f.focus(); return commit(d, act, `new bolt ${v}`); }
    if (!v) return f.focus();
    return commit(d, act, v);
  }
  commit(d, act, act.value);
}

function commit(d, act, payload){
  if (busy) return; busy = true;
  const reply = replyFor(d, act, payload);
  send(reply);
  apply(d, act, payload);
  delete open[d.n];
  const card = stack.querySelector('.card');
  const dir = act.swipe === 'r' ? 1 : act.swipe === 'l' ? -1 : 0;
  const w = stack.clientWidth;
  card.classList.add('fly');
  card.style.transform = dir ? `translate(${dir*(w+120)}px, 20px) rotate(${dir*14}deg)` : `translateY(${stack.clientHeight+60}px) scale(.96)`;
  card.style.opacity = dir ? '1' : '.6';
  const done = () => { deck.shift(); busy = false; renderDeck(); renderRunning(); };
  reduced ? done() : setTimeout(done, 320);
}

/* ---------- swipe ---------- */
function bindCard(card, d){
  card.querySelectorAll('.chip[data-l]').forEach(c => c.onclick = () => {
    const s = picks[d.n]; const l = c.dataset.l;
    s.has(l) ? s.delete(l) : s.add(l);
    c.setAttribute('aria-pressed', s.has(l));
    renderBar(d);
  });
  const r = d.acts.find(a => a.swipe === 'r'), l = d.acts.find(a => a.swipe === 'l');
  const sr = card.querySelector('.stamp.r'), sl = card.querySelector('.stamp.l');
  let x0=0, y0=0, dx=0, dragging=false, decided=false, id=null;
  card.addEventListener('pointerdown', e => {
    if (e.target.closest('button, textarea, input')) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; dragging = false; decided = false; id = e.pointerId;
    card.classList.remove('snap');
  });
  card.addEventListener('pointermove', e => {
    if (e.pointerId !== id || busy) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!dragging && !decided){
      if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      decided = true;
      if (Math.abs(mx) > Math.abs(my)) { dragging = true; try { card.setPointerCapture(id); } catch(_){} } else return;
    }
    if (!dragging) return;
    dx = mx;
    const soft = (!r && !l) ? 0.3 : 1;
    card.style.transform = `translateX(${dx*soft}px) rotate(${dx*soft/22}deg)`;
    const k = Math.min(1, Math.abs(dx)/110);
    sr.style.opacity = dx > 0 && r ? k : 0;
    sl.style.opacity = dx < 0 && l ? k : 0;
    if (!r && !l && Math.abs(dx) > 40) card.classList.add('nudge');
  });
  const end = e => {
    if (e.pointerId !== id) return;
    id = null;
    if (!dragging) return;
    dragging = false;
    const th = Math.min(120, stack.clientWidth*.32);
    const act = dx > th ? r : dx < -th ? l : null;
    if (act && !busy){ commit(d, act, act.value); return; }
    card.classList.add('snap'); card.style.transform = ''; sr.style.opacity = 0; sl.style.opacity = 0;
    setTimeout(() => card.classList.remove('nudge'), 900);
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

/* ---------- yes all ---------- */
$('#yesall').onclick = () => {
  if (busy) return;
  const step = () => {
    const d = deck.find(x => x.group === 'APPROVE');
    if (!d) return;
    if (deck[0] !== d){ deck.splice(deck.indexOf(d),1); deck.unshift(d); renderDeck(); }
    commit(d, d.acts.find(a => a.id === 'yes'));
    setTimeout(step, reduced ? 0 : 520);
  };
  step();
};

function show(v){
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.v === v));
  ['deck','running','attention'].forEach(k => $('#v-'+k).hidden = k !== v);
  if (v === 'running') renderRunning();
  if (v === 'attention') renderAttention();
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => show(t.dataset.v));

/* ---------- keyboard (desktop) ---------- */
document.addEventListener('keydown', e => {
  if (e.target.matches('textarea, input')) return;
  if (e.key === 'Escape') return closeLog();
  if (e.key.toLowerCase() === 'l') return openLog();
  if ($('#v-deck').hidden) return;
  const d = deck[0]; if (!d) return;
  if (e.key === 'ArrowRight'){ const a = d.acts.find(a => a.swipe === 'r'); if (a) commit(d, a, a.value); }
  else if (e.key === 'ArrowLeft'){ const a = d.acts.find(a => a.swipe === 'l'); if (a) commit(d, a, a.value); }
  else if (/^[1-4]$/.test(e.key)){ const a = d.acts[+e.key-1]; if (a) press(d, a); }
});

renderDeck(); renderRunning(); renderAttention(); renderLog();
})();
</script>
