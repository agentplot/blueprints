<!doctype html>
<!--
  Context map — the system context map as the flywheel's scope surface (198), on Chuck's v1
  schema (context-map/README.md · schema.json). The two willdan maps (current.js, target.js)
  and the configurations companion are embedded below verbatim from
  willdan-blueprints @ the commits they name; the page re-expresses the rail-and-board map
  view on them and adds what the flywheel adds (104, 105, 122, 193, 195, 198).

  Decisions taken while building:
  - Chuck's canvas conventions are kept where they carry meaning: one card per bounded
    context with the four bands (published language · services with control and data lanes ·
    state: seams · stores), tiers as rows, no edges at rest, edges for the selection and pinned
    kinds, edges ghosted (never hidden) when their runtime is off the switch, ⚠ on a ref whose
    file is not in verifiedFiles, status dots for candidate and open, the Δ overlay read
    current → target with the other map's exclusives as ghosts, and a Changes tab. The layout
    engine and renderer are this page's own, in the rail-and-board visual language.
  - His `repository` layer is renamed `seam` everywhere on this page (layer, the `repository`
    kind, the `uses-repository` relation → `uses-seam`, the band label): the flywheel uses
    "repository" for a git repository. The embedded data is untouched; the rename is applied
    when the maps load.
  - Home: every node names the git repository it is built in, shown as a small tag. The maps
    name no git repositories, so homes are assigned by id prefix to plausible names marked
    sample (af.* → atlas3, rc.* → rocs, gk.* → gvc, ck.*/kb.* → cortex-kit, gq.* → geoiq,
    sw.* → switchboard). Breadboard's nodes (bb.*, target only) are left unhomed on purpose:
    they are what "add repository" picks from. A repository's kinds and capabilities are
    derived from its homed nodes by a fixed table, never typed.
  - Claims attach to elements (a context, a node, or a relation). Seeded claims from
    rail-and-board are used where an element fits (sessions/one-writer on rocs' Conductor,
    providers/rate-envelope on the Geo IQ gateway and the catalog API, plan/* on switchboard);
    a few more are invented and cite the chapter of what they attach to. Scope is derived: the
    repositories homing the attachments. Re-attaching is the scope gesture and sends one
    response, "attach <claim> → <element>".
  - Verdicts are per claim per repository in scope; a node shows the verdict of its home for
    the claims attached there as a dot; a repository panel sums unmet.
  - Overlays are a segmented control: none · current → target (Δ, computed from the two
    embedded maps) · since last review (122): unchanged dimmed, changed outlined with a note,
    "mark reviewed" moves the mark. The review notes are invented and marked sample.
  - Decisions are markers on the elements they concern. Seeded numbers are reused where a real
    element fits (420 on the Conductor, 416 and 421 on switchboard); 412, 413 and 424 are placed
    on real elements and marked sample. A marker opens the rail card inline in the side panel;
    in rail-and-board this is the rail. Every answer is one response with an in-flight state.
  - An element with status open shows its question in the panel; "capture this question"
    sends one capture.
  - "Add repository" asks a name and which unhomed nodes it homes, derives kinds and
    capabilities, shows the claims that fall into scope, and raises a baseline decision with a
    new number (104).
  - The Configurations tab is a read-only reproduction of the companion's data (the help block,
    every entrypoint × configuration cell with its bindings and refs); the drawn topology stays
    as in v1 and is not redrawn here.
  - Not carried from v1: hop depth 2, trace-to-store, the Contracts matrix, search, the
    Repository-map table (the seams table), Provenance, export, URL hash state. Review
    switches: ?map=current|target, ?theme=dark|light, ?sel=<id>, ?overlay=delta|review, ?tab=…
-->

 /* -- contracts -- */
 { id:"gk.commit-model", contextId:"gvc-kit", name:"gvc-commit/v1 object model", layer:"contract", plane:"none", kind:"schema", runtime:"both",
   ref:"books/gvc-kit/src/objects.md",
   blurb:"Frozen: leaf = (item, partition, fp); the commit is the batch — one per producer run; tree = the resolved full snapshot; the sha is content-only so it travels clone → PR → main unchanged; parents are per-branch references closed by ed25519 signing.", status:"settled" },
 { id:"gk.repo-format", contextId:"gvc-kit", name:"Repository format + RefStore CAS", layer:"contract", plane:"none", kind:"schema", runtime:"both",
   ref:"books/gvc-kit/src/repository.md",
   blurb:"_gvc/ inside a warehouse under the namespaced tree (org/<ns>/warehouses/<short>): append-only inbox/staged/rejections/log/checks + single-key refs behind the RefStore compare-and-set seam (an S3 conditional put through the binding's alias). Clone copies refs+log+staged; pending sets are computed, never stored.", status:"settled" },
 { id:"kb.row-contract", contextId:"gvc-kit", name:"Staging row contract (schema v2)", layer:"contract", plane:"none", kind:"schema", runtime:"both",
   ref:"books/gvc-kit/src/extract-build.md#the-staging-contract--schema-v2",
   blurb:"The uniform row shape every extractor emits — the federation contract: sixteen named columns plus the hive-carried path, one source_urn per row; a cross-source blend is structurally unwritable.", status:"settled" },
 { id:"gk.builders-spi", contextId:"gvc-kit", name:"gvc.builders SPI", layer:"contract", plane:"none", kind:"spi", runtime:"both",
   ref:"books/gvc-kit/src/checkout.md",
   blurb:"The checkout seam: gvc resolves the commit and its tree; row selection and the graph MERGE belong to a registered builder. Same idiom as atlas3.derivers; gvc never imports its consumer.", status:"settled" },
 { id:"gk.checks-spi", contextId:"gvc-kit", name:"gvc.checks SPI (pure policy checks)", layer:"contract", plane:"none", kind:"spi", runtime:"both",
   ref:"books/gvc-kit/src/checks-and-jobs.md#checks",
   blurb:"Pure, side-effect-free product-policy predicates run on push per (branch, commit) with a recorded status. Work with side effects is a job: gvc-web requests a run from Switchboard's job plane under GVC's identity and reads the status record. Switchboard never sees a commit.",
   status:"candidate", note:"The socket is landed and nothing registers against it yet; the on-push composition is GVC's own push handler." },
 { id:"gk.subgraph-vocab", contextId:"gvc-kit", name:"Catalog subgraph label vocabulary", layer:"contract", plane:"none", kind:"schema", runtime:"both",
   ref:"books/gvc-kit/src/catalog-subgraph.md",
   blurb:"__GvcHead__ · __Manifest__ · __Warehouse__ · __Release__ · __CatalogItem__ · __Partition__ — the graph's own manifest, replaced each checkout, item/partition grain (never rows).",
   status:"settled", note:"A shared contract: written by the consumer's builder, read by gvc's STAC face — no single owner in code." },
 { id:"gk.protection", contextId:"gvc-kit", name:"The write boundary (protection + the relation)", layer:"contract", plane:"none", kind:"schema", runtime:"both",
   ref:"books/gvc-kit/src/write-boundary.md",
   blurb:"protection: on (repo, branch) enforced at the three write seams; the (subject, relation, repository, branch) check evaluated before any copy; the person's session vended by the broker; attribution from the verified principal. Writing is never a Switchboard binding — a workload holds no push right.",
   status:"candidate", note:"Protection is built; the relation check and the network transport are the construction wave." },
 { id:"gk.track-resolve", contextId:"gvc-kit", name:"track + resolve", layer:"contract", plane:"none", kind:"openapi", runtime:"deployed",
   ref:"books/gvc-kit/src/track-and-resolve.md",
   blurb:"A consumer's connection names a track — refs/tags/<branch>/* (newest release), refs/heads/<branch> (owner tenant only), or an exact ref; GET /api/repos/<tenant>/<repo>/resolve?ref=<pattern> answers {ref, sha, createdAt}. Ordering never leaves GVC; Switchboard stores the pattern and the head it got.", status:"settled" },
 { id:"gk.kit", contextId:"gvc-kit", name:"gvc kit (version-lock bundle)", layer:"contract", plane:"none", kind:"release-bundle", runtime:"build-time",
   ref:"books/gvc-kit/src/index.md#what-the-kit-ships",
   blurb:"{the engine and its CLI, gvc-web UI modules, the workbench template, the GVC application template, the contracts incl. resolve and the reportServiceChange payload} at one version — the shippable boundary a product takes.", status:"candidate" },
 /* -- services -- */
 { id:"gk.cli", contextId:"gvc-kit", name:"gvc CLI", layer:"service", plane:"data", kind:"cli", runtime:"both",
   ref:"books/gvc-kit/src/verbs.md",
   blurb:"log · verify · clone · fork · branch · fetch · sync · status · remote · checkout · push · pr open · check run · sign · stac. No verb fuses decisions with different owners: push never implies approval; sync never spends a rebuild; pr open builds the submit seam and no admission policy.", status:"settled" },
 { id:"gk.checkout", contextId:"gvc-kit", name:"Checkout / push engine", layer:"service", plane:"data", kind:"worker", runtime:"both",
   ref:"books/gvc-kit/src/checkout.md",
   blurb:"checkout = build(tree(commit) ⋈ selectors) through the registered builder; replace=true — rebuild-from-zero, graphs are disposable. Binds refs/graphs with the selectors used so push re-runs without re-asking. Deployed, the same checkout is Custom::GvcBuild in a graph app's stack or the workbench's Apply job, identity (repo, head.sha, scope).", status:"settled" },
 { id:"kb.extract", contextId:"gvc-kit", name:"Extract half", layer:"service", plane:"data", kind:"worker", runtime:"both",
   ref:"books/gvc-kit/src/extract-build.md",
   blurb:"Runs per catalog item, graph-free; routes policy tags to registered extractors; its product is a sidecar addressed by (primary fp, extractor, schema fp, model id) — the staleness key. Extraction-ensure is a job that requests a job-plane run under GVC's identity; locally derived rows never cross the machine boundary.", status:"settled" },
 { id:"gk.stacapi", contextId:"gvc-kit", name:"Graph-scoped STAC face", layer:"service", plane:"data", kind:"api", runtime:"both",
   ref:"books/gvc-kit/src/catalog-subgraph.md",
   blurb:"Serves a catalog from the subgraph alone — the graph IS the scope; no warehouse read, no manifest lookup, no control plane. Hrefs are root-relative and join to the binding's root.", status:"settled" },
 { id:"gk.gvc-web", contextId:"gvc-kit", name:"gvc-web", layer:"service", plane:"control", kind:"ui", runtime:"both",
   ref:"books/gvc-kit/src/gvc-web.md",
   blurb:"The console's UI module over the engine's routes: repositories with the GitHub tab set (Overview · Commits & checks · Actions · Releases · Deployments · Settings), pull request pages, forks, Builds & checks, the workbench dock panels. Actions lists GVC's own checks and jobs; Releases has one create action; Deployments lists the apps following the repository with their track and bound head; Settings → Sharing renders Switchboard's sharing component for the repository's data row. It renders and requests; it never decides.", status:"candidate" },
 { id:"gk.review", contextId:"gvc-kit", name:"Review + release loop", layer:"service", plane:"control", kind:"worker", runtime:"both",
   ref:"books/gvc-kit/src/review.md",
   blurb:"PR review over the repository: pending = inbox − staged − rejections, computed never stored; approve is a merge — the copy into staged/ plus the pull stamp, atomic per commit with row-level veto; reject is one fp-keyed tombstone; release create sweeps supersession cells against the tagged commit's tree with named drops, composes, and writes the tag last, then reports the moved ref. Review is GVC's own; on-merge and compose consumers register on entry points.",
   status:"candidate", note:"The loop is built in the spike's gvc package; the ref report after the tag is the construction wave." },
 { id:"gk.portal", contextId:"gvc-kit", name:"What the portal fronts", layer:"service", plane:"control", kind:"ui", runtime:"deployed",
   ref:"books/gvc-kit/src/reference-deployment.md#what-the-portal-fronts",
   blurb:"No GVC-owned site: the console shell mounts gvc-web under its Frontegg boundary (the GitHub tab set, Settings → Sharing over Switchboard's component); the portal's Data catalog lists a repository's warehouse as the data service it is; each workbench is a discovered app endpoint of its own environment. The gateway routes the kit's one OpenAPI document at the paths the kit declares.", status:"candidate" },
 { id:"gk.reference", contextId:"gvc-kit", name:"The reference deployment", layer:"service", plane:"control", kind:"api", runtime:"deployed",
   ref:"books/gvc-kit/src/reference-deployment.md",
   blurb:"One GVC app on Switchboard, in one production environment, in the Willdan tenant — every tenant's repositories live in it as data rows each with its owner tenant. The stack holds the engine routes behind the org gateway (resolve and the reportServiceChange client among them), the transport, the execution role with a maintain binding to each warehouse and the job-plane identity, and a request ledger; the workbench archetype publishes beside it. The kit deploys both from its own repository.",
   status:"candidate" },
 { id:"gk.workbench", contextId:"gvc-kit", name:"The workbench — a graph app", layer:"service", plane:"data", kind:"ui", runtime:"deployed",
   ref:"books/gvc-kit/src/workbench.md",
   blurb:"gvc-kit's own graph app and the model for every further one — the Codespaces parallel: an ephemeral environment in the owner tenant with a PR bench's TTL, a connection tracking refs/heads/<branch>, and no SwbService<Repo> parameter, so a commit re-puts the mirror and touches no stack. The sync strip shows N commits ahead of the built graph; Apply requests an identity-keyed build job and swaps the graph pointer. Verbs run as the person over GVC's transport, never as the stack. Stacks bake at deploy time; the workbench bakes on the person's word.", status:"settled" },
 /* -- repositories -- */
 { id:"gk.merge-writer", contextId:"gvc-kit", name:"Merge writer (approve = copy)", layer:"repository", plane:"none", kind:"writer", runtime:"both",
   ref:"books/gvc-kit/src/review.md#the-merge",
   blurb:"The decision executed: approve appends the decided batch's pending rows into staged/ as a new uniquely named part and stamps the pull; reject appends one tombstone row. The serverless double-copy case is guarded by an S3 conditional put.", status:"settled" },
 { id:"gk.refstore", contextId:"gvc-kit", name:"RefStore", layer:"repository", plane:"none", kind:"writer", runtime:"both",
   ref:"books/gvc-kit/src/repository.md",
   blurb:"Single-key atomic ref writes with expected-prior compare-and-set — the seam an S3 conditional put drops into. Every head move, tag, pull, and graph binding goes through it.", status:"settled" },
 /* -- stores -- */

 { id:"sw.data-service-row", contextId:"switchboard", name:"data service row (catalog facet + refs facet)", layer:"contract", plane:"none", kind:"entity", runtime:"deployed",
   ref:"books/switchboard-kit/src/connected-services.md",
   blurb:"A GVC repository and its warehouse are one row, APP#<warehouse app> SVC#<env>/data/<tenant>/<name>: the catalog facet read back from the warehouse stack (root, URL, prefixes, key, broker), the refs facet reported by GVC (every ref and its sha), an owner tenant who edits share and audience, and a fingerprint over both facets. A release landing moves neither facet; a ref move moves one.", status:"settled" },
 /* -- services -- */
 { id:"sw.bind-executor", contextId:"switchboard", name:"dispatch + the bind executor", layer:"service", plane:"control", kind:"worker", runtime:"deployed",
   ref:"books/switchboard-kit/src/connected-services.md",
   blurb:"On service.changed {refs} dispatch keeps a bind subscription only when a moved ref matches its track; the bind executor resolves the head at GVC, writes the binding record, re-puts the mirror and — only where the host's template declares SwbService<Name> — queues the changeset that bakes the head under the environment's policy and gate. A prefix-wide reader is never gated; the workbench is gated by the person.", status:"settled" },
 { id:"sw.frontegg-writers", contextId:"switchboard", name:"frontegg-environment stack + the Custom::FronteggHostname provider", layer:"service", plane:"control", kind:"worker", runtime:"deployed",
   ref:"books/switchboard-kit/src/tenancy-and-identity.md#hostnames-are-wildcard-entries-written-once",
   blurb:"A hostname reaches Frontegg only as a CloudFormation resource. frontegg-environment-<class>, a nested child of Switchboard's parent template, one per class in that class's account, takes ClassDomain and holds the wildcard entries (*.localhost in Development; the class-domain wildcard), the platform-nonprod Application, Switchboard's own Application, the JWT-template enrolment, and the class's DNS — the hosted zone, the ACM certificate for the class domain and its wildcard, and the Frontegg custom domain with its CNAME. Native Route 53 and ACM certificates are the only DNS there is, and there is one shape: the class owns the zone and the certificate, each site owns its own alias record, so no child reads another child's generated name. Every site's own entry is a Custom::FronteggHostname resource in its stack, and frontegg-hostnames, at a concurrency of one, is the provider CloudFormation calls on create, update and delete. An app's site in a connected account gets its record from a swb-dns-<app>-<env> records stack the changeset executor deploys in the class account — native Route 53, no custom resource. Nothing invokes the writer by payload; ephemeral-lifecycle never touches Frontegg. Switchboard is one parent template nesting every child, wired by nested-stack parameters and outputs alone; the bootstrap workflow deploys that published parent and the changeset executor deploys the same one after the takeover.", status:"settled" },
 /* -- stores -- */
 { id:"sw.registry", contextId:"switchboard", name:"Template registry", layer:"store", plane:"none", kind:"object-store", runtime:"deployed",
   ref:"books/overview/src/published-templates.md#how-a-template-is-published",
   blurb:"templates/<app>/<version>/ — an immutable prefix holding the templates and every local artifact they reference, resolved in at publish time by sam package, so a published parent pins its children by version. No mutable latest alias; the artifacts mirror to the org's regional artifact buckets. Nothing is reachable anonymously: a fragment travels by authenticated cross-account S3 read.", status:"settled" },
 { id:"sw.catalog", contextId:"switchboard", name:"Fragment catalog", layer:"store", plane:"none", kind:"catalog", runtime:"deployed",
   ref:"books/overview/src/published-templates.md#the-catalog-names-what-is-current",
   blurb:"The authority on which version is current per channel. beta and alpha/* heads advance from the published artifact's own event; stable advances by promotion. No SSM parameter carries a version pointer. Nothing resolves current at deploy time — promotion makes a version offerable, and comparing a connection's pinned version against the stable head produces the update a console offers.", status:"settled" },

 /* ================= Breadboard ================= */
 /* -- contracts -- */
 { id:"bb.sdk", contextId:"breadboard", name:"The SDK (sdk.js, ten functions)", layer:"contract", plane:"none", kind:"client-library", runtime:"both",
   ref:"books/breadboard-kit/src/sdk.md",
   blurb:"One script tag; login, logout, user, list, get, save, remove, upload, watch, fetch, plus the services mirror. No key, no project id, no configuration — the script knows its app from the address it loads on. Its page is the specification: a language model writes a correct app from it on the first try. Every rejection carries code and hint.", status:"settled" },
 { id:"bb.data-api", contextId:"breadboard", name:"The data API", layer:"contract", plane:"none", kind:"openapi", runtime:"deployed",
   ref:"books/breadboard-kit/src/data-store.md#the-store-as-a-service",
   blurb:"The contract a store implements: one partition per (tenant, app, env); tables, rows, files, one watch stream per session, counts, copy and export. Two identities on every call — the app as the binding's consumer key, the person as a forwarded Frontegg JWT — and the table's sharing rule on the call from the served version's manifest. The store stamps, enforces the rule, replaces on save, matches where exactly. Any Switchboard app exposing it as an api service can hold an app's data.", status:"settled" },
 { id:"bb.site-api", contextId:"breadboard", name:"The site management API", layer:"contract", plane:"none", kind:"openapi", runtime:"deployed",
   ref:"books/breadboard-kit/src/site-management-api.md",
   blurb:"createApp, publish, goLive, undo, unpublish, access, quota, listing, connections, the store cell, copy live into test, export, and the executors' callbacks. Called by the console and the builder's AI under a person's token, by Switchboard and the store as IAM workloads; never by a page. Every operation is a Switchboard act underneath.", status:"settled" },
 { id:"bb.app-manifest", contextId:"breadboard", name:"breadboard.json", layer:"contract", plane:"none", kind:"schema", runtime:"both",
   ref:"books/breadboard-kit/src/tables-and-sharing.md#the-sharing-rule",
   blurb:"Travels with every version: the sharing rule per table (just-mine · creator-edits · everyone-edits) and the services the version requires. Read from the version an environment's pointer names, so the rule over a partition is the served version's; a table it omits gets the tightest rule; requires entries merge into connection rows on publish and gate Go live.", status:"settled" },
 { id:"bb.thin-stack", contextId:"breadboard", name:"breadboard-app archetype (the thin stack)", layer:"contract", plane:"none", kind:"release-bundle", runtime:"deployed",
   ref:"books/breadboard-kit/src/on-switchboard.md#the-app",
   blurb:"A published fragment deployed per app per environment: one IAM role bb-<app>-<env> trusting the proxy with the app id as session name, the quota parameters, the Listed parameter, outputs SwbEndpointSite and SwbEndpointApi. It serves no bytes; the shared distribution does. Created from a name alone with a platform-generated manifest.", status:"candidate" },
 /* -- services -- */
 { id:"bb.console", contextId:"breadboard", name:"The Breadboard console", layer:"service", plane:"control", kind:"ui", runtime:"deployed",
   ref:"books/breadboard-kit/src/console.md",
   blurb:"Getting started · My apps · All apps · the app page (Overview, Editor, Data, Versions, Access, Connections, Sharing, Settings). A client of the site management API with no privileged path. Never shows channel, environment, stack, deploy, release, subscription, binding, grant or key; the operator opens the same app in Switchboard for the machinery.", status:"candidate" },
 { id:"bb.site-gateway", contextId:"breadboard", name:"The site management gateway", layer:"service", plane:"control", kind:"api", runtime:"deployed",
   ref:"books/breadboard-kit/src/site-management-api.md#who-calls-it",
   blurb:"The install's Zuplo project implementing the site management API and rendering its developer portal. Validates the person's Frontegg JWT and the workloads' IAM identity; the only writer of the version store; every mutation lands as a Switchboard row or mutation.", status:"candidate" },
 { id:"bb.proxy", contextId:"breadboard", name:"The platform proxy", layer:"service", plane:"control", kind:"api", runtime:"deployed",
   ref:"books/breadboard-kit/src/data-store.md#the-platform-proxy",
   blurb:"Answers every call a page makes to its own origin (/brd/v1/*, /sdk.js): maps the host header to (app, env), reads the binding record from the mirror, assumes bb-<app>-<env> with the app id as session name, presents the consumer key and forwards the person's token, sends the table's rule, relays the answer, holds one watch stream per page, presigns bytes. A page can obtain no key and no alias by any request.", status:"candidate" },
 { id:"bb.store-svc", contextId:"breadboard", name:"brd-store — the default store", layer:"service", plane:"data", kind:"api", runtime:"both",
   ref:"books/breadboard-kit/src/data-store.md#the-default-store",
   blurb:"One program per install embedding PocketBase as a library and never starting its HTTP server; its gateway serves the data API and nothing else, so the engine's generated API has no route to a browser. Every app's rows land in one engine table keyed by partition and table, the app's fields in one JSON column. The same program an ejecting team receives.", status:"candidate" },
 /* -- repositories -- */
 { id:"bb.store-binding", contextId:"breadboard", name:"The store connection (binding record + mirror)", layer:"repository", plane:"none", kind:"adapter", runtime:"deployed",
   ref:"books/breadboard-kit/src/data-store.md#the-store-connection",
   blurb:"COMP#<app> MEMBER#brd-store {bind, api/data, maintain}, written at createApp; the bind executor grants a gateway consumer key on the store and mirrors the binding to /swb/<app>/<env>/services/api/data. The cell map is the one place a store is chosen: point prod at another store and the reconciler rebinds under the live environment's gate; the page, the SDK and the proxy learn it from the mirror.", status:"settled" },
 { id:"bb.version-repo", contextId:"breadboard", name:"The version store repository", layer:"repository", plane:"none", kind:"repository", runtime:"deployed",
   ref:"books/breadboard-kit/src/apps-and-versions.md#versions",
   blurb:"versions/<install>/<app>/<n>/ — every version complete and immutable, written once through a presigned destination the site management API issued. Not a repository: no commits, branches or pull requests, and no repository row in Switchboard.", status:"candidate" },
 { id:"bb.partition-repo", contextId:"breadboard", name:"The partition repository", layer:"repository", plane:"none", kind:"repository", runtime:"both",
   ref:"books/breadboard-kit/src/tables-and-sharing.md#tables-and-rows",
   blurb:"The store's access to one (tenant, app, env): stamps id, owner, created, updated; evaluates the rule; replaces on save; where is exact match on stored fields, in the program over the partition's rows; counts rows and bytes; copy reissues ids and repairs file addresses and whole row ids.", status:"candidate" },
 /* -- stores -- */
 { id:"bb.version-store", contextId:"breadboard", name:"The version store bucket", layer:"store", plane:"none", kind:"object-store", runtime:"deployed",
   ref:"books/breadboard-kit/src/reference-deployment.md#the-installs-stack",
   blurb:"One S3 bucket per install, versioned, write-once under versions/<app>/<n>/. The shared distribution reads the environment's pointer and serves that version's prefix.", status:"candidate" },
 { id:"bb.engine", contextId:"breadboard", name:"The embedded engine's tables", layer:"store", plane:"none", kind:"table-store", runtime:"both",
   ref:"books/breadboard-kit/src/data-store.md#the-default-store",
   blurb:"PocketBase's SQLite inside the store program: one table for every app's rows keyed by partition and table name, one for files. Reachable only through the store program; snapshotted daily; the platform may move a hot app's partitions to a second engine by editing the app's store cell.", status:"candidate" },

 { id:"gq.kb-family", contextId:"geo-iq", name:"geo extractor family (kb: tags)", layer:"contract", plane:"none", kind:"spi", runtime:"both",
   ref:"books/geo-iq/src/admission.md#the-kb-sidecar-family",
   blurb:"The product's policy tags and geo extractors — static-graph, structured, stats, station, weblex, lexical, doclex — registered through cortex-kit's extractor-registry protocol. The entity tag is the product's to apply; its executor is the kit's schema-execution machinery. The frameworks transport and address; they never interpret a kb row.", status:"settled" },

 { id:"gq.stack", contextId:"geo-iq", name:"geo-iq final stack", layer:"contract", plane:"none", kind:"release-bundle", runtime:"build-time",

 { id:"gq.admission", contextId:"geo-iq", name:"Admission decisions (hooks + release policy)", layer:"service", plane:"control", kind:"api", runtime:"deployed",

 { id:"gq.console", contextId:"geo-iq", name:"GEOIQ console (configured shell)", layer:"service", plane:"control", kind:"ui", runtime:"deployed",

 { id:"gq.askgeo", contextId:"geo-iq", name:"ask_geo", layer:"service", plane:"control", kind:"api", runtime:"deployed",
   ref:"books/geo-iq/src/substrate-boundaries.md",
   blurb:"Geo reasoning entry conforming to the ask_station shape, reasoning over graphs through cortex-kit's query tools.", status:"settled" },
 { id:"gq.gateway", contextId:"geo-iq", name:"Zuplo gateway (the product's edge)", layer:"service", plane:"control", kind:"api", runtime:"deployed",
   ref:"books/cortex-kit/src/edge/rocs-zuplo.md",
   blurb:"The product's deployed edge: SSO bearer validation, OpenAPI request-shape validation, rate limiting, tenant attribution — one policy chain the product owns, in front of every pinned kit's routes. Lambdas behind it never see raw SSO bearers.",
   status:"settled", note:"One way in: every caller uses the gateway hostname — CLIs and SDKs directly, browser apps cross-origin via the composed CORS allowlist. Raw warehouse bytes are the one bypass (throughput); graph reads and the graph-borne manifest ride the gateway. REST composed by kit path prefixes; GraphQL federation considered and deferred (#7): it buys schema composition the prefixes + per-kit OpenAPI already give, at the cost of a second schema economy, and the heavy byte path could never ride it." },
 /* -- services: data -- */
 { id:"gq.build", contextId:"geo-iq", name:"geoiq kb build", layer:"service", plane:"data", kind:"cli", runtime:"both",
   ref:"books/geo-iq/src/admission.md#the-build-verbs",
   blurb:"The product verb over checkout: the governed lane is a gvc checkout at a tag; the sandbox lane reads warehouse sidecar mirrors with no repo and no review. Selectors apply in both lanes — data-plane scoping, not governance.", status:"candidate" },
 { id:"gq.pipelines", contextId:"geo-iq", name:"Geo IQ ingest + featurization pipelines", layer:"service", plane:"data", kind:"worker", runtime:"both",
   ref:"books/geo-iq/src/substrate-boundaries.md",
   blurb:"Atlas pipelines producing Geo IQ data, run on the rocs Conductor with their lifecycle on the orchestrator API.", status:"settled" },
 { id:"gq.workbench", contextId:"geo-iq", name:"geoiq workbench (configured shell)", layer:"service", plane:"data", kind:"ui", runtime:"both",
   ref:"books/geo-iq/src/index.md",
   blurb:"A configuration of cortex-kit's Workbench shell: boots graph-first from the graph-borne manifest, session-branch gvc verbs in the sync strip, control-plane panels feature-detected. Local: one command fills every role and shells the atlas3 CLI, never imports it. Deployed, opened from the console, it is the browser workbench: queries in the browser, boot from the graph API behind the gateway, verbs through the gateway — no workbench service.",
   status:"candidate" },

 { id:"gq.manifest-resolver", contextId:"geo-iq", name:"Manifest resolver", layer:"repository", plane:"none", kind:"adapter", runtime:"both",

 { id:"gq.manifest", contextId:"geo-iq", name:"Station manifest (graph-borne artifact)", layer:"store", plane:"none", kind:"catalog", runtime:"both",

questions: [
 { id:"q-parked-state", text:"Parked by design in the record split: where the row state machine lives (the contention around a row is the lease, not the status value, so it does not automatically follow the lock into DynamoDB), pending prompts, and machine versions. Nothing in the split depends on the answer.",
   touches:["rc.machine-bundle","rc.tables"], ref:"books/rocs-kit/src/record-split.md" },
 { id:"q-cascade", text:"The cascade hot path after atlas3-data-edges retires: at registration time the resolved edges can be stamped into the control plane as a projection of an already-reviewed fact — whether that projection or a graph read serves the cascade walk is open.",
   touches:["rc.handlers"], ref:"books/rocs-kit/src/record-split.md" },
 { id:"q-kb-query", text:"Query + tools: the BYOKG-RAG retrieve / retrieve_and_generate shape over a built graph, the graph analytics alongside, and the :Aggregate dual-write for feedback — the one substrate half the spike has not yet proven.",
   touches:["kb.query","kb.retriever"], ref:"books/cortex-kit/src/retrieval.md" },
 { id:"q-stations-substrate", text:"Stations and the H3 lattice: platform machinery or geo domain? 'Everything is spatial' argues the lattice, the coverage model, and the station convention are cortex-kit machinery with products supplying which stations exist; geo-specific rendering stays with geo-iq. The station schema sits in atlas-kit today, and the stations UI leans cortex-side (the #109 UI-module carve records the same question).",
   touches:["af.station-schema","cortex-kit"], ref:"books/cortex-kit/src/index.md" },
{ id:"q-manifest-vocab", text:"The data manifest's view vocabulary — view kinds (index | item | sidecars | log) and the DocumentSource shape — is geoiq-flavored while the boot machinery is the shell's. Kit published language or a product extension point is undecided.",
   touches:["ck.workbench","gq.workbench"], ref:"books/cortex-kit/src/shells.md#open-questions" },
 { id:"q-graph-curated-stac", text:"Graph-curated STAC surfaces beside the full catalog: the catalog API sees everything in the lakehouse, and curated graph releases derive governed catalog trees served as STAC. Whether one API serves both — full catalog plus curated mounts — or a curated surface deploys beside it is open.",
   touches:["af.catalog-api","gk.stacapi"], ref:"books/atlas-kit/src/catalog-api.md#graph-curated-catalogs" },
 { id:"q-browser-byte-access", text:"The browser workbench's deployed byte reads start from the existing mint — the gateway's catalog surface authorizes a warehouse and mints a temporary token used directly against S3, arriving before boot (boot makes no control-plane API calls). Open remainder: whether duckdb-wasm's ranged reads carry the token directly, and whether a CloudFront distribution with signed cookies is added in front for caching.",
   touches:["gq.workbench","af.warehouses"], ref:"books/atlas-kit/src/warehouses.md#open-questions" },
 { id:"q-settings-protocol", text:"The kit's settings class carries a product-branded name (GeoIQSettings, GEOIQ_ env prefix; geoiq re-exports it). The kit-neutral settings protocol and the rename are undecided naming debt.",
   touches:["cortex-kit","geo-iq"], ref:"books/cortex-kit/src/architecture.md#known-sharp-edges" },
 { id:"q-immutability", text:"Atlas releases are mutable (overwrite=True): immutability is a convention Atlas does not enforce — append-only stores and fingerprint addressing hold the line, and gvc verification now makes a violated fp link visibly fail tree verification rather than making it safe. Where enforcement should live is undeclared.",
   touches:["af.publisher","gk.repos"], ref:"books/cortex-kit/src/architecture.md#known-sharp-edges" },
 { id:"q-tags-home", text:"kb: policy tags need a home the producer round-trip cannot erase — DatasetConfig.tags are dropped by finalize_manifest and a republish resets patched tags.",
   touches:["gq.kb-family","af.publisher"], ref:"books/cortex-kit/src/architecture.md#known-sharp-edges" },
 { id:"q-edge-migration", text:"Catalog logic runs inside the Zuplo edge runtime today — 'migration debt, not the design'. The design places the AWS boundary at the lambda; migration sequencing is open.",
   touches:["af.backend","gq.gateway"], ref:"books/atlas-kit/src/catalog-backend.md#the-official-sdk-boundary" },
 { id:"q-rung-producers", text:"Acquisition rungs (web_discover / web_acquire / extract / agent / monitor) run inside integration nodes today but should be producer-shaped by the atlas rule — a named deviation awaiting reclassification.",
   touches:["kb.web"], ref:"books/cortex-kit/src/registries.md" },
 { id:"q-geoiq-agents", text:"The Geo IQ agent set — which agents specialize in geospatial reasoning, and how they layer on the rocs Conductor.",
   touches:["geo-iq","rc.conductor"], ref:"books/geo-iq/src/index.md" },
 { id:"q-token-lifetime", text:"Long-running token lifetimes for queue-trigger Conductors — 30-minute scoped tokens force frequent refresh during long scenarios; a bespoke service-token shape may land later.",
   touches:["rc.api","rc.conductor"], ref:"books/rocs-kit/src/api/trust-boundary.md#open-questions" },
 { id:"q-acl-granularity", text:"Per-scope ACLs vs flat tenant ACL — v1 is flat; a second pass may layer per-pipeline or per-scenario-prefix ACLs.",
   touches:["rc.api"], ref:"books/rocs-kit/src/api/trust-boundary.md#open-questions" }
],

/* =====================================================================
   Responses · one each, in flight until it settles
   ===================================================================== */
function toast(msg, fail){ const t = document.createElement('div'); t.className = 'toast'+(fail?' fail':''); t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 2600); }
function logLine(text, opts={}){ state.log.unshift({t:tick(), text, ...opts}); }
function send(n, a, arg){
  const d = DECISIONS.find(x => x.n===n); if(!d) return; if(state.inflight[n]){ toast(`${n} · already sending · wait for it to settle`, true); return; }
  const text = a==='yes' ? `yes ${n}` : a==='no' ? `no ${n}` : a==='redo' ? `${n} redo: ${arg}` : a==='reply' ? `${n}: ${arg}` : a==='pick' ? `${n} pick ${arg}` : `${n} ${a}`;
  state.inflight[n] = {a, arg, text}; render();
  setTimeout(() => { delete state.inflight[n]; logLine(text, {n}); toast(`${text} · recorded`); const el = $(`.card[data-n="${n}"]`); if(el) el.classList.add('gone');
    setTimeout(() => { DECISIONS = DECISIONS.filter(x => x.n!==n); if(state.panel && state.panel.type==='decision' && state.panel.n===n) state.panel = null; render(); }, 260); }, 950);
}
function say(text){ logLine(text, {say:true}); toast(`say → ${text} · applied`); }
function attachClaim(cid, elId){ const c = claimById(cid); if(c.attach.includes(elId)){ toast(`${c.name} is already attached there`, true); return; }
  const before = scopeOf(c); c.attach.push(elId); const after = scopeOf(c); after.filter(r => !before.includes(r)).forEach(r => { if(!c.verdicts[r]) c.verdicts[r] = 'unjudged'; });
  logLine(`attach ${c.name} → ${elName(elId)}`, {}); toast(`attach ${c.name} → ${elName(elId)} · recorded${after.length!==before.length ? ' · scope now '+after.join(', ') : ''}`); state.attach = null; state.panel = {type:'claim', id:cid}; render(); }
function detachClaim(cid, elId){ const c = claimById(cid); if(c.attach.length<=1) return; c.attach = c.attach.filter(a => a!==elId); logLine(`detach ${c.name} ← ${elName(elId)}`, {}); toast(`detach ${c.name} ← ${elName(elId)} · recorded · scope now ${scopeOf(c).join(', ')||'nobody'}`); render(); }
function addRepository(){ const a = state.addRepo; const id = a.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); if(!id || REPOS.find(r => r.id===id)){ toast(`repository ${id||'?'} · name it, and not one already in the fleet`, true); return; }
  a.nodes.forEach(nid => { HOMES[nid] = id; }); REPOS.push({id, book:'—', note:`joined ${hhmm(minutes)} · homes ${a.nodes.length} nodes`, fresh:true});
  const cs = CLAIMS.filter(c => scopeOf(c).includes(id)); cs.forEach(c => { c.verdicts[id] = 'unjudged'; });
  say(`add repository ${id} · homes ${a.nodes.length} nodes`); state.addRepo = null; state.panel = {type:'repo', id}; state.repoFilter = id; render();
  setTimeout(() => { cs.forEach(c => { c.verdicts[id] = 'not satisfied'; }); const n = nextN++; DECISIONS.push({n, g:APPROVE, kind:'baseline', on:'repo:'+id, title:id, tail:`<b>${cs.length} claims unmet</b> · judged once at the first planning · planning's first proposal for the repository`, answers:[['yes','yes'],['pick','pick'],['later','later']]}); toast(`${n} · baseline ${id} · judged once · in the rail`); render(); }, 2500); }

/* =====================================================================
   Events
   ===================================================================== */
const wrap = $('#svgwrap'), canvas = $('#canvas'); let drag = null, moved = 0;
wrap.addEventListener('pointerdown', e => { if(e.button!==0) return; drag = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y}; moved = 0; });
window.addEventListener('pointermove', e => { if(!drag) return; const dx = e.clientX-drag.x, dy = e.clientY-drag.y; moved = Math.max(moved, Math.abs(dx)+Math.abs(dy)); if(moved>4){ wrap.classList.add('panning'); view.x = drag.vx+dx; view.y = drag.vy+dy; applyView(); } });
window.addEventListener('pointerup', () => { drag = null; wrap.classList.remove('panning'); });
wrap.addEventListener('wheel', e => { e.preventDefault(); const r = canvas.getBoundingClientRect(), mx = e.clientX-r.left, my = e.clientY-r.top; const k0 = view.k, k = Math.min(2.5, Math.max(.15, k0*(e.deltaY<0?1.13:.885))); view.x = mx-(mx-view.x)*(k/k0); view.y = my-(my-view.y)*(k/k0); view.k = k; applyView(); }, {passive:false});
function select(id, add){ if(add){ const i = state.sel.indexOf(id); if(i>=0) state.sel.splice(i,1); else state.sel.push(id); } else state.sel = [id]; state.panel = null; render(); }
canvas.addEventListener('click', e => { if(moved>4) return;
  const mk = e.target.closest('.mk'); if(mk){ state.panel = {type:'decision', n:+mk.dataset.mark}; render(); return; }
  const g = e.target.closest('g.node'); if(g){ const id = g.dataset.id; if(state.attach){ attachClaim(state.attach, id); return; } select(id, e.shiftKey); return; }
  state.sel = []; state.panel = null; render(); });
document.addEventListener('click', e => {
  const t = e.target, b = t.closest('button');
  if(b && b.dataset.map){ state.map = b.dataset.map; state.sel = []; render(); fitView(); return; }
  if(b && b.dataset.ov){ state.ov = b.dataset.ov; render(); return; }
  if(b && b.dataset.rt){ state.rt = b.dataset.rt; render(); return; }
  if(b && b.dataset.tab){ state.tab = b.dataset.tab; render(); if(state.tab==='map') fitView(); return; }
  if(b && b.dataset.kind){ const k = b.dataset.kind; state.pins.has(k) ? state.pins.delete(k) : state.pins.add(k); render(); return; }
  if(b && b.id==='theme'){ const r = document.documentElement; const cur = r.dataset.theme||'system'; const next = cur==='system'?'light':cur==='light'?'dark':'system'; if(next==='system') delete r.dataset.theme; else r.dataset.theme = next; b.textContent = next; return; }
  if(b && b.id==='logbtn'){ const l = $('#log'); l.hidden = !l.hidden; return; }
  if(b && b.dataset.a !== undefined){ const n = +b.dataset.n, a = b.dataset.a; if(state.inflight[n]){ toast(`${n} · already sending`, true); return; }
    if(a==='redo'||a==='reply'||a==='pick'){ const box = b.closest('.card').querySelector('.argbox'); if(box.dataset.arg===a){ box.innerHTML=''; delete box.dataset.arg; return; } box.dataset.arg = a; box.innerHTML = `<div class="field">${a==='pick' ? `<input placeholder="which intents (space separated)" aria-label="pick">` : `<textarea rows="2" placeholder="${a==='redo'?'what planning should change…':'your answer to the session…'}"></textarea>`}<button class="btn pri sm" data-send="${a}" data-n="${n}">send</button><button class="btn quiet sm" data-cancel="1">cancel</button></div>`; box.querySelector('input,textarea').focus(); return; }
    send(n, a); return; }
  if(b && b.dataset.send){ const box = b.closest('.argbox'); const v = box.querySelector('input,textarea').value.trim(); if(!v) return; send(+b.dataset.n, b.dataset.send, v); return; }
  if(b && b.dataset.cancel){ const box = b.closest('.argbox'); box.innerHTML = ''; delete box.dataset.arg; return; }
  if(b && b.dataset.mark){ state.tab = 'map'; state.panel = {type:'decision', n:+b.dataset.mark}; render(); const dd = DECISIONS.find(x => x.n===+b.dataset.mark); if(dd && !dd.on.startsWith('repo:')) focusOn(dd.on); return; }
  if(b && b.dataset.claim){ state.claimSel = b.dataset.claim; if(state.tab==='map'){ state.panel = {type:'claim', id:b.dataset.claim}; } render(); return; }
  if(b && b.dataset.repo !== undefined && b.dataset.repo){ state.panel = {type:'repo', id:b.dataset.repo}; if(state.tab!=='repos') state.tab = 'map'; render(); return; }
  if(b && b.dataset.filter){ state.repoFilter = state.repoFilter===b.dataset.filter ? '' : b.dataset.filter; state.tab = 'map'; render(); return; }
  if(b && b.dataset.goto){ const id = b.dataset.goto; state.tab = 'map'; if(nodesById.has(id)||ctxById.has(id)){ state.sel = [id]; state.panel = null; } render(); focusOn(id); return; }
  if(b && b.dataset.attach){ state.attach = b.dataset.attach; state.tab = 'map'; render(); return; }
  if(b && b.dataset.attachpick){ const el = b.dataset.attachpick; const box = document.createElement('div'); box.className = 'field'; box.style.marginTop = '6px'; box.innerHTML = `<select aria-label="claim">${CLAIMS.filter(c => !c.attach.includes(el)).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button class="btn pri sm" data-attachto="${esc(el)}">attach</button>`; b.replaceWith(box); return; }
  if(b && b.dataset.attachto){ const sel = b.parentElement.querySelector('select'); attachClaim(sel.value, b.dataset.attachto); return; }
  if(b && b.dataset.attachcancel){ state.attach = null; render(); return; }
  if(b && b.dataset.detach){ detachClaim(b.dataset.detach, b.dataset.el); return; }
  if(b && b.dataset.capture){ logLine(`capture: ${b.dataset.text}`, {say:true}); toast('capture · 1 signal · curation sees it'); b.textContent = 'captured'; b.disabled = true; renderLog(); $('#sent').textContent = state.log.length; return; }
  if(b && b.dataset.addrepo){ state.addRepo = {name:'', nodes:[]}; state.panel = {type:'add'}; render(); $('#ar-name')?.focus(); return; }
  if(b && b.id==='ar-cancel'){ state.addRepo = null; state.panel = null; render(); return; }
  if(b && b.id==='ar-add'){ addRepository(); return; }
  if(b && b.id==='fit'){ fitView(); return; }
  if(b && b.id==='review-mark'){ REVIEW.mark = '09-04 '+hhmm(minutes); REVIEW.notes = {}; say(`reviewed · mark ${REVIEW.mark}`); render(); return; }
  const row = t.closest('tr[data-sel]'); if(row){ const id = row.dataset.sel; if(!nodesById.has(id)&&!ctxById.has(id)) state.ov = 'delta'; state.tab = 'map'; state.sel = [id]; state.panel = null; render(); focusOn(id); return; }
  const crow = t.closest('tr[data-claim]'); if(crow){ state.claimSel = crow.dataset.claim; render(); return; }
  const rrow = t.closest('tr[data-repo]'); if(rrow){ state.panel = {type:'repo', id:rrow.dataset.repo}; render(); return; }
  const rel = t.closest('.rel[data-goto]'); if(rel){ state.sel = [rel.dataset.goto]; state.panel = null; render(); return; }
  if(!t.closest('#log,#logbtn') && !$('#log').hidden) $('#log').hidden = true;
});
document.addEventListener('change', e => { const t = e.target;
  if(t.id==='repo-filter'){ state.repoFilter = t.value; render(); return; }
  if(t.id==='ar-name'){ state.addRepo.name = t.value.trim(); render(); $('#ar-name')?.focus(); return; }
  if(t.dataset.arnode){ const id = t.dataset.arnode; state.addRepo.nodes = t.checked ? [...state.addRepo.nodes, id] : state.addRepo.nodes.filter(x => x!==id); const host = t.closest('#panel-repos') ? $('#panel-repos') : $('#panel'); const keep = host.scrollTop; host.innerHTML = panelAddRepo(); host.scrollTop = keep; return; } });
document.addEventListener('keydown', e => { if(e.target.matches('input,textarea,select')){ if(e.key==='Escape') e.target.blur(); return; }
  if(e.key==='Escape'){ if(state.attach){ state.attach = null; render(); return; } if(!$('#log').hidden){ $('#log').hidden = true; return; } state.sel = []; state.panel = null; render(); return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='m'){ state.map = state.map==='current'?'target':'current'; state.sel = []; render(); fitView(); }
  if(e.key==='0'){ fitView(); }
  if(e.key==='d'){ state.ov = state.ov==='delta'?'none':'delta'; render(); }
  if(e.key==='r'){ state.ov = state.ov==='review'?'none':'review'; render(); }
  if(e.key==='y'||e.key==='n'||e.key==='l'){ const d = focusedDecision(); if(!d) return; const a = d.answers.map(x => x[0]).find(x => KEYS[x]===e.key); if(!a){ toast(`${d.n} · no "${e.key}" answer · ${d.answers.map(x=>x[0]).join(' · ')}`, true); return; } send(d.n, a); }
});
window.addEventListener('resize', () => { if(state.tab==='map') fitView(); });

/* first frame */
const Q = new URLSearchParams(location.search);
if(Q.get('theme')){ document.documentElement.dataset.theme = Q.get('theme'); $('#theme').textContent = Q.get('theme'); }
if(Q.get('map')) state.map = Q.get('map'); if(Q.get('overlay')) state.ov = Q.get('overlay'); if(Q.get('tab')) state.tab = Q.get('tab'); if(Q.get('repo')) state.repoFilter = Q.get('repo');
buildModel(); if(Q.get('sel')) state.sel = [Q.get('sel')]; if(Q.get('claim')){ state.claimSel = Q.get('claim'); state.panel = {type:'claim', id:Q.get('claim')}; } if(Q.get('decision')) state.panel = {type:'decision', n:+Q.get('decision')};
render(); if(state.sel[0]) focusOn(state.sel[0]); else if(state.panel && state.panel.type==='claim') focusOn(claimById(state.panel.id).attach[0]); else if(ctxById.has('switchboard')) focusOn('switchboard'); else fitView();
window.CM = {state, MAPS, DIFF, CLAIMS, REPOS, HOMES, DECISIONS:() => DECISIONS, scopeOf, derived, render};
})();

</script>
