<!doctype html>
<html lang="en">
<head>
<!--
  Journey - an enterprise that holds its own key and, past that, its own AWS account, so the service
  is a control plane and never sees content. Six screens, one at a time, the stepper across the top,
  and the exact promise stated on every screen. Drawn in rail-and-board.html's visual language.

  Source: ../../proposals/security.md as revised - section 5 "Customer journeys", third journey;
  section 2 "The warm cache" for what is sealed and when it is unwrapped; section 4 Designs B and C,
  and section 3 options (b), (d) and (e). Clauses: 256 (everything kept between ticks sealed under a
  key naming one organization), 257 (unwrapped only for a tick, by the role that runs it), 259 (a role
  per organization per tick), 260 (a revoked key fails closed), 261 (stated on the settings form),
  263 (raw material only on the operator's own machine or a single-organization machine), 264 (code
  only on such a machine, destroyed at retire), 265 (envelopes on GitHub are a declaration and never
  the default). Requirements: 207 (their own App and its key), 240-241 (pools, one organization per
  host), 204 (init as effects with proofs).

  The enclave screen is section 3(d) and the third journey's own sentence: an enclave that releases
  the key only to an attested image is what removes our staff from the trust set, as against a grant
  which only makes us revocable. Section 3(e)'s residual - our binary still runs there - is stated on
  that screen rather than omitted. Nothing here claims git contents are encrypted.

  Invented and marked as such: decision number 433, the role arn and the external id willdan-8f21,
  the two aws CLI lines as illustrations of the key and its grant, and the wording of every control.

  Review switches: ?screen=1..6, ?theme=dark|light.
-->
<meta charset="utf-8">
<title>An enterprise on its own account</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#F6F8FA; --ink:#16202A; --ink2:#4A5763; --ink3:#7A8794;
  --line:#D5DBE1; --line2:#E4E8EC; --accent:#0B6E79; --accent-ink:#FFFFFF; --accent-soft:#D9EEF0; --accent-hatch:rgba(11,110,121,.10);
  --ok:#2E8B57; --warn:#B7791F; --crit:#B3362B; --lit:#FFF3C4; --lit-line:#E5C34A;
  --shadow:0 10px 30px rgba(22,32,42,.16);
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12171C; --surface:#1A2128; --surface2:#20282F; --ink:#E6EBEF; --ink2:#A9B4BE; --ink3:#74818C;
  --line:#2A333C; --line2:#232C34; --accent:#4FB3BF; --accent-ink:#0E1A1C; --accent-soft:#173A3E; --accent-hatch:rgba(79,179,191,.10);
  --ok:#5CB57F; --warn:#D9A24A; --crit:#E0675B; --lit:#3A3416; --lit-line:#B89B2D; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#12171C; --surface:#1A2128; --surface2:#20282F; --ink:#E6EBEF; --ink2:#A9B4BE; --ink3:#74818C;
  --line:#2A333C; --line2:#232C34; --accent:#4FB3BF; --accent-ink:#0E1A1C; --accent-soft:#173A3E; --accent-hatch:rgba(79,179,191,.10);
  --ok:#5CB57F; --warn:#D9A24A; --crit:#E0675B; --lit:#3A3416; --lit-line:#B89B2D; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3{margin:0;font-weight:800;text-wrap:balance}
h1{font-size:19px;letter-spacing:-.01em}
h2{font-size:17px}
h3{font-size:13.5px;font-weight:700}
p{margin:0}
.mono{font-family:var(--mono);font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.sample{font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border:1px dashed var(--line);border-radius:3px;padding:0 4px;white-space:nowrap}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 64px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.top .who{margin-left:auto;font-size:12px;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:var(--surface);font-weight:600;font-size:12.5px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:transparent;color:var(--ink2)}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;font:10.5px var(--mono);padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--surface2)}
.chip.g{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.w{border-color:var(--warn);color:var(--warn)}
/* stepper */
.stepper{display:flex;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.step{flex:1;display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-left:1px solid var(--line2);text-align:left;color:var(--ink3);min-width:0}
.step:first-child{border-left:0}
.step .n{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 11px var(--mono);flex:none}
.step .l{min-width:0}
.step .l b{display:block;font-size:12px;font-weight:700;color:var(--ink2);overflow-wrap:anywhere}
.step .l span{font-size:11px;line-height:15px;display:block}
.step.done{color:var(--ink2)}
.step.done .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.now{background:var(--accent-soft)}
.step.now .n{border-color:var(--accent);color:var(--accent)}
.step.now .l b{color:var(--ink)}
/* screen */
.screen{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.screen-h{padding:14px 16px;border-bottom:1px solid var(--line2)}
.screen-h .sub{color:var(--ink2);margin-top:4px}
.screen-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.promise{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.promise .eyebrow{color:var(--accent)}
.promise p{margin-top:4px;color:var(--ink)}
.promise ul{margin:6px 0 0;padding-left:18px}
.promise li{margin:3px 0}
.never{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;background:var(--surface2)}
.never .eyebrow{color:var(--ink3)}
.never ul{margin:6px 0 0;padding-left:18px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.card + .card{margin-top:8px}
.card .ct{font-weight:700}
.card .cs{color:var(--ink2);font-size:12.5px;margin-top:3px}
.pick{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.pick input{margin-top:3px;accent-color:var(--accent);flex:none}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px}
.kv .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.kv .v{margin-top:2px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line2);background:var(--surface2)}
.note{font-size:12px;color:var(--ink3)}
.cmd{font-family:var(--mono);font-size:12px;background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:8px;word-break:break-all}
.flow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.flow .box{flex:1;min-width:150px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface2)}
.flow .box.here{border-color:var(--accent);background:var(--accent-soft)}
.flow .box b{display:block}
.flow .box .small{font-size:11.5px;color:var(--ink2);margin-top:4px}
.arrow{align-self:center;color:var(--ink3);font-size:16px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
.t th{text-align:left;color:var(--ink3);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line2)}
.t td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
@media (max-width:760px){
  .wrap{padding:10px 10px 48px}
  .stepper{flex-direction:column}
  .step{border-left:0;border-top:1px solid var(--line2)}
  .step:first-child{border-top:0}
  .flow{flex-direction:column}
  .arrow{transform:rotate(90deg)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Your key, then your account</h1>
    <span class="chip">journey · enterprise</span>
    <span class="who">Designs B and C</span>
  </div>
  <div class="stepper" id="stepper"></div>
  <div id="screen"></div>
</div>
<script>
const SCREENS = [
 {
  "step": "The shape",
  "stepNote": "your key, then your account",
  "title": "Everything the hosted tier promises, plus the key is yours",
  "sub": "This tier starts from the hosted tier&#8217;s guarantees and moves the key into your account. Past that, if you would rather we held nothing at all, we provision the whole thing into your account and become a control plane.",
  "promise": "<b>Everything above, plus the key is yours</b> — we cannot use it once you revoke it, and revocation stops us reading anything, anywhere, within minutes, with no ticket and no waiting on a deletion job.",
  "body": "<div class=\"flow\">\n      <div class=\"box\"><b>your key, our compute</b><div class=\"small\">we run the ticks; your KMS key seals every warm store; a grant you revoke is the switch</div></div>\n      <span class=\"arrow\">&#8594;</span>\n      <div class=\"box\"><b>plus an enclave</b><div class=\"small\">the key policy releases it only to an attested image, so our staff and a compromised image are out of the set</div></div>\n      <span class=\"arrow\">&#8594;</span>\n      <div class=\"box here\"><b>your account, our control plane</b><div class=\"small\">the binary runs in your account; we keep names, health and billing counters</div></div>\n    </div>\n    <div class=\"kv\">\n      <div><div class=\"k\">Already true from the tier below</div><div class=\"v\">warm stores sealed under one key per organization, unwrapped only for a tick · code only on a machine created for you and destroyed after · raw material read only there or on your own machine</div></div>\n      <div><div class=\"k\">What this tier adds</div><div class=\"v\">the key lives in your account, its use is logged in your account, and revocation is yours</div></div>\n      <div><div class=\"k\">The trade</div><div class=\"v\">the slowest onboarding, an always-on floor, and support that cannot see what broke</div></div>\n    </div>",
  "never": [
   "change what GitHub holds — your repositories sit there under GitHub&#8217;s own encryption unless you turn on the envelope declaration (265)",
   "ask you to migrate: every tier seals the same stores the same way"
  ],
  "next": "Create the key"
 },
 {
  "step": "The key",
  "stepNote": "yours, revocable",
  "title": "Create the key in your account",
  "sub": "One customer-managed key per organization, its policy naming only the role that ticks your organization, every warm store bound to it by encryption context.",
  "promise": "<b>Revocation stops us reading anything, anywhere, within minutes</b> — no ticket, no request to us, no waiting for a deletion job. <b>Every use of your key is logged in your account, not ours.</b>",
  "promiseList": [
   "the key is unwrapped only while your plan is being evaluated, by the role that runs that tick and no other (257, 259)",
   "a revoked or unreachable key fails closed: no tick proceeds on state it cannot open, every host of the organization shows one attention line naming the key and since when, work already running is not interrupted, and nothing is ever kept unencrypted as a fallback (260)",
   "the key&#8217;s home is named in your manifest, so it is a fact of the organization and not a setting of ours"
  ],
  "body": "<div class=\"rows\">\n      <div class=\"card\"><div class=\"ct\">1 · create the key</div><div class=\"cs\">a customer-managed KMS key in your account, in the region your hosts run in</div>\n        <div class=\"cmd\">aws kms create-key --description \"flywheel · willdan\" --tags TagKey=flywheel-org,TagValue=willdan</div></div>\n      <div class=\"card\"><div class=\"ct\">2 · grant its use</div><div class=\"cs\">a grant to the role that ticks your organization, with the encryption context that names it · revoke at any time and we stop reading within minutes</div>\n        <div class=\"cmd\">aws kms create-grant --key-id &lt;key&gt; --grantee-principal &lt;the role for willdan&gt; --operations Decrypt GenerateDataKey</div></div>\n      <div class=\"card\"><div class=\"ct\">3 · read the log</div><div class=\"cs\">every <span class=\"mono\">Decrypt</span> is a CloudTrail event in your account: which role, which organization, which tick, and when · the settings form shows the same facts from our side (261)</div></div>\n    </div>",
  "never": [
   "copy your key material anywhere",
   "hold a copy of a data key between ticks (257)",
   "ask you for a copy of your state when we cannot read it"
  ],
  "next": "Take us out of the set"
 },
 {
  "step": "The enclave",
  "stepNote": "attestation, not trust",
  "title": "If you want our staff out of the picture",
  "sub": "A grant makes us revocable. An enclave makes us unable, which is a different promise and the honest one to want.",
  "promise": "<b>We run your ticks in an enclave that releases your key only to an attested image</b>, so our staff and a compromised image are out of the trust set rather than merely switchable off.",
  "promiseList": [
   "the key policy conditions release on the image&#8217;s attestation, so a human with production access cannot use it",
   "it closes the residual the tier below states plainly: a compromised ticker while it is running",
   "it is an option on this tier, not a default, because it costs a slower and narrower runtime"
  ],
  "body": "<div class=\"grid\">\n      <div class=\"card\"><div class=\"ct\">Without it</div><div class=\"cs\">your key is revocable, and while a tick is running the process evaluating your plan holds your plaintext. That is the residual, and we state it rather than paper over it.</div></div>\n      <div class=\"card\"><div class=\"ct\">With it</div><div class=\"cs\">the key is released only to the measured image; there is no path from a person or a modified build to your plaintext</div></div>\n    </div>\n    <div class=\"note\">The one thing neither covers is our supply chain: the image is still built by us. That is the last residual and it is named here rather than left for you to find.</div>",
  "never": [
   "claim an enclave removes our supply chain from the set",
   "turn it on silently — it is a declaration with a cost you accept"
  ],
  "next": "Your own account"
 },
 {
  "step": "Your account",
  "stepNote": "a role with an external id",
  "title": "Or hold everything yourself",
  "sub": "You grant a role our control plane assumes with an external id. It provisions the binary and the pools into your account, and nothing else.",
  "promise": "<b>We provision the whole thing into your account and keep only your organization&#8217;s name, its health and its bill.</b>",
  "promiseList": [
   "provisioning runs against your account with credentials read at run time and never stored",
   "the binary we install is the same binary; your manifest and your repositories are the ones you already have",
   "the role is yours to revoke, and what it may do is what its policy says"
  ],
  "body": "<div class=\"rows\">\n      <div class=\"card\"><div class=\"ct\">Role</div><div class=\"cs\"><span class=\"mono\">arn:aws:iam::&lt;you&gt;:role/flywheel-control-plane</span> · trusted principal: our account · condition: <span class=\"mono\">sts:ExternalId = willdan-8f21</span> <span class=\"sample\">sample</span></div></div>\n      <div class=\"card\"><div class=\"ct\">What it may do</div><div class=\"cs\">create and destroy hosts and pool hosts from your image · read the health of what it created · nothing on your buckets, your repositories or your key beyond the grant you made</div></div>\n      <div class=\"card\"><div class=\"ct\">Region and floor</div><div class=\"cs\">one always-on host for the loops, plus pool hosts while there is approved work · this is the per-customer floor the tier costs</div></div>\n    </div>",
  "never": [
   "assume the role without the external id",
   "use the role to read a bucket or a repository"
  ],
  "next": "What runs where"
 },
 {
  "step": "What runs where",
  "stepNote": "the honest table",
  "title": "What runs where",
  "sub": "Every part of the flywheel, and which side of the line it is on, once the whole thing is in your account.",
  "promise": "<b>No content crosses the line.</b> What reaches us is your organization&#8217;s name, tick counts, error classes and billing counters — never a record body.",
  "body": "<div class=\"tw\"><table class=\"t\">\n      <tr><th>Part</th><th>Runs in</th><th>Sees</th></tr>\n      <tr><td><b>the loops and the tick</b></td><td>your account</td><td>your state, opened with your key for that tick (257)</td></tr>\n      <tr><td><b>the warm cache</b></td><td>your account</td><td>your clones, sealed under your key at rest (256)</td></tr>\n      <tr><td><b>the capture endpoint and triage</b></td><td>your account</td><td>your raw material, in a bucket you own (263)</td></tr>\n      <tr><td><b>pool hosts, units, builds and tests</b></td><td>your account</td><td>your code, on machines destroyed at retire (264, 240)</td></tr>\n      <tr><td><b>the chat sink</b></td><td>your account</td><td>your channel, through your own bot</td></tr>\n      <tr><td><b>the GitHub App</b></td><td>yours</td><td>the repositories you listed, under a key you placed (207)</td></tr>\n      <tr><td><b>GitHub</b></td><td>theirs</td><td>your repositories, in plaintext under their own encryption — unchanged by any tier (265 is the declaration that changes it)</td></tr>\n      <tr><td><b>our control plane</b></td><td>ours</td><td>your organization&#8217;s name, health and bill · never a record body</td></tr>\n    </table></div>",
  "never": [
   "receive a record body at the control plane",
   "run one of your sessions on a machine of ours"
  ],
  "next": "What you give up"
 },
 {
  "step": "The trade",
  "stepNote": "and one decision",
  "title": "What you give up, then one decision",
  "sub": "Every tier is honest about its cost, and this one costs support. Nothing above has created a host, a pool or a repository: the flow ends by raising one decision, and the yes runs init in your account.",
  "promise": "<b>Past the point where you hold the key we genuinely cannot read your state, and we will say so rather than ask you for a copy.</b>",
  "promiseList": [
   "debugging becomes something we walk you through, on your screen, with your logs",
   "onboarding is the slowest of the three tiers, because it waits on your account, your App and your key",
   "the cost has a per-customer floor: the always-on host exists whether or not you have work"
  ],
  "body": "<div class=\"card\"><div class=\"ct\">decision 433 · initialize <span class=\"mono\">willdan</span> in your AWS account · approve · yes · no</div>\n      <div class=\"cs\">the yes assumes the role, provisions the first host from your image, registers it, and the first tick opens your state with your key. Init runs as effects with proofs, so running it again changes nothing and a half-finished bootstrap is advanced rather than restarted. <a href=\"../rail-and-board.html?open=d:433\">answer in the plan console</a></div></div>\n    <div class=\"kv\">\n      <div><div class=\"k\">If the key is revoked</div><div class=\"v\">every host of the organization shows one attention line naming the key and since when; nothing is kept unencrypted (260)</div></div>\n      <div><div class=\"k\">If you leave</div><div class=\"v\">the repositories, the manifest and the binary are already yours; revoking the role and the grant ends our reach entirely</div></div>\n      <div><div class=\"k\">Moving here</div><div class=\"v\">not a migration: we re-wrap the data keys and leave your history alone</div></div>\n    </div>",
  "never": [
   "pretend we can support what we cannot read",
   "keep a copy when you leave",
   "charge you for a shared tier you are not on"
  ],
  "next": "Done"
 }
];
let i = 0;
function render(){
  document.getElementById('stepper').innerHTML = SCREENS.map((s, n) =>
    `<button class="step ${n < i ? 'done' : ''} ${n === i ? 'now' : ''}" data-go="${n}">
      <span class="n">${n < i ? '&#10003;' : n + 1}</span>
      <span class="l"><b>${s.step}</b><span>${s.stepNote}</span></span></button>`).join('');
  const s = SCREENS[i];
  document.getElementById('screen').innerHTML = `<div class="screen">
    <div class="screen-h"><span class="eyebrow">screen ${i + 1} of ${SCREENS.length}</span>
      <h2>${s.title}</h2><div class="sub">${s.sub}</div></div>
    <div class="screen-b">
      <div class="promise"><span class="eyebrow">the promise at this step</span><p>${s.promise}</p>${s.promiseList ? `<ul>${s.promiseList.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}</div>
      ${s.body}
      ${s.never ? `<div class="never"><span class="eyebrow">what this step never does</span><ul>${s.never.map(x => `<li>${x}</li>`).join('')}</ul></div>` : ''}
    </div>
    <div class="foot">
      <button class="btn quiet" data-go="${Math.max(0, i - 1)}" ${i === 0 ? 'disabled' : ''}>Back</button>
      <button class="btn pri" data-go="${Math.min(SCREENS.length - 1, i + 1)}" ${i === SCREENS.length - 1 ? 'disabled' : ''}>${s.next || 'Next'}</button>
    </div></div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if(!b || b.disabled) return;
  i = +b.dataset.go; render(); window.scrollTo(0, 0);
});
const q = new URLSearchParams(location.search);
if(q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
if(q.get('screen')) i = Math.max(0, Math.min(6 - 1, +q.get('screen') - 1));
render();
</script>
</body>
</html>
