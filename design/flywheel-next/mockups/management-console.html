<!--
  Management console — everything the operator administers, drawn in the AWS Cloudscape design system.
  Cut from rail-and-board.html and carrying its seed: organization willdan, 2026-09-04 07:40, members
  chuck · rhea · lee, hosts studio · mac-mini · willdan-cloud, pool willdan-pool with pool-a1 and
  pool-a2, repositories atlas · switchboard · new-repo · books, and the package index. The plan console
  (rail-and-board.html) keeps the rail, the board, the dock and the flywheel; nothing was removed from
  it — this file is a second reading of the same state for evaluation.

  Cloudscape: the ESM route was tried and refused. https://cdn.jsdelivr.net/npm/@cloudscape-design/components@3/+esm
  is 2.7MB, imports React 19 itself (so a React 18 UMD beside it is moot) and references no stylesheet:
  Cloudscape ships its components' CSS as build-time CSS modules, and the +esm bundle carries none, so
  every component would render unstyled. The visual language is drawn by hand instead, against the real
  token values read from @cloudscape-design/design-tokens@3.0.111 index-visual-refresh.json, light and
  dark: the greys (#0f141a · #424650 · #656871 · #8c8c94 · #c6c6cd · #ebebf0 · #f9f9fa), the blues
  (#006ce0 light · #42b4ff dark), the status colours, the 16px container radius, the 20px button radius,
  Open Sans at 14px/20px, and the dark surfaces (#0f141a ground, #161d26 container). Reproduced by hand:
  top navigation, side navigation, content layout with breadcrumbs and a page header, container with
  header, table with a header counter and actions, key-value pairs, status indicators, badges, buttons
  (primary · normal · link · inline icon), form field, input, select, radio group, checkbox, expandable
  section, tabs, wizard, flashbar and split panel.

  Decisions taken while building:
  - The console is administration only. Every answer stays in the plan console: an install, an
    enrolment, an image rebuild and a binary upgrade are shown raising one decision with its number
    and a link "answer in the plan console" (S113, S118, S124). Nothing here is in the count, nothing
    here is answered, and no install runs from a form.
  - A configuration change is one logged response, applied by the machinery as a re-install of that
    package (S119); a flashbar confirms it and says what was logged. Retire and restore in the
    organization store are one logged response each (S156).
  - The organization is chosen in the top navigation and nowhere else. The side navigation lists the
    sections of the organization in hand and no entity of any kind: Overview · Hosts · Pools ·
    Members · Repositories · Sinks · Adapters · Store · Plan · Settings. "+ organization" sits in the
    top navigation's organization menu, beside the organizations it would join.
  - Every collection is a table and every entity is a drill-in from it: Hosts, Pools, Members and
    Repositories each list rows, and a name in the first column opens that one thing under
    breadcrumbs, a page header with its state and actions, and tabs. A host drills in to Parts ·
    Environment · Sinks · Facts, a pool to Hosts · Image · Limits.
  - The host's Parts tab is by heading, each heading a slot or a list of slots (S115): Sign-in,
    Router, Runners (one slot per role: elaboration · construction · machinery), Agent, Chat sinks,
    Capture adapters, Triage (derived from the adapters, no slot), Environment, Pool, Host facts.
    A slot shows the package's name and version and its state: installed · adding, decision n · needs
    a secret · installing · disabled. An empty slot says what the heading takes and carries "add".
  - There is no index across kinds and no search over the whole store (S117). "add" and "change" open
    the split panel as the catalogue for that one heading, filtered to the host's platform, with a
    search box inside it and "any platform" showing the rest greyed with what they need. Choosing a
    package opens its add sheet in the same panel; "add to <host>" ends the flow by raising the
    install decision and closing the panel to the slot, which reads "adding · decision n".
  - A secret is never a field and never shown back (204, 207, S123): the sheet shows the place-it
    command for the target host, "copy", and a "check" that asks the host whether it is present, or
    "I'll place it later · under attention". The unplaced github-app.pem on willdan-cloud is seeded
    under attention with its place-it command, as install chore wi-#429 waits on it.
  - The organization store is the same settings screen without a host (S156): headings Types,
    Deliverable producers, Map vocabularies, Templates and Scenario packs, each a list of slots with
    configure, retire and restore, and "add" opening that heading's catalogue. An organization package
    never appears on a host and a host part never appears in the store (S124, S158).
  - Identity is a host binding with two kinds (S164, S165, S199, flow 2.26/S204), and the console
    reads it that way throughout. A host declares a kind and runs no sign-in part at all: the host
    screen's Identity heading is read-only and says `github` — every self-managed host, GitHub's
    device flow, a localhost port, no environment and no registered redirect — or `frontegg`, the
    hosted tiers, the provider's hosted login with its environment and the served name the redirect
    is built from. The sign-in packages are gone from the catalogue with it, and a second read-only
    heading, the git App, says which App reaches the repositories and where its key lives (S198).
    What the page shows follows the serving host's kind (?served=): the GitHub username on a
    `github` host, the Frontegg user with the GitHub username beside it on a `frontegg` one, and
    authorship is the GitHub username in both. Membership follows it too: on a `github` host the
    operators list is the manifest's, authored whole on the settings form, with no roles and no
    members section, because every listed operator holds every permission; on a `frontegg` host the
    identities and their roles are derived from the account and read-only, the addresses stay
    authored beside them, and the members section carries invite, assign, revoke, set-role and the
    flags, each one recorded call under fw.identity.admin. The "+ organization" wizard's fifth step
    branches on the tier the same way: an operators list for a self-managed organization, a Frontegg
    account with the creating user as owner for a hosted one. One rule is carried across rather than
    read off a statement: revoking your own assignment is refused inline, which is what S155 already
    says about a save that would remove the saving identity from the operators list. Moving between them is the upgrade and
    not a migration, and the console says so where it matters.
  - "+ organization" sits under Organizations in the side navigation and is the second wizard,
    over 204, 206, 207/207a, 218-222, 233, 247 and 253, in that order: name it (219: an
    organization is the operator's name for it and need not coincide with an organization at the
    git host) and say whether it is self-managed or hosted, because 207a splits the App on that;
    pick the GitHub account the signed-in user's connection can install the App on, remembering
    that repositories are listed by URL and may live under any account the App reaches (219);
    create or adopt the two repositories, state with the profile's layout and blueprints from the
    blueprints template, an adopted one that lacks the layout upgraded by a chore and never
    rewritten (204, 206, 220, 208); install the App or extend its installation to the new
    repositories (207) - a self-managed organization uses its own App, whose key is a secret the
    operator places and never an agent (204, 207a, S198), and a hosted tier uses the service's
    App, whose key never leaves the service and which mints a pool host's installation tokens;
    create the organization's Frontegg account with the creating user as owner (247, 253), the
    account being the organization itself, a sub-account of the service's own only on the hosted
    tiers, with the operators list derived from the assigned users and never authored; name a
    root on this host, under which it clones state, blueprints and every tracked repository as
    bare repositories (205) and serves the organization at the host's one address with the
    organization in the path (205a); and end by raising the first-tick decision, whose yes runs
    `flywheel init` as effects with proofs, so running it again changes nothing and the
    reconciler advances a half-finished bootstrap (204, 222). Nothing in the wizard creates
    anything: it collects, and the decision is what acts.
  - "retire organization" sits on the organization's overview and raises a decision, never a
    button that acts (221): the yes ends its sessions, removes its places, archives its state and
    leaves its git repositories on disk, and its numbers are never reused (15, 221).
  - "+ host" opens on a choice of next steps, not on the platform list: a machine of yours that
    drains construction work, an agent in the cloud for captures and chat at bound 0, more drain
    managed for you (which is a pool, so it opens the pool form rather than pretending to be one
    host), and a host already running the binary. Each card states the promise the choice makes
    and sets the platform, the parts and the flow behind it; the platform list and "adopt
    existing" stay reachable under "advanced". Why: the flow of S120 is unchanged, but its first
    screen asked the operator to know what a container on any platform was before it asked what
    they wanted.
  - "+ host" is the Cloudscape wizard over the flow of S120: platform and name · parts, heading by
    heading, from each filtered catalogue · provision, run from the host you are on with your own
    platform credentials, read at run time and never stored · hand over only the chosen parts' secrets
    · enrol, which raises the enrolment decision with a one-time token that expires in 24h, then join
    and alive. "adopt existing" (S121) skips platform, provisioning and the hand-over.
  - "An agent in the cloud" is never asked about a router or a runner: the tier fixes both, the
    platform router at the served name and the in-process runner at bound 0 (plans.md, hosted
    tier 1). Its Parts step is one screen of three selectors — Chat (Slack · Discord · none),
    Meetings (Granola · Notion · a folder of transcripts · none), Captures (GitHub, already on and
    read-only · Datadog · a webhook) — with a row of presets above them that fill the selectors.
    A preset is a bundle package, a named set of parts with their configuration defaults, and its
    install is one decision for the set, not one per part (plans.md). Routers and runners are
    offered only on "a machine of yours" and "adopt", and there only under an Advanced disclosure
    with the sensible default already chosen.
  - Plan is a section of its own: the plan the organization's account is on, the tier it allows, the
    entitlement flags it turns on, and each limit with the use against it (plans.md). "change plan"
    says billing is on the hosted account and links out to it; nothing about a plan is authored
    here. A self-managed organization has no plan object at all — its Plan page says so and states
    Free's promise instead (plans.md, 250).
  - Pools (S176): a pool is a row of its own with platform, image state, live of bound, idle-retire and
    cost, its hosts folded under it, each a host row with a pool chip and a retiring state. Nothing on
    the row adds or retires a host; the machinery does both within bound and cost. "rebuild" on an
    image behind raises the rebuild as a chore decision (S175).
  - Members (S166–S171): a table of the operators list, and one member's addresses, roles and sinks
    behind their name. The sinks each address makes carry their own mark and presenting host, and the
    roles are lists of members. Ownership is administered here and answered there: "assign" lives on
    the decision in the plan console (S170), and this console says so rather than drawing an answer
    control.
  - Environment (S174): a repository's row carries its declaration and one line per host, satisfied or
    the first tool it cannot produce; a host's Environment heading shows the same from the host's side.
    The console changes no provider — a provider is a host's declaration, changed with the host.
  - Settings, the organization's manifest as a form (S155), is split by what the field belongs to
    rather than drawn as one long form: the Settings section carries the profile, the router, the
    cadences and the runner defaults per role, a repository's landing policy is on that repository, a
    pool's bound and cost on that pool, and a host's own fields on that host. Save is one
    configure-organization response per form and the console says the machinery applies it as one
    manifest commit. Overview authors nothing: it reads what the organization is and what is under
    attention.

  Decisions taken 2026-09-08, over A.33 (256-267), A.34 (268-278, 290-294), A.35 (279-284, 294),
  237 as amended, and the S191/S193/S194 rulings:
  - Settings carries a Tenancy panel, which is the tier statement of 261 rendered: the stores that
    hold this organization's content (the capture queue, the warm cache, the page projection, the
    run logs, and what pool hosts write), the key each is sealed under, which of the three homes of
    267 that key lives in, which role may use it and for how long, when the cache was last evicted,
    which model provider sees plan text and messages, and the code-isolation line of 264/289. A key
    that is unreachable shows the fail-closed line of 260 above it, naming the key and since when,
    and saying that no tick proceeds while running work continues.
  - Plan is drawn per rung, because the rungs differ in kind and not only in size. Hobby states
    that no model key is placed, that chat is buttons and slash commands, that self-contained
    captures are triaged in one daily batch at the sweep, and how many captures of the month's
    included count are used (281, 294). Team states the included model budget with the month's
    spend beside the pool hours, and the model class per job with the control that raises it per
    type and per stage (285, 294). A model key of the operator's own is a secret placed on the
    host with a place-it command, never a field on the page (204, 207, S123).
  - Enterprise draws tier 3 as a choice between its two shapes rather than one journey: stores
    only, with the federation setup stated (our issuer, the organization's subject, the role ARN
    the operator pastes, sts:TagSession allowed, and "deleting the role ends our access"), and
    stores and compute, which adds the dedicated compute options as a table of what each changes.
    Every one of them raises a decision; none is a button that acts (S113, S124).
  - Liveness is read per kind of host rather than by one heartbeat age. A cloud agent exists only
    during a tick, so its row and its Facts tab read its scheduler entry and its queue: next due,
    queue depth, last tick, the served name, the page projection's last write and the cache's last
    eviction (269, 291, 292). A closed laptop reads "away · since", its leases standing and its
    sessions' clocks paused, and raises no attention line of its own (278).
  - On a cloud agent Router and Runners are read-only and say "fixed by the tier": the platform
    router at the served name and the in-process runner at bound 0 (283). Under Runners the host
    says which model key it uses, ours metered or a key the operator placed, and the month's model
    spend (294).
  - A pool's Limits tab states its placement (microVM by default, a container task with a volume
    under your key, an instance of your own on Enterprise), the maximum lifetime that placement
    states, the fallback placement for a session that must run longer, and whose key the disk is
    under (275). The pool row shows the ceiling and the per-host-hour rate and no live spend,
    because a live figure would need the platform's price at read time (S193).
  - An owner is one member or nobody and a role is never an owner (237 amended, S194), so the
    members section states ownership as its own panel and roles are drawn as what they are: on a
    hosted host the account's roles, which authorize tool calls; on a self-managed one, nothing
    that authorizes at all. The switcher lists only the organizations the identity is a member of;
    a non-member organization does not appear, greyed or otherwise (S191, 291).
  - A chat sink says how free text reaches it, because that follows the presenting host's
    placement: Discord on an invoked function takes /fw slash commands with their arguments and
    carries buttons on every decision, Discord on a long-lived placement answers plain free text,
    and Slack takes free text over the Events API either way (277, 281, 276a).
  - "Connect a client" states the tool server as a remote MCP server at the host's address: the
    endpoint, the identity a client signs in against, the catalogue filtered by the caller's
    permissions, and the two-line Claude Code command. A self-managed host shows its localhost
    address instead of a served name (245, 293).
  - The four "+ host" journeys carry the tier they are and where they will run, and the plan
    decides which may be chosen. A machine of yours and an adopted host are every plan's and
    declare `github`. An agent in the cloud is tier 1: on Free the card stays on the screen, says
    "needs Hobby" with a link to the Plan page and cannot be chosen, and on Hobby it is refused
    with the reason once one exists, because Hobby includes one per organization. More drain,
    managed for you, is tier 2 and says "needs Pro" below that. A card that a plan refuses states
    the reason on its own face as one attention line; there is no modal, nothing running stops,
    and the loop is not halted (280, 282). Why on the card: the operator is choosing between the
    journeys at that moment, so the reason belongs where the choice is, not behind a dialog.
  - Under Enterprise's second shape the cloud-agent and pool cards say the host runs in your own
    account, through the role you granted, and the provision step becomes the deployer's: it
    assumes that role, applies the stack in your account and stamps the binary's version, with
    nothing running from the operator's machine (276, 276a, 208). The cloud agent's one-screen
    parts step gains a fourth selector, the dispatcher — a function, long-lived on a container
    service, or long-lived on an instance of your own — with the consequence stated beside each,
    because that choice is what decides whether plain free text in a Discord channel is answered
    or arrives as a slash command (276a, 277).
  - A pool's placement follows the plan: microVM alone up to Team, and on Enterprise the select
    also offers a container task with a volume under your own key and an instance of your own,
    which has no lifetime ceiling and so needs no fallback placement (275, 276a).
  - "+ organization" asks for the plan as a step of its own, drawn as the ladder's rungs, because
    the rung is what settles the rest: Free is self-managed and states that nothing runs on our
    side, with `github` sign-in and the organization's own App whose key the operator places;
    every hosted rung takes `frontegg` sign-in and the service's App, whose key never leaves the
    service (207a, 268, 281). The membership step branches on it exactly as it did.

  Decisions taken 2026-09-08, second pass — offers by serving host, and the customer's voice:
  - What "+ host" offers now depends on which computer is serving the console, because a computer
    of your own can only ever set up another computer of your own. Served from one of yours, the
    offers are this computer or another you own, a virtual machine on your network, a container on
    your own cloud, and one already running Flywheel; the managed ones are absent, and one quiet
    line offers the move to Flywheel Cloud instead. Served from Flywheel Cloud, the managed offers
    join them, each gated by the plan and each saying so in plan names — "included in Pro",
    "upgrade to Pro" — never as a tier number. Switch it with ?served=laptop|cloud; the default
    follows the plan.
  - Every visible string is now written for the customer, not for the person who designed the
    system. The string table changed: provider names are gone (Frontegg is "Flywheel Cloud
    sign-in", the GitHub device flow is "Sign in with GitHub"); tier numbers are gone, replaced by
    plan names and by what the plan gives; every requirement and surface number is gone from
    visible copy and kept here in the header instead; and the words dispatcher, placement, tier,
    bound, drain, sink, projection and receiver are gone from the surface in favour of what they
    do for the reader — "keeps working while your laptop is closed", "builds pull requests for
    you", "where messages are delivered", "how many jobs at once", "where they run". The
    navigation reads Overview · Computers · Cloud builders · People · Repositories · Messages ·
    Sources · Add-ons · Plan · Settings; page ids are unchanged, so every review URL still works.
    The tenancy panel is now "Where your data lives and who can read it" and reads as a plain
    promise, and "Connect a client" is "Use Flywheel from Claude Code". Design references for all
    of it stay in this comment, which is the only place they belong.

  Layout decisions:
  - Sections in the side navigation, not entities. A navigation that listed every organization and
    every host grew with the estate and put two kinds of thing — a place you are and a thing you
    administer — in one list, so switching organization and opening a host looked alike. The
    organization is the one axis the whole page hangs from, so it belongs in the top navigation,
    chosen once; below it the side navigation is a fixed list of the sections of that one
    organization, the same ten entries whether the organization has one host or forty.
  - Tables and drill-in, not a nav entry per thing. A host, a pool, a member and a repository are
    all collections that grow, and each has state worth comparing across rows: alive, bound, pool,
    last heartbeat, attention. A table shows that at once and sorts the estate; the name in the
    first column is the way in. The drill-in then owns the whole of one thing under breadcrumbs and
    tabs, so the settings screen keeps its heading-by-heading shape without competing with
    navigation for the same space.
  - The cloud agent asks only about sinks and adapters. Router and runner are not choices on that
    tier — they are what the tier is: the platform router at the served name, the in-process runner
    at bound 0. Offering them would ask the operator to re-decide something already decided, and
    every wrong answer would break the host. What is genuinely open is what the agent listens to
    and speaks through, which is three selectors and a row of presets on one screen. The platform
    list, the router and the runner stay reachable on the journeys where they are real choices, a
    machine of yours and an adopted host, under Advanced with defaults preselected.

  Invented beyond the requirements and the seed: the member roles as lists of members (construction,
  design, ops) and their members, the console's own page set and its breadcrumbs, the decision numbers
  425 and up, the 24h enrolment token's text, the per-page save lines, today's pool spend, and the
  wording of every catalogue entry's "needs" and "enables" beyond what rail-and-board's index carries.
  Marked sample where it is not from the seed.

  Review switches: ?theme=dark|light, ?org=willdan|agentplot|integral-analytics|personal,
  ?page=overview|hosts|pools|members|repositories|sinks|adapters|store|plan|settings,
  ?host=<id>&tab=parts|environment|sinks|facts, ?pool=<id>&ptab=hosts|image|limits,
  ?member=<id>, ?repo=<id>, ?addhost=1&journey=machine|cloud-agent|adopt&wstep=0..4,
  ?addorg=1&ostep=0..7, ?served=studio|willdan-cloud (which host serves this page, and so which
  identity kind it shows), ?panel=1 (opens the seeded catalogue), ?flash=1,
  ?plan=hobby|pro|team|enterprise (the Plan page's rung), ?shape=stores|compute (tier 3's shape),
  ?key=out (the key unreachable, 260).

  The Hosts table is ?page=hosts; a host drill-in is ?host=willdan-cloud (its tabs ?host=…&tab=…);
  the cloud agent's one-screen Parts is ?addhost=1&journey=cloud-agent&wstep=1.

/* ---------- top navigation ---------- */

.menu{position:absolute;top:calc(var(--top) - 6px);right:16px;min-width:280px;background:var(--surface);border:1px solid var(--divider);border-radius:12px;box-shadow:var(--shadow);padding:8px;z-index:60}

.menu button[aria-current="true"]{background:var(--selected);color:var(--link);font-weight:700}
.menu .mi-sub{display:block;font-size:12px;color:var(--tertiary);font-weight:400}
.menu hr{border:0;border-top:1px solid var(--divider-2);margin:6px 4px}

/* ---------- layout ---------- */
.layout{flex:1;display:grid;grid-template-columns:var(--nav) minmax(0,1fr);min-height:0;min-width:0}
.layout.panel-open{grid-template-columns:var(--nav) minmax(0,1fr) var(--panel)}
.sidenav{background:var(--surface);border-right:1px solid var(--divider);overflow:auto;padding:20px 8px 40px}
.main{overflow:auto;padding:24px 24px 64px;background:var(--ground);min-width:0}
.main-inner{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}

/* ---------- side navigation ---------- */
.sn-head{padding:6px 12px 12px;border-bottom:1px solid var(--divider-2);margin-bottom:8px}

.sn-sec{margin:12px 0 4px;padding:4px 12px;font-weight:700;color:var(--heading)}

.sn-item .badge-n{margin-left:auto}
.sn-sub{padding-left:20px}
.sn-org{display:flex;align-items:center;gap:6px;width:100%;padding:6px 12px;border-radius:8px;font-weight:700;color:var(--heading)}
.sn-org:hover{background:var(--hover)}
.sn-org .tw{font-size:10px;color:var(--tertiary);width:10px}
.sn-div{border:0;border-top:1px solid var(--divider-2);margin:12px 8px}
.sn-note{padding:4px 12px 0;font-size:12px;color:var(--tertiary)}
.sn-count{margin-left:auto;font-size:12px;color:var(--tertiary);font-weight:400;font-variant-numeric:tabular-nums}
.sn-item[aria-current="page"] .sn-count{color:var(--link)}

/* ---------- content layout ---------- */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--tertiary)}
.crumbs .sep{color:var(--disabled)}
.page-head{display:flex;flex-direction:column;gap:4px}
.page-head .desc{color:var(--secondary)}
.page-head .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---------- container ---------- */
.ctr{background:var(--surface);border:1px solid var(--divider-2);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.ctr-head{padding:16px 20px;border-bottom:1px solid var(--divider-2);display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ctr-head.plain{border-bottom:0;padding-bottom:0}
.ctr-head .ct{display:flex;flex-direction:column;gap:2px}
.ctr-head .counter{color:var(--tertiary);font-weight:400}
.ctr-body{padding:20px}
.ctr-body.tight{padding:0}
.ctr-foot{padding:12px 20px;border-top:1px solid var(--divider-2);background:var(--shaded);display:flex;justify-content:flex-end;gap:8px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:4px 20px;font-weight:700;font-size:14px;line-height:22px;white-space:nowrap;border:2px solid transparent}
.btn.normal{border-color:var(--link);color:var(--link);background:var(--surface)}
.btn.normal:hover{border-color:var(--link-hover);color:var(--link-hover);background:var(--hover)}
.btn.primary{background:var(--primary-bg);color:var(--primary-text);border-color:var(--primary-bg)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.link{color:var(--link);padding:4px 8px}

.btn:disabled{border-color:var(--disabled);color:var(--disabled);cursor:not-allowed;background:transparent}

.badge{display:inline-flex;align-items:center;border-radius:4px;padding:0 6px;font-size:12px;line-height:18px;font-weight:600;background:var(--shaded);color:var(--secondary);border:1px solid var(--divider-2);white-space:nowrap}
.badge.blue{background:var(--bg-info);color:var(--link);border-color:var(--link)}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}

.tbl th:first-child,.tbl td:first-child{padding-left:20px}
.tbl th:last-child,.tbl td:last-child{padding-right:20px}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.sub td{background:var(--shaded)}
.tbl tr.sub td:first-child{padding-left:40px}
.tbl td .cell-sub{display:block;font-size:12px;line-height:16px;color:var(--tertiary);margin-top:2px}
.tbl .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:32px 20px;text-align:center;color:var(--secondary)}
.empty b{display:block;color:var(--heading);margin-bottom:4px}

/* ---------- key value pairs ---------- */
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px 24px}
.kv .k{font-size:14px;color:var(--secondary);font-weight:400;margin-bottom:2px}
.kv .v{color:var(--text)}
.kv.cols-2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kv.rows{grid-template-columns:minmax(0,1fr);gap:12px}

/* ---------- settings headings and slots ---------- */
.hd-sec{display:flex;flex-direction:column}
.hd-sec + .hd-sec{border-top:1px solid var(--divider-2)}
.hd-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;flex-wrap:wrap}
.hd-bar .ht{display:flex;flex-direction:column;gap:2px}
.slot{display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-top:1px solid var(--divider-2);flex-wrap:wrap}
.slot .sl-main{flex:1;min-width:220px;display:flex;flex-direction:column;gap:4px}
.slot .sl-name{font-weight:700;color:var(--heading)}
.slot .sl-acts{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.slot.empty-slot{color:var(--secondary)}
.slot.lit{background:var(--selected)}
.cfg-line{font-size:12px;line-height:18px;color:var(--tertiary);font-family:var(--mono)}

/* ---------- flashbar ---------- */
.flashbar{display:flex;flex-direction:column;gap:8px}
.flash{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:12px;color:#fff;font-size:14px}
.flash.success{background:#00802f} .flash.info{background:#006ce0} .flash.error{background:#db0000}
.flash.warning{background:#fbd332;color:#0f141a}
.flash b{font-weight:700}
.flash a{color:#fff;text-decoration:underline}
.flash.warning a{color:#0f141a}
.flash .fx{margin-left:auto;font-size:16px;line-height:1;opacity:.9}

/* ---------- form ---------- */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.field label{font-weight:700;color:var(--heading)}
.field .fd{font-size:12px;line-height:16px;color:var(--secondary)}
.field input,.field select{width:100%}
.radio{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-weight:400}
.radio b{font-weight:700}
.radio input{min-height:auto;width:auto;margin-top:3px}
.secret{border:1px solid var(--divider);border-radius:12px;padding:12px;background:var(--shaded)}
.cmd{font-family:var(--mono);font-size:12px;line-height:18px;background:var(--surface);border:1px solid var(--divider-2);border-radius:8px;padding:8px;word-break:break-all;margin:6px 0}

/* ---------- split panel ---------- */
.split{background:var(--surface);border-left:1px solid var(--divider);display:flex;flex-direction:column;min-height:0}
.split-head{padding:16px 20px;border-bottom:1px solid var(--divider-2);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.split-body{overflow:auto;padding:16px 20px 40px;flex:1}
.split-foot{padding:12px 20px;border-top:1px solid var(--divider-2);background:var(--shaded);display:flex;justify-content:flex-end;gap:8px}
.pk{border:1px solid var(--divider-2);border-radius:12px;padding:12px;margin-bottom:8px;background:var(--surface)}

.pk .pkh b{color:var(--heading)}

.search{width:100%;margin-bottom:12px}

.wiz{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}

.wiz-nav li{display:flex;gap:10px;padding:8px 0;color:var(--secondary)}
.wiz-nav .n{width:22px;height:22px;border-radius:50%;border:2px solid var(--divider);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;color:var(--tertiary)}
.wiz-nav li.done .n{background:var(--link);border-color:var(--link);color:var(--primary-text)}
.wiz-nav li.now{color:var(--link);font-weight:700}
.wiz-nav li.now .n{border-color:var(--link);color:var(--link)}
.wiz-nav .lbl{display:flex;flex-direction:column}
.wiz-nav .lbl small{font-weight:400;font-size:12px;color:var(--tertiary)}
.wiz-foot{display:flex;justify-content:flex-end;gap:8px;padding-top:16px}
.steps{display:flex;flex-direction:column;gap:8px}
.step-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--divider-2)}
.step-row:last-child{border-bottom:0}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--divider);margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 16px;font-weight:700;font-size:16px;color:var(--secondary);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--link);border-bottom-color:var(--link)}

.field input[type=checkbox],.field input[type=radio],input[type=checkbox],input[type=radio]{width:16px;height:16px;min-height:16px;padding:0;margin:0 8px 0 0;flex:none;display:inline-block;vertical-align:-2px;accent-color:var(--link)}

.exp{border-top:1px solid var(--divider-2);margin-top:12px;padding-top:12px}

.exp-h .tw{font-size:10px}
.exp-b{padding:8px 0 0}
.jrn{display:flex;gap:12px;align-items:flex-start;padding:12px;border:2px solid var(--divider-2);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--surface)}

.jrn > div{min-width:0;flex:1}

.gate-warn b{color:var(--warning)}
.gate-warn .mono{font-size:11.5px}
.jrn.off:hover{border-color:var(--divider-2)}
.jrn .jt{font-weight:700;color:var(--heading)}
.jrn .jp{font-size:12px;line-height:17px;color:var(--secondary);margin-top:4px}
.jrn .jp b{color:var(--heading)}
/* ---------- presets: a bundle offered as one choice on the cloud agent's parts screen ---------- */
.preset-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.preset{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:12px;border:2px solid var(--divider-2);border-radius:12px;background:var(--surface)}
.preset:hover{border-color:var(--input-border)}
.preset.on{border-color:var(--link);background:var(--selected)}
.preset b{color:var(--heading)}
.hamburger{display:none}
@media (max-width:900px){
  .layout,.layout.panel-open{grid-template-columns:minmax(0,1fr)}
  .sidenav{position:fixed;top:var(--top);bottom:0;left:0;width:var(--nav);z-index:50;box-shadow:var(--shadow);transform:translateX(-100%);transition:transform .15s}
  body.nav-open .sidenav{transform:none}

  .hamburger{display:inline-flex}
  .main{padding:16px 12px 64px}

  .menu{right:8px;left:8px;min-width:0}

}

  .tn-btn{padding:6px 6px}
  .page-head h1{font-size:20px;line-height:26px}
  .ctr-head,.ctr-body,.slot,.hd-bar{padding-left:12px;padding-right:12px}
}

   the GitHub username on a `github` host, the Frontegg user on a `frontegg` host, with the

const IDENTITY = {handle:'chuck', name:'Chuck Swanberg', github:'chuck', frontegg:'chuck@willdan.com'};

/* ===========================================================================

   =========================================================================== */
const S = {
  org:'willdan', page:'overview', addhost:null, addorg:null, orgWizard:null, served:null,
  host:null, tab:'parts', /* the host drill-in and its tab */
  pool:null, ptab:'hosts', /* the pool drill-in and its tab */

  panel:null, /* {mode:'catalogue'|'sheet'|'configure'|'secret'|'joined', ...} */
  flashes:[], menu:null, navOpen:false, lit:null,
  nextDecision:425, raised:[], log:[],
  wizard:null,
};
const org = () => ORGS[S.org];
const hosts = () => org().hosts;
const host = id => hosts().find(h => h.id === id);
const partOn = (h, id) => h.parts.find(p => p.pkg === id);
const memberOrgs = () => Object.keys(ORGS).filter(k => ORGS[k].members.some(m => m.id === IDENTITY.handle));
/* which host is serving this page decides what may be added from it: a computer of yours can only
   offer computers of yours, while the cloud can offer the managed ones as well. ?served=laptop|cloud */
function servedMode(){
  if(S.served === 'laptop' || S.served === 'cloud') return S.served;
  const named = hosts().find(h => h.id === S.served);
  if(named) return named.invoked ? 'cloud' : 'laptop';
  return isFreePlan() ? 'laptop' : (hosts().some(h => h.invoked) ? 'cloud' : 'laptop');
}
function servingHost(){
  const named = hosts().find(h => h.id === S.served);
  if(named) return named;
  return servedMode() === 'cloud'
    ? (hosts().find(h => h.invoked) || hosts().find(h => h.serves) || hosts()[0])
    : (hosts().find(h => h.serves && !h.invoked) || hosts().find(h => !h.invoked) || hosts()[0]);
}
const servingKind = () => ((servingHost() || {}).identity || {kind:'github'}).kind;
const isHosted = () => servingKind() === 'frontegg';
const shownIdentity = () => isHosted() ? IDENTITY.frontegg : IDENTITY.github;
/* the two ways a person signs in, said the way the sign-in button says it and never the vendor's name */
const signInLabel = k => k === 'frontegg' ? 'Flywheel Cloud sign-in' : 'Sign in with GitHub';
const signInHow = k => k === 'frontegg'
  ? 'you sign in to Flywheel Cloud at this organization&#8217;s own web address'
  : 'you sign in with GitHub, in a browser on this computer';
/* a host's tier is read off what it is, never authored: a pool host is the pool's, a `frontegg`
   host is the cloud agent's, and everything else is your own computer (hosted-design.md) */
const tierOf = h => h.pool ? 'started by your cloud builders' : ((h.identity||{}).kind === 'frontegg' ? 'a Flywheel Cloud agent' : 'a computer of yours');
/* every line this host puts under attention in the rail, gathered for the table's last column */
function hostAttention(h){
  const out = [];
  if(!h.alive && !h.away) out.push(`gone ${h.gone || ''} · its lease expires and its sessions are released`);
  (h.parts || []).forEach(p => { if(p.state === 'needs a secret')
    out.push(`${pkg(p.pkg).name} needs ${(secretFields(pkg(p.pkg))[0]||{}).file || 'a secret'}${p.wi ? '' + p.wi + ' waits on it' : ''}`); });
  Object.entries((h.env && h.env.repos) || {}).forEach(([rid, e]) => { if(!e.ok) out.push(`${rid} · the environment cannot be satisfied`); });
  if(h.binary !== h.binaryLatest) out.push(`binary ${h.binary} · behind ${h.binaryLatest}`);
  if(h.gitApp && h.gitApp.own && h.gitApp.placed === false) out.push('the App key is not placed');
  return out;
}
const orgAttention = () => hosts().reduce((n, h) => n + hostAttention(h).length, 0);

/* ===========================================================================
   Cloudscape components, drawn by hand
   =========================================================================== */
const esc = s => String(s == null ? '' : s).replace(/&(?!#?\w+;)/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const raw = s => String(s == null ? '' : s);
const ST_GLYPH = {success:'&#10003;', error:'&#10005;', warning:'&#9888;', info:'&#9432;', pending:'&#9711;', loading:'&#8635;', stopped:'&#9723;', inactive:'&#8722;'};
const st = (type, text) => `<span class="st ${type}"><span class="g" aria-hidden="true">${ST_GLYPH[type]||''}</span>${raw(text)}</span>`;
const badge = (text, cls) => `<span class="badge ${cls||''}">${raw(text)}</span>`;
const btn = (label, attrs, kind) => `<button class="btn ${kind||'normal'} sm" ${attrs}>${raw(label)}</button>`;
const answerLink = n => `<a href="rail-and-board.html?open=d:${n}">answer in the plan console</a>`;

function ctr(o){
  const counter = o.counter ? ` <span class="counter">(${esc(o.counter)})</span>` : '';
  const head = o.title ? `<div class="ctr-head"><div class="ct"><h2>${raw(o.title)}${counter}</h2>${o.desc ? `<div class="small">${raw(o.desc)}</div>` : ''}</div>${o.actions ? `<div class="row">${o.actions}</div>` : ''}</div>` : '';
  const body = o.body == null ? '' : `<div class="ctr-body ${o.tight ? 'tight' : ''}">${o.body}</div>`;
  return `<section class="ctr">${head}${body}${o.footer ? `<div class="ctr-foot">${o.footer}</div>` : ''}</section>`;
}
function table(cols, rows, empty){
  if(!rows.length) return `<div class="empty"><b>${esc(empty && empty[0] || 'No resources')}</b><div class="small">${raw(empty && empty[1] || '')}</div></div>`;
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map(c => `<th>${raw(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr class="${r.cls||''}">${r.cells.map(c => `<td>${raw(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const kv = (pairs, cls) => `<div class="kv ${cls||''}">${pairs.map(([k,v]) => `<div><div class="k">${raw(k)}</div><div class="v">${raw(v)}</div></div>`).join('')}</div>`;
const sub = t => `<span class="cell-sub">${raw(t)}</span>`;

/* ===========================================================================
   responses and decisions — the two ways this console changes anything
   =========================================================================== */
function flash(type, header, text){ S.flashes.unshift({type, header, text, id:Math.random().toString(36).slice(2)}); }
function logged(what, detail){
  S.log.unshift({what, at:NOW});
  flash('success', 'Response recorded', `${esc(what)} · one logged response, applied by the machinery as it reads your settings on its next tick${detail ? '' + detail : ''}`);
}
function raiseDecision(kind, title, note){
  const n = S.nextDecision++;
  S.raised.unshift({n, kind, title, at:NOW});
  const guard = kind === 'package-install' ? 'nothing is installed until it is answered' : 'nothing changes until it is answered';
  flash('info', `Decision ${n} raised`, `${esc(title)} · kind ${esc(kind)} · ${guard}. ${note ? esc(note) + '' : ''}${answerLink(n)}`);
  return n;
}

/* how free text and answers reach a chat sink, which follows the presenting host's placement (277, 281) */
const CHAT_NOTE = {
  discord:{fn:'free text as <span class="mono">/fw</span> slash commands with their arguments, because an invoked function holds no gateway socket; buttons on every decision',
    live:'plain free text in the channel is answered, because an always-running agent holds the gateway socket; buttons on every decision'},
  slack:{fn:'free text over the Events API, which needs no socket; buttons on every decision',
    live:'free text over the Events API, which needs no socket; buttons on every decision'},
};
function chatNote(kind, h){
  const n = CHAT_NOTE[kind === 'discord' ? 'discord' : 'slack']; if(!n || !h) return '';
  const hosted = ((h.identity||{}).kind === 'frontegg');
  if(!hosted) return 'your own bot and your own token · the application is your organization&#8217;s settings and not the service&#8217;s';
  return h.invoked ? n.fn : n.live;
}

}

}

function slotState(p){
  const s = p.state;
  if(/^adding/.test(s)) return st('pending', `adding · decision ${p.decision}` + answerLink(p.decision));
  if(s === 'needs a secret') return st('warning', `needs a secret · <a href="#" data-secret="${p.host||''}|${p.pkg}">place it</a>${p.wi ? ' · install chore ' + esc(p.wi) + ' waits on it' : ''}`);
  if(/^installing/.test(s)) return st('loading', esc(s));
  if(s === 'disabled') return st('stopped', 'disabled' + (p.why ? '' + esc(p.why) : ''));
  return st('success', esc(s));
}
function cfgLine(p){
  const P = pkg(p.pkg), vals = p.cfg || {};
  const parts = schemaOf(P).filter(f => f.kind !== 'secret' && vals[f.k]).map(f => `${f.k} ${vals[f.k]}`);
  const secrets = schemaOf(P).filter(f => f.kind === 'secret' && (!f.when || vals[f.when[0]] === f.when[1]))
    .map(f => `${f.file} ${(p.secrets||{})[f.k] ? 'placed' : 'not placed'}`);
  const all = parts.concat(secrets);
  return all.length ? `<div class="cfg-line">${esc(all.join(' · '))}</div>` : '';
}
function slot(h, p, opts){
  const P = pkg(p.pkg); opts = opts || {};
  const acts = [];
  if(p.byPool) acts.push(`<span class="small">declared by the pool · configured there</span>`);
  else {
    if(schemaOf(P).length) acts.push(btn('Configure', `data-configure="${h.id}|${p.pkg}"`));
    if(opts.single) acts.push(btn('Change', `data-catalogue="${h.id}|${P.kind}|replace:${p.pkg}"`));
    if(p.state === 'disabled') acts.push(btn('Enable', `data-part="enable|${h.id}|${p.pkg}"`));
    else if(/^installed/.test(p.state)) acts.push(btn('Disable', `data-part="disable|${h.id}|${p.pkg}"`, 'link'));
    if(!opts.single) acts.push(btn('Remove', `data-part="remove|${h.id}|${p.pkg}"`, 'link'));
  }
  return `<div class="slot ${S.lit === h.id + '|' + p.pkg ? 'lit' : ''}">
    <div class="sl-main"><div class="sl-name">${esc(P.name)} <span class="small">v${esc(P.v)} · ${esc(P.tag)}</span>${p.lease ? ' ' + badge('lease','blue') : ''}</div>
      <div class="small">${raw(P.enables)}</div>${cfgLine({...p, host:h.id})}
      <div>${slotState({...p, host:h.id})}</div>${p.lastRun ? `<div class="small">last run ${esc(p.lastRun)}</div>` : ''}</div>
    <div class="sl-acts">${acts.join('')}</div></div>`;
}
function emptySlot(h, kind, takes){
  return `<div class="slot empty-slot"><div class="sl-main"><div class="sl-name">Empty</div><div class="small">${raw(takes)}</div></div>
    <div class="sl-acts">${btn('Add', `data-catalogue="${h.id}|${kind}"`)}</div></div>`;
}

document.addEventListener('click', e => {

function sheetSave(){
  const p = S.panel, P = pkg(p.pkg);
  const secrets = {}; secretFields(P).forEach(f => { secrets[f.k] = p.secrets[f.k] === true; });
  if(p.mode === 'configure'){
    if(p.target === 'org'){ org().store[p.pkg].cfg = {...p.values}; }
    else { const part = partOn(host(p.target), p.pkg); part.cfg = {...p.values}; part.secrets = {...(part.secrets||{}), ...secrets}; }
    logged(`configure ${P.name} on ${p.target === 'org' ? 'the blueprints' : p.target}`, 'applied as a re-install of this package; a changed secret is placed again through "place it"');
    S.lit = p.target + '|' + p.pkg; closePanel(); return;
  }
  if(p.target === '__new'){
    S.wizard.parts.push({pkg:p.pkg, cfg:{...p.values}});
    flash('success','Chosen', `${esc(P.name)} joins the new host · nothing is installed until it joins`);
    closePanel(); return;
  }
  const later = secretFields(P).some(f => p.secrets[f.k] === 'later');
  const title = p.target === 'org'
    ? `install ${P.name} in the blueprints`
    : `install ${P.name} on ${p.target}${p.replaces ? ` · replaces ${pkg(p.replaces).name}` : ''}`;
  const n = raiseDecision('package-install', title, later ? 'a secret was left for later, so the slot reads "needs a secret" after the yes' : '');
  if(p.target === 'org') org().store[p.pkg] = {state:`adding, decision ${n}`, decision:n, cfg:{...p.values}};
  else host(p.target).parts.push({k:P.kind, pkg:p.pkg, state:`adding · decision ${n}`, decision:n, cfg:{...p.values}, secrets, replaces:p.replaces});
  S.lit = p.target + '|' + p.pkg;
  closePanel();
}
function partAction(spec){
  const [act, hid, id] = spec.split('|');
  const h = host(hid), part = partOn(h, id), P = pkg(id);
  if(act === 'remove'){ h.parts = h.parts.filter(x => x !== part);
    logged(`remove ${P.name} from ${hid}`, 'what it ran ends; its records stay'); return; }
  part.state = act === 'disable' ? 'disabled' : `installed ${NOW}`;
  if(act === 'disable') part.why = `turned off ${NOW}`; else delete part.why;
  logged(`${act} ${P.name} on ${hid}`, 'one logged response · the host reads it on its next tick');
}
function storeAction(spec){
  const [act, id] = spec.split('|'), P = pkg(id);
  if(act === 'retire'){ org().store[id].state = `retired ${NOW}`; logged(`retire ${P.name} from the blueprints`, 'every host stops reading it on its next tick'); }
  else { org().store[id].state = `installed ${NOW} · restored`; logged(`restore ${P.name} in the blueprints`, 'every host reads it on its next tick'); }
  S.lit = 'org|' + id;
}

      const addresses = {}; if(v.discord) addresses.discord = v.discord; if(v.slack) addresses.slack = v.slack;
      const roles = String(v.roles || '').split(',').filter(Boolean);
      o.members.push({id:v.id, name:v.name || v.id, signin:'GitHub', addresses, roles, since:TODAY.slice(5)});
      roles.forEach(r => (o.roles.find(x => x.id === r) || {members:[]}).members.push(v.id));
      logged(`operators · add ${v.id} · ${Object.keys(addresses).join(' · ') || 'no address'}`, 'their page and one chat per address are added in the same write'); }});
}
function addRoleForm(){
  const o = org();
  openForm({title:'Add a role', desc:'a role your settings names may own a decision', saveLabel:'Add',
    fields:[{k:'id', label:'Role', ph:'construction'},{k:'what', label:'What it owns', ph:'unit and proposal decisions'},
      {k:'members', label:'Members', kind:'checks', opts:o.members.map(m => m.id), value:''}],
    onSave(v){ if(!v.id) return;
      const members = String(v.members || '').split(',').filter(Boolean);
      o.roles.push({id:v.id, what:v.what || 'named in your settings', members});
      members.forEach(m => (o.members.find(x => x.id === m) || {roles:[]}).roles.push(v.id));
      logged(`settings · role ${v.id} · ${members.join(' ') || 'nobody'}`); }});
}
function wizNext(){
  const w = S.wizard;
  if(w.step === WIZ_STEPS.length - 1){ S.addhost = null; S.host = w.joined ? w.name : null; S.tab = 'parts'; S.page = 'hosts'; S.wizard = w.joined ? null : w; return; }
  w.step++;
  if(w.step === 3 && w.adopt) w.step = 4;
  if(w.step === 2 && w.adopt) w.step = 4;
}
function orgWizNext(){
  const w = S.orgWizard;
  if(w.step === ORG_WIZ_STEPS.length - 1){
    S.addorg = null;
    if(w.ticked){ S.org = w.name; S.page = 'overview'; S.orgWizard = null; }
    return;
  }
  w.step++;
}
function wizJoin(){
  const w = S.wizard, o = org();
  const parts = w.parts.map(p => ({k:pkg(p.pkg).kind, pkg:p.pkg, state:secretFields(pkg(p.pkg)).some(f => !w.secrets[pkg(p.pkg).id + '|' + f.k]) ? 'needs a secret' : `installed ${NOW}`, cfg:p.cfg, secrets:{}}));
  const plat = w.adopt ? ['machine','macos','herdr'] : (PLATFORMS.find(x => x[0] === w.platform) || [])[3] || ['any'];
  const bound = w.adopt ? 2 : (PLATFORMS.find(x => x[0] === w.platform) || [])[4] || 0;
  const KINDS = {laptop:'laptop', vm:'virtual machine', container:'container', managed:'Flywheel Cloud agent'};
  o.hosts.push({id:w.name, kind: w.adopt ? 'a computer you connected' : (KINDS[w.platform] || 'cloud'),
    platform: w.adopt ? 'read at join' : (PLATFORMS.find(x => x[0] === w.platform) || [])[1], plat, alive:true, bound, last:NOW,
    joined:TODAY.slice(5), joinedVia: w.adopt ? 'adopt existing' : (PLATFORMS.find(x => x[0] === w.platform)||[])[1],
    root:`/srv/flywheel/${o.name}`, launcher:'systemd · flywheel.service', binary:'0.9.4', binaryLatest:'0.9.4',
    note:`joined ${NOW} with the token from decision ${w.decision}`,
    roles:{elaboration:{runner:null, model:'claude-sonnet-5'}, construction:{runner:null, model:'claude-fable-5-1'}, machinery:{runner:null, model:'claude-haiku-4-5'}},
    agent:{on:parts.some(p => p.k === 'chat'), runner:null, what:'the binary&#8217;s interpreter job'},
    env:{provider: (w.platform === 'laptop' || w.platform === 'vm') ? 'devenv' : 'image', repos:Object.fromEntries(o.repos.map(r => [r.id, {ok:true}]))},
    parts,
    joinedSteps:[['platform','done',NOW, w.adopt ? 'read at join' : (PLATFORMS.find(x => x[0] === w.platform)||[])[1]],
      ['provision','done',NOW, w.adopt ? 'skipped · adopt existing' : 'ran from ' + servingHost().id + ' with your own credentials, read at run time and never stored'],
      ['hand over secrets','done',NOW, `${Object.keys(w.secrets).length} placed · the rest wait under attention`],
      ['enrol','done',NOW, `decision ${w.decision} · one-time token · expires in 24h · used once`],
      ['join','done',NOW,'read your settings and installed the parts you chose'],
      ['alive','done',NOW,'first heartbeat as host/' + w.name]]});
  w.joined = true;
  flash('success','Alive', `${esc(w.name)} joined and is alive · its row is in Hosts`);
}

/* ---- review switches ---- */
(function init(){
  const q = new URLSearchParams(location.search);
  if(q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
  if(q.get('org') && ORGS[q.get('org')]) S.org = q.get('org');
  if(q.get('page')) S.page = q.get('page');
  if(q.get('served')) S.served = q.get('served');
  if(q.get('host') && host(q.get('host'))) S.host = q.get('host');
  if(q.get('tab') && HOST_TABS.some(t => t[0] === q.get('tab'))) S.tab = q.get('tab');
  if(q.get('pool') && org().pools.some(p => p.id === q.get('pool'))) S.pool = q.get('pool');
  if(q.get('ptab') && POOL_TABS.some(t => t[0] === q.get('ptab'))) S.ptab = q.get('ptab');
  if(q.get('member') && org().members.some(m => m.id === q.get('member'))) S.member = q.get('member');
  if(q.get('repo') && org().repos.some(r => r.id === q.get('repo'))) S.repo = q.get('repo');
  if(q.get('plan')){ const n = q.get('plan'); const k = Object.keys(PLANS).find(x => x.toLowerCase() === n.toLowerCase()); if(k) S.plan = k; }
  if(q.get('shape') && ['stores','compute'].includes(q.get('shape'))) S.shape = q.get('shape');
  if(q.get('key') === 'out') S.keyOut = true;
  if(q.get('addhost')){
    S.addhost = true; S.wizard = newWizard();
    if(q.get('journey')) pickJourney(q.get('journey'));
    if(q.get('wstep')) S.wizard.step = Math.max(0, Math.min(WIZ_STEPS.length - 1, +q.get('wstep')));
  }
  if(q.get('addorg')){ S.addorg = true; S.orgWizard = newOrgWizard(); if(q.get('ostep')) S.orgWizard.step = +q.get('ostep'); }
  if(q.get('panel')) S.panel = {mode:'catalogue', target:S.host || 'studio', kind:'chat', q:'', any:false};
  if(q.get('flash')) flash('info','Decision 425 raised','install Slack on studio · kind package-install · nothing is installed until it is answered' + answerLink);
  render();
})();
</script>
