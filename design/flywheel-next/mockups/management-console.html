<!doctype html>
<html lang="en">
<head>
<!--
  Management console — everything the operator administers, drawn in the AWS Cloudscape design system.
  Cut from rail-and-board.html and carrying its seed: organization willdan, 2026-09-04 07:40, members
  chuck · rhea · lee, hosts studio · mac-mini · willdan-cloud, pool willdan-pool with pool-a1 and
  pool-a2, repositories atlas · switchboard · new-repo · books, and the package index. The plan console
  (rail-and-board.html) keeps the rail, the board, the dock and the flywheel; nothing was removed from
  it — this file is a second reading of the same state for evaluation.

  Cloudscape: the ESM route was tried and refused. https://cdn.jsdelivr.net/npm/@cloudscape-design/components@3/+esm
  is 2.7MB, imports React 19 itself (so a React 18 UMD beside it is moot) and references no stylesheet:
  Cloudscape ships its components' CSS as build-time CSS modules, and the +esm bundle carries none, so
  every component would render unstyled. The visual language is drawn by hand instead, against the real
  token values read from @cloudscape-design/design-tokens@3.0.111 index-visual-refresh.json, light and
  dark: the greys (#0f141a · #424650 · #656871 · #8c8c94 · #c6c6cd · #ebebf0 · #f9f9fa), the blues
  (#006ce0 light · #42b4ff dark), the status colours, the 16px container radius, the 20px button radius,
  Open Sans at 14px/20px, and the dark surfaces (#0f141a ground, #161d26 container). Reproduced by hand:
  top navigation, side navigation, content layout with breadcrumbs and a page header, container with
  header, table with a header counter and actions, key-value pairs, status indicators, badges, buttons
  (primary · normal · link · inline icon), form field, input, select, radio group, checkbox, expandable
  section, tabs, wizard, flashbar and split panel.

  Decisions taken while building:
  - The console is administration only. Every answer stays in the plan console: an install, an
    enrolment, an image rebuild and a binary upgrade are shown raising one decision with its number
    and a link "answer in the plan console" (S113, S118, S124). Nothing here is in the count, nothing
    here is answered, and no install runs from a form.
  - A configuration change is one logged response, applied by the machinery as a re-install of that
    package (S119); a flashbar confirms it and says what was logged. Retire and restore in the
    organization store are one logged response each (S156).
  - Side navigation is two sections. Organizations: one entry per organization the signed-in identity
    is a member of (willdan, agentplot, integral-analytics, personal), each expanding to Overview ·
    Repositories · Members and roles · Sinks · Adapters · Packages · Pools. Hosts: one entry per host
    of the organization in hand, each opening its settings screen, and "+ host". Hosts are per
    organization because a host serves one organization (241) and its parts are read from that
    organization's manifest.
  - The host settings screen is by heading, each heading a slot or a list of slots (S115): Sign-in,
    Router, Runners (one slot per role: elaboration · construction · machinery), Agent, Chat sinks,
    Capture adapters, Triage (derived from the adapters, no slot), Environment, Pool, Host facts.
    A slot shows the package's name and version and its state: installed · adding, decision n · needs
    a secret · installing · disabled. An empty slot says what the heading takes and carries "add".
  - There is no index across kinds and no search over the whole store (S117). "add" and "change" open
    the split panel as the catalogue for that one heading, filtered to the host's platform, with a
    search box inside it and "any platform" showing the rest greyed with what they need. Choosing a
    package opens its add sheet in the same panel; "add to <host>" ends the flow by raising the
    install decision and closing the panel to the slot, which reads "adding · decision n".
  - A secret is never a field and never shown back (204, 207, S123): the sheet shows the place-it
    command for the target host, "copy", and a "check" that asks the host whether it is present, or
    "I'll place it later · under attention". The unplaced github-app.pem on willdan-cloud is seeded
    under attention with its place-it command, as install chore wi-#429 waits on it.
  - The organization store is the same settings screen without a host (S156): headings Types,
    Deliverable producers, Map vocabularies, Templates and Scenario packs, each a list of slots with
    configure, retire and restore, and "add" opening that heading's catalogue. An organization package
    never appears on a host and a host part never appears in the store (S124, S158).
  - "+ organization" sits under Organizations in the side navigation and is the second wizard,
    over 204, 206, 207/207a, 218-222, 233, 247 and 253, in that order: name it (219: an
    organization is the operator's name for it and need not coincide with an organization at the
    git host) and say whether it is self-managed or hosted, because 207a splits the App on that;
    pick the GitHub account the signed-in user's connection can install the App on, remembering
    that repositories are listed by URL and may live under any account the App reaches (219);
    create or adopt the two repositories, state with the profile's layout and blueprints from the
    blueprints template, an adopted one that lacks the layout upgraded by a chore and never
    rewritten (204, 206, 220, 208); install the App or extend its installation to the new
    repositories (207) - a self-managed organization uses its own App, whose key is a secret the
    operator places and never an agent (204, 207a, S198), and a hosted tier uses the service's
    App, whose key never leaves the service and which mints a pool host's installation tokens;
    create the organization's Frontegg account with the creating user as owner (247, 253), the
    account being the organization itself, a sub-account of the service's own only on the hosted
    tiers, with the operators list derived from the assigned users and never authored; name a
    root on this host, under which it clones state, blueprints and every tracked repository as
    bare repositories (205) and serves the organization at the host's one address with the
    organization in the path (205a); and end by raising the first-tick decision, whose yes runs
    `flywheel init` as effects with proofs, so running it again changes nothing and the
    reconciler advances a half-finished bootstrap (204, 222). Nothing in the wizard creates
    anything: it collects, and the decision is what acts.
  - "retire organization" sits on the organization's overview and raises a decision, never a
    button that acts (221): the yes ends its sessions, removes its places, archives its state and
    leaves its git repositories on disk, and its numbers are never reused (15, 221).
  - "+ host" opens on a choice of next steps, not on the platform list: a machine of yours that
    drains construction work, an agent in the cloud for captures and chat at bound 0, more drain
    managed for you (which is a pool, so it opens the pool form rather than pretending to be one
    host), and a host already running the binary. Each card states the promise the choice makes
    and sets the platform, the parts and the flow behind it; the platform list and "adopt
    existing" stay reachable under "advanced". Why: the flow of S120 is unchanged, but its first
    screen asked the operator to know what a container on any platform was before it asked what
    they wanted.
  - "+ host" is the Cloudscape wizard over the flow of S120: platform and name · parts, heading by
    heading, from each filtered catalogue · provision, run from the host you are on with your own
    platform credentials, read at run time and never stored · hand over only the chosen parts' secrets
    · enrol, which raises the enrolment decision with a one-time token that expires in 24h, then join
    and alive. "adopt existing" (S121) skips platform, provisioning and the hand-over.
  - Pools (S176): a pool is a row of its own with platform, image state, live of bound, idle-retire and
    cost, its hosts folded under it, each a host row with a pool chip and a retiring state. Nothing on
    the row adds or retires a host; the machinery does both within bound and cost. "rebuild" on an
    image behind raises the rebuild as a chore decision (S175).
  - Members and roles (S166–S171): the operators list with each member's addresses per chat kind, the
    sinks each address makes with its own mark and presenting host, and the roles as lists of members.
    Ownership is administered here and answered there: "assign" lives on the decision in the plan
    console (S170), and this console says so rather than drawing an answer control.
  - Environment (S174): a repository's row carries its declaration and one line per host, satisfied or
    the first tool it cannot produce; a host's Environment heading shows the same from the host's side.
    The console changes no provider — a provider is a host's declaration, changed with the host.
  - Settings, the organization's manifest as a form (S155), is split across the organization's pages
    rather than drawn as one long form: Overview carries profile, router, cadences and the runner
    defaults per role; Repositories, Members and roles, Sinks, Adapters and Pools carry the rest. Save
    is one configure-organization response per form and the console says the machinery applies it as
    one manifest commit.

  Invented beyond the requirements and the seed: the member roles as lists of members (construction,
  design, ops) and their members, the console's own page set and its breadcrumbs, the decision numbers
  425 and up, the 24h enrolment token's text, the per-page save lines, today's pool spend, and the
  wording of every catalogue entry's "needs" and "enables" beyond what rail-and-board's index carries.
  Marked sample where it is not from the seed.

  Review switches: ?theme=dark|light, ?org=willdan|agentplot|integral-analytics|personal,
  ?page=overview|repositories|members|sinks|adapters|packages|pools, ?host=<id>, ?addhost=1,
  ?addorg=1&ostep=0..6,
  ?panel=1 (opens the seeded catalogue), ?flash=1.
-->
<meta charset="utf-8">
<title>Management console</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Cloudscape visual-refresh tokens, read from @cloudscape-design/design-tokens@3.0.111 */
:root{
  --ground:#f9f9fa; --surface:#ffffff; --shaded:#f6f6f9; --hover:#f3f3f7;
  --text:#0f141a; --heading:#0f141a; --secondary:#424650; --tertiary:#656871; --disabled:#8c8c94;
  --divider:#c6c6cd; --divider-2:#ebebf0; --input-border:#8c8c94; --disabled-bg:#ebebf0;
  --link:#006ce0; --link-hover:#002b66; --primary-bg:#006ce0; --primary-text:#ffffff; --primary-hover:#002b66;
  --success:#00802f; --error:#db0000; --warning:#855900; --info:#006ce0; --inactive:#656871;
  --bg-success:#effff1; --bg-error:#fff5f5; --bg-warning:#fffef0; --bg-info:#f0fbff; --selected:#f0fbff;
  --shadow:0px 1px 1px 1px #e9ebed, 0px 6px 36px rgba(0,7,22,.10);
  --sans:"Open Sans","Helvetica Neue",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --nav:272px; --top:56px; --panel:380px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0f141a; --surface:#161d26; --shaded:#1b232d; --hover:#131920;
  --text:#c6c6cd; --heading:#ebebf0; --secondary:#a4a4ad; --tertiary:#a4a4ad; --disabled:#8c8c94;
  --divider:#424650; --divider-2:#232b37; --input-border:#656871; --disabled-bg:#1b232d;
  --link:#42b4ff; --link-hover:#75cfff; --primary-bg:#42b4ff; --primary-text:#0f141a; --primary-hover:#75cfff;
  --success:#2bb534; --error:#ff7a7a; --warning:#fbd332; --info:#42b4ff; --inactive:#a4a4ad;
  --bg-success:#001401; --bg-error:#1f0000; --bg-warning:#191100; --bg-info:#001129; --selected:#001129;
  --shadow:0px 1px 1px 1px #192534, 0px 6px 36px #00040c;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --ground:#0f141a; --surface:#161d26; --shaded:#1b232d; --hover:#131920;
  --text:#c6c6cd; --heading:#ebebf0; --secondary:#a4a4ad; --tertiary:#a4a4ad; --disabled:#8c8c94;
  --divider:#424650; --divider-2:#232b37; --input-border:#656871; --disabled-bg:#1b232d;
  --link:#42b4ff; --link-hover:#75cfff; --primary-bg:#42b4ff; --primary-text:#0f141a; --primary-hover:#75cfff;
  --success:#2bb534; --error:#ff7a7a; --warning:#fbd332; --info:#42b4ff; --inactive:#a4a4ad;
  --bg-success:#001401; --bg-error:#1f0000; --bg-warning:#191100; --bg-info:#001129; --selected:#001129;
  --shadow:0px 1px 1px 1px #192534, 0px 6px 36px #00040c;
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font:14px/20px var(--sans);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-hover);text-decoration:underline}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:2px solid var(--input-border);border-radius:8px;padding:4px 8px;min-height:32px}
input[type=checkbox],input[type=radio]{width:16px;height:16px;min-height:16px;padding:0;margin:2px 0 0;flex:none;accent-color:var(--link);border-radius:4px}
input:focus,select:focus,textarea:focus,button:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:2px}
h1,h2,h3,h4{margin:0;color:var(--heading);font-weight:700}
h1{font-size:24px;line-height:30px}
h2{font-size:18px;line-height:22px}
h3{font-size:16px;line-height:20px}
h4{font-size:14px;line-height:18px}
p{margin:0}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--secondary)}
.small{font-size:12px;line-height:16px;color:var(--secondary)}
.sample{font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--tertiary);border:1px solid var(--divider);border-radius:4px;padding:0 4px;white-space:nowrap}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:8px}
.stack-l{display:flex;flex-direction:column;gap:20px}

/* ---------- top navigation ---------- */
.topnav{flex:none;height:var(--top);display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--divider);position:relative;z-index:40;overflow:hidden;min-width:0}
.topnav .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:var(--heading);white-space:nowrap}
.brand .wheel{width:22px;height:22px;border-radius:50%;border:3px solid var(--link);border-right-color:transparent;display:inline-block}
.topnav .util{margin-left:auto;display:flex;align-items:center;gap:4px;min-width:0}
.topnav #orgsel{min-width:0;max-width:150px}
.topnav #orgsel span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn-btn{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;color:var(--secondary);font-weight:600;white-space:nowrap}
.tn-btn:hover{background:var(--hover);color:var(--heading)}
.tn-btn .caret{font-size:10px;color:var(--tertiary)}
.tn-sep{width:1px;height:24px;background:var(--divider-2)}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--link);color:var(--primary-text);font-size:11px;font-weight:700;display:grid;place-items:center}
.menu{position:absolute;top:calc(var(--top) - 6px);right:16px;min-width:280px;background:var(--surface);border:1px solid var(--divider);border-radius:12px;box-shadow:var(--shadow);padding:8px;z-index:60}
.menu.left{right:auto;left:180px}
.menu h4{padding:6px 10px 4px;color:var(--tertiary);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;color:var(--text)}
.menu button:hover{background:var(--hover)}
.menu button[aria-current="true"]{background:var(--selected);color:var(--link);font-weight:700}
.menu .mi-sub{display:block;font-size:12px;color:var(--tertiary);font-weight:400}
.menu hr{border:0;border-top:1px solid var(--divider-2);margin:6px 4px}

/* ---------- layout ---------- */
.layout{flex:1;display:grid;grid-template-columns:var(--nav) minmax(0,1fr);min-height:0;min-width:0}
.layout.panel-open{grid-template-columns:var(--nav) minmax(0,1fr) var(--panel)}
.sidenav{background:var(--surface);border-right:1px solid var(--divider);overflow:auto;padding:20px 8px 40px}
.main{overflow:auto;padding:24px 24px 64px;background:var(--ground);min-width:0}
.main-inner{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}

/* ---------- side navigation ---------- */
.sn-head{padding:6px 12px 12px;border-bottom:1px solid var(--divider-2);margin-bottom:8px}
.sn-head b{font-size:16px;color:var(--heading)}
.sn-sec{margin:12px 0 4px;padding:4px 12px;font-weight:700;color:var(--heading)}
.sn-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 12px;border-radius:8px;color:var(--text)}
.sn-item:hover{background:var(--hover)}
.sn-item[aria-current="page"]{background:var(--selected);color:var(--link);font-weight:700}
.sn-item .badge-n{margin-left:auto}
.sn-sub{padding-left:20px}
.sn-org{display:flex;align-items:center;gap:6px;width:100%;padding:6px 12px;border-radius:8px;font-weight:700;color:var(--heading)}
.sn-org:hover{background:var(--hover)}
.sn-org .tw{font-size:10px;color:var(--tertiary);width:10px}
.sn-div{border:0;border-top:1px solid var(--divider-2);margin:12px 8px}
.sn-note{padding:4px 12px 0;font-size:12px;color:var(--tertiary)}

/* ---------- content layout ---------- */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--tertiary)}
.crumbs .sep{color:var(--disabled)}
.page-head{display:flex;flex-direction:column;gap:4px}
.page-head .desc{color:var(--secondary)}
.page-head .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---------- container ---------- */
.ctr{background:var(--surface);border:1px solid var(--divider-2);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.ctr-head{padding:16px 20px;border-bottom:1px solid var(--divider-2);display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ctr-head.plain{border-bottom:0;padding-bottom:0}
.ctr-head .ct{display:flex;flex-direction:column;gap:2px}
.ctr-head .counter{color:var(--tertiary);font-weight:400}
.ctr-body{padding:20px}
.ctr-body.tight{padding:0}
.ctr-foot{padding:12px 20px;border-top:1px solid var(--divider-2);background:var(--shaded);display:flex;justify-content:flex-end;gap:8px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:4px 20px;font-weight:700;font-size:14px;line-height:22px;white-space:nowrap;border:2px solid transparent}
.btn.normal{border-color:var(--link);color:var(--link);background:var(--surface)}
.btn.normal:hover{border-color:var(--link-hover);color:var(--link-hover);background:var(--hover)}
.btn.primary{background:var(--primary-bg);color:var(--primary-text);border-color:var(--primary-bg)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.link{color:var(--link);padding:4px 8px}
.btn.link:hover{color:var(--link-hover);text-decoration:underline}
.btn:disabled{border-color:var(--disabled);color:var(--disabled);cursor:not-allowed;background:transparent}
.btn.primary:disabled{background:var(--disabled-bg);border-color:var(--disabled-bg);color:var(--disabled)}
.btn.sm{padding:2px 14px;font-size:13px}

/* ---------- status, badges ---------- */
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.st .g{font-size:13px;line-height:1}
.st.success{color:var(--success)} .st.error{color:var(--error)} .st.warning{color:var(--warning)}
.st.info{color:var(--info)} .st.pending,.st.inactive,.st.stopped{color:var(--inactive)}
.st.loading{color:var(--secondary)}
.badge{display:inline-flex;align-items:center;border-radius:4px;padding:0 6px;font-size:12px;line-height:18px;font-weight:600;background:var(--shaded);color:var(--secondary);border:1px solid var(--divider-2);white-space:nowrap}
.badge.blue{background:var(--bg-info);color:var(--link);border-color:var(--link)}
.badge.grey{color:var(--tertiary)}
.badge-n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--link);color:var(--primary-text);font-size:12px;font-weight:700}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:700;color:var(--heading);padding:10px 20px;border-bottom:1px solid var(--divider-2);white-space:nowrap;background:var(--surface)}
.tbl td{padding:12px 20px;border-bottom:1px solid var(--divider-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.sub td{background:var(--shaded)}
.tbl tr.sub td:first-child{padding-left:40px}
.tbl td .cell-sub{display:block;font-size:12px;line-height:16px;color:var(--tertiary);margin-top:2px}
.tbl .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:32px 20px;text-align:center;color:var(--secondary)}
.empty b{display:block;color:var(--heading);margin-bottom:4px}

/* ---------- key value pairs ---------- */
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px 24px}
.kv .k{font-size:14px;color:var(--secondary);font-weight:400;margin-bottom:2px}
.kv .v{color:var(--text)}
.kv.cols-2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kv.rows{grid-template-columns:minmax(0,1fr);gap:12px}

/* ---------- settings headings and slots ---------- */
.hd-sec{display:flex;flex-direction:column}
.hd-sec + .hd-sec{border-top:1px solid var(--divider-2)}
.hd-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;flex-wrap:wrap}
.hd-bar .ht{display:flex;flex-direction:column;gap:2px}
.slot{display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-top:1px solid var(--divider-2);flex-wrap:wrap}
.slot .sl-main{flex:1;min-width:220px;display:flex;flex-direction:column;gap:4px}
.slot .sl-name{font-weight:700;color:var(--heading)}
.slot .sl-acts{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.slot.empty-slot{color:var(--secondary)}
.slot.lit{background:var(--selected)}
.cfg-line{font-size:12px;line-height:18px;color:var(--tertiary);font-family:var(--mono)}

/* ---------- flashbar ---------- */
.flashbar{display:flex;flex-direction:column;gap:8px}
.flash{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:12px;color:#fff;font-size:14px}
.flash.success{background:#00802f} .flash.info{background:#006ce0} .flash.error{background:#db0000}
.flash.warning{background:#fbd332;color:#0f141a}
.flash b{font-weight:700}
.flash a{color:#fff;text-decoration:underline}
.flash.warning a{color:#0f141a}
.flash .fx{margin-left:auto;font-size:16px;line-height:1;opacity:.9}

/* ---------- form ---------- */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.field label{font-weight:700;color:var(--heading)}
.field .fd{font-size:12px;line-height:16px;color:var(--secondary)}
.field input,.field select{width:100%}

.secret{border:1px solid var(--divider);border-radius:12px;padding:12px;background:var(--shaded)}

.split{background:var(--surface);border-left:1px solid var(--divider);display:flex;flex-direction:column;min-height:0}
.split-head{padding:16px 20px;border-bottom:1px solid var(--divider-2);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.split-body{overflow:auto;padding:16px 20px 40px;flex:1}
.split-foot{padding:12px 20px;border-top:1px solid var(--divider-2);background:var(--shaded);display:flex;justify-content:flex-end;gap:8px}
.pk{border:1px solid var(--divider-2);border-radius:12px;padding:12px;margin-bottom:8px;background:var(--surface)}
.pk.off{opacity:.55}
.pk .pkh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.pk .pkh b{color:var(--heading)}
.pk .pkl{font-size:12px;line-height:17px;color:var(--secondary)}
.pk .pkl i{font-style:normal;color:var(--tertiary);font-weight:600}
.pk .pka{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.search{width:100%;margin-bottom:12px}

.wiz{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.wiz-nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.wiz-nav li{display:flex;gap:10px;padding:8px 0;color:var(--secondary)}
.wiz-nav .n{width:22px;height:22px;border-radius:50%;border:2px solid var(--divider);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;color:var(--tertiary)}
.wiz-nav li.done .n{background:var(--link);border-color:var(--link);color:var(--primary-text)}
.wiz-nav li.now{color:var(--link);font-weight:700}
.wiz-nav li.now .n{border-color:var(--link);color:var(--link)}
.wiz-nav .lbl{display:flex;flex-direction:column}
.wiz-nav .lbl small{font-weight:400;font-size:12px;color:var(--tertiary)}
.wiz-foot{display:flex;justify-content:flex-end;gap:8px;padding-top:16px}
.steps{display:flex;flex-direction:column;gap:8px}
.step-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--divider-2)}
.step-row:last-child{border-bottom:0}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--divider);margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 16px;font-weight:700;font-size:16px;color:var(--secondary);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--link);border-bottom-color:var(--link)}

.field input[type=checkbox],.field input[type=radio],input[type=checkbox],input[type=radio]{width:16px;height:16px;min-height:16px;padding:0;margin:0 8px 0 0;flex:none;display:inline-block;vertical-align:-2px;accent-color:var(--link)}
.field label input[type=checkbox]{margin-right:8px}
.exp{border-top:1px solid var(--divider-2);margin-top:12px;padding-top:12px}
.exp-h{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--link);padding:4px 0}
.exp-h .tw{font-size:10px}
.exp-b{padding:8px 0 0}

.jrn.on{border-color:var(--link);background:var(--selected)}
.jrn .jt{font-weight:700;color:var(--heading)}
.jrn .jp{font-size:12px;line-height:17px;color:var(--secondary);margin-top:4px}
.jrn .jp b{color:var(--heading)}
.hamburger{display:none}

const esc = s => String(s == null ? '' : s).replace(/&(?!#?\w+;)/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const raw = s => String(s == null ? '' : s);
const ST_GLYPH = {success:'&#10003;', error:'&#10005;', warning:'&#9888;', info:'&#9432;', pending:'&#9711;', loading:'&#8635;', stopped:'&#9723;', inactive:'&#8722;'};
const st = (type, text) => `<span class="st ${type}"><span class="g" aria-hidden="true">${ST_GLYPH[type]||''}</span>${raw(text)}</span>`;
const badge = (text, cls) => `<span class="badge ${cls||''}">${raw(text)}</span>`;
const btn = (label, attrs, kind) => `<button class="btn ${kind||'normal'} sm" ${attrs}>${raw(label)}</button>`;
const answerLink = n => `<a href="rail-and-board.html?open=d:${n}">answer in the plan console</a>`;

function ctr(o){
  const counter = o.counter ? ` <span class="counter">(${esc(o.counter)})</span>` : '';
  const head = o.title ? `<div class="ctr-head"><div class="ct"><h2>${raw(o.title)}${counter}</h2>${o.desc ? `<div class="small">${raw(o.desc)}</div>` : ''}</div>${o.actions ? `<div class="row">${o.actions}</div>` : ''}</div>` : '';
  const body = o.body == null ? '' : `<div class="ctr-body ${o.tight ? 'tight' : ''}">${o.body}</div>`;
  return `<section class="ctr">${head}${body}${o.footer ? `<div class="ctr-foot">${o.footer}</div>` : ''}</section>`;
}
function table(cols, rows, empty){
  if(!rows.length) return `<div class="empty"><b>${esc(empty && empty[0] || 'No resources')}</b><div class="small">${raw(empty && empty[1] || '')}</div></div>`;
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map(c => `<th>${raw(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr class="${r.cls||''}">${r.cells.map(c => `<td>${raw(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const kv = (pairs, cls) => `<div class="kv ${cls||''}">${pairs.map(([k,v]) => `<div><div class="k">${raw(k)}</div><div class="v">${raw(v)}</div></div>`).join('')}</div>`;
const sub = t => `<span class="cell-sub">${raw(t)}</span>`;

/* ===========================================================================
   responses and decisions — the two ways this console changes anything
   =========================================================================== */
function flash(type, header, text){ S.flashes.unshift({type, header, text, id:Math.random().toString(36).slice(2)}); }
function logged(what, detail){
  S.log.unshift({what, at:NOW});
  flash('success', 'Response recorded', `${esc(what)} · one logged response, applied by the machinery as it reads the manifest on its next tick${detail ? ' · ' + detail : ''}`);
}
function raiseDecision(kind, title, note){
  const n = S.nextDecision++;
  S.raised.unshift({n, kind, title, at:NOW});
  const guard = kind === 'package-install' ? 'nothing is installed until it is answered (S118, S124)' : 'nothing changes until it is answered (S113)';
  flash('info', `Decision ${n} raised`, `${esc(title)} · kind ${esc(kind)} · ${guard}. ${note ? esc(note) + ' · ' : ''}${answerLink(n)}`);
  return n;
}

/* ===========================================================================
   the host settings screen, by heading (S115)
   =========================================================================== */
function slotState(p){
  const s = p.state;
  if(/^adding/.test(s)) return st('pending', `adding · decision ${p.decision} · ` + answerLink(p.decision));
  if(s === 'needs a secret') return st('warning', `needs a secret · <a href="#" data-secret="${p.host||''}|${p.pkg}">place it</a>${p.wi ? ' · install chore ' + esc(p.wi) + ' waits on it' : ''}`);
  if(/^installing/.test(s)) return st('loading', esc(s));
  if(s === 'disabled') return st('stopped', 'disabled' + (p.why ? ' · ' + esc(p.why) : ''));
  return st('success', esc(s));
}
function cfgLine(p){
  const P = pkg(p.pkg), vals = p.cfg || {};
  const parts = schemaOf(P).filter(f => f.kind !== 'secret' && vals[f.k]).map(f => `${f.k} ${vals[f.k]}`);
  const secrets = schemaOf(P).filter(f => f.kind === 'secret' && (!f.when || vals[f.when[0]] === f.when[1]))
    .map(f => `${f.file} ${(p.secrets||{})[f.k] ? 'placed' : 'not placed'}`);
  const all = parts.concat(secrets);
  return all.length ? `<div class="cfg-line">${esc(all.join(' · '))}</div>` : '';
}
function slot(h, p, opts){
  const P = pkg(p.pkg); opts = opts || {};
  const acts = [];
  if(p.byPool) acts.push(`<span class="small">declared by the pool · configured there</span>`);
  else {
    if(schemaOf(P).length) acts.push(btn('Configure', `data-configure="${h.id}|${p.pkg}"`));
    if(opts.single) acts.push(btn('Change', `data-catalogue="${h.id}|${P.kind}|replace:${p.pkg}"`));
    if(p.state === 'disabled') acts.push(btn('Enable', `data-part="enable|${h.id}|${p.pkg}"`));
    else if(/^installed/.test(p.state)) acts.push(btn('Disable', `data-part="disable|${h.id}|${p.pkg}"`, 'link'));
    if(!opts.single) acts.push(btn('Remove', `data-part="remove|${h.id}|${p.pkg}"`, 'link'));
  }
  return `<div class="slot ${S.lit === h.id + '|' + p.pkg ? 'lit' : ''}">
    <div class="sl-main"><div class="sl-name">${esc(P.name)} <span class="small">v${esc(P.v)} · ${esc(P.tag)}</span>${p.lease ? ' ' + badge('lease','blue') : ''}</div>
      <div class="small">${raw(P.enables)}</div>${cfgLine({...p, host:h.id})}
      <div>${slotState({...p, host:h.id})}</div>${p.lastRun ? `<div class="small">last run ${esc(p.lastRun)}</div>` : ''}</div>
    <div class="sl-acts">${acts.join('')}</div></div>`;
}
function emptySlot(h, kind, takes){
  return `<div class="slot empty-slot"><div class="sl-main"><div class="sl-name">Empty</div><div class="small">${raw(takes)}</div></div>
    <div class="sl-acts">${btn('Add', `data-catalogue="${h.id}|${kind}"`)}</div></div>`;
}
function headingCtr(title, desc, actions, inner){
  return `<section class="ctr"><div class="ctr-head"><div class="ct"><h2>${raw(title)}</h2><div class="small">${raw(desc)}</div></div>${actions ? `<div class="row">${actions}</div>` : ''}</div>${inner}</section>`;
}
function pageHost(){
  const h = host(S.host);
  if(!h) return pageHead('Host not found', '');

    const p = h.parts.find(x => x.k === kind);

    const ps = h.parts.filter(x => x.k === kind);
    return ps.length ? ps.map(p => slot(h, p)).join('') : `<div class="slot empty-slot"><div class="sl-main"><div class="small">${raw(empty)}</div></div></div>`;

  const platNote = h.plat.includes('herdr') ? '' : `<div class="slot empty-slot"><div class="sl-main"><div class="small">the pane runner needs herdr on the host, which this platform cannot take</div></div></div>`;

  const signin = headingCtr('Sign-in', 'one slot · the kind is a setting of this host, the same for every organization it serves; GitHub is the default and the identity is the GitHub username (233, 234, S164)',
    '', single('sign-in', 'GitHub · tailnet · OAuth · OIDC'));
  const router = headingCtr('Router', 'one slot · what a served place is reached at, and nothing beyond the private network unless a route is opened per named caller (191)',
    '', single('router', 'local · private-network · platform'));

  const runnerRoles = ['elaboration','construction','machinery'].map(role => {
    const r = (h.roles || {})[role] || {};

    return `<div class="slot"><div class="sl-main"><div class="sl-name">${esc(role)}</div>
      <div class="small">${P ? `${esc(P.name)} · <span class="mono">${esc(r.model)}</span>` : `no runner on this host for ${esc(role)} · sessions of this role run elsewhere`}</div>
      ${P ? st('success', 'installed') : st('inactive','empty')}</div>
      <div class="sl-acts">${btn(P ? 'Change runner' : 'Add runner', `data-catalogue="${h.id}|runner"`)}</div></div>`;
  }).join('');
  const runnersInstalled = h.parts.filter(x => x.k === 'runner').map(p => slot(h, p)).join('');
  const runners = headingCtr('Runners', 'one slot per role · a runner names where a session of that role runs; the model beside it is the manifest&#8217;s default per role, and whether a host may declare its own is not settled (173, S147)',
    btn('Add runner', `data-catalogue="${h.id}|runner"`),
    runnerRoles + `<div class="hd-bar"><div class="ht"><h3>Runners installed here</h3><div class="small">what the roles above can be pointed at</div></div></div>` + runnersInstalled + platNote);

  const ag = h.agent || {};
  const agent = headingCtr('Agent', 'reads the plan and the objects, answers in chat, and proposes every write as a tool call you confirm (194) · the model keeps the name "interpreter"; the surface says agent (S116)',
    '', `<div class="slot"><div class="sl-main"><div class="sl-name">agent</div><div class="small">${esc(ag.what || '')}</div>

function catalogueBody(){
  const p = S.panel, isOrg = p.target === 'org';
  const plat = isOrg ? ['any'] : (p.target === '__new' ? wizPlat() : host(p.target).plat);
  const all = INDEX.filter(x => x.kind === p.kind || (isOrg && p.kinds && p.kinds.includes(x.kind)));
  const q = (p.q || '').toLowerCase();
  const matched = all.filter(x => !q || (x.name + ' ' + x.id + ' ' + x.enables).toLowerCase().includes(q));
  const fits = matched.filter(x => isOrg || pkgFits(x, plat));
  const rest = matched.filter(x => !(isOrg || pkgFits(x, plat)));
  const already = id => {
    if(isOrg) return org().store[id];
    if(p.target === '__new') return (S.wizard.parts || []).find(x => x.pkg === id);
    return partOn(host(p.target), id);
  };
  const card = (x, off) => {
    const on = already(x.id);
    return `<div class="pk ${off ? 'off' : ''}">
      <div class="pkh"><b>${esc(x.name)}</b>${badge('v' + x.v)}${badge(x.tag, x.tag === 'shipped' ? 'blue' : 'grey')}</div>
      <div class="pkl"><i>needs</i> ${raw(x.needs)}</div>
      <div class="pkl"><i>enables</i> ${raw(x.enables)}</div>
      ${off ? `<div class="pkl"><i>platform</i> ${esc(x.plat.join(' · '))} · this host is ${esc(plat.join(' · '))}</div>` : ''}
      <div class="pka">${on
        ? st(on.state === 'disabled' ? 'stopped' : /^adding/.test(on.state||'') ? 'pending' : 'success',
            (isOrg ? 'in the blueprints' : 'on ' + esc(p.target === '__new' ? 'the new host' : p.target))
            + (on.state && !/^installed/.test(on.state) ? ' · ' + esc(on.state) : ''))
        : off ? `<span class="small">not for this platform</span>`
        : btn(p.replaces ? 'Replace with' : 'Add', `data-sheet="${x.id}"`, 'primary')}</div></div>`;
  };
  return `<input class="search" id="cat-q" placeholder="Find a ${esc(p.kind)}" value="${esc(p.q || '')}">
    ${p.replaces ? `<div class="small" style="margin-bottom:8px">this heading takes one · what you choose replaces <b>${esc(pkg(p.replaces).name)}</b>, which leaves the slot when the new one reads installed</div>` : ''}
    ${fits.map(x => card(x, false)).join('') || `<div class="empty"><b>Nothing matches</b><div class="small">the catalogue is one heading&#8217;s kind only; there is no index across kinds (S117)</div></div>`}
    ${isOrg ? '' : `<div class="field" style="margin-top:12px"><label><input type="checkbox" id="cat-any" ${p.any ? 'checked' : ''}> any platform</label>
      <div class="fd">shows the rest greyed with what they need</div></div>
      ${p.any ? rest.map(x => card(x, true)).join('') : ''}`}`;
}
function sheetBody(){
  const p = S.panel, P = pkg(p.pkg), isOrg = p.target === 'org';
  const vals = p.values || (p.values = {});
  const fields = schemaOf(P).filter(f => !f.when || vals[f.when[0]] === f.when[1]);
  const form = fields.map(f => {
    if(f.kind === 'secret') return `<div class="field"><label>${esc(f.label)}</label>
      <div class="secret"><div class="small">the page never carries the value (204, 207). Place it on ${esc(isOrg ? 'the blueprints host' : p.target === '__new' ? (S.wizard.name || 'the new host') : p.target)} and let the machinery check the path.</div>
        <div class="cmd">op read "${esc(f.op || 'op://vault/item/field')}" | flywheel secret place --host ${esc(p.target === '__new' ? (S.wizard.name || '&lt;host&gt;') : p.target)} ${esc(f.file)}</div>
        <div class="row">${btn('Copy', `data-copy="${esc(f.op||'')}"`)}${btn('Check', `data-sheetsecret="${f.k}"`)}
          ${btn('I&#8217;ll place it later', `data-sheetlater="${f.k}"`, 'link')}
          ${p.secrets && p.secrets[f.k] === true ? st('success','placed') : p.secrets && p.secrets[f.k] === 'later' ? st('warning','later · under attention after the install') : st('pending','not placed')}</div>
      </div></div>`;
    if(f.kind === 'select') return `<div class="field"><label for="f-${f.k}">${esc(f.label)}</label>
      <select id="f-${f.k}" data-field="${f.k}">${f.opts.map(o => `<option ${vals[f.k] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;
    return `<div class="field"><label for="f-${f.k}">${esc(f.label)}</label>
      <input id="f-${f.k}" data-field="${f.k}" value="${esc(vals[f.k] || '')}" placeholder="${esc(f.ph || '')}"></div>`;
  }).join('') || `<div class="small">this package has nothing to configure</div>`;
  return `<div class="stack" style="margin-bottom:12px">
      <div class="pkl"><i>needs</i> ${raw(P.needs)}</div>
      <div class="pkl"><i>enables</i> ${raw(P.enables)}</div>

    </div>${form}
    <div class="small">${p.mode === 'configure'
      ? 'save is one logged response; the machinery applies it as a re-install of this package (S119)'
      : 'nothing is installed by this form: it ends by raising one install decision in the rail, and the yes runs the install as the machinery&#8217;s effects with proofs (S118)'}</div>`;
}

function sheetSave(){
  const p = S.panel, P = pkg(p.pkg);
  const secrets = {}; secretFields(P).forEach(f => { secrets[f.k] = p.secrets[f.k] === true; });
  if(p.mode === 'configure'){
    if(p.target === 'org'){ org().store[p.pkg].cfg = {...p.values}; }
    else { const part = partOn(host(p.target), p.pkg); part.cfg = {...p.values}; part.secrets = {...(part.secrets||{}), ...secrets}; }
    logged(`configure ${P.name} on ${p.target === 'org' ? 'the blueprints' : p.target}`, 'applied as a re-install of this package; a changed secret is placed again through "place it" (S119)');
    S.lit = p.target + '|' + p.pkg; closePanel(); return;
  }
  if(p.target === '__new'){
    S.wizard.parts.push({pkg:p.pkg, cfg:{...p.values}});
    flash('success','Chosen', `${esc(P.name)} joins the new host · nothing is installed until it joins`);
    closePanel(); return;
  }
  const later = secretFields(P).some(f => p.secrets[f.k] === 'later');
  const title = p.target === 'org'
    ? `install ${P.name} in the blueprints`
    : `install ${P.name} on ${p.target}${p.replaces ? ` · replaces ${pkg(p.replaces).name}` : ''}`;
  const n = raiseDecision('package-install', title, later ? 'a secret was left for later, so the slot reads "needs a secret" after the yes' : '');
  if(p.target === 'org') org().store[p.pkg] = {state:`adding, decision ${n}`, decision:n, cfg:{...p.values}};
  else host(p.target).parts.push({k:P.kind, pkg:p.pkg, state:`adding · decision ${n}`, decision:n, cfg:{...p.values}, secrets, replaces:p.replaces});
  S.lit = p.target + '|' + p.pkg;
  closePanel();
}
function partAction(spec){
  const [act, hid, id] = spec.split('|');
  const h = host(hid), part = partOn(h, id), P = pkg(id);
  if(act === 'remove'){ h.parts = h.parts.filter(x => x !== part);
    logged(`remove ${P.name} from ${hid}`, 'what it ran ends; its records stay (229)'); return; }
  part.state = act === 'disable' ? 'disabled' : `installed ${NOW}`;
  if(act === 'disable') part.why = `turned off ${NOW}`; else delete part.why;
  logged(`${act} ${P.name} on ${hid}`, 'one logged response · the host reads it on its next tick');
}
function storeAction(spec){
  const [act, id] = spec.split('|'), P = pkg(id);
  if(act === 'retire'){ org().store[id].state = `retired ${NOW}`; logged(`retire ${P.name} from the blueprints`, 'every host stops reading it on its next tick'); }
  else { org().store[id].state = `installed ${NOW} · restored`; logged(`restore ${P.name} in the blueprints`, 'every host reads it on its next tick'); }
  S.lit = 'org|' + id;
}

  const w = S.orgWizard;
  if(w.step === ORG_WIZ_STEPS.length - 1){
    S.addorg = null;
    if(w.ticked){ S.org = w.name; S.page = 'overview'; S.orgWizard = null; }
    return;
  }
  w.step++;
}
function wizJoin(){
  const w = S.wizard, o = org();
  const parts = w.parts.map(p => ({k:pkg(p.pkg).kind, pkg:p.pkg, state:secretFields(pkg(p.pkg)).some(f => !w.secrets[pkg(p.pkg).id + '|' + f.k]) ? 'needs a secret' : `installed ${NOW}`, cfg:p.cfg, secrets:{}}));
  const plat = w.adopt ? ['machine','macos','herdr'] : (PLATFORMS.find(x => x[0] === w.platform) || [])[3] || ['any'];
  const bound = w.adopt ? 2 : (PLATFORMS.find(x => x[0] === w.platform) || [])[4] || 0;
  o.hosts.push({id:w.name, kind: w.adopt ? 'adopted host' : w.platform === 'laptop' ? 'laptop' : 'cloud',
    platform: w.adopt ? 'read at join' : (PLATFORMS.find(x => x[0] === w.platform) || [])[1], plat, alive:true, bound, last:NOW,
    joined:TODAY.slice(5), joinedVia: w.adopt ? 'adopt existing' : (PLATFORMS.find(x => x[0] === w.platform)||[])[1],
    root:`/srv/flywheel/${o.name}`, launcher:'systemd · flywheel.service', binary:'0.9.4', binaryLatest:'0.9.4',
    note:`joined ${NOW} with the token from decision ${w.decision}`,
    roles:{elaboration:{runner:null, model:'claude-sonnet-5'}, construction:{runner:null, model:'claude-fable-5-1'}, machinery:{runner:null, model:'claude-haiku-4-5'}},
    agent:{on:parts.some(p => p.k === 'chat sink'), runner:null, what:'the binary&#8217;s interpreter job'},
    env:{provider: w.platform === 'laptop' ? 'devenv' : 'image', repos:Object.fromEntries(o.repos.map(r => [r.id, {ok:true}]))},
    parts,
    joinedSteps:[['platform','done',NOW, w.adopt ? 'read at join' : (PLATFORMS.find(x => x[0] === w.platform)||[])[1]],
      ['provision','done',NOW, w.adopt ? 'skipped · adopt existing' : 'ran from ' + IDENTITY.servingHost + ' with your own credentials, read at run time and never stored'],
      ['hand over secrets','done',NOW, `${Object.keys(w.secrets).length} placed · the rest wait under attention`],
      ['enrol','done',NOW, `decision ${w.decision} · one-time token · expires in 24h · used once`],
      ['join','done',NOW,'read the manifest and installed the parts you chose'],
      ['alive','done',NOW,'first heartbeat as host/' + w.name]]});
  w.joined = true;
  flash('success','Alive', `${esc(w.name)} joined and is alive · its row is in Hosts`);
}

/* ---- review switches ---- */
(function init(){
  const q = new URLSearchParams(location.search);
  if(q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
  if(q.get('org') && ORGS[q.get('org')]) S.org = q.get('org');
  if(q.get('page')) S.page = q.get('page');
  if(q.get('host') && host(q.get('host'))) S.host = q.get('host');
  if(q.get('addhost')){ S.addhost = true; S.wizard = newWizard(); }
  if(q.get('addorg')){ S.addorg = true; S.orgWizard = newOrgWizard(); if(q.get('ostep')) S.orgWizard.step = +q.get('ostep'); }
  if(q.get('panel')) S.panel = {mode:'catalogue', target:S.host || 'studio', kind:'chat sink', q:'', any:false};
  if(q.get('flash')) flash('info','Decision 425 raised','install Slack on studio · kind package-install · nothing is installed until it is answered · ' + answerLink(425));
  render();
})();
</script>
