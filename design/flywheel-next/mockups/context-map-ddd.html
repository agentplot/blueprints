<!--
  Context Map · DDD — the system context map as the scope surface, drawn from the
  first-principles model in ../models/context-map/model.md. Section 5 is followed at rest
  and departed from in one place, on Chuck's brief of 2026-09-07: a context card carries a
  thumbnail of the map inside it instead of counts, and the second zoom level is a drill
  into that inside instead of a card opened in place.

  Seeded from ../models/context-map/example.yaml: its three contexts (Ordering, Billing,
  Payments Gateway), five elements, two relationships, one link and two claims are kept
  verbatim. The rest — six more contexts, thirty-seven more elements, nine more
  relationships, thirty-one more links (nineteen of them inside one context, so every
  thumbnail has something to draw), nine more claims, the current map, the review history
  and the decision markers (numbers 412–424 from rail-and-board's seed, retitled to this
  map's objects) — is invented in the same voice and marked sample.

  Decisions taken while building:
  - Both maps are YAML in <script type="text/yaml"> blocks that read as schema.yaml, parsed by
    a small inline YAML-subset parser. The organization vocabulary is a third block. Claims,
    verdicts, decisions and the target map's history are JSON, because the map file carries
    none of them (model 2, 4.2, 4.5).
  - Two zoom levels, fit the one camera command at each. At rest, contexts are the only units
    on the canvas: a layered layout ranks them upstream → downstream (left to right), pulls
    sources toward their consumers, orders each column by barycenter and centres the columns.
    Positions never change after that.
  - A card at rest keeps its header (name, status, home chips with verdict dots, attachment
    chip, decision markers, open-question badge, tags) and carries a thumbnail: the context's
    elements as dots laid out by a small deterministic force layout, links between them as
    hairlines, a short dashed stub where an element links out (pointing toward the other
    context), dots coloured by kind from the vocabulary, ringed by home. The thumbnail is
    read-only; its caption counts elements, links and links out. Clicking the header opens the
    dock; clicking the thumbnail drills in.
  - Drilled in, the canvas is the context's inside at full size in the same grammar: elements
    as nodes (kind, name, home chip with verdict dot, attachment chip, decision markers, status
    dot, open-question badge with the capture control, tags), links as typed edges with the
    kind on the edge, the neighbouring contexts as collapsed docks at the canvas edges
    (upstream left, downstream right, symmetric above, separate ways below) carrying the
    pattern, the U/D marks with OHS, PL and ACL for each side, the kernel, the crossing count,
    the attachment chip and the markers, and a "drill into" control. A cross-context link lands
    on its dock with the target element named on the edge. The inside is a force layout in the
    inner area, an element that links out pulled toward its dock, node heights measured once and
    the boxes pushed apart; positions are then final for the drill. A breadcrumb "org › Billing"
    sits over the canvas; Esc or "org" returns to the whole map with its camera restored.
  - A relationship edge at rest carries a count pill of the element-to-element links that cross
    it (model 2.4: a link across contexts must cross a non-separate-ways relationship; separate
    ways reads "none · by rule", or "n cross · fails"). Hovering or focusing the edge slides out a
    panel at its midpoint listing those links (from element with context and home, link kind, to
    element with context and home; removed ones ghosted under an overlay), the claims attached to
    the relationship, and controls to open it or drill either end.
  - A relationship is one edge per pair: pattern name on the edge, U and D marks with an
    arrowhead on directional patterns, OHS / PL beside the U, ACL beside the D, a lens with the
    kernel's name on a shared kernel, a dotted edge with a bar on separate ways. An edge that
    would cross a card bows over the top until it clears.
  - Facets (lane, runtime, tier) only filter, colour or wash, at both levels: filter dims cards,
    dots and nodes; colour recolours cards, dots (the kind colour yields to the facet value) and
    node edges; group washes a band behind contexts or nodes. The control strip reports, after
    every switch, that 0 moved and 0 edges changed at the level shown, computed by comparing the
    positions and every edge path before and after.
  - Overlays come from one id-keyed diff: current → target, and target at the review mark →
    target now (the mark's map is rebuilt from the history, never stored). Added +, changed Δ
    with the fields on hover, removed ghosted, moved with the old home struck through — on cards
    and edges at rest, on dots in the thumbnails, on nodes, link edges and neighbour docks when
    drilled (a removed element or relationship is placed around the target's without moving it).
    The Changes panel is a dock page with a link per entry; "mark reviewed" moves the mark to now.
  - Repositories, claims and lanes are never nodes: repositories are chips on cards and nodes
    (with a verdict dot and the home's ring colour) and a strip above the canvas; claims are
    attachment chips; lanes are tags. A kind legend floats at the bottom of the canvas.
  - Scope is a gesture: "re-attach" on a claim arms the canvas; one click on any context,
    element, edge, link or neighbour dock sends one response and recomputes the scope line and
    verdicts.
  - Add repository is a proposal, not a dictation (S72): the form asks a name and which unhomed
    elements it homes (or a context to default), derives kinds, capabilities and the claims that
    would fall into scope live, and "propose" sends create-repository. A decision under approve
    appears on a dashed "proposed" chip in the strip and in the rail card inline; its yes creates
    the repository, writes the manifest entry and the map homes, and runs its first planning;
    the baseline decision arrives after that under a new number (104). Redo reopens the form
    with notes; later leaves a dashed "deferred · n" marker.
  - Decision markers use rail-and-board's glyph set (S17): ✓ n approve, ? n decide, ✎ n answer,
    ! attention, a dashed "deferred · n"; an answered decision leaves the board (S18) and stays
    in its object's dock history.
  - Keys: f fit · o overlay cycle · j/k move among contexts, or among elements when drilled ·
    Enter drill (at rest) or open the dock (drilled) · Esc hide the panel, close the dock, back.
    Review switches: ?theme=dark|light, ?drill=<context id>, ?dock=<page key>,
    ?overlay=current|review, ?hover=<relationship id> (opens the crossing panel),
    ?facet=<facet>:<mode>[:<value>], ?demo=repo (walks propose → yes → baseline).
-->
<meta charset="utf-8">
<title>Context Map · DDD</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#F6F8FA; --ink:#16202A; --ink2:#4A5763; --ink3:#7A8794;
  --line:#D5DBE1; --line2:#E4E8EC; --accent:#0B6E79; --accent-ink:#FFFFFF; --accent-soft:#D9EEF0; --accent-hatch:rgba(11,110,121,.10);
  --ok:#2E8B57; --warn:#B7791F; --crit:#B3362B; --lit:#FFF3C4; --lit-line:#E5C34A;
  --ov1:#0B6E79; --ov2:#8A4FBF; --mud:rgba(22,32,42,.09);
  --f1:#0B6E79; --f2:#B7791F; --f3:#8A4FBF;
  --k1:#0B6E79; --k2:#B7791F; --k3:#8A4FBF; --k4:#2F6DB5; --k5:#B3543A; --k6:#C2489B; --k7:#3E8E5B;
  --h1:#16202A; --h2:#7A5C2E; --h3:#4E6B8A; --h4:#6B4E8A; --h5:#3C7A5A; --h6:#8A4E4E;
  --shadow:0 10px 30px rgba(22,32,42,.16); --top:46px; --strip:40px; --controls:40px; --dock:600px;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12171C; --surface:#1A2128; --surface2:#20282F; --ink:#E6EBEF; --ink2:#A9B4BE; --ink3:#74818C;
  --line:#2A333C; --line2:#232C34; --accent:#4FB3BF; --accent-ink:#0E1A1C; --accent-soft:#173A3E; --accent-hatch:rgba(79,179,191,.10);
  --ok:#5CB57F; --warn:#D9A24A; --crit:#E0675B; --lit:#3A3416; --lit-line:#B89B2D; --ov1:#4FB3BF; --ov2:#B48AE0; --mud:rgba(230,235,239,.08);
  --f1:#4FB3BF; --f2:#D9A24A; --f3:#B48AE0; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  --k1:#4FB3BF; --k2:#D9A24A; --k3:#B48AE0; --k4:#6FA3E8; --k5:#E08A70; --k6:#E07AC0; --k7:#6FC38E;
  --h1:#E6EBEF; --h2:#C9A46A; --h3:#8FB0D0; --h4:#B39AD6; --h5:#7FC3A0; --h6:#D08C8C; } }
:root[data-theme="dark"]{
  --bg:#12171C; --surface:#1A2128; --surface2:#20282F; --ink:#E6EBEF; --ink2:#A9B4BE; --ink3:#74818C;
  --line:#2A333C; --line2:#232C34; --accent:#4FB3BF; --accent-ink:#0E1A1C; --accent-soft:#173A3E; --accent-hatch:rgba(79,179,191,.10);
  --ok:#5CB57F; --warn:#D9A24A; --crit:#E0675B; --lit:#3A3416; --lit-line:#B89B2D; --ov1:#4FB3BF; --ov2:#B48AE0; --mud:rgba(230,235,239,.08);
  --f1:#4FB3BF; --f2:#D9A24A; --f3:#B48AE0; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  --k1:#4FB3BF; --k2:#D9A24A; --k3:#B48AE0; --k4:#6FA3E8; --k5:#E08A70; --k6:#E07AC0; --k7:#6FC38E;
  --h1:#E6EBEF; --h2:#C9A46A; --h3:#8FB0D0; --h4:#B39AD6; --h5:#7FC3A0; --h6:#D08C8C; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--sans);overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input:focus,textarea:focus,select:focus,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3,h4{margin:0;font-weight:700;text-wrap:balance}
a{color:var(--accent)}
.mono{font-family:var(--mono)}
kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink2);background:var(--surface2)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.sample{font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border:1px dashed var(--line);border-radius:3px;padding:0 4px;vertical-align:middle}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:var(--surface);font-weight:600;font-size:12.5px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.yes{color:var(--accent);border-color:var(--accent)}
.btn.drop{color:var(--crit)}
.btn.quiet{border-color:transparent;color:var(--ink2)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.btn.armed{background:var(--lit);border-color:var(--lit-line)}

/* ---------- top ---------- */
.top{height:var(--top);display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:15px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.top .meta{color:var(--ink3);font-size:12px;white-space:nowrap}
.top .keys{display:flex;gap:10px;font-size:11px;color:var(--ink3);margin-left:auto}
@media (max-width:1180px){.top .keys{display:none}}
.top .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.top .keys + .r{margin-left:0}
.theme{font:11px var(--mono)}

/* ---------- strip: repositories, check ---------- */
.strip{height:var(--strip);display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--surface2);overflow-x:auto}
.strip .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-right:4px;white-space:nowrap}
.repo{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font:600 12px var(--mono);white-space:nowrap;cursor:pointer}
.repo .hm{font:11px var(--sans);color:var(--ink3);font-weight:500}
.repo .um{font:700 10.5px var(--mono);padding:0 6px;border-radius:999px;border:1px solid var(--line);color:var(--ink3)}
.repo .um.some{color:var(--warn);border-color:var(--warn)} .repo .um.many{color:#fff;background:var(--crit);border-color:var(--crit)} .repo .um.none{color:var(--ok);border-color:var(--ok)}
.repo.open-in-dock{background:var(--accent-soft);border-color:var(--accent)}
.repo.new{border-color:var(--ok)}
.strip .sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
.strip .note{margin-left:auto;font-size:11.5px;color:var(--ink3);white-space:nowrap;display:flex;gap:10px;align-items:center}
@media (max-width:1500px){.strip .note .wide{display:none}}
.check{font:600 11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ok);border-color:var(--ok);white-space:nowrap}
.check.fail{color:var(--crit);border-color:var(--crit)}

/* ---------- controls: facets, overlays ---------- */
.controls{min-height:var(--controls);display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line2);background:var(--surface);font-size:12px;color:var(--ink3);flex-wrap:wrap;overflow-x:auto}
.facet{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.facet .fn{font:600 11.5px var(--mono);color:var(--ink2)}
.facet .fv{color:var(--ink3);font-size:11px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{padding:2px 8px;font-size:11.5px;font-weight:600;color:var(--ink2)}
.seg button + button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button.ov1[aria-pressed="true"]{background:var(--ov1)} .seg button.ov2[aria-pressed="true"]{background:var(--ov2);color:#fff}
.facet select{padding:1px 4px;font:11.5px var(--mono);border-radius:4px}
.legend{display:inline-flex;gap:8px;align-items:center;font:11px var(--mono)}
.legend .sw{display:inline-flex;align-items:center;gap:4px} .legend .sw i{width:10px;height:10px;border-radius:2px;display:inline-block}
.controls .r{margin-left:auto;display:flex;gap:10px;align-items:center;white-space:nowrap}
.controls .inv{font:11px var(--mono);color:var(--ink3)} .controls .inv b{color:var(--ok);font-weight:600}
.controls .inv.bad b{color:var(--crit)}
.mark-note{font:11px var(--mono);color:var(--ink3)}

/* ---------- board ---------- */
.board{position:relative;flex:1;min-height:0;overflow:hidden}
.top,.strip,.controls{flex:none}
.wrap{position:absolute;inset:0;overflow:auto;background:radial-gradient(circle at 1px 1px,var(--line2) 1px,transparent 1.5px) 0 0/22px 22px,var(--bg)}
.stage{position:relative;transform-origin:0 0}
.stage > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.stage > svg.under{pointer-events:none;z-index:1}
.stage > svg.over{pointer-events:none;z-index:6}
.stage .cards{position:absolute;inset:0;z-index:2}
.stage.enter .cards,.stage.enter > svg{animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* edges */
.edge-g .hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.edge-g .ln{fill:none;stroke:var(--ink3);stroke-width:1.4}
.edge-g.dir .ln{marker-end:url(#arrow)}
.edge-g.sep .ln{stroke-dasharray:2 5;stroke-linecap:round}
.edge-g.sym .ln{stroke-width:1.6}
.edge-g.kernel .ln{stroke:var(--accent)}
.edge-g.candidate .ln{stroke-dasharray:6 3}
.edge-g.ghost .ln{stroke:var(--ovc);stroke-dasharray:3 4;opacity:.55} .edge-g.ghost .elabel{fill:var(--ovc)}
.edge-g.changed .ln{stroke:var(--ovc);stroke-width:2}
.edge-g.added .ln{stroke:var(--ovc);stroke-width:2}
.edge-g.dim{opacity:.18}
.edge-g.lit .ln{stroke:var(--lit-line);stroke-width:3}
.edge-g.open-in-dock .ln{stroke:var(--accent);stroke-width:2.2}
.edge-g.inscope .ln{stroke:var(--accent);stroke-width:2.6}
.edge-g.hover .ln{stroke:var(--accent);stroke-width:2.2}
.edge-g .hit:focus-visible{outline:none;stroke:color-mix(in srgb,var(--accent) 25%,transparent)}
.edge-g .xc rect{fill:var(--surface);stroke:var(--ink3);stroke-width:1;rx:8} .edge-g .xc text{font:600 9.5px var(--mono);fill:var(--ink2);text-anchor:middle;dominant-baseline:central}
.edge-g .xc.zero{opacity:.6} .edge-g .xc.rule rect{stroke-dasharray:2 2} .edge-g .xc.bad rect{stroke:var(--crit)} .edge-g .xc.bad text{fill:var(--crit)}
.edge-g.hover .xc rect{stroke:var(--accent)} .edge-g.hover .xc text{fill:var(--accent)}
.edge-g .elabel{font:600 10px var(--mono);fill:var(--ink2);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.edge-g .ud{font:700 9px var(--mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.edge-g .udc{fill:var(--surface);stroke:var(--ink3);stroke-width:1}
.edge-g .bd rect{fill:var(--surface);stroke:var(--ink3);stroke-width:1;rx:2}
.edge-g .bd text{font:700 8.5px var(--mono);fill:var(--ink2);text-anchor:middle;dominant-baseline:central}
.edge-g .bd.acl rect{stroke:var(--warn)} .edge-g .bd.acl text{fill:var(--warn)}
.edge-g .lens{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}
.edge-g .lens-t{font:600 9.5px var(--mono);fill:var(--accent);text-anchor:middle;dominant-baseline:central}
.edge-g .bar{stroke:var(--ink3);stroke-width:2}
.edge-g .att rect{fill:var(--surface2);stroke:var(--line);rx:8}
.edge-g .att text{font:600 9.5px var(--mono);fill:var(--ink2);text-anchor:middle;dominant-baseline:central}
.edge-g .mk rect{fill:var(--surface2);stroke:var(--warn);rx:3} .edge-g .mk text{font:600 9.5px var(--mono);fill:var(--warn);text-anchor:middle;dominant-baseline:central}
.edge-g .mk.approve rect{stroke:var(--accent)} .edge-g .mk.approve text{fill:var(--accent)}
.edge-g .mk.answer rect{stroke:var(--crit)} .edge-g .mk.answer text{fill:var(--crit)}
.edge-g .mk.deferred rect,.link-g .mk.deferred rect{stroke:var(--ink3);stroke-dasharray:2 2} .edge-g .mk.deferred text,.link-g .mk.deferred text{fill:var(--ink3)}
.link-g .mk rect{fill:var(--surface2);stroke:var(--warn);rx:3} .link-g .mk text{font:600 9.5px var(--mono);fill:var(--warn);text-anchor:middle;dominant-baseline:central}
.link-g .mk.approve rect{stroke:var(--accent)} .link-g .mk.approve text{fill:var(--accent)}
.link-g .mk.answer rect{stroke:var(--crit)} .link-g .mk.answer text{fill:var(--crit)}
.edge-g .ovm rect{fill:var(--ovc);rx:3} .edge-g .ovm text{font:700 10px var(--mono);fill:#fff;text-anchor:middle;dominant-baseline:central}
.band{fill:var(--bc);opacity:.13;rx:16}
.band-t{font:700 10px var(--mono);fill:var(--bc);letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.link-g .ln{fill:none;stroke:var(--ink2);stroke-width:1.3;marker-end:url(#larrow)}
.link-g.cross .ln{stroke-dasharray:4 3}
.link-g.candidate .ln{stroke-dasharray:7 3}
.link-g .hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.link-g .llabel{font:600 10px var(--mono);fill:var(--ink2);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.link-g.cross .llabel{font-weight:500}
.link-g.ghost .ln{stroke:var(--ovc);opacity:.5} .link-g.added .ln{stroke:var(--ovc);stroke-width:1.8}
.link-g.open-in-dock .ln{stroke:var(--accent);stroke-width:2}
.link-g.inscope .ln{stroke:var(--accent);stroke-width:2.4}
.link-g .att rect{fill:var(--surface2);stroke:var(--line);rx:8} .link-g .att text{font:600 9.5px var(--mono);fill:var(--ink2);text-anchor:middle;dominant-baseline:central}
.arm-t{fill:var(--lit);opacity:.9}

/* context card */
.ctx{position:absolute;width:200px;min-height:124px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 9px 8px;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:opacity .15s;font-size:12px}
.ctx.ext{border-style:dashed;background:var(--surface2)}
.ctx.bbm{background:repeating-linear-gradient(-45deg,transparent 0 6px,var(--mud) 6px 7px),var(--surface)}
.ctx.candidate{border-color:transparent;box-shadow:0 0 0 1px color-mix(in srgb,var(--line) 55%,transparent),0 1px 2px rgba(0,0,0,.05)}
.ctx.focused{background:var(--lit);border-color:var(--lit-line)}
.ctx.open-in-dock{box-shadow:inset 0 0 0 1px var(--accent),0 1px 2px rgba(0,0,0,.05)}
.ctx.dim{opacity:.22}
.ctx.inscope{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.ctx.ghost{border-style:dashed;opacity:.5;border-color:var(--ovc)}
.ctx.ov-added{box-shadow:0 0 0 2px var(--ovc)} .ctx.ov-changed{box-shadow:0 0 0 2px color-mix(in srgb,var(--ovc) 55%,transparent)}
.ctx[data-col]{border-left-width:4px;border-left-color:var(--cc)}
body.arming .ctx,body.arming .el{cursor:crosshair} body.arming .ctx:hover,body.arming .el:hover{outline:2px solid var(--lit-line)}
:is(.ctx,.node,.ndock) .hd{display:flex;align-items:center;gap:6px;cursor:pointer;min-height:18px}
:is(.ctx,.node,.ndock) .nn{font-weight:800;font-size:13px;letter-spacing:-.01em;line-height:1.2}
:is(.ctx,.node,.ndock,.dk-h) .bb{font:700 9px var(--mono);letter-spacing:.06em;color:var(--ink2);border:1px solid var(--ink3);border-radius:3px;padding:0 3px;flex:none}
:is(.ctx,.node) .st{margin-left:auto;display:flex;align-items:center;gap:5px;flex:none}
:is(.ctx,.node) .q{font:700 10px var(--mono);color:var(--crit);border:1px solid var(--crit);border-radius:999px;width:15px;height:15px;display:grid;place-items:center;line-height:1}
:is(.ctx,.node,.ndock) .cand{font:600 9px var(--mono);letter-spacing:.06em;color:var(--ink3);text-transform:uppercase}
:is(.ctx,.node,.ndock) .ext-w{font:600 9px var(--mono);letter-spacing:.06em;color:var(--ink3);text-transform:uppercase;border:1px dashed var(--ink3);border-radius:3px;padding:0 3px}
:is(.ctx,.node,.ndock) .row{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:5px}
/* the thumbnail: the inside as a miniature graph — dots by kind, rings by home, hairlines for links, stubs for links out */
.ctx .thumb{display:block;width:100%;height:92px;margin-top:6px;border:1px solid var(--line2);border-radius:6px;background:var(--surface2);cursor:zoom-in;overflow:visible;transition:border-color .12s}
.ctx .thumb:hover{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
.ctx.ghost .thumb{display:none}
.thumb .lk{stroke:var(--ink3);stroke-width:1;fill:none;opacity:.8}
.thumb .lk.out{stroke-dasharray:2 2;opacity:.55}
.thumb .lk.ghost{stroke:var(--ovc);stroke-dasharray:2 2}
.thumb .nd .dot{stroke-width:1.8}
.thumb .nd.candidate .dot{fill-opacity:.5}
.thumb .nd.ghost .dot{fill:none!important;stroke:var(--ovc)!important;stroke-dasharray:2 1.5}
.thumb .nd.dim{opacity:.2}
.thumb .nd .ovr{fill:none;stroke:var(--ovc);stroke-width:1.5}
.thumb .nd .ovr2{fill:var(--ovc)}
.thumb .nd .qm{font:700 8.5px var(--mono);fill:var(--crit)}
.thumb .nd.open-in-dock .dot,.thumb .nd.inscope .dot{stroke:var(--accent)!important;stroke-width:3}
.thumb .cap{font:500 8.5px var(--mono);fill:var(--ink3);text-anchor:end}
.ctx .cnt{font:10.5px var(--mono);color:var(--ink2);margin-top:5px;line-height:1.4}
.ctx .cnt b{color:var(--ink);font-weight:600}
.ctx .cnt .rm{color:var(--ovc);text-decoration:line-through;opacity:.7}
.ctx .cnt .ad{color:var(--ovc)}
.ctx .cnt .rmc{color:var(--ovc);opacity:.7}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.sdot.settled{background:var(--ok)} .sdot.candidate{background:transparent;border:2px solid var(--warn);width:9px;height:9px} .sdot.open{background:var(--crit)}
.home{display:inline-flex;align-items:center;gap:5px;font:600 10.5px var(--mono);padding:1px 6px 1px 5px;border-radius:6px;border:1px solid var(--line);color:var(--ink);background:var(--surface);cursor:pointer;white-space:nowrap}
.home::before,.ring{content:"";width:8px;height:8px;border:2px solid var(--hc,var(--ink3));border-radius:50%;display:inline-block;box-sizing:border-box;flex:none}
.home.none::before{display:none}
.repo .ring{width:9px;height:9px} .dk-h h2 .ring{width:12px;height:12px;margin-right:6px;vertical-align:baseline}
.home.inh{border-style:dotted;color:var(--ink2)}
.home.none{border-style:dashed;color:var(--crit);border-color:var(--crit)}
.home .old{text-decoration:line-through;color:var(--ovc);font-weight:500;margin-right:2px}
.home.open-in-dock{border-color:var(--accent);background:var(--accent-soft)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok)}
.dot.satisfied{background:var(--ok)} .dot.stale{background:var(--warn)} .dot.not-satisfied{background:var(--crit)}
.dot.unjudged{background:transparent;border:2px solid var(--ink3);width:9px;height:9px;box-sizing:border-box}
.dot.not-applicable,.dot.none{background:transparent;border:1px dashed var(--ink3);width:9px;height:9px;box-sizing:border-box}
.chip{display:inline-flex;align-items:center;gap:4px;font:10.5px var(--mono);padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--surface2);cursor:pointer;white-space:nowrap}
.chip.att{color:var(--ink);font-weight:600}
.chip.att.none{opacity:.5;font-weight:500;cursor:default}
.chip.open-in-dock,.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tag{font:10px var(--mono);border:1px solid var(--line2);border-radius:3px;padding:0 4px;color:var(--ink2);background:var(--surface2);white-space:nowrap}
.tag.fc{border-color:var(--cc);color:var(--cc)}
.tag.ov{border-color:var(--ovc);color:var(--ovc)}
.marks{display:inline-flex;flex-wrap:wrap;gap:4px}
.mark{display:inline-flex;align-items:center;gap:4px;font:600 10.5px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface2);cursor:pointer;white-space:nowrap}
.mark.approve{color:var(--accent);border-color:var(--accent)} .mark.decide{color:var(--warn);border-color:var(--warn)} .mark.answer{color:var(--crit);border-color:var(--crit)}
.mark.deferred{color:var(--ink3);border-style:dashed}
.mark.focused{background:var(--lit)}
.ovm{display:inline-grid;place-items:center;font:700 10px var(--mono);color:#fff;background:var(--ovc);border-radius:3px;min-width:15px;height:15px;padding:0 3px;cursor:default}
.ovm.moved{background:transparent;color:var(--ovc);border:1px solid var(--ovc)}
.ctx .lang{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line2);font-size:11px;color:var(--ink2)}
.ctx .lang dt{font:600 11px var(--mono);color:var(--ink);display:inline} .ctx .lang dd{display:inline;margin:0 0 0 4px} .ctx .lang div{margin-bottom:2px}
.ctx .grp{margin-top:8px;display:flex;align-items:baseline;gap:6px;font:700 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--line2);padding-bottom:2px}
.ctx .grp .ex{letter-spacing:0;text-transform:none;font-weight:500;color:var(--ink3)}
.el{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:3px 2px;border-radius:4px;font-size:11.5px;cursor:pointer;position:relative}
.el:hover{background:var(--surface2)}
.el .en{font-weight:600;white-space:nowrap}
.el.candidate .en{color:var(--ink2)} .el.candidate{box-shadow:inset 2px 0 0 color-mix(in srgb,var(--warn) 55%,transparent)}
.el.open .en::after{content:" ?";color:var(--crit);font-weight:800}
.el.ghost{opacity:.5} .el.ghost .en{text-decoration:line-through;color:var(--ovc)}
.el.ov-added{box-shadow:inset 2px 0 0 var(--ovc)}
.el.open-in-dock{background:var(--accent-soft)}
.el.inscope{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.el.dim{opacity:.25}
.el .r{margin-left:auto;display:inline-flex;gap:4px;align-items:center;flex:none}
.el .qq{flex-basis:100%;font-style:italic;color:var(--ink2);font-size:11px;padding:1px 0 2px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.el .qq .btn{margin-left:auto}
.ctx .foot{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line2);display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink3);flex-wrap:wrap}

/* the drilled level: a context's inside at full size */
.node{position:absolute;width:176px;border:1px solid var(--line);border-left:4px solid var(--kc,var(--ink3));border-radius:8px;background:var(--surface);padding:5px 8px 7px;font-size:12px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:opacity .15s}
.node .kn{display:flex;align-items:center;gap:5px;font:700 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--kc,var(--ink3))}
.node .kn .capb{font-weight:600;letter-spacing:0;text-transform:none;border:1px solid currentColor;border-radius:3px;padding:0 3px}
.node .nm{font-weight:800;font-size:12.5px;letter-spacing:-.01em;line-height:1.2}
.node.candidate{border-color:transparent;border-left-color:var(--kc);box-shadow:0 0 0 1px color-mix(in srgb,var(--line) 55%,transparent)}
.node.candidate .nm{color:var(--ink2)}
.node.ghost{border-style:dashed;opacity:.55;border-left-style:dashed}
.node.ghost .nm{text-decoration:line-through;color:var(--ovc)}
.node.ov-added{box-shadow:0 0 0 2px var(--ovc)} .node.ov-changed{box-shadow:0 0 0 2px color-mix(in srgb,var(--ovc) 55%,transparent)}
.node.dim{opacity:.22}
.node.focused{background:var(--lit);border-color:var(--lit-line)}
.node.open-in-dock{box-shadow:inset 0 0 0 1px var(--accent),0 1px 2px rgba(0,0,0,.05)}
.node.inscope{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.node .qq{margin-top:5px;font-style:italic;color:var(--ink2);font-size:11px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.node .qq .btn{margin-left:auto}
body.arming .node:hover,body.arming .ndock:hover{outline:2px solid var(--lit-line);cursor:crosshair}
.ndock{position:absolute;border:1px dashed var(--ink3);border-radius:8px;background:var(--surface2);padding:6px 8px 7px;font-size:11.5px;cursor:pointer;transition:opacity .15s}
.ndock.ext{border-style:dashed;border-width:2px;border-color:var(--line)}
.ndock.candidate{border-color:var(--line)}
.ndock.ghost{opacity:.55;border-color:var(--ovc)}
.ndock.open-in-dock{box-shadow:inset 0 0 0 1px var(--accent)}
.ndock.inscope{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.ndock.ov-changed{box-shadow:0 0 0 2px color-mix(in srgb,var(--ovc) 55%,transparent)} .ndock.ov-added{box-shadow:0 0 0 2px var(--ovc)}
.ndock .nn{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12.5px}
.ndock .nn:hover{color:var(--accent)}
.ndock .pat{font:600 10px var(--mono);color:var(--ink2);margin-top:3px} .ndock .pat:hover{color:var(--accent)}
.ndock .side{font:10.5px var(--mono);color:var(--ink3);margin-top:2px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.ndock .udc{font:700 9px var(--mono);color:var(--ink);border:1px solid var(--ink3);border-radius:50%;width:15px;height:15px;display:inline-grid;place-items:center;background:var(--surface);flex:none}
.ndock .go{margin-top:6px;font:600 11px var(--sans);color:var(--accent);display:block}
.ndock .go:hover{text-decoration:underline}
.ndock .chip.xc{font-weight:600} .ndock .chip.xc.none{opacity:.55}
.crumb{position:absolute;left:12px;top:10px;z-index:7;display:flex;gap:6px;align-items:center;font:600 12.5px var(--sans);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.crumb[hidden]{display:none}
.crumb button{color:var(--accent);font-weight:800} .crumb button:hover{text-decoration:underline}
.crumb .sep{color:var(--ink3)} .crumb b{font-weight:800}
.crumb .meta{font:11px var(--mono);color:var(--ink3);margin-left:6px;font-weight:500}
.klegend{position:absolute;left:12px;bottom:10px;z-index:7;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:10.5px var(--mono);color:var(--ink2);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line2);border-radius:8px;padding:4px 8px;max-width:calc(100% - 24px)}
.klegend .sw{display:inline-flex;align-items:center;gap:4px;white-space:nowrap} .klegend .sw i{width:9px;height:9px;display:inline-block;box-sizing:border-box}
.klegend .sep{width:1px;height:12px;background:var(--line)}
body.docked .klegend{max-width:calc(100% - var(--dock) - 24px)}
/* the crossing panel: slides out at an edge's midpoint */
.epanel{position:absolute;z-index:7;width:312px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px 8px;font-size:11.5px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .15s,transform .15s}
.epanel.show{opacity:1;transform:none;pointer-events:auto}
.epanel .eh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;margin-bottom:4px}
.epanel .es{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:6px 0 3px}
.epanel .xl{display:grid;grid-template-columns:1fr auto 1fr;gap:2px 6px;align-items:center;padding:3px 4px;border-radius:4px;cursor:pointer}
.epanel .xl:hover{background:var(--surface2)}
.epanel .xl .e b{display:block;font-weight:700;font-size:11.5px} .epanel .xl .e small{display:block;font:10px var(--mono);color:var(--ink3)}
.epanel .xl .e:last-child{text-align:right}
.epanel .xl .k{font:600 10px var(--mono);color:var(--ink2);text-align:center;white-space:nowrap} .epanel .xl .k i{color:var(--ovc);font-style:normal}
.epanel .xl.ghost{opacity:.6} .epanel .xl.ghost b{text-decoration:line-through;color:var(--ovc)}
.epanel .cl{display:flex;align-items:center;gap:6px;font:11px var(--mono);padding:2px 4px;border-radius:4px;cursor:pointer} .epanel .cl:hover{background:var(--surface2)} .epanel .cl .cv{color:var(--ink3)}
.epanel .none{color:var(--ink3);font-style:italic;padding:2px 4px}
.epanel .ef{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.repo.proposed{border-style:dashed;color:var(--ink2)}

/* stacked list under 760 */
.list{display:none}
.list .ctx{position:static;width:auto;margin-bottom:8px}
.list .crumb.static{position:static;margin-bottom:8px;display:inline-flex}
.list .rels{font:11px var(--mono);color:var(--ink2);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line2)}
.list .rels div{padding:1px 0}

/* arming bar */
.armbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:7;background:var(--lit);border:1px solid var(--lit-line);border-radius:8px;padding:7px 12px;font-size:12.5px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.armbar b{font-family:var(--mono)}
.armbar[hidden]{display:none}

/* ---------- dock ---------- */
.scrim{position:absolute;inset:0;display:none;z-index:8}
body.docked .scrim{display:block}
.dock{position:absolute;top:0;right:0;bottom:0;width:min(var(--dock),calc(100% - 200px));background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:9;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .2s cubic-bezier(.2,.7,.3,1)}
body.docked .dock{transform:none}
.dk-h{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.dk-h .row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3)}
.dk-h .row .kind{font-weight:700;color:var(--ink2)}
.dk-h .row .id{font:500 11px var(--mono)}
.dk-h .nav{margin-left:auto;display:flex;align-items:center;gap:6px}
.dk-h .x{font-size:18px;line-height:1;color:var(--ink3);padding:0 4px}
.dk-h h2{font-size:18px;font-weight:800;letter-spacing:-.01em;margin-top:6px}
.dk-h .tail{color:var(--ink2);font-size:12.5px;margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dk-h.dk-ctx{border-top:3px solid var(--ink2)}
.dk-h.dk-ctx.bbm{background:repeating-linear-gradient(-45deg,transparent 0 6px,var(--mud) 6px 7px),var(--surface)}
.dk-h.dk-el{box-shadow:inset 4px 0 0 var(--ink3)}
.dk-h.dk-rel{border-top:3px dashed var(--ink3)}
.dk-h.dk-claim{background:var(--surface2)} .dk-h.dk-claim h2{font-family:var(--mono);font-size:15px;letter-spacing:0;word-break:break-all}
.dk-h.dk-repo{background:var(--surface2)} .dk-h.dk-repo h2{font-family:var(--mono);font-size:16px}
.dk-b{flex:1;overflow:auto;padding:6px 16px 20px}
.dk-f{border-top:1px solid var(--line);padding:10px 16px 12px;background:var(--surface2)}
.dk-f .fl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:6px}
.dk-f .acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sec{padding:12px 0;border-bottom:1px solid var(--line2)}
.sec:last-child{border-bottom:0}
.sec h3{display:flex;align-items:baseline;gap:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:8px}
.sec h3 .r{letter-spacing:0;text-transform:none;font-weight:500;font-size:11.5px;margin-left:auto}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0;font-size:12.5px}
.kv dt{font:500 11.5px var(--mono);color:var(--ink3)} .kv dd{margin:0}
.ref{font:500 11.5px var(--mono);color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 5px;text-decoration:none;opacity:.8}
.ref:hover{opacity:1}
.stx{font:600 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--ink2)}
.stx.settled{color:var(--ok);border-color:var(--ok)} .stx.candidate{color:var(--warn);border-color:var(--warn)} .stx.open{color:var(--crit);border-color:var(--crit)}
.qbox{border:1px solid var(--crit);border-radius:8px;padding:8px 10px;background:color-mix(in srgb,var(--crit) 6%,transparent);margin-top:6px;font-size:13px}
.qbox i{display:block;margin-bottom:6px}
.qbox .cap{font:11.5px var(--mono);color:var(--ink2)} .qbox .cap b{color:var(--ok)}
.scope{font:12px var(--mono);color:var(--ink2);padding:6px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--surface2);margin-top:6px;line-height:1.5}
.scope b{color:var(--ink);font-weight:600}
.scope .from{color:var(--ink3)}
.vd{font:600 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--ink3);white-space:nowrap}
.vd.satisfied{color:var(--ok);border-color:var(--ok)} .vd.not-satisfied{color:var(--crit);border-color:var(--crit)} .vd.stale{color:var(--warn);border-color:var(--warn)} .vd.unjudged{color:var(--ink2)} .vd.not-applicable{color:var(--ink3);border-style:dashed}
.claims{display:flex;flex-direction:column}
.claim{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2);font-size:12.5px;cursor:pointer}
.claim:hover{background:var(--surface2)}
.claim .cn{font:600 12px var(--mono);word-break:break-all} .claim .cv{font:11px var(--mono);color:var(--ink3);margin-left:6px;font-weight:400}
.claim .ce{grid-column:1/-1;color:var(--ink3);font-size:11.5px}
.claim .ce b{color:var(--ink2);font-weight:500}
.claim .vds{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.rows{display:flex;flex-direction:column;gap:2px}
.rowi{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line2)}
.rowi .nm{font-weight:600} .rowi .m{font:11px var(--mono);color:var(--ink3)}
.rowi .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.rowi a.go{font:11px var(--mono);color:var(--accent);text-decoration:none;border-bottom:1px dotted}
.kc{display:flex;flex-wrap:wrap;gap:4px}
.derived{font:11px var(--mono);color:var(--ink3);margin-top:6px}
.derived b{color:var(--warn);font-weight:600}
.dtext{font-size:13.5px;line-height:1.55;max-width:62ch}
.dtext b{font-weight:700}
.ends{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:12.5px;margin-top:4px}
.ends .e{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface2)}
.ends .e .k{font:700 10px var(--mono);letter-spacing:.06em;color:var(--ink3);text-transform:uppercase;display:flex;gap:6px;align-items:center}
.ends .e .n{font-weight:700} .ends .e .bds{display:flex;gap:4px;margin-top:3px}
.ends .arr{font:11px var(--mono);color:var(--ink3);text-align:center}
.bdg{font:700 9px var(--mono);border:1px solid var(--ink3);border-radius:2px;padding:0 3px;color:var(--ink2)} .bdg.acl{color:var(--warn);border-color:var(--warn)}
/* rail card inline (rail-and-board's decision card) */
.card{position:relative;border:1px solid var(--line);border-left-width:3px;border-radius:6px;background:var(--surface);padding:8px 10px 8px 12px;margin-bottom:6px}
.card.g-approve{border-left-color:var(--accent)} .card.g-decide{border-left-color:var(--warn)} .card.g-answer{border-left-color:var(--crit)}
.card.inflight{opacity:.6} .card.done{opacity:.75;border-style:dashed}
.card .ch{display:flex;align-items:center;gap:7px;font-size:11px;margin-bottom:3px}
.card .n{font:700 13px var(--mono);color:var(--ink)}
.card .kind{color:var(--ink3);font-weight:600}
.card .ph{margin-left:auto;font:500 10.5px var(--mono);color:var(--ink3);border:1px solid var(--line2);border-radius:3px;padding:0 5px;white-space:nowrap}
.card .ph.plan{color:var(--accent);border-color:var(--accent)}
.card .title{font-size:13.5px;font-weight:700;line-height:1.3}
.card .tail{color:var(--ink2);font-size:12px;margin-top:2px}
.card .qq{font-style:italic;color:var(--ink);margin-top:4px;font-size:13px}
.card .acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.card .acts .hint{margin-left:auto;font:11px var(--mono);color:var(--ink3)}
.card .flight{display:none;font:11.5px var(--mono);color:var(--ink3);margin-top:6px;align-items:center;gap:6px}
.card.inflight .flight{display:flex}
.card .sentl{font:11.5px var(--mono);color:var(--ok);margin-top:6px}
.card .field{display:flex;gap:6px;margin-top:6px;align-items:center} .card .field input{flex:1;padding:3px 6px;font-size:12px}
.spin{width:10px;height:10px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.stub{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin-top:8px;background:color-mix(in srgb,var(--accent-soft) 50%,transparent)}
.stub .eyebrow{margin-bottom:6px}
/* changes list */
.chg{display:grid;grid-template-columns:64px 1fr;gap:4px 10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.chg .cls{font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ovc)}
.chg .cls.removed{opacity:.7}
.chg .what a{font-weight:600;color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--ink3)}
.chg .what .t{font:11px var(--mono);color:var(--ink3);margin-left:6px}
.chg .flds{grid-column:2;font:11px var(--mono);color:var(--ink2)}
.chg .flds s{color:var(--ovc)}
/* add repo form */
.addrepo .grid{display:flex;flex-direction:column;gap:4px;margin:4px 0 8px}
.addrepo label{display:inline-flex;align-items:center;gap:6px;font:11.5px var(--mono);cursor:pointer}
.addrepo input[type=checkbox]{margin:0;accent-color:var(--ok)}
.addrepo input[type=text]{width:100%;font:12px var(--mono)}
.addrepo .found{font-size:12px;color:var(--ink2);margin:6px 0} .addrepo .found b{color:var(--ok)}
.fails div{font:11.5px var(--mono);color:var(--crit);padding:3px 6px;border-left:2px solid var(--crit);margin-bottom:3px}
.fails div.ok{color:var(--ok);border-left-color:var(--ok)}
/* log, toasts */
.log{position:fixed;right:14px;top:calc(var(--top) + 6px);width:min(440px,calc(100vw - 28px));max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:10px 12px;z-index:20}
.log h3{font-size:12px;display:flex;gap:8px;align-items:baseline} .log h3 span{font-weight:500;color:var(--ink3);font-size:11.5px}
.log ol{list-style:none;margin:8px 0 0;padding:0}
.log li{display:flex;gap:10px;font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--line2)} .log li time{font:11px var(--mono);color:var(--ink3)} .log li span{font-family:var(--mono)}
.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:30;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);font:12.5px var(--mono);padding:7px 12px;border-radius:6px;box-shadow:var(--shadow);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(8px);opacity:0}}

@media (max-width:759px){
  :root{--controls:auto}
  .top .keys{display:none}
  .board{flex:none;height:auto;min-height:calc(100vh - var(--top) - var(--strip) - 80px);overflow:visible}
  .wrap{display:none}
  .list{display:block;padding:10px}
  body{overflow:auto}
  .dock{width:100%;position:fixed;top:0;bottom:0;left:0;right:0}
  .scrim{position:fixed}
  .ctx{width:auto}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

<!-- ------------------------------------------------------------------
     The organization vocabulary (books/vocabulary.yaml), as schema.yaml's
     organization_vocabulary_example, with runtime closed for this mockup.
     ------------------------------------------------------------------ -->
<script type="text/yaml" id="y-vocab">
schema: flywheel-map/1
extends: flywheel-map/1
element_kinds:
  store:
    description: A service whose job is to keep state — a database, a cache, a bucket.
    extends: service
  topic:
    description: A named channel events travel on. Others depend on it, so it counts as a capability.
    extends: contract
    capability: true
  ui:
    description: A user-facing surface.
    extends: service
link_kinds:
  persists-in:
    description: The aggregate's state lives in that store.
    from: [aggregate]
    to: [store]
facets:
  lane:
    description: Which side of the house runs it.
    values: [control, data]
  runtime:
    description: Where the element runs.
    values: [deployed, local]
  tier:
    description: How much of the business stops when it stops.
    values: [1, 2, 3]
</script>

<!-- ------------------------------------------------------------------
     target.yaml — the map of what the books say. The first three contexts,
     their five elements, two relationships and one link are example.yaml
     verbatim; everything after them is sample.
     ------------------------------------------------------------------ -->
<script type="text/yaml" id="y-target">
schema: flywheel-map/1
vocabulary: books/vocabulary.yaml

contexts:
  - id: ordering
    name: Ordering
    ref: ordering/boundary
    status: settled
    home: orders-svc
    tags: ["lane:control"]
    language:
      - { term: order, means: "A customer's request to buy, from placed to fulfilled or cancelled." }
      - { term: line, means: "One product and quantity on an order." }

  - id: billing
    name: Billing
    ref: billing/boundary
    status: settled
    home: ledger-svc
    tags: ["lane:data"]
    language:
      - { term: invoice, means: "The amount owed for one order, issued once and never edited." }

  - id: payments-gateway
    name: Payments Gateway
    status: settled
    ref: billing/gateway
    external: true                   # a third party; homes nothing
    tags: ["vendor:stripe"]

  - id: catalog
    name: Catalog
    ref: catalog/boundary
    status: settled
    home: platform-core
    tags: ["lane:control"]
    language:
      - { term: product, means: "A thing the shop sells, with a price in one currency." }
      - { term: summary, means: "The subset of a product every other context may read." }

  - id: identity
    name: Identity
    ref: identity/boundary
    status: settled
    home: platform-core
    tags: ["lane:control"]

  - id: identity-provider
    name: Identity Provider
    ref: identity/provider
    status: settled
    external: true
    tags: ["vendor:okta"]

  - id: notifications
    name: Notifications
    ref: notifications/boundary
    status: candidate                # its chapter is on an open intent's line
    tags: ["lane:control"]           # no home default: each element names its own

  - id: data-product
    name: Data Product
    ref: data-product/boundary
    status: settled
    home: pipeline
    big_ball_of_mud: true
    tags: ["lane:data"]

  - id: portal
    name: Portal
    ref: portal/boundary
    status: settled
    home: platform-core
    tags: ["lane:control"]

elements:
  # --- ordering, homed in orders-svc by the context default -----------
  - id: ordering.order
    name: Order
    context: ordering
    kind: aggregate
    ref: ordering/order-lifecycle
    status: settled
    tags: ["lane:control"]

  - id: ordering.order-placed
    name: OrderPlaced
    context: ordering
    kind: domain-event
    ref: ordering/order-lifecycle
    status: settled

  - id: ordering.order-cancelled
    name: OrderCancelled
    context: ordering
    kind: domain-event
    ref: ordering/cancellation
    status: candidate

  - id: ordering.orders-api
    name: Orders API
    context: ordering
    kind: contract                   # capability: true in the shipped vocabulary
    ref: ordering/api
    status: settled
    tags: ["tier:1", "runtime:deployed"]

  - id: ordering.orders-worker
    name: Orders worker
    context: ordering
    kind: service
    ref: ordering/api
    status: settled
    tags: ["lane:control", "runtime:deployed"]

  - id: ordering.order-store
    name: Order store
    context: ordering
    kind: store
    ref: ordering/persistence
    status: settled
    tags: ["lane:control", "runtime:deployed", "tier:1"]

  # --- billing, split across two repositories -------------------------
  - id: billing.invoice
    name: Invoice
    context: billing
    kind: aggregate
    ref: billing/invoicing
    status: settled
    tags: ["lane:data"]

  - id: billing.invoice-issued
    name: InvoiceIssued
    context: billing
    kind: domain-event
    ref: billing/invoicing
    status: settled

  - id: billing.invoice-worker
    name: Invoice worker
    context: billing
    kind: service
    home: ledger-svc                 # same as the context default; stated for the example
    ref: billing/invoicing
    status: candidate                # its chapter is on an open intent's line
    tags: ["lane:data", "runtime:deployed"]

  - id: billing.invoice-store
    name: Invoice store
    context: billing
    kind: store                      # organization kind, extends service
    home: ledger-db                  # a second repository homed by this context
    status: open
    question: Is the invoice store its own repository, or a schema inside ledger-svc?
    tags: ["lane:data", "tier:2"]

  - id: billing.ledger-api
    name: Ledger API
    context: billing
    kind: contract
    ref: billing/api
    status: settled
    tags: ["runtime:deployed"]

  - id: billing.invoice-events
    name: Invoice events
    context: billing
    kind: topic                      # extends contract; counts as a capability
    ref: billing/events
    status: candidate
    tags: ["lane:data", "runtime:deployed"]

  # --- payments gateway: external, homes nothing ----------------------
  - id: payments-gateway.charges-api
    name: Charges API
    context: payments-gateway
    kind: contract
    ref: billing/gateway
    status: settled

  - id: payments-gateway.charge-settled
    name: ChargeSettled
    context: payments-gateway
    kind: domain-event
    ref: billing/gateway
    status: settled

  - id: payments-gateway.webhooks
    name: Webhooks
    context: payments-gateway
    kind: contract
    ref: billing/gateway
    status: settled

  # --- catalog, in the platform-core monolith -------------------------
  - id: catalog.product
    name: Product
    context: catalog
    kind: aggregate
    ref: catalog/product
    status: settled

  - id: catalog.product-summary
    name: Product summary
    context: catalog
    kind: contract                   # the shared kernel with the portal
    ref: catalog/summary
    status: settled
    tags: ["tier:1"]

  - id: catalog.catalog-api
    name: Catalog API
    context: catalog
    kind: contract
    ref: catalog/api
    status: settled
    tags: ["runtime:deployed"]

  - id: catalog.price-changed
    name: PriceChanged
    context: catalog
    kind: domain-event
    ref: catalog/pricing
    status: settled

  - id: catalog.catalog-store
    name: Catalog store
    context: catalog
    kind: store
    ref: catalog/persistence
    status: settled
    tags: ["runtime:deployed", "tier:2"]

  - id: catalog.catalog-service
    name: Catalog service
    context: catalog
    kind: service
    ref: catalog/api
    status: settled
    tags: ["lane:control", "runtime:deployed"]

  # --- identity -------------------------------------------------------
  - id: identity.subject
    name: Subject
    context: identity
    kind: aggregate
    ref: identity/subjects
    status: settled

  - id: identity.token-api
    name: Token API
    context: identity
    kind: contract
    ref: identity/tokens
    status: settled
    tags: ["tier:1", "runtime:deployed"]

  - id: identity.session-service
    name: Session service
    context: identity
    kind: service
    ref: identity/sessions
    status: settled
    tags: ["runtime:deployed"]

  - id: identity.subject-store
    name: Subject store
    context: identity
    kind: store
    ref: identity/subjects
    status: settled
    tags: ["runtime:deployed", "tier:1"]

  - id: identity-provider.oidc
    name: OIDC
    context: identity-provider
    kind: contract
    ref: identity/provider
    status: settled

  - id: identity-provider.directory
    name: SCIM directory
    context: identity-provider
    kind: contract
    ref: identity/provider
    status: settled

  # --- notifications: no context default, elements name their homes ---
  - id: notifications.notifier
    name: Notifier
    context: notifications
    kind: service
    home: orders-svc
    ref: notifications/delivery
    status: candidate
    tags: ["lane:control", "runtime:deployed"]

  - id: notifications.email-template
    name: Email template
    context: notifications
    kind: aggregate
    home: orders-svc
    ref: notifications/templates
    status: candidate

  - id: notifications.notification-sent
    name: NotificationSent
    context: notifications
    kind: domain-event
    home: orders-svc
    ref: notifications/delivery
    status: candidate

  - id: notifications.push-relay
    name: Push relay
    context: notifications
    kind: service                    # no home yet: the check fails it
    status: open
    question: Which repository builds the push relay — orders-svc, or a repository of its own?
    tags: ["runtime:deployed"]

  - id: notifications.template-store
    name: Template store
    context: notifications
    kind: store                      # no home yet: the check fails it
    status: open
    question: Do templates live in a store of their own, or in orders-svc's schema?
    tags: ["tier:3"]

  # --- data product: a big ball of mud in the pipeline repository -----
  - id: data-product.ingest
    name: Ingest
    context: data-product
    kind: service
    ref: data-product/ingest
    status: settled
    tags: ["lane:data", "runtime:deployed"]

  - id: data-product.warehouse
    name: Warehouse
    context: data-product
    kind: store
    ref: data-product/warehouse
    status: settled
    tags: ["lane:data", "runtime:deployed", "tier:2"]

  - id: data-product.reports-api
    name: Reports API
    context: data-product
    kind: contract
    ref: data-product/reports
    status: settled
    tags: ["runtime:deployed"]

  - id: data-product.revenue-fact
    name: Revenue fact
    context: data-product
    kind: aggregate
    ref: data-product/facts
    status: settled
    tags: ["lane:data"]

  - id: data-product.nightly-rollup
    name: Nightly rollup
    context: data-product
    kind: service

  - id: data-product.events-topic
    name: Events topic
    context: data-product
    kind: topic
    ref: data-product/ingest
    status: settled
    tags: ["lane:data", "runtime:deployed"]

  # --- portal ---------------------------------------------------------
  - id: portal.web
    name: Portal web
    context: portal
    kind: ui
    ref: portal/web
    status: settled
    tags: ["runtime:deployed", "tier:1"]

  - id: portal.bff
    name: Portal BFF
    context: portal
    kind: service
    ref: portal/bff
    status: settled
    tags: ["runtime:deployed"]

  - id: portal.account-page
    name: Account page
    context: portal
    kind: ui
    ref: portal/account
    status: settled

  - id: portal.reports-view
    name: Reports view
    context: portal
    kind: ui
    ref: portal/reports
    status: candidate

relationships:
  - id: ordering-billing
    name: Ordering supplies Billing
    ref: ordering/boundary
    status: settled
    pattern: customer-supplier
    upstream: ordering
    downstream: billing
    upstream_offers: [open-host-service, published-language]
    downstream_guards: [anticorruption-layer]

  - id: billing-gateway

    status: settled
    pattern: conformist
    upstream: payments-gateway
    downstream: billing
    upstream_offers: [published-language]
    tags: ["vendor:stripe"]

  - id: catalog-ordering
    name: Catalog supplies Ordering
    ref: catalog/boundary
    status: settled
    pattern: customer-supplier
    upstream: catalog
    downstream: ordering
    upstream_offers: [open-host-service, published-language]

  - id: identity-provider-identity

    ref: identity/provider
    status: settled
    pattern: conformist
    upstream: identity-provider
    downstream: identity
    upstream_offers: [open-host-service]
    tags: ["vendor:okta"]

  - id: identity-portal
    name: Identity supplies the Portal
    ref: identity/boundary
    status: settled
    pattern: customer-supplier
    upstream: identity
    downstream: portal

  - id: ordering-portal

links:

  - id: orders-worker-uses-catalog-api

    status: settled
    kind: uses

  - id: orders-worker-implements-orders-api
    name: Orders worker implements the Orders API
    ref: ordering/api
    status: settled
    kind: implements
    from: ordering.orders-worker

  - id: order-persists-in-order-store
    name: Order persists in the Order store
    ref: ordering/persistence
    status: settled
    kind: persists-in

  - id: ingest-handles-invoice-issued

    ref: data-product/ingest
    status: settled
    kind: handles
    from: data-product.ingest
    to: billing.invoice-issued

  - id: invoice-worker-uses-charges-api
    name: Invoice worker uses the Charges API
    ref: billing/gateway
    status: settled
    kind: uses
    from: billing.invoice-worker
    to: payments-gateway.charges-api

  - id: session-service-uses-oidc
    name: Session service uses OIDC
    ref: identity/provider
    status: settled
    kind: uses
    from: identity.session-service
    to: identity-provider.oidc

  - id: portal-bff-uses-reports-api
    name: Portal BFF uses the Reports API
    ref: portal/reports
    status: candidate
    kind: uses
    from: portal.bff
    to: data-product.reports-api

  - id: portal-bff-uses-token-api
    name: Portal BFF uses the Token API
    ref: portal/bff
    status: settled
    kind: uses
    from: portal.bff
    to: identity.token-api

  # --- links inside one context: what a thumbnail and a drilled-in map draw ---
  - id: orders-worker-emits-order-placed
    name: Orders worker emits OrderPlaced
    ref: ordering/order-lifecycle
    status: settled
    kind: emits

  - id: invoice-persists-in-invoice-store

/* =====================================================================
   1. A YAML subset parser: block mappings and sequences, flow [..] and
   {..} on one line, quoted and plain scalars, comments. Enough to read
   schema.yaml's map and vocabulary documents.
   ===================================================================== */
function parseYAML(text){
  const raw = text.split('\n');
  const lines = [];
  raw.forEach(l => { const s = stripComment(l); if(s.trim()==='') return; lines.push({ind: s.match(/^ */)[0].length, t: s.trim()}); });
  let i = 0;
  function stripComment(l){ let q=null; for(let k=0;k<l.length;k++){ const c=l[k]; if(q){ if(c===q) q=null; continue; } if(c==='"'||c==="'") { q=c; continue; } if(c==='#' && (k===0 || /\s/.test(l[k-1]))) return l.slice(0,k); } return l; }
  function scalar(s){
    s = s.trim();
    if(s==='') return null;
    if(s[0]==='"' || s[0]==="'") return unquote(s);
    if(s[0]==='[' || s[0]==='{') return flow(s, 0)[0];
    if(s==='true') return true; if(s==='false') return false; if(s==='null'||s==='~') return null;
    if(/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
    return s;
  }
  function unquote(s){ const q=s[0]; let out='', k=1; for(;k<s.length;k++){ const c=s[k]; if(c==='\\' && q==='"'){ out+=s[++k]; continue; } if(c===q){ if(q==="'" && s[k+1]==="'"){ out+="'"; k++; continue; } break; } out+=c; } return [out, k+1]; }
  function flow(s, p){
    const open = s[p]; const close = open==='[' ? ']' : '}'; const arr = open==='['; const out = arr ? [] : {}; p++;
    for(;;){
      while(s[p]===' '||s[p]===',') p++;
      if(s[p]===close) return [out, p+1];
      let key = null;
      if(!arr){ const m = s.slice(p).match(/^([^:,\]}]+?)\s*:\s*/); key = m[1].trim(); p += m[0].length; }
      let val;
      if(s[p]==='"'||s[p]==="'"){ const [v,len] = unquote(s.slice(p)); val=v; p+=len; }
      else if(s[p]==='['||s[p]==='{'){ const [v,np] = flow(s,p); val=v; p=np; }
      else { let e=p; while(e<s.length && s[e]!==',' && s[e]!==close) e++; val = scalar(s.slice(p,e)); p=e; }
      if(arr) out.push(val); else out[key]=val;
    }
  }
  function block(ind){
    if(i>=lines.length) return null;
    return lines[i].t.startsWith('- ') || lines[i].t==='-' ? seq(ind) : map(ind);
  }
  function seq(ind){

      <section class="sec"><h3>contexts</h3><div class="kc">${dv.contexts.map(c => `<span class="chip" data-go="${esc(c)}">${esc(T.byId[c].name)}</span>`).join('')}</div></section>
