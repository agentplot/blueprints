      <section class="sec"><h3>homed elements <span class="r">${dv.elements.length}</span></h3><div class="rows">${dv.elements.map(e => `<div class="rowi"><span class="nm">${goLink(e.id, e.name)}</span><span class="m">${esc(kindLabel(e.kind))} · ${esc(e.context)}${e.home?'':' · by default'}</span></div>`).join('')}</div></section>`,
    foot:`<div class="fl">actions</div><div class="acts">${decisionsOn('repo:'+r).map(d => `<button class="btn sm" data-decopen="${d.n}">decision ${d.n}</button>`).join('')}<span class="derived" style="margin:0">a repository is never on the canvas: it is a chip</span></div>` + (decisionsOn('repo:'+r).length ? `<div class="stub"><div class="eyebrow">rail · baseline</div>${decisionsOn('repo:'+r).map(railCard).join('')}</div>` : '') };
}
function dockChanges(){
  const mk = markRev(); const cls = {added:'added',changed:'changed',moved:'moved',removed:'removed'};
  return { head:`<div class="dk-h"><div class="row"><span class="kind">changes</span><span class="tag">${S.overlay==='review'?'since last review':'current → target'}</span><span class="nav"><button class="x" data-close="1">×</button></span></div><h2 id="dk-title">${DIFF.length} difference${DIFF.length===1?'':'s'}</h2><div class="tail">${S.overlay==='review' ? `target @ ${esc(mk.rev)} (${esc(mk.at)}, reviewed) → target @ ${$('rev').textContent}` : 'the map of what is built → the map of what the books say'} · one engine, keyed on id</div></div>`,
    body:`<section class="sec">${DIFF.map(d => `<div class="chg"><span class="cls ${d.cls}" style="--ovc:${OVC()}">${cls[d.cls]}</span><span class="what">${goLink(d.id, d.obj.name||d.id)}<span class="t">${TYPE1[d.type]}${d.type==='elements'?' · '+esc(d.obj.context):''}${d.obj.ref?' · '+esc(d.obj.ref):''}</span></span>${d.fields?`<span class="flds">${d.fields.map(f => `${f}: <s>${esc(JSON.stringify(d.from[f]))}</s> → ${esc(JSON.stringify(d.obj[f]))}`).join(' · ')}</span>`:''}</div>`).join('')||'<div class="derived">nothing changed</div>'}</section>
      ${S.overlay==='review' ? `<section class="sec"><h3>history <span class="r">derived from the target's revisions, never stored</span></h3><div class="rows">${HISTORY.map(h => `<div class="rowi"><span class="m">${esc(h.rev)}</span><span class="nm" style="font-weight:500">${esc(h.at)}</span><span class="m">${esc(h.by)}</span><span class="r">${h.rev===S.mark?'<span class="tag" style="color:var(--ov2);border-color:var(--ov2)">mark</span>':''}</span></div>`).join('')}</div></section>` : ''}`,
    foot:`<div class="fl">actions</div><div class="acts">${S.overlay==='review' ? `<button class="btn sm pri" id="markrev2" ${S.mark===HISTORY[0].rev?'disabled':''}>mark reviewed · moves the mark to ${esc(HISTORY[0].rev)}</button>` : `<span class="derived" style="margin:0">a tag change is a change here and no change to any verdict</span>`}</div>` };
}
function dockCheck(){ const f = check(); return { head:`<div class="dk-h"><div class="row"><span class="kind">map check</span><span class="nav"><button class="x" data-close="1">×</button></span></div><h2 id="dk-title">${f.length?f.length+' failure'+(f.length===1?'':'s'):'green'}</h2><div class="tail">schema flywheel-map/1 · shipped + books/vocabulary.yaml · on every commit</div></div>`,
  body:`<section class="sec"><div class="fails">${f.map(x => `<div>${esc(x)}</div>`).join('')||'<div class="ok">every id unique · every home a manifest entry · every crossing explained</div>'}</div></section>`, foot:`<div class="fl">fix</div><div class="acts"><button class="btn sm" id="addrepo2">+ repository homes the unhomed</button></div>` }; }
function unhomed(){ return T.elements.filter(e => !T.byId[e.context].external && !effHome(T,e)); }
function dockAddRepo(){
  const f = S.addForm || (S.addForm = {name:'notify-svc', els:new Set(unhomed().map(e => e.id)), ctx:''});
  const h = wouldHome(f); const ctxNoHome = T.contexts.filter(c => !c.external && !c.home);
  return { head:`<div class="dk-h dk-repo"><div class="row"><span class="kind">add repository</span><span class="tag">a proposal, not a dictation (S72)</span><span class="nav"><button class="x" data-close="1">×</button></span></div><h2 id="dk-title">${esc(f.name||'…')}</h2><div class="tail">joins the fleet when the target map first homes something in it (202) · its ledger starts empty${f.note?` · <b>redo notes:</b> ${esc(f.note)}`:''}</div></div>`,
    body:`<section class="sec addrepo"><h3>name <span class="r">the manifest entry</span></h3><input type="text" id="ar-name" value="${esc(f.name)}" placeholder="repository name">
      <h3 style="margin-top:12px">homes these unhomed elements</h3><div class="grid">${unhomed().map(e => `<label><input type="checkbox" data-arel="${esc(e.id)}" ${f.els.has(e.id)?'checked':''}> ${esc(e.id)} <span class="tag">${esc(kindLabel(e.kind))}</span></label>`).join('')||'<span class="derived">no element is unhomed</span>'}</div>
      <h3>or becomes the default home of a context</h3><select id="ar-ctx"><option value="">— none —</option>${ctxNoHome.map(c => `<option value="${esc(c.id)}" ${f.ctx===c.id?'selected':''}>${esc(c.name)} (${elementsOf(c.id).filter(e => !e.home).length} elements without their own home)</option>`).join('')}</select>
      <div class="found">derives live · <b>${h.els.length}</b> homed · kinds <b>${h.kinds.join(', ')||'none'}</b> · capabilities <b>${h.caps.length?h.caps.join(', '):'none'}</b> <span class="derived" style="margin:0">— derived, never declared</span></div></section>
      <section class="sec"><h3>claims that fall into scope <span class="r">${h.claims.length} · the first planning's baseline (202)</span></h3>${claimRows(h.claims)}</section>`,
    foot:`<div class="fl">one response</div><div class="acts"><button class="btn sm pri" id="ar-add" ${(!f.name || (!f.els.size && !f.ctx))?'disabled':''}>propose ${esc(f.name||'repository')} · homes ${h.els.length}</button><span class="derived" style="margin:0">sends create-repository; a decision under approve; the yes creates it</span></div>` };
}
function renderDock(){
  const k = S.dock; if(!k){ return; }
  const [t, id] = [k.slice(0, k.indexOf(':')), k.slice(k.indexOf(':')+1)];
  let page = null;
  if(t==='ctx' && T.byId[id]) page = dockContext(T.byId[id]);
  else if(t==='el' && T.byId[id]) page = dockElement(T.byId[id]);
  else if(t==='rel' && T.byId[id]) page = dockRel(T.byId[id]);
  else if(t==='lk' && T.byId[id]) page = dockLink(T.byId[id]);
  else if(t==='claim') page = dockClaim(CLAIMS.find(c => c.id===id));
  else if(t==='repo') page = dockRepo(id);
  else if(t==='changes') page = dockChanges();
  else if(t==='check') page = dockCheck();
  else if(t==='addrepo') page = dockAddRepo();
  else if(t==='ghost'){ const d = DIFF.find(d => d.id===id); const o = d ? d.obj : null; page = o ? { head:`<div class="dk-h"><div class="row"><span class="kind">${TYPE1[d.type]} · removed</span><span class="id">${esc(id)}</span><span class="nav"><button class="x" data-close="1">×</button></span></div><h2 id="dk-title">${esc(o.name)}</h2><div class="tail">in ${S.overlay==='review'?'the map at the mark':'current'}, not in target · drawn ghosted</div></div>`, body:`<section class="sec"><dl class="kv">${Object.entries(o).filter(([k]) => k!=='name').map(([k,v]) => `<dt>${esc(k)}</dt><dd class="mono">${esc(typeof v==='object'?JSON.stringify(v):v)}</dd>`).join('')}</dl></section>`, foot:'' } : null; }
  if(!page){ closeDock(); return; }
  $('dk-h').innerHTML = page.head; $('dk-b').innerHTML = page.body; $('dk-f').innerHTML = page.foot; $('dk-f').hidden = !page.foot;
}
function goTo(id){ // open the dock for any id; the dock offers the drill
  const t = T.typeOf[id];
  if(t==='elements') S.dock = 'el:'+id; else if(t==='contexts') S.dock = 'ctx:'+id; else if(t==='relationships') S.dock = 'rel:'+id; else if(t==='links') S.dock = 'lk:'+id;
  else if(DIFF.find(d => d.id===id)) S.dock = 'ghost:'+id; else return;
  document.body.classList.add('docked'); rerender();
}

/* =====================================================================
   8. Drilling, events, keys, boot
   ===================================================================== */
function drill(id){ // the canvas becomes the context's inside; the whole map's camera is kept for the way back
  if(!T.byId[id] || T.typeOf[id]!=='contexts' || S.drill===id) return;
  hidePanel(true); if(!S.drill) S.cam = {left:$('wrap').scrollLeft, top:$('wrap').scrollTop};
  S.drill = id; S.focus = null; DL = DL_CACHE[id] || (DL_CACHE[id] = drillLayout(id));
  renderAll(); animateStage(); requestAnimationFrame(fit);
}
function undrill(){
  if(!S.drill) return; S.drill = null; DL = null; S.focus = null;
  renderAll(); animateStage(); requestAnimationFrame(() => { fit(); if(S.cam){ $('wrap').scrollTo({left:S.cam.left, top:S.cam.top}); S.cam = null; } });
}
function positionsNow(){ return S.drill ? DL.pos : L.pos; }
function invariantCheck(fn){ const before = {pos:JSON.stringify(positionsNow()), edges:JSON.stringify(EDGE_PATHS)}; fn(); const after = {pos:JSON.stringify(positionsNow()), edges:JSON.stringify(EDGE_PATHS)};
  let moved = 0, edges = 0; const a = JSON.parse(before.pos), b = JSON.parse(after.pos); Object.keys(b).forEach(k => { if(!a[k] || a[k].x!==b[k].x || a[k].y!==b[k].y) moved++; });
  const ea = JSON.parse(before.edges), eb = JSON.parse(after.edges); Object.keys(eb).forEach(k => { if(ea[k]!==eb[k]) edges++; });
  S.inv = {moved, edges, bad: moved||edges}; renderControls(); }
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-drill],[data-hd],[data-el],[data-rel],[data-lk],[data-att],[data-dec],[data-repo],[data-close],[data-go],[data-dockctx],[data-capture],[data-ans],[data-arm],[data-detach],[data-litclaim],[data-lit],[data-claim],[data-decopen],[data-mode],[data-ov],#changes,#markrev,#markrev2,#fitbtn,#addrepo,#addrepo2,#checkbtn,#ar-add,#disarm,#logbtn,#theme,.scrim,.ctx,.ndock,[data-ref]');
  if(!t) return;
  if(t.matches('[data-ref]')){ ev.preventDefault(); toast(`opens the book: ${t.getAttribute('href').slice(1)}`); return; }
  if(t.id==='theme'){ S.theme = S.theme==='system'?'dark':S.theme==='dark'?'light':'system'; document.documentElement.toggleAttribute('data-theme', S.theme!=='system'); if(S.theme!=='system') document.documentElement.setAttribute('data-theme', S.theme); t.textContent = S.theme; return; }
  if(t.id==='logbtn'){ $('log').hidden = !$('log').hidden; t.setAttribute('aria-expanded', String(!$('log').hidden)); return; }
  if(t.id==='fitbtn'){ fit(); return; }
  if(t.id==='disarm'){ disarm(); return; }
  if(t.matches('.scrim') || t.matches('[data-close]')){ closeDock(); return; }
  // arming: one click on any target attaches — a context, an element, an edge, a link, a neighbour dock's relationship
  if(S.arming){
    const target = ev.target.closest('[data-el],[data-rel],[data-lk],[data-hd],[data-dockrel],.ctx'); if(!target) return;
    const id = target.dataset.el || target.dataset.rel || target.dataset.lk || target.dataset.hd || target.dataset.dockrel || target.dataset.id; if(!id || !T.byId[id]) return;
    const claim = S.arming; attach(claim, id); setTimeout(() => { S.dock = 'claim:'+claim; document.body.classList.add('docked'); rerender(); }, 950); return;
  }
  if(t.matches('[data-drill]') && !t.disabled){ const id = t.dataset.drill; if(id==='') undrill(); else { if(S.dock && !/^(el|lk|ctx|rel|claim|repo):/.test(S.dock)) closeDock(); drill(id); } return; }
  if(t.matches('[data-mode]')){ const f = t.closest('[data-facet]').dataset.facet; const mode = t.dataset.mode; invariantCheck(() => { Object.keys(S.facets).forEach(k => { if(mode!=='off' && mode!=='filter' && S.facets[k]===mode) S.facets[k]='off'; }); S.facets[f] = mode; renderCards(); renderEdges(); renderList(); }); return; }
  if(t.matches('[data-ov]')){ S.overlay = t.dataset.ov; if(S.dock==='changes:') S.dock = null; hidePanel(true); rerender(); requestAnimationFrame(fit); return; }
  if(t.id==='changes'){ openDock('changes:'); return; }
  if(t.id==='markrev' || t.id==='markrev2'){ send('mark', `mark reviewed · target @ ${HISTORY[0].rev}`, () => { S.mark = HISTORY[0].rev; }); return; }
  if(t.id==='checkbtn'){ openDock('check:'); return; }
  if(t.id==='addrepo' || t.id==='addrepo2'){ openDock('addrepo:'); return; }
  if(t.id==='ar-add'){ proposeRepo(); return; }
  if(t.matches('[data-ans]')){ const n = +t.dataset.n, a = t.dataset.ans;
    if(['rename','bolt','pick','reply','redo'].includes(a)){ const box = $('arg-'+n); if(!box) return; box.innerHTML = `<div class="field"><input type="text" placeholder="${a==='reply'?'your reply':a==='bolt'?'which bolt':a==='pick'?'which contexts':a==='redo'?'what to change':'new bolt name'}" id="argin-${n}"><button class="btn pri sm" data-send="${a}" data-n="${n}">send</button></div>`; box.querySelector('input').focus();
      box.querySelector('[data-send]').onclick = () => { const v = $('argin-'+n).value.trim(); if(v) answer(n, a, v); }; return; }
    answer(n, a); return; }
  if(t.matches('[data-capture]')){ capture(t.dataset.capture); return; }
  if(t.matches('[data-arm]')){ arm(t.dataset.arm); return; }
  if(t.matches('[data-detach]')){ detach(t.dataset.claim, t.dataset.detach); return; }
  if(t.matches('[data-litclaim]')){ const cl = CLAIMS.find(c => c.id===t.dataset.litclaim); S.lit = new Set(cl.attaches.flatMap(a => T.typeOf[a]==='elements' && !S.drill ? [a, T.byId[a].context] : [a])); rerender(); setTimeout(() => { S.lit = new Set(); rerender(); }, 2500); return; }
  if(t.matches('[data-lit]')){ const id = t.dataset.lit; S.lit = new Set(T.typeOf[id]==='elements' && !S.drill ? [id, T.byId[id].context] : [id]); rerender(); setTimeout(() => { S.lit = new Set(); rerender(); }, 2500); return; }
  if(t.matches('[data-claim]')){ openDock('claim:'+t.dataset.claim); return; }
  if(t.matches('[data-decopen]')){ return; }
  if(t.matches('[data-go]')){ ev.preventDefault(); goTo(t.dataset.go); return; }
  if(t.matches('[data-dockctx]')){ openDock('ctx:'+t.dataset.dockctx); return; }
  if(t.matches('[data-dec]')){ const d = DECISIONS.find(x => x.n===+t.dataset.dec); if(d.obj.startsWith('repo:')) openDock(d.obj); else goTo(d.obj); return; }
  if(t.matches('[data-att]')){ const id = t.dataset.att; const cls = claimsOn(id); if(cls.length===1) openDock('claim:'+cls[0].id); else goTo(id); return; }
  if(t.matches('[data-repo]')){ openDock('repo:'+t.dataset.repo); return; }
  if(t.matches('[data-el]')){ const id = t.dataset.el; if(T.byId[id]){ S.focus = S.drill ? id : S.focus; openDock('el:'+id); } else openDock('ghost:'+id); return; }
  if(t.matches('[data-rel]')){ const id = t.dataset.rel; if(T.byId[id]) openDock('rel:'+id); else openDock('ghost:'+id); return; }
  if(t.matches('[data-lk]')){ const id = t.dataset.lk; if(T.byId[id]) openDock('lk:'+id); else openDock('ghost:'+id); return; }
  if(t.matches('[data-hd]')){ const id = t.dataset.hd; if(T.byId[id]){ S.focus = id; openDock('ctx:'+id); } return; }
  if(t.matches('.ndock')){ openDock('rel:'+t.dataset.dockrel); return; }
  if(t.matches('.ctx')){ const id = t.dataset.id; if(T.byId[id]){ S.focus = id; openDock('ctx:'+id); } else openDock('ghost:'+id); return; }
});
// the crossing panel follows the pointer onto an edge, stays while the pointer is on it or on the panel, and answers focus the same way
document.addEventListener('mouseover', ev => { const e = ev.target.closest('.edge-g'); if(e){ showPanel(e.dataset.relg); return; } if(ev.target.closest('#epanel')) clearTimeout(HIDE_T); });
document.addEventListener('mouseout', ev => { if(ev.target.closest('.edge-g') || ev.target.closest('#epanel')){ const to = ev.relatedTarget; if(to && (to.closest?.('#epanel') || to.closest?.('.edge-g'))) return; hidePanel(false); } });
document.addEventListener('focusin', ev => { const e = ev.target.closest('.edge-g'); if(e) showPanel(e.dataset.relg); });
document.addEventListener('focusout', ev => { if(ev.target.closest('.edge-g')){ const to = ev.relatedTarget; if(to && to.closest?.('#epanel')) return; hidePanel(false); } });
document.addEventListener('input', ev => {
  const t = ev.target;
  if(t.matches('[data-fval]')){ S.facetVal[t.dataset.fval] = t.value; invariantCheck(() => { renderCards(); renderEdges(); renderList(); }); return; }
  if(t.id==='ar-name'){ S.addForm.name = t.value; $('dk-title').textContent = t.value||'…'; $('ar-add').disabled = !t.value || (!S.addForm.els.size && !S.addForm.ctx); $('ar-add').textContent = `propose ${t.value||'repository'}`; return; }
  if(t.matches('[data-arel]')){ if(t.checked) S.addForm.els.add(t.dataset.arel); else S.addForm.els.delete(t.dataset.arel); renderDock(); return; }
  if(t.id==='ar-ctx'){ S.addForm.ctx = t.value; renderDock(); return; }
});
document.addEventListener('keydown', ev => {
  if(ev.target.matches('input,textarea,select')) { if(ev.key==='Escape') ev.target.blur(); return; }
  const k = ev.key;
  if(k==='Escape'){ if(S.arming) return disarm(); if(S.hoverRel) return hidePanel(true); if(S.dock) return closeDock(); if(S.drill) return undrill(); return; }
  if(k==='f'){ fit(); return; }
  if(k==='o'){ S.overlay = S.overlay==='none'?'current':S.overlay==='current'?'review':'none'; hidePanel(true); rerender(); requestAnimationFrame(fit); return; }
  if(k==='j' || k==='k' || k==='ArrowDown' || k==='ArrowUp'){
    const ids = S.drill ? elementsOf(S.drill).map(e => e.id).sort((a,b) => DL.pos[a].y-DL.pos[b].y || DL.pos[a].x-DL.pos[b].x) : L.order; let i = ids.indexOf(S.focus); i = S.focus==null || i<0 ? 0 : (k==='j'||k==='ArrowDown') ? Math.min(ids.length-1, i+1) : Math.max(0, i-1); S.focus = ids[i];
    renderCards(); renderEdges(); document.querySelector(S.drill ? `.node[data-el="${S.focus}"]` : `.ctx[data-id="${S.focus}"]`)?.focus({preventScroll:true}); ev.preventDefault(); return; }
  if(k==='Enter' && S.focus){ if(S.drill) openDock('el:'+S.focus); else drill(S.focus); return; }
});
window.addEventListener('resize', () => { fit(); });
(function boot(){
  const q = new URLSearchParams(location.search);
  if(q.get('theme')){ S.theme = q.get('theme'); document.documentElement.setAttribute('data-theme', S.theme); $('theme').textContent = S.theme; }
  L = layout(); S.focus = null;
  if(q.get('overlay')) S.overlay = q.get('overlay');
  (q.get('facet')||'').split(',').filter(Boolean).forEach(x => { const [f,m,v] = x.split(':'); if(S.facets[f]!==undefined){ S.facets[f] = m; if(v) S.facetVal[f] = v; } });
  if(q.get('dock')) { S.dock = q.get('dock'); document.body.classList.add('docked'); }
  renderAll();
  const d = q.get('drill') || q.get('open'); if(d && T.byId[d]) drill(d);
  if(q.get('hover')) requestAnimationFrame(() => showPanel(q.get('hover')));
  if(q.get('demo')==='repo'){ openDock('addrepo:'); proposeRepo(); setTimeout(() => answer(S.nextN-1, 'yes'), 1200); } // S72 walked: propose, yes creates, the baseline follows planning
  // the layout is final: nothing after this moves a context, and nothing after a drill moves an element
  requestAnimationFrame(() => { fit(); if(!S.inv){ S.inv = {moved:0, edges:0}; renderControls(); } });
})();
</script>
