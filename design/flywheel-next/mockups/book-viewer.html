<!--
  Book viewer — the instance's blueprints as a read-only book, served beside the page and
  never inside it. Drawn against `../proposals/command-palette.md` §5 and its proposed
  requirements 315 and 316; closes S149 and replaces S91, S93–S96 (the embedded book view,
  the rail driving it, the library overlay).

  Decisions taken while building:
  - It is a viewer, not a view. `rail-and-board.html` links out here per cited chapter or
    claim ("read in book", key b) and embeds nothing; the dock on that page stays as it was.
  - It is built from the blueprints' shared line and only that. A claim an elaboration has
    proposed and not landed is not here: the viewer is always the standing destination, and
    the page is where changes to it are answered. The one exception drawn is the note on an
    absent claim, which names the intent that would write it and links back to it.
  - mdBook's shape: the chapter tree on the left, one chapter at a time with previous and
    next, headings with anchors, and the claim rendered where its chapter includes it by
    anchor — never a claims appendix. The include line is drawn above the block so a reader
    sees the chapter is citing the specification, not restating it.
  - A claim renders as a requirement block, the same shape the construction sessions read:
    the requirement sentence with SHALL, its scenarios as GIVEN · WHEN · THEN, and above it
    the claim's name, version, what it attaches to, the scope derived from that, and one
    verdict dot per repository in scope.
  - Every chapter and every rendered claim links back to the object on the page, at the
    host's address with the flywheel in the path: "Back to the flywheel" in the chapter head
    goes to the chapter's intent, and each claim block's link goes to that claim's decisions
    and evidence. A host that is away says so rather than failing silently.
  - The library is the viewer's own index, not an overlay on the page: the books of the
    flywheel in hand, with their chapters, their standing and proposed counts and when each
    was last written.
  - Who reads it: on a machine of the operator's own, the private network is the boundary
    and the page says so; on the hosted tier it reads to members of that flywheel alone.
    Serving a book to readers who are not members is one opt-in per book on the settings
    form, shown here as a state, never as a control this page can flip.
  - Review switches: ?org=<flywheel>, ?book=<id>, ?ch=<chapter>, #<anchor> (lights the
    block), ?theme=dark|light, ?served=studio|willdan-cloud (who may read), ?away=1 (the
    page's host is away, so the links back say so).
  - Chapters and prose are invented from the same seed as `rail-and-board.html`
    (willdan · 2026-09-04) and marked sample.
-->

(() => {
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SM = '<span class="sample">sample</span>';
const Q = new URLSearchParams(location.search);

/* =====================================================================
   The shared line, and only it. Chapters as mdBook; a claim is included
   by anchor from the standing specifications, never restated here.
   Seeded from the same 2026-09-04 willdan state as rail-and-board.html.
   ===================================================================== */
const P = text => ({t:'p', text});
const H = (id, text) => ({t:'h', id, text});
const INC = (claim, from) => ({t:'inc', claim, from});
const SC = (name, g, w, t) => ({name, g, w, t});

/* the standing specifications the chapters include, keyed by claim name */
const CLAIMS = {
  'sessions/one-writer': {v:'v4', requirement:'One session at a time SHALL hold the write place for a unit; a second session asking for it waits, and never opens a place of its own.',
    attach:['element sessions/place', 'element sessions/lease'], scope:['atlas','switchboard','new-repo'],
    verdicts:{atlas:'satisfied', switchboard:'satisfied', 'new-repo':'unjudged'},
    scenarios:[
      SC('the second session waits', 'a unit whose place is held by a running session', 'a second session asks for that unit’s place', 'it waits, and the record says which session holds it'),
      SC('the place is released on exit', 'a session holding a place', 'the session exits, whether it finished or failed', 'the place is released and the next waiting session takes it'),
      SC('a lost host releases nothing on its own', 'a host that stopped answering while holding a place', 'the operator takes the work over onto a host that is alive', 'the place moves with the work, and the old session cannot write again')]},
  'plan/tail-cursor': {v:'v1', requirement:'The plan tail SHALL be read from a cursor kept with the plan, so a restart resumes where the last delivery ended rather than from the beginning.',
    attach:['element plan/delivery'], scope:['switchboard'], verdicts:{switchboard:'not satisfied'},
    scenarios:[
      SC('a restart resumes', 'a plan delivered up to a mark', 'the loop restarts', 'delivery resumes at the mark, and nothing already delivered is delivered twice'),
      SC('a mark that names nothing', 'a cursor naming an entry that no longer exists', 'the loop reads it', 'it starts from the oldest entry it can name and says so in the record')]},
  'providers/rate-envelope': {v:'v1', requirement:'A provider SHALL be polled inside the envelope its declaration states; a refusal is a signal to curation, never a retry.',
    attach:['element providers/poller'], scope:['atlas'], verdicts:{atlas:'stale'},
    scenarios:[
      SC('inside the envelope', 'a provider with a stated envelope', 'the poller ticks', 'it stays inside the envelope for that provider alone'),
      SC('a refusal is a signal', 'a provider refusing because the envelope is spent', 'the poller reads the refusal', 'one signal reaches curation and no retry is made')]},
};

const BOOKS = {
  'platform-kit': {
    id:'platform-kit', org:'willdan', title:'platform-kit',
    sub:'the willdan platform · sessions, providers, the plan, delivery, status, loops, repositories',
    src:'books/platform-kit', written:'09-04 05:40 · writeback · intent host-liveness', repos:['atlas','switchboard','new-repo'],
    chapters:[
      {id:'overview', n:1, title:'How to read this book', file:'src/01-overview.md', intent:'host-liveness', blocks:[
        P('This book is the source for what the willdan platform is. A chapter explains a design conclusion and states the claim it adds or amends in the same commit, so the prose, the diagram and the claim cannot drift apart. A construction session reads the chapter to know what a claim means.'),
        H('standing','What is in this book'),
        P('Only what has landed. A claim becomes <b>standing</b> when the intent that wrote it closes and its line lands on the shared blueprints; until then it is being argued about on the flywheel, not read here. So this book is always the destination, and the flywheel is where changes to it are answered.'),
        P('A chapter never restates a claim. It includes one by name, and the specification is rendered where the include sits.')]},
      {id:'sessions', n:2, title:'Sessions and the write place', file:'src/02-sessions.md', intent:'host-liveness', blocks:[
        P('A unit of work is done by a session, and a session writes in a place of its own — a working copy off the line the unit belongs to. The place is the unit of contention, not the repository: two units on the same repository run side by side, and two sessions on the same unit do not.'),
        H('one-writer','One writer per unit'),
        P('The rule that makes the rest safe is that only one session may hold a unit’s place at a time. Everything else — how a session is charged, where it runs, what agent reads it — is free to change without touching what a reader of this chapter needs to know.'),
        INC('sessions/one-writer', 'the specification'),
        H('lost','When a host stops answering'),
        P('A host that stops answering still holds whatever places its sessions held. Nothing is taken from it automatically: the operator is asked, on the flywheel, whether to move the work onto a host that is alive. Taking it over moves the place with the work, and the old session cannot write again even if its host comes back.')]},
      {id:'plan', n:3, title:'The plan and its delivery', file:'src/03-plan.md', intent:'loop-granularity', blocks:[
        P('The plan is one list, in one order, delivered to wherever the operator is reading it. What the page draws as a rail and what the chat prints as lines are one delivery rendered twice; neither is the source.'),
        H('tail','The tail and its cursor'),
        P('Delivery is a tail read forward. A restart must not re-deliver what the operator already answered, and must not silently skip what arrived while it was down; the cursor is what makes both true.'),
        INC('plan/tail-cursor', 'the specification'),
        H('marks','Marks are per reader'),
        P('Each reader carries a mark of their own. Moving one reader’s mark moves nothing for anyone else, so two people reading the same flywheel never take work out from under one another.'),
        INC('plan/sink-marks', 'the specification')]},
      {id:'providers', n:4, title:'Providers and their envelopes', file:'src/04-providers.md', intent:'atlas-provider-limits', blocks:[
        P('A provider is anything outside the fleet that is polled on a schedule. What every provider has in common is a limit, and the limit is declared once with the provider rather than guessed at by each caller.'),

        INC('providers/rate-envelope', 'the specification'),
        H('refusals','A refusal is information'),
        P('A refusal says the envelope was wrong, or that something else is spending it. Retrying hides that; sending one signal to curation surfaces it, and the argument about what the envelope should be happens on the flywheel where it can be answered.')]},
      {id:'repositories', n:5, title:'Repositories in scope', file:'src/05-repositories.md', intent:'host-liveness', blocks:[
        P('A repository joins the fleet by being adopted or created, and from that moment the claims whose scope covers it are judged against it. A repository joined this week carries the same claims as one that has been here a year; what differs is how many of them have been judged yet.'),
        INC('sessions/one-writer', 'the same specification, included again'),
        P('A claim included in two chapters is one claim: the same name, the same version, one verdict per repository. There is no second copy to keep in step.')]},

      {id:'loops', n:2, title:'Loops', file:'src/07-loops.md', intent:'loop-granularity', blocks:[

const ORGS = {
  willdan:{name:'willdan', host:'studio.willdan.local', served:'a machine of your own', readers:'everyone on your private network'},
  agentplot:{name:'agentplot', host:'willdan-cloud.flywheel.cloud', served:'the hosted tier', readers:'members of this flywheel'},

const ORG = ORGS[Q.get('org')] || (Q.get('served')==='willdan-cloud' ? ORGS.agentplot : ORGS.willdan);
const AWAY = Q.has('away');

const books = () => Object.values(BOOKS);
let BOOK = BOOKS[Q.get('book')] || books()[0];
let CH = BOOK.chapters.find(c => c.id===Q.get('ch')) || BOOK.chapters[0];
const HL = decodeURIComponent((location.hash || '').slice(1)) || null;

const anchorOf = x => x.t==='inc' ? 'claim-'+x.claim.replace(/\//g,'-') : x.t==='h' ? x.id : null;
/* every link back is the host's address with the flywheel in the path */
const at = path => `rail-and-board.html?org=${encodeURIComponent(ORG.name)}${path}`;
const objHref = key => at(`&open=${encodeURIComponent(key)}`);
const chHref = (b, c, a) => `?org=${encodeURIComponent(ORG.name)}&book=${encodeURIComponent(b)}&ch=${encodeURIComponent(c)}${a?'#'+a:''}`;
const stats = b => { const inc = b.chapters.flatMap(c => c.blocks.filter(x => x.t==='inc'));
  const names = [...new Set(inc.map(x => x.claim))];
  return {chapters:b.chapters.length, standing:names.filter(n => CLAIMS[n]).length, included:inc.length}; };

function backLink(label, key, why){
  if(AWAY) return `<span class="away">${esc(label)} · ${esc(ORG.host)} is away right now</span>`;
  return `<a class="btn sm" href="${objHref(key)}">${esc(label)}</a>${why ? `<span class="why">${esc(why)}</span>` : ''}`;
}

function claimHtml(x){
  const c = CLAIMS[x.claim];
  const a = anchorOf(x);
  const inc = `<div class="include">included by anchor from ${esc(x.from)} · <span class="mono">${esc(x.claim)}</span></div>`;
  if(!c){ const f = IN_FLIGHT[x.claim];
    return inc + `<div class="notyet" id="${a}"><b>${esc(x.claim)}</b> is not on the shared line yet${f ? ` — it is ${esc(f.what)}` : ''}. What is in flight is not in this book; the flywheel is where it is answered.${f ? ` ${backLink('Open the intent', 'i:'+f.intent)}` : ''}</div>`; }
  const dots = c.scope.map(h => `<span class="vh" title="${esc(h)} · ${esc(c.verdicts[h]||'unjudged')}"><span class="vdot ${(c.verdicts[h]||'unjudged').replace(' ','-')}"></span>${esc(h)} <span style="color:var(--ink3)">${esc(c.verdicts[h]||'unjudged')}</span></span>`).join('');
  return inc + `<div class="claim ${HL===a?'lit':''}" id="${a}">
    <div class="ch"><span class="k">claim</span><span class="nm">${esc(x.claim)}</span><span class="v">@${esc(c.v)}</span><span class="state">standing</span></div>
    <div class="meta">attached to ${c.attach.map(t => `<span class="lk">${esc(t)}</span>`).join('')}</div>
    <div class="meta">scope · ${esc(c.scope.join(', '))} · derived from what it attaches to</div>
    <div class="req"><span class="rk">requirement</span>
      <div class="rt">${esc(c.requirement).replace(/\b(SHALL|MUST)\b/g,'<b>$1</b>')}</div>
      <details open><summary>${c.scenarios.length} scenario${c.scenarios.length===1?'':'s'}</summary>
        ${c.scenarios.map(s => `<div class="scn"><span class="sn">${esc(s.name)}</span><b>GIVEN</b> ${esc(s.g)}<br><b>WHEN</b> ${esc(s.w)}<br><b>THEN</b> ${esc(s.t)}</div>`).join('')}
      </details></div>
    <div class="homes">${dots}</div>
    <div class="foot"><span class="grow">one verdict per repository in scope, from the ledger</span>${backLink('Back to the flywheel', 'o:claim/'+x.claim, 'its decisions and its evidence')}</div>
  </div>`;
}

function render(){
  document.title = `${BOOK.title} · ${CH.title}`;
  $('#meta').innerHTML = `<b class="mono">${esc(ORG.name)}</b> · ${esc(BOOK.title)} · <span class="mono">${esc(BOOK.src)}/${esc(CH.file)}</span> · built from the shared line ${SM}`;
  const open = ORG.name!=='willdan';
  $('#readers').className = 'readers' + (open ? '' : '');
  $('#readers').innerHTML = `<span class="dot"></span><b>${esc(ORG.readers)}</b> · ${esc(ORG.served)}`;
  $('#readers').title = ORG.name==='willdan'
    ? 'the private network is the boundary; nothing goes beyond it unless you say so'
    : 'served under the caller’s token; reads to members of this flywheel alone';
  $('#tofw').href = at('');

  /* the tree: this book's chapters, then the viewer's own index of the flywheel's books */
  const subs = c => c.blocks.filter(x => x.t==='h' || x.t==='inc').map(x => { const a = anchorOf(x);
    return `<li><a class="${x.t==='inc'?'cl':''} ${HL===a?'lit':''}" href="${chHref(BOOK.id, c.id, a)}">${x.t==='inc'
      ? `${esc(x.claim)} <span class="v">${CLAIMS[x.claim] ? '@'+esc(CLAIMS[x.claim].v) : 'not on the line'}</span>`
      : esc(x.text)}</a></li>`; }).join('');
  $('#tree').innerHTML = `<div class="th"><span class="eyebrow">book</span><div class="t">${esc(BOOK.title)}</div><div class="s">${esc(BOOK.sub)}</div><div class="src">${esc(BOOK.src)} · written ${esc(BOOK.written)}</div></div>
    <ol>${BOOK.chapters.map(c => `<li><a href="${chHref(BOOK.id, c.id)}" class="${c.id===CH.id?'on':''}" ${c.id===CH.id?'aria-current="page"':''}><span class="n">${c.n}</span><span>${esc(c.title)}</span></a>${c.id===CH.id ? `<ol class="sub">${subs(c)}</ol>` : ''}</li>`).join('')}</ol>
    <div class="lib"><div class="lh">this flywheel’s books</div>${books().map(b => { const s = stats(b);
      return `<a href="${chHref(b.id, b.chapters[0].id)}" class="${b.id===BOOK.id?'on':''}"><span class="nm">${esc(b.title)}</span><span class="mm">${s.chapters} chapters · ${s.included} claims included · written ${esc(b.written)}</span></a>`; }).join('')}</div>
    <div class="foot"><span class="eyebrow">verdict dots · one per repository in scope</span>${['satisfied','not satisfied','stale','unjudged','not applicable'].map(v => `<span class="vh"><span class="vdot ${v.replace(' ','-')}"></span>${v}</span>`).join('')}
      <div class="ot">mdBook sources at <span class="mono">${esc(BOOK.src)}</span>, rendered read-only. What is in flight — a proposed claim, a chapter an elaboration has not landed — is not here. ${SM}</div></div>`;

  const i = BOOK.chapters.indexOf(CH), prev = BOOK.chapters[i-1], next = BOOK.chapters[i+1];
  const body = CH.blocks.map(x => {
    if(x.t==='inc') return claimHtml(x);
    const a = anchorOf(x);
    if(x.t==='h') return `<div class="blk ${HL===a?'lit':''}" id="${a}"><h2>${esc(x.text)}<a class="anchor" href="${chHref(BOOK.id, CH.id, a)}">#</a></h2></div>`;
    return `<div class="blk"><p>${x.text}</p></div>`;
  }).join('');
  $('#page').innerHTML = `<div class="crumb"><span>${esc(ORG.name)}</span><span>›</span><span>${esc(BOOK.title)}</span><span>›</span><span class="mono">${esc(CH.file)}</span><span style="margin-left:auto">${SM}</span></div>
    <div class="chead"><h1>${CH.n}. ${esc(CH.title)}</h1>
      <div class="back">${backLink('Back to the flywheel', 'i:'+CH.intent, `the intent this chapter was written by · ${CH.intent}`)}</div></div>
    ${body}
    <div class="pfoot">${prev ? `<a class="btn" href="${chHref(BOOK.id, prev.id)}">‹ ${prev.n}. ${esc(prev.title)}</a>` : '<span></span>'}<span class="sp"></span>${next ? `<a class="btn" href="${chHref(BOOK.id, next.id)}">${next.n}. ${esc(next.title)} ›</a>` : '<span></span>'}</div>`;

  if(HL){ const el = document.getElementById(HL); if(el) el.scrollIntoView({block:'center'}); }
}

if(Q.get('theme')) document.documentElement.dataset.theme = Q.get('theme');
render();
})();
</script>
