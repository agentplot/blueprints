<!doctype html>
<!--
  Flywheel Workbench — desktop mockup of the plan as four phase lanes with a right-side dock.
  Seeded from plan-mockup.md (willdan · 2026-09-04 07:40 · decisions 412–421) plus one
  invented planning proposal, decision 422, for repository atlas.

  Decisions taken while building:
  - Four lanes: Inception, Bolt plan, Construction, Operation. Bolt plan is drawn as the
    transition between Inception and Construction: hatched ground, chevron edges.
  - The dock opens over the board like a GitHub issue over a project board; the board does
    not move. Esc, the × or a click outside closes it; the move keys change what it shows while
    it stays open; Enter opens the focused card.
  - 422 is planning's proposal for atlas: bolt plan-tail (open) gains 2 units, new bolt
    tail-cursor gets 3 units with dependencies. Per-unit edits (bolt, new bolt, rename, type,
    drop) are staged on the proposal and travel with the one yes: "yes 422 · u4 type fast".
    Edits are validated live: moving or dropping a unit that others depend on is refused inline
    with the reason and an offer to move or drop the dependents too; rename and type never
    touch dependencies. "That's all wrong" sends "redo 422: <notes>", withdraws the proposal,
    shows planning charged again with the notes, and a new proposal number (423) arrives later.
    The proposal's history shows its lineage: intent → writeback (wrote the claim) → landing on
    the books → planning run → this proposal.
  - 416 lands bolt switchboard/plan-rows (every unit finished). atlas/plan-decisions stays open
    with 413, 415, 420 and 421 on it.
  - Operation keeps a landed bolt while its request, environments or a signal about it is live
    and for 7 days after; each card says "leaves in Nd" or why it stays. claim-index shows the
    edge: leaves in 2d.
  - Keys: j/k and ↓/↑ move within a lane; h/l and ←/→ move to the nearest card in the next
    lane; the dock follows. y/n answer yes and drop/no; l answers "later" on a card that offers
    it (417) and moves right everywhere else.
  - 413, 414 and 417 are single proposals and sit in the Bolt plan lane beside 422.
    415 (chores offered by a review session) sits with Construction under the bolt whose
    session offered them.
  - Every answer click is one response. The card takes an in-flight state for ~1.1 s and
    refuses a second click until it settles; "yes all" sends one response per APPROVE
    decision in order, each with its own toast and log line.
  - Service start and stop, and the capture box, are dictations: logged as "say".
  - The clock starts at 07:40 and advances a minute per response.
  - Query switches for review: ?theme=dark forces the dark palette, ?nodock opens with the dock closed,
    ?open=d416 (d<decision> · b<bolt id> · i<intent id> · l<landed id>) opens that object instead of 422.
  - Operation is read-only: landed bolts with PR, checks, environments, and the signals
    operation sends back to curation with their move.
  - Everything in the dock beyond the seed (documents, items, logs, hosts, endpoints,
    services, checks) is invented and marked sample.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flywheel Workbench</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F3F1EC; --surface:#FFFFFF; --sunk:#EAE7E0; --sunk2:#F8F6F2; --line:#D8D3C9; --line2:#E6E2DA;
  --ink:#1E1C19; --ink2:#5C574F; --ink3:#8C867C;
  --accent:#3E4FB5; --accent-ink:#2F3D93; --accent-soft:#E3E6F7; --accent-hatch:rgba(62,79,181,.07);
  --yes:#2C7A4E; --yes-soft:#DCEEE2; --drop:#B0413E; --drop-soft:#F5DEDC;
  --warn:#B27219; --warn-soft:#F6E7CB; --run:#2A8A7A;
  --on-accent:#FFFFFF;
  --scrim:rgba(30,28,25,.18);
  --shadow:0 1px 2px rgba(30,28,25,.06),0 10px 28px rgba(30,28,25,.14);
  --shadow-dock:-8px 0 32px rgba(30,28,25,.16);
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --top:52px; --strip:38px; --dock:560px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141311; --surface:#1D1B18; --sunk:#181613; --sunk2:#211F1B; --line:#34302A; --line2:#28251F;
    --ink:#ECE8E1; --ink2:#B0A99E; --ink3:#7D766C;
    --accent:#8D9BF3; --accent-ink:#B5BEF8; --accent-soft:#262B4C; --accent-hatch:rgba(141,155,243,.08);
    --yes:#5DBF86; --yes-soft:#183A29; --drop:#E6726D; --drop-soft:#40201E;
    --warn:#E3A746; --warn-soft:#3B2C13; --run:#4FC2AE;
    --on-accent:#141311;
    --scrim:rgba(0,0,0,.35);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
    --shadow-dock:-8px 0 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141311; --surface:#1D1B18; --sunk:#181613; --sunk2:#211F1B; --line:#34302A; --line2:#28251F;
  --ink:#ECE8E1; --ink2:#B0A99E; --ink3:#7D766C;
  --accent:#8D9BF3; --accent-ink:#B5BEF8; --accent-soft:#262B4C; --accent-hatch:rgba(141,155,243,.08);
  --yes:#5DBF86; --yes-soft:#183A29; --drop:#E6726D; --drop-soft:#40201E;
  --warn:#E3A746; --warn-soft:#3B2C13; --run:#4FC2AE;
  --on-accent:#141311;
  --scrim:rgba(0,0,0,.35);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  --shadow-dock:-8px 0 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4{margin:0;font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{resize:vertical}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent-ink)}
kbd{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--surface);color:var(--ink2)}

/* ---- top bar ---- */
.top{height:var(--top);display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand .meta{color:var(--ink2);font-size:12.5px;white-space:nowrap}
.brand .meta .mono{color:var(--ink)}
.count{margin-left:auto;display:flex;align-items:baseline;gap:8px;color:var(--ink2);font-size:12.5px;white-space:nowrap}
.count b{font-family:var(--mono);font-weight:600;font-size:18px;color:var(--ink);letter-spacing:-.02em}
.count .rule{color:var(--ink3)}
.keys{display:flex;gap:10px;color:var(--ink3);font-size:11.5px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:500;line-height:1.2;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--ink3);background:var(--sunk2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-ink)}
.btn.yes{border-color:var(--yes);color:var(--yes)}.btn.yes:hover{background:var(--yes-soft)}
.btn.drop{border-color:var(--drop);color:var(--drop)}.btn.drop:hover{background:var(--drop-soft)}
.btn.quiet{border-color:transparent;color:var(--ink2);background:transparent}
.btn.quiet:hover{background:var(--sunk)}
.btn.sm{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}
.btn .k{font-family:var(--mono);font-size:10px;color:inherit;opacity:.6;margin-left:2px}
.logbtn b{font-family:var(--mono);font-weight:600}

/* ---- strip: since + attention ---- */
.strip{height:var(--strip);display:flex;align-items:center;gap:10px;padding:0 20px;background:var(--sunk2);border-bottom:1px solid var(--line2);overflow:hidden;position:relative;z-index:4}
.strip .lab{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.strip .lab b{color:var(--ink2);font-family:var(--mono);font-weight:500;letter-spacing:0;text-transform:none;margin-left:4px}
.strip .items{display:flex;gap:6px;min-width:0;overflow:hidden;align-items:center}
#since{flex:1 1 auto;mask-image:linear-gradient(90deg,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
#attention{flex:0 1 auto;max-width:46%}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px 3px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;color:var(--ink2)}
.pill .v{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:4px;background:var(--sunk);color:var(--ink2)}
.pill .v.merged,.pill .v.landed,.pill .v.finished,.pill .v.answered,.pill .v.accepted{background:var(--yes-soft);color:var(--yes)}
.pill .v.closed,.pill .v.started{background:var(--accent-soft);color:var(--accent-ink)}
.pill .v.dropped,.pill .v.split,.pill .v.redo,.pill .v.later,.pill .v.held,.pill .v.kept{background:var(--sunk);color:var(--ink3)}
.pill .w{color:var(--ink);font-weight:500}
.pill.new{animation:arrive .5s ease-out}
.pill.att{border-color:var(--warn);background:var(--warn-soft);color:var(--ink)}
.pill.att .v{background:var(--warn);color:#fff}
.pill .btn.sm{padding:1px 7px;font-size:11px;margin-left:2px}
.strip .sep{width:1px;height:20px;background:var(--line);margin:0 6px;flex:none}
@keyframes arrive{from{transform:translateX(-8px);opacity:0}to{transform:none;opacity:1}}

/* ---- board ---- */
.board{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1.08fr) minmax(340px,1.3fr) minmax(280px,1fr);height:calc(100vh - var(--top) - var(--strip));position:relative}
.lane{min-width:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 80px;border-right:1px solid var(--line2);scrollbar-width:thin}
.lane:last-child{border-right:0}
.lane-h{display:flex;align-items:baseline;gap:8px;margin:0 2px 12px;position:sticky;top:-14px;background:var(--bg);padding:14px 0 8px;z-index:2;margin-top:-14px}
.lane-h h2{font-size:14px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.lane-h .sub{color:var(--ink3);font-size:11.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane-h .cnt{margin-left:auto;white-space:nowrap;font-family:var(--mono);font-size:11.5px;color:var(--ink2);background:var(--sunk);padding:1px 7px;border-radius:999px}
.lane-h .cnt.zero{color:var(--ink3);background:transparent}
.lane.plan{background:repeating-linear-gradient(-45deg,transparent 0 9px,var(--accent-hatch) 9px 10px),var(--bg);border-left:1px dashed var(--line);border-right:1px dashed var(--line)}
.lane.plan .lane-h{background:var(--bg)}
.lane.plan .lane-h h2{color:var(--accent-ink)}
.lane.plan .lane-h h2::before,.lane.plan .lane-h h2::after{color:var(--ink3);font-weight:400;font-size:12px}
.lane.plan .lane-h h2::before{content:"◂ ";}
.lane.plan .lane-h h2::after{content:" ▸"}
.lane.ops{background:var(--sunk2)}
.lane.ops .lane-h{background:var(--sunk2)}
.ro{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);border:1px dashed var(--line);padding:1px 6px;border-radius:4px}
.sub-h{display:flex;align-items:baseline;gap:8px;margin:16px 2px 6px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.sub-h .r{margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none;font-size:11.5px}
.sub-h.approve{color:var(--accent-ink)}
.empty{color:var(--ink3);font-size:12.5px;font-style:italic;padding:8px 4px}

/* ---- capture ---- */
.capture{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px 8px;margin-bottom:12px;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.capture textarea{width:100%;min-height:54px;border:0;padding:0;background:transparent;font-size:13.5px;line-height:1.45;resize:none}
.capture textarea::placeholder{color:var(--ink3)}
.capture .cf{display:flex;align-items:center;gap:8px;margin-top:6px;border-top:1px solid var(--line2);padding-top:8px}
.capture .cf .as{font-size:11.5px;color:var(--ink3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.capture .cf .as b{color:var(--ink2);font-weight:500}
.capture .cf .as .mono{color:var(--accent-ink)}
.curation{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;white-space:nowrap;font-size:11.5px;color:var(--ink3);padding:0 4px;margin:-4px 0 4px}
.curation b{color:var(--ink2);font-family:var(--mono);font-weight:500}

/* ---- cards ---- */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px;margin-bottom:8px;cursor:pointer;transition:box-shadow .15s,border-color .15s,opacity .25s,transform .25s;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.card:hover{box-shadow:var(--shadow)}
.card.focused{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.card.open-in-dock{border-color:var(--accent)}
.card.open-in-dock::after{content:"";position:absolute;right:-1px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent)}
.card.gone{opacity:0;transform:translateX(18px)}
.card .ch{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card .n{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent-ink);letter-spacing:.01em}
.card .kind{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--sunk);color:var(--ink2)}
.card.g-decide .kind{background:var(--accent-soft);color:var(--accent-ink)}
.card.g-answer .kind{background:var(--warn-soft);color:var(--warn)}
.card .grp{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.card .ch .open{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3);padding:2px 6px;border-radius:4px;opacity:0;transition:opacity .12s}
.card:hover .ch .open,.card.focused .ch .open{opacity:1}
.card .ch .open:hover{background:var(--accent-soft);color:var(--accent-ink)}
.card .title{font-size:15px;font-weight:600;line-height:1.25;letter-spacing:-.005em;text-wrap:balance}
.card .title i{font-style:normal;color:var(--ink3);font-weight:400}
.card .tail{font-family:var(--mono);font-size:11.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
.card .tail b{font-weight:500;color:var(--ink)}
.card .goes{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.4}
.bolt-tag{font-family:var(--mono);font-size:11px;color:var(--accent-ink);background:var(--accent-soft);padding:1px 6px;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.bolt-tag.newb{border:1px dashed var(--accent);background:transparent}
.card .starts{font-size:11.5px;color:var(--ink3);margin-top:4px}
.card .starts .chain{font-family:var(--mono);color:var(--ink2)}
.card .q{font-size:14px;font-style:italic;margin:4px 0 2px;color:var(--ink)}
.card .q::before{content:"“"}.card .q::after{content:"”"}
.card.g-answer{border-left:3px solid var(--warn)}
.card.g-decide{border-left:3px solid var(--accent)}
.card.k-proposal{border-color:var(--accent);background:linear-gradient(180deg,var(--surface),var(--surface) 70%,var(--accent-soft))}
.card .prop{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:8px;font-size:12.5px}
.card .prop .pb{font-family:var(--mono);font-size:11.5px;color:var(--accent-ink);white-space:nowrap}
.card .prop .pus{color:var(--ink2)}
.card .prop .pus b{color:var(--ink);font-weight:500}
.card .edits{margin-top:6px;font-size:11.5px;color:var(--warn);font-family:var(--mono)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.acts .hint{margin-left:auto;font-size:11px;color:var(--ink3);white-space:nowrap}
.acts .hint kbd{margin-left:2px}
.chores{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.chore{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 6px;border-radius:5px;cursor:pointer}
.chore:hover{background:var(--sunk2)}
.chore.on{background:var(--accent-soft)}
.chore .lt{font-family:var(--mono);font-size:11px;font-weight:600;width:18px;height:18px;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;color:var(--ink2)}
.chore.on .lt{background:var(--accent);border-color:var(--accent);color:#fff}
.chore .f{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.field{display:flex;gap:6px;margin-top:8px;align-items:flex-start}
.field input,.field textarea,.field select{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;background:var(--sunk2)}
.field textarea{min-height:52px}
.flight{display:none;position:absolute;inset:0;border-radius:10px;background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(1px);align-items:center;justify-content:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--ink);z-index:2;cursor:wait}
.card.inflight .flight{display:flex}
.card.inflight{border-color:var(--accent)}
.card.refused{animation:shake .3s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- quiet rows (in flight, no decision) ---- */
.quiet{background:transparent;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
.quiet:hover{background:var(--surface);border-style:solid}
.quiet.focused{border-color:var(--accent);border-style:solid;box-shadow:0 0 0 2px var(--accent-soft)}
.quiet.open-in-dock{border-color:var(--accent);border-style:solid}
.quiet .qh{display:flex;align-items:baseline;gap:8px}
.quiet .qk{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.quiet .qn{font-weight:600;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quiet .qr{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3);white-space:nowrap}
.quiet .qt{font-size:12px;color:var(--ink2);margin-top:3px}

/* ---- bolt groups (construction) ---- */
.bolt{border:1px solid var(--line);border-radius:12px;background:var(--sunk2);padding:10px 10px 4px;margin-bottom:12px}
.bolt.landing{border-color:var(--yes)}
.bolt-h{display:flex;align-items:baseline;gap:8px;padding:0 2px 8px;cursor:pointer;border-radius:6px}
.bolt-h:hover .bn{color:var(--accent-ink)}
.bolt-h.focused{outline:2px solid var(--accent);outline-offset:2px}
.bolt-h .bk{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.bolt-h .bn{font-size:15px;font-weight:700;letter-spacing:-.005em}
.bolt-h .br{color:var(--ink3);font-size:12px}
.bolt-h .bs{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap}
.bolt-h .bs .landing{color:var(--yes);font-weight:600}
.units{display:flex;flex-direction:column;gap:3px;margin:0 2px 8px}
.unit{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12.5px;padding:4px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line2)}
.unit .un{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit .ut{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.unit.merged{color:var(--ink3);border-style:dashed;background:transparent}
.unit.merged .un{font-weight:400}

/* --- the proposal editor: per-unit edits staged until the one yes --- */
function propUnitState(u){ const e = S.proposal.edits[u.id]||{}; return {bolt:e.bolt||u.bolt, type:e.type||u.type, name:e.name||u.name, drop:!!e.drop, newBolt:e.newBolt||'', edited:Object.keys(e).length>0}; }
const punit = id => S.proposal.units.find(u => u.id===id);
const alive = id => !propUnitState(punit(id)).drop;
function dependents(id){ const out = new Set(); const walk = x => S.proposal.units.forEach(u => { if(u.after.includes(x) && !out.has(u.id)){ out.add(u.id); walk(u.id); } }); walk(id); return [...out]; }
function dependencies(id){ const out = new Set(); const walk = x => punit(x).after.forEach(a => { if(!out.has(a)){ out.add(a); walk(a); } }); walk(id); return [...out]; }
const setEdit = (id, k, v) => { const e = (S.proposal.edits[id] ||= {}); if(v===undefined || v===null || v===false) delete e[k]; else e[k] = v; if(!Object.keys(e).length) delete S.proposal.edits[id]; };
const boltLabel = b => b==='__new' ? 'a new bolt' : (S.proposal.boltNames[b] || S.proposal.bolts.find(x => x.id===b)?.name || b);
/* an edit that would break a dependency is refused with the reason and an offer */
function tryMove(id, target){
  const u = punit(id); if(target===u.bolt) { setEdit(id,'bolt',undefined); setEdit(id,'newBolt',undefined); return true; }
  const others = [...dependents(id), ...dependencies(id)].filter(o => alive(o) && propUnitState(punit(o)).bolt!==target);
  if(others.length){ S.proposal.refuse = {uid:id, kind:'move', target, others, reason:`${others.join(', ')} ${others.length===1?'is':'are'} tied to ${id} by a dependency, and a dependency never crosses a bolt`, offer:`move ${dependents(id).some(o=>others.includes(o)) && dependencies(id).some(o=>others.includes(o)) ? 'them' : dependents(id).some(o=>others.includes(o)) ? 'dependents' : 'dependencies'} too`}; return false; }
  setEdit(id,'bolt',target); return true;
}
function tryDrop(id){
  const others = dependents(id).filter(alive);
  if(others.length){ S.proposal.refuse = {uid:id, kind:'drop', others, reason:`${others.join(', ')} depend${others.length===1?'s':''} on ${id}`, offer:'drop dependents too'}; return false; }
  setEdit(id,'drop',true); return true;
}
function tryRestore(id){
  const others = dependencies(id).filter(o => !alive(o));
  if(others.length){ S.proposal.refuse = {uid:id, kind:'restore', others, reason:`${id} depends on ${others.join(', ')}, which ${others.length===1?'is':'are'} dropped`, offer:'restore dependencies too'}; return false; }
  setEdit(id,'drop',undefined); return true;
}
function applyRefusal(){
  const r = S.proposal.refuse; if(!r) return; S.proposal.refuse = null;
  if(r.kind==='move'){ [r.uid, ...r.others].forEach(id => { setEdit(id,'bolt', r.target===punit(id).bolt ? undefined : r.target); if(r.target!=='__new') setEdit(id,'newBolt',undefined); }); }
  if(r.kind==='drop'){ [r.uid, ...r.others].forEach(id => setEdit(id,'drop',true)); }
  if(r.kind==='restore'){ [r.uid, ...r.others].forEach(id => setEdit(id,'drop',undefined)); }
}
function depsSvg(units){
  const st = Object.fromEntries(units.map(u => [u.id, propUnitState(u)]));
  const depth = {}; const dz = u => depth[u.id] ?? (depth[u.id] = u.after.length ? 1+Math.max(...u.after.map(a => dz(units.find(x => x.id===a)))) : 0);
  units.forEach(dz);
  const cols = {}; units.forEach(u => (cols[depth[u.id]] ||= []).push(u));

function navList(){ return $$('[data-nav]').map(navKey); }
function setFocus(key, scroll=true){
  S.focus = key;
  $$('[data-nav]').forEach(el => el.classList.toggle('focused', navKey(el)===key));
  const el = document.querySelector(`[data-nav="${key}"]`);

  if(S.open){ S.open = key; renderDock(); $$('[data-nav]').forEach(e => e.classList.toggle('open-in-dock', navKey(e)===key)); }

function step(dir){
  const list = navList(); if(!list.length) return;
  const i = list.indexOf(S.focus);
  const j = i<0 ? (dir>0 ? 0 : list.length-1) : Math.min(list.length-1, Math.max(0, i+dir));
  setFocus(list[j]);
}
const focusedEl = () => S.focus ? document.querySelector(`[data-nav="${S.focus}"]`) : null;
function stepV(dir){
  const el = focusedEl(); if(!el){ step(1); return; }
  const list = $$('[data-nav]', el.closest('.lane')).map(navKey);
  const i = list.indexOf(S.focus); const j = Math.min(list.length-1, Math.max(0, i+dir));
  if(j!==i) setFocus(list[j]);
}
function stepH(dir){
  const el = focusedEl(); if(!el){ step(1); return; }
  const lanes = $$('.lane'); const top = el.getBoundingClientRect().top;
  for(let k = lanes.indexOf(el.closest('.lane'))+dir; k>=0 && k<lanes.length; k+=dir){
    const items = $$('[data-nav]', lanes[k]); if(!items.length) continue;
    const best = items.reduce((a,b) => Math.abs(b.getBoundingClientRect().top-top) < Math.abs(a.getBoundingClientRect().top-top) ? b : a);
    setFocus(navKey(best)); return;
  }
}

const tick = () => { S.minutes++; return hhmm(S.minutes); };
function toast(msg, fail){ const t = document.createElement('div'); t.className = 'toast'+(fail?' fail':''); t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 2600); }
function logLine(text, opts={}){ S.log.unshift({t:tick(), text, ...opts}); }
function refuse(n){ const el = document.querySelector(`.card[data-n="${n}"]`); if(el){ el.classList.remove('refused'); void el.offsetWidth; el.classList.add('refused'); } toast(`${n} · already sending · wait for it to settle`, true); }
function send(n, a, arg){
  const d = dec(n); if(!d) return;
  if(S.inflight[n]){ refuse(n); return; }
  let text = a==='yes' ? `yes ${n}` : a==='no' ? `no ${n}` : a==='redo' ? (d.kind==='proposal' ? `redo ${n}: ${arg}` : `${n} redo: ${arg}`) : a==='reply' ? `${n}: ${arg}` : a==='pick' ? `${n} pick ${arg}` : (a==='bolt'||a==='rename'||a==='new bolt') ? `${n} ${a} ${arg}` : `${n} ${a}`;
  if(a==='yes' && d.kind==='proposal'){ const e = editsSummary(); if(e.length) text += ' · ' + e.join(' · '); }
  S.inflight[n] = {a, arg, text};
  renderCardState(n); if(S.open===`d${n}`) renderDock();
  setTimeout(() => settle(n), 1100);
}
function renderCardState(n){ const el = document.querySelector(`.card[data-n="${n}"]`); if(!el) return; el.classList.toggle('inflight', !!S.inflight[n]); const f = el.querySelector('.flight'); if(f) f.innerHTML = flightHtml(n).replace(/^<div[^>]*>|<\/div>$/g,''); }
function settle(n){
  const f = S.inflight[n]; const d = dec(n); if(!f || !d) return;
  delete S.inflight[n];
  logLine(f.text, {n});
  toast(`${f.text.length>48 ? f.text.slice(0,46)+'…' : f.text} · recorded`);
  effects(d, f.a, f.arg);
  const el = document.querySelector(`.card[data-n="${n}"]`); if(el) el.classList.add('gone');
  const wasOpen = S.open===`d${n}`;
  const list = navList(); const i = list.indexOf(`d${n}`);
  S.decisions = S.decisions.filter(x => x.n!==n);
  setTimeout(() => {
    render();
    const nl = navList();
    const next = nl[Math.min(i, nl.length-1)] || null;
    if(wasOpen){ if(next) openDock(next); else closeDock(); }
    else if(S.focus===`d${n}` && next) setFocus(next, false);
  }, 260);
}
function since(v, w, t, about){ S.since.unshift({v, w, t:t||'by your response', at:hhmm(S.minutes), fresh:true, about:about||[]}); }
function say(text){ logLine(text, {say:true}); toast(`say → ${text} · applied`); }
function addBolt(id, name, repo, note){ if(bolt(id)) return bolt(id); const b = {id, name, repo, line:`${name} @ new`, note, units:[], endpoints:[`http://${repo}.${name}.localhost:${41250+S.bolts.length}`], services:[{n:repo+'-api',s:'stopped',ep:'—'}]}; S.bolts.push(b); return b; }
function startUnit(b, name, type, stage){ const id = 'wi'+S.nextWi; b.units.push({name, state:'building', type, items:[{id, label:`wi-#${S.nextWi++} ${stage}`, state:'starting', host:'studio', last:`${hhmm(S.minutes)} · place prepared off ${b.name}`}]}); setTimeout(() => { const it = b.units.find(u=>u.name===name)?.items.find(i=>i.id===id); if(it && it.state==='starting'){ it.state='working'; it.last=`${hhmm(S.minutes)} · reading the unit`; render(); } }, 2400); }

/* ---------- what a response does to the board ---------- */
function effects(d, a, arg){
  const n = d.n, P = S.proposal;
  switch(n){
    case 412: { const i = S.intents.find(x => x.id==='atlas-provider-limits');
      if(a==='yes'){ i.state='open'; i.note='2 elaborations starting · 1 standing'; i.sessions.push({id:'e-res',name:'research (self-closing)',state:'starting',host:'studio',last:`${hhmm(S.minutes)} · place prepared`},{id:'e-pro',name:'prototype limiter (standing)',state:'starting',host:'studio',last:`${hhmm(S.minutes)} · place prepared`}); since('started','intent atlas-provider-limits','2 elaborations',[412]); }
      else if(a==='drop'){ since('dropped','intent atlas-provider-limits','7 signals moved: dropped',[412]); }
      else since('split','intent atlas-provider-limits','back to curation',[412]); break; }
    case 418: if(a==='close'){ S.intents = S.intents.filter(i => i.id!=='loop-granularity'); since('closed','intent loop-granularity','3 claims standing',[418]); } else since('kept','intent loop-granularity','open',[418]); break;
    case 419: { const i = S.intents.find(x => x.id==='atlas-provider-limits'); if(a==='finish'){ i.sessions = i.sessions.filter(s => s.id!=='proto'); i.note = i.note.replace('1 standing session already on its line','finding kept'); since('finished','prototype plan-derivation','place removed',[419]); } break; }
    case 422: case 423: if(a==='yes'){
        P.units.forEach(u => { const s = propUnitState(u); if(s.drop) return; let b;
          if(s.bolt==='__new'){ const nm = s.newBolt||'unnamed'; b = addBolt('b-'+nm, nm, 'atlas', 'new · from 422'); }
          else { const pb = P.bolts.find(x => x.id===s.bolt); const nm = P.boltNames[pb.id]||pb.name; b = bolt(pb.id) || addBolt(pb.id, nm, 'atlas', 'new · from 422'); if(bolt(pb.id) && P.boltNames[pb.id]) b.name = nm; }
          if(u.after.length) b.units.push({name:s.name, state:'queued', type:s.type, items:[]}); else startUnit(b, s.name, s.type, 'spec'); });
        S.bolts.forEach(b => { if(b.id==='plan-tail') b.note = '1 merged · 1 building · 2 from 422'; });
        since('accepted','plan atlas','5 units on 2 bolts',[422,'plan-tail']);
      } else if(a==='drop') since('dropped','plan atlas','nothing created',[n]);
      else { since('redo',`plan atlas · ${n}`,'withdrawn · planning charged again',[n]); P.edits = {}; P.boltNames = {}; P.refuse = null;
        S.planning = {repo:'atlas', notes:arg, since:hhmm(S.minutes), last:`${hhmm(S.minutes)} · reading your notes and the backlog`};
        setTimeout(() => { if(S.planning) S.planning.last = `${hhmm(S.minutes)} · re-reading open bolts plan-decisions, plan-tail`; render(); }, 2500);
        setTimeout(() => {
          const m = n+1, t = hhmm(S.minutes); S.planning = null;
          X[m] = {...X[422], lineage:[...X[422].lineage.slice(0,-1), ['proposal',`${n}`,'withdrawn by your redo'],['response',`redo ${n}`,arg],['planning run',`atlas · ${t}`,'charged again with your notes'],['proposal',`${m}`,`${t} · this document`]],
            responses:[...X[422].responses, ['09-04 '+t,'operator','response',`redo ${n}: ${esc(arg)}`],['09-04 '+t,'planning','note','proposal rewritten with your notes'],['09-04 '+t,'plan','decision',`${m} created · replaces ${n}`]]};
          S.decisions.unshift({n:m, g:APPROVE, phase:'plan', kind:'proposal', title:'plan · atlas', tail:`planning ${t} · after your notes · <b>2 bolts</b> · 5 units · 4 dependencies`, proposal:true, answers:[['yes','yes'],['redo','redo:'],['drop','drop']]});
          since('proposed',`plan atlas · ${m}`,`replaces ${n}`,[m]); toast(`${m} arrived · planning's new proposal for atlas`);
          if(S.open==='pplanning'){ S.open = null; openDock(`d${m}`); } else { render(); if(!S.open) setFocus(`d${m}`); }
        }, 7000);
      } break;
    case 413: if(a==='yes'){ startUnit(bolt('plan-decisions'),'status-writer','default','spec'); }
      else if(a==='bolt'){ const b = S.bolts.find(x => x.name===arg); if(b) startUnit(b,'status-writer','default','spec'); }
      else if(a==='new bolt'){ startUnit(addBolt('b-'+arg, arg, 'atlas', 'new · 1 unit'),'status-writer','default','spec'); }
      else if(a==='drop') since('dropped','unit atlas · status-writer','',[413]); else since('redo','unit atlas · status-writer','back to planning with notes',[413]); break;
    case 414: if(a==='yes'||a==='rename'){ const nm = a==='rename' ? arg : d.bolt; startUnit(addBolt('b-retry', nm, 'atlas', 'new · type fast'),'retry-jitter','fast','spec'); }
      else if(a==='bolt'){ const b = S.bolts.find(x => x.name===arg); if(b) startUnit(b,'retry-jitter','fast','spec'); }
      else since('dropped','unit atlas · retry-jitter','',[414]); break;
    case 417: if(a==='yes'||a==='pick'){ const b = addBolt('b-baseline','baseline','new-repo', a==='yes' ? '8 chores · 3 units' : `pick ${arg}`); startUnit(b,'ci-gate','default','spec'); b.units.push({name:'as-built-record',state:'queued',type:'default',items:[]},{name:'claim-sweep',state:'queued',type:'fast',items:[]}); since('started','baseline new-repo', a==='yes' ? 'all' : `pick ${arg}`,[417]); }
      else since('later','baseline new-repo','standing without a decision',[417]); break;
    case 415: if(a==='no'){ since('dropped','chores atlas a b c','',[415]); }
      else { const letters = a==='yes' ? 'a b c' : arg; const b = addBolt('chores-atlas','chores','atlas','no bolt · one session each'); letters.split(' ').forEach(l => { const c = d.chores.find(x => x[0]===l); if(c) startUnit(b,'chore '+l+' · '+c[1],'chore','chore'); }); since('accepted','chores atlas '+letters,'',[415]); } break;
    case 416: { const b = bolt('plan-rows'); if(a==='yes'){ b.landing = 219; b.note = 'landing · PR #219 · checks running'; S.landed.unshift({id:'plan-rows', name:'plan-rows', repo:'switchboard', at:hhmm(S.minutes)+' today', pr:{n:219,state:'open'}, checks:[['lint','ok'],['tests','pend'],['map-check','pend'],['as-built','ok','4 statements']], envs:[['prod','https://switchboard.willdan.internal']], units:['rows-order','rows-sink','rows-window','rows-cursor'], signals:[], live:'PR open · checks running', leaves:'7d'}); since('landing','switchboard/plan-rows','PR #219 open · gates running',[416,'plan-rows']); setTimeout(() => { const l = S.landed.find(x => x.id==='plan-rows'); if(l){ l.pr.state='merged'; l.checks = l.checks.map(c => [c[0],'ok',c[2]]); l.live = null; since('landed','switchboard/plan-rows','gates green · place removed',[416,'plan-rows']); S.bolts = S.bolts.filter(x => x.id!=='plan-rows'); render(); } }, 5000); }
      else since('held','switchboard/plan-rows','bolt stays open',[416]); break; }
    case 420: { const b = bolt('plan-decisions'); if(a==='amend bolt'){ b.note = 're-spec on v4 · wi-#418, #419 back to spec'; b.units.find(u => u.name==='sink-delivery').items.forEach(i => { if(i.id==='wi418'||i.id==='wi419'){ i.state='starting'; i.label = i.label.replace(/build|spec/,'spec'); i.last = `${hhmm(S.minutes)} · returned to spec on one-writer v4`; } }); } else b.note = 'lands on v3 · follow-up unit queued for v4'; break; }
    case 421: { const it = bolt('plan-decisions')?.units.find(u => u.name==='sink-delivery')?.items.find(i => i.id==='wi418'); if(it){ it.state='working'; it.last = `${hhmm(S.minutes)} · answered: ${arg} · continuing`; } S.attention = S.attention.filter(x => x.id!=='host'); since('answered','wi-#418 build · plan-decisions','session continues',[421,'plan-decisions']); break; }
  }
}

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener('click', e => {
  const t = e.target;
  const inDock = !!t.closest('#dock');
  const b = t.closest('button');

  /* answer buttons, on a card or in the dock footer */
  if(b && b.dataset.a !== undefined){
    const n = +b.dataset.n, a = b.dataset.a, d = dec(n); if(!d) return;
    if(S.inflight[n]){ refuse(n); return; }
    if(needsArg(a)){ const box = b.closest('.acts').nextElementSibling; const open = box.dataset.arg===a; $$('.argbox').forEach(x => { x.innerHTML=''; delete x.dataset.arg; }); if(!open){ box.dataset.arg = a; box.innerHTML = argHtml(d, a); box.querySelector('input,textarea,select')?.focus(); } return; }
    send(n, a); return;
  }
  if(b && b.dataset.send){ const n = +b.dataset.n, a = b.dataset.send, box = b.closest('.argbox');
    let arg = '';
    if(a==='pick'){ arg = $$('input:checked', box).map(i => i.value).join(' '); if(!arg){ toast('pick at least one', true); return; } }
    else { const f = box.querySelector('input,textarea,select'); arg = f.value.trim(); if(!arg){ f.focus(); return; } }
    box.innerHTML=''; delete box.dataset.arg; send(n, a, arg); return; }
  if(b && b.dataset.cancel){ const box = b.closest('.argbox'); box.innerHTML=''; delete box.dataset.arg; return; }

  /* attention · one-word answers, outside the count */
  if(b && b.dataset.att){ const a = S.attention.find(x => x.id===b.dataset.att); S.attention = S.attention.filter(x => x!==a);
    if(b.dataset.ak==='ok'){ toast('seen · not logged'); } else { logLine(b.dataset.ak, {}); toast(`${b.dataset.ak} · recorded`); if(b.dataset.ak==='takeover'){ const it = bolt('plan-decisions')?.units.find(u=>u.name==='sink-delivery')?.items.find(i=>i.id==='wi418'); if(it){ it.host='studio'; it.last=`${hhmm(S.minutes)} · taken over on studio · place restored`; } } }
    render(); return; }

  /* services · dictation */
  if(b && b.dataset.svc !== undefined){ const key = b.dataset.svc, i = +b.dataset.i; const tgt = navTarget(key); let list, place;
    if(tgt.type==='bolt'){ list = tgt.obj.services; place = tgt.obj.name; } else { const x = X[tgt.obj.n]; const sv = typeof x.services==='function' ? x.services() : x.services; list = sv.list; place = sv.place; }
    const v = list[i]; v.s = v.s==='running' ? 'stopped' : 'starting';
    say(`${v.s==='stopped'?'stop':'start'} ${v.n} @ ${place}`); render();
    if(v.s==='starting') setTimeout(() => { v.s='running'; render(); }, 1500); return; }

  /* proposal editor */
  if(b && b.dataset.urename !== undefined){ const u = S.proposal.units.find(x => x.id===b.dataset.urename); const cur = propUnitState(u).name; const nm = prompt('rename unit '+u.id, cur); if(nm && nm!==u.name){ (S.proposal.edits[u.id] ||= {}).name = nm; } else if(nm===u.name && S.proposal.edits[u.id]){ delete S.proposal.edits[u.id].name; if(!Object.keys(S.proposal.edits[u.id]).length) delete S.proposal.edits[u.id]; } render(); return; }
  if(b && b.dataset.udrop !== undefined){ const id = b.dataset.udrop; S.proposal.refuse = null; if(propUnitState(punit(id)).drop) tryRestore(id); else tryDrop(id); render(); return; }
  if(b && b.dataset.ureset !== undefined){ delete S.proposal.edits[b.dataset.ureset]; S.proposal.refuse = null; render(); return; }
  if(b && b.dataset.rok){ applyRefusal(); render(); return; }
  if(b && b.dataset.rcancel){ S.proposal.refuse = null; render(); return; }
  if(b && b.dataset.wrongsend){ const n = +b.dataset.wrongsend; const ta = b.closest('.wrong').querySelector('textarea'); const v = ta.value.trim(); if(!v){ ta.focus(); return; } send(n, 'redo', v); return; }
  if(b && b.dataset.an !== undefined){ const d = dec(+S.open.slice(1)); if(!d) return; const box = $('#dk-f .argbox'); $$('.argbox').forEach(x => { x.innerHTML=''; delete x.dataset.arg; }); box.dataset.arg='redo'; box.innerHTML = argHtml(d,'redo'); const ta = box.querySelector('textarea'); ta.value = `[${b.dataset.an}] `; ta.focus(); return; }

  /* dock chrome */
  if(b && b.id==='dk-x'){ closeDock(); return; }
  if(b && b.dataset.navStep){ step(+b.dataset.navStep); return; }
  if(b && b.dataset.open){ openDock(b.dataset.open); return; }
  if(b && b.id==='yesall'){ yesAll(); return; }
  if(b && b.id==='logbtn'){ const l = $('#log'); l.hidden = !l.hidden; b.setAttribute('aria-expanded', String(!l.hidden)); return; }
  if(b && b.id==='capture-send'){ capture(); return; }
  if(t.closest('label.chore')){ setTimeout(() => $$('label.chore').forEach(l => l.classList.toggle('on', l.querySelector('input').checked)), 0); return; }

  /* a card, a bolt header, an intent row, a landed bolt */
  const nav = t.closest('[data-nav]');
  if(nav && !t.closest('input,textarea,select,.argbox,.chores')){
    const key = navKey(nav);
    if(e.detail===2 || S.open){ openDock(key); } else setFocus(key, false);
    return;
  }
  /* outside the dock closes it; the log closes on any outside click */
  if(!inDock && S.open && !t.closest('#log,#logbtn')) closeDock();
  if(!t.closest('#log,#logbtn') && !$('#log').hidden){ $('#log').hidden = true; $('#logbtn').setAttribute('aria-expanded','false'); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.ubolt){ const id = t.dataset.ubolt; S.proposal.refuse = null; const ok = tryMove(id, t.value); render(); if(ok && t.value==='__new') $(`[data-newbolt="${id}"]`)?.focus(); }
  if(t.dataset.utype){ const id = t.dataset.utype, u = S.proposal.units.find(x => x.id===id); const e2 = (S.proposal.edits[id] ||= {}); if(t.value===u.type) delete e2.type; else e2.type = t.value; if(!Object.keys(e2).length) delete S.proposal.edits[id]; render(); }
  if(t.dataset.bname){ const b = S.proposal.bolts.find(x => x.id===t.dataset.bname); const v = t.value.trim(); if(v && v!==b.name) S.proposal.boltNames[b.id] = v; else delete S.proposal.boltNames[b.id]; render(); }
  if(t.dataset.newbolt){ const id = t.dataset.newbolt; const comp = [id, ...dependents(id), ...dependencies(id)].filter(o => propUnitState(punit(o)).bolt==='__new'); comp.forEach(o => setEdit(o,'newBolt',t.value.trim()||undefined)); render(); }
});
document.addEventListener('input', e => { if(e.target.id==='capture') captureAs(); });
document.addEventListener('keydown', e => {
  const typing = e.target.matches('input,textarea,select');
  if(e.key==='Escape'){
    if(typing){ e.target.blur(); const box = e.target.closest('.argbox'); if(box){ box.innerHTML=''; delete box.dataset.arg; } return; }
    if(!$('#log').hidden){ $('#log').hidden = true; return; }
    if(S.open) closeDock(); return;
  }
  if(typing){ if(e.key==='Enter' && !e.shiftKey && e.target.id==='capture'){ e.preventDefault(); capture(); } if(e.key==='Enter' && e.target.matches('input') && e.target.closest('.argbox')){ e.target.closest('.argbox').querySelector('[data-send]').click(); } return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k = e.key;
  if(k==='j'||k==='ArrowDown'){ e.preventDefault(); stepV(1); return; }
  if(k==='k'||k==='ArrowUp'){ e.preventDefault(); stepV(-1); return; }
  if(k==='h'||k==='ArrowLeft'){ e.preventDefault(); stepH(-1); return; }
  if(k==='ArrowRight'){ e.preventDefault(); stepH(1); return; }
  if(k==='Enter'||k==='o'){ if(S.focus){ e.preventDefault(); openDock(S.focus); } return; }
  if(k==='y'||k==='n'||k==='l'){
    const d = S.focus && S.focus[0]==='d' ? dec(+S.focus.slice(1)) : null;
    const a = d && d.answers.map(x => x[0]).find(x => KEYS[x]===k);
    if(!a){ if(k==='l'){ e.preventDefault(); stepH(1); return; } if(d) toast(`${d.n} · no "${k}" answer on this card · ${d.answers.map(x=>x[0]).join(' · ')}`, true); return; }
    e.preventDefault(); send(d.n, a); return;
  }
  if(k==='/' ){ e.preventDefault(); $('#capture')?.focus(); }
});

/* yes all · one response per APPROVE decision, in order */
function yesAll(){
  const list = S.decisions.filter(d => d.g===APPROVE && !S.inflight[d.n]).map(d => d.n).sort((a,b) => a-b);
  if(!list.length) return;
  list.forEach((n, i) => setTimeout(() => send(n, 'yes'), i*380));
}

/* capture · typed text is a capture with one signal, or a dictation by prefix */
function classify(v){
  let m;
  if((m = v.match(/^intent:\s*(.+)/i))) return {kind:'intent', text:m[1]};
  if((m = v.match(/^chore\s+([\w-]+):\s*(.+)/i))) return {kind:'chore', repo:m[1], text:m[2]};
  if((m = v.match(/^bolt\s+([\w-]+):\s*(.+)/i))) return {kind:'bolt', bolt:m[1], text:m[2]};
  return {kind:'capture', text:v};
}
function captureAs(){
  const v = $('#capture').value.trim(); const c = classify(v); const as = $('#capture-as');
  as.innerHTML = c.kind==='capture' ? 'sends as <b>capture</b> · 1 signal · kind ask · curation sees it'
    : c.kind==='intent' ? 'sends as <b>dictation</b> · opens intent <span class="mono">'+esc(slug(c.text))+'</span> · no decision'
    : c.kind==='chore' ? 'sends as <b>dictation</b> · proposes a chore on <span class="mono">'+esc(c.repo)+'</span>'
    : 'sends as <b>dictation</b> · proposes a unit on bolt <span class="mono">'+esc(c.bolt)+'</span>' + (S.bolts.some(b => b.name===c.bolt) ? '' : ' · <span style="color:var(--drop)">no open bolt by that name</span>');
}
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').split('-').slice(0,4).join('-');
function capture(){
  const ta = $('#capture'); const v = ta.value.trim(); if(!v){ ta.focus(); return; }
  const c = classify(v);
  if(c.kind==='capture'){ S.curation.unmoved++; S.curation.by = S.curation.by.replace(/page \d+/, m => 'page '+(+m.split(' ')[1]+1)) + (/page/.test(S.curation.by)?'':' · page 1'); logLine(`capture: ${v}`, {say:true}); toast('capture · 1 signal (ask) · curation sees it'); }
  else if(c.kind==='intent'){ const id = slug(c.text); S.intents.unshift({id, name:id, state:'open', note:'dictated · elaborations to come from planning', sessions:[]}); logLine(`intent: ${c.text}`, {say:true}); toast(`intent ${id} · opened`); }
  else if(c.kind==='chore'){ logLine(`chore ${c.repo}: ${c.text}`, {say:true}); toast(`chore on ${c.repo} · applied`); const b = addBolt('chores-'+c.repo,'chores',c.repo,'no bolt · one session each'); startUnit(b, 'chore · '+c.text.slice(0,28), 'chore', 'chore'); }
  else { const b = S.bolts.find(x => x.name===c.bolt); if(!b){ toast(`no open bolt "${c.bolt}"`, true); return; } logLine(`bolt ${c.bolt}: ${c.text}`, {say:true}); toast(`unit on ${c.bolt} · applied`); startUnit(b, slug(c.text), 'default', 'spec'); }
  ta.value=''; render(); captureAs();
}

/* ---------- first frame: the board, the proposal open in the dock ----------
   ?theme=dark forces the dark palette; ?nodock starts with the dock closed; ?open=<nav key> picks the object. */

if(Q.get('theme')) document.documentElement.dataset.theme = Q.get('theme');
render();
if(Q.has('nodock')) setFocus('d422', false); else openDock(Q.get('open') || 'd422');
})();
